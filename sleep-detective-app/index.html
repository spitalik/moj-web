      " Dáta sú len v tomto zariadení. Keď sa stratí alebo sa vymažú údaje prehliadača, záloha je jediná cesta späť.</p>" +
      '<div class="row"><button class="btn" data-act="export" type="button" style="flex:1">Stiahnuť zálohu</button><button class="btn ghost" data-act="backupLater" type="button">Neskôr</button></div></div>';
  }
  function download(blob, name) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  // V natívnej appke sa <a download> nedá použiť: súbor sa zapíše do súkromnej cache appky
  // a otvorí sa systémové Zdieľať (uložiť do Súborov, poslať lekárovi...). Cache sa maže pri štarte.
  const EXPORT_DIR = "export";
  async function saveFile(blob, name) {
    const FS = plugin("Filesystem"), SH = plugin("Share");
    if (!FS || !SH) { download(blob, name); return true; }
    try {
      // Filesystem chce base64; po kúskoch, aby veľká nahrávka nepretiekla zásobník
      const bytes = new Uint8Array(await blob.arrayBuffer());
      let bin = "";
      for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      const data = btoa(bin);
      const f = await FS.writeFile({ path: EXPORT_DIR + "/" + name, data, directory: "CACHE", recursive: true });
      await SH.share({ title: name, files: [f.uri] });
      return true;
    } catch (e) {
      if (!/cancel/i.test(String(e && (e.message || e)))) toast("Súbor sa nepodarilo uložiť ani zdieľať.");
      return false;
    }
  }
  function clearExports() {
    const FS = plugin("Filesystem");
    if (FS) FS.rmdir({ path: EXPORT_DIR, directory: "CACHE", recursive: true }).catch(() => { /* priečinok nie je */ });
  }

  // Tabuľka pre Excel: jeden riadok na ráno, oddeľovač „;“ a desatinná čiarka (slovenské nastavenie).
  function csvText() {
    const wt = Object.fromEntries(D.body.weights.map(w => [w.date, w.kg]));
    const dates = new Set(D.nights.map(n => n.date).concat(Object.keys(D.sounds), Object.keys(D.evenings).map(d => addDays(d, 1)), Object.keys(wt)));
    const num = v => v == null || v === "" ? "" : String(v).replace(".", ",");
    const cell = v => { v = String(v); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    const rows = [["Ráno", "Kvalita (1-5)", "Spánok (h)", "Zaspávanie (min)", "Prebudenia", "Energia (1-5)", "Večer pred tým", "Teplota v spálni (°C)", "Chrápanie (min)", "Zvuky (počet)", "Hmotnosť (kg)"]];
    [...dates].sort().forEach(d => {
      const n = D.nights.find(x => x.date === d) || {}, ev = D.evenings[addDays(d, -1)], s = D.sounds[d];
      rows.push([d, num(n.quality), num(n.duration), num(n.latency), num(n.wakes), num(n.energy),
        ev ? FACTORS.filter(F => ev.f[F.k]).map(F => F.name).join(", ") || "nič zvláštne" : "",
        ev && ev.temp ? num(ev.temp) : "", s ? num(s.snoreMin) : "", s ? num(s.noise) : "", wt[d] != null ? num(wt[d]) : ""]);
    });
    return String.fromCharCode(0xfeff) + rows.map(r => r.map(cell).join(";")).join("\r\n") + "\r\n";
  }
  function exportCsv() {
    saveFile(new Blob([csvText()], { type: "text/csv;charset=utf-8" }), "sleep-detective-" + today() + ".csv")
      .then(ok => { if (ok && !NATIVE) toast("Tabuľka CSV je stiahnutá."); });
  }

  const repDays = () => [14, 30, 90].includes(UI.repDays) ? UI.repDays : 30;
  function reportHtml(days) {
    const to = today(), from = addDays(to, -days + 1);
    const nights = D.nights.filter(n => n.date >= from && n.date <= to);
    const sk = Object.keys(D.sounds).filter(k => k >= from && k <= to && !D.sounds[k].partial).sort();
    const evs = Object.keys(D.evenings).filter(d => d >= addDays(from, -1) && d < to && D.evenings[d].saved);
    const avg = (key, f) => nights.length ? f(mean(nights.map(n => n[key]))) : "–";
    let h = '<div class="rep"><h1>Sleep Detective – prehľad spánku</h1>' +
      "<p>Obdobie: " + fullDate(from) + " – " + fullDate(to) + " (" + days + " dní). Vytvorené " + fullDate(to) + ".</p>";
    if (!nights.length && !sk.length) return h + "<p>V tomto období nie sú žiadne záznamy.</p></div>";
    h += "<h2>Spánok podľa ranných záznamov</h2><table><tbody>" +
      "<tr><th>Počet rán so záznamom</th><td>" + nights.length + "</td></tr>" +
      "<tr><th>Kvalita spánku (1–5)</th><td>" + avg("quality", dec) + "</td></tr>" +
      "<tr><th>Dĺžka spánku</th><td>" + avg("duration", v => hmShort(v) + " h") + "</td></tr>" +
      "<tr><th>Zaspávanie</th><td>" + avg("latency", v => Math.round(v) + " min") + "</td></tr>" +
      "<tr><th>Prebudenia za noc</th><td>" + avg("wakes", dec) + "</td></tr>" +
      "<tr><th>Energia ráno (1–5)</th><td>" + avg("energy", dec) + "</td></tr></tbody></table>";
    if (sk.length) {
      const sn = sk.map(k => D.sounds[k].snoreMin || 0);
      h += "<h2>Chrápanie podľa nočného záznamu</h2><table><tbody>" +
        "<tr><th>Nocí so záznamom zvuku</th><td>" + sk.length + "</td></tr>" +
        "<tr><th>Chrápanie priemerne za noc</th><td>" + Math.round(mean(sn)) + " min</td></tr>" +
        "<tr><th>Nocí s chrápaním 30 min a viac</th><td>" + sn.filter(v => v >= 30).length + "</td></tr>" +
        "<tr><th>Najviac za jednu noc</th><td>" + Math.max(...sn) + " min</td></tr>" +
        "<tr><th>Iné zvuky priemerne za noc</th><td>" + dec(mean(sk.map(k => D.sounds[k].noise || 0))) + "</td></tr></tbody></table>";
    }
    const bi = bodyInfo();
    if (bi) {
      h += "<h2>Telesné údaje</h2><table><tbody>" +
        (bi.age !== null ? "<tr><th>Vek (podľa roku narodenia)</th><td>" + bi.age + " rokov</td></tr>" : "") +
        (bi.sex ? "<tr><th>Pohlavie</th><td>" + SEX_LABEL[bi.sex] + "</td></tr>" : "") +
        "<tr><th>Výška</th><td>" + bi.height + " cm</td></tr>" +
        "<tr><th>Hmotnosť (" + fullDate(bi.date) + ")</th><td>" + kg(bi.kg) + "</td></tr>" +
        "<tr><th>BMI</th><td>" + dec(bi.bmi) + (bi.child ? " (do 18 rokov sa hodnotí podľa rastových grafov)" : " (" + bi.cat + ")") + "</td></tr>" +
        (bi.child ? "" : "<tr><th>Optimálna hmotnosť (" + bmiRange(bi) + ")</th><td>" + Math.round(bi.lo) + "–" + Math.round(bi.hi) + " kg</td></tr>") +
        (bi.risks && bi.risks.length ? "<tr><th>Rizikové faktory apnoe (STOP-BANG)</th><td>" + bi.risks.join(", ") + "</td></tr>" : "");
      const W = D.body.weights.filter(w => w.date >= from);
      if (W.length >= 2) h += "<tr><th>Zmena za obdobie</th><td>" + (W[W.length - 1].kg - W[0].kg > 0 ? "+" : "") + kg(W[W.length - 1].kg - W[0].kg) + "</td></tr>";
      h += "</tbody></table>";
    }
    if (evs.length) {
      const counts = FACTORS.map(F => ({ F, n: evs.filter(d => D.evenings[d].f[F.k]).length })).filter(c => c.n);
      h += "<h2>Večerné faktory (" + evs.length + " " + (evs.length === 1 ? "večer" : evs.length <= 4 ? "večery" : "večerov") + ")</h2>" +
        (counts.length ? "<p>" + counts.map(c => c.F.name + ": " + c.n + "×").join(", ") + ".</p>" : "<p>Žiadny zo sledovaných faktorov.</p>");
    }
    if (D.closed.length) h += "<h2>Uzavreté experimenty</h2><ul>" + D.closed.slice(0, 8).map(c => "<li>" + c.name + " (" + c.when + "): " + c.label + ".</li>").join("") + "</ul>";
    const dates = [...new Set(nights.map(n => n.date).concat(sk))].sort();
    h += '<h2>Noc po noci</h2><div class="rep-wide"><table><thead><tr><th>Ráno</th><th>Kvalita</th><th>Spánok</th><th>Zaspávanie</th><th>Prebudenia</th><th>Energia</th><th>Chrápanie</th><th>Zvuky</th></tr></thead><tbody>' +
      dates.map(d => {
        const n = D.nights.find(x => x.date === d), s = D.sounds[d];
        return "<tr><td>" + short(d) + "</td><td>" + (n ? n.quality : "") + "</td><td>" + (n ? hmShort(n.duration) : "") + "</td><td>" + (n ? n.latency + " min" : "") +
          "</td><td>" + (n ? n.wakes : "") + "</td><td>" + (n ? n.energy : "") + "</td><td>" + (s ? s.snoreMin + " min" : "") + "</td><td>" + (s ? s.noise : "") + "</td></tr>";
      }).join("") + "</tbody></table></div>";
    return h + '<p class="rep-note">Ranné údaje zadával používateľ sám a sú približné (dĺžka spánku a zaspávanie v rozpätiach). Chrápanie odhaduje telefón podľa hĺbky a rytmu zvuku. ' +
      "Nejde o lekárske meranie ani diagnózu. Sleep Detective nie je zdravotnícka pomôcka.</p></div>";
  }
  function openReport() {
    const days = repDays();
    let h = sheetTop("Pre lekára", "×") + '<div class="scroll">';
    h += '<div class="head"><h2>Prehľad pre lekára</h2><p class="small muted">Zhrnutie spánku a chrápania na vytlačenie alebo uloženie ako PDF. Vytvorí sa v zariadení, nikam sa neposiela.</p></div>';
    h += '<div class="seg" role="group" aria-label="Obdobie" style="--n:3">' + [14, 30, 90].map(d => '<button type="button" data-repdays="' + d + '" aria-pressed="' + (d === days) + '">' + d + " dní</button>").join("") + "</div>";
    h += '<div class="card">' + reportHtml(days) + "</div>";
    h += '<button class="btn" data-act="printReport" type="button">' + (NATIVE ? "Zdieľať prehľad" : "Vytlačiť / uložiť PDF") + "</button>";
    if (NATIVE) h += '<p class="small muted">Prehľad sa uloží ako stránka HTML. Otvoríš ju v prehliadači, odkiaľ sa dá vytlačiť alebo uložiť ako PDF, alebo ju rovno pošleš.</p>';
    h += '<button class="btn ghost" data-act="exportCsv" type="button">Stiahnuť tabuľku (CSV)</button></div>';
    showSheet(h);
  }
  // Samostatná stránka s prehľadom (natívna appka nemá window.print): biely papier, systémové písmo.
  function reportDoc() {
    return '<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">' +
      "<title>Sleep Detective – prehľad spánku</title><style>" +
      "body{font:15px/1.45 system-ui,sans-serif;color:#000;background:#fff;margin:0 auto;max-width:760px;padding:16px}" +
      "h1{font-size:22px;margin:0 0 6px}h2{font-size:17px;margin:18px 0 6px}p{margin:4px 0}" +
      "table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}th,td{text-align:left;padding:4px 6px;border-bottom:1px solid #999;vertical-align:top}" +
      "th{font-weight:500;color:#333}.rep-wide{overflow-x:auto}.rep-wide td,.rep-wide th{white-space:nowrap}.rep-note{color:#333;font-size:13px;margin-top:14px}" +
      "@media print{@page{margin:14mm}body{padding:0}}</style></head><body>" + reportHtml(repDays()) + "</body></html>";
  }
  function printReport() {
    if (NATIVE) { saveFile(new Blob([reportDoc()], { type: "text/html" }), "sleep-detective-prehlad-" + today() + ".html"); return; }
    const el = $("#print");
    if (!el) return;
    el.innerHTML = reportHtml(repDays());
    if (typeof window.print === "function") window.print();
  }

  // ---------- Hmotnosť ----------
  // Telesné údaje (nepovinné): výška, história hmotnosti, rok narodenia a pohlavie.
  // Optimálne rozmedzie: dospelí BMI 18,5–24,9 (WHO); od 65 rokov BMI 22–27, pri ktorom majú starší ľudia
  // najlepšie výsledky. Do 18 rokov sa BMI dospelých nepoužíva (rastové grafy podľa veku a pohlavia).
  // Pohlavie: orientačný cieľ v rámci rozmedzia (vzorec ideálnej hmotnosti podľa Devina pre mužov a ženy)
  // a rizikové faktory spánkového apnoe (mužské pohlavie, vek nad 50, BMI nad 35 – ako v dotazníku STOP-BANG).
  const numIn = v => { const s = String(v).trim().replace(",", "."); return /^\d+(\.\d+)?$/.test(s) ? Number(s) : null; };
  const okHeight = v => v !== null && v >= 120 && v <= 230;
  const okWeight = v => v !== null && v >= 30 && v <= 300;
  const thisYear = () => new Date().getFullYear();
  const okBirth = v => v !== null && Number.isInteger(v) && v >= 1900 && v <= thisYear();
  const SEX_LABEL = { f: "žena", m: "muž" };
  function cleanBody(b) {
    b = b && typeof b === "object" ? b : {};
    const height = okHeight(Number(b.height)) ? Math.round(Number(b.height)) : null;
    const weights = (Array.isArray(b.weights) ? b.weights : [])
      .filter(w => w && /^\d{4}-\d\d-\d\d$/.test(w.date) && okWeight(Number(w.kg)))
      .map(w => ({ date: w.date, kg: Math.round(Number(w.kg) * 10) / 10 }))
      .sort((a, c) => a.date < c.date ? -1 : a.date > c.date ? 1 : 0)
      .filter((w, i, a) => i === a.length - 1 || a[i + 1].date !== w.date);
    const birthYear = okBirth(Number(b.birthYear)) ? Number(b.birthYear) : null;
    const sex = b.sex === "f" || b.sex === "m" ? b.sex : null;
    return { height, weights, birthYear, sex };
  }
  const bodyAge = () => D.body && D.body.birthYear ? thisYear() - D.body.birthYear : null;   // ±1 rok, stačí
  function bodyInfo() {
    const b = D.body, w = b && b.weights[b.weights.length - 1];
    if (!b || !b.height || !w) return null;
    const age = bodyAge(), sex = b.sex;
    const m2 = (b.height / 100) * (b.height / 100);
    const bmi = w.kg / m2;
    const base = { height: b.height, kg: w.kg, date: w.date, bmi, age, sex };
    if (age !== null && age < 18) return Object.assign(base, { child: true });
    const senior = age !== null && age >= 65;
    const bLo = senior ? 22 : 18.5, bHi = senior ? 27 : 24.9;
    const lo = bLo * m2, hi = bHi * m2;
    const cat = bmi < bLo ? (senior ? "nízka hmotnosť" : "podváha") : bmi <= bHi || (!senior && bmi < 25) ? "optimálna hmotnosť" : bmi < 30 ? "nadváha" : "obezita";
    // orientačný cieľ: ideálna hmotnosť pre pohlavie a výšku, ale vždy v optimálnom rozmedzí
    const ibw = sex && b.height > 152.4 ? (sex === "m" ? 50 : 45.5) + 0.906 * (b.height - 152.4) : null;
    const target = ibw === null ? null : clamp(ibw, lo, hi);
    const risks = [];
    if (sex === "m") risks.push("mužské pohlavie");
    if (age !== null && age > 50) risks.push("vek nad 50 rokov");
    if (bmi > 35) risks.push("BMI nad 35");
    return Object.assign(base, { senior, bLo, bHi, lo, hi, cat, target, risks,
      over: w.kg > hi ? w.kg - hi : 0, under: w.kg < lo ? lo - w.kg : 0, heavy: senior ? bmi > 27 : bmi >= 25 });
  }
  const kg = v => dec(v).replace(",0", "") + " kg";
  const bmiRange = i => "BMI " + dec(i.bLo).replace(",0", "") + "–" + dec(i.bHi).replace(",0", "");
  function bodyLine() {
    const i = bodyInfo();
    if (!i) return "Zadaj výšku aj hmotnosť a appka vypočíta tvoju optimálnu hmotnosť.";
    if (i.child) return "Do 18 rokov sa hmotnosť nehodnotí podľa BMI dospelých, ale podľa rastových grafov pre vek a pohlavie. Appka ju preto nehodnotí – pri pochybnostiach sa poraď s pediatrom.";
    const who = (i.sex ? SEX_LABEL[i.sex] : "") + (i.age !== null ? (i.sex ? ", " : "") + i.age + " r." : "");
    return "BMI " + dec(i.bmi) + " – " + i.cat + ". Optimálna hmotnosť pre výšku " + i.height + " cm" + (who ? " (" + who + ")" : "") + " je " + Math.round(i.lo) + "–" + Math.round(i.hi) + " kg" +
      (i.over ? ", teraz máš o " + kg(i.over) + " viac." : i.under ? ", teraz máš o " + kg(i.under) + " menej." : ".") +
      (i.target !== null ? " Orientačný cieľ: " + Math.round(i.target) + " kg." : "");
  }
  function bodyNote(i) {
    const parts = [];
    if (i.senior) parts.push("Od 65 rokov sa za optimálne považuje vyššie rozmedzie BMI 22–27 – mierna rezerva hmotnosti v staršom veku chráni.");
    if (i.target !== null) parts.push("Orientačný cieľ vychádza zo vzorca ideálnej hmotnosti pre " + (i.sex === "m" ? "mužov" : "ženy") + " a vždy leží v optimálnom rozmedzí.");
    if (i.age === null || !i.sex) parts.push("Zadaj v nastaveniach aj " + (i.age === null && !i.sex ? "rok narodenia a pohlavie" : i.age === null ? "rok narodenia" : "pohlavie") + ", výpočet bude presnejší.");
    parts.push("BMI je orientačné a nezohľadňuje množstvo svalov. Nie je to lekárske hodnotenie.");
    return parts.join(" ");
  }
  function bodyCard() {
    const b = D.body, w = b.weights[b.weights.length - 1];
    const field = (id, label, val, mode, max) => '<label class="small" for="' + id + '">' + label +
      '<input id="' + id + '" type="text" inputmode="' + mode + '" autocomplete="off" maxlength="' + max + '" value="' + esc(val == null ? "" : String(val).replace(".", ",")) + '"></label>';
    const sexBtn = (v, l) => '<button type="button" data-sex="' + v + '" aria-pressed="' + ((b.sex || "") === v) + '">' + l + "</button>";
    return '<div class="card"><span class="set-label">Telesné údaje</span>' +
      '<p class="small muted">Nepovinné. Appka z nich vypočíta optimálnu hmotnosť podľa výšky, veku a pohlavia a zohľadní ju pri hodnotení chrápania a v odporúčaniach. Zmenu hmotnosti zapíš kedykoľvek – appka si pamätá jej vývoj.</p>' +
      '<div class="num-row">' + field("set-height", "Výška (cm)", b.height, "decimal", 5) + field("set-weight", "Hmotnosť (kg)", w ? w.kg : null, "decimal", 5) + "</div>" +
      '<div class="num-row">' + field("set-birth", "Rok narodenia", b.birthYear, "numeric", 4) + "<span></span></div>" +
      '<span class="small">Pohlavie</span><div class="seg" role="group" aria-label="Pohlavie" style="--n:3">' + sexBtn("f", "Žena") + sexBtn("m", "Muž") + sexBtn("", "Neuvádzam") + "</div>" +
      '<p class="small num-err" id="err-body" role="alert" hidden></p>' +
      '<p class="small" id="body-sum">' + bodyLine() + "</p>" +
      (w ? '<p class="small muted">Hmotnosť zapísaná ' + fullDate(w.date) + (b.weights.length > 1 ? ", záznamov hmotnosti: " + b.weights.length : "") + ".</p>" : "") +
      (b.height || w || b.birthYear || b.sex ? '<button class="btn ghost" data-act="askDelBody" type="button">Vymazať telesné údaje</button>' : "") + "</div>";
  }
  const BODY_ERR = {
    "set-height": "Výška musí byť číslo od 120 do 230 cm.",
    "set-weight": "Hmotnosť musí byť číslo od 30 do 300 kg.",
    "set-birth": "Rok narodenia zadaj ako štvorciferné číslo, napríklad 1980."
  };
  function setBody(input) {
    const v = numIn(input.value), id = input.id, empty = input.value.trim() === "";
    const ok = empty || (id === "set-height" ? okHeight(v) : id === "set-weight" ? okWeight(v) : okBirth(v));
    input.setAttribute("aria-invalid", ok ? "false" : "true");
    const err = $("#err-body");
    if (err) { err.textContent = ok ? "" : BODY_ERR[id]; err.hidden = ok; }
    if (!ok) return;
    if (id === "set-birth") D.body.birthYear = empty ? null : v;   // rok narodenia sa dá aj zmazať
    else if (empty) return;
    else if (id === "set-height") D.body.height = Math.round(v);
    else {
      const t = today();
      D.body.weights = D.body.weights.filter(w => w.date !== t).concat({ date: t, kg: Math.round(v * 10) / 10 });
    }
    D.body = cleanBody(D.body);
    save();
    const sum = $("#body-sum");
    if (sum) sum.textContent = bodyLine();
  }

  // Hodnotenie hmotnosti v spise: súvis s chrápaním a odporúčania.
  function snoreStats(from, to) {
    const ks = Object.keys(D.sounds).filter(k => k >= from && (!to || k < to) && !D.sounds[k].partial);
    return { n: ks.length, avg: mean(ks.map(k => D.sounds[k].snoreMin || 0)), heavy: ks.filter(k => D.sounds[k].snoreMin >= 30).length };
  }
  function weightCard() {
    const i = bodyInfo();
    let h = '<div class="card"><div class="eyebrow">Hmotnosť a spánok</div>';
    if (!i) {
      return h + '<p class="small muted">Zadaj výšku, hmotnosť, vek a pohlavie. Appka vypočíta optimálnu hmotnosť a zohľadní ju pri chrápaní a v odporúčaniach.</p>' +
        '<button class="link" data-act="settingsBody" type="button">Zadať telesné údaje →</button></div>';
    }
    h += "<p>" + bodyLine() + "</p>";
    if (i.child) return h + "</div>";
    const s = snoreStats(addDays(today(), -30));
    const regular = s.heavy >= 3, nights = D.nights.slice(-14);
    const tired = nights.length >= 5 && mean(nights.map(n => n.energy)) <= 2.5;
    const tips = [];
    if (i.heavy) {
      const a = Math.max(1, Math.round(i.kg * 0.05)), b = Math.round(i.kg * 0.1);
      const loss = "Úbytok 5–10 % hmotnosti (" + a + "–" + b + " kg) chrápanie často zmierni" + (i.target !== null ? ", dlhodobý cieľ je okolo " + Math.round(i.target) + " kg." : ".");
      if (regular) tips.push("Chrápeš pravidelne (" + s.heavy + " " + nightsWord(s.heavy) + " s 30+ min za posledný mesiac). Pri nadváhe sa tuk ukladá aj okolo krku a zužuje dýchacie cesty. " + loss);
      else if (s.n >= 3 && s.avg >= SNORE_NIGHT) tips.push("Chrápeš v priemere " + Math.round(s.avg) + " min za noc. Pri nadváhe sa tuk ukladá aj okolo krku a zužuje dýchacie cesty. " + loss);
      else if (s.n >= 3) tips.push("Chrápanie ťa zatiaľ výrazne netrápi (v priemere " + Math.round(s.avg) + " min za noc). Nadváha však zvyšuje riziko chrápania aj spánkového apnoe, preto sa oplatí ju postupne znižovať.");
      else tips.push("Nadváha je jedna z najčastejších príčin chrápania. Zapni na pár nocí nočný záznam a uvidíš, či sa ťa to týka.");
      const list = analyzable(), ranked = list.length >= MIN_NIGHTS ? analyze(list) : [];
      const flagged = ["alcohol", "lateMeal"].filter(k => (D.verdicts[k] && D.verdicts[k].confirmed) ||
        ranked.some(r => r.F.k === k && (r.status === "prime" || r.status === "suspect")));
      tips.push(flagged.length
        ? FACTORS.filter(F => flagged.includes(F.k)).map(F => F.name.toLowerCase()).join(" a ").replace(/^./, c => c.toUpperCase()) + " ti podľa spisu kazí spánok – pri nadváhe zhoršuje aj chrápanie. Je to dobré miesto, kde začať."
        : "Alkohol a ťažké jedlo neskoro večer chrápanie pri nadváhe zhoršujú. Spánok na boku namiesto chrbta tiež pomáha.");
    } else if (i.under) {
      tips.push(i.senior
        ? "V tvojom veku je hmotnosť pod BMI 22 už nízka. Úbytok hmotnosti a svalov v staršom veku je dobré prebrať s lekárom."
        : "Máš podváhu. Na spánok nemusí mať priamy vplyv, ale je dobré ju prebrať s lekárom, najmä ak ťa cez deň premáha únava.");
    } else {
      tips.push("Hmotnosť máš v optimálnom rozmedzí. Príčinu chrápania alebo zlého spánku treba hľadať inde – pozri podozrivých vyššie.");
    }
    // ženy po 50: po menopauze sa chrápanie a apnoe objavujú častejšie aj pri bežnej hmotnosti
    if (i.sex === "f" && i.age !== null && i.age >= 50 && (regular || s.avg >= SNORE_NIGHT)) {
      tips.push("U žien po 50 sa chrápanie a spánkové apnoe objavujú častejšie (hormonálne zmeny po menopauze), aj keď hmotnosť nie je vysoká.");
    }
    // spánkové apnoe: chrápanie alebo únava + obezita, alebo nadváha s ďalšími rizikovými faktormi
    const apnea = (regular || tired) && (i.bmi >= 30 || (i.heavy && i.risks.length >= 2));
    if (apnea) {
      const why = [i.bmi >= 30 ? "obezita" : "nadváha"].concat(i.risks.filter(r => r !== "BMI nad 35"), regular ? ["pravidelné chrápanie"] : [], tired ? ["denná únava"] : []);
      tips.push('<span class="t-lamp">Spolu je tu viac rizikových faktorov spánkového apnoe (' + why.join(", ") + "). To je dôvod poradiť sa s lekárom. Ukáž mu Prehľad pre lekára.</span>");
    }
    h += '<ul class="small plain">' + tips.map(t => "<li>" + t + "</li>").join("") + "</ul>";
    // vývoj hmotnosti a chrápania: porovnanie nocí pred posledným zápisom hmotnosti a po ňom
    const W = D.body.weights;
    if (W.length >= 2) {
      const first = W[0], last = W[W.length - 1], ch = last.kg - first.kg;
      if (Math.abs(ch) >= 2) {
        const before = snoreStats(addDays(first.date, -30), last.date), after = snoreStats(last.date);
        h += '<p class="small">Od ' + short(first.date) + " máš o " + kg(Math.abs(ch)) + " " + (ch < 0 ? "menej" : "viac") + ".";
        if (before.n >= 3 && after.n >= 3) h += " Chrápanie predtým " + Math.round(before.avg) + " min za noc, odvtedy " + Math.round(after.avg) + " min.";
        h += "</p>";
      }
    }
    return h + '<p class="small muted">' + bodyNote(i) + "</p></div>";
  }

  // ---------- Vlastné faktory ----------
  function customCard() {
    let h = '<div class="card"><span class="set-label">Vlastné faktory</span><p class="small muted">Pridaj si vlastné stopy, napríklad obrazovka pred spaním, teplo v izbe alebo nočná zmena. Objavia sa vo večernom zázname, v spise aj v experimentoch.</p>';
    D.custom.forEach(c => {
      h += '<div class="exp-item"><span class="ico" aria-hidden="true">' + c.icon + "</span><div>" + c.name + "</div>" +
        '<button class="btn ghost" data-act="askDelFactor" data-k="' + c.k + '" type="button">Odstrániť</button></div>';
    });
    if (D.custom.length < MAX_CUSTOM) {

        '<div class="chips" role="group" aria-label="Ikona">' + CUSTOM_ICONS.map(i => '<button type="button" class="chip" data-cficon="' + i + '" aria-pressed="' + (i === icon) + '" aria-label="Ikona ' + i + '">' + i + "</button>").join("") + "</div>" +
        '<button class="btn ghost" data-act="addFactor" type="button">Pridať faktor</button>';

  }
  function addFactor() {
    const name = cleanName(UI.cfName);
    if (!name) { toast("Napíš názov faktora."); return; }
    if (FACTORS.some(F => F.name.toLowerCase() === name.toLowerCase())) { toast("Taký faktor už existuje."); return; }
    if (D.custom.length >= MAX_CUSTOM) return;
    let k = "c" + Date.now().toString(36);
    while (FMAP[k]) k += "x";
    D.custom.push({ k, name, icon: CUSTOM_ICONS.includes(UI.cfIcon) ? UI.cfIcon : CUSTOM_ICONS[0] });
    refreshFactors(); save();
    UI.cfName = ""; UI.cfIcon = null;
    openSettings();
    toast("Faktor „" + name + "“ je pridaný.");
  }
  function delFactor(k) {
    D.custom = D.custom.filter(c => c.k !== k);
    Object.keys(D.evenings).forEach(d => { if (D.evenings[d].f) delete D.evenings[d].f[k]; });
    delete D.verdicts[k];
    if (D.exp && D.exp.k === k) D.exp = null;
    refreshFactors(); save();
  }

  function showSheet(h, keepFocus) {
    const el = $("#sheet");
    el.innerHTML = h; el.hidden = false;
    if (!keepFocus) { const f = el.querySelector("button"); if (f) f.focus({ preventScroll: true }); }
  }
  function closeSheet() { stopPlaying(); if ($("#sheet").innerHTML.includes('id="set-keep"')) pruneFiles(); $("#sheet").hidden = true; $("#sheet").innerHTML = ""; ci = null; render(); }

  // Potvrdzovacie okno
  let modalOk = null;
  function confirmModal(o, onOk) {
