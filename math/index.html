  <script>
    // Zvolený vzhľad nastavíme ešte pred vykreslením, aby stránka neblikla inými farbami. Predvolený je tmavý.
    var t = 'dark';
    try {
      var saved = localStorage.getItem('matika.theme');
      if (/^(light|dark|sepia|contrast)$/.test(saved)) t = saved;
    } catch (e) { /* bez úložiska platí predvolený tmavý vzhľad */ }
    document.documentElement.setAttribute('data-theme', t);
  </script>
