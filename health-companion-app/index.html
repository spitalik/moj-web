    var tabs = [['tabToday', 'infoToday'], ['tabMeds', 'infoMeds'], ['tabSymptoms', 'infoSymptoms'], ['tabMeasure', 'infoMeasure'], ['tabDoctor', 'infoDoctor'], ['tabCheckups', 'infoCheckups']];
    document.getElementById('dlg-title').textContent = t('appName');
    dlgFields.innerHTML = '<p>' + t('appDesc') + '</p>' +
      '<h3 style="margin-top:6px">' + t('infoTabsTitle') + '</h3>' +
      tabs.map(function (p) {
        return '<div class="problem-line"><div class="info"><strong>' + t(p[0]) + '</strong><div class="muted">' + t(p[1]) + '</div></div></div>';
      }).join('');
    dlgErr.hidden = true;
    setDlgMode(false);
    dlg.showModal();
  }

  function openData() {
    HCStore.listProfiles().then(function (list) {
      var count = HC.dataCount(state);
      var persistText = persistGranted === true ? t('persistYes')
        : persistGranted === false ? t('persistNo')
        : t('persistUnknown');
      var langOptions = I18N.languages().map(function (l) {
        return '<option value="' + esc(l.code) + '"' + (l.code === I18N.lang() ? ' selected' : '') + '>' + esc(l.flag + ' ' + l.name) + '</option>';
      }).join('');
      var profOptions = list.map(function (p) {
        return '<option value="' + esc(p.id) + '"' + (profile && p.id === profile.id ? ' selected' : '') + '>' + esc(p.name) + (p.encrypted ? ' · ' + t('profileEncBadge') : '') + '</option>';
      }).join('');
      var enc = profile && profile.encrypted;
      var curPal = PALETTES[getPref('palette')] ? getPref('palette') : 'lamp';
      var palOptions = PALETTE_KEYS.map(function (k) {
        return '<option value="' + k + '"' + (k === curPal ? ' selected' : '') + '>' + PALETTES[k].label + '</option>';
      }).join('');
      var swatchHtml = PALETTE_KEYS.map(function (k) {
        return '<button type="button" data-pal="' + k + '" aria-label="' + PALETTES[k].label + '" title="' + PALETTES[k].label + '" aria-pressed="' + (k === curPal) + '" style="background:' + PALETTES[k].swatch + '"></button>';
      }).join('');
      document.getElementById('dlg-title').textContent = t('settingsTitle');
      dlgFields.innerHTML =
        '<h3>' + t('profilesTitle') + '</h3>' +
        '<label>' + t('profileActive') + '<select id="d-prof">' + profOptions + '</select></label>' +
        '<div class="stack inline"><button type="button" class="btn small" id="d-prof-new">' + t('profileNew') + '</button>' +
        '<button type="button" class="btn small" id="d-prof-rename">' + t('profileRename') + '</button>' +
        '<button type="button" class="btn small danger" id="d-prof-del">' + t('profileDelete') + '</button></div>' +
        '<div class="stack inline">' +
        (enc
          ? '<button type="button" class="btn small" id="d-enc-pass">' + t('profileChangePass') + '</button>' +
            '<button type="button" class="btn small" id="d-enc-off">' + t('profileDecrypt') + '</button>' +
            '<button type="button" class="btn small" id="d-lock">' + t('profileLock') + '</button>'
          : '<button type="button" class="btn small" id="d-enc-on">' + t('profileEncrypt') + '</button>') +
        '</div>' +
        '<label>' + t('langLabel') + '<select id="d-lang">' + langOptions + '</select></label>' +
        '<label>' + t('palLabel') + '<select id="d-pal">' + palOptions + '</select></label>' +
        '<div class="swatches">' + swatchHtml + '</div>' +
        '<label>' + t('palMode') + '<select id="d-mode">' +
          '<option value="dark"' + (getPref('mode') === 'light' ? '' : ' selected') + '>' + t('palDark') + '</option>' +
          '<option value="light"' + (getPref('mode') === 'light' ? ' selected' : '') + '>' + t('palLight') + '</option></select></label>' +
        '<label>' + t('emergencyCountryLabel') + '<select id="d-emergency">' + emergencyOptions() + '</select></label>' +
        '<h3 style="margin-top:6px">' + t('privacyTitle') + '</h3>' +
        '<p>' + t('dataLocal') + '</p>' +
        '<p class="muted">' + t('itemsStored', { n: count }) + '</p>' +
        '<p class="muted">' + persistText + '</p>' +
        '<p class="muted">' + (state.settings.lastExport ? t('lastExport', { date: fmtDate(state.settings.lastExport) }) : t('noExport')) + '</p>' +
        '<div class="stack"><button type="button" class="btn" id="d-ice">' + t('formIce') + '</button>' +
        '<button type="button" class="btn" id="d-export">' + t('btnExport') + '</button>' +
        '<label class="btn" style="text-align:center;cursor:pointer;color:var(--fg)">' + t('btnImport') + '<input type="file" accept="application/json,.json" id="d-import" hidden></label>' +
        '<button type="button" class="btn danger" id="d-wipe">' + t('eraseProfile') + '</button></div>' +
        '<p class="disclaimer">' + t('disclaimer') + '</p>';
      dlgErr.hidden = true;
      setDlgMode(false);
      if (!dlg.open) dlg.showModal();
    }).catch(function (err) { showError(err); });
  }

  // Udalosti dialógu nastavení sú zavesené raz (delegujú sa cez dlgFields).
  dlgFields.addEventListener('click', onDataClick);
  dlgFields.addEventListener('change', onDataChange);

  // Záloha: prílohy idú do JSON ako base64; pri zašifrovanom profile sa celá záloha zašifruje jeho heslom.
  function doExport() {
    var attachmentData = {};
    return Promise.all(state.attachments.map(function (a) {
      return attachmentBytes(a.id).then(function (buf) {
        attachmentData[a.id] = SB.toB64(buf);
      }).catch(function () { /* chýbajúca príloha sa do zálohy nepridá */ });
    })).then(function () {
      var json = HC.exportJSON(state, attachmentData);
      if (encKey) return SB.seal(encKey, encSalt, json).then(function (env) { return JSON.stringify(env, null, 2); });
      toast(t('plainBackupWarn'));
      return json;
    }).then(function (text) {
      downloadBlob('health-companion-zaloha-' + today() + '.json', 'application/json', text);
      commit(function () { state.settings.lastExport = today(); });
    }).catch(showError);
  }

  // Pripraví náhľad importu a ponúkne zlúčenie alebo nahradenie.
  function showImportOptions(text) {
    var parsed = HC.importJSON(text);
    pendingImport = parsed;
    var n = HC.dataCount(parsed.state);
    document.getElementById('dlg-title').textContent = t('importTitle');
    dlgFields.innerHTML =
      '<p>' + t('importText', { n: n }) + '</p>' +
      '<div class="stack"><button type="button" class="btn primary" id="d-merge">' + t('mergeBtn') + '</button>' +
      '<button type="button" class="btn danger" id="d-replace">' + t('replaceBtn') + '</button>' +
      '<button type="button" class="btn" id="d-cancel-import">' + t('cancel') + '</button></div>' +
      '<p class="muted">' + t('importHint') + '</p>';
    dlgErr.hidden = true;
    setDlgMode(false);
    if (!dlg.open) dlg.showModal();
  }

  // Zlúči alebo nahradí údaje a prílohy zo zálohy.
  function applyImport(replace) {
    var imp = pendingImport;
    pendingImport = null;
    if (!imp) return;
    if (replace && !confirmDelete(t('confirmReplace'))) return;
    var pid = profile.id;
    var keepFiles = replace ? Promise.resolve(HCStore.listFiles(pid).then(function (files) {
      return Promise.all(files.map(function (f) { return HCStore.deleteFile(f.id); }));
    })) : Promise.resolve();
    keepFiles.then(function () {
      var metas = imp.state.attachments || [];
      return Promise.all(Object.keys(imp.attachmentData).map(function (id) {
        var meta = findBy(metas, id) || {};
        return saveAttachmentFile(id, meta.mime || 'application/octet-stream', SB.fromB64(imp.attachmentData[id]).buffer);
      }));
    }).then(function () {
      state = replace ? imp.state : HC.mergeState(state, imp.state);
      save();
      dlg.close();
      render();
      toast(replace ? t('importReplaced') : t('importMerged'));
    }).catch(showError);
  }

  function onDataClick(e) {
    var pal = e.target.closest && e.target.closest('[data-pal]');
    if (pal) { setPalette(pal.dataset.pal); openData(); return; }
    var id = e.target.id;
    if (id === 'd-export') doExport();
    else if (id === 'd-ice') forms.ice();
    else if (id === 'd-prof-new') forms.profileNew();
    else if (id === 'd-prof-rename') forms.profileRename();
    else if (id === 'd-prof-del') {
      HCStore.listProfiles().then(function (list) {
        if (list.length <= 1) { toast(t('cannotDeleteLast')); return; }
        if (!confirmDelete(t('confirmDeleteProfile'))) return;
        var del = profile.id;
        var other = list.filter(function (p) { return p.id !== del; })[0];
        return flush().then(function () { return HCStore.deleteProfile(del); }).then(function () { activate(other); });
      }).catch(showError);
    }
    else if (id === 'd-enc-on') enableEncryption(false);
    else if (id === 'd-enc-pass') enableEncryption(true);
    else if (id === 'd-enc-off') disableEncryption();
    else if (id === 'd-lock') lockNow();
    else if (id === 'd-wipe') {
      if (confirmDelete(t('confirmWipe'))) {
        var lang = state.settings.lang;
        HCStore.listFiles(profile.id).then(function (files) {
          return Promise.all(files.map(function (f) { return HCStore.deleteFile(f.id); }));
        }).then(function () {
          state = HC.emptyState();
          state.settings.lang = lang;
          save(); dlg.close(); render();
          toast(t('wipeDone'));
        }).catch(showError);
      }
    } else if (id === 'd-merge' || id === 'd-replace') {
      applyImport(id === 'd-replace');
    } else if (id === 'd-cancel-import') {
      pendingImport = null;
      openData();
    }
  }

  function onDataChange(e) {
    var target = e.target;
    if (target.id === 'd-prof') { switchProfile(target.value); return; }
    if (target.id === 'd-lang') {
      setLanguage(target.value);
      openData();
      return;
    }
    if (target.id === 'd-pal') { setPalette(target.value); openData(); return; }
    if (target.id === 'd-mode') { setMode(target.value); openData(); return; }
    if (target.id === 'd-emergency') {
      commit(function () { state.settings.emergency = target.value || null; });
      openData();
      return;
    }
    if (target.id !== 'd-import' || !target.files[0]) return;
    var reader = new FileReader();
    reader.onload = function () {
      var text = String(reader.result);
      try {
        if (HC.isEncryptedBackup(text)) {
          var env = JSON.parse(text);
          openForm(t('encryptedImportTitle'), [
            { name: '_note', type: 'note', label: t('encryptedImportText') },
            { name: 'pass', label: t('fPass'), type: 'password', required: true }
          ], {}, function (v) {
            return SB.open(v.pass, env).then(function (json) {
              showImportOptions(json);
              return null;
            }, function () { return t('passWrong'); });
          });
        } else {
          showImportOptions(text);
        }
      } catch (err) { toast(err.message); }
    };
    reader.readAsText(target.files[0]);
    target.value = '';
  }

  // ---------- Tlačová správa pre lekára ----------
  function buildReport(days) {
    var tod = today(), now = nowTime();
    var from = HC.addDays(tod, -days);
    var ice = state.settings.ice || {};
    var symptoms = sortBy(state.symptoms.filter(function (s) { return s.date >= from && s.date <= tod; }), 'date', true);
    var visits = sortBy(state.visits.filter(function (v) { return v.date >= from && v.date <= tod; }), 'date', true);
    var activeMeds = state.meds.filter(function (m) { return HC.medActiveOn(m, tod); });
    var problems = state.problems.filter(function (p) { return p.status === 'aktívny'; });
    var checkups = state.checkups.map(function (c) { return { c: c, s: HC.checkupStatus(c, tod) }; });
    var openQ = HC.openQuestionsFor(state.questions, null);
    var stLabel = { overdue: t('statusOverdue'), soon: t('statusSoon'), unknown: t('statusUnknown'), ok: t('statusOk') };

    var h = '<h1>' + t('rptTitle') + '</h1>' +
      '<p class="muted">' + t('rptPeriod', { from: fmtDate(from), to: fmtDate(tod), days: days }) + '</p>';

    h += '<h2>' + t('rptIce') + '</h2>' + (hasICE()
      ? '<p>' + t('rptBlood', { v: esc(bloodLabel(ice.blood) || '—') }) + '</p><p>' + t('rptAllergies', { v: esc(ice.allergies || '—') }) + '</p><p>' + t('rptConditions', { v: esc(ice.conditions || '—') }) + '</p><p>' + t('rptContact', { v: esc(ice.contact || '—') }) + '</p>'
      : '<p class="muted">' + t('rptNoIce') + '</p>');

    h += '<h2>' + t('rptMeds') + '</h2>' + (activeMeds.length
      ? '<table><tr><th>' + t('thMed') + '</th><th>' + t('thDose') + '</th><th>' + t('thTimes') + '</th><th>' + t('thTakenSkipped') + '</th><th>' + t('thAdherence') + '</th></tr>' + activeMeds.map(function (m) {
          var c = HC.adherence(state, from, tod, tod, now, m.id);
          return '<tr><td>' + esc(m.name) + '</td><td>' + esc(m.dose || '—') + '</td><td>' + esc((m.times || []).join(', ')) + '</td><td>' + c.taken + ' / ' + c.skipped + '</td><td>' + (c.percent === null ? '—' : c.percent + ' %') + '</td></tr>';
        }).join('') + '</table>'
      : '<p class="muted">' + t('rptNoMeds') + '</p>');

    h += '<h2>' + t('rptProblems') + '</h2>' + (problems.length
      ? '<ul>' + problems.map(function (p) { return '<li>' + esc(p.name) + (p.since ? ' ' + t('rptSince', { date: fmtDate(p.since) }) : '') + (p.notes ? ' – ' + esc(p.notes) : '') + '</li>'; }).join('') + '</ul>'
      : '<p class="muted">' + t('rptNoProblems') + '</p>');

    h += '<h2>' + t('rptSymptoms') + '</h2>';
    var series = HC.severityByDay(state.symptoms, from, tod);
    if (series.length) {
      var W = 600, H = 160, n = Math.max(days, 1);
      var pts = series.map(function (p) {
        var x = (HC.daysBetween(from, p.date) / n) * W;
        var y = H - (p.max / 10) * H;
        return { x: x, y: y, p: p };
      });
      h += '<svg class="chart" viewBox="0 0 ' + W + ' ' + (H + 24) + '" role="img" aria-label="' + esc(t('rptChartLabel')) + '">' +
        '<line x1="0" y1="' + H + '" x2="' + W + '" y2="' + H + '" stroke="#999"/>' +
        '<line x1="0" y1="' + (H / 2) + '" x2="' + W + '" y2="' + (H / 2) + '" stroke="#ddd" stroke-dasharray="4 4"/>' +
        '<polyline fill="none" stroke="#b3261e" stroke-width="2" points="' + pts.map(function (q) { return q.x.toFixed(1) + ',' + q.y.toFixed(1); }).join(' ') + '"/>' +
        pts.map(function (q) { return '<circle cx="' + q.x.toFixed(1) + '" cy="' + q.y.toFixed(1) + '" r="3" fill="#b3261e"/>'; }).join('') +
        '<text x="0" y="' + (H + 18) + '" font-size="12">' + fmtDate(from) + '</text>' +
        '<text x="' + W + '" y="' + (H + 18) + '" font-size="12" text-anchor="end">' + fmtDate(tod) + '</text>' +
        '<text x="4" y="12" font-size="11">10</text><text x="4" y="' + (H - 2) + '" font-size="11">0</text>' +
        '</svg><p class="muted">' + t('rptChartCaption') + '</p>';
    }
    h += symptoms.length ? '<table><tr><th>' + t('thDate') + '</th><th>' + t('thSymptom') + '</th><th>' + t('thSeverity') + '</th><th>' + t('thDuration') + '</th><th>' + t('thMedsBefore') + '</th></tr>' + symptoms.map(function (s) {
      var meds = HC.medsBeforeSymptom(state, s, 3);
      var med = s.medId ? findBy(state.meds, s.medId) : null;
      return '<tr><td>' + fmtDate(s.date) + (s.time ? ' ' + esc(s.time) : '') + '</td><td>' + esc(s.name) + (med ? ' (' + esc(med.name) + ')' : '') + '</td><td>' + s.severity + '/10</td><td>' + esc(s.duration || '—') + '</td><td>' + esc(meds.join(', ') || '—') + '</td></tr>';
    }).join('') + '</table>' : '<p class="muted">' + t('rptNoSymptoms') + '</p>';

    h += '<h2>' + t('rptMeasures') + '</h2>';
    var ms = state.measurements.filter(function (m) { return m.date >= from && m.date <= tod; });
    h += ms.length ? '<table><tr><th>' + t('thDate') + '</th><th>' + t('fMType') + '</th><th>' + t('thValue') + '</th><th>' + t('fTime') + '</th></tr>' +
      sortBy(ms, 'date', true).map(function (m) {
        return '<tr><td>' + fmtDate(m.date) + '</td><td>' + esc(measureLabel(m.type)) + '</td><td>' + esc(measureText(m)) + '</td><td>' + esc(m.time || '—') + '</td></tr>';
      }).join('') + '</table>' : '<p class="muted">' + t('rptNoMeasures') + '</p>';

    h += '<h2>' + t('rptLabs') + '</h2>';
    var labRows = HC.labNames(state.labs).map(function (name) {
      var list = HC.labSeries(state.labs, name).filter(function (l) { return l.date >= from && l.date <= tod; });
      return list.length ? list[list.length - 1] : null;
    }).filter(Boolean);
    h += labRows.length ? '<table><tr><th>' + t('fLabName') + '</th><th>' + t('thDate') + '</th><th>' + t('thValue') + '</th><th>' + t('trendTitle') + '</th></tr>' +
      labRows.map(function (l) {
        var st = HC.labStatus(l);
        return '<tr><td>' + esc(l.name) + '</td><td>' + fmtDate(l.date) + '</td><td>' + esc(fmtNum(l.value)) + ' ' + esc(l.unit || '') + '</td><td>' + (st === 'low' ? t('labLow') : st === 'high' ? t('labHigh') : st === 'ok' ? t('labOk') : '—') + '</td></tr>';
      }).join('') + '</table>' : '<p class="muted">' + t('rptNoLabs') + '</p>';

    h += '<h2>' + t('rptVisits') + '</h2>' + (visits.length
      ? '<ul>' + visits.map(function (v) { return '<li>' + fmtDate(v.date) + ' – ' + esc(v.doctor || v.specialty) + (v.reason ? ': ' + esc(v.reason) : '') + (v.diagnosis ? '. ' + t('rptDiagnosis', { v: esc(v.diagnosis) }) : '') + '</li>'; }).join('') + '</ul>'
      : '<p class="muted">' + t('rptNoVisits') + '</p>');

    h += '<h2>' + t('rptCheckups') + '</h2>' + (checkups.length
      ? '<ul>' + checkups.map(function (x) {
          return '<li>' + esc(x.c.name) + ' – ' + stLabel[x.s.status] + (x.s.dueDate ? ' ' + t('rptDue', { date: fmtDate(x.s.dueDate) }) : '') + '</li>';
        }).join('') + '</ul>'
      : '<p class="muted">' + t('rptNoCheckups') + '</p>');

    h += '<h2>' + t('rptVacc') + '</h2>' + (state.vaccinations.length
      ? '<ul>' + state.vaccinations.map(function (v) { return '<li>' + esc(v.name) + ' – ' + fmtDate(v.date) + (v.nextDate ? ' (' + t('nextDue') + ' ' + fmtDate(v.nextDate) + ')' : '') + '</li>'; }).join('') + '</ul>'
      : '<p class="muted">' + t('rptNoVacc') + '</p>');

    h += '<h2>' + t('rptContacts') + '</h2>' + (state.contacts.length
      ? '<ul>' + state.contacts.map(function (c) { return '<li>' + esc(c.name) + (c.specialty ? ' (' + esc(c.specialty) + ')' : '') + (c.phone ? ' – ' + esc(c.phone) : '') + (c.address ? ', ' + esc(c.address) : '') + '</li>'; }).join('') + '</ul>'
      : '');

    h += '<h2>' + t('rptQuestions') + '</h2>' + (openQ.length
      ? '<ol>' + openQ.map(function (q) { return '<li>' + esc(q.text) + '</li>'; }).join('') + '</ol>'
      : '<p class="muted">' + t('rptNoQuestions') + '</p>');

    h += '<p class="disclaimer" style="margin-top:14px">' + t('rptDisclaimer') + '</p>';
    return h;
  }

  function reportDocument(days) {
    return '<!doctype html><html lang="' + esc(I18N.info(I18N.lang()).htmlLang) + '"><head><meta charset="utf-8">' +
      '<meta name="viewport" content="width=device-width, initial-scale=1"><title>' + esc(t('rptTitle')) + '</title>' +
      '<style>body{font-family:system-ui,sans-serif;max-width:720px;margin:24px auto;padding:0 16px;color:#111;font-size:14px}' +
      'table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid #ccc;text-align:left;padding:4px;vertical-align:top}' +
      'h1{font-size:20px}h2{font-size:15px;border-bottom:1px solid #999;margin:16px 0 6px}.muted{color:#555;font-size:12px}</style></head>' +
      '<body>' + buildReport(days) + '</body></html>';
  }

  function shareReport(days) {
    var file = new File([reportDocument(days)], 'health-companion-prehlad-' + today() + '.html', { type: 'text/html' });
    if (navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share) {
      navigator.share({ title: t('shareFileName'), files: [file] }).catch(function () { /* zrušené používateľom */ });
    } else {
      downloadBlob(file.name, 'text/html', file);
      toast(t('fileDownloaded'));
    }
  }

  function openReport() {
    openForm(t('formReport'), [
      { name: 'days', label: t('fPeriod'), type: 'select', options: [
        { value: '30', label: t('period30') }, { value: '90', label: t('period90') }, { value: '180', label: t('period180') }
      ] }
    ], { days: '90' }, function (v) {
      var days = Number(v.days) || 90;
      document.getElementById('print-root').innerHTML = buildReport(days);
      dlg.close();
      setTimeout(function () { window.print(); }, 150);
      return null;
    });
    var fa = dlgForm.querySelector('.form-actions');
    var share = document.createElement('button');
    share.type = 'button'; share.className = 'btn'; share.id = 'dlg-share'; share.textContent = t('shareBtn');
    share.addEventListener('click', function () { shareReport(Number(dlgForm.elements.days.value) || 90); });
    fa.insertBefore(share, fa.firstChild);
  }

  // Príloha: otvorí sa v dialógu (fotka) alebo ako odkaz na stiahnutie (PDF).
  function openAttachment(id) {
    var meta = findBy(state.attachments, id);
    if (!meta) return;
    HCStore.getFile(id).then(function (rec) {
      if (!rec) throw new Error(t('attNotFound'));
      return attachmentBytes(id).then(function (buf) {
        return new Blob([buf], { type: rec.mime });
      });
    }).then(function (blob) {
      var url = URL.createObjectURL(blob);
      document.getElementById('dlg-title').textContent = meta.name;
      var isImg = String(meta.mime).indexOf('image/') === 0;
      dlgFields.innerHTML = (isImg ? '<img src="' + url + '" alt="' + esc(meta.name) + '" style="max-width:100%;border-radius:12px">' : '<p class="muted">PDF</p>') +
        '<a class="btn primary block" href="' + url + '" download="' + esc(meta.name) + '">' + t('attDownload') + '</a>';
      dlgErr.hidden = true;
      setDlgMode(false);
      if (!dlg.open) dlg.showModal();
    }).catch(showError);
  }

  // ---------- Hlavné ovládanie ----------
  function render() {
    var html = views[view]();
    var main = document.getElementById('view');
    main.innerHTML = html;
    main.dataset.tab = view;
    justTaken = null; // animácia „fajky“ sa spustí len raz, po zmene
    document.querySelectorAll('#tabs button').forEach(function (b) {
      if (b.dataset.tab === view) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
  }

  function setView(v) { view = v; render(); window.scrollTo(0, 0); }

  document.getElementById('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tab]');
    if (b) setView(b.dataset.tab);
  });
  document.getElementById('btn-info').addEventListener('click', openInfo);
  document.getElementById('btn-data').addEventListener('click', openData);
  document.getElementById('btn-home').addEventListener('click', function () { setView('today'); });

  document.getElementById('view').addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.dataset.act, id = el.dataset.id;
    var m, s, p, v, q, c, added;
    switch (act) {
      case 'toggle-dose':
        var key = el.dataset.key, date = el.dataset.date, mode = el.dataset.mode;
        var cur = (state.taken[date] && state.taken[date][key]) || null;
        var curStatus = HC.doseStatus(cur);
        var next = curStatus === mode ? null : mode;
        justTaken = next === 'taken' ? key + '|' + date : null;
        if (next === 'taken' && navigator.vibrate) navigator.vibrate(12);
        commit(function () {
          state.taken = HC.setDoseStatus(state.taken, date, key, next);
          // Zásoby: označenie ako užité odpočíta kus, zrušenie ho vráti.
          var med = findBy(state.meds, key.split('|')[0]);
          if (med && typeof med.stock === 'number') {
            if (curStatus !== 'taken' && next === 'taken') med.stock = Math.max(0, med.stock - 1);
            if (curStatus === 'taken' && next !== 'taken') med.stock = med.stock + 1;
          }
        });
        break;
      case 'snooze-dose':
        var sk = el.dataset.key, sd = el.dataset.date;
        var until = HC.addMinutes(nowTime(), HC.SNOOZE_MINUTES);
        commit(function () { state.snoozes = HC.setSnooze(state.snoozes, sd, sk, until); });
        toast(t('snoozedTo', { time: until }));
        break;
      case 'notify':
        if ('Notification' in window) {
          Notification.requestPermission().then(function (perm) {
            toast(perm === 'granted' ? t('notifyOk') : t('notifyNo'));
            render();
          });
        }
        break;
      case 'export-backup': doExport(); break;
      case 'edit-ice': forms.ice(); break;
      case 'add-med': forms.med(null); break;
      case 'edit-med': forms.med(findBy(state.meds, id)); break;
      case 'toggle-med':
        m = findBy(state.meds, id); commit(function () { m.active = m.active === false; }); break;
      case 'toggle-reminders':
        m = findBy(state.meds, id); commit(function () { m.remindersOff = !m.remindersOff; }); break;
      case 'del-med':
        if (confirmDelete(t('confirmDeleteMed'))) commit(function () { state.meds = removeBy(state.meds, id); }); break;
      case 'add-symptom': forms.symptom(null); break;
      case 'edit-symptom': forms.symptom(findBy(state.symptoms, id)); break;
      case 'del-symptom':
        if (confirmDelete(t('confirmDeleteSymptom'))) commit(function () { state.symptoms = removeBy(state.symptoms, id); }); break;
      case 'add-problem': forms.problem(null); break;
      case 'edit-problem': forms.problem(findBy(state.problems, id)); break;
      case 'del-problem':
        if (confirmDelete(t('confirmDeleteProblem'))) commit(function () { state.problems = removeBy(state.problems, id); }); break;
      case 'set-mtype':
        measureType = el.dataset.type; render(); break;
      case 'add-measure': forms.measure(null); break;
      case 'edit-measure': forms.measure(findBy(state.measurements, id)); break;
      case 'del-measure':
        if (confirmDelete(t('confirmDeleteMeasure'))) commit(function () { state.measurements = removeBy(state.measurements, id); }); break;
      case 'csv-measure':
        downloadBlob('health-companion-merania-' + today() + '.csv', 'text/csv', '﻿' + HC.measurementsCSV(state.measurements));
        break;
      case 'add-lab': forms.lab(null); break;
      case 'edit-lab': forms.lab(findBy(state.labs, id)); break;
      case 'del-lab':
        if (confirmDelete(t('confirmDeleteLab'))) commit(function () { state.labs = removeBy(state.labs, id); }); break;
      case 'add-vacc': forms.vacc(null); break;
      case 'edit-vacc': forms.vacc(findBy(state.vaccinations, id)); break;
      case 'del-vacc':
        if (confirmDelete(t('confirmDeleteVacc'))) commit(function () { state.vaccinations = removeBy(state.vaccinations, id); }); break;
      case 'add-contact': forms.contact(null); break;
      case 'edit-contact': forms.contact(findBy(state.contacts, id)); break;
      case 'del-contact':
        if (confirmDelete(t('confirmDeleteContact'))) commit(function () { state.contacts = removeBy(state.contacts, id); }); break;
      case 'add-att': forms.attachment(); break;
      case 'open-att': openAttachment(id); break;
      case 'del-att':
        if (confirmDelete(t('confirmDeleteAtt'))) {
          HCStore.deleteFile(id).then(function () {
            commit(function () { state.attachments = removeBy(state.attachments, id); });
          }).catch(showError);
        }
        break;
      case 'add-visit': forms.visit(null); break;
      case 'edit-visit': forms.visit(findBy(state.visits, id)); break;
      case 'del-visit':
        if (confirmDelete(t('confirmDeleteVisit'))) commit(function () {
          state.visits = removeBy(state.visits, id);
          // otázky, ktoré patrili k zmazanej návšteve, zostanú ako nepriradené
          state.questions.forEach(function (x) { if (x.visitId === id) x.visitId = null; });
          state.attachments.forEach(function (x) { if (x.visitId === id) x.visitId = null; });
        }); break;
      case 'prep-visit':
        v = findBy(state.visits, id);
        showText(t('prepTitle'), HC.prepSummary(state, v, today()));
        break;
      case 'report': openReport(); break;
      case 'add-question': forms.question(null); break;
      case 'edit-question': forms.question(findBy(state.questions, id)); break;
      case 'toggle-question':
        q = findBy(state.questions, id); commit(function () { q.done = !q.done; }); break;
      case 'del-question':
        if (confirmDelete(t('confirmDeleteQuestion'))) commit(function () { state.questions = removeBy(state.questions, id); }); break;
      case 'copy-questions':
        showText(t('questionsTitle'), HC.questionsText(HC.openQuestionsFor(state.questions, null), ''));
        break;
      case 'add-checkup': forms.checkup(null); break;
      case 'edit-checkup': forms.checkup(findBy(state.checkups, id)); break;
      case 'add-standard-checkups':
        added = HC.missingStandardCheckups(state.checkups);
        if (!added.length) { toast(t('stdAllHave')); break; }
        commit(function () {
          added.forEach(function (s) {
            state.checkups.push({ id: HC.newId(), stdKey: s.key, name: s.name, intervalMonths: s.intervalMonths, lastDate: null, notes: t('stdNote') });
          });
        });
        toast(t('stdAdded', { n: added.length }));
        break;
      case 'done-checkup':
        c = findBy(state.checkups, id); commit(function () { c.lastDate = today(); }); toast(t('doneToast')); break;
      case 'del-checkup':
        if (confirmDelete(t('confirmDeleteCheckup'))) commit(function () { state.checkups = removeBy(state.checkups, id); }); break;
    }
  });

  // ---------- Natívne pripomienky (Capacitor): systémové budíky aj so zamknutou obrazovkou ----------
  var NATIVE = !!(window.Capacitor && typeof window.Capacitor.isNativePlatform === 'function' && window.Capacitor.isNativePlatform());
  var LN = NATIVE && window.Capacitor.Plugins ? window.Capacitor.Plugins.LocalNotifications : null;
  var NATIVE_DAYS = 2;   // koľko dní dopredu sa dávky plánujú (obnoví sa pri každej zmene a otvorení)
  var NATIVE_MAX = 60;   // limit čakajúcich pripomienok (iOS povoľuje 64)
  // Zvuk: res/raw/reminder_chime.wav (2 s), názov bez prípony (Android). iOS používa vlastný súbor v bundle.
  var NATIVE_CHANNEL = 'meds_chime'; var NATIVE_SOUND = 'reminder_chime';
  var channelReady = false;

  // Stabilné číslo pripomienky, aby sa dala neskôr zrušiť.
  function nativeId(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
    return (Math.abs(h) % 2000000000) + 1;
  }
  function ensureChannel() {
    if (channelReady) return Promise.resolve();
    channelReady = true;
    // Zvuk kanála sa nedá zmeniť po vytvorení, preto je kanál s novým ID a starý sa zmaže.
    return LN.deleteChannel({ id: 'meds' }).catch(function () {})
      .then(function () {
        return LN.createChannel({ id: NATIVE_CHANNEL, name: t('reminderTitle'), importance: 5, visibility: 1, sound: NATIVE_SOUND, vibration: true });
      }).catch(function () {});
  }
  function cancelNative() {
    return LN.getPending().then(function (r) {
      var ids = (r.notifications || []).map(function (n) { return { id: n.id }; });
      return ids.length ? LN.cancel({ notifications: ids }) : null;
    });
  }
  // Prepíše všetky naplánované pripomienky podľa aktuálneho stavu (lieky, dávky, odklady).
  function scheduleNative() {
    if (!LN) return Promise.resolve();
    if (!profile || (profile.encrypted && !encKey)) return cancelNative().catch(function () {});
    var now = new Date(), tod = today(), list = [];
    for (let i = 0; i <= NATIVE_DAYS; i++) {
      let day = HC.addDays(tod, i);
      HC.medDosesOn(state.meds, state.taken, day).forEach(function (d) {
        if (d.status || d.remindersOff) return;
        var rt = HC.reminderTime(d, state.snoozes, day);
        var at = new Date(day + 'T' + rt + ':00');
        if (at <= now) return;
        list.push({
          id: nativeId(day + '|' + d.key + '|' + rt),
          title: t('reminderTitle'),
          body: d.name + (d.dose ? ' – ' + d.dose : '') + ' (' + rt + ')',
          channelId: NATIVE_CHANNEL,
          sound: NATIVE_SOUND,
          schedule: { at: at, allowWhileIdle: true }
        });
      });
    }
    list.sort(function (a, b) { return a.schedule.at - b.schedule.at; });
    list = list.slice(0, NATIVE_MAX);
    return LN.checkPermissions().then(function (p) {
      return p.display === 'granted' ? p : LN.requestPermissions();
    }).then(function (p) {
      if (!p || p.display !== 'granted') return null;
      return ensureChannel().then(cancelNative).then(function () {
        return list.length ? LN.schedule({ notifications: list }) : null;
      });
    }).catch(function () { /* bez oprávnenia sa nič neplánuje */ });
  }

  // ---------- Pripomienky (kým je appka otvorená) ----------
  // Notifikácie sú len pomocné: prehliadač ich môže zahodiť alebo oneskoriť (uspané zariadenie, šetrenie batérie).
  var notified = {};
  var lastCheckDate = today(), lastCheckTime = nowTime();
  function showReminder(title, opts) {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    if ('serviceWorker' in navigator) {
      // Na Androide Chrome konštruktor Notification nefunguje, preto ide cez service worker.
      navigator.serviceWorker.ready
        .then(function (reg) { return reg.showNotification(title, opts); })
        .catch(function () { try { new Notification(title, opts); } catch (e) { /* bez notifikácií */ } });
      return;
    }
    try { new Notification(title, opts); } catch (e) { /* bez notifikácií */ }
  }
  // Kontroluje dávky od poslednej kontroly (nie len presnú minútu), aby sa tik časovača nedal preskočiť.
  function checkReminders() {
    if (NATIVE) return; // v natívnej appke pripomienky plánuje systém (scheduleNative)
    if (!profile || (profile.encrypted && !encKey)) return; // zamknutý profil: nič nepripomíname
    var tod = today(), now = nowTime();
    if (tod !== lastCheckDate) { lastCheckDate = tod; lastCheckTime = '00:00'; }
    var due = HC.medDosesOn(state.meds, state.taken, tod).filter(function (d) {
      if (d.status || d.remindersOff) return false;
      var rt = HC.reminderTime(d, state.snoozes, tod);
      return rt > lastCheckTime && rt <= now;
    });
    lastCheckTime = now;
    due.forEach(function (d) {
      var rt = HC.reminderTime(d, state.snoozes, tod);
      var k = tod + '|' + d.key + '|' + rt;
      if (notified[k]) return;
      notified[k] = true;
      showReminder(t('reminderTitle'), { body: d.name + (d.dose ? ' – ' + d.dose : '') + ' (' + rt + ')', tag: k, icon: 'icons/icon-192.png' });
    });
  }
  setInterval(function () { checkReminders(); if (view === 'today' && profile) render(); }, 60000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { checkReminders(); scheduleNative(); } });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }

  // ---------- Inštalácia na zariadenie ----------
  var installBtn = document.getElementById('btn-install');
  var deferredPrompt = null;
  var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;

  if (!isStandalone) {
    // Chrome, Edge a Android: prehliadač pošle udalosť, keď je appka inštalovateľná
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.hidden = false;
    });
    // iPhone/iPad nemajú inštalačné API: ukážeme postup cez Zdieľať
    if (isIOS) installBtn.hidden = false;
  }
  window.addEventListener('appinstalled', function () { installBtn.hidden = true; deferredPrompt = null; });

  installBtn.addEventListener('click', function () {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function () { deferredPrompt = null; installBtn.hidden = true; });
    } else if (isIOS) {
      showText(t('iosTitle'), t('iosSteps'));
    } else {
      toast(t('installHintGeneric'));
    }
  });

  boot();
})();
</script>
