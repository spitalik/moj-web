<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Health Companion</title>
<meta name="description" content="Osobný zdravotný asistent: lieky, príznaky, návštevy lekára, preventívne prehliadky a otázky pre lekára. Dáta zostávajú v zariadení.">
<meta name="theme-color" content="#0f1f1c" id="theme-color">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zdravie">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Žiadne písma ani skripty z tretích strán (GDPR). Používa sa systémové písmo. */
:root, :root[data-theme="dark"] {
  --bg: #0f1f1c;
  --card: #163029;
  --card-2: #1d3d35;
  --line: #2b5147;
  --fg: #e7f3ef;
  --muted: #9bbcb3;
  --accent: #5fd3b0;
  --accent-ink: #062018;
  --warn: #f5c26b;
  --danger: #f08a80;
  --ok: #7fe0a8;
  --c-meds: #8ab4ff; --c-health: #ff9fb0; --c-measure: #c9a6ff; --c-doctor: #7fd6e8; --c-checkups: #9be5b5;
  --shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #eef5f2;
  --card: #ffffff;
  --card-2: #e2efea;
  --line: #c7dbd3;
  --fg: #12302a;
  --muted: #4f6e66;
  --accent: #14806a;
  --accent-ink: #ffffff;
  --warn: #9a6400;
  --danger: #b3261e;
  --ok: #1d7a4b;
  --c-meds: #2f5fb3; --c-health: #b03a5b; --c-measure: #7a4fb0; --c-doctor: #1a7f96; --c-checkups: #1d7a4b;
  --shadow: 0 6px 16px rgba(18, 48, 42, 0.08);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
/* Písma profilu Lamp (lokálne, z appky blood-pressure). Ostatné profily používajú systémové písmo. */
html[data-palette="lamp"] { --f-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif; --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif; }
body {
  font-family: var(--f-body, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
  font-size: 15px; line-height: 1.45;
  min-height: 100dvh; display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; line-height: 1.2; font-family: var(--f-display, inherit); }
h1 { font-size: 20px; }
h2 { font-size: 17px; margin-bottom: 8px; }
h3 { font-size: 15px; }
p { margin: 0; }

header.top {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 14px 16px 10px; position: sticky; top: 0; z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
header.top .brand { font-weight: 700; font-size: 17px; background: none; border: 0; color: var(--fg); padding: 6px 4px; border-radius: 10px; }
header.top .brand:hover { background: var(--card-2); }
header.top .brand span { color: var(--accent); }
header.top .top-actions { display: flex; align-items: center; gap: 8px; }
.btn {
  border: 1px solid var(--line); background: var(--card); color: var(--fg);
  border-radius: 12px; padding: 9px 14px; min-height: 40px; font-weight: 600;
}
.btn:hover { background: var(--card-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--danger); }
.btn.small { padding: 5px 10px; min-height: 32px; font-size: 13px; font-weight: 600; }
.btn.icon { width: 40px; padding: 0; display: grid; place-items: center; font-size: 18px; }
.btn.block { width: 100%; text-align: center; }

main { flex: 1; padding: 14px 16px 96px; display: flex; flex-direction: column; gap: 14px; max-width: 640px; width: 100%; margin: 0 auto; }
/* Farba sekcie: farebný pruh vľavo na kartách (premenná --sec nastavená podľa záložky) */
main { --sec: var(--accent); }
main[data-tab="meds"] { --sec: var(--c-meds); }
main[data-tab="symptoms"] { --sec: var(--c-health); }
main[data-tab="measure"] { --sec: var(--c-measure); }
main[data-tab="doctor"] { --sec: var(--c-doctor); }
main[data-tab="checkups"] { --sec: var(--c-checkups); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; box-shadow: var(--shadow), inset 3px 0 0 var(--sec); }
.card.flag-warn { border-color: var(--warn); }
.card.flag-danger { border-color: var(--danger); }
.card.ice { border-color: var(--danger); box-shadow: var(--shadow), inset 3px 0 0 var(--danger); }
.card.hero { background: linear-gradient(140deg, color-mix(in srgb, var(--accent) 24%, var(--card)), var(--card) 70%); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); box-shadow: var(--shadow); }
.hero strong { font-size: 17px; }
.progress { height: 8px; border-radius: 999px; background: var(--card-2); overflow: hidden; }
.progress i { display: block; height: 100%; width: var(--p, 0%); background: var(--accent); border-radius: inherit; transition: width .4s ease; }
.hero .meta { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 13px; }
.big-val { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.stack.inline { flex-direction: row; gap: 6px; flex-wrap: wrap; }
.muted { color: var(--muted); font-size: 13px; }
.badge { display: inline-block; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 700; background: var(--card-2); color: var(--muted); }
.badge.warn { color: var(--warn); }
.badge.danger { color: var(--danger); }
.badge.ok { color: var(--ok); }
.empty { color: var(--muted); text-align: center; padding: 22px 14px; background: var(--card-2); border-radius: 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; flex-wrap: wrap; }

.dose { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.dose:first-of-type { border-top: 0; }
.dose .time { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 52px; }
.dose .info { flex: 1; min-width: 0; }
.dose .name { font-weight: 600; }
.dose.missed .time { color: var(--danger); }
.dose.skipped .name { text-decoration: line-through; color: var(--muted); }
.dose-btns { display: flex; gap: 6px; flex: none; }
.check, .skip, .snooze {
  width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--accent);
  background: transparent; display: grid; place-items: center; flex: none; color: var(--accent-ink);
}
.check.on { background: var(--accent); }
.skip { border-color: var(--line); color: var(--muted); font-weight: 700; }
.skip.on { background: var(--danger); border-color: var(--danger); color: var(--accent-ink); }
.snooze { border-color: var(--line); color: var(--muted); }
.snooze svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; }
.check svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 3; }
.check.fresh { animation: pop .32s ease; }
@keyframes pop { 0% { transform: scale(.7); } 60% { transform: scale(1.18); } 100% { transform: scale(1); } }

nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  display: grid; grid-template-columns: repeat(6, 1fr);
  background: var(--card); border-top: 1px solid var(--line);
  padding: 6px 4px calc(8px + env(safe-area-inset-bottom, 0px));
}
nav.tabs button {
  background: none; border: 0; color: var(--muted); font-size: 10.5px; font-weight: 600;
  display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; border-radius: 12px;
}
nav.tabs button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs button[aria-current="page"] { color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, transparent); }
nav.tabs button { transition: background .2s ease, color .2s ease; }
.chart polyline.ln { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1s ease forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }

/* Dialóg (formulár) */
dialog { border: 1px solid var(--line); border-radius: 18px; background: var(--card); color: var(--fg); padding: 0; width: min(440px, calc(100vw - 32px)); max-height: 90dvh; }
dialog::backdrop { background: rgba(0, 0, 0, 0.55); }
dialog form { padding: 18px; display: flex; flex-direction: column; gap: 12px; max-height: 90dvh; overflow-y: auto; }
label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 600; }
input, select, textarea {
  background: var(--card-2); border: 1px solid var(--line); border-radius: 10px;
  padding: 9px 10px; color: var(--fg); font-size: 16px; width: 100%;
}
input[type="file"] { padding: 7px; }
textarea { min-height: 70px; resize: vertical; }
.form-error { color: var(--danger); font-weight: 600; font-size: 14px; }
.form-actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.check-row { display: flex; align-items: center; gap: 8px; color: var(--fg); font-weight: 500; font-size: 15px; }
.check-row input { width: 18px; height: 18px; padding: 0; }

.problem-line, .question-line { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); }
.problem-line:first-child, .question-line:first-child { border-top: 0; }
.problem-line .info, .question-line .info { flex: 1; min-width: 0; }
.pre { white-space: pre-wrap; word-break: break-word; background: var(--card-2); border-radius: 12px; padding: 12px; font-size: 14px; }
.banner { background: var(--card-2); border-left: 4px solid var(--warn); border-radius: 14px; padding: 12px 14px; }
.disclaimer { font-size: 12px; color: var(--muted); }
.toast {
  position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--card-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; font-weight: 600;
  z-index: 10; max-width: calc(100vw - 32px); box-shadow: 0 10px 30px rgba(0,0,0,.25);
}
.chart { width: 100%; height: auto; display: block; }
.chart-legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 4px; }
.chart-legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; background: currentColor; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 600; color: var(--muted); }
.chip.on { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
.pulse-line { font-size: 22px; font-weight: 700; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; margin-top: -4px; }
.swatches button { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); padding: 0; cursor: pointer; }
.swatches button:hover { transform: scale(1.08); }
.swatches button[aria-pressed="true"] { outline: 2px solid var(--fg); outline-offset: 2px; }
#print-root { display: none; }
@media (min-width: 720px) { main { padding-bottom: 110px; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .chart polyline.ln { stroke-dashoffset: 0; }
}

/* Tlač: zobrazí sa len prehľad pre lekára */
@media print {
  body > *:not(#print-root) { display: none !important; }
  #print-root { display: block !important; color: #000; background: #fff; font-size: 12pt; }
  #print-root h1 { font-size: 18pt; margin-bottom: 4pt; }
  #print-root h2 { font-size: 13pt; margin: 12pt 0 4pt; border-bottom: 1px solid #999; }
  #print-root table { width: 100%; border-collapse: collapse; font-size: 10pt; }
  #print-root th, #print-root td { border-bottom: 1px solid #ccc; text-align: left; padding: 3pt 4pt; vertical-align: top; }
  #print-root .muted { color: #444; }
}
</style>
</head>
<body>
<header class="top">
  <button class="brand" id="btn-home" data-i18n-aria="homeAria"><span data-i18n="appName">Health Companion</span></button>
  <div class="top-actions">
    <button class="btn small" id="btn-install" hidden data-i18n="install">Nainštalovať</button>
    <button class="btn icon" id="btn-info" data-i18n-aria="infoAria" data-i18n-title="infoAria">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="7.5" r="0.6" fill="currentColor"/></svg>
    </button>
    <button class="btn icon" id="btn-data" data-i18n-aria="settingsAria" data-i18n-title="settingsAria">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
</header>

<main id="view" aria-live="polite"></main>

<nav class="tabs" id="tabs" data-i18n-aria="navAria">
  <button data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span data-i18n="tabToday">Dnes</span></button>
  <button data-tab="meds"><svg viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="6" rx="3" transform="rotate(-45 12 12)"/><path d="M8.5 8.5l7 7"/></svg><span data-i18n="tabMeds">Lieky</span></button>
  <button data-tab="symptoms"><svg viewBox="0 0 24 24"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg><span data-i18n="tabSymptoms">Zdravie</span></button>
  <button data-tab="measure"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l3-4 3 2 5-6"/></svg><span data-i18n="tabMeasure">Merania</span></button>
  <button data-tab="doctor"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg><span data-i18n="tabDoctor">Lekár</span></button>
  <button data-tab="checkups"><svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h9"/></svg><span data-i18n="tabCheckups">Prehliadky</span></button>
</nav>

<dialog id="dlg">
  <form id="dlg-form" method="dialog">
    <h2 id="dlg-title"></h2>
    <div id="dlg-fields" class="stack"></div>
    <p class="form-error" id="dlg-error" hidden></p>
    <div class="form-actions">
      <button type="button" class="btn" id="dlg-cancel">Zrušiť</button>
      <button type="submit" class="btn primary" id="dlg-save" data-i18n="save">Uložiť</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>
<div id="print-root" aria-hidden="true"></div>

<script src="i18n/pt.js"></script>
<script src="i18n/de.js"></script>
<script src="i18n/fr.js"></script>
<script src="i18n/it.js"></script>
<script src="i18n/ru.js"></script>
<script src="i18n/tr.js"></script>
<script src="i18n/ja.js"></script>
<script src="i18n/ko.js"></script>
<script src="i18n/zh.js"></script>
<script src="logic.js"></script>
<script src="securebox.js"></script>
<script src="store.js"></script>
<script>
(function () {
  'use strict';
  var HC = window.HC;
  var SB = window.SB;
  var I18N = window.HCI18N;
  var t = I18N.t;
  var PREF_KEY = 'healthCompanion.pref';   // predvoľby zariadenia: aktívny profil, jazyk
  var LEGACY_KEY = 'healthCompanion.v1';   // staré údaje (pred IndexedDB), presunú sa pri prvom spustení

  // Stav aktívneho profilu. Pri zašifrovanom profile je encKey len v pamäti (po odomknutí).
  var state = HC.emptyState();
  var profile = null;        // { id, name, encrypted }
  var encKey = null;         // CryptoKey zašifrovaného profilu
  var encSalt = null;        // soľ kľúča (uložená aj v profile)
  var mustUnlock = false;
  var dlgCancelAction = null;
  var pendingImport = null;
  var migrated = false;
  var view = 'today';
  var measureType = 'bp';
  var toastTimer = null;
  var persistGranted = null;
  var saveChain = Promise.resolve();

  // ---------- Predvoľby zariadenia ----------
  function getPref(k) {
    try { return (JSON.parse(localStorage.getItem(PREF_KEY) || '{}') || {})[k] || null; } catch (e) { return null; }
  }
  function setPref(k, v) {
    try {
      var p = JSON.parse(localStorage.getItem(PREF_KEY) || '{}') || {};
      p[k] = v;
      localStorage.setItem(PREF_KEY, JSON.stringify(p));
    } catch (e) { /* bez predvolieb */ }
  }

  // ---------- Jazyk ----------
  function detectLang() {
    var supported = I18N.languages().map(function (l) { return l.code; });
    var nav = (navigator.language || 'sk').toLowerCase();
    var pick = supported.filter(function (c) { return nav === c || nav.indexOf(c + '-') === 0; })[0];
    return pick || (nav.indexOf('zh') === 0 ? 'zh' : 'sk');
  }
  function applyLang(code) {
    I18N.setLang(code);
    document.documentElement.lang = I18N.info(I18N.lang()).htmlLang;
    applyStatic();
    document.title = t('appName');
  }
  // Texty v statickej časti stránky (data-i18n atribúty).
  function applyStatic() {
    document.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-aria]').forEach(function (el) { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
    document.querySelectorAll('[data-i18n-title]').forEach(function (el) { el.setAttribute('title', t(el.dataset.i18nTitle)); });
    document.querySelector('meta[name="description"]').setAttribute('content', t('appDesc'));
  }
  function setLanguage(code) {
    state.settings.lang = code;
    setPref('lang', code);
    save();
    applyLang(code);
    render();
  }

  // ---------- Úložisko: profily v IndexedDB ----------
  function newProfileRecord(name, data) {
    return { id: HC.newId(), name: name || t('profileNameDefault'), createdAt: new Date().toISOString(), encrypted: false, enc: null, data: HC.normalizeState(data) };
  }
  function createProfile(name, data) {
    var rec = newProfileRecord(name, data);
    return HCStore.putProfile(rec).then(function () { return rec; });
  }

  // Zápis je radený do fronty, aby sa neprekrývali. Snímok stavu sa berie hneď pri volaní.
  function save() {
    if (!profile) return false;
    var pid = profile.id, json = JSON.stringify(state), key = encKey, salt = encSalt;
    saveChain = saveChain.then(function () { return writeProfile(pid, json, key, salt); })
      .catch(function () { toast(t('saveFail')); });
    scheduleNative();
    return true;
  }
  function flush() { return saveChain; }

  function writeProfile(pid, json, key, salt) {
    return HCStore.getProfile(pid).then(function (rec) {
      if (!rec) return null;
      if (key) {
        return SB.encryptText(key, json).then(function (r) {
          rec.encrypted = true;
          rec.enc = { salt: salt, iv: r.iv, ct: r.ct };
          rec.data = null;
          return HCStore.putProfile(rec);
        });
      }
      rec.encrypted = false;
      rec.enc = null;
      rec.data = JSON.parse(json);
      return HCStore.putProfile(rec);
    });
  }

  // Prílohy: pri zašifrovanom profile sú šifrované kľúčom profilu.
  function blobToBuf(b) { return b instanceof Blob ? b.arrayBuffer() : Promise.resolve(b); }
  function saveAttachmentFile(id, mime, buf) {
    var pid = profile.id;
    if (encKey) {
      return SB.encryptBytes(encKey, buf).then(function (r) {
        return HCStore.putFile({ id: id, profileId: pid, mime: mime, iv: r.iv, data: r.ct });
      });
    }
    return HCStore.putFile({ id: id, profileId: pid, mime: mime, iv: null, data: new Blob([buf], { type: mime }) });
  }
  // Obsah prílohy ako ArrayBuffer (rozšifrovaný).
  function attachmentBytes(id) {
    return HCStore.getFile(id).then(function (rec) {
      if (!rec) throw new Error(t('attNotFound'));
      if (rec.iv) return SB.decryptBytes(encKey, rec.iv, rec.data);
      return blobToBuf(rec.data);
    });
  }
  // Prepíše všetky prílohy profilu novým kľúčom (alebo bez kľúča = nešifrované).
  function rekeyFiles(fromKey, toKey) {
    return HCStore.listFiles(profile.id).then(function (files) {
      return files.reduce(function (p, rec) {
        return p.then(function () {
          var plain = rec.iv ? SB.decryptBytes(fromKey, rec.iv, rec.data) : blobToBuf(rec.data);
          return plain.then(function (buf) {
            if (toKey) return SB.encryptBytes(toKey, buf).then(function (r) { rec.iv = r.iv; rec.data = r.ct; return HCStore.putFile(rec); });
            rec.iv = null;
            rec.data = new Blob([buf], { type: rec.mime });
            return HCStore.putFile(rec);
          });
        });
      }, Promise.resolve());
    });
  }

  // Prvé spustenie po update: staré údaje z localStorage presunie do profilu.
  function migrateLegacy() {
    var raw = null;
    try { raw = localStorage.getItem(LEGACY_KEY); } catch (e) { raw = null; }
    if (!raw) return Promise.resolve();
    return HCStore.listProfiles().then(function (list) {
      if (list.length) return null;
      var data;
      try { data = HC.normalizeState(JSON.parse(raw)); } catch (e) { data = HC.emptyState(); }
      return createProfile(t('profileNameDefault'), data).then(function () {
        try { localStorage.removeItem(LEGACY_KEY); } catch (e) { /* ponechá sa */ }
        migrated = true;
      });
    });
  }

  // Aktivuje profil: nezašifrovaný sa načíta hneď, zašifrovaný sa najprv odomkne heslom.
  function activate(rec) {
    if (dlg.open && !rec.encrypted) dlg.close();
    encKey = null; encSalt = null; mustUnlock = false;
    profile = { id: rec.id, name: rec.name, encrypted: !!rec.encrypted };
    setPref('profile', rec.id);
    if (rec.encrypted) {
      state = HC.emptyState();
      render();
      askUnlock(rec);
      return;
    }
    state = HC.normalizeState(rec.data);
    applyLang(state.settings.lang || getPref('lang') || detectLang());
    render();
    scheduleNative();
  }

  function switchProfile(id) {
    return flush().then(function () { return HCStore.getProfile(id); }).then(function (rec) {
      if (rec) activate(rec);
    });
  }

  function askUnlock(rec) {
    mustUnlock = true;
    openForm(t('unlockTitle'), [
      { name: '_note', type: 'note', label: t('unlockText', { name: rec.name }) },
      { name: 'pass', label: t('fPass'), type: 'password', required: true }
    ], {}, function (v) {
      return HCStore.getProfile(rec.id).then(function (fresh) {
        if (!fresh || !fresh.enc) return t('dbError');
        return SB.deriveKey(v.pass, fresh.enc.salt).then(function (key) {
          return SB.decryptText(key, fresh.enc.iv, fresh.enc.ct).then(function (json) {
            encKey = key;
            encSalt = fresh.enc.salt;
            state = HC.normalizeState(JSON.parse(json));
            mustUnlock = false;
            dlgCancelAction = null;
            applyLang(state.settings.lang || getPref('lang') || detectLang());
            render();
            scheduleNative();
            return null;
          }, function () { return t('passWrong'); });
        });
      });
    });
    // Ak heslo nepamätáte, dá sa vytvoriť nový profil (zašifrovaný zostáva nedotknutý).
    var cancel = document.getElementById('dlg-cancel');
    cancel.textContent = t('profileNew');
    dlgCancelAction = function () {
      mustUnlock = false;
      dlgCancelAction = null;
      createProfile(t('profileNameDefault'), null).then(function (r) { dlg.close(); activate(r); });
    };
  }

  function lockNow() {
    flush().then(function () { return HCStore.getProfile(profile.id); }).then(function (rec) {
      encKey = null; encSalt = null;
      state = HC.emptyState();
      profile.encrypted = true;
      render();
      scheduleNative(); // zamknutý profil: naplánované pripomienky sa zrušia
      askUnlock(rec);
    });
  }

  function enableEncryption(change) {
    openForm(t(change ? 'profileChangePass' : 'profileEncrypt'), [
      { name: '_note', type: 'note', label: t('passWarn') },
      { name: 'pass', label: t('fPass'), type: 'password', required: true },
      { name: 'pass2', label: t('fPass2'), type: 'password', required: true }
    ], {}, function (v) {
      if (v.pass.length < 8) return t('passShort');
      if (v.pass !== v.pass2) return t('passMismatch');
      var salt = SB.newSalt(), oldKey = encKey;
      return SB.deriveKey(v.pass, salt).then(function (key) {
        return rekeyFiles(oldKey, key).then(function () {
          encKey = key; encSalt = salt; profile.encrypted = true;
          save();
          render();
          toast(change ? t('profileSaved') : t('profileEncOn'));
          return null;
        });
      });
    });
  }

  function disableEncryption() {
    if (!confirmDelete(t('confirmDecrypt'))) return;
    var oldKey = encKey;
    rekeyFiles(oldKey, null).then(function () {
      encKey = null; encSalt = null; profile.encrypted = false;
      save();
      toast(t('profileEncOff'));
      openData();
    }).catch(function () { toast(t('dbError')); });
  }

  };
  var PALETTE_KEYS = ['lamp', 'ocean', 'mint', 'sunset', 'rose'];
  // Uplatní farebný profil a režim (tmavý/svetlý) na celú stránku.
  function applyPalette() {
    var name = PALETTES[getPref('palette')] ? getPref('palette') : 'lamp';
    var light = getPref('mode') === 'light';
    var root = document.documentElement;
    root.dataset.theme = light ? 'light' : 'dark';
    root.dataset.palette = name;
    var p = PALETTES[name], tokens = p.dark && (light ? p.light : p.dark);
    Object.keys(PALETTE_VARS).forEach(function (k) {
      if (tokens) root.style.setProperty(PALETTE_VARS[k], tokens[k]); else root.style.removeProperty(PALETTE_VARS[k]);
    });
    var bg = getComputedStyle(root).getPropertyValue('--bg').trim();
    var meta = document.getElementById('theme-color');
    if (meta && bg) meta.setAttribute('content', bg);
  }
  function setPalette(name) { setPref('palette', name); applyPalette(); }
  function setMode(mode) { setPref('mode', mode); applyPalette(); }

  function boot() {
    applyPalette();
    applyLang(getPref('lang') || detectLang());
    HCStore.open().then(migrateLegacy).then(function () {
      return HCStore.listProfiles();
    }).then(function (list) {
      if (list.length) return list;
      return createProfile(t('profileNameDefault'), null).then(function () { return HCStore.listProfiles(); });
    }).then(function (list) {
      var pref = getPref('profile');
      var rec = list.filter(function (p) { return p.id === pref; })[0] || list[0];
      activate(rec);
      if (migrated) toast(t('migrated'));
    }).catch(function (err) {
      console.error('boot', err);
      document.getElementById('view').innerHTML = '<div class="empty">' + t('dbError') + '</div>';
    });

  // Žiadosť o trvalé úložisko: prehliadač potom nemá údaje mazať pri nedostatku miesta.
  try {
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().then(function (ok) { persistGranted = !!ok; }, function () { persistGranted = false; });
    }
  } catch (e) { persistGranted = false; }

  // ---------- Pomocné ----------
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtDate(iso) {
    var d = HC.parseISO(iso);
    if (!d) return t('dateUnknown');
    return d.toLocaleDateString(I18N.info(I18N.lang()).htmlLang, { day: 'numeric', month: 'short', year: 'numeric' });
  }
  function fmtNum(n) {
    return String(Math.round(Number(n) * 10) / 10);
  }
  function nowTime() {
    var d = new Date();
    return (d.getHours() < 10 ? '0' : '') + d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
  }
  function today() { return HC.isoDate(new Date()); }
  function sortBy(list, key, desc) {
    return list.slice().sort(function (a, b) {
      var x = a[key] || '', y = b[key] || '';
      return x < y ? (desc ? 1 : -1) : x > y ? (desc ? -1 : 1) : 0;
    });
  }
  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg; el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.hidden = true; }, 2600);
  }
  function findBy(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }
  function removeBy(list, id) { return list.filter(function (x) { return x.id !== id; }); }
  function confirmDelete(msg) { return window.confirm(msg); }
  function visitLabel(v) { return v ? fmtDate(v.date) + ' – ' + (v.doctor || v.specialty || '') : ''; }
  function downloadBlob(name, type, data) {
    var blob = data instanceof Blob ? data : new Blob([data], { type: type });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

    return ICE_FIELDS.some(function (k) { return !!ice[k]; });

  function bloodLabel(v) { return v === 'Neviem' ? t('bloodUnknown') : v; }
  function measureLabel(type) { return t('mType_' + type); }
  function measureText(m) {
    var ty = HC.MEASURE_TYPES[m.type] || { unit: '' };
    return fmtNum(m.value) + (ty.two && m.value2 != null ? '/' + fmtNum(m.value2) : '') + ' ' + ty.unit;
  }
  function statusBadge(s) {
    if (!s) return '';

  // Čiarový graf. series = [{ points: [{ x: 'YYYY-MM-DD', y: číslo }], color: 'var(--accent)' }]
  function lineChart(series, fromIso, toIso) {
    var all = [];
    series.forEach(function (s) { s.points.forEach(function (p) { all.push(p.y); }); });
    if (!all.length) return '<p class="muted">' + t('chartNoData') + '</p>';
    var W = 600, H = 160, P = 30;
    var n = Math.max(1, HC.daysBetween(fromIso, toIso));
    var min = Math.min.apply(null, all), max = Math.max.apply(null, all);
    if (min === max) { min -= 1; max += 1; }
    var span = max - min; min -= span * 0.1; max += span * 0.1;
    function X(d) { return P + Math.min(1, Math.max(0, HC.daysBetween(fromIso, d) / n)) * (W - 2 * P); }
    function Y(v) { return H - P - ((v - min) / (max - min)) * (H - 2 * P); }
    var svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + (H + 22) + '" role="img">' +
      '<line x1="' + P + '" y1="' + (H - P) + '" x2="' + (W - P) + '" y2="' + (H - P) + '" style="stroke:var(--line)"/>' +
      '<text x="2" y="' + (P + 4) + '" font-size="11" style="fill:var(--muted)">' + fmtNum(max) + '</text>' +
      '<text x="2" y="' + (H - P) + '" font-size="11" style="fill:var(--muted)">' + fmtNum(min) + '</text>' +
      '<text x="' + P + '" y="' + (H + 16) + '" font-size="11" style="fill:var(--muted)">' + esc(fmtDate(fromIso)) + '</text>' +
      '<text x="' + (W - P) + '" y="' + (H + 16) + '" font-size="11" text-anchor="end" style="fill:var(--muted)">' + esc(fmtDate(toIso)) + '</text>';
    series.forEach(function (s) {
      var pts = s.points.map(function (p) { return X(p.x).toFixed(1) + ',' + Y(p.y).toFixed(1); });
      if (pts.length > 1) svg += '<polyline class="ln" pathLength="1" fill="none" stroke-width="2" style="stroke:' + s.color + '" points="' + pts.join(' ') + '"/>';
      s.points.forEach(function (p) {
        svg += '<circle cx="' + X(p.x).toFixed(1) + '" cy="' + Y(p.y).toFixed(1) + '" r="3.5" style="fill:' + s.color + '"/>';
      });
    });
    return svg + '</svg>';
  }

  // ---------- Dialóg ----------
  var dlg = document.getElementById('dlg');
  var dlgForm = document.getElementById('dlg-form');
  var dlgFields = document.getElementById('dlg-fields');
  var dlgErr = document.getElementById('dlg-error');
  var dlgCancel = document.getElementById('dlg-cancel');
  var dlgState = null;

  // Režim formulára: true = ukladací formulár, false = len zobrazenie obsahu (Zavrieť).
  function setDlgMode(isForm) {
    document.getElementById('dlg-save').hidden = !isForm;
    dlgCancel.hidden = false;
    dlgCancel.textContent = isForm ? t('cancel') : t('close');
    dlgCancelAction = null;
    if (!isForm) dlgState = null;
  }

  // spec: [{name, label, type, options?, required?, placeholder?, min?, max?, step?, accept?}]
  // type 'note' = len text, 'file' = výber súboru. onSave môže vrátiť text chyby alebo Promise s takou hodnotou.
  function openForm(title, spec, values, onSave) {
    dlgState = { spec: spec, onSave: onSave };
    var old = document.getElementById('dlg-share');
    if (old) old.remove();
    document.getElementById('dlg-title').textContent = title;
    dlgFields.innerHTML = spec.map(function (f) {
      if (f.type === 'note') return '<p class="muted">' + esc(f.label) + '</p>';
      var v = values && values[f.name] != null ? values[f.name] : '';
      var req = f.required ? ' required' : '';
      var ph = f.placeholder ? ' placeholder="' + esc(f.placeholder) + '"' : '';
      var input;
      if (f.type === 'textarea') input = '<textarea name="' + f.name + '"' + ph + '>' + esc(v) + '</textarea>';
      else if (f.type === 'select') input = '<select name="' + f.name + '">' + f.options.map(function (o) {
        return '<option value="' + esc(o.value) + '"' + (String(v) === String(o.value) ? ' selected' : '') + '>' + esc(o.label) + '</option>';
      }).join('') + '</select>';
      else if (f.type === 'checkbox') return '<label class="check-row"><input type="checkbox" name="' + f.name + '"' + (v ? ' checked' : '') + '> ' + esc(f.label) + '</label>';
      else if (f.type === 'file') input = '<input name="' + f.name + '" type="file"' + (f.accept ? ' accept="' + esc(f.accept) + '"' : '') + req + '>';
      else input = '<input name="' + f.name + '" type="' + (f.type || 'text') + '" value="' + esc(v) + '"' + ph + req +
        (f.min != null ? ' min="' + f.min + '"' : '') + (f.max != null ? ' max="' + f.max + '"' : '') + (f.step ? ' step="' + f.step + '"' : '') + '>';
      return '<label>' + esc(f.label) + input + '</label>';
    }).join('');
    dlgErr.hidden = true;
    setDlgMode(true);
    dlg.showModal();
  }
  function readForm() {
    var out = {};
    dlgState.spec.forEach(function (f) {
      if (f.type === 'note') return;
      var el = dlgForm.elements[f.name];
      if (!el) return;
      if (f.type === 'file') out[f.name] = el.files && el.files[0] ? el.files[0] : null;
      else out[f.name] = f.type === 'checkbox' ? el.checked : (typeof el.value === 'string' ? el.value.trim() : el.value);
    });
    return out;
  }
  dlgCancel.addEventListener('click', function () {
    if (dlgCancelAction) dlgCancelAction();
    else dlg.close();
  });
  // Pri odomykaní profilu sa dialóg nedá zavrieť bez odomknutia (ESC).
  dlg.addEventListener('cancel', function (e) { if (mustUnlock) e.preventDefault(); });
  function showErr(msg) { dlgErr.textContent = msg; dlgErr.hidden = false; }
  dlgForm.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!dlgState) { dlg.close(); return; }
    var current = dlgState;
    var res = current.onSave(readForm());
    if (res && typeof res.then === 'function') {
      res.then(function (err) {
        if (dlgState !== current) return; // dialóg sa medzitým zmenil (napr. import)
        if (err) showErr(err); else dlg.close();
      }, function (ex) {
        if (dlgState === current) showErr(ex && ex.message ? ex.message : t('dbError'));
      });
      return;
    }
    if (res) { showErr(res); return; }
    dlg.close();
  });

  // Zobrazenie textu (otázky, príprava na návštevu, postup) s tlačidlom Kopírovať.
  function showText(title, text) {
    document.getElementById('dlg-title').textContent = title;
    dlgFields.innerHTML = '<div class="pre">' + esc(text) + '</div>';
    dlgErr.hidden = true;
    setDlgMode(false);
    var copyBtn = document.createElement('button');
    copyBtn.type = 'button'; copyBtn.className = 'btn primary'; copyBtn.textContent = t('copy');
    copyBtn.addEventListener('click', function () {
      if (navigator.clipboard) navigator.clipboard.writeText(text).then(function () { toast(t('copied')); }, function () { toast(t('copyFailed')); });
      else toast(t('noClipboard'));
    });
    dlgFields.appendChild(copyBtn);
    dlg.showModal();
  }

  // ---------- Pohľady ----------
  var views = {};
  var justTaken = null;

  // Dnes: dávky, núdzová karta, upozornenia
  views.today = function () {
    var tod = today(), now = nowTime();
    var doses = HC.medDosesOn(state.meds, state.taken, tod);
    var yesterday = HC.addDays(tod, -1);
    var missedYesterday = HC.missedDoses(HC.medDosesOn(state.meds, state.taken, yesterday), yesterday, tod, now)
      .map(function (d) { return Object.assign({ date: yesterday }, d); });
    var missedToday = HC.missedDoses(doses, tod, tod, now);
    var checkups = state.checkups.map(function (c) { return { c: c, s: HC.checkupStatus(c, tod) }; })
      .filter(function (x) { return x.s.status === 'overdue' || (x.s.days !== null && x.s.days <= 5); });
    var vaccs = state.vaccinations.map(function (v) { return { v: v, s: HC.vaccinationStatus(v, tod) }; })
      .filter(function (x) { return x.s.status === 'overdue' || (x.s.days !== null && x.s.days <= 5); });
    var todayVisits = state.visits.filter(function (v) { return v.date === tod; });
    var horizon = HC.addDays(tod, 5);
    var upcomingVisits = state.visits.filter(function (v) { return v.nextVisit && v.nextVisit >= tod && v.nextVisit <= horizon; })
      .sort(function (a, b) { return a.nextVisit < b.nextVisit ? -1 : 1; });
    var html = '';

    // Súhrn dňa: hotové dávky, ďalšia dávka a séria bez vynechania
    if (state.meds.length && doses.length) {
      var doneN = doses.filter(function (d) { return d.taken; }).length;
      var nextDose = doses.filter(function (d) { return !d.status && d.time >= now; })[0];
      var streak = 0, startDay = doneN === doses.length ? tod : HC.addDays(tod, -1);
      for (var si = 0; si < 365; si++) {
        var sds = HC.medDosesOn(state.meds, state.taken, HC.addDays(startDay, -si));
        if (!sds.length || !sds.every(function (d) { return d.taken; })) break;
        streak++;
      }
      html += '<section class="card hero"><div class="stack">' +
        '<strong>' + (doneN === doses.length ? t('sumAllDone') : esc(t('sumDoses', { done: doneN, total: doses.length }))) + '</strong>' +
        '<div class="progress" style="--p:' + Math.round(doneN / doses.length * 100) + '%"><i></i></div>' +
        '<div class="meta muted"><span>' + (nextDose ? esc(t('sumNext', { time: nextDose.time, name: nextDose.name })) : '') + '</span>' +
        (streak ? '<span>' + esc(t('sumStreak', { n: streak })) + '</span>' : '') + '</div>' +
        '</div></section>';
    }

    // Núdzová karta
    var ice = state.settings.ice || {};
    if (hasICE()) {
      html += '<section class="card ice"><div class="row"><h2>' + t('iceTitle') + '</h2><button class="btn small" data-act="edit-ice">' + t('edit') + '</button></div><div class="stack">' +
        (ice.blood ? '<div><strong>' + t('iceBlood') + '</strong> ' + esc(bloodLabel(ice.blood)) + '</div>' : '') +
        (ice.allergies ? '<div><strong>' + t('iceAllergies') + '</strong> ' + esc(ice.allergies) + '</div>' : '') +
        (ice.conditions ? '<div><strong>' + t('iceConditions') + '</strong> ' + esc(ice.conditions) + '</div>' : '') +
        (ice.contact ? '<div><strong>' + t('iceContact') + '</strong> ' + esc(ice.contact) + '</div>' : '') +
        '</div></section>';
    } else {
      html += '<section class="banner"><div class="row"><div><strong>' + t('iceFillTitle') + '</strong><div class="muted">' + t('iceFillText') + '</div></div><button class="btn small" data-act="edit-ice">' + t('iceFillBtn') + '</button></div></section>';
    }

    // Pripomienky
    if ('Notification' in window && Notification.permission === 'default') {
      html += '<section class="card"><div class="row"><div><strong>' + t('notifyTitle') + '</strong><div class="muted">' + t('notifyText') + '</div></div><button class="btn small primary" data-act="notify">' + t('notifyBtn') + '</button></div></section>';
    } else if ('Notification' in window && Notification.permission === 'denied') {
      html += '<section class="banner"><div class="muted">' + t('notifyDenied') + '</div></section>';
    }

    // Záloha
    if (HC.backupDue(state, state.settings.lastExport, tod)) {
      html += '<section class="banner"><div class="row"><div><strong>' + t('backupTitle') + '</strong><div class="muted">' +
        (state.settings.lastExport ? t('backupLast', { date: fmtDate(state.settings.lastExport) }) : t('backupNone')) +
        '</div></div><button class="btn small" data-act="export-backup">' + t('backupBtn') + '</button></div></section>';
    }

    html += '<section class="card"><div class="section-head"><h2>' + t('todayMeds') + '</h2><span class="muted">' + fmtDate(tod) + '</span></div>';
    if (!state.meds.length) {
      html += '<div class="empty"><span>' + t('noMedsYet') + '</span><button class="btn primary small" data-act="add-med">' + t('add') + '</button></div>';
    } else if (!doses.length) {
      html += '<p class="muted">' + t('noDosesToday') + '</p>';
    } else {
      html += doses.map(function (d) {
        var med = findBy(state.meds, d.medId);
        var missed = !d.status && d.time < now;
        var rt = HC.reminderTime(d, state.snoozes, tod);
        var cls = 'dose' + (missed ? ' missed' : '') + (d.skipped ? ' skipped' : '');
        var sub = esc(d.dose) + (missed ? (d.dose ? ' · ' : '') + t('timePassed') : '') + (d.skipped ? (d.dose ? ' · ' : '') + t('skippedWord') : '') +
          (!d.status && rt !== d.time ? (d.dose || missed || d.skipped ? ' · ' : '') + esc(t('snoozedTo', { time: rt })) : '') +
          (med && HC.lowStock(med) ? ' · <span class="badge warn">' + t('lowStockBadge') + '</span>' : '');
        var snooze = d.status ? '' : '<button class="snooze" data-act="snooze-dose" data-key="' + esc(d.key) + '" data-date="' + tod + '" aria-label="' + esc(t('snoozeBtn')) + '" title="' + esc(t('snoozeBtn')) + '">' +
          '<svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg></button>';
        return '<div class="' + cls + '">' +
          '<div class="time">' + d.time + '</div>' +
          '<div class="info"><div class="name">' + esc(d.name) + '</div><div class="muted">' + sub + '</div></div>' +
          '<div class="dose-btns">' +
          '<button class="check' + (d.taken ? ' on' : '') + (justTaken === d.key + '|' + tod ? ' fresh' : '') + '" data-act="toggle-dose" data-key="' + esc(d.key) + '" data-date="' + tod + '" data-mode="taken" aria-pressed="' + d.taken + '" aria-label="' + esc(t('markTaken', { name: d.name, time: d.time })) + '">' + (d.taken ? CHECK_SVG : '') + '</button>' +
          '<button class="skip' + (d.skipped ? ' on' : '') + '" data-act="toggle-dose" data-key="' + esc(d.key) + '" data-date="' + tod + '" data-mode="skipped" aria-pressed="' + d.skipped + '" aria-label="' + esc(t('markSkipped', { name: d.name, time: d.time })) + '">×</button>' +
          snooze +
          '</div></div>';
      }).join('');
    }
    html += '</section>';

    if (missedToday.length || missedYesterday.length) {
      html += '<section class="banner"><h3>' + t('missedTitle') + '</h3><p class="muted" style="margin:4px 0 8px">' + t('missedText') + '</p>' +
        missedToday.map(function (d) { return '<div>' + t('todayWord') + ' ' + d.time + ' – ' + esc(d.name) + '</div>'; }).join('') +
        missedYesterday.map(function (d) { return '<div>' + t('yesterdayWord') + ' ' + d.time + ' – ' + esc(d.name) + '</div>'; }).join('') +
        '</section>';
    }

    if (todayVisits.length) {
      html += '<section class="card"><h2>' + t('todayVisits') + '</h2><div class="stack">' + todayVisits.map(function (v) {
        return '<div class="row"><div><strong>' + esc(v.doctor || v.specialty) + '</strong><div class="muted">' + esc(v.reason || '') + '</div></div><span class="badge">' + fmtDate(v.date) + '</span></div>';
      }).join('') + '</div></section>';
    }

    if (checkups.length || vaccs.length) {
      html += '<section class="card flag-warn"><h2>' + t('checkupsTitle') + '</h2><div class="stack">' + checkups.map(function (x) {
        var label = x.s.status === 'overdue' ? '<span class="badge danger">' + t('statusOverdue') + '</span>' :
          '<span class="badge warn">' + (x.s.days === 0 ? t('dueToday') : t('inDays', { days: x.s.days })) + '</span>';
        return '<div class="row"><div><strong>' + esc(x.c.name) + '</strong><div class="muted">' + t('dueWord', { date: fmtDate(x.s.dueDate) }) + '</div></div>' + label + '</div>';
      }).join('') + vaccs.map(function (x) {
        var label = x.s.status === 'overdue' ? '<span class="badge danger">' + t('statusOverdue') + '</span>' :
          '<span class="badge warn">' + (x.s.days === 0 ? t('dueToday') : t('inDays', { days: x.s.days })) + '</span>';
        return '<div class="row"><div><strong>' + esc(t('dueVacc', { name: x.v.name })) + '</strong><div class="muted">' + t('dueWord', { date: fmtDate(x.v.nextDate) }) + '</div></div>' + label + '</div>';
      }).join('') + '</div></section>';
    }

    if (upcomingVisits.length) {
      html += '<section class="card"><h2>' + t('upcomingVisits') + '</h2><div class="stack">' + upcomingVisits.slice(0, 3).map(function (v) {
        return '<div class="row"><div><strong>' + esc(v.doctor || v.specialty) + '</strong><div class="muted">' + esc(v.reason || '') + '</div></div><span class="badge">' + fmtDate(v.nextVisit) + '</span></div>';
      }).join('') + '</div></section>';
    }

    var recent = sortBy(state.symptoms, 'date', true).slice(0, 3);
    if (recent.length) {
      html += '<section class="card"><h2>' + t('recentSymptoms') + '</h2><div class="stack">' + recent.map(function (s) {
        return '<div class="row"><div><strong>' + esc(s.name) + '</strong><div class="muted">' + fmtDate(s.date) + (s.time ? ' ' + esc(s.time) : '') + '</div></div><span class="badge">' + s.severity + '/10</span></div>';
      }).join('') + '</div></section>';
    }

    html += '<p class="disclaimer">' + t('disclaimer') + '</p>';
    html += '<p class="muted">' + t('emergencyLine', { number: HC.emergencyNumber(state.settings.emergency) }) + '</p>';
    return html;
  };

  // Lieky
  views.meds = function () {
    var tod = today(), now = nowTime();
    var html = '<div class="section-head"><h1>' + t('tabMeds') + '</h1><button class="btn primary" data-act="add-med">' + t('add') + '</button></div>';
    if (!state.meds.length) return html + '<div class="empty">' + t('medsEmptyHint') + '</div>';
    html += state.meds.map(function (m) {
      var active = HC.medActiveOn(m, tod);
      var badge = m.active === false ? '<span class="badge">' + t('badgePaused') + '</span>' : active ? '<span class="badge ok">' + t('badgeActive') + '</span>' : (m.startDate > tod ? '<span class="badge">' + t('badgePlanned') + '</span>' : '<span class="badge">' + t('badgeEnded') + '</span>');
      var days = HC.daysOfSupply(m);
      var stock = days === null ? '' : '<div class="' + (HC.lowStock(m) ? 'badge warn' : 'muted') + '" style="margin-top:6px;display:inline-block">' + t('stockLeft', { n: m.stock, days: days }) + (HC.lowStock(m) ? ' – ' + t('refillHint') : '') + '</div>';
      var adh = HC.adherence(state, HC.addDays(tod, -29), tod, tod, now, m.id);
      var adhLine = '<div class="muted" style="margin-top:6px">' + t('adherenceLabel') + ' ' +
        (adh.percent === null ? t('adherenceNone') : '<strong>' + adh.percent + ' %</strong> · ' + t('adherenceDetail', { taken: adh.taken, skipped: adh.skipped, missed: adh.missed })) + '</div>';
      return '<section class="card"><div class="row"><div><h3>' + esc(m.name) + '</h3><div class="muted">' + esc(m.dose || t('noDose')) + '</div></div>' + badge + '</div>' +
        '<div class="muted" style="margin-top:8px">' + t('timeLabel') + ' ' + (m.times || []).map(esc).join(', ') + '</div>' +
        '<div class="muted">' + t('fromLabel') + ' ' + (m.startDate ? fmtDate(m.startDate) : t('notSpecified')) + (m.endDate ? ' · ' + t('toLabel') + ' ' + fmtDate(m.endDate) : ' · ' + t('noEnd')) + '</div>' +
        stock + adhLine +
        (m.remindersOff ? '<div class="muted" style="margin-top:4px">' + t('remindersOffBadge') + '</div>' : '') +
        (m.notes ? '<p style="margin-top:6px">' + esc(m.notes) + '</p>' : '') +
        '<div class="form-actions" style="margin-top:10px"><button class="btn small" data-act="toggle-med" data-id="' + esc(m.id) + '">' + (m.active === false ? t('resume') : t('pause')) + '</button>' +
        '<button class="btn small" data-act="toggle-reminders" data-id="' + esc(m.id) + '">' + (m.remindersOff ? t('remindersOn') : t('remindersOff')) + '</button>' +
        '<button class="btn small" data-act="edit-med" data-id="' + esc(m.id) + '">' + t('edit') + '</button>' +
        '<button class="btn small danger" data-act="del-med" data-id="' + esc(m.id) + '">' + t('remove') + '</button></div></section>';
    }).join('');
    return html;
  };

  // Zdravie: príznaky + problémy
  views.symptoms = function () {
    var html = '<div class="section-head"><h1>' + t('symptomsTitle') + '</h1></div>';
    html += '<div class="section-head"><h2>' + t('problemsTitle') + '</h2><button class="btn small" data-act="add-problem">' + t('add') + '</button></div><section class="card">';
    if (!state.problems.length) html += '<p class="muted">' + t('problemsHint') + '</p>';
    html += state.problems.map(function (p) {
      return '<div class="problem-line"><div class="info"><strong>' + esc(p.name) + '</strong> <span class="badge ' + (p.status === 'aktívny' ? 'warn' : 'ok') + '">' + esc(problemStatusLabel(p.status)) + '</span>' +
        '<div class="muted">' + t('sinceLabel') + ' ' + (p.since ? fmtDate(p.since) : t('notStated')) + '</div>' + (p.notes ? '<div>' + esc(p.notes) + '</div>' : '') + '</div>' +
        '<div class="stack"><button class="btn small" data-act="edit-problem" data-id="' + esc(p.id) + '">' + t('edit') + '</button><button class="btn small danger" data-act="del-problem" data-id="' + esc(p.id) + '">' + t('remove') + '</button></div></div>';
    }).join('');
    html += '</section>';

    html += '<div class="section-head"><h2>' + t('symptomsLog') + '</h2><button class="btn small primary" data-act="add-symptom">' + t('logSymptom') + '</button></div>';
    var list = sortBy(state.symptoms, 'date', true);
    if (!list.length) html += '<div class="empty">' + t('symptomsEmpty') + '</div>';
    html += list.map(function (s) {
      var cls = s.severity >= 8 ? 'danger' : s.severity >= 5 ? 'warn' : 'ok';
      var meds = HC.medsBeforeSymptom(state, s, 3);
      var med = s.medId ? findBy(state.meds, s.medId) : null;
      return '<section class="card"><div class="row"><div><strong>' + esc(s.name) + '</strong><div class="muted">' + fmtDate(s.date) + (s.time ? ' · ' + esc(s.time) : '') + (s.duration ? ' · ' + t('lastsLabel') + ' ' + esc(s.duration) : '') + '</div></div><span class="badge ' + cls + '">' + s.severity + '/10</span></div>' +
        (med ? '<div class="badge warn" style="margin-top:6px">' + esc(t('sideEffectOf', { name: med.name })) + '</div>' : '') +
        (meds.length ? '<div class="muted" style="margin-top:6px">' + t('medsLast3') + ' ' + meds.map(esc).join(', ') + '</div>' : '') +
        (s.notes ? '<p style="margin-top:6px">' + esc(s.notes) + '</p>' : '') +
        '<div class="form-actions" style="margin-top:8px"><button class="btn small" data-act="edit-symptom" data-id="' + esc(s.id) + '">' + t('edit') + '</button><button class="btn small danger" data-act="del-symptom" data-id="' + esc(s.id) + '">' + t('remove') + '</button></div></section>';
    }).join('');
    return html;
  };

  // Merania: krvný tlak, tep, hmotnosť, glykémia, teplota a výsledky vyšetrení s trendom
  views.measure = function () {
    var tod = today();
    var from = HC.addDays(tod, -90);
    var html = '<div class="section-head"><h1>' + t('measureTitle') + '</h1><div class="stack inline"><button class="btn small" data-act="csv-measure">' + t('csvBtn') + '</button><button class="btn small primary" data-act="add-measure">' + t('addMeasure') + '</button></div></div>';
    html += '<div class="stack inline">' + Object.keys(HC.MEASURE_TYPES).map(function (k) {
      return '<button class="chip' + (k === measureType ? ' on' : '') + '" data-act="set-mtype" data-type="' + k + '">' + esc(measureLabel(k)) + '</button>';
    }).join('') + '</div>';
    var ty = HC.MEASURE_TYPES[measureType];
    var series = HC.measurementSeries(state.measurements, measureType, from, tod);
    var chartSeries = [{ color: 'var(--accent)', points: series.map(function (p) { return { x: p.date, y: p.value }; }) }];
    if (ty.two) chartSeries.push({ color: 'var(--danger)', points: series.map(function (p) { return { x: p.date, y: p.value2 }; }) });
    html += '<section class="card"><h2>' + esc(measureLabel(measureType)) + ' (' + ty.unit + ') · ' + t('period90') + '</h2>' +
      lineChart(chartSeries, from, tod) +
      (ty.two ? '<div class="chart-legend"><span style="color:var(--accent)">' + t('fValue') + '</span><span style="color:var(--danger)">' + t('fValue2') + '</span></div>' : '') + '</section>';

    var entries = sortBy(state.measurements.filter(function (m) { return m.type === measureType; }), 'date', true).slice(0, 30);
    if (!entries.length) html += '<div class="empty">' + t('measureEmpty') + '</div>';
    html += entries.map(function (m, i) {
      return '<section class="card"><div class="row"><div><strong class="' + (i ? '' : 'big-val') + '">' + esc(measureText(m)) + '</strong><div class="muted">' + fmtDate(m.date) + (m.time ? ' · ' + esc(m.time) : '') + (m.notes ? ' · ' + esc(m.notes) : '') + '</div></div>' +
        '<div class="stack inline"><button class="btn small" data-act="edit-measure" data-id="' + esc(m.id) + '">' + t('edit') + '</button><button class="btn small danger" data-act="del-measure" data-id="' + esc(m.id) + '">' + t('remove') + '</button></div></div></section>';
    }).join('');

    // Výsledky vyšetrení
    html += '<div class="section-head" style="margin-top:10px"><h2>' + t('labsTitle') + '</h2><button class="btn small primary" data-act="add-lab">' + t('addLab') + '</button></div>';
    if (!state.labs.length) html += '<div class="empty">' + t('labsEmpty') + '</div>';
    html += HC.labNames(state.labs).map(function (name) {
      var list = HC.labSeries(state.labs, name);
      var last = list[list.length - 1];
      var st = HC.labStatus(last);
      var stBadge = st === 'low' ? '<span class="badge warn">' + t('labLow') + '</span>' : st === 'high' ? '<span class="badge danger">' + t('labHigh') + '</span>' : st === 'ok' ? '<span class="badge ok">' + t('labOk') + '</span>' : '';
      var chart = list.length > 1 ? '<h3 style="margin-top:8px">' + t('trendTitle') + '</h3>' + lineChart([{ color: 'var(--accent)', points: list.map(function (l) { return { x: l.date, y: Number(l.value) }; }) }], list[0].date, tod) : '';
      return '<section class="card"><div class="row"><div><h3>' + esc(name) + '</h3><div class="muted">' + t('latestWord') + ': ' + esc(fmtNum(last.value)) + ' ' + esc(last.unit || '') + ' · ' + fmtDate(last.date) + '</div></div>' + stBadge + '</div>' +
        chart +
        '<div class="stack" style="margin-top:8px">' + list.slice().reverse().map(function (l) {
          return '<div class="row muted"><span>' + fmtDate(l.date) + ' – ' + esc(fmtNum(l.value)) + ' ' + esc(l.unit || '') +
            (l.refLow != null || l.refHigh != null ? ' (' + esc(l.refLow != null ? fmtNum(l.refLow) : '') + '–' + esc(l.refHigh != null ? fmtNum(l.refHigh) : '') + ')' : '') + '</span>' +
            '<span class="stack inline"><button class="btn small" data-act="edit-lab" data-id="' + esc(l.id) + '">' + t('edit') + '</button><button class="btn small danger" data-act="del-lab" data-id="' + esc(l.id) + '">' + t('remove') + '</button></span></div>';
        }).join('') + '</div></section>';
    }).join('');
    return html;
  };

  // Lekár: otázky, návštevy, kontakty, prílohy, prehľad

  // ---------- Nastavenia, profily, jazyk a údaje ----------
  // Zoznam krajín s tiesňovým číslom; názvy krajín podľa jazyka prehliadača (Intl.DisplayNames).
  function emergencyOptions() {
    var htmlLang = I18N.info(I18N.lang()).htmlLang;
    var dn = null;
    try { dn = new Intl.DisplayNames([htmlLang], { type: 'region' }); } catch (e) { dn = null; }
    var cur = state.settings.emergency || '';
    var opts = Object.keys(HC.EMERGENCY_NUMBERS).map(function (code) {
      var name = dn ? (dn.of(code) || code) : code;
      return { value: code, label: name + ' – ' + HC.EMERGENCY_NUMBERS[code] };
    }).sort(function (a, b) { return a.label.localeCompare(b.label, htmlLang); });
    opts.unshift({ value: '', label: t('emergencyDefault') });
    return opts.map(function (o) {
      return '<option value="' + esc(o.value) + '"' + (o.value === cur ? ' selected' : '') + '>' + esc(o.label) + '</option>';
    }).join('');
  }
