<title>Parley</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one-screen chat app — slim header with scenario + level, scrolling transcript, composer pinned to the bottom. */
:root {
  --bg: #eef2f4;
  --surface: #ffffff;
  --ink: #17242b;
  --muted: #5b6b73;
  --line: #d5dee2;
  --accent: #0f6e78;
  --accent-ink: #ffffff;
  --tutor: #ffffff;
  --me: #d9eef0;
  --bad: #b3261e;
  --good: #1d7a3a;
  --tip: #fff4c2;
  --tip-ink: #4a3d00;
  --stage-top: #dce9ec;
  --stage-disc: #c9dfe3;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f171b; --surface: #172227; --ink: #e3ecef; --muted: #93a6ae; --line: #2a3a41;
    --accent: #4fc1cc; --accent-ink: #062126; --tutor: #172227; --me: #12363b;
    --bad: #ff8a80; --good: #7fd69a; --tip: #3a3312; --tip-ink: #f3e3a0;
    --stage-top: #14262b; --stage-disc: #1d353b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f171b; --surface: #172227; --ink: #e3ecef; --muted: #93a6ae; --line: #2a3a41;
  --accent: #4fc1cc; --accent-ink: #062126; --tutor: #172227; --me: #12363b;
  --bad: #ff8a80; --good: #7fd69a; --tip: #3a3312; --tip-ink: #f3e3a0;
  --stage-top: #14262b; --stage-disc: #1d353b;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.5 var(--font-body);
  display: flex; flex-direction: column;
}
* { box-sizing: border-box; }
button, select, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header {
  padding: 12px 16px 10px; border-bottom: 1px solid var(--line); background: var(--surface);
  display: flex; flex-direction: column; gap: 10px;
}
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; letter-spacing: -0.02em; margin: 0; }
.brand span { color: var(--accent); }
.top .spacer { flex: 1; }
.ctrl { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--muted); }
select, .ghost {
  border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 10px;
}
.ghost:hover { border-color: var(--accent); }
.ghost[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.badge { display: inline-block; min-width: 1.4em; padding: 0 6px; border-radius: 999px; background: var(--bad); color: var(--surface); font-size: 0.75rem; font-weight: 700; text-align: center; margin-left: 4px; }
.scen { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.scen button {
  flex: none; border: 1px solid var(--line); background: transparent; border-radius: 999px;
  padding: 5px 12px; font-size: 0.9rem; white-space: nowrap;
}
.scen button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.stage { flex: 1; min-height: 0; display: grid; grid-template-rows: auto 1fr; }
.coach {
  display: flex; align-items: center; gap: 14px; padding: 10px 16px;
  background: linear-gradient(180deg, var(--stage-top), var(--bg)); border-bottom: 1px solid var(--line);
}
.coach svg { width: 112px; height: 112px; flex: none; border-radius: 50%; background: var(--stage-disc); }
.coach .who { min-width: 0; }
.coach .name { font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; margin: 0; }
.coach .status { font-size: 0.9rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.coach[data-state="speaking"] .dot { background: var(--good); }
.coach[data-state="thinking"] .dot { background: var(--accent); }
.coach .pick { margin-top: 6px; }
@media (min-width: 880px) {
  .stage { grid-template-rows: none; grid-template-columns: 300px 1fr; }
  .coach { flex-direction: column; justify-content: flex-start; padding: 28px 20px; border-bottom: none; border-right: 1px solid var(--line); text-align: center; }
  .coach svg { width: 240px; height: 240px; }
  .coach .status { justify-content: center; }
}
.coach canvas { width: 112px; height: 112px; flex: none; border-radius: 50%; background: var(--stage-disc); transform-origin: 50% 90%; }
@media (min-width: 880px) { .coach canvas { width: 240px; height: 240px; } }
@media (prefers-reduced-motion: no-preference) {
  #photo { animation: photoBreathe 5s ease-in-out infinite; }
  .coach[data-state="speaking"] #photo { animation: photoNod 2.2s ease-in-out infinite; }
}
@keyframes photoBreathe { 50% { transform: translateY(0.6px) scale(1.004); } }
@keyframes photoNod { 30% { transform: translateY(1px) scale(1.006); } 70% { transform: translateY(-0.4px); } }
#av .head { transform-box: view-box; transform-origin: 120px 190px; }
#av .eye { transform-box: fill-box; transform-origin: center; transition: transform .07s; }
#av.blink .eye { transform: scaleY(0.08); }
#av .pupil { transition: transform .35s ease; }
@media (prefers-reduced-motion: no-preference) {
  #av .head { animation: breathe 4.5s ease-in-out infinite; }
  .coach[data-state="speaking"] #av .head { animation: nod 1.6s ease-in-out infinite; }
}
@keyframes breathe { 50% { transform: translateY(1.5px) rotate(-0.6deg); } }
@keyframes nod { 25% { transform: rotate(1.2deg) translateY(1px); } 75% { transform: rotate(-1deg); } }
main { min-height: 0; overflow-y: auto; padding: 16px; }
.log { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.role { font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.msg { display: flex; flex-direction: column; max-width: 88%; min-width: 0; }
.msg.tutor { align-self: flex-start; }
.msg.me { align-self: flex-end; align-items: flex-end; }
.bubble { padding: 10px 14px; border-radius: 14px; overflow-wrap: anywhere; }
.tutor .bubble { background: var(--tutor); border: 1px solid var(--line); border-top-left-radius: 4px; }
.me .bubble { background: var(--me); border-top-right-radius: 4px; }
.bubble.wait { color: var(--muted); font-style: italic; }
.tools { display: flex; gap: 6px; margin-top: 4px; }
.tools button { border: none; background: none; color: var(--accent); font-size: 0.85rem; padding: 2px 4px; }
.fix {
  margin-top: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 12px; font-size: 0.92rem; display: flex; flex-direction: column; gap: 6px; max-width: 100%;
}
.fix.ok { color: var(--good); }
.fix .pair { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.fix del { color: var(--bad); text-decoration-thickness: 2px; }
.fix ins { color: var(--good); text-decoration: none; font-weight: 700; }
.fix .why { color: var(--muted); font-size: 0.85rem; width: 100%; }
.tip { background: var(--tip); color: var(--tip-ink); border-radius: 8px; padding: 6px 10px; font-size: 0.88rem; }
.err { align-self: center; color: var(--bad); font-size: 0.9rem; text-align: center; max-width: 60ch; }

.ideas { max-width: 760px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 6px; }
.ideas button { border: 1px dashed var(--accent); background: transparent; color: var(--ink); border-radius: 10px; padding: 6px 10px; text-align: left; font-size: 0.92rem; }

footer { background: var(--surface); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
.composer { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
textarea {
  flex: 1; min-width: 0; resize: none; border: 1px solid var(--line); border-radius: 12px; background: var(--bg);
  padding: 10px 12px; max-height: 140px; line-height: 1.4;
}
.send { background: var(--accent); color: var(--accent-ink); border: none; border-radius: 12px; padding: 10px 16px; font-weight: 700; }
.send:disabled { opacity: 0.5; cursor: default; }
.round { border: 1px solid var(--line); background: var(--bg); border-radius: 12px; width: 44px; height: 44px; flex: none; display: grid; place-items: center; }
.round svg { width: 20px; height: 20px; }
.round.on { background: var(--bad); color: var(--surface); border-color: var(--bad); }
.hint { max-width: 760px; margin: 6px auto 0; font-size: 0.78rem; color: var(--muted); }

dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); width: min(560px, calc(100% - 32px)); max-height: 80vh; padding: 0; }
dialog::backdrop { background: rgb(0 0 0 / 0.4); }
.dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line); gap: 8px; }
.dlg-head h2 { font-family: var(--font-display); margin: 0; font-size: 1.2rem; }
.dlg-body { padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
.empty { color: var(--muted); }
.range { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
@media (prefers-reduced-motion: no-preference) { .msg { animation: pop .18s ease-out; } }
@keyframes pop { from { transform: translateY(4px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (max-width: 480px) { .msg { max-width: 94%; } .ctrl .lbl { display: none; } }
</style>

<header>
  <div class="top">
    <h1 class="brand">Par<span>ley</span></h1>
    <div class="spacer"></div>
    <label class="ctrl"><span class="lbl">Úroveň</span>
      <select id="level" aria-label="Úroveň angličtiny">
        <option value="A2">A2 – začiatočník</option>
        <option value="B1">B1 – mierne pokročilý</option>
        <option value="B2">B2 – pokročilý</option>
        <option value="C1">C1 – veľmi pokročilý</option>
      </select>
    </label>
    <button class="ghost" id="ttsBtn" aria-pressed="true" title="Čítať odpovede nahlas">Nahlas</button>
    <button class="ghost" id="mistakesBtn">Moje chyby<span class="badge" id="mCount" hidden>0</span></button>
    <button class="ghost" id="resetBtn" title="Začať rozhovor odznova">Nový</button>
  </div>
  <div class="scen" id="scen" role="group" aria-label="Situácia"></div>
</header>

<div class="stage">
  <aside class="coach" id="coach" data-state="idle">
    <svg id="av" viewBox="0 0 240 240" role="img" aria-label="Lektor">
      <defs>
        <radialGradient id="skinG" cx="45%" cy="38%" r="70%">
          <stop offset="0%" id="skinHi"/><stop offset="100%" id="skinLo"/>
        </radialGradient>
        <clipPath id="disc"><circle cx="120" cy="120" r="120"/></clipPath>
        <clipPath id="mouthClip"><path id="mouthClipPath" d=""/></clipPath>
      </defs>
      <g clip-path="url(#disc)">
        <g class="head">
          <path id="hairBack" d=""/>
          <path id="shirt" d="M22 250 C30 200 72 182 120 182 C168 182 210 200 218 250 Z"/>
          <path id="collar" d=""/>
          <path class="skin" d="M102 140 L138 140 L140 186 Q120 198 100 186 Z"/>
          <path d="M101 160 Q120 172 139 160 L139 170 Q120 180 101 170 Z" id="neckShade" opacity="0.18"/>
          <ellipse class="skin" cx="67" cy="106" rx="9" ry="14"/>
          <ellipse class="skin" cx="173" cy="106" rx="9" ry="14"/>
          <ellipse cx="120" cy="100" rx="53" ry="63" fill="url(#skinG)"/>
          <ellipse cx="94" cy="122" rx="9" ry="5" id="blushL" opacity="0.25"/>
          <ellipse cx="146" cy="122" rx="9" ry="5" id="blushR" opacity="0.25"/>
          <g class="eye"><ellipse cx="99" cy="101" rx="11" ry="7.5" fill="#fbfbf8"/>
            <g class="pupil"><circle cx="99" cy="101" r="5.6" class="iris"/><circle cx="99" cy="101" r="2.7" fill="#14100e"/><circle cx="101" cy="99" r="1.4" fill="#fff"/></g>
            <path d="M88 99 Q99 91 110 99" fill="none" class="lash" stroke-width="2.2" stroke-linecap="round"/></g>
          <g class="eye"><ellipse cx="141" cy="101" rx="11" ry="7.5" fill="#fbfbf8"/>
            <g class="pupil"><circle cx="141" cy="101" r="5.6" class="iris"/><circle cx="141" cy="101" r="2.7" fill="#14100e"/><circle cx="143" cy="99" r="1.4" fill="#fff"/></g>
            <path d="M130 99 Q141 91 152 99" fill="none" class="lash" stroke-width="2.2" stroke-linecap="round"/></g>
          <path id="browL" d="M86 87 Q99 80 112 85" fill="none" stroke-width="3.6" stroke-linecap="round" class="brow"/>
          <path id="browR" d="M128 85 Q141 80 154 87" fill="none" stroke-width="3.6" stroke-linecap="round" class="brow"/>
          <path d="M121 104 Q118 117 113 123 Q120 127 127 123" fill="none" id="nose" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
          <path id="mouth" d="" fill="#4b1c22"/>
          <rect x="100" y="126" width="40" height="7" fill="#f7f4ef" clip-path="url(#mouthClip)"/>
          <path id="lips" d="" fill="none" stroke-width="2.6" stroke-linejoin="round"/>
          <path id="hairFront" d=""/>
        </g>
      </g>
    </svg>
    <canvas id="photo" width="360" height="360" role="img" aria-label="Lektor s vašou tvárou" hidden></canvas>
    <div class="who">
      <p class="name" id="tName">Emma</p>
      <div class="status"><span class="dot"></span><span id="tStatus">Čaká na vás</span></div>
      <label class="ctrl pick"><span>Lektor</span>
        <select id="tutorSel" aria-label="Vybrať lektora">
          <option value="me">Vaša tvár (britská angličtina)</option>
          <option value="emma">Emma (britská angličtina)</option>
          <option value="james">James (americká angličtina)</option>
        </select>
      </label>
    </div>
  </aside>
  <main id="main"><div class="log" id="log" aria-live="polite"></div></main>
</div>

<footer>
  <div class="ideas" id="ideas"></div>
  <form class="composer" id="form">
    <button type="button" class="round" id="ideaBtn" title="Neviem, čo povedať – navrhni odpovede" aria-label="Navrhni odpovede">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>
    </button>
    <button type="button" class="round" id="micBtn" title="Hovoriť" aria-label="Hovoriť do mikrofónu" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <textarea id="input" rows="1" placeholder="Napíšte po anglicky… (aj po slovensky, ak neviete ako)" aria-label="Vaša správa"></textarea>
    <button class="send" id="send" type="submit">Poslať</button>
  </form>
  <p class="hint" id="hint">Tip: na Androide ťuknite na mikrofón na klávesnici a hovorte – text sa prepíše sám.</p>
</footer>

<dialog id="dlg">
  <div class="dlg-head"><h2>Moje chyby</h2><button class="ghost" id="dlgClose">Zavrieť</button></div>
  <div class="dlg-body">
    <div class="range"><label for="rate">Rýchlosť čítania</label><input id="rate" type="range" min="0.6" max="1.2" step="0.1" value="0.9"><span id="rateVal">0.9×</span></div>
    <div id="mList"></div>
    <button class="ghost" id="mClear" hidden>Vymazať zoznam</button>
  </div>

<script>

  turns: [],

};
if (!SCENARIOS[state.scenario]) state.scenario = "free";

const $ = id => document.getElementById(id);

let sample = null, busy = false, ctl = null;
// claude.use() answers only after the page's first run (up to ~10 s), so every action awaits it instead of

const sampleReady = (async () => {

})();
async function getSample() { return sample || (sample = await sampleReady); }
function noSampleText() {

}

const av = $("av"), coach = $("coach");
function tutor() { return TUTORS[state.tutor] || TUTORS.emma; }
function paintTutor() {
  const t = tutor(), c = t.c, q = s => av.querySelectorAll(s);
  av.toggleAttribute("hidden", !!t.photo); $("photo").hidden = !t.photo;   // SVG elements have no .hidden property
  if (t.photo) { $("tName").textContent = t.name; pickVoice(); photoDirty = true; return; }
  $("skinHi").setAttribute("stop-color", c.skinHi); $("skinLo").setAttribute("stop-color", c.skinLo);
  q(".skin").forEach(e => e.setAttribute("fill", c.skin));
  q(".iris").forEach(e => e.setAttribute("fill", c.iris));
  q(".brow").forEach(e => e.setAttribute("stroke", c.brow));
  q(".lash").forEach(e => e.setAttribute("stroke", c.lash));

  $("blushL").setAttribute("fill", c.blush); $("blushR").setAttribute("fill", c.blush);
  $("nose").setAttribute("stroke", c.nose);

  $("hairFront").setAttribute("d", t.front); $("hairFront").setAttribute("fill", c.hair);

function setMouth(h) {
  const top = 132.5 - h * 0.25, side = 131 - h * 0.15;
  const d = `M104 134 Q112 ${side} 120 ${top} Q128 ${side} 136 134 Q120 ${138 + h * 1.15} 104 134 Z`;

}
function setStatus(s) {
  coach.dataset.state = s;

}
const pupils = () => av.querySelectorAll(".pupil");
function lookAt(x, y) { pupils().forEach(p => p.style.transform = `translate(${x}px, ${y}px)`); }
let speaking = false, fakeUntil = 0, mouthH = 0, target = 0, nextSyl = 0;
function talkLoop(now) {
  const talking = speaking || now < fakeUntil;
  if (talking && now > nextSyl) {
    target = Math.random() < 0.18 ? 0.5 : 2 + Math.random() * 7;
    nextSyl = now + 70 + Math.random() * 90;
  }
  if (!talking) target = 0;
  mouthH += (target - mouthH) * 0.35;
  if (tutor().photo) renderPhoto(mouthH); else setMouth(mouthH);
  if (!talking && coach.dataset.state === "speaking") setStatus("idle");
  requestAnimationFrame(talkLoop);
}
(function blinkLoop() {
  setTimeout(() => {
    av.classList.add("blink"); blinkAt = performance.now();
    setTimeout(() => av.classList.remove("blink"), 130);
    blinkLoop();
  }, 2200 + Math.random() * 3200);
})();

/* ---------- photo tutor: the viewer's own face, with a moving jaw and blinking eyes ---------- */
// Landmarks measured on the 360×360 crop (face360.jpg). The head is tilted, so the lip line and eyes slope.
const FACE = {
  mouth: { cx: 185, ly: 259, tilt: 0.22, half: 42, chin: 338 },
  eyes: [{ cx: 158, cy: 141, rx: 25, ry: 8, tilt: 0.15 }, { cx: 251, cy: 166, rx: 27, ry: 8, tilt: 0.15 }]
};
const pctx = $("photo").getContext("2d", { willReadFrequently: true });
let baseData = null, photoDirty = true, blinkAt = 0, lastH = -1, lastC = -1;
const faceImg = new Image();
faceImg.onload = () => {
  const c = document.createElement("canvas"); c.width = c.height = 360;
  const x = c.getContext("2d"); x.drawImage(faceImg, 0, 0, 360, 360);
  baseData = x.getImageData(0, 0, 360, 360);
  photoDirty = true;
};
faceImg.src = $("faceData").textContent.trim();
const smooth = (e0, e1, v) => { const t = Math.min(1, Math.max(0, (v - e0) / (e1 - e0))); return t * t * (3 - 2 * t); };
function sampleY(src, x, y, out) {           // vertical linear interpolation of one column
  y = Math.min(358.999, Math.max(0, y));
  const y0 = y | 0, t = y - y0, a = (y0 * 360 + x) * 4, b = a + 1440;
  out[0] = src[a] + (src[b] - src[a]) * t; out[1] = src[a + 1] + (src[b + 1] - src[a + 1]) * t; out[2] = src[a + 2] + (src[b + 2] - src[a + 2]) * t;
  return out;
}
function renderPhoto(h) {
  if (!baseData) return;
  const bt = (performance.now() - blinkAt) / 170;          // blink: lids close and open over ~170 ms
  const c = bt >= 0 && bt < 1 ? Math.sin(bt * Math.PI) : 0;
  if (!photoDirty && Math.abs(h - lastH) < 0.05 && Math.abs(c - lastC) < 0.02) return;
  photoDirty = false; lastH = h; lastC = c;
  if (h < 0.1 && c === 0) { pctx.putImageData(baseData, 0, 0); return; }
  const img = new ImageData(new Uint8ClampedArray(baseData.data), 360, 360);
  if (h >= 0.1) warpJaw(img.data, Math.min(h * 0.6, 5.6));
  if (c > 0) closeLids(img.data, c);
  pctx.putImageData(img, 0, 0);
}
function warpJaw(o, a) {
  const src = baseData.data, M = FACE.mouth, px = [0, 0, 0];
  const TOP = [118, 74, 70], MID = [42, 16, 18], BOT = [92, 40, 42];
  for (let x = M.cx - 80; x < M.cx + 80; x++) {
    const ly = M.ly + (x - M.cx) * M.tilt;
    const ax = Math.abs(x - M.cx) / M.half, g = ax < 1 ? a * (1 - ax * ax) ** 1.4 : 0;   // lip gap, lens-shaped
    const aj = Math.min(Math.abs(x - M.cx) / 78, 1), jaw = a * 0.85 * Math.cos(aj * Math.PI / 2) ** 2; // chin moves as a block
    for (let y = Math.floor(ly) - 22; y < 360; y++) {
      let sy, cov = 0, depth = 1;
      if (y >= ly) {
        const s = smooth(ly, ly + 22, y);
        let d = (1 - s) * g + s * jaw;
        if (y > M.chin) d *= Math.max(0, 1 - (y - M.chin) / (360 - M.chin));
        sy = y - d;
        if (g > 0.05) { cov = Math.min(1, Math.max(0, ly - sy)); depth = (y - ly) / g; }
        sampleY(src, x, Math.max(sy, ly + 0.5), px);
      } else {
        sy = y + 0.22 * g * Math.max(0, 1 - (ly - y) / 22);
        if (g > 0.05) { cov = Math.min(1, Math.max(0, sy - ly + 1)); depth = 0; }
        sampleY(src, x, Math.min(sy, ly - 0.5), px);
      }
      if (cov > 0) {
        const dp = Math.min(1, Math.max(0, depth)), col = [0, 0, 0];
        for (let i = 0; i < 3; i++) {
          col[i] = dp < 0.35 ? TOP[i] + (MID[i] - TOP[i]) * dp / 0.35 : MID[i] + (BOT[i] - MID[i]) * (dp - 0.35) / 0.65;
          if (a < 3.5) col[i] = MID[i] * 0.8 + TOP[i] * 0.2 * (1 - dp);
          px[i] = px[i] * (1 - cov) + col[i] * cov;
        }
      } else if (g > 0.3 && y >= ly && y - (ly + g) >= 0 && y - (ly + g) < 2.5) {
        px[0] *= 0.86; px[1] *= 0.86; px[2] *= 0.86;      // soft shadow under the upper lip
      }
      const i = (y * 360 + x) * 4; o[i] = px[0]; o[i + 1] = px[1]; o[i + 2] = px[2];
    }
  }
}
function closeLids(o, c) {
  const src = baseData.data, px = [0, 0, 0];
  for (const e of FACE.eyes) {
    const x0 = e.cx - e.rx - 4, x1 = e.cx + e.rx + 5, raw = [];
    for (let x = x0; x < x1; x++) {                     // lid colour = skin just above the eye, blurred sideways
      const cy = e.cy + (x - e.cx) * e.tilt, acc = [0, 0, 0];
      for (let k = 0; k < 4; k++) { sampleY(src, x, cy - e.ry - 6 + k, px); acc[0] += px[0] / 4; acc[1] += px[1] / 4; acc[2] += px[2] / 4; }
      raw.push(acc);
    }
    for (let x = x0; x < x1; x++) {
      const u = (x - e.cx) / (e.rx + 3);
      if (Math.abs(u) >= 1) continue;
      const lid = [0, 0, 0]; let n = 0;
      for (let k = Math.max(0, x - x0 - 4); k <= Math.min(raw.length - 1, x - x0 + 4); k++) { lid[0] += raw[k][0]; lid[1] += raw[k][1]; lid[2] += raw[k][2]; n++; }
      const mask = smooth(1, 0.75, Math.abs(u)), cy = e.cy + (x - e.cx) * e.tilt, span = e.ry * Math.sqrt(1 - u * u);
      const top = cy - span - 2, bot = cy + span + 1, edge = top + c * (bot - top);
      for (let y = Math.floor(top) - 1; y < edge + 2; y++) {
        const cover = Math.min(1, Math.max(0, edge - y + 0.5)) * Math.min(1, Math.max(0, y - top + 1.5));
        if (cover <= 0) continue;
        let shade = 1 - 0.12 * (y - top) / Math.max(edge - top, 1);
        if (c > 0.3 && edge - y < 1.5) shade *= 0.6;          // lash line
        const m = mask * cover, i = (y * 360 + x) * 4;
        for (let k = 0; k < 3; k++) o[i + k] = o[i + k] * (1 - m) + (lid[k] / n) * shade * m;
      }
    }
  }
}
setInterval(() => { if (coach.dataset.state !== "thinking") lookAt(Math.random() * 3 - 1.5, Math.random() * 2 - 1); }, 2600);

/* ---------- speech out ---------- */
let voice = null;
function pickVoice() {
  if (!("speechSynthesis" in window)) return;
  const t = tutor(), vs = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
  const sameLang = vs.filter(v => v.lang.replace("_", "-").toLowerCase() === t.lang.toLowerCase());
  const g = t.female ? /female|woman|samantha|serena|kate|libby|sonia|emma|aria|jenny/i : /\bmale|man\b|daniel|ryan|guy|george|james|david|mark/i;
  const good = /google|natural|online|enhanced|premium/i;
  voice = sameLang.find(v => g.test(v.name) && good.test(v.name)) || sameLang.find(v => g.test(v.name))
       || vs.find(v => g.test(v.name)) || sameLang.find(v => good.test(v.name)) || sameLang[0] || vs[0] || null;
}
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text) {
  setStatus("speaking");
  fakeUntil = performance.now() + Math.min(12000, 600 + text.length * 55);
  if (!("speechSynthesis" in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = voice?.lang || tutor().lang; if (voice) u.voice = voice; u.rate = state.rate; u.pitch = tutor().pitch;
    u.onstart = () => { speaking = true; fakeUntil = 0; setStatus("speaking"); };
    u.onboundary = () => { target = 8; nextSyl = performance.now() + 110; };
    u.onend = u.onerror = () => { speaking = false; };
    speechSynthesis.speak(u);
  } catch {}
}
function silentTalk(text) { setStatus("speaking"); fakeUntil = performance.now() + Math.min(6000, 400 + text.length * 40); }

/* ---------- rendering ---------- */
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function scrollDown() { main.scrollTop = main.scrollHeight; }

function renderTutor(text) {
  const m = el("div", "msg tutor");
  m.append(el("div", "role", "Tutor"));
  m.append(el("div", "bubble", text));
  const t = el("div", "tools");
  const say = el("button", null, "▶ Prehrať"); say.type = "button"; say.onclick = () => speak(text);
  const tr = el("button", null, "Preložiť"); tr.type = "button";
  tr.onclick = () => translate(text, m, tr);
  t.append(say, tr); m.append(t);
  log.append(m); scrollDown();
  return m;
}
function renderMe(text) {
  const m = el("div", "msg me");
  m.append(el("div", "role", "Vy"));
  m.append(el("div", "bubble", text));
  log.append(m); scrollDown();
  return m;
}
function renderFix(m, corrections, tip) {
  const box = el("div", "fix" + (corrections.length ? "" : " ok"));
  if (!corrections.length) box.textContent = "Bez chýb, výborne!";
  for (const c of corrections) {
    const p = el("div", "pair");
    if (c.original) p.append(el("del", null, c.original), el("span", null, "→"));
    p.append(el("ins", null, c.better || ""));
    if (c.why) p.append(el("span", "why", c.why));
    box.append(p);
  }
  if (tip) box.append(el("div", "tip", tip));
  m.append(box); scrollDown();
}
function renderScenarios() {
  const wrap = $("scen"); wrap.textContent = "";
  for (const [k, s] of Object.entries(SCENARIOS)) {
    const b = el("button", null, s.label); b.type = "button";
    b.setAttribute("aria-pressed", String(k === state.scenario));
    b.onclick = () => { if (busy) return; state.scenario = k; store.set("scenario", k); renderScenarios(); startChat(); };
    wrap.append(b);
  }
}
function renderMistakes() {
  const n = state.mistakes.length, badge = $("mCount");
  badge.hidden = !n; badge.textContent = n;
  const list = $("mList"); list.textContent = "";
  $("mClear").hidden = !n;
  if (!n) { list.append(el("p", "empty", "Zatiaľ žiadne opravy. Keď tutor niečo opraví, uloží sa to sem, aby ste si to mohli zopakovať.")); return; }
  for (const c of state.mistakes.slice().reverse()) {
    const box = el("div", "fix");
    const p = el("div", "pair");
    if (c.original) p.append(el("del", null, c.original), el("span", null, "→"));
    p.append(el("ins", null, c.better));
    if (c.why) p.append(el("span", "why", c.why));
    box.append(p); list.append(box);
  }
}
function showError(text) { log.append(el("div", "err", text)); scrollDown(); }
function errCopy(code) {
  return ({
    not_granted: "Tutor potrebuje povolenie používať Claude. Obnovte stránku a povoľte ho.",
    sampling_disabled: "Claude nie je pre tento účet dostupný.",
    rate_limited: "Príliš veľa správ naraz alebo ste dosiahli limit. Skúste to o chvíľu.",
    session_expired: "Prihlásenie vypršalo. Prihláste sa znova do claude.ai.",
    refused: "Na túto správu tutor neodpovie. Skúste to povedať inak.",
    invalid_json: "Odpoveď sa nepodarilo spracovať. Pošlite správu znova."
  })[code] || "Spojenie zlyhalo. Skúste správu poslať znova.";
}

/* ---------- conversation ---------- */
function rules() {
  const s = SCENARIOS[state.scenario];
  const t = tutor();
  return `You are ${t.aiName ? t.aiName + ", an" : "an"} English conversation tutor for a Slovak speaker. Speak ${t.lang === "en-GB" ? "British" : "American"} English. Role-play: you are ${s.role}. Stay in that role.
Learner's level: ${state.level} (CEFR). Use vocabulary and sentence length suitable for that level.
Each reply: 1-3 natural spoken sentences, then usually a question that keeps the conversation going. Never lecture inside "reply".
Check ONLY the learner's latest message for grammar, wrong words and unnatural phrasing. If it contains Slovak words or is written in Slovak, give the natural English version as a correction and still reply in English.
Ignore capitalisation and missing final punctuation. If the message is natural and correct, return an empty corrections array.
Answer ONLY with JSON in this exact shape:
{"reply":"your in-role English reply","corrections":[{"original":"learner's wrong fragment","better":"corrected natural English","why":"krátke vysvetlenie po slovensky"}],"tip":"optional short tip in Slovak about a useful phrase for this situation, or empty string"}`;
}
function apiTurns() {
  const t = state.turns.slice(-30).map(x => ({ role: x.role, content: x.content }));
  return [{ role: "user", content: rules() + "\n\n(The conversation starts now. Your first line was already said.)" }, ...t];
}

function startChat() {
  ctl?.abort();
  log.textContent = ""; $("ideas").textContent = "";
  const open = SCENARIOS[state.scenario].open;
  state.turns = [{ role: "assistant", content: open }];
  renderTutor(open);
  setStatus("idle"); silentTalk(open);
}

async function send(text) {
  text = text.trim();
  if (!text || busy) return;
  busy = true; sendBtn.disabled = true;
  const ok = await getSample();
  busy = false; sendBtn.disabled = false;
  if (!ok) { showError(noSampleText()); return; }
  busy = true; sendBtn.disabled = true; $("ideas").textContent = "";
  input.value = ""; autosize();
  const mine = renderMe(text);
  state.turns.push({ role: "user", content: text });
  const wait = el("div", "msg tutor"); wait.append(el("div", "role", "Tutor"), el("div", "bubble wait", "Píše…"));
  log.append(wait); scrollDown();
  try { speechSynthesis.cancel(); } catch {}
  setStatus("thinking");
  ctl = new AbortController();
  try {
    const out = await sample.json(apiTurns(), { modelTier: "quick", cache: false, signal: ctl.signal });
    wait.remove();
    const reply = String(out?.reply || "").trim() || "Sorry, could you say that again?";
    const corr = Array.isArray(out?.corrections) ? out.corrections.filter(c => c && c.better).map(c => ({
      original: String(c.original || ""), better: String(c.better), why: String(c.why || "") })) : [];
    renderFix(mine, corr, String(out?.tip || "").trim());
    if (corr.length) { state.mistakes.push(...corr); state.mistakes = state.mistakes.slice(-200); store.set("mistakes", state.mistakes); renderMistakes(); }
    state.turns.push({ role: "assistant", content: reply });
    renderTutor(reply);
    if (state.tts) speak(reply); else silentTalk(reply);
  } catch (e) {
    wait.remove(); setStatus("idle");
    if (e?.code !== "cancelled") { state.turns.pop(); showError(errCopy(e?.code)); input.value = text; autosize(); }
  } finally { busy = false; sendBtn.disabled = false; }
}

async function translate(text, m, btn) {
  if (!(await getSample())) { showError(noSampleText()); return; }
  btn.disabled = true; btn.textContent = "Prekladám…";
  try {
    const { text: sk } = await sample("Prelož do prirodzenej slovenčiny. Odpovedz iba prekladom:\n\n" + text, { modelTier: "quick" });
    const p = el("div", "fix"); p.append(el("span", "why", sk.trim())); m.append(p); btn.remove(); scrollDown();
  } catch (e) { btn.disabled = false; btn.textContent = "Preložiť"; if (e?.code !== "cancelled") showError(errCopy(e?.code)); }
}

async function ideas() {
  if (busy) return;
  if (!(await getSample())) { showError(noSampleText()); return; }
  const box = $("ideas"); box.textContent = ""; box.append(el("span", "hint", "Hľadám nápady…"));
  const last = state.turns.filter(t => t.role === "assistant").pop()?.content || "";
  try {
    const arr = await sample.json(`A ${state.level} English learner is in this situation: ${SCENARIOS[state.scenario].role}. The other person just said: "${last}"
Suggest 3 different natural replies the learner could say, suitable for level ${state.level}. Reply ONLY with a JSON array of 3 strings.`, { modelTier: "quick", cache: false });
    box.textContent = "";
    for (const s of (Array.isArray(arr) ? arr : []).slice(0, 3)) {
      const b = el("button", null, String(s)); b.type = "button";
      b.onclick = () => { input.value = String(s); autosize(); input.focus(); box.textContent = ""; };
      box.append(b);
    }
  } catch (e) { box.textContent = ""; if (e?.code !== "cancelled") showError(errCopy(e?.code)); }
}

/* ---------- speech in (only where the browser allows it) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
if (SR) {
  $("micBtn").hidden = false;
  $("micBtn").onclick = () => {
    if (rec) { rec.stop(); return; }
    try {
      rec = new SR(); rec.lang = "en-GB"; rec.interimResults = true;
      const base = input.value ? input.value + " " : "";
      rec.onresult = ev => { let t = ""; for (const r of ev.results) t += r[0].transcript; input.value = base + t; autosize(); };
      rec.onerror = () => { $("hint").textContent = "Mikrofón tu nie je dostupný. Použite mikrofón na klávesnici telefónu (diktovanie)."; };
      rec.onend = () => { rec = null; $("micBtn").classList.remove("on"); };
      rec.start(); $("micBtn").classList.add("on");
    } catch { rec = null; $("micBtn").hidden = true; }
  };
}

/* ---------- controls ---------- */
function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 140) + "px"; }
input.addEventListener("input", autosize);
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing && matchMedia("(pointer: fine)").matches) { e.preventDefault(); send(input.value); } });
$("form").addEventListener("submit", e => { e.preventDefault(); send(input.value); });
$("ideaBtn").onclick = ideas;
$("resetBtn").onclick = () => { if (!busy) startChat(); };
$("level").value = state.level;
$("level").onchange = e => { state.level = e.target.value; store.set("level", state.level); };
const ttsBtn = $("ttsBtn");
ttsBtn.setAttribute("aria-pressed", String(state.tts));
if (!("speechSynthesis" in window)) ttsBtn.hidden = true;
ttsBtn.onclick = () => { state.tts = !state.tts; store.set("tts", state.tts); ttsBtn.setAttribute("aria-pressed", String(state.tts)); if (!state.tts) try { speechSynthesis.cancel(); } catch {} };
$("rate").value = state.rate; $("rateVal").textContent = state.rate + "×";
$("rate").oninput = e => { state.rate = Number(e.target.value); $("rateVal").textContent = state.rate + "×"; store.set("rate", state.rate); };
$("mistakesBtn").onclick = () => { renderMistakes(); $("dlg").showModal(); };
$("dlgClose").onclick = () => $("dlg").close();
$("mClear").onclick = () => { state.mistakes = []; store.set("mistakes", []); renderMistakes(); };

if (!TUTORS[state.tutor]) state.tutor = "me";
$("tutorSel").value = state.tutor;
$("tutorSel").onchange = e => { if (busy) { e.target.value = state.tutor; return; } state.tutor = e.target.value; store.set("tutor", state.tutor); paintTutor(); startChat(); };
paintTutor(); setMouth(0); requestAnimationFrame(talkLoop);
renderScenarios(); renderMistakes(); startChat();
(async () => {
  if (!(await getSample())) $("hint").textContent = noSampleText();
})();
</script>
