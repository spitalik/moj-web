<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lantern Halls · GamePad</title>
    <script src="../../i18n.js"></script>
    <style>
        #back-btn{
            position:fixed;top:14px;left:14px;z-index:60;
            display:flex;align-items:center;gap:7px;
            background:rgba(7,9,15,.88);border:1px solid #43280f;color:#ab8a63;
            padding:7px 14px;border-radius:100px;text-decoration:none;
            font-size:12px;font-weight:600;backdrop-filter:blur(4px);transition:all .18s;
        }
        #back-btn:hover,#back-btn:active{border-color:#fbbf24;color:#fff8e8;}
        @media(max-width:480px){#back-btn{top:8px;left:8px;padding:5px 10px;font-size:11px;}}
        * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
        body {
            background:#0c0f16;
            font-family:'Segoe UI', Roboto, system-ui, sans-serif;
            display:flex; justify-content:center; align-items:center;
            min-height:100vh; margin:0; padding:12px;
            touch-action: manipulation;
        }
        #game-container {
            background:#151d2b; border-radius:28px; padding:20px 24px 24px;
            max-width:470px; width:100%;
            box-shadow:0 12px 40px rgba(0,0,0,.7); border:1px solid #2e3a4e;
            display:flex; flex-direction:column; gap:14px; position:relative;
        }
        #header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
        #header h1 {
            font-size:21px; font-weight:700;
            background:linear-gradient(135deg,#fde68a,#fbbf24);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin:0;
        }
        #rules { font-size:12px; color:#8291ab; line-height:1.5; }
        #settings { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
        #settings label { color:#b0c4e0; font-size:12px; font-weight:500; }
        .btn-group { display:flex; gap:4px; background:#111a28; padding:4px; border-radius:10px; border:1px solid #29344a; }
        .btn-group button { background:transparent; border:none; color:#7a8aa8; padding:4px 10px; border-radius:8px; font-size:12px; font-weight:600; cursor:pointer; }
        .btn-group button.active { background:#fbbf24; color:#0c0f16; }
        #info-panel { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
        .info-card { flex:1 1 auto; min-width:60px; background:#111a28; border-radius:14px; padding:8px 10px; border:1px solid #29344a; text-align:center; }
        .info-card h3 { font-size:10px; text-transform:uppercase; color:#7a8aa8; margin-bottom:4px; font-weight:500; letter-spacing:.4px; }
        .info-card .value { font-size:20px; font-weight:700; color:#eef3fc; display:block; }
        .high-score { border-color:#fbbf24; }
        .high-score h3 { color:#fbbf24 !important; }
        .high-score .value { color:#fbbf24 !important; }
        #status-line { text-align:center; font-size:12px; color:#fde68a; min-height:16px; font-weight:600; }
        #canvas-wrapper { background:#0f1622; border-radius:16px; padding:8px; box-shadow: inset 0 0 0 1px #2a3446; position:relative; align-self:center; max-width:100%; }
        #gameCanvas { display:block; border-radius:10px; touch-action:none; cursor:pointer; max-width:100%; height:auto; }
        #end-overlay {
            position:absolute; inset:8px; background:rgba(8,12,22,.92); backdrop-filter:blur(6px);
            border-radius:10px; display:none; flex-direction:column; align-items:center; justify-content:center;
            gap:8px; padding:26px; z-index:10; color:#f0f4fe; text-align:center;
        }
        #end-overlay.visible { display:flex; }
        #end-overlay h2 { font-size:26px; background:linear-gradient(135deg,#fde68a,#fbbf24); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        #end-overlay p { font-size:14px; color:#b0c4e0; }
        #restartBtn {
            background:#fbbf24; border:1px solid #fde68a; border-radius:40px;
            padding:12px 32px; font-size:17px; font-weight:700; color:#0c0f16;
            box-shadow:0 6px 0 #b45309; cursor:pointer; margin-top:6px;
        }
        #restartBtn:active { transform:translateY(6px); box-shadow:0 1px 0 #b45309; }
        #controls { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
        #controls button { background:#1e2a3e; border:1px solid #354460; color:#d0def0; border-radius:12px; padding:9px 16px; font-size:13px; font-weight:600; cursor:pointer; }
        #controls button:active { transform:translateY(2px); }
    </style>
</head>
<body>

    <a href="../../index.html" id="back-btn">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      <span id="lbl-back"></span>
    </a>

    <div id="game-container">
        <div id="header">
            <h1 id="lbl-title">🏮</h1>
            <div id="settings">
                <label id="lbl-diff"></label>
                <div class="btn-group" id="diffGroup">
                    <button data-diff="easy"   id="lbl-easy"></button>
                    <button data-diff="medium" id="lbl-medium" class="active"></button>
                    <button data-diff="hard"   id="lbl-hard"></button>
                </div>
            </div>
        </div>

        <p id="rules"></p>

        <div id="info-panel">
            <div class="info-card"><h3 id="lbl-lamps"></h3><span class="value" id="lampsValue">0</span></div>
            <div class="info-card"><h3 id="lbl-time"></h3><span class="value" id="timeValue">0:00</span></div>
            <div class="info-card"><h3 id="lbl-score"></h3><span class="value" id="scoreValue">0</span></div>
            <div class="info-card high-score"><h3 id="lbl-best"></h3><span class="value" id="bestValue">0</span></div>
        </div>

        <div id="status-line"></div>

        <div id="canvas-wrapper">
            <canvas id="gameCanvas"></canvas>
            <div id="end-overlay">
                <h2 id="lbl-result"></h2>
                <p id="lbl-final-time"></p>
                <p style="font-size:16px;color:#fbbf24;"><span id="lbl-final-score"></span> <span id="finalScore">0</span></p>
                <button id="restartBtn"></button>
            </div>
        </div>

        <div id="controls">
            <button id="checkBtn"></button>
            <button id="hintBtn"></button>
            <button id="clearBtn"></button>
            <button id="newGameBtn"></button>
        </div>
    </div>

    <script>
    (function () {
        'use strict';

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const lampsSpan = document.getElementById('lampsValue');
        const timeSpan = document.getElementById('timeValue');
        const scoreSpan = document.getElementById('scoreValue');
        const bestSpan = document.getElementById('bestValue');
        const statusLine = document.getElementById('status-line');
        const endOverlay = document.getElementById('end-overlay');
        const resultH2 = document.getElementById('lbl-result');
        const finalTimeP = document.getElementById('lbl-final-time');
        const finalScore = document.getElementById('finalScore');
        const restartBtn = document.getElementById('restartBtn');
        const newGameBtn = document.getElementById('newGameBtn');
        const checkBtn = document.getElementById('checkBtn');
        const clearBtn = document.getElementById('clearBtn');
        const hintBtn = document.getElementById('hintBtn');
        const diffGroup = document.getElementById('diffGroup');

        // ----- PREKLADY -----
        document.getElementById('lbl-back').textContent   = t('back');
        document.getElementById('lbl-title').textContent  = '🏮 ' + t('lntTitle');
        document.getElementById('lbl-diff').textContent   = t('uiDifficulty') + ':';
        document.getElementById('lbl-easy').textContent   = t('diffEasy');
        document.getElementById('lbl-medium').textContent = t('diffMedium');
        document.getElementById('lbl-hard').textContent   = t('diffHard');
        document.getElementById('lbl-lamps').textContent  = t('lntLamps');
        document.getElementById('lbl-time').textContent   = t('uiTime');
        document.getElementById('lbl-score').textContent  = t('uiScore');
        document.getElementById('lbl-best').textContent   = t('uiBest');
        document.getElementById('lbl-final-score').textContent = t('uiScore') + ':';
        document.getElementById('rules').textContent      = t('lntRules');
        checkBtn.textContent   = t('uiCheck');
        clearBtn.textContent   = t('islClear');
        hintBtn.textContent    = t('uiHint');
        restartBtn.textContent = t('uiPlayAgain');
        newGameBtn.textContent = t('uiNewGame');
        document.title = t('lntTitle') + ' · GamePad';

        // ----- KONFIGURACIA -----
        const SETUP = {
            easy:   { n: 7,  cell: 46, wallPct: 0.20, keep: 0.85, base: 300 },
            medium: { n: 9,  cell: 38, wallPct: 0.22, keep: 0.70, base: 560 },
            hard:   { n: 10, cell: 34, wallPct: 0.24, keep: 0.55, base: 900 },
        };
        const MARGIN = 12;

        let diffKey = 'medium';
        let N = 9, CELL = 38, SIZE = 0;
        let wall = [], clue = [], mark = [];          // mark: 0 empty, 1 lamp, 2 pencilled "no lamp"
        let solution = [];                            // the lamp layout the generator built
        let hints = 0;
        let solved = false, startedAt = 0, elapsed = 0, timer = null, score = 0;
        let best = { easy: 0, medium: 0, hard: 0 };
        try { best = Object.assign(best, JSON.parse(localStorage.getItem('lanternHallsBest') || '{}')); } catch (e) { /* ignore */ }

        const px = i => MARGIN + i * CELL;
        const inB = (r, c) => r >= 0 && r < N && c >= 0 && c < N;

        // ----- GENEROVANIE -----
        // Which cells a lamp at (r,c) lights, stopping at walls.
        function beam(r, c, walls) {
            const out = [[r, c]];
            for (const [dr, dc] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) {
                let rr = r + dr, cc = c + dc;
                while (inB(rr, cc) && !walls[rr][cc]) { out.push([rr, cc]); rr += dr; cc += dc; }
            }
            return out;
        }

        // Two lamps conflict when they see each other along a clear row or column.
        function sees(a, b, walls) {
            if (a[0] === b[0]) {
                const [lo, hi] = a[1] < b[1] ? [a[1], b[1]] : [b[1], a[1]];
                for (let c = lo + 1; c < hi; c++) if (walls[a[0]][c]) return false;
                return true;
            }
            if (a[1] === b[1]) {
                const [lo, hi] = a[0] < b[0] ? [a[0], b[0]] : [b[0], a[0]];
                for (let r = lo + 1; r < hi; r++) if (walls[r][a[1]]) return false;
                return true;
            }
            return false;
        }

        function generate() {
            const setup = SETUP[diffKey];
            for (let attempt = 0; attempt < 400; attempt++) {
                const walls = Array.from({ length: N }, () => new Array(N).fill(false));
                for (let r = 0; r < N; r++) for (let c = 0; c < N; c++)
                    if (Math.random() < setup.wallPct) walls[r][c] = true;

                const lamps = [];
                const lit = Array.from({ length: N }, () => new Array(N).fill(false));
                let ok = true, guard = 0;
                for (;;) {
                    if (guard++ > N * N * 4) { ok = false; break; }
                    let dark = null;
                    for (let r = 0; r < N && !dark; r++) for (let c = 0; c < N && !dark; c++)
                        if (!walls[r][c] && !lit[r][c]) dark = [r, c];
                    if (!dark) break;
                    // any cell whose beam covers `dark` and that no existing lamp can see
                    const spots = beam(dark[0], dark[1], walls)
                        .filter(([r, c]) => !lamps.some(l => l[0] === r && l[1] === c))
                        .filter(([r, c]) => !lamps.some(l => sees(l, [r, c], walls)));
                    if (!spots.length) { ok = false; break; }
                    const pick = spots[Math.floor(Math.random() * spots.length)];
                    lamps.push(pick);
                    for (const [r, c] of beam(pick[0], pick[1], walls)) lit[r][c] = true;
                }
                if (!ok || !lamps.length) continue;

                // read the clue numbers off the solution, then hide some of them
                const clues = Array.from({ length: N }, () => new Array(N).fill(null));
                for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
                    if (!walls[r][c]) continue;
                    let n = 0;
                    for (const [dr, dc] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) {
                        const rr = r + dr, cc = c + dc;
                        if (inB(rr, cc) && lamps.some(l => l[0] === rr && l[1] === cc)) n++;
                    }
                    clues[r][c] = Math.random() < setup.keep ? n : null;
                }
                return { walls, clues, lamps };
            }
            // extremely unlikely; fall back to an empty hall which is still a valid puzzle
            return {
                walls: Array.from({ length: N }, () => new Array(N).fill(false)),
                clues: Array.from({ length: N }, () => new Array(N).fill(null)),
                lamps: [],
            };
        }

        // ----- STAV -----
        function litMap() {
            const lit = Array.from({ length: N }, () => new Array(N).fill(false));
            for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
                if (mark[r][c] !== 1) continue;
                for (const [rr, cc] of beam(r, c, wall)) lit[rr][cc] = true;
            }
            return lit;
        }

        function conflicts() {
            const lamps = [];
            for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (mark[r][c] === 1) lamps.push([r, c]);
            const bad = new Set();
            for (let i = 0; i < lamps.length; i++) for (let j = i + 1; j < lamps.length; j++)
                if (sees(lamps[i], lamps[j], wall)) { bad.add(lamps[i].join(',')); bad.add(lamps[j].join(',')); }
            return bad;
        }

        function wallState(r, c) {
            if (clue[r][c] === null) return 'plain';
            let n = 0;
            for (const [dr, dc] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) {
                const rr = r + dr, cc = c + dc;
                if (inB(rr, cc) && mark[rr][cc] === 1) n++;
            }
            return n === clue[r][c] ? 'ok' : (n > clue[r][c] ? 'over' : 'under');
        }

        function lampCount() {
            let n = 0;
            for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (mark[r][c] === 1) n++;
            return n;
        }

        function checkSolved(announce) {
            lampsSpan.textContent = lampCount();
            const lit = litMap();
            let dark = 0;
            for (let r = 0; r < N; r++) for (let c = 0; c < N; c++)
                if (!wall[r][c] && !lit[r][c]) dark++;
            const bad = conflicts();
            let walls = true;
            for (let r = 0; r < N; r++) for (let c = 0; c < N; c++)
                if (wall[r][c] && clue[r][c] !== null && wallState(r, c) !== 'ok') walls = false;

            if (!dark && !bad.size && walls) { win(); return true; }
            if (announce) {
                statusLine.textContent = bad.size ? t('lntSeeing') : (!walls ? t('lntWallBad') : t('lntUnlit'));
            }
            return false;
        }

        function win() {
            solved = true;
            clearInterval(timer);
            score = Math.max(20, Math.round(SETUP[diffKey].base - elapsed * 2 - hints * 40));
            scoreSpan.textContent = score;
            if (score > (best[diffKey] || 0)) {
                best[diffKey] = score;
                localStorage.setItem('lanternHallsBest', JSON.stringify(best));
            }
            bestSpan.textContent = best[diffKey] || 0;
            resultH2.textContent = t('uiSolved');
            finalTimeP.textContent = t('uiTime') + ': ' + fmt(elapsed);
            finalScore.textContent = score;
            statusLine.textContent = '';
            draw();
            endOverlay.classList.add('visible');
        }

        const fmt = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');

        function newGame() {
            const setup = SETUP[diffKey];
            N = setup.n; CELL = setup.cell;
            SIZE = MARGIN * 2 + N * CELL;
            canvas.width = SIZE; canvas.height = SIZE;
            const puz = generate();
            wall = puz.walls; clue = puz.clues; solution = puz.lamps;
            mark = Array.from({ length: N }, () => new Array(N).fill(0));
            solved = false; score = 0; elapsed = 0; hints = 0;
            scoreSpan.textContent = '0';
            bestSpan.textContent = best[diffKey] || 0;
            timeSpan.textContent = '0:00';
            lampsSpan.textContent = '0';
            endOverlay.classList.remove('visible');
            statusLine.textContent = t('lntHintTap');
            clearInterval(timer);
            startedAt = Date.now();
            timer = setInterval(() => {
                if (solved) return;
                elapsed = Math.floor((Date.now() - startedAt) / 1000);
                timeSpan.textContent = fmt(elapsed);
            }, 1000);
            draw();
        }

        // ----- OVLADANIE -----
        function cellAt(e) {
            const rect = canvas.getBoundingClientRect();
            const x = ((e.touches ? e.touches[0].clientX : e.clientX) - rect.left) / rect.width * SIZE;
            const y = ((e.touches ? e.touches[0].clientY : e.clientY) - rect.top) / rect.height * SIZE;
            const c = Math.floor((x - MARGIN) / CELL), r = Math.floor((y - MARGIN) / CELL);
            return inB(r, c) ? [r, c] : null;
        }

        function onTap(e, back) {
            if (solved) return;
            const at = cellAt(e);
            if (!at) return;
            const [r, c] = at;
            if (wall[r][c]) return;
            mark[r][c] = back ? (mark[r][c] + 2) % 3 : (mark[r][c] + 1) % 3;
            statusLine.textContent = '';
            draw();
            checkSolved(false);
        }

        canvas.addEventListener('mousedown', e => { if (e.button === 2) return; onTap(e, false); });
        canvas.addEventListener('contextmenu', e => { e.preventDefault(); onTap(e, true); });
        canvas.addEventListener('touchstart', e => { e.preventDefault(); onTap(e, false); }, { passive: false });
        checkBtn.addEventListener('click', () => { if (!solved) checkSolved(true); });
        hintBtn.addEventListener('click', () => {
            if (solved) return;
            // put down one lamp the solution has and the board does not
            const wanted = solution.filter(([r, c]) => mark[r][c] !== 1);
            if (!wanted.length) { statusLine.textContent = t('lntAllPlaced'); return; }
            const [r, c] = wanted[Math.floor(Math.random() * wanted.length)];
            mark[r][c] = 1;
            hints++;
            statusLine.textContent = '';
            draw();
            checkSolved(false);
        });
        clearBtn.addEventListener('click', () => {
            if (solved) return;
            mark = Array.from({ length: N }, () => new Array(N).fill(0));
            statusLine.textContent = '';
            draw(); checkSolved(false);
        });
        restartBtn.addEventListener('click', newGame);
        newGameBtn.addEventListener('click', newGame);
        diffGroup.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                diffGroup.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                diffKey = btn.dataset.diff;
                newGame();
            });
        });

        // ----- VYKRESLENIE -----
        function draw() {
            ctx.fillStyle = '#1b2030'; ctx.fillRect(0, 0, SIZE, SIZE);
            const lit = litMap();
            const bad = conflicts();

            for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
                const x = px(c), y = px(r);
                if (wall[r][c]) {
                    ctx.fillStyle = '#0a0d14';
                    ctx.fillRect(x, y, CELL, CELL);
                    if (clue[r][c] !== null) {
                        const st = wallState(r, c);
                        ctx.fillStyle = st === 'ok' ? '#4ade80' : (st === 'over' ? '#f87171' : '#e2e8f0');
                        ctx.font = '700 ' + Math.round(CELL * 0.5) + 'px system-ui';
                        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                        ctx.fillText(String(clue[r][c]), x + CELL / 2, y + CELL / 2 + 1);
                    }
                } else {
                    ctx.fillStyle = lit[r][c] ? '#3b3320' : '#242b3d';
                    ctx.fillRect(x, y, CELL, CELL);
                }
                ctx.strokeStyle = 'rgba(255,255,255,.05)'; ctx.lineWidth = 1;
                ctx.strokeRect(x + .5, y + .5, CELL - 1, CELL - 1);
            }

            for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
                if (wall[r][c]) continue;
                const cx = px(c) + CELL / 2, cy = px(r) + CELL / 2;
                if (mark[r][c] === 1) {
                    const rad = CELL * 0.3;
                    const g = ctx.createRadialGradient(cx, cy, 1, cx, cy, rad * 1.9);
                    g.addColorStop(0, 'rgba(253,230,138,.95)');
                    g.addColorStop(1, 'rgba(251,191,36,0)');
                    ctx.fillStyle = g;
                    ctx.beginPath(); ctx.arc(cx, cy, rad * 1.9, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2);
                    ctx.fillStyle = '#fcd34d'; ctx.fill();
                    ctx.strokeStyle = bad.has(r + ',' + c) ? '#ef4444' : '#92400e';
                    ctx.lineWidth = bad.has(r + ',' + c) ? 3 : 1.4;
                    ctx.stroke();
                } else if (mark[r][c] === 2) {
                    ctx.beginPath(); ctx.arc(cx, cy, CELL * 0.09, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(148,163,184,.75)'; ctx.fill();
                }
            }
        }

        newGame();
    })();
    </script>
</body>
</html>
