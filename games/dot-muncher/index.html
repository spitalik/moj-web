<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dot Muncher · GamePad</title>
    <script src="../../i18n.js"></script>
    <style>
        #back-btn{
            position:fixed;top:14px;left:14px;z-index:60;
            display:flex;align-items:center;gap:7px;
            background:rgba(7,9,15,.88);border:1px solid #1d1f45;color:#8b8db8;
            padding:7px 14px;border-radius:100px;text-decoration:none;
            font-size:12px;font-weight:600;backdrop-filter:blur(4px);transition:all .18s;
        }
        #back-btn:hover,#back-btn:active{border-color:#fde047;color:#fffbe8;}
        @media(max-width:480px){#back-btn{top:8px;left:8px;padding:5px 10px;font-size:11px;}}
        * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
        body {
            background:#0c0f16;
            font-family:'Segoe UI', Roboto, system-ui, sans-serif;
            display:flex; justify-content:center; align-items:center;
            min-height:100vh; margin:0; padding:12px;
            touch-action: manipulation;
        }
        #game-container {
            background:#151d2b; border-radius:28px; padding:20px 20px 24px;
            max-width:440px; width:100%;
            box-shadow:0 12px 40px rgba(0,0,0,.7); border:1px solid #2e3a4e;
            display:flex; flex-direction:column; gap:12px; position:relative;
        }
        #header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
        #header h1 {
            font-size:21px; font-weight:700;
            background:linear-gradient(135deg,#fef08a,#fde047);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin:0;
        }
        #rules { font-size:12px; color:#8291ab; line-height:1.5; }
        #settings { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
        #settings label { color:#b0c4e0; font-size:12px; font-weight:500; }
        .btn-group { display:flex; gap:4px; background:#111a28; padding:4px; border-radius:10px; border:1px solid #29344a; }
        .btn-group button { background:transparent; border:none; color:#7a8aa8; padding:4px 10px; border-radius:8px; font-size:12px; font-weight:600; cursor:pointer; }
        .btn-group button.active { background:#fde047; color:#0c0f16; }
        #info-panel { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
        .info-card { flex:1 1 auto; min-width:60px; background:#111a28; border-radius:14px; padding:8px 10px; border:1px solid #29344a; text-align:center; }
        .info-card h3 { font-size:10px; text-transform:uppercase; color:#7a8aa8; margin-bottom:4px; font-weight:500; letter-spacing:.4px; }
        .info-card .value { font-size:20px; font-weight:700; color:#eef3fc; display:block; }
        .high-score { border-color:#fbbf24; }
        .high-score h3 { color:#fbbf24 !important; }
        .high-score .value { color:#fbbf24 !important; }
        #status-line { text-align:center; font-size:12px; color:#fef08a; min-height:16px; font-weight:600; }
        #canvas-wrapper { background:#0f1622; border-radius:16px; padding:8px; box-shadow: inset 0 0 0 1px #2a3446; position:relative; align-self:center; max-width:100%; }
        #gameCanvas { display:block; border-radius:10px; touch-action:none; max-width:100%; height:auto; }
        #pad { display:grid; grid-template-columns:repeat(3,50px); grid-template-rows:repeat(2,44px); gap:6px; justify-content:center; }
        #pad button {
            background:#1a2740; border:1px solid #2f4260; color:#dfe9f5;
            border-radius:12px; font-size:19px; font-weight:700; cursor:pointer;
        }
        #pad button:active { transform:translateY(2px); }
        #pad .up { grid-column:2; grid-row:1; }
        #pad .left { grid-column:1; grid-row:2; }
        #pad .down { grid-column:2; grid-row:2; }
        #pad .right { grid-column:3; grid-row:2; }
        #end-overlay {
            position:absolute; inset:8px; background:rgba(8,12,22,.92); backdrop-filter:blur(6px);
            border-radius:10px; display:none; flex-direction:column; align-items:center; justify-content:center;
            gap:8px; padding:26px; z-index:10; color:#f0f4fe; text-align:center;
        }
        #end-overlay.visible { display:flex; }
        #end-overlay h2 { font-size:26px; background:linear-gradient(135deg,#fef08a,#fde047); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        #end-overlay p { font-size:14px; color:#b0c4e0; }
        #restartBtn {
            background:#fde047; border:1px solid #fef08a; border-radius:40px;
            padding:12px 32px; font-size:17px; font-weight:700; color:#0c0f16;
            box-shadow:0 6px 0 #a16207; cursor:pointer; margin-top:6px;
        }
        #restartBtn:active { transform:translateY(6px); box-shadow:0 1px 0 #a16207; }
        #controls { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
        #controls button { background:#1e2a3e; border:1px solid #354460; color:#d0def0; border-radius:12px; padding:9px 16px; font-size:13px; font-weight:600; cursor:pointer; }
        #controls button:active { transform:translateY(2px); }
    </style>
</head>
<body>

    <a href="../../index.html" id="back-btn">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      <span id="lbl-back"></span>
    </a>

    <div id="game-container">
        <div id="header">
            <h1 id="lbl-title">👻</h1>
            <div id="settings">
                <label id="lbl-diff"></label>
                <div class="btn-group" id="diffGroup">
                    <button data-diff="easy"   id="lbl-easy"></button>
                    <button data-diff="medium" id="lbl-medium" class="active"></button>
                    <button data-diff="hard"   id="lbl-hard"></button>
                </div>
            </div>
        </div>

        <p id="rules"></p>

        <div id="info-panel">
            <div class="info-card"><h3 id="lbl-level"></h3><span class="value" id="levelValue">1</span></div>
            <div class="info-card"><h3 id="lbl-lives"></h3><span class="value" id="livesValue">3</span></div>
            <div class="info-card"><h3 id="lbl-score"></h3><span class="value" id="scoreValue">0</span></div>
            <div class="info-card high-score"><h3 id="lbl-best"></h3><span class="value" id="bestValue">0</span></div>
        </div>

        <div id="status-line"></div>

        <div id="canvas-wrapper">
            <canvas id="gameCanvas"></canvas>
            <div id="end-overlay">
                <h2 id="lbl-result"></h2>
                <p id="lbl-final-detail"></p>
                <p style="font-size:16px;color:#fbbf24;"><span id="lbl-final-score"></span> <span id="finalScore">0</span></p>
                <button id="restartBtn"></button>
            </div>
        </div>

        <div id="pad">
            <button class="up" data-dir="up">▲</button>
            <button class="left" data-dir="left">◀</button>
            <button class="down" data-dir="down">▼</button>
            <button class="right" data-dir="right">▶</button>
        </div>

        <div id="controls">
            <button id="pauseBtn"></button>
            <button id="newGameBtn"></button>
        </div>
    </div>

    <script>
    (function () {
        'use strict';

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const levelSpan = document.getElementById('levelValue');
        const livesSpan = document.getElementById('livesValue');
        const scoreSpan = document.getElementById('scoreValue');
        const bestSpan = document.getElementById('bestValue');
        const statusLine = document.getElementById('status-line');
        const endOverlay = document.getElementById('end-overlay');
        const resultH2 = document.getElementById('lbl-result');
        const finalDetail = document.getElementById('lbl-final-detail');
        const finalScore = document.getElementById('finalScore');
        const restartBtn = document.getElementById('restartBtn');
        const newGameBtn = document.getElementById('newGameBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const diffGroup = document.getElementById('diffGroup');

        // ----- PREKLADY -----
        document.getElementById('lbl-back').textContent   = t('back');
        document.getElementById('lbl-title').textContent  = '👻 ' + t('dmuTitle');
        document.getElementById('lbl-diff').textContent   = t('uiDifficulty') + ':';
        document.getElementById('lbl-easy').textContent   = t('diffEasy');
        document.getElementById('lbl-medium').textContent = t('diffMedium');
        document.getElementById('lbl-hard').textContent   = t('diffHard');
        document.getElementById('lbl-level').textContent  = t('uiLevel');
        document.getElementById('lbl-lives').textContent  = t('uiLives');
        document.getElementById('lbl-score').textContent  = t('uiScore');
        document.getElementById('lbl-best').textContent   = t('uiBest');
        document.getElementById('lbl-final-score').textContent = t('uiScore') + ':';
        document.getElementById('rules').textContent      = t('dmuRules');
        pauseBtn.textContent   = t('uiPaused');
        restartBtn.textContent = t('uiPlayAgain');
        newGameBtn.textContent = t('uiNewGame');
        document.title = t('dmuTitle') + ' · GamePad';

        // ----- LABYRINT -----
        // Original layout, mirrored left to right. '#' wall, '.' dot, 'o' power pellet.
        const MAZE = [
            '#################',
            '#.......#.......#',
            '#o##.##.#.##.##o#',
            '#.##.##.#.##.##.#',
            '#...............#',
            '#.##.#.###.#.##.#',
            '#....#..#..#....#',
            '####.##.#.##.####',
            '#......#.#......#',
            '#.####.....####.#',
            '#......#.#......#',
            '####.##.#.##.####',
            '#....#..#..#....#',
            '#.##.#.###.#.##.#',
            '#...............#',
            '#.##.##.#.##.##.#',
            '#o##.##.#.##.##o#',
            '#.......#.......#',
            '#################',
        ];
        const COLS = MAZE[0].length, ROWS = MAZE.length, TS = 20;
        const W = COLS * TS, H = ROWS * TS;
        canvas.width = W; canvas.height = H;

        const START = { r: 14, c: 8 };
        const DENS = [{ r: 9, c: 7 }, { r: 8, c: 8 }, { r: 9, c: 9 }, { r: 10, c: 8 }];
        const DIRS = { up: [-1, 0], down: [1, 0], left: [0, -1], right: [0, 1] };
        const OPPOSITE = { up: 'down', down: 'up', left: 'right', right: 'left' };

        const SETUP = {
            easy:   { lives: 4, ghost: 0.72, fright: 500 },
            medium: { lives: 3, ghost: 0.86, fright: 420 },
            hard:   { lives: 2, ghost: 1.0,  fright: 320 },
        };

        let diffKey = 'medium';
        let walls = [], dots = [], dotsLeft = 0;
        let hero = null, ghosts = [], level = 1, lives = 3, score = 0;
        let fright = 0, chain = 0, paused = false, over = false, frozen = 0;
        let queued = null, raf = 0, lastTick = 0;
        let best = { easy: 0, medium: 0, hard: 0 };
        try { best = Object.assign(best, JSON.parse(localStorage.getItem('dotMuncherBest') || '{}')); } catch (e) { /* ignore */ }

        const isWall = (r, c) => r < 0 || r >= ROWS || c < 0 || c >= COLS || walls[r][c];

        function buildMaze() {
            walls = MAZE.map(row => [...row].map(ch => ch === '#'));
            dots = MAZE.map(row => [...row].map(ch => ch === '.' ? 1 : (ch === 'o' ? 2 : 0)));
            dots[START.r][START.c] = 0;
            for (const d of DENS) dots[d.r][d.c] = 0;
            dotsLeft = dots.flat().filter(v => v > 0).length;
        }

        function spawn() {
            hero = { r: START.r, c: START.c, x: START.c * TS + TS / 2, y: START.r * TS + TS / 2, dir: 'left', speed: 1.85, mouth: 0 };
            ghosts = DENS.map((d, i) => ({
                r: d.r, c: d.c, x: d.c * TS + TS / 2, y: d.r * TS + TS / 2,
                dir: i % 2 ? 'up' : 'down', kind: i, eaten: false, respawn: 0,
            }));
            queued = null;
            fright = 0; chain = 0;
        }

        // ----- POHYB -----
        const atCentre = e => Math.abs(e.x - (e.c * TS + TS / 2)) < 1.2 && Math.abs(e.y - (e.r * TS + TS / 2)) < 1.2;

        function canGo(r, c, dir) {
            const [dr, dc] = DIRS[dir];
            return !isWall(r + dr, c + dc);
        }

        function step(e, speed) {
            const [dr, dc] = DIRS[e.dir];
            e.x += dc * speed; e.y += dr * speed;
            const cr = Math.floor(e.y / TS), cc = Math.floor(e.x / TS);
            e.r = Math.max(0, Math.min(ROWS - 1, cr));
            e.c = Math.max(0, Math.min(COLS - 1, cc));
            // stop dead at a wall face
            const cx = e.c * TS + TS / 2, cy = e.r * TS + TS / 2;
            if (!canGo(e.r, e.c, e.dir)) {
                if (e.dir === 'left' && e.x < cx) e.x = cx;
                if (e.dir === 'right' && e.x > cx) e.x = cx;
                if (e.dir === 'up' && e.y < cy) e.y = cy;
                if (e.dir === 'down' && e.y > cy) e.y = cy;
            }
            // keep to the middle of the corridor on the other axis
            if (e.dir === 'left' || e.dir === 'right') e.y += (cy - e.y) * 0.35;
            else e.x += (cx - e.x) * 0.35;
        }

        function heroTick(speed) {
            if (queued && atCentre(hero) && canGo(hero.r, hero.c, queued)) { hero.dir = queued; queued = null; }
            step(hero, speed);
            hero.mouth = (hero.mouth + 0.22) % (Math.PI * 2);

            const v = dots[hero.r][hero.c];
            if (v) {
                dots[hero.r][hero.c] = 0;
                dotsLeft--;
                score += v === 2 ? 50 : 10;
                if (v === 2) { fright = SETUP[diffKey].fright; chain = 0; }
                refresh();
            }
            if (dotsLeft === 0) nextLevel();
        }

        const dist = (ar, ac, br, bc) => Math.abs(ar - br) + Math.abs(ac - bc);

        function ghostTarget(g) {
            if (g.eaten) return DENS[g.kind];
            if (fright > 0) return { r: ROWS - 1 - hero.r, c: COLS - 1 - hero.c };   // run away
            if (g.kind === 0) return hero;
            if (g.kind === 1) {                                                       // cut ahead of the hero
                const [dr, dc] = DIRS[hero.dir];
                return { r: hero.r + dr * 4, c: hero.c + dc * 4 };
            }
            if (g.kind === 2) return { r: hero.r, c: hero.c };
            return { r: Math.floor(Math.random() * ROWS), c: Math.floor(Math.random() * COLS) };
        }

        function ghostTick(g, speed) {
            if (atCentre(g)) {
                const target = ghostTarget(g);
                const options = Object.keys(DIRS).filter(d => canGo(g.r, g.c, d));
                const forward = options.filter(d => d !== OPPOSITE[g.dir]);
                const pool = forward.length ? forward : options;
                let bestDir = pool[0], bestVal = Infinity;
                for (const d of pool) {
                    const [dr, dc] = DIRS[d];
                    const v = dist(g.r + dr, g.c + dc, target.r, target.c);
                    if (v < bestVal) { bestVal = v; bestDir = d; }
                }
                g.dir = bestDir;
            }
            step(g, speed);
            if (g.eaten && g.r === DENS[g.kind].r && g.c === DENS[g.kind].c && atCentre(g)) g.eaten = false;
        }

        function collisions() {
            for (const g of ghosts) {
                if (Math.hypot(g.x - hero.x, g.y - hero.y) > TS * 0.7) continue;
                if (g.eaten) continue;
                if (fright > 0) {
                    g.eaten = true;
                    chain = Math.min(chain + 1, 4);
                    score += 200 * Math.pow(2, chain - 1);
                    refresh();
                } else {
                    lives--;
                    refresh();
                    if (lives <= 0) { finish(false); return; }
                    spawn();
                    frozen = 60;
                    statusLine.textContent = t('dmuCaught');
                    return;
                }
            }
        }

        function nextLevel() {
            level++;
            buildMaze();
            spawn();
            frozen = 70;
            statusLine.textContent = t('dmuNextLevel', { n: level });
            refresh();
        }

        function finish(won) {
            over = true;
            cancelAnimationFrame(raf);
            if (score > (best[diffKey] || 0)) {
                best[diffKey] = score;
                localStorage.setItem('dotMuncherBest', JSON.stringify(best));
            }
            bestSpan.textContent = best[diffKey] || 0;
            resultH2.textContent = won ? t('uiYouWin') : t('uiGameOver');
            finalDetail.textContent = t('uiLevel') + ' ' + level;
            finalScore.textContent = score;
            statusLine.textContent = '';
            draw();
            endOverlay.classList.add('visible');
        }

        function refresh() {
            levelSpan.textContent = level;
            livesSpan.textContent = Math.max(0, lives);
            scoreSpan.textContent = score;
        }

        function loop(now) {
            raf = requestAnimationFrame(loop);
            if (paused || over) return;
            const dt = Math.min(3, (now - lastTick) / 16.67 || 1);
            lastTick = now;
            if (frozen > 0) { frozen -= dt * 4; draw(); return; }
            if (fright > 0) fright -= dt * 4;

            heroTick(1.85 * dt);
            const gs = SETUP[diffKey].ghost * (fright > 0 ? 0.62 : 1) * 1.55;
            for (const g of ghosts) ghostTick(g, (g.eaten ? gs * 1.8 : gs) * dt);
            collisions();
            draw();
        }

        function newGame() {
            level = 1; lives = SETUP[diffKey].lives; score = 0;
            over = false; paused = false; frozen = 40;
            buildMaze(); spawn();
            bestSpan.textContent = best[diffKey] || 0;
            endOverlay.classList.remove('visible');
            statusLine.textContent = t('dmuHint');
            refresh();
            cancelAnimationFrame(raf);
            lastTick = performance.now();
            raf = requestAnimationFrame(loop);
            draw();
        }

        // ----- OVLADANIE -----
        const KEYS = {
            ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
            w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right',
        };
        window.addEventListener('keydown', e => {
            const dir = KEYS[e.key];
            if (!dir) return;
            e.preventDefault();
            queued = dir;
        });
        document.querySelectorAll('#pad button').forEach(b => {
            b.addEventListener('click', () => { queued = b.dataset.dir; });
        });
        let touchStart = null;
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            touchStart = [e.touches[0].clientX, e.touches[0].clientY];
        }, { passive: false });
        canvas.addEventListener('touchend', e => {
            if (!touchStart) return;
            const t2 = e.changedTouches[0];
            const dx = t2.clientX - touchStart[0], dy = t2.clientY - touchStart[1];
            touchStart = null;
            if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
            queued = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
        }, { passive: false });

        pauseBtn.addEventListener('click', () => {
            if (over) return;
            paused = !paused;
            statusLine.textContent = paused ? t('uiPaused') : '';
            draw();
        });
        restartBtn.addEventListener('click', newGame);
        newGameBtn.addEventListener('click', newGame);
        diffGroup.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                diffGroup.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                diffKey = btn.dataset.diff;
                newGame();
            });
        });

        // ----- VYKRESLENIE -----
        function draw() {
            ctx.fillStyle = '#05060f'; ctx.fillRect(0, 0, W, H);

            ctx.strokeStyle = '#3b46a8'; ctx.lineWidth = 2.4;
            for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
                if (!walls[r][c]) continue;
                const x = c * TS, y = r * TS;
                ctx.beginPath();
                if (ctx.roundRect) ctx.roundRect(x + 2.5, y + 2.5, TS - 5, TS - 5, 4);
                else ctx.rect(x + 2.5, y + 2.5, TS - 5, TS - 5);
                ctx.fillStyle = '#161a4d'; ctx.fill();
                ctx.stroke();
            }

            for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
                const v = dots[r][c];
                if (!v) continue;
                ctx.beginPath();
                ctx.arc(c * TS + TS / 2, r * TS + TS / 2, v === 2 ? 5.2 : 2.1, 0, Math.PI * 2);
                ctx.fillStyle = v === 2 ? '#fde047' : '#e6e2c8';
                ctx.fill();
            }

            // hero
            const open = 0.22 + 0.20 * Math.abs(Math.sin(hero.mouth));
            const face = { right: 0, down: Math.PI / 2, left: Math.PI, up: -Math.PI / 2 }[hero.dir];
            ctx.beginPath();
            ctx.moveTo(hero.x, hero.y);
            ctx.arc(hero.x, hero.y, TS * 0.44, face + open, face - open);
            ctx.closePath();
            ctx.fillStyle = '#fde047'; ctx.fill();

            // chasers
            for (const g of ghosts) {
                const rad = TS * 0.42;
                ctx.beginPath();
                ctx.arc(g.x, g.y - 1, rad, Math.PI, 0);
                ctx.lineTo(g.x + rad, g.y + rad * 0.85);
                for (let k = 0; k < 3; k++) {
                    ctx.lineTo(g.x + rad - (k + 0.5) * (rad * 2 / 3), g.y + rad * (k % 2 ? 0.85 : 0.45));
                }
                ctx.lineTo(g.x - rad, g.y + rad * 0.85);
                ctx.closePath();
                if (g.eaten) ctx.fillStyle = 'rgba(148,163,184,.35)';
                else if (fright > 0) ctx.fillStyle = fright < 90 && Math.floor(fright / 12) % 2 ? '#e2e8f0' : '#3b82f6';
                else ctx.fillStyle = ['#ef4444', '#f472b6', '#22d3ee', '#fb923c'][g.kind];
                ctx.fill();
                if (!g.eaten) {
                    ctx.fillStyle = '#fff';
                    ctx.beginPath(); ctx.arc(g.x - 4, g.y - 3, 3.1, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(g.x + 4, g.y - 3, 3.1, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#1e293b';
                    const [dr, dc] = DIRS[g.dir];
                    ctx.beginPath(); ctx.arc(g.x - 4 + dc * 1.3, g.y - 3 + dr * 1.3, 1.5, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(g.x + 4 + dc * 1.3, g.y - 3 + dr * 1.3, 1.5, 0, Math.PI * 2); ctx.fill();
                }
            }

            if (paused) {
                ctx.fillStyle = 'rgba(5,6,15,.7)'; ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = '#fde047'; ctx.font = '700 22px system-ui';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(t('uiPaused'), W / 2, H / 2);
            }
        }

        newGame();
    })();
    </script>
</body>
</html>
