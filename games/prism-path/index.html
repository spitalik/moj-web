<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prism Path · GamePad</title>
    <script src="../../i18n.js"></script>
    <style>
        #back-btn{
            position:fixed;top:14px;left:14px;z-index:60;
            display:flex;align-items:center;gap:7px;
            background:rgba(7,9,15,.88);border:1px solid #402049;color:#8291ab;
            padding:7px 14px;border-radius:100px;text-decoration:none;
            font-size:12px;font-weight:600;backdrop-filter:blur(4px);transition:all .18s;
        }
        #back-btn:hover,#back-btn:active{border-color:#e879f9;color:#f0f4fe;}
        @media(max-width:480px){#back-btn{top:8px;left:8px;padding:5px 10px;font-size:11px;}}
        * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
        body {
            background:#0c0f16;
            font-family:'Segoe UI', Roboto, system-ui, sans-serif;
            display:flex; justify-content:center; align-items:center;
            min-height:100vh; margin:0; padding:12px;
        }
        #game-container {
            background:#151d2b;
            border-radius:28px;
            padding:20px 24px 24px;
            max-width:560px;
            width:100%;
            box-shadow:0 12px 40px rgba(0,0,0,.7);
            border:1px solid #2e3a4e;
            display:flex; flex-direction:column; gap:14px;
            position:relative;
        }
        #header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
        #header h1 {
            font-size:23px; font-weight:700;
            background:linear-gradient(135deg,#f5d0fe,#e879f9);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
            margin:0;
        }
        #rules { font-size:12px; color:#8291ab; line-height:1.5; }
        #settings { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
        #settings label { color:#b0c4e0; font-size:12px; font-weight:500; }
        .btn-group { display:flex; gap:4px; background:#111a28; padding:4px; border-radius:10px; border:1px solid #29344a; }
        .btn-group button { background:transparent; border:none; color:#7a8aa8; padding:4px 10px; border-radius:8px; font-size:12px; font-weight:600; cursor:pointer; }
        .btn-group button.active { background:#e879f9; color:#0c0f16; }
        #info-panel { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
        .info-card { flex:1 1 auto; min-width:60px; background:#111a28; border-radius:14px; padding:8px 10px; border:1px solid #29344a; text-align:center; }
        .info-card h3 { font-size:10px; text-transform:uppercase; color:#7a8aa8; margin-bottom:4px; font-weight:500; }
        .info-card .value { font-size:20px; font-weight:700; color:#eef3fc; display:block; }
        .high-score { border-color:#fbbf24; }
        .high-score h3 { color:#fbbf24 !important; }
        .high-score .value { color:#fbbf24 !important; }
        #board-wrap {
            background:#0f1622; border-radius:16px; padding:10px;
            box-shadow: inset 0 0 0 1px #2a3446;
            align-self:center; position:relative;
        }
        #board { display:grid; gap:2px; position:relative; }
        .cell {
            background:#1c2739; border-radius:5px; position:relative;
            display:flex; align-items:center; justify-content:center;
            font-size:18px; cursor:pointer;
        }
        .cell.wall { background:#0a0e16; cursor:default; box-shadow:inset 0 0 0 1px #212a3a; }
        .cell.source, .cell.target { cursor:default; }
        .cell.target { color:#fbbf24; transition:transform .15s; }
        .cell.target.exploding {
            animation: targetBoom .55s ease-out forwards;
        }
        @keyframes targetBoom {
            0%   { transform:scale(1); color:#fbbf24; }
            30%  { transform:scale(1.7); color:#fff7cc; text-shadow:0 0 18px #fbbf24, 0 0 34px #f97316; }
            60%  { transform:scale(1.25); color:#fef3c7; }
            100% { transform:scale(1); color:#4ade80; text-shadow:0 0 10px #4ade80; }
        }
        #particleLayer { position:absolute; inset:10px; pointer-events:none; overflow:visible; }
        .particle {
            position:absolute; width:7px; height:7px; border-radius:50%;
            background:#fbbf24; opacity:1;
            transform:translate(-50%,-50%);
            transition:transform .55s cubic-bezier(.15,.6,.4,1), opacity .55s ease-out;
        }
        .particle.fly { opacity:0; }
        .flash-ring {
            position:absolute; width:10px; height:10px; border-radius:50%;
            border:3px solid #fde68a; transform:translate(-50%,-50%) scale(0.3); opacity:1;
            transition:transform .5s ease-out, opacity .5s ease-out;
        }
        .flash-ring.fly { transform:translate(-50%,-50%) scale(6); opacity:0; }
        .cell .mirror-line {
            position:absolute; inset:12%; pointer-events:none;
        }
        #beamCanvas { position:absolute; inset:10px; pointer-events:none; }
        #controls { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
        #controls button {
            background:#1e2a3e; border:1px solid #354460; color:#d0def0;
            border-radius:12px; padding:9px 16px; font-size:13px; font-weight:600; cursor:pointer;
        }
        #controls button:active { transform:translateY(2px); }
        #newLevelBtn { border-color:#e879f9; color:#f5d0fe; }
        #end-overlay {
            position:absolute; inset:0; background:rgba(8,12,22,.92); backdrop-filter:blur(6px);
            border-radius:28px; display:none; flex-direction:column; align-items:center; justify-content:center;
            gap:10px; padding:26px; z-index:10; color:#f0f4fe; text-align:center;
        }
        #end-overlay.visible { display:flex; }
        #end-overlay h2 {
            font-size:28px;
            background:linear-gradient(135deg,#f5d0fe,#e879f9);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
        }
        #nextLevelBtn {
            background:#e879f9; border:1px solid #f5d0fe; border-radius:40px;
            padding:12px 32px; font-size:17px; font-weight:700; color:#0c0f16;
            box-shadow:0 6px 0 #a21caf; cursor:pointer; margin-top:6px;
        }
        #nextLevelBtn:active { transform:translateY(6px); box-shadow:0 1px 0 #a21caf; }
        @media (max-width:480px) { .cell { font-size:14px; } }
    </style>
</head>

        (function () {

"c": 0, "r": 1}, {"c": 8, "r": 2}]}, {"N": 10, "source": {"c": 8, "r": 9, "dir": "U"}, "target": {"c": 4, "r": 3}, "mirrors": [{"c": 8, "r": 5, "t": "\\"}, {"c": 6, "r": 5, "t": "\\"}, {"c": 6, "r": 0, "t": "\\"}, {"c": 5, "r": 0, "t": "/"}, {"c": 5, "r": 3, "t": "/"}], "walls": [{"c": 3, "r": 1}, {"c": 2, "r": 5}, {"c": 4, "r": 6}, {"c": 0, "r": 8}, {"c": 7, "r": 6}, {"c": 2, "r": 6}, {"c": 3, "r": 4}, {"c": 3, "r": 5}]}, {"N": 10, "source": {"c": 9, "r": 3, "dir": "L"}, "target": {"c": 2, "r": 3}, "mirrors": [{"c": 4, "r": 3, "t": "\\"}, {"c": 4, "r": 1, "t": "\\"}, {"c": 1, "r": 1, "t": "/"}, {"c": 1, "r": 3, "t": "\\"}], "walls": [{"c": 2, "r": 4}, {"c": 9, "r": 8}, {"c": 7, "r": 2}, {"c": 4, "r": 0}, {"c": 5, "r": 8}, {"c": 0, "r": 1}, {"c": 2, "r": 8}, {"c": 6, "r": 0}]}, {"N": 10, "source": {"c": 1, "r": 0, "dir": "D"}, "target": {"c": 7, "r": 3}, "mirrors": [{"c": 1, "r": 5, "t": "\\"}, {"c": 5, "r": 5, "t": "/"}, {"c": 5, "r": 0, "t": "/"}, {"c": 7, "r": 0, "t": "\\"}], "walls": [{"c": 4, "r": 1}, {"c": 9, "r": 2}, {"c": 0, "r": 1}, {"c": 8, "r": 1}, {"c": 3, "r": 9}, {"c": 1, "r": 6}, {"c": 4, "r": 4}, {"c": 3, "r": 4}]}]};

            const backLbl = document.getElementById('lbl-back');
            const sizeGroup = document.getElementById('sizeGroup');
            const rulesP = document.getElementById('rules');
            const mirrorsSpan = document.getElementById('mirrorsValue');
            const parSpan = document.getElementById('parValue');
            const scoreSpan = document.getElementById('scoreValue');
            const bestSpan = document.getElementById('bestValue');
            const boardEl = document.getElementById('board');
            const beamCanvas = document.getElementById('beamCanvas');
            const particleLayer = document.getElementById('particleLayer');
            const endOverlay = document.getElementById('end-overlay');
            const finalMirrors = document.getElementById('finalMirrors');
            const finalPar = document.getElementById('finalPar');
            const finalScore = document.getElementById('finalScore');
            const resetBtn = document.getElementById('resetBtn');
            const newLevelBtn = document.getElementById('newLevelBtn');
            const nextLevelBtn = document.getElementById('nextLevelBtn');

            // ----- PREKLADY -----
            backLbl.textContent = t('back');
            document.getElementById('lbl-size').textContent = t('prsDifficulty');
            document.getElementById('lbl-size-s').textContent = t('prsEasy');

            document.getElementById('lbl-size-l').textContent = t('prsHard');
            document.getElementById('lbl-mirrors').textContent = t('prsMirrors');
            document.getElementById('lbl-score').textContent = t('prsScore');
            document.getElementById('lbl-best').textContent = t('prsBest');
            document.getElementById('lbl-win').textContent = t('prsWin');
            document.getElementById('lbl-final-mirrors').textContent = t('prsMirrors') + ':';
            document.getElementById('lbl-final-score').textContent = t('prsScore') + ':';
            document.getElementById('lbl-reset').textContent = t('prsReset');
            document.getElementById('lbl-newlevel').textContent = t('prsNewLevel');
            nextLevelBtn.textContent = t('prsNewLevel');
            rulesP.textContent = t('prsRules');

            // ----- STAV -----
            let diffKey = 'm';
            let level = null;
            let N = 8;
            let wallSet = new Set();
            let mirrorMap = {};
            let cellEls = [];
            let score = 0;
            let best = parseInt(localStorage.getItem('prismPathBest') || '0', 10);
            let solved = false;
            let recentIdx = { s: -1, m: -1, l: -1 };
            let levelGen = 0;

            bestSpan.textContent = best;

            const SLASH_TURN = { R: 'U', U: 'R', L: 'D', D: 'L' };
            const BACK_TURN = { R: 'D', D: 'R', L: 'U', U: 'L' };
            const DIR_VEC = { R: [1, 0], L: [-1, 0], U: [0, -1], D: [0, 1] };
            const DIR_ARROW = { R: '▶', L: '◀', U: '▲', D: '▼' };

            function pickLevel(diff) {
                const arr = LEVELS[diff];
                let idx;
                do {
                    idx = Math.floor(Math.random() * arr.length);
                } while (arr.length > 1 && idx === recentIdx[diff]);
                recentIdx[diff] = idx;
                return arr[idx];
            }

            function cellKey(c, r) { return c + ',' + r; }

            function simulateBeam() {
                let { c: x, r: y, dir: d } = level.source;
                const trace = [[x, y]];
                const seenStates = new Set();
                let steps = 0;
                const maxSteps = N * N * 4;
                while (steps < maxSteps) {
                    steps++;
                    if (x === level.target.c && y === level.target.r) {
                        return { hit: true, trace };
                    }
                    const stateKey = x + ',' + y + ',' + d;
                    if (seenStates.has(stateKey)) {
                        return { hit: false, trace };
                    }
                    seenStates.add(stateKey);
                    const [dx, dy] = DIR_VEC[d];
                    const nx = x + dx, ny = y + dy;
                    if (nx < 0 || nx >= N || ny < 0 || ny >= N) {
                        return { hit: false, trace };
                    }
                    if (wallSet.has(cellKey(nx, ny))) {
                        return { hit: false, trace };
                    }
                    x = nx; y = ny;
                    trace.push([x, y]);
                    if (x === level.target.c && y === level.target.r) {
                        return { hit: true, trace };
                    }
                    const mkey = cellKey(x, y);
                    if (mirrorMap[mkey]) {
                        d = mirrorMap[mkey] === '/' ? SLASH_TURN[d] : BACK_TURN[d];
                    }
                }
                return { hit: false, trace };
            }

            function cellCenter(c, r) {
                const el = cellEls[r][c];
                return { x: el.offsetLeft + el.offsetWidth / 2, y: el.offsetTop + el.offsetHeight / 2 };
            }

            function renderMirror(el, type) {
                el.innerHTML = '';
                if (!type) return;
                const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                svg.setAttribute('viewBox', '0 0 100 100');
                svg.setAttribute('class', 'mirror-line');
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                if (type === '/') {
                    line.setAttribute('x1', '10'); line.setAttribute('y1', '90');
                    line.setAttribute('x2', '90'); line.setAttribute('y2', '10');
                } else {
                    line.setAttribute('x1', '10'); line.setAttribute('y1', '10');
                    line.setAttribute('x2', '90'); line.setAttribute('y2', '90');
                }
                line.setAttribute('stroke', '#f5d0fe');
                line.setAttribute('stroke-width', '10');
                line.setAttribute('stroke-linecap', 'round');
                svg.appendChild(line);
                el.appendChild(svg);
            }

            function onCellClick(c, r) {
                if (solved) return;
                const key = cellKey(c, r);
                if (wallSet.has(key)) return;
                if (c === level.source.c && r === level.source.r) return;
                if (c === level.target.c && r === level.target.r) return;
                const cur = mirrorMap[key];
                let next;
                if (!cur) next = '/';
                else if (cur === '/') next = '\\';
                else next = null;
                if (next) mirrorMap[key] = next; else delete mirrorMap[key];
                renderMirror(cellEls[r][c], next);
                const usedCount = Object.keys(mirrorMap).length;
                mirrorsSpan.textContent = usedCount;
                updateBeam();
            }

            function updateBeam() {
                const result = simulateBeam();
                drawBeam(result.trace, result.hit);
                if (result.hit && !solved) {
                    solved = true;
                    explodeTarget();
                }
            }

            function explodeTarget() {
                const gen = levelGen;
                const tgtEl = cellEls[level.target.r][level.target.c];
                tgtEl.classList.add('exploding');
                const center = cellCenter(level.target.c, level.target.r);

                const ring = document.createElement('div');
                ring.className = 'flash-ring';
                ring.style.left = center.x + 'px';
                ring.style.top = center.y + 'px';
                particleLayer.appendChild(ring);

                const particleCount = 14;
                const particles = [];
                for (let i = 0; i < particleCount; i++) {
                    const p = document.createElement('div');
                    p.className = 'particle';
                    const hue = Math.random() < 0.5 ? '#fbbf24' : '#4ade80';
                    p.style.background = hue;
                    p.style.left = center.x + 'px';
                    p.style.top = center.y + 'px';
                    particleLayer.appendChild(p);
                    particles.push(p);
                }

                requestAnimationFrame(() => {
                    ring.classList.add('fly');
                    particles.forEach(p => {
                        const angle = Math.random() * Math.PI * 2;
                        const dist = 30 + Math.random() * 34;
                        p.style.transform = `translate(${Math.cos(angle) * dist - 3.5}px, ${Math.sin(angle) * dist - 3.5}px)`;
                        p.classList.add('fly');
                    });
                });

                setTimeout(() => {
                    ring.remove();
                    particles.forEach(p => p.remove());
                    if (gen !== levelGen) return;
                    tgtEl.classList.remove('exploding');
                    winLevel();
                }, 560);
            }

            function drawBeam(trace, hit) {
                if (trace.length < 2) { beamCanvas.innerHTML = ''; return; }
                const pts = trace.map(([c, r]) => cellCenter(c, r));
                const color = hit ? '#4ade80' : '#e879f9';
                const poly = pts.map(p => p.x + ',' + p.y).join(' ');
                beamCanvas.innerHTML = `<polyline points="${poly}" fill="none" stroke="${color}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>`;
            }

            function winLevel() {
                solved = true;
                const used = Object.keys(mirrorMap).length;
                const par = level.mirrors.length;
                const penalty = Math.max(0, used - par) * 15;
                score = Math.max(20, 100 - penalty);
                scoreSpan.textContent = score;
                if (score > best) {
                    best = score;
                    bestSpan.textContent = best;
                    localStorage.setItem('prismPathBest', String(best));
                }
                finalMirrors.textContent = used;
                finalPar.textContent = par;
                finalScore.textContent = score;
                endOverlay.classList.add('visible');
            }

            function renderBoard() {
                N = level.N;
                boardEl.style.gridTemplateColumns = `repeat(${N}, 1fr)`;
                const cellPx = N <= 6 ? 48 : (N <= 8 ? 40 : 34);
                boardEl.style.width = (N * cellPx) + 'px';
                boardEl.style.height = (N * cellPx) + 'px';
                boardEl.innerHTML = '';
                cellEls = [];
                for (let r = 0; r < N; r++) {
                    const rowEls = [];
                    for (let c = 0; c < N; c++) {
                        const div = document.createElement('div');
                        div.className = 'cell';
                        rowEls.push(div);
                        boardEl.appendChild(div);
                    }
                    cellEls.push(rowEls);
                }

                wallSet = new Set(level.walls.map(w => cellKey(w.c, w.r)));
                for (const w of level.walls) {
                    cellEls[w.r][w.c].classList.add('wall');
                }
                const srcEl = cellEls[level.source.r][level.source.c];
                srcEl.classList.add('source');
                srcEl.textContent = DIR_ARROW[level.source.dir];
                srcEl.style.color = '#38bdf8';
                const tgtEl = cellEls[level.target.r][level.target.c];
                tgtEl.classList.add('target');
                tgtEl.textContent = '◆';

                for (let r = 0; r < N; r++) {
                    for (let c = 0; c < N; c++) {
                        if (wallSet.has(cellKey(c, r))) continue;
                        if (c === level.source.c && r === level.source.r) continue;
                        if (c === level.target.c && r === level.target.r) continue;
                        cellEls[r][c].addEventListener('click', () => onCellClick(c, r));
                    }
                }

                beamCanvas.setAttribute('viewBox', `0 0 ${boardEl.offsetWidth} ${boardEl.offsetHeight}`);
                beamCanvas.style.width = boardEl.offsetWidth + 'px';
                beamCanvas.style.height = boardEl.offsetHeight + 'px';
            }

            function newLevel() {
                levelGen++;
                level = pickLevel(diffKey);
                mirrorMap = {};
                solved = false;
                score = 0;
                scoreSpan.textContent = '0';
                mirrorsSpan.textContent = '0';
                parSpan.textContent = level.mirrors.length;
                endOverlay.classList.remove('visible');
                renderBoard();
                updateBeam();
            }

            function resetMirrors() {
                if (solved) return;
                mirrorMap = {};
                mirrorsSpan.textContent = '0';
                for (let r = 0; r < N; r++) {
                    for (let c = 0; c < N; c++) {
                        if (!wallSet.has(cellKey(c, r)) &&
                            !(c === level.source.c && r === level.source.r) &&
                            !(c === level.target.c && r === level.target.r)) {
                            renderMirror(cellEls[r][c], null);
                        }
                    }
                }
                updateBeam();
            }

            resetBtn.addEventListener('click', resetMirrors);
            newLevelBtn.addEventListener('click', newLevel);
            nextLevelBtn.addEventListener('click', newLevel);

            sizeGroup.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', () => {
                    sizeGroup.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    diffKey = btn.dataset.diff;
                    newLevel();
                });
            });

            window.addEventListener('resize', () => {
                if (level) { renderBoard(); updateBeam(); }
            });

            newLevel();
        })();
    </script>
</body>
</html>
