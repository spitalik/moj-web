<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tilt Maze · GamePad</title>
    <script src="../../i18n.js"></script>
    <style>
        #back-btn{
            position:fixed;top:14px;left:14px;z-index:60;
            display:flex;align-items:center;gap:7px;
            background:rgba(7,9,15,.88);border:1px solid #1a3a2e;color:#8291ab;
            padding:7px 14px;border-radius:100px;text-decoration:none;
            font-size:12px;font-weight:600;backdrop-filter:blur(4px);transition:all .18s;
        }
        #back-btn:hover,#back-btn:active{border-color:#2dd4bf;color:#f0f4fe;}
        @media(max-width:480px){#back-btn{top:8px;left:8px;padding:5px 10px;font-size:11px;}}
        * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
        body {
            background:#0c0f16;
            font-family:'Segoe UI', Roboto, system-ui, sans-serif;
            display:flex; justify-content:center; align-items:center;
            min-height:100vh; margin:0; padding:12px;
            touch-action: manipulation;
        }
        #game-container {
            background:#151d2b;
            border-radius:28px;
            padding:20px 24px 24px;
            max-width:420px;
            width:100%;
            box-shadow:0 12px 40px rgba(0,0,0,.7);
            border:1px solid #2e3a4e;
            display:flex; flex-direction:column; gap:14px;
            position:relative;
        }
        #header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
        #header h1 {
            font-size:23px; font-weight:700;
            background:linear-gradient(135deg,#99f6e4,#2dd4bf);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
            margin:0;
        }
        #rules { font-size:12px; color:#8291ab; line-height:1.5; }
        #settings { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
        #settings label { color:#b0c4e0; font-size:12px; font-weight:500; }
        .btn-group { display:flex; gap:4px; background:#111a28; padding:4px; border-radius:10px; border:1px solid #29344a; }
        .btn-group button { background:transparent; border:none; color:#7a8aa8; padding:4px 10px; border-radius:8px; font-size:12px; font-weight:600; cursor:pointer; }
        .btn-group button.active { background:#2dd4bf; color:#0c0f16; }
        #info-panel { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
        .info-card { flex:1 1 auto; min-width:60px; background:#111a28; border-radius:14px; padding:8px 10px; border:1px solid #29344a; text-align:center; }
        .info-card h3 { font-size:10px; text-transform:uppercase; color:#7a8aa8; margin-bottom:4px; font-weight:500; }
        .info-card .value { font-size:20px; font-weight:700; color:#eef3fc; display:block; }
        .high-score { border-color:#fbbf24; }
        .high-score h3 { color:#fbbf24 !important; }
        .high-score .value { color:#fbbf24 !important; }
        #canvas-wrapper {
            background:#0f1622; border-radius:16px; padding:8px;
            box-shadow: inset 0 0 0 1px #2a3446;
            position:relative; align-self:center;
            transition: transform .12s ease-out;
        }
        #gameCanvas { display:block; border-radius:10px; touch-action:none; }
        #win-overlay {
            position:absolute; inset:8px; background:rgba(8,12,22,.92); backdrop-filter:blur(6px);
            border-radius:10px; display:none; flex-direction:column; align-items:center; justify-content:center;
            gap:10px; padding:26px; z-index:10; color:#f0f4fe; text-align:center;
        }
        #win-overlay.visible { display:flex; }
        #win-overlay h2 {
            font-size:26px;
            background:linear-gradient(135deg,#99f6e4,#2dd4bf);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
        }
        #nextBtn {
            background:#2dd4bf; border:1px solid #99f6e4; border-radius:40px;
            padding:12px 32px; font-size:17px; font-weight:700; color:#0c0f16;
            box-shadow:0 6px 0 #0f766e; cursor:pointer; margin-top:6px;
        }
        #nextBtn:active { transform:translateY(6px); box-shadow:0 1px 0 #0f766e; }
        #joystick-wrap { display:flex; justify-content:center; margin-top:2px; }
        #joystick-base {
            width:110px; height:110px; border-radius:50%;
            background:#111a28; border:1px solid #29344a;
            position:relative; touch-action:none;
        }
        #joystick-knob {
            width:44px; height:44px; border-radius:50%;
            background:#2dd4bf; position:absolute; left:33px; top:33px;
            box-shadow:0 3px 8px rgba(0,0,0,.4);
            transition: left .08s, top .08s;
        }
        #controls { display:flex; gap:10px; justify-content:center; }
        #newMazeBtn {
            background:#1e2a3e; border:1px solid #354460; color:#d0def0;
            border-radius:12px; padding:9px 16px; font-size:13px; font-weight:600; cursor:pointer;
        }
        #newMazeBtn:active { transform:translateY(2px); }
    </style>
</head>
<body>

    <a href="../../index.html" id="back-btn">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      <span id="lbl-back"></span>
    </a>

    <div id="game-container">
        <div id="header">
            <h1>🎱 TILT MAZE</h1>
            <div id="settings">
                <label id="lbl-size">Obtiažnosť:</label>
                <div class="btn-group" id="sizeGroup">
                    <button data-diff="s" id="lbl-size-s">Ľahká</button>
                    <button data-diff="m" class="active" id="lbl-size-m">Stredná</button>
                    <button data-diff="l" id="lbl-size-l">Ťažká</button>
                </div>
            </div>
        </div>

        <p id="rules"></p>

        <div id="info-panel">
            <div class="info-card">
                <h3 id="lbl-time">Čas</h3>
                <span class="value" id="timeValue">0.0s</span>
            </div>
            <div class="info-card">
                <h3 id="lbl-falls">Pády</h3>
                <span class="value" id="fallsValue">0</span>
            </div>
            <div class="info-card">
                <h3 id="lbl-score">Skóre</h3>
                <span class="value" id="scoreValue">0</span>
            </div>
            <div class="info-card high-score">
                <h3 id="lbl-best">Najlepšie</h3>
                <span class="value" id="bestValue">0</span>
            </div>
        </div>

        <div id="canvas-wrapper">
            <canvas id="gameCanvas"></canvas>
            <div id="win-overlay">
                <h2 id="lbl-win">Cieľ!</h2>
                <p><span id="lbl-final-time">Čas:</span> <span id="finalTime">0.0s</span></p>
                <p><span id="lbl-final-falls">Pády:</span> <span id="finalFalls">0</span></p>
                <p style="font-size:16px; color:#fbbf24;"><span id="lbl-final-score">Skóre:</span> <span id="finalScore">0</span></p>
                <button id="nextBtn">Ďalšie bludisko</button>
            </div>
        </div>

        <div id="joystick-wrap">
            <div id="joystick-base"><div id="joystick-knob"></div></div>
        </div>

        <div id="controls">
            <button id="newMazeBtn"><span id="lbl-newmaze">Nové bludisko</span></button>
        </div>
    </div>

    <script>
        (function () {
            'use strict';

            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const canvasWrapper = document.getElementById('canvas-wrapper');
            const timeSpan = document.getElementById('timeValue');
            const fallsSpan = document.getElementById('fallsValue');
            const scoreSpan = document.getElementById('scoreValue');
            const bestSpan = document.getElementById('bestValue');
            const winOverlay = document.getElementById('win-overlay');
            const finalTime = document.getElementById('finalTime');
            const finalFalls = document.getElementById('finalFalls');
            const finalScore = document.getElementById('finalScore');
            const nextBtn = document.getElementById('nextBtn');
            const newMazeBtn = document.getElementById('newMazeBtn');
            const sizeGroup = document.getElementById('sizeGroup');
            const joystickBase = document.getElementById('joystick-base');
            const joystickKnob = document.getElementById('joystick-knob');

            // ----- PREKLADY -----
            document.getElementById('lbl-back').textContent = t('back');
            document.getElementById('lbl-size').textContent = t('tltDifficulty');
            document.getElementById('lbl-size-s').textContent = t('tltEasy');
            document.getElementById('lbl-size-m').textContent = t('tltMedium');
            document.getElementById('lbl-size-l').textContent = t('tltHard');
            document.getElementById('lbl-time').textContent = t('tltTime');
            document.getElementById('lbl-falls').textContent = t('tltFalls');
            document.getElementById('lbl-score').textContent = t('tltScore');
            document.getElementById('lbl-best').textContent = t('tltBest');
            document.getElementById('lbl-win').textContent = t('tltWin');
            document.getElementById('lbl-final-time').textContent = t('tltTime') + ':';
            document.getElementById('lbl-final-falls').textContent = t('tltFalls') + ':';
            document.getElementById('lbl-final-score').textContent = t('tltScore') + ':';
            nextBtn.textContent = t('tltNewMaze');
            document.getElementById('lbl-newmaze').textContent = t('tltNewMaze');
            document.getElementById('rules').textContent = t('tltRules');

            // ----- KONFIGURACIA -----
            const DIFFS = {
                s: { n: 8, holes: 3 },
                m: { n: 10, holes: 5 },
                l: { n: 12, holes: 8 }
            };
            const CW = 320, CH = 320;
            canvas.width = CW;
            canvas.height = CH;

            let diffKey = 'm';
            let N = 10;
            let cellSize = CW / N;
            let wallRight = [], wallDown = [];
            let walls = [];
            let ball = { x: 0, y: 0, r: 6, vx: 0, vy: 0 };
            let goal = { x: 0, y: 0, r: 10 };
            let holes = [];
            let score = 0, falls = 0;
            let best = parseInt(localStorage.getItem('tiltMazeBest') || '0', 10);
            let elapsed = 0;
            let running = false;
            let solved = false;
            let animId = null;
            let lastTs = null;

            let inputX = 0, inputY = 0;
            const keys = {};

            bestSpan.textContent = best;

            function mulberry32(seed) {
                let a = seed;
                return function () {
                    a |= 0; a = (a + 0x6D2B79F5) | 0;
                    let t = Math.imul(a ^ (a >>> 15), 1 | a);
                    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
                };
            }

            function generateMaze(n) {
                const rnd = mulberry32(Date.now() ^ Math.floor(Math.random() * 1e9));
                const wr = Array.from({ length: n }, () => Array(n).fill(true));
                const wd = Array.from({ length: n }, () => Array(n).fill(true));
                const visited = Array.from({ length: n }, () => Array(n).fill(false));
                const stack = [[0, 0]];
                visited[0][0] = true;
                while (stack.length) {
                    const [r, c] = stack[stack.length - 1];
                    const nbs = [];
                    if (r > 0 && !visited[r - 1][c]) nbs.push(['U', r - 1, c]);
                    if (r < n - 1 && !visited[r + 1][c]) nbs.push(['D', r + 1, c]);
                    if (c > 0 && !visited[r][c - 1]) nbs.push(['L', r, c - 1]);
                    if (c < n - 1 && !visited[r][c + 1]) nbs.push(['R', r, c + 1]);
                    if (nbs.length === 0) { stack.pop(); continue; }
                    const [dir, nr, nc] = nbs[Math.floor(rnd() * nbs.length)];
                    if (dir === 'U') wd[nr][nc] = false;
                    else if (dir === 'D') wd[r][c] = false;
                    else if (dir === 'L') wr[nr][nc] = false;
                    else if (dir === 'R') wr[r][c] = false;
                    visited[nr][nc] = true;
                    stack.push([nr, nc]);
                }
                // extra loop carving for less claustrophobic paths
                const extra = Math.floor(n * n * 0.12);
                for (let i = 0; i < extra; i++) {
                    const r = Math.floor(rnd() * n), c = Math.floor(rnd() * n);
                    if (rnd() < 0.5 && c < n - 1) wr[r][c] = false;
                    else if (r < n - 1) wd[r][c] = false;
                }
                return { wr, wd };
            }

            function buildWallRects(n, wr, wd) {
                const T = 4;
                const rects = [];
                for (let r = 0; r <= n; r++) {
                    for (let c = 0; c < n; c++) {
                        const isBorder = (r === 0 || r === n);
                        const hasWall = isBorder || (r > 0 && r < n && wd[r - 1][c]);
                        if (hasWall) {
                            rects.push({ x: c * cellSize - T / 2, y: r * cellSize - T / 2, w: cellSize + T, h: T });
                        }
                    }
                }
                for (let c = 0; c <= n; c++) {
                    for (let r = 0; r < n; r++) {
                        const isBorder = (c === 0 || c === n);
                        const hasWall = isBorder || (c > 0 && c < n && wr[r][c - 1]);
                        if (hasWall) {
                            rects.push({ x: c * cellSize - T / 2, y: r * cellSize - T / 2, w: T, h: cellSize + T });
                        }
                    }
                }
                return rects;
            }

            function farthestCell(n, wr, wd, start) {
                const dist = Array.from({ length: n }, () => Array(n).fill(-1));
                dist[start[0]][start[1]] = 0;
                const q = [start];
                let far = start, maxD = 0;
                while (q.length) {
                    const [r, c] = q.shift();
                    const d = dist[r][c];
                    if (d > maxD) { maxD = d; far = [r, c]; }
                    const nbs = [];
                    if (c < n - 1 && !wr[r][c]) nbs.push([r, c + 1]);
                    if (c > 0 && !wr[r][c - 1]) nbs.push([r, c - 1]);
                    if (r < n - 1 && !wd[r][c]) nbs.push([r + 1, c]);
                    if (r > 0 && !wd[r - 1][c]) nbs.push([r - 1, c]);
                    for (const [nr, nc] of nbs) {
                        if (dist[nr][nc] === -1) {
                            dist[nr][nc] = d + 1;
                            q.push([nr, nc]);
                        }
                    }
                }
                return far;
            }

            function cellCenter(r, c) {
                return { x: c * cellSize + cellSize / 2, y: r * cellSize + cellSize / 2 };
            }

            function newRound() {
                const cfg = DIFFS[diffKey];
                N = cfg.n;
                cellSize = CW / N;
                const { wr, wd } = generateMaze(N);
                wallRight = wr;
                wallDown = wd;
                walls = buildWallRects(N, wr, wd);

                const startCell = [0, 0];
                const goalCell = farthestCell(N, wr, wd, startCell);
                const startPos = cellCenter(startCell[0], startCell[1]);
                ball = { x: startPos.x, y: startPos.y, r: Math.max(4, cellSize * 0.22), vx: 0, vy: 0 };
                const goalPos = cellCenter(goalCell[0], goalCell[1]);
                goal = { x: goalPos.x, y: goalPos.y, r: cellSize * 0.32 };

                holes = [];
                const usedCells = new Set([startCell[0] + ',' + startCell[1], goalCell[0] + ',' + goalCell[1]]);
                let attempts = 0;
                while (holes.length < cfg.holes && attempts < 400) {
                    attempts++;
                    const r = Math.floor(Math.random() * N);
                    const c = Math.floor(Math.random() * N);
                    const key = r + ',' + c;
                    if (usedCells.has(key)) continue;
                    const distToStart = Math.hypot(r - startCell[0], c - startCell[1]);
                    if (distToStart < 2) continue;
                    usedCells.add(key);
                    const pos = cellCenter(r, c);
                    holes.push({ x: pos.x, y: pos.y, r: cellSize * 0.26 });
                }

                score = 0;
                falls = 0;
                elapsed = 0;
                running = true;
                solved = false;
                winOverlay.classList.remove('visible');
                fallsSpan.textContent = '0';
                scoreSpan.textContent = '0';
                timeSpan.textContent = '0.0s';
            }

            function respawnBall() {
                const pos = cellCenter(0, 0);
                ball.x = pos.x; ball.y = pos.y;
                ball.vx = 0; ball.vy = 0;
            }

            function resolveWalls() {
                for (const rect of walls) {
                    const closestX = Math.max(rect.x, Math.min(ball.x, rect.x + rect.w));
                    const closestY = Math.max(rect.y, Math.min(ball.y, rect.y + rect.h));
                    const dx = ball.x - closestX;
                    const dy = ball.y - closestY;
                    const distSq = dx * dx + dy * dy;
                    if (distSq < ball.r * ball.r && distSq > 0.0001) {
                        const dist = Math.sqrt(distSq);
                        const overlap = ball.r - dist;
                        const nx = dx / dist, ny = dy / dist;
                        ball.x += nx * overlap;
                        ball.y += ny * overlap;
                        const vn = ball.vx * nx + ball.vy * ny;
                        if (vn < 0) {
                            ball.vx -= vn * nx * 1.3;
                            ball.vy -= vn * ny * 1.3;
                        }
                    } else if (distSq <= 0.0001) {
                        ball.x += (Math.random() - 0.5) * 0.5;
                    }
                }
            }

            function update(dt) {
                if (!running || solved) return;
                elapsed += dt;
                timeSpan.textContent = elapsed.toFixed(1) + 's';

                const ACCEL = 480;
                ball.vx += inputX * ACCEL * dt;
                ball.vy += inputY * ACCEL * dt;
                ball.vx *= 0.965;
                ball.vy *= 0.965;

                const maxV = 260;
                const speed = Math.hypot(ball.vx, ball.vy);
                if (speed > maxV) {
                    ball.vx = ball.vx / speed * maxV;
                    ball.vy = ball.vy / speed * maxV;
                }

                ball.x += ball.vx * dt;
                ball.y += ball.vy * dt;
                resolveWalls();

                ball.x = Math.max(ball.r, Math.min(CW - ball.r, ball.x));
                ball.y = Math.max(ball.r, Math.min(CH - ball.r, ball.y));

                for (const h of holes) {
                    if (Math.hypot(ball.x - h.x, ball.y - h.y) < h.r * 0.7) {
                        falls++;
                        fallsSpan.textContent = falls;
                        respawnBall();
                        break;
                    }
                }

                if (Math.hypot(ball.x - goal.x, ball.y - goal.y) < goal.r * 0.55) {
                    winRound();
                }

                const tiltDeg = Math.max(-5, Math.min(5, inputX * 5));
                canvasWrapper.style.transform = `rotate(${tiltDeg}deg)`;
            }

            function winRound() {
                solved = true;
                running = false;
                const penalty = Math.round(elapsed * 3) + falls * 20;
                score = Math.max(10, 200 - penalty);
                scoreSpan.textContent = score;
                if (score > best) {
                    best = score;
                    bestSpan.textContent = best;
                    localStorage.setItem('tiltMazeBest', String(best));
                }
                finalTime.textContent = elapsed.toFixed(1) + 's';
                finalFalls.textContent = falls;
                finalScore.textContent = score;
                winOverlay.classList.add('visible');
            }

            function draw() {
                ctx.clearRect(0, 0, CW, CH);
                const grad = ctx.createLinearGradient(0, 0, 0, CH);
                grad.addColorStop(0, '#0b111e');
                grad.addColorStop(1, '#0f1a2b');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, CW, CH);

                ctx.fillStyle = '#334155';
                for (const w of walls) {
                    ctx.fillRect(w.x, w.y, w.w, w.h);
                }

                for (const h of holes) {
                    const g = ctx.createRadialGradient(h.x, h.y, 0, h.x, h.y, h.r);
                    g.addColorStop(0, '#1c0a0a');
                    g.addColorStop(1, '#3f1414');
                    ctx.fillStyle = g;
                    ctx.beginPath();
                    ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#f87171';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                }

                const pulse = 1 + Math.sin(Date.now() / 300) * 0.08;
                ctx.beginPath();
                ctx.arc(goal.x, goal.y, goal.r * pulse, 0, Math.PI * 2);
                const gg = ctx.createRadialGradient(goal.x, goal.y, 0, goal.x, goal.y, goal.r * pulse);
                gg.addColorStop(0, '#bbf7d0');
                gg.addColorStop(1, '#16a34a');
                ctx.fillStyle = gg;
                ctx.fill();

                const bg = ctx.createRadialGradient(ball.x - ball.r * 0.3, ball.y - ball.r * 0.3, 1, ball.x, ball.y, ball.r);
                bg.addColorStop(0, '#f0fdfa');
                bg.addColorStop(1, '#2dd4bf');
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
                ctx.fillStyle = bg;
                ctx.fill();
                ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            function loop(ts) {
                if (lastTs === null) lastTs = ts;
                let dt = (ts - lastTs) / 1000;
                lastTs = ts;
                dt = Math.min(dt, 0.05);
                update(dt);
                draw();
                animId = requestAnimationFrame(loop);
            }

            // ----- OVLADANIE -----
            function updateInputFromKeys() {
                let x = 0, y = 0;
                if (keys['ArrowLeft'] || keys['a']) x -= 1;
                if (keys['ArrowRight'] || keys['d']) x += 1;
                if (keys['ArrowUp'] || keys['w']) y -= 1;
                if (keys['ArrowDown'] || keys['s']) y += 1;
                if (x !== 0 && y !== 0) { x *= 0.7071; y *= 0.7071; }
                inputX = x; inputY = y;
            }

            document.addEventListener('keydown', (e) => {
                keys[e.key] = true;
                updateInputFromKeys();
            });
            document.addEventListener('keyup', (e) => {
                keys[e.key] = false;
                updateInputFromKeys();
            });

            let joyActive = false;
            const JOY_MAX = 33;

            function joyPos(e) {
                const rect = joystickBase.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: clientX - (rect.left + rect.width / 2), y: clientY - (rect.top + rect.height / 2) };
            }

            function joyStart(e) {
                joyActive = true;
                joyMove(e);
            }
            function joyMove(e) {
                if (!joyActive) return;
                const p = joyPos(e);
                const dist = Math.hypot(p.x, p.y);
                const clamped = Math.min(dist, JOY_MAX);
                const angle = Math.atan2(p.y, p.x);
                const kx = Math.cos(angle) * clamped;
                const ky = Math.sin(angle) * clamped;
                joystickKnob.style.left = (33 + kx) + 'px';
                joystickKnob.style.top = (33 + ky) + 'px';
                inputX = kx / JOY_MAX;
                inputY = ky / JOY_MAX;
            }
            function joyEnd() {
                joyActive = false;
                joystickKnob.style.left = '33px';
                joystickKnob.style.top = '33px';
                if (!keys['ArrowLeft'] && !keys['ArrowRight'] && !keys['ArrowUp'] && !keys['ArrowDown']) {
                    inputX = 0; inputY = 0;
                }
            }

            joystickBase.addEventListener('mousedown', joyStart);
            document.addEventListener('mousemove', joyMove);
            document.addEventListener('mouseup', joyEnd);
            joystickBase.addEventListener('touchstart', (e) => { e.preventDefault(); joyStart(e); }, { passive: false });
            joystickBase.addEventListener('touchmove', (e) => { e.preventDefault(); joyMove(e); }, { passive: false });
            joystickBase.addEventListener('touchend', (e) => { e.preventDefault(); joyEnd(); }, { passive: false });

            newMazeBtn.addEventListener('click', newRound);
            nextBtn.addEventListener('click', newRound);

            sizeGroup.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', () => {
                    sizeGroup.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    diffKey = btn.dataset.diff;
                    newRound();
                });
            });

            newRound();
            requestAnimationFrame(loop);
        })();
    </script>
</body>
</html>
