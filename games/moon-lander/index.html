<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Moon Lander · GamePad</title>
    <script src="../../i18n.js"></script>
    <style>
        #back-btn{
            position:fixed;top:14px;left:14px;z-index:60;
            display:flex;align-items:center;gap:7px;
            background:rgba(7,9,15,.88);border:1px solid #262a3d;color:#8e93ab;
            padding:7px 14px;border-radius:100px;text-decoration:none;
            font-size:12px;font-weight:600;backdrop-filter:blur(4px);transition:all .18s;
        }
        #back-btn:hover,#back-btn:active{border-color:#e2e8f0;color:#ffffff;}
        @media(max-width:480px){#back-btn{top:8px;left:8px;padding:5px 10px;font-size:11px;}}
        * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
        body {
            background:#0c0f16;
            font-family:'Segoe UI', Roboto, system-ui, sans-serif;
            display:flex; justify-content:center; align-items:center;
            min-height:100vh; margin:0; padding:12px;
            touch-action: manipulation;
        }
        #game-container {
            background:#151d2b; border-radius:28px; padding:20px 20px 24px;
            max-width:500px; width:100%;
            box-shadow:0 12px 40px rgba(0,0,0,.7); border:1px solid #2e3a4e;
            display:flex; flex-direction:column; gap:12px; position:relative;
        }
        #header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
        #header h1 {
            font-size:21px; font-weight:700;
            background:linear-gradient(135deg,#f8fafc,#94a3b8);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin:0;
        }
        #rules { font-size:12px; color:#8291ab; line-height:1.5; }
        #settings { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
        #settings label { color:#b0c4e0; font-size:12px; font-weight:500; }
        .btn-group { display:flex; gap:4px; background:#111a28; padding:4px; border-radius:10px; border:1px solid #29344a; }
        .btn-group button { background:transparent; border:none; color:#7a8aa8; padding:4px 10px; border-radius:8px; font-size:12px; font-weight:600; cursor:pointer; }
        .btn-group button.active { background:#e2e8f0; color:#0c0f16; }
        #info-panel { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
        .info-card { flex:1 1 auto; min-width:60px; background:#111a28; border-radius:14px; padding:8px 10px; border:1px solid #29344a; text-align:center; }
        .info-card h3 { font-size:10px; text-transform:uppercase; color:#7a8aa8; margin-bottom:4px; font-weight:500; letter-spacing:.4px; }
        .info-card .value { font-size:20px; font-weight:700; color:#eef3fc; display:block; }
        .high-score { border-color:#fbbf24; }
        .high-score h3 { color:#fbbf24 !important; }
        .high-score .value { color:#fbbf24 !important; }
        #status-line { text-align:center; font-size:12px; color:#cbd5e1; min-height:16px; font-weight:600; }
        #canvas-wrapper { background:#0f1622; border-radius:16px; padding:8px; box-shadow: inset 0 0 0 1px #2a3446; position:relative; align-self:center; max-width:100%; }
        #gameCanvas { display:block; border-radius:10px; touch-action:none; max-width:100%; height:auto; }
        #padrow { display:flex; gap:12px; justify-content:center; align-items:center; }
        #padrow button {
            background:#1a2740; border:1px solid #2f4260; color:#dfe9f5;
            border-radius:12px; width:62px; height:48px; font-size:19px; font-weight:700; cursor:pointer;
        }
        #padrow button.thrust { background:#e2e8f0; color:#0c0f16; border-color:#ffffff; width:110px; box-shadow:0 4px 0 #475569; }
        #padrow button:active { transform:translateY(2px); }
        #padrow button.thrust:active { box-shadow:0 0 0 #475569; }
        #end-overlay {
            position:absolute; inset:8px; background:rgba(8,12,22,.92); backdrop-filter:blur(6px);
            border-radius:10px; display:none; flex-direction:column; align-items:center; justify-content:center;
            gap:8px; padding:26px; z-index:10; color:#f0f4fe; text-align:center;
        }
        #end-overlay.visible { display:flex; }
        #end-overlay h2 { font-size:26px; background:linear-gradient(135deg,#f8fafc,#94a3b8); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        #end-overlay p { font-size:14px; color:#b0c4e0; }
        #restartBtn {
            background:#e2e8f0; border:1px solid #ffffff; border-radius:40px;
            padding:12px 32px; font-size:17px; font-weight:700; color:#0c0f16;
            box-shadow:0 6px 0 #475569; cursor:pointer; margin-top:6px;
        }
        #restartBtn:active { transform:translateY(6px); box-shadow:0 1px 0 #475569; }
        #controls { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
        #controls button { background:#1e2a3e; border:1px solid #354460; color:#d0def0; border-radius:12px; padding:9px 16px; font-size:13px; font-weight:600; cursor:pointer; }
        #controls button:active { transform:translateY(2px); }
    </style>
</head>
<body>

    <a href="../../index.html" id="back-btn">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      <span id="lbl-back"></span>
    </a>

    <div id="game-container">
        <div id="header">
            <h1 id="lbl-title">🌕</h1>
            <div id="settings">
                <label id="lbl-diff"></label>
                <div class="btn-group" id="diffGroup">
                    <button data-diff="easy"   id="lbl-easy"></button>
                    <button data-diff="medium" id="lbl-medium" class="active"></button>
                    <button data-diff="hard"   id="lbl-hard"></button>
                </div>
            </div>
        </div>

        <p id="rules"></p>

        <div id="info-panel">
            <div class="info-card"><h3 id="lbl-pad"></h3><span class="value" id="padValue">1</span></div>
            <div class="info-card"><h3 id="lbl-fuel"></h3><span class="value" id="fuelValue">100</span></div>
            <div class="info-card"><h3 id="lbl-score"></h3><span class="value" id="scoreValue">0</span></div>
            <div class="info-card high-score"><h3 id="lbl-best"></h3><span class="value" id="bestValue">0</span></div>
        </div>

        <div id="status-line"></div>

        <div id="canvas-wrapper">
            <canvas id="gameCanvas"></canvas>
            <div id="end-overlay">
                <h2 id="lbl-result"></h2>
                <p id="lbl-final-detail"></p>
                <p style="font-size:16px;color:#fbbf24;"><span id="lbl-final-score"></span> <span id="finalScore">0</span></p>
                <button id="restartBtn"></button>
            </div>
        </div>

        <div id="padrow">
            <button data-key="left">↺</button>
            <button class="thrust" data-key="thrust">▲</button>
            <button data-key="right">↻</button>
        </div>

        <div id="controls">
            <button id="pauseBtn"></button>
            <button id="newGameBtn"></button>
        </div>
    </div>

    <script>
    (function () {
        'use strict';

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const padSpan = document.getElementById('padValue');
        const fuelSpan = document.getElementById('fuelValue');
        const scoreSpan = document.getElementById('scoreValue');
        const bestSpan = document.getElementById('bestValue');
        const statusLine = document.getElementById('status-line');
        const endOverlay = document.getElementById('end-overlay');
        const resultH2 = document.getElementById('lbl-result');
        const finalDetail = document.getElementById('lbl-final-detail');
        const finalScore = document.getElementById('finalScore');
        const restartBtn = document.getElementById('restartBtn');
        const newGameBtn = document.getElementById('newGameBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const diffGroup = document.getElementById('diffGroup');

        // ----- PREKLADY -----
        document.getElementById('lbl-back').textContent   = t('back');
        document.getElementById('lbl-title').textContent  = '🌕 ' + t('mlnTitle');
        document.getElementById('lbl-diff').textContent   = t('uiDifficulty') + ':';
        document.getElementById('lbl-easy').textContent   = t('diffEasy');
        document.getElementById('lbl-medium').textContent = t('diffMedium');
        document.getElementById('lbl-hard').textContent   = t('diffHard');
        document.getElementById('lbl-pad').textContent    = t('mlnPad');
        document.getElementById('lbl-fuel').textContent   = t('mlnFuel');
        document.getElementById('lbl-score').textContent  = t('uiScore');
        document.getElementById('lbl-best').textContent   = t('uiBest');
        document.getElementById('lbl-final-score').textContent = t('uiScore') + ':';
        document.getElementById('rules').textContent      = t('mlnRules');
        pauseBtn.textContent   = t('uiPaused');
        restartBtn.textContent = t('uiPlayAgain');
        newGameBtn.textContent = t('uiNewGame');
        document.title = t('mlnTitle') + ' · GamePad';

        // ----- KONFIGURACIA -----
        const W = 460, H = 320;
        canvas.width = W; canvas.height = H;
        const SETUP = {
            easy:   { gravity: 0.020, fuel: 140, pad: 64, tries: 4, vy: 1.15, vx: 0.75, tilt: 16 },
            medium: { gravity: 0.027, fuel: 110, pad: 50, tries: 3, vy: 0.90, vx: 0.55, tilt: 12 },
            hard:   { gravity: 0.034, fuel: 88,  pad: 38, tries: 2, vy: 0.72, vx: 0.42, tilt: 9 },
        };
        const THRUST = 0.062, SPIN = 2.6;

        let diffKey = 'medium';
        let ground = new Float32Array(W);
        let pad = { x0: 0, x1: 0, y: 0 };
        let ship = null, padNo = 1, tries = 3, score = 0;
        let held = {}, paused = false, over = false;
        let sparks = [], raf = 0, lastTick = 0;
        let best = { easy: 0, medium: 0, hard: 0 };
        try { best = Object.assign(best, JSON.parse(localStorage.getItem('moonLanderBest') || '{}')); } catch (e) { /* ignore */ }

        const groundAt = x => ground[Math.max(0, Math.min(W - 1, Math.round(x)))];

        function buildTerrain() {
            const setup = SETUP[diffKey];
            const base = H * 0.78;
            const waves = [
                { amp: 22 + Math.random() * 14, len: 260 + Math.random() * 140, ph: Math.random() * 6.3 },
                { amp: 11 + Math.random() * 9,  len: 96 + Math.random() * 60,  ph: Math.random() * 6.3 },
                { amp: 5 + Math.random() * 4,   len: 34 + Math.random() * 22,  ph: Math.random() * 6.3 },
            ];
            for (let x = 0; x < W; x++) {
                let y = base;
                for (const w of waves) y += Math.sin(x / w.len * 6.283 + w.ph) * w.amp;
                ground[x] = Math.max(H * 0.42, Math.min(H - 14, y));
            }
            // flatten a landing pad, narrower on each successive touchdown
            const width = Math.max(24, setup.pad - (padNo - 1) * 5);
            const x0 = 40 + Math.random() * (W - 80 - width);
            const y = groundAt(x0 + width / 2);
            for (let x = Math.round(x0); x < x0 + width; x++) ground[x] = y;
            pad = { x0: Math.round(x0), x1: Math.round(x0 + width), y };
        }

        function resetShip() {
            const setup = SETUP[diffKey];
            ship = {
                x: 40 + Math.random() * (W - 80), y: 30,
                vx: (Math.random() - 0.5) * 0.8, vy: 0.12,
                a: 0, fuel: Math.max(40, setup.fuel - (padNo - 1) * 8), alive: true, landed: false,
            };
            sparks = [];
        }

        // ----- FYZIKA -----
        function tick(dt) {
            if (!ship.alive || ship.landed) return;
            const setup = SETUP[diffKey];
            if (held.left) ship.a -= SPIN * dt;
            if (held.right) ship.a += SPIN * dt;
            ship.a = Math.max(-90, Math.min(90, ship.a));

            let burning = false;
            if (held.thrust && ship.fuel > 0) {
                const rad = ship.a * Math.PI / 180;
                ship.vx += Math.sin(rad) * THRUST * dt;
                ship.vy -= Math.cos(rad) * THRUST * dt;
                ship.fuel = Math.max(0, ship.fuel - 0.42 * dt);
                burning = true;
                if (Math.random() < 0.7) sparks.push({
                    x: ship.x - Math.sin(rad) * 9, y: ship.y + Math.cos(rad) * 9,
                    vx: -Math.sin(rad) * 1.6 + (Math.random() - 0.5), vy: Math.cos(rad) * 1.6 + (Math.random() - 0.5),
                    life: 14,
                });
            }
            ship.burning = burning;
            ship.vy += setup.gravity * dt;
            ship.x += ship.vx * dt;
            ship.y += ship.vy * dt;
            if (ship.x < 6) { ship.x = 6; ship.vx = Math.abs(ship.vx) * 0.4; }
            if (ship.x > W - 6) { ship.x = W - 6; ship.vx = -Math.abs(ship.vx) * 0.4; }

            for (const s of sparks) { s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt; }
            sparks = sparks.filter(s => s.life > 0);

            const surface = groundAt(ship.x);
            if (ship.y + 9 >= surface) {
                ship.y = surface - 9;
                const onPad = ship.x >= pad.x0 && ship.x <= pad.x1;
                const gentle = Math.abs(ship.vy) <= setup.vy && Math.abs(ship.vx) <= setup.vx && Math.abs(ship.a) <= setup.tilt;
                if (onPad && gentle) land(); else crash();
            }
        }

        function land() {
            ship.landed = true;
            const setup = SETUP[diffKey];
            const gained = Math.round(120 + ship.fuel * 2 + (setup.pad - (pad.x1 - pad.x0)) * 3);
            score += gained;
            padNo++;
            refresh();
            statusLine.textContent = t('mlnLanded', { n: gained });
            setTimeout(() => {
                if (over) return;
                buildTerrain(); resetShip();
                statusLine.textContent = t('mlnPadNext', { n: padNo });
                refresh();
            }, 1400);
        }

        function crash() {
            ship.alive = false;
            for (let i = 0; i < 26; i++) sparks.push({
                x: ship.x, y: ship.y,
                vx: (Math.random() - 0.5) * 4, vy: (Math.random() - 0.7) * 4, life: 26,
            });
            tries--;
            refresh();
            if (tries <= 0) { setTimeout(() => finish(), 900); return; }
            statusLine.textContent = t('mlnCrash');
            setTimeout(() => {
                if (over) return;
                buildTerrain(); resetShip();
                statusLine.textContent = t('mlnTriesLeft', { n: tries });
            }, 1400);
        }

        function finish() {
            over = true;
            cancelAnimationFrame(raf);
            if (score > (best[diffKey] || 0)) {
                best[diffKey] = score;
                localStorage.setItem('moonLanderBest', JSON.stringify(best));
            }
            bestSpan.textContent = best[diffKey] || 0;
            resultH2.textContent = t('uiGameOver');
            finalDetail.textContent = t('mlnPad') + ' ' + (padNo - 1);
            finalScore.textContent = score;
            statusLine.textContent = '';
            draw();
            endOverlay.classList.add('visible');
        }

        function refresh() {
            padSpan.textContent = padNo;
            fuelSpan.textContent = Math.round(ship ? ship.fuel : 0);
            scoreSpan.textContent = score;
        }

        function loop(now) {
            raf = requestAnimationFrame(loop);
            if (paused || over) return;
            const dt = Math.min(3, (now - lastTick) / 16.67 || 1);
            lastTick = now;
            tick(dt);
            fuelSpan.textContent = Math.round(ship.fuel);
            draw();
        }

        function newGame() {
            padNo = 1; tries = SETUP[diffKey].tries; score = 0;
            over = false; paused = false; held = {};
            buildTerrain(); resetShip();
            bestSpan.textContent = best[diffKey] || 0;
            endOverlay.classList.remove('visible');
            statusLine.textContent = t('mlnHint');
            refresh();
            cancelAnimationFrame(raf);
            lastTick = performance.now();
            raf = requestAnimationFrame(loop);
            draw();
        }

        // ----- OVLADANIE -----
        const KEYS = {
            ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'thrust',
            a: 'left', d: 'right', w: 'thrust', A: 'left', D: 'right', W: 'thrust',
            ' ': 'thrust',
        };
        window.addEventListener('keydown', e => {
            const k = KEYS[e.key];
            if (!k) return;
            e.preventDefault();
            held[k] = true;
        });
        window.addEventListener('keyup', e => {
            const k = KEYS[e.key];
            if (k) held[k] = false;
        });
        document.querySelectorAll('#padrow button').forEach(b => {
            const k = b.dataset.key;
            const on = e => { e.preventDefault(); held[k] = true; };
            const off = e => { e.preventDefault(); held[k] = false; };
            b.addEventListener('mousedown', on); b.addEventListener('mouseup', off);
            b.addEventListener('mouseleave', off);
            b.addEventListener('touchstart', on, { passive: false });
            b.addEventListener('touchend', off, { passive: false });
            b.addEventListener('click', () => { held[k] = true; setTimeout(() => { held[k] = false; }, 160); });
        });
        canvas.addEventListener('touchstart', e => { e.preventDefault(); held.thrust = true; }, { passive: false });
        canvas.addEventListener('touchend', e => { e.preventDefault(); held.thrust = false; }, { passive: false });
        canvas.addEventListener('mousedown', () => { held.thrust = true; });
        canvas.addEventListener('mouseup', () => { held.thrust = false; });

        pauseBtn.addEventListener('click', () => {
            if (over) return;
            paused = !paused;
            statusLine.textContent = paused ? t('uiPaused') : '';
            draw();
        });
        restartBtn.addEventListener('click', newGame);
        newGameBtn.addEventListener('click', newGame);
        diffGroup.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                diffGroup.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                diffKey = btn.dataset.diff;
                newGame();
            });
        });

        // ----- VYKRESLENIE -----
        function draw() {
            const sky = ctx.createLinearGradient(0, 0, 0, H);
            sky.addColorStop(0, '#04060f'); sky.addColorStop(1, '#12172b');
            ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

            ctx.fillStyle = 'rgba(226,232,240,.5)';
            for (let i = 0; i < 40; i++) {
                const x = (i * 97) % W, y = (i * 53) % (H * 0.5);
                ctx.fillRect(x, y, 1.4, 1.4);
            }

            ctx.beginPath();
            ctx.moveTo(0, H);
            for (let x = 0; x < W; x++) ctx.lineTo(x, ground[x]);
            ctx.lineTo(W, H); ctx.closePath();
            ctx.fillStyle = '#1e2436'; ctx.fill();
            ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1.6;
            ctx.beginPath();
            for (let x = 0; x < W; x++) x ? ctx.lineTo(x, ground[x]) : ctx.moveTo(x, ground[x]);
            ctx.stroke();

            ctx.strokeStyle = '#4ade80'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(pad.x0, pad.y); ctx.lineTo(pad.x1, pad.y); ctx.stroke();
            ctx.fillStyle = '#4ade80';
            ctx.fillRect(pad.x0 - 2, pad.y - 6, 3, 6);
            ctx.fillRect(pad.x1 - 1, pad.y - 6, 3, 6);

            for (const s of sparks) {
                ctx.fillStyle = `rgba(251,191,36,${Math.max(0, s.life / 26)})`;
                ctx.fillRect(s.x - 1.2, s.y - 1.2, 2.4, 2.4);
            }

            if (ship.alive) {
                ctx.save();
                ctx.translate(ship.x, ship.y);
                ctx.rotate(ship.a * Math.PI / 180);
                if (ship.burning) {
                    ctx.fillStyle = 'rgba(251,146,60,.9)';
                    ctx.beginPath();
                    ctx.moveTo(-4, 8); ctx.lineTo(4, 8); ctx.lineTo(0, 8 + 9 + Math.random() * 5);
                    ctx.closePath(); ctx.fill();
                }
                ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 2; ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(-5, 6); ctx.lineTo(-8, 11);
                ctx.moveTo(5, 6); ctx.lineTo(8, 11);
                ctx.stroke();
                ctx.fillStyle = '#cbd5e1';
                ctx.beginPath();
                ctx.moveTo(0, -9); ctx.lineTo(7, 6); ctx.lineTo(-7, 6);
                ctx.closePath(); ctx.fill();
                ctx.fillStyle = '#38bdf8';
                ctx.beginPath(); ctx.arc(0, -1, 2.6, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            }

            // instruments
            const setup = SETUP[diffKey];
            const okv = Math.abs(ship.vy) <= setup.vy, okh = Math.abs(ship.vx) <= setup.vx, oka = Math.abs(ship.a) <= setup.tilt;
            ctx.font = '600 11px system-ui';
            ctx.textAlign = 'left'; ctx.textBaseline = 'top';
            ctx.fillStyle = okv ? '#4ade80' : '#f87171';
            ctx.fillText(t('mlnDown') + ' ' + Math.abs(ship.vy).toFixed(2), 8, 8);
            ctx.fillStyle = okh ? '#4ade80' : '#f87171';
            ctx.fillText(t('mlnDrift') + ' ' + Math.abs(ship.vx).toFixed(2), 8, 24);
            ctx.fillStyle = oka ? '#4ade80' : '#f87171';
            ctx.fillText(t('mlnTilt') + ' ' + Math.abs(Math.round(ship.a)) + '°', 8, 40);
            ctx.fillStyle = '#94a3b8'; ctx.textAlign = 'right';
            ctx.fillText(t('uiLives') + ' ' + Math.max(0, tries), W - 8, 8);

            if (paused) {
                ctx.fillStyle = 'rgba(4,6,15,.7)'; ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = '#e2e8f0'; ctx.font = '700 22px system-ui';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(t('uiPaused'), W / 2, H / 2);
            }
        }

        newGame();
    })();
    </script>
</body>
</html>
