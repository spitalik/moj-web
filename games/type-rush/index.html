<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Type Rush · GamePad</title>
    <script src="../../i18n.js"></script>
    <style>
        #back-btn{
            position:fixed;top:14px;left:14px;z-index:60;
            display:flex;align-items:center;gap:7px;
            background:rgba(7,9,15,.88);border:1px solid #1a2e40;color:#8291ab;
            padding:7px 14px;border-radius:100px;text-decoration:none;
            font-size:12px;font-weight:600;backdrop-filter:blur(4px);transition:all .18s;
        }
        #back-btn:hover,#back-btn:active{border-color:#60a5fa;color:#f0f4fe;}
        @media(max-width:480px){#back-btn{top:8px;left:8px;padding:5px 10px;font-size:11px;}}
        * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
        body {
            background:#0c0f16;
            font-family:'Segoe UI', Roboto, system-ui, sans-serif;
            display:flex; justify-content:center; align-items:center;
            min-height:100vh; margin:0; padding:12px;
            touch-action: manipulation;
        }
        #game-container {
            background:#151d2b;
            border-radius:28px;
            padding:20px 24px 24px;
            max-width:520px;
            width:100%;
            box-shadow:0 12px 40px rgba(0,0,0,.7);
            border:1px solid #2e3a4e;
            display:flex; flex-direction:column; gap:14px;
            position:relative;
        }
        #header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
        #header h1 {
            font-size:23px; font-weight:700;
            background:linear-gradient(135deg,#bfdbfe,#60a5fa);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
            margin:0;
        }
        #rules { font-size:12px; color:#8291ab; line-height:1.5; }
        #settings { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
        #settings label { color:#b0c4e0; font-size:12px; font-weight:500; }
        .btn-group { display:flex; gap:4px; background:#111a28; padding:4px; border-radius:10px; border:1px solid #29344a; }
        .btn-group button { background:transparent; border:none; color:#7a8aa8; padding:4px 10px; border-radius:8px; font-size:12px; font-weight:600; cursor:pointer; }
        .btn-group button.active { background:#60a5fa; color:#0c0f16; }
        #info-panel { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
        .info-card { flex:1 1 auto; min-width:60px; background:#111a28; border-radius:14px; padding:8px 10px; border:1px solid #29344a; text-align:center; }
        .info-card h3 { font-size:10px; text-transform:uppercase; color:#7a8aa8; margin-bottom:4px; font-weight:500; }
        .info-card .value { font-size:20px; font-weight:700; color:#eef3fc; display:block; }
        .high-score { border-color:#fbbf24; }
        .high-score h3 { color:#fbbf24 !important; }
        .high-score .value { color:#fbbf24 !important; }
        #canvas-wrapper {
            background:#0f1622; border-radius:16px; padding:8px;
            box-shadow: inset 0 0 0 1px #2a3446;
            position:relative; align-self:center;
        }
        #gameCanvas { display:block; border-radius:10px; }
        #game-over-overlay {
            position:absolute; inset:8px; background:rgba(8,12,22,.92); backdrop-filter:blur(6px);
            border-radius:10px; display:none; flex-direction:column; align-items:center; justify-content:center;
            gap:8px; padding:26px; z-index:10; color:#f0f4fe; text-align:center;
        }
        #game-over-overlay.visible { display:flex; }
        #game-over-overlay h2 {
            font-size:26px;
            background:linear-gradient(135deg,#bfdbfe,#60a5fa);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
        }
        #restartBtn {
            background:#60a5fa; border:1px solid #bfdbfe; border-radius:40px;
            padding:12px 32px; font-size:17px; font-weight:700; color:#0c0f16;
            box-shadow:0 6px 0 #1d4ed8; cursor:pointer; margin-top:6px;
        }
        #restartBtn:active { transform:translateY(6px); box-shadow:0 1px 0 #1d4ed8; }
        #kb { display:flex; flex-direction:column; gap:4px; align-items:center; margin-top:2px; }
        .kb-row { display:flex; gap:4px; }
        .kb-key {
            background:#1e2a3e; border:1px solid #354460; color:#d0def0;
            border-radius:7px; min-width:26px; height:34px; font-size:12px; font-weight:600;
            display:flex; align-items:center; justify-content:center; cursor:pointer;
        }
        .kb-key:active { background:#2c3c56; transform:translateY(1px); }
        .kb-key.wide { min-width:44px; font-size:10px; }
        @media (max-width:480px) {
            .kb-key { min-width:22px; height:30px; font-size:11px; }
        }
    </style>
</head>

            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreSpan = document.getElementById('scoreValue');
            const comboSpan = document.getElementById('comboValue');
            const livesSpan = document.getElementById('livesValue');
            const bestSpan = document.getElementById('bestValue');
            const gameOverOverlay = document.getElementById('game-over-overlay');
            const finalScore = document.getElementById('finalScore');
            const finalWpm = document.getElementById('finalWpm');
            const restartBtn = document.getElementById('restartBtn');
            const sizeGroup = document.getElementById('sizeGroup');
            const kbEl = document.getElementById('kb');

            // ----- PREKLADY -----
            document.getElementById('lbl-back').textContent = t('back');
            document.getElementById('lbl-size').textContent = t('typDifficulty');
            document.getElementById('lbl-size-s').textContent = t('typEasy');
            document.getElementById('lbl-size-m').textContent = t('typMedium');
            document.getElementById('lbl-size-l').textContent = t('typHard');
            document.getElementById('lbl-score').textContent = t('typScore');
            document.getElementById('lbl-combo').textContent = t('typCombo');
            document.getElementById('lbl-lives').textContent = t('typLives');
            document.getElementById('lbl-best').textContent = t('typBest');
            document.getElementById('lbl-gameover').textContent = t('typGameOver');
            document.getElementById('lbl-final-score').textContent = t('typScore') + ':';
            document.getElementById('lbl-final-wpm').textContent = t('typWpm') + ':';
            restartBtn.textContent = t('typReplay');
            document.getElementById('rules').textContent = t('typRules');

            // ----- ON-SCREEN KLAVESNICA -----
            const KB_ROWS = ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'];
            KB_ROWS.forEach(row => {
                const rowEl = document.createElement('div');
                rowEl.className = 'kb-row';
                row.split('').forEach(ch => {
                    const btn = document.createElement('div');
                    btn.className = 'kb-key';
                    btn.textContent = ch;
                    btn.addEventListener('click', () => handleChar(ch));
                    rowEl.appendChild(btn);
                });
                kbEl.appendChild(rowEl);
            });
            const backspaceRow = document.createElement('div');
            backspaceRow.className = 'kb-row';
            const bsBtn = document.createElement('div');
            bsBtn.className = 'kb-key wide';
            bsBtn.textContent = '⌫';
            bsBtn.addEventListener('click', () => backspaceCancel());
            backspaceRow.appendChild(bsBtn);
            kbEl.appendChild(backspaceRow);

            // ----- KONFIGURACIA -----
            const DIFFS = {
                easy:   { speed: 42, spawnMs: 1900, maxWords: 4 },
                medium: { speed: 56, spawnMs: 1500, maxWords: 5 },
                hard:   { speed: 74, spawnMs: 1150, maxWords: 6 }
            };
            const CW = 320, CH = 420;
            canvas.width = CW;
            canvas.height = CH;

            let diffKey = 'medium';
            let activeWords = [];
            let nextId = 1;
            let targetId = null;
            let score = 0, combo = 0, lives = 3;
            let best = parseInt(localStorage.getItem('typeRushBest') || '0', 10);
            let wordsCompleted = 0;
            let startTime = 0;
            let lastSpawn = 0;
            let running = true;
            let recentWords = [];
            let particles = [];

            bestSpan.textContent = best;

            function randomWord() {
                const pool = WORD_POOLS[diffKey];
                let w;
                let attempts = 0;
                do {
                    w = pool[Math.floor(Math.random() * pool.length)];
                    attempts++;
                } while (recentWords.includes(w) && attempts < 8);
                recentWords.push(w);
                if (recentWords.length > 12) recentWords.shift();
                return w;
            }

            function spawnWord() {
                const cfg = DIFFS[diffKey];
                if (activeWords.length >= cfg.maxWords) return;
                const text = randomWord();
                const margin = 20;
                const x = margin + Math.random() * (CW - margin * 2 - text.length * 9);
                activeWords.push({ id: nextId++, text, typed: 0, x, y: -20 });
            }

            function handleChar(ch) {
                if (!running) return;
                ch = ch.toLowerCase();
                if (targetId !== null) {
                    const w = activeWords.find(w => w.id === targetId);
                    if (!w) { targetId = null; return; }
                    if (w.text[w.typed] === ch) {
                        w.typed++;
                        if (w.typed === w.text.length) {
                            completeWord(w);
                        }
                    }
                    return;
                }
                const candidates = activeWords.filter(w => w.text[0] === ch);
                if (candidates.length === 0) return;
                candidates.sort((a, b) => b.y - a.y);
                const chosen = candidates[0];
                chosen.typed = 1;
                targetId = chosen.id;
                if (chosen.typed === chosen.text.length) {
                    completeWord(chosen);
                }
            }

            function backspaceCancel() {
                if (targetId !== null) {
                    const w = activeWords.find(w => w.id === targetId);
                    if (w) w.typed = 0;
                    targetId = null;
                }
            }

            function completeWord(w) {
                activeWords = activeWords.filter(x => x.id !== w.id);
                score += w.text.length * 10 + combo * 5;
                combo++;
                wordsCompleted++;
                targetId = null;
                scoreSpan.textContent = score;
                comboSpan.textContent = combo;
                if (score > best) {
                    best = score;
                    bestSpan.textContent = best;
                    localStorage.setItem('typeRushBest', String(best));
                }
                spawnParticles(w.x + w.text.length * 4, w.y);
            }

            function missWord(w) {
                activeWords = activeWords.filter(x => x.id !== w.id);
                if (targetId === w.id) targetId = null;
                combo = 0;
                comboSpan.textContent = '0';
                lives--;
                livesSpan.textContent = Math.max(0, lives);
                if (lives <= 0) {
                    endGame();
                }
            }

            function spawnParticles(x, y) {
                for (let i = 0; i < 8; i++) {
                    const ang = Math.random() * Math.PI * 2;
                    const spd = 1 + Math.random() * 2.5;
                    particles.push({ x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, life: 1 });
                }
            }

            function endGame() {
                running = false;
                const elapsedMin = Math.max(0.1, (Date.now() - startTime) / 60000);
                const wpm = Math.round(wordsCompleted / elapsedMin);
                finalScore.textContent = score;
                finalWpm.textContent = wpm;
                gameOverOverlay.classList.add('visible');
            }

            function resetGame() {
                activeWords = [];
                targetId = null;
                score = 0; combo = 0; lives = 3;
                wordsCompleted = 0;
                recentWords = [];
                particles = [];
                running = true;
                startTime = Date.now();
                lastSpawn = 0;
                scoreSpan.textContent = '0';
                comboSpan.textContent = '0';
                livesSpan.textContent = '3';
                gameOverOverlay.classList.remove('visible');
            }

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace') { e.preventDefault(); backspaceCancel(); return; }
                if (/^[a-zA-Z]$/.test(e.key)) handleChar(e.key);
            });

            restartBtn.addEventListener('click', resetGame);
            sizeGroup.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', () => {
                    sizeGroup.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    diffKey = btn.dataset.diff;
                    resetGame();
                });
            });

            function update(dt) {
                if (!running) return;
                const cfg = DIFFS[diffKey];
                lastSpawn += dt * 1000;
                if (lastSpawn >= cfg.spawnMs) {
                    lastSpawn = 0;
                    spawnWord();
                }
                for (const w of activeWords.slice()) {
                    w.y += cfg.speed * dt;
                    if (w.y > CH - 12) {
                        missWord(w);
                    }
                }
                particles = particles.filter(p => p.life > 0);
                for (const p of particles) {
                    p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.life -= 0.04;
                }
            }

            function draw() {
                ctx.clearRect(0, 0, CW, CH);
                const grad = ctx.createLinearGradient(0, 0, 0, CH);
                grad.addColorStop(0, '#0b111e');
                grad.addColorStop(1, '#0f1a2b');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, CW, CH);

                ctx.strokeStyle = 'rgba(248,113,113,0.35)';
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.moveTo(0, CH - 12);
                ctx.lineTo(CW, CH - 12);
                ctx.stroke();
                ctx.setLineDash([]);

                ctx.font = '16px "Segoe UI", Roboto, monospace';
                ctx.textBaseline = 'middle';
                for (const w of activeWords) {
                    const isTarget = w.id === targetId;
                    let cx = w.x;
                    for (let i = 0; i < w.text.length; i++) {
                        ctx.fillStyle = i < w.typed ? '#4ade80' : (isTarget ? '#f0f4fe' : '#94a3b8');
                        ctx.fillText(w.text[i], cx, w.y);
                        cx += ctx.measureText(w.text[i]).width + 1;
                    }
                    if (isTarget) {
                        ctx.strokeStyle = 'rgba(96,165,250,0.5)';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(w.x - 4, w.y - 12, cx - w.x + 4, 24);
                    }
                }

                for (const p of particles) {
                    ctx.save();
                    ctx.globalAlpha = Math.max(0, p.life);
                    ctx.fillStyle = '#4ade80';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            let lastTs = null;
            function loop(ts) {
                if (lastTs === null) lastTs = ts;
                let dt = (ts - lastTs) / 1000;
                lastTs = ts;
                dt = Math.min(dt, 0.05);
                update(dt);
                draw();
                requestAnimationFrame(loop);
            }

            resetGame();
            requestAnimationFrame(loop);
        })();
    </script>
