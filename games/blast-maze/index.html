<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blast Maze · GamePad</title>
    <script src="../../i18n.js"></script>
    <style>
        #back-btn{
            position:fixed;top:14px;left:14px;z-index:60;
            display:flex;align-items:center;gap:7px;
            background:rgba(7,9,15,.88);border:1px solid #42200c;color:#ab8467;
            padding:7px 14px;border-radius:100px;text-decoration:none;
            font-size:12px;font-weight:600;backdrop-filter:blur(4px);transition:all .18s;
        }
        #back-btn:hover,#back-btn:active{border-color:#fb7185;color:#fff0f1;}
        @media(max-width:480px){#back-btn{top:8px;left:8px;padding:5px 10px;font-size:11px;}}
        * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
        body {
            background:#0c0f16;
            font-family:'Segoe UI', Roboto, system-ui, sans-serif;
            display:flex; justify-content:center; align-items:center;
            min-height:100vh; margin:0; padding:12px;
            touch-action: manipulation;
        }
        #game-container {
            background:#151d2b; border-radius:28px; padding:20px 20px 24px;
            max-width:440px; width:100%;
            box-shadow:0 12px 40px rgba(0,0,0,.7); border:1px solid #2e3a4e;
            display:flex; flex-direction:column; gap:12px; position:relative;
        }
        #header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
        #header h1 {
            font-size:21px; font-weight:700;
            background:linear-gradient(135deg,#fecdd3,#fb7185);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin:0;
        }
        #rules { font-size:12px; color:#8291ab; line-height:1.5; }
        #settings { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
        #settings label { color:#b0c4e0; font-size:12px; font-weight:500; }
        .btn-group { display:flex; gap:4px; background:#111a28; padding:4px; border-radius:10px; border:1px solid #29344a; }
        .btn-group button { background:transparent; border:none; color:#7a8aa8; padding:4px 10px; border-radius:8px; font-size:12px; font-weight:600; cursor:pointer; }
        .btn-group button.active { background:#fb7185; color:#0c0f16; }
        #info-panel { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
        .info-card { flex:1 1 auto; min-width:60px; background:#111a28; border-radius:14px; padding:8px 10px; border:1px solid #29344a; text-align:center; }
        .info-card h3 { font-size:10px; text-transform:uppercase; color:#7a8aa8; margin-bottom:4px; font-weight:500; letter-spacing:.4px; }
        .info-card .value { font-size:20px; font-weight:700; color:#eef3fc; display:block; }
        .high-score { border-color:#fbbf24; }
        .high-score h3 { color:#fbbf24 !important; }
        .high-score .value { color:#fbbf24 !important; }
        #status-line { text-align:center; font-size:12px; color:#fda4af; min-height:16px; font-weight:600; }
        #canvas-wrapper { background:#0f1622; border-radius:16px; padding:8px; box-shadow: inset 0 0 0 1px #2a3446; position:relative; align-self:center; max-width:100%; }
        #gameCanvas { display:block; border-radius:10px; touch-action:none; max-width:100%; height:auto; }
        #padrow { display:flex; gap:14px; justify-content:center; align-items:center; }
        #pad { display:grid; grid-template-columns:repeat(3,44px); grid-template-rows:repeat(2,40px); gap:5px; }
        #pad button { background:#1a2740; border:1px solid #2f4260; color:#dfe9f5; border-radius:11px; font-size:17px; font-weight:700; cursor:pointer; }
        #pad button:active { transform:translateY(2px); }
        #pad .up { grid-column:2; grid-row:1; }
        #pad .left { grid-column:1; grid-row:2; }
        #pad .down { grid-column:2; grid-row:2; }
        #pad .right { grid-column:3; grid-row:2; }
        #bombBtn {
            width:74px; height:74px; border-radius:50%;
            background:#fb7185; border:2px solid #fecdd3; color:#0c0f16;
            font-size:26px; font-weight:800; cursor:pointer; box-shadow:0 5px 0 #9f1239;
        }
        #bombBtn:active { transform:translateY(5px); box-shadow:0 0 0 #9f1239; }
        #end-overlay {
            position:absolute; inset:8px; background:rgba(8,12,22,.92); backdrop-filter:blur(6px);
            border-radius:10px; display:none; flex-direction:column; align-items:center; justify-content:center;
            gap:8px; padding:26px; z-index:10; color:#f0f4fe; text-align:center;
        }
        #end-overlay.visible { display:flex; }
        #end-overlay h2 { font-size:26px; background:linear-gradient(135deg,#fecdd3,#fb7185); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        #end-overlay p { font-size:14px; color:#b0c4e0; }
        #restartBtn {
            background:#fb7185; border:1px solid #fecdd3; border-radius:40px;
            padding:12px 32px; font-size:17px; font-weight:700; color:#0c0f16;
            box-shadow:0 6px 0 #9f1239; cursor:pointer; margin-top:6px;
        }
        #restartBtn:active { transform:translateY(6px); box-shadow:0 1px 0 #9f1239; }
        #controls { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
        #controls button { background:#1e2a3e; border:1px solid #354460; color:#d0def0; border-radius:12px; padding:9px 16px; font-size:13px; font-weight:600; cursor:pointer; }
        #controls button:active { transform:translateY(2px); }
    </style>
</head>
<body>

    <a href="../../index.html" id="back-btn">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      <span id="lbl-back"></span>
    </a>

    <div id="game-container">
        <div id="header">
            <h1 id="lbl-title">🧨</h1>
            <div id="settings">
                <label id="lbl-diff"></label>
                <div class="btn-group" id="diffGroup">
                    <button data-diff="easy"   id="lbl-easy"></button>
                    <button data-diff="medium" id="lbl-medium" class="active"></button>
                    <button data-diff="hard"   id="lbl-hard"></button>
                </div>
            </div>
        </div>

        <p id="rules"></p>

        <div id="info-panel">
            <div class="info-card"><h3 id="lbl-level"></h3><span class="value" id="levelValue">1</span></div>
            <div class="info-card"><h3 id="lbl-lives"></h3><span class="value" id="livesValue">3</span></div>
            <div class="info-card"><h3 id="lbl-score"></h3><span class="value" id="scoreValue">0</span></div>
            <div class="info-card high-score"><h3 id="lbl-best"></h3><span class="value" id="bestValue">0</span></div>
        </div>

        <div id="status-line"></div>

        <div id="canvas-wrapper">
            <canvas id="gameCanvas"></canvas>
            <div id="end-overlay">
                <h2 id="lbl-result"></h2>
                <p id="lbl-final-detail"></p>
                <p style="font-size:16px;color:#fbbf24;"><span id="lbl-final-score"></span> <span id="finalScore">0</span></p>
                <button id="restartBtn"></button>
            </div>
        </div>

        <div id="padrow">
            <div id="pad">
                <button class="up" data-dir="up">▲</button>
                <button class="left" data-dir="left">◀</button>
                <button class="down" data-dir="down">▼</button>
                <button class="right" data-dir="right">▶</button>
            </div>
            <button id="bombBtn">✸</button>
        </div>

        <div id="controls">
            <button id="pauseBtn"></button>
            <button id="newGameBtn"></button>
        </div>
    </div>

    <script>
    (function () {
        'use strict';

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const levelSpan = document.getElementById('levelValue');
        const livesSpan = document.getElementById('livesValue');
        const scoreSpan = document.getElementById('scoreValue');
        const bestSpan = document.getElementById('bestValue');
        const statusLine = document.getElementById('status-line');
        const endOverlay = document.getElementById('end-overlay');
        const resultH2 = document.getElementById('lbl-result');
        const finalDetail = document.getElementById('lbl-final-detail');
        const finalScore = document.getElementById('finalScore');
        const restartBtn = document.getElementById('restartBtn');
        const newGameBtn = document.getElementById('newGameBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const bombBtn = document.getElementById('bombBtn');
        const diffGroup = document.getElementById('diffGroup');

        // ----- PREKLADY -----
        document.getElementById('lbl-back').textContent   = t('back');
        document.getElementById('lbl-title').textContent  = '🧨 ' + t('blzTitle');
        document.getElementById('lbl-diff').textContent   = t('uiDifficulty') + ':';
        document.getElementById('lbl-easy').textContent   = t('diffEasy');
        document.getElementById('lbl-medium').textContent = t('diffMedium');
        document.getElementById('lbl-hard').textContent   = t('diffHard');
        document.getElementById('lbl-level').textContent  = t('uiLevel');
        document.getElementById('lbl-lives').textContent  = t('uiLives');
        document.getElementById('lbl-score').textContent  = t('uiScore');
        document.getElementById('lbl-best').textContent   = t('uiBest');
        document.getElementById('lbl-final-score').textContent = t('uiScore') + ':';
        document.getElementById('rules').textContent      = t('blzRules');
        pauseBtn.textContent   = t('uiPaused');
        restartBtn.textContent = t('uiPlayAgain');
        newGameBtn.textContent = t('uiNewGame');
        document.title = t('blzTitle') + ' · GamePad';

        // ----- KONFIGURACIA -----
        const COLS = 13, ROWS = 11, TS = 26;
        const W = COLS * TS, H = ROWS * TS;
        canvas.width = W; canvas.height = H;
        const EMPTY = 0, HARD = 1, SOFT = 2;
        const SETUP = {
            easy:   { lives: 4, foes: 2, foeSpeed: 0.55, soft: 0.50 },
            medium: { lives: 3, foes: 3, foeSpeed: 0.72, soft: 0.58 },
            hard:   { lives: 2, foes: 4, foeSpeed: 0.92, soft: 0.66 },
        };
        const DIRS = { up: [-1, 0], down: [1, 0], left: [0, -1], right: [0, 1] };
        const FUSE = 132, FLASH = 26;                 // frames

        let diffKey = 'medium';
        let grid = [], bombs = [], flames = [], powers = [], foes = [];
        let hero = null, level = 1, lives = 3, score = 0;
        let maxBombs = 1, range = 1, heroSpeed = 1.35;
        let paused = false, over = false, frozen = 0, queued = null;
        let raf = 0, lastTick = 0;
        let best = { easy: 0, medium: 0, hard: 0 };
        try { best = Object.assign(best, JSON.parse(localStorage.getItem('blastMazeBest') || '{}')); } catch (e) { /* ignore */ }

        const solid = (r, c) => r < 0 || r >= ROWS || c < 0 || c >= COLS || grid[r][c] !== EMPTY;
        const bombAt = (r, c) => bombs.some(b => b.r === r && b.c === c);
        // a bomb never blocks whoever is standing on it — they may step off it once,
        // and it turns solid behind them
        const blocked = (r, c, e) => solid(r, c) ||
            (bombAt(r, c) && !(e && e.r === r && e.c === c));

        function buildLevel() {
            const setup = SETUP[diffKey];
            grid = Array.from({ length: ROWS }, (_, r) => Array.from({ length: COLS }, (_, c) => {
                if (r === 0 || c === 0 || r === ROWS - 1 || c === COLS - 1) return HARD;
                if (r % 2 === 0 && c % 2 === 0) return HARD;
                return EMPTY;
            }));
            // keep the three corners the player and foes start in clear
            const safe = [[1, 1], [1, 2], [2, 1], [ROWS - 2, COLS - 2], [ROWS - 2, COLS - 3], [ROWS - 3, COLS - 2],
                          [1, COLS - 2], [1, COLS - 3], [ROWS - 2, 1], [ROWS - 3, 1]];
            const isSafe = (r, c) => safe.some(s => s[0] === r && s[1] === c);
            const density = Math.min(0.74, setup.soft + (level - 1) * 0.03);
            for (let r = 1; r < ROWS - 1; r++) for (let c = 1; c < COLS - 1; c++) {
                if (grid[r][c] !== EMPTY || isSafe(r, c)) continue;
                if (Math.random() < density) grid[r][c] = SOFT;
            }
            bombs = []; flames = []; powers = [];
            const spots = [[ROWS - 2, COLS - 2], [1, COLS - 2], [ROWS - 2, 1], [ROWS - 4, COLS - 4]];
            const count = Math.min(spots.length, setup.foes + Math.floor((level - 1) / 2));
            foes = [];
            for (let i = 0; i < count; i++) {
                const [r, c] = spots[i % spots.length];
                // the corner spawns are in `safe`, but the fourth spot is not — clear it here
                // so a foe can never start life stuck inside a soft block
                if (grid[r][c] === SOFT) grid[r][c] = EMPTY;
                foes.push({ r, c, x: c * TS + TS / 2, y: r * TS + TS / 2, dir: 'left', alive: true });
            }
            hero = { r: 1, c: 1, x: TS * 1.5, y: TS * 1.5, dir: 'right', alive: true };
            queued = null;
        }

        // ----- BOMBY -----
        function drop() {
            if (over || paused || !hero.alive) return;
            if (bombs.filter(b => b.mine).length >= maxBombs) return;
            if (bombAt(hero.r, hero.c)) return;
            bombs.push({ r: hero.r, c: hero.c, fuse: FUSE, range, mine: true });
        }

        function detonate(bomb) {
            bomb.fuse = -1;
            const cells = [[bomb.r, bomb.c]];
            for (const [dr, dc] of Object.values(DIRS)) {
                for (let k = 1; k <= bomb.range; k++) {
                    const r = bomb.r + dr * k, c = bomb.c + dc * k;
                    if (r < 0 || r >= ROWS || c < 0 || c >= COLS) break;
                    if (grid[r][c] === HARD) break;
                    cells.push([r, c]);
                    if (grid[r][c] === SOFT) {
                        grid[r][c] = EMPTY;
                        score += 10;
                        if (Math.random() < 0.24) {
                            const kind = ['bomb', 'range', 'speed'][Math.floor(Math.random() * 3)];
                            powers.push({ r, c, kind });
                        }
                        break;
                    }
                }
            }
            for (const [r, c] of cells) flames.push({ r, c, life: FLASH });
            // a bomb caught in the blast goes off straight away
            for (const other of bombs) {
                if (other === bomb || other.fuse < 0) continue;
                if (cells.some(([r, c]) => r === other.r && c === other.c)) detonate(other);
            }
        }

        const inFlame = (r, c) => flames.some(f => f.r === r && f.c === c);

        // ----- POHYB -----
        const atCentre = e => Math.abs(e.x - (e.c * TS + TS / 2)) < 1.3 && Math.abs(e.y - (e.r * TS + TS / 2)) < 1.3;

        function move(e, dir, speed) {
            const [dr, dc] = DIRS[dir];
            const nx = e.x + dc * speed, ny = e.y + dr * speed;
            const nr = Math.floor(ny / TS), nc = Math.floor(nx / TS);
            // only step into a cell whose centre line we are actually allowed to cross
            if (blocked(dr ? nr : e.r, dc ? nc : e.c, e)) {
                const cx = e.c * TS + TS / 2, cy = e.r * TS + TS / 2;
                if (dc) e.x += (cx - e.x) * 0.5; else e.y += (cy - e.y) * 0.5;
                return false;
            }
            e.x = nx; e.y = ny;
            e.r = Math.max(0, Math.min(ROWS - 1, Math.floor(e.y / TS)));
            e.c = Math.max(0, Math.min(COLS - 1, Math.floor(e.x / TS)));
            const cx = e.c * TS + TS / 2, cy = e.r * TS + TS / 2;
            if (dc) e.y += (cy - e.y) * 0.4; else e.x += (cx - e.x) * 0.4;
            return true;
        }

        function heroTick(dt) {
            if (!hero.alive) return;
            if (queued) {
                const [dr, dc] = DIRS[queued];
                const ahead = blocked(hero.r + dr, hero.c + dc);
                if (!ahead || atCentre(hero)) hero.dir = queued;
                if (!ahead) queued = null;
            }
            move(hero, hero.dir, heroSpeed * dt);

            const p = powers.findIndex(x => x.r === hero.r && x.c === hero.c);
            if (p >= 0) {
                const kind = powers[p].kind;
                powers.splice(p, 1);
                if (kind === 'bomb') maxBombs = Math.min(6, maxBombs + 1);
                else if (kind === 'range') range = Math.min(5, range + 1);
                else heroSpeed = Math.min(2.4, heroSpeed + 0.22);
                score += 50;
                statusLine.textContent = t('blzPower');
            }
        }

        function foeTick(f, dt) {
            if (!f.alive) return;
            if (atCentre(f)) {
                const opts = Object.keys(DIRS).filter(d => {
                    const [dr, dc] = DIRS[d];
                    return !blocked(f.r + dr, f.c + dc);
                });
                if (!opts.length) return;
                const [hr, hc] = [hero.r, hero.c];
                // half the time head towards the player, otherwise wander
                if (Math.random() < 0.45) {
                    let bestDir = opts[0], bestVal = Infinity;
                    for (const d of opts) {
                        const [dr, dc] = DIRS[d];
                        const v = Math.abs(f.r + dr - hr) + Math.abs(f.c + dc - hc);
                        if (v < bestVal) { bestVal = v; bestDir = d; }
                    }
                    f.dir = bestDir;
                } else if (!opts.includes(f.dir) || Math.random() < 0.25) {
                    f.dir = opts[Math.floor(Math.random() * opts.length)];
                }
            }
            move(f, f.dir, SETUP[diffKey].foeSpeed * dt);
        }

        function hazards() {
            for (const f of foes) {
                if (!f.alive) continue;
                if (inFlame(f.r, f.c)) { f.alive = false; score += 200; refresh(); continue; }
                if (hero.alive && Math.hypot(f.x - hero.x, f.y - hero.y) < TS * 0.62) kill();
            }
            if (hero.alive && inFlame(hero.r, hero.c)) kill();
            if (foes.every(f => !f.alive)) nextLevel();
        }

        function kill() {
            hero.alive = false;
            lives--;
            refresh();
            frozen = 55;
            if (lives <= 0) { finish(); return; }
            statusLine.textContent = t('blzHit');
            setTimeout(() => {
                if (over) return;
                hero = { r: 1, c: 1, x: TS * 1.5, y: TS * 1.5, dir: 'right', alive: true };
                queued = null;
                bombs = []; flames = [];
            }, 700);
        }

        function nextLevel() {
            level++;
            buildLevel();
            frozen = 60;
            statusLine.textContent = t('blzCleared', { n: level });
            refresh();
        }

        function finish() {
            over = true;
            cancelAnimationFrame(raf);
            if (score > (best[diffKey] || 0)) {
                best[diffKey] = score;
                localStorage.setItem('blastMazeBest', JSON.stringify(best));
            }
            bestSpan.textContent = best[diffKey] || 0;
            resultH2.textContent = t('uiGameOver');
            finalDetail.textContent = t('uiLevel') + ' ' + level;
            finalScore.textContent = score;
            statusLine.textContent = '';
            draw();
            endOverlay.classList.add('visible');
        }

        function refresh() {
            levelSpan.textContent = level;
            livesSpan.textContent = Math.max(0, lives);
            scoreSpan.textContent = score;
        }

        function loop(now) {
            raf = requestAnimationFrame(loop);
            if (paused || over) return;
            const dt = Math.min(3, (now - lastTick) / 16.67 || 1);
            lastTick = now;

            for (const b of bombs) if (b.fuse >= 0) { b.fuse -= dt; if (b.fuse <= 0) detonate(b); }
            bombs = bombs.filter(b => b.fuse >= 0);
            for (const f of flames) f.life -= dt;
            flames = flames.filter(f => f.life > 0);

            if (frozen > 0) { frozen -= dt * 3; draw(); return; }
            heroTick(dt);
            for (const f of foes) foeTick(f, dt);
            hazards();
            draw();
        }

        function newGame() {
            level = 1; lives = SETUP[diffKey].lives; score = 0;
            maxBombs = 1; range = 1; heroSpeed = 1.35;
            over = false; paused = false; frozen = 40;
            buildLevel();
            bestSpan.textContent = best[diffKey] || 0;
            endOverlay.classList.remove('visible');
            statusLine.textContent = t('blzHint');
            refresh();
            cancelAnimationFrame(raf);
            lastTick = performance.now();
            raf = requestAnimationFrame(loop);
            draw();
        }

        // ----- OVLADANIE -----
        const KEYS = {
            ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
            w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right',
        };
        window.addEventListener('keydown', e => {
            if (e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); drop(); return; }
            const dir = KEYS[e.key];
            if (!dir) return;
            e.preventDefault();
            queued = dir;
        });
        document.querySelectorAll('#pad button').forEach(b => {
            b.addEventListener('click', () => { queued = b.dataset.dir; });
        });
        bombBtn.addEventListener('click', drop);
        let touchStart = null;
        canvas.addEventListener('touchstart', e => { e.preventDefault(); touchStart = [e.touches[0].clientX, e.touches[0].clientY]; }, { passive: false });
        canvas.addEventListener('touchend', e => {
            if (!touchStart) return;
            const t2 = e.changedTouches[0];
            const dx = t2.clientX - touchStart[0], dy = t2.clientY - touchStart[1];
            touchStart = null;
            if (Math.abs(dx) < 18 && Math.abs(dy) < 18) { drop(); return; }
            queued = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
        }, { passive: false });

        pauseBtn.addEventListener('click', () => {
            if (over) return;
            paused = !paused;
            statusLine.textContent = paused ? t('uiPaused') : '';
            draw();
        });
        restartBtn.addEventListener('click', newGame);
        newGameBtn.addEventListener('click', newGame);
        diffGroup.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                diffGroup.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                diffKey = btn.dataset.diff;
                newGame();
            });
        });

        // ----- VYKRESLENIE -----
        function draw() {
            ctx.fillStyle = '#12321f'; ctx.fillRect(0, 0, W, H);

            for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
                const x = c * TS, y = r * TS;
                if (grid[r][c] === HARD) {
                    ctx.fillStyle = '#4b5563'; ctx.fillRect(x, y, TS, TS);
                    ctx.fillStyle = '#6b7280'; ctx.fillRect(x + 2, y + 2, TS - 6, TS - 6);
                } else if (grid[r][c] === SOFT) {
                    ctx.fillStyle = '#7c4a24'; ctx.fillRect(x + 1, y + 1, TS - 2, TS - 2);
                    ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(x + 1, y + TS / 2); ctx.lineTo(x + TS - 1, y + TS / 2);
                    ctx.moveTo(x + TS / 2, y + 1); ctx.lineTo(x + TS / 2, y + TS / 2);
                    ctx.stroke();
                } else {
                    ctx.fillStyle = (r + c) % 2 ? '#16391f' : '#153420';
                    ctx.fillRect(x, y, TS, TS);
                }
            }

            for (const p of powers) {
                const cx = p.c * TS + TS / 2, cy = p.r * TS + TS / 2;
                ctx.beginPath(); ctx.arc(cx, cy, TS * 0.3, 0, Math.PI * 2);
                ctx.fillStyle = p.kind === 'bomb' ? '#fb7185' : (p.kind === 'range' ? '#fbbf24' : '#38bdf8');
                ctx.fill();
                ctx.fillStyle = '#0c0f16'; ctx.font = '700 12px system-ui';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(p.kind === 'bomb' ? '+' : (p.kind === 'range' ? '✸' : '»'), cx, cy + 1);
            }

            for (const b of bombs) {
                const cx = b.c * TS + TS / 2, cy = b.r * TS + TS / 2;
                const pulse = 1 + 0.12 * Math.sin(b.fuse * 0.35);
                ctx.beginPath(); ctx.arc(cx, cy, TS * 0.32 * pulse, 0, Math.PI * 2);
                ctx.fillStyle = '#1f2937'; ctx.fill();
                ctx.strokeStyle = '#fb7185'; ctx.lineWidth = 2; ctx.stroke();
            }

            for (const f of flames) {
                const x = f.c * TS, y = f.r * TS;
                const a = Math.max(0, f.life / FLASH);
                ctx.fillStyle = `rgba(251,146,60,${0.35 + 0.5 * a})`;
                ctx.fillRect(x + 1, y + 1, TS - 2, TS - 2);
                ctx.fillStyle = `rgba(255,241,190,${0.5 * a})`;
                ctx.fillRect(x + 5, y + 5, TS - 10, TS - 10);
            }

            for (const f of foes) {
                if (!f.alive) continue;
                ctx.beginPath(); ctx.arc(f.x, f.y, TS * 0.34, 0, Math.PI * 2);
                ctx.fillStyle = '#a78bfa'; ctx.fill();
                ctx.strokeStyle = '#4c1d95'; ctx.lineWidth = 1.6; ctx.stroke();
                ctx.fillStyle = '#1e1b4b';
                ctx.beginPath(); ctx.arc(f.x - 3.5, f.y - 2, 1.9, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(f.x + 3.5, f.y - 2, 1.9, 0, Math.PI * 2); ctx.fill();
            }

            if (hero.alive) {
                ctx.beginPath(); ctx.arc(hero.x, hero.y, TS * 0.36, 0, Math.PI * 2);
                ctx.fillStyle = '#fecdd3'; ctx.fill();
                ctx.strokeStyle = '#9f1239'; ctx.lineWidth = 2; ctx.stroke();
                const [dr, dc] = DIRS[hero.dir];
                ctx.fillStyle = '#9f1239';
                ctx.beginPath(); ctx.arc(hero.x + dc * 4, hero.y + dr * 4, 2.6, 0, Math.PI * 2); ctx.fill();
            }

            if (paused) {
                ctx.fillStyle = 'rgba(5,10,8,.7)'; ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = '#fecdd3'; ctx.font = '700 22px system-ui';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(t('uiPaused'), W / 2, H / 2);
            }
        }

        newGame();
    })();
    </script>
