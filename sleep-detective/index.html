<!doctype html>
<html lang="sk" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sleep Detective</title>
<meta name="description" content="Zisti, čo ti kazí spánok: ranný a večerný záznam, podozriví a experimenty.">
<meta name="theme-color" content="#141a2d" id="theme-color">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sleep Detective">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/logo.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<script>
  // Zvolený vzhľad nastavíme ešte pred vykreslením, aby stránka neblikla inými farbami.
  try {
    var st = JSON.parse(localStorage.getItem('sleepDetective.settings.v1') || '{}');
    if (/^(dark|light|system)$/.test(st.theme)) document.documentElement.setAttribute('data-theme', st.theme);
  } catch (e) { /* bez úložiska platí tmavý vzhľad */ }
</script>
<style>
/* Layout: na počítači appka v ráme telefónu v strede, na mobile a po inštalácii na celú obrazovku.
   Vzhľad: tmavý (predvolený), svetlý alebo podľa systému – prepína sa atribútom data-theme na <html>. */
:root, :root[data-theme="dark"] {
  --ink: #0d1120;
  --night: #141a2d;
  --dusk: #1c2340;
  --dusk-2: #252e52;
  --line: #2d375e;
  --fg: #e9ebf5;
  --muted: #99a2c4;
  --lamp: #f3c46b;
  --lamp-ink: #2b1f06;
  --lamp-text: #f3c46b;
  --bar: #3a4677;
  --good: #72d6ab;
  --bad: #f2877d;
  --bad-ink: #2a0c08;
  --mid: #c7a6ff;
  --frame: #0a0d19;
  --scrim: rgba(5, 7, 15, 0.62);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --ink: #dfe3ee; --night: #f3f5fa; --dusk: #ffffff; --dusk-2: #e6eaf3; --line: #d6dcea;
  --fg: #161d36; --muted: #5a6382; --lamp: #f0b44c; --lamp-ink: #2b1f06; --lamp-text: #8f5c06;
  --bar: #c2cadf; --good: #1d8f62; --bad: #c8463a; --bad-ink: #ffffff; --mid: #6f49cf;
  --frame: #c9d0e0; --scrim: rgba(20, 26, 45, 0.35);
  color-scheme: light;
}
@media (prefers-color-scheme: light) {
  :root[data-theme="system"] {
    --ink: #dfe3ee; --night: #f3f5fa; --dusk: #ffffff; --dusk-2: #e6eaf3; --line: #d6dcea;
    --fg: #161d36; --muted: #5a6382; --lamp: #f0b44c; --lamp-ink: #2b1f06; --lamp-text: #8f5c06;
    --bar: #c2cadf; --good: #1d8f62; --bad: #c8463a; --bad-ink: #ffffff; --mid: #6f49cf;
    --frame: #c9d0e0; --scrim: rgba(20, 26, 45, 0.35);
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
html, body { background: var(--ink); color: var(--fg); }
[hidden] { display: none !important; }
body {
  margin: 0;
  font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }

.stage { display: flex; justify-content: center; align-items: flex-start; max-width: 1040px; margin: 0 auto; }

/* Phone */
.phone {
  flex: 0 0 auto; width: 390px; max-width: 100%;
  height: min(820px, calc(100dvh - 64px)); min-height: 640px;
  background: var(--night); border: 1px solid var(--line); border-radius: 38px;
  box-shadow: 0 30px 80px -30px #000a, 0 0 0 8px var(--frame);
  overflow: hidden; display: flex; flex-direction: column; position: relative;
}
.appbar { flex: none; display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; padding: 12px 14px 4px; }
.appbar .brand { text-align: center; font-family: var(--f-display); font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
.appbar .brand span { color: var(--lamp-text); }
.icon-btn { background: var(--dusk); border: 0; border-radius: 50%; width: 38px; height: 38px; display: grid; place-items: center; font-size: 18px; color: var(--fg); }
.icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn:hover { background: var(--dusk-2); }
.scroll { flex: 1; overflow-y: auto; padding: 4px 18px 24px; display: flex; flex-direction: column; gap: 14px; scrollbar-width: thin; }
.tabbar { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); background: var(--night); padding: 6px 6px 12px; }
.tab { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; font-size: 11px; color: var(--muted); border-radius: 12px; }
.tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--lamp-text); }

/* Shared app parts */
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.head { display: flex; flex-direction: column; gap: 4px; padding-top: 6px; }
.head h2 { font-size: 28px; line-height: 1.1; }
.card { background: var(--dusk); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.card h3 { font-size: 17px; }
.card.lamp { background: var(--lamp); color: var(--lamp-ink); }
.card.lamp .eyebrow { color: var(--lamp-ink); opacity: 0.7; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.btn { border: 0; border-radius: 14px; padding: 13px 16px; font-weight: 600; background: var(--lamp); color: var(--lamp-ink); text-align: center; }
.btn.dark { background: var(--lamp-ink); color: var(--lamp); }
.btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--fg); font-weight: 500; }
.card.lamp .btn.ghost { border-color: var(--lamp-ink); color: var(--lamp-ink); }
.btn.danger { background: transparent; border: 1px solid var(--bad); color: var(--bad); }
.btn.danger-fill { background: var(--bad); color: var(--bad-ink); }
.btn:disabled { opacity: 0.45; cursor: default; }
.link { background: none; border: 0; padding: 0; color: var(--lamp-text); font-weight: 500; text-align: left; }

.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.steps li::marker { color: var(--lamp-text); font-family: var(--f-mono); font-size: 12px; }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat b { font-family: var(--f-display); font-size: 19px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat span { font-size: 11px; color: var(--muted); }

.pill { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.t-bad { color: var(--bad); } .t-mid { color: var(--mid); } .t-good { color: var(--good); } .t-few { color: var(--muted); } .t-lamp { color: var(--lamp-text); }

/* Suspects */
.suspect { background: var(--dusk); border: 1px solid transparent; border-radius: 18px; padding: 14px 16px; display: grid; grid-template-columns: 34px 1fr; gap: 4px 12px; text-align: left; width: 100%; }
.suspect:hover { border-color: var(--line); }
.suspect .ico { grid-row: span 3; font-size: 22px; line-height: 1; padding-top: 2px; }
.suspect .name { font-weight: 600; font-size: 16px; display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
.meter { display: block; height: 5px; border-radius: 3px; background: var(--dusk-2); overflow: hidden; margin-top: 4px; }
.meter i { display: block; height: 100%; border-radius: 3px; background: currentColor; }

/* Chart */
.chart svg { width: 100%; height: auto; display: block; }
.chart .b-on { fill: var(--lamp); }
.chart .b-off { fill: var(--bar); }
.chart .b-exp { fill: var(--good); }
.chart .grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 3; }
.chart text { fill: var(--muted); font-family: var(--f-mono); font-size: 9px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

/* Compare bars */
.cmp { display: flex; flex-direction: column; gap: 6px; }
.cmp-row { display: grid; grid-template-columns: 74px 1fr 64px; gap: 8px; align-items: center; font-size: 12px; }
.cmp-row .track { height: 10px; background: var(--dusk-2); border-radius: 5px; overflow: hidden; }
.cmp-row .track i { display: block; height: 100%; border-radius: 5px; }
.cmp-row b { font-variant-numeric: tabular-nums; text-align: right; font-weight: 600; }

/* Log */
.seg { display: grid; grid-template-columns: repeat(var(--n, 2), 1fr); background: var(--night); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.scroll > .seg { background: var(--dusk); border-color: transparent; }
.seg button { border: 0; background: none; padding: 9px 6px; border-radius: 9px; color: var(--muted); font-weight: 500; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--dusk-2); color: var(--fg); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--night); border-radius: 999px; padding: 9px 13px; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
.chip[aria-pressed="true"] { background: var(--lamp); color: var(--lamp-ink); border-color: var(--lamp); font-weight: 600; }
input[type="range"] { width: 100%; accent-color: var(--lamp); }
select { width: 100%; font: inherit; color: var(--fg); background: var(--night); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; }
input[type="text"][aria-invalid="true"] { border-color: var(--bad); }
.num-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.num-row label { display: grid; gap: 4px; }
.num-err { color: var(--bad); min-height: 0; }
input[type="text"] { width: 100%; font: inherit; color: var(--fg); background: var(--night); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; }
.hist { display: flex; flex-direction: column; }
.hist-row { display: grid; grid-template-columns: 56px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-size: 13px; }
.hist-row:first-child { border-top: 0; }

/* Experiments */
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day { aspect-ratio: 1; max-width: 100%; border-radius: 10px; border: 1px dashed var(--lamp-ink); display: grid; place-items: center; font-family: var(--f-mono); font-size: 11px; opacity: 0.55; }
.day.done { background: var(--lamp-ink); color: var(--lamp); border-style: solid; opacity: 1; }
.day.broke { background: transparent; border: 1px solid var(--lamp-ink); text-decoration: line-through; opacity: 1; }
.exp-item { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.exp-item:first-of-type { border-top: 0; }
.exp-item .ico { font-size: 20px; }
.exp-item .btn { padding: 8px 12px; font-size: 13px; border-radius: 10px; }
.inline-msg { font-size: 13px; color: var(--lamp-text); }

/* Sheet (check-in, detail, nastavenia) */
.sheet { position: absolute; inset: 0; background: var(--night); z-index: 5; display: flex; flex-direction: column; }
.sheet-top { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 6px; flex: none; }
.progress { display: flex; gap: 5px; }
.progress i { width: 20px; height: 4px; border-radius: 2px; background: var(--dusk-2); }
.progress i.on { background: var(--lamp); }
.q { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 22px; padding: 0 22px 40px; overflow-y: auto; }
.q h2 { font-size: 30px; line-height: 1.1; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { background: var(--dusk); border: 1px solid transparent; border-radius: 16px; padding: 15px 16px; text-align: left; display: flex; align-items: center; gap: 14px; font-size: 16px; }
.opt:hover { border-color: var(--lamp); }
.opt .n { font-family: var(--f-mono); font-size: 13px; width: 28px; height: 28px; border-radius: 50%; background: var(--dusk-2); display: grid; place-items: center; flex: none; }
.set-label { font-weight: 600; font-size: 14px; }

/* Potvrdzovacie okno */
.modal { position: absolute; inset: 0; z-index: 8; background: var(--scrim); display: grid; place-items: center; padding: 20px; }
.modal-card { background: var(--dusk); border: 1px solid var(--line); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 340px; box-shadow: 0 20px 60px -20px #000a; }
.modal-card h3 { font-size: 20px; }
.modal-card .row .btn { flex: 1; }

/* Nočný záznam: zámerne vždy čierny a tlmený, aby obrazovka v noci nesvietila */
.night { position: absolute; inset: 0; z-index: 7; background: #000; color: #6f7590; display: flex; flex-direction: column; padding: 18px 20px calc(env(safe-area-inset-bottom, 0px) + 22px); }
.night-top { padding-top: env(safe-area-inset-top, 0px); font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
.night-top i { width: 8px; height: 8px; border-radius: 50%; background: #b0443a; }
@media (prefers-reduced-motion: no-preference) { .night-top i { animation: blink 2s ease-in-out infinite; } @keyframes blink { 50% { opacity: .25; } } }
.night-main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 14px; text-align: center; }
.night-clock { font-family: var(--f-display); font-size: 68px; line-height: 1; color: #a9aec4; font-variant-numeric: tabular-nums; }
.night-lvl { width: 180px; height: 4px; border-radius: 2px; background: #15182a; overflow: hidden; }
.night-lvl i { display: block; height: 100%; width: 0; background: #4d5577; transition: width .1s linear; }
.night-stats { display: flex; gap: 32px; margin-top: 10px; }
.night-stats div { display: flex; flex-direction: column; gap: 2px; }
.night-stats b { font-family: var(--f-display); font-size: 24px; color: #a9aec4; font-variant-numeric: tabular-nums; }
.night-stats span { font-size: 12px; }
.night-tip { font-size: 13px; max-width: 30ch; }
.night-tip.warn { color: #b98a3d; }
.night-stop { background: transparent; border: 1px solid #2a2f45; color: #a9aec4; border-radius: 14px; padding: 14px; font-weight: 600; }
.clip { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-size: 13px; }
.clip:first-of-type { border-top: 0; }
.clip .icon-btn { width: 36px; height: 36px; font-size: 14px; }
.sound-row { display: grid; grid-template-columns: 56px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; width: 100%; font-size: 13px; }
.sound-row:first-of-type { border-top: 0; }

.toast { position: absolute; left: 16px; right: 16px; bottom: 84px; background: var(--fg); color: var(--night); border-radius: 14px; padding: 12px 14px; font-size: 14px; font-weight: 500; z-index: 9; box-shadow: 0 10px 30px -10px #000a; }

/* Mobil a nainštalovaná appka: bez rámu telefónu, na celú obrazovku */
@media (max-width: 520px), (display-mode: standalone) {
  html, body { height: 100%; }
  body { padding: 0; overflow: hidden; }
  .stage { display: block; max-width: none; height: 100%; }
  .phone { width: 100%; height: 100%; min-height: 0; max-height: none; border: 0; border-radius: 0; box-shadow: none; }
  .appbar { padding-top: calc(env(safe-area-inset-top, 0px) + 10px); padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }
  .scroll { padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
  .sheet-top { padding-top: calc(env(safe-area-inset-top, 0px) + 14px); }
  .tabbar { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); }
  .toast { bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); }
}
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: up .22s ease-out; }
  .modal-card { animation: up .18s ease-out; }
  @keyframes up { from { transform: translateY(24px); opacity: .6; } }
}
</style>
</head>
<body>

<div class="stage">
  <div class="phone" id="phone">
    <header class="appbar">
      <button class="icon-btn" data-act="settings" type="button" aria-label="Nastavenia" title="Nastavenia">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <div class="brand">Sleep <span>Detective</span></div>
      <span></span>
    </header>
    <main class="scroll" id="view"></main>
    <nav class="tabbar" id="tabbar">
      <button class="tab" data-tab="today" type="button"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Dnes</button>
      <button class="tab" data-tab="log" type="button"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg>Záznam</button>
      <button class="tab" data-tab="case" type="button"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>Spis</button>
      <button class="tab" data-tab="exp" type="button"><svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6L4.5 18.5A1.7 1.7 0 0 0 6 21h12a1.7 1.7 0 0 0 1.5-2.5L14 9V3"/><path d="M7 15h10"/></svg>Experimenty</button>
    </nav>
    <div id="sheet" class="sheet" hidden></div>
    <div id="night" class="night" hidden></div>
    <div id="modal" class="modal" hidden></div>
    <div id="toast" class="toast" hidden role="status"></div>
  </div>
</div>

<script src="sound.js"></script>
<script>
(function () {
  "use strict";

  // ---------- Číselníky ----------
  const FACTORS = [
    { k: "coffee",   name: "Káva po 14:00",    icon: "☕", exp: "Bez kávy po 14:00",               expShort: "bez kávy po 14:00" },
    { k: "phone",    name: "Mobil v posteli",  icon: "📱", exp: "Mobil mimo postele",              expShort: "bez mobilu v posteli" },
    { k: "alcohol",  name: "Alkohol",          icon: "🍷", exp: "Bez alkoholu",                    expShort: "bez alkoholu" },
    { k: "lateMeal", name: "Jedlo po 20:00",   icon: "🍝", exp: "Večera najneskôr o 19:30",        expShort: "s večerou do 19:30" },
    { k: "stress",   name: "Stresný deň",      icon: "😣", exp: "10 min uvoľnenia pred spaním",    expShort: "s uvoľnením pred spaním" },
    { k: "sportEve", name: "Šport po 19:00",   icon: "🏃", exp: "Tréning pred 18:00",              expShort: "s tréningom pred 18:00" },
    { k: "nap",      name: "Šlofík cez deň",   icon: "💤", exp: "Bez šlofíka po 15:00",            expShort: "bez šlofíka" }
  ];
  const FMAP = Object.fromEntries(FACTORS.map(f => [f.k, f]));
  const METRICS = [
    { k: "latency", label: "Zaspávanie", better: "low",  thr: 10,   fmt: v => Math.round(v) + " min" },
    { k: "wakes",   label: "Prebudenia", better: "low",  thr: 0.5,  fmt: v => dec(v) + "×" },
    { k: "quality", label: "Kvalita",    better: "high", thr: 0.45, fmt: v => dec(v) + " / 5" }
  ];
  const STATUS = {
    confirmed: { label: "Potvrdené",        cls: "t-bad" },
    prime:     { label: "Hlavný podozrivý", cls: "t-bad" },
    suspect:   { label: "Podozrivý",        cls: "t-mid" },
    clear:     { label: "Asi nevinný",      cls: "t-good" },
    acquitted: { label: "Oslobodený",       cls: "t-good" },
    few:       { label: "Málo dôkazov",     cls: "t-few" }
  };
  const MIN_NIGHTS = 7;     // od koľkých nocí so záznamom večera aj rána sa ukáže spis
  const GOOD_NIGHTS = 14;   // od koľkých nocí sú výsledky spoľahlivejšie
  const DAYS = ["nedeľa", "pondelok", "utorok", "streda", "štvrtok", "piatok", "sobota"];
  const MONTHS = ["januára", "februára", "marca", "apríla", "mája", "júna", "júla", "augusta", "septembra", "októbra", "novembra", "decembra"];

  // ---------- Pomocné funkcie ----------
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const dec = v => (Math.round(v * 10) / 10).toFixed(1).replace(".", ",");
  const mean = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const toD = s => new Date(s + "T12:00:00");
  const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const today = () => iso(new Date());
  const addDays = (s, n) => { const d = toD(s); d.setDate(d.getDate() + n); return iso(d); };
  const short = s => { const d = toD(s); return d.getDate() + ". " + (d.getMonth() + 1) + "."; };
  const long = s => { const d = toD(s); const w = DAYS[d.getDay()]; return w.charAt(0).toUpperCase() + w.slice(1) + " " + d.getDate() + ". " + MONTHS[d.getMonth()]; };
  const hmShort = h => { const m = Math.round(h * 60); return Math.floor(m / 60) + ":" + String(m % 60).padStart(2, "0"); };
  const clock = ms => { const d = new Date(ms); return d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0"); };
  const nightsWord = n => n === 1 ? "noc" : (n >= 2 && n <= 4 ? "noci" : "nocí");
  const recordsWord = n => n === 1 ? "záznam" : (n >= 2 && n <= 4 ? "záznamy" : "záznamov");

  // ---------- Stav ----------
  // D = dáta, ktoré zadal používateľ. SET = nastavenia. UI = stav obrazovky (neukladá sa).
  const DATA_KEY = "sleepDetective.data.v2";
  const SET_KEY = "sleepDetective.settings.v1";
  const LEGACY_KEY = "sleepDetective.state.v1";   // staré ukážkové dáta z prototypu
  const emptyData = () => ({
    nights: [],      // ranné check-iny: { date, quality, duration, latency, wakes, energy }
    evenings: {},    // večerné záznamy podľa dátumu: { f: {faktor: true}, temp }
    exp: null,       // bežiaci experiment: { k, start, length }
    verdicts: {},    // výsledky experimentov podľa faktora
    closed: [],      // uzavreté experimenty
    sounds: {}       // nočné záznamy zvuku podľa dátumu rána (súhrn; ukážky sú v IndexedDB)
  });
  let D = emptyData();
  let SET = { theme: "dark", name: "", expLength: 7, installDismissed: false, soundSensitivity: "medium",
    clipSnoreN: 4, clipSnoreSec: 10, clipNoiseN: 8, clipNoiseSec: 10, clipKbps: 32 };   // ukážky: počet za noc a dĺžka v s pre každý druh zvuku
  const UI = { tab: "today", logMode: new Date().getHours() >= 15 ? "evening" : "morning", msg: null };

  function save() {
    try { localStorage.setItem(DATA_KEY, JSON.stringify(D)); } catch (e) { /* bez úložiska appka beží len do zatvorenia */ }
  }
  function saveSet() {
    try { localStorage.setItem(SET_KEY, JSON.stringify(SET)); } catch (e) { /* nastavenie sa len nezapamätá */ }
  }
  function load() {
    try { localStorage.removeItem(LEGACY_KEY); } catch (e) { /* nič */ }
    try {
      const d = JSON.parse(localStorage.getItem(DATA_KEY));
      if (d && Array.isArray(d.nights)) D = Object.assign(emptyData(), d);
    } catch (e) { /* poškodené dáta ignorujeme */ }
    try {
      const s = JSON.parse(localStorage.getItem(SET_KEY));
      if (s) {
        // staršie nastavenie „ukladať ukážky: nie“ = žiadne ukážky
        if (s.soundClips === false && s.clipSnoreN === undefined) { s.clipSnoreN = 0; s.clipNoiseN = 0; }
        delete s.soundClips;
        SET = Object.assign(SET, s);
      }
    } catch (e) { /* predvolené nastavenia */ }
  }

  // ---------- Vzhľad ----------
  const lightQuery = matchMedia("(prefers-color-scheme: light)");
  function applyTheme() {
    document.documentElement.setAttribute("data-theme", SET.theme);
    const light = SET.theme === "light" || (SET.theme === "system" && lightQuery.matches);
    $("#theme-color").setAttribute("content", light ? "#f3f5fa" : "#141a2d");
  }
  lightQuery.addEventListener("change", applyTheme);

  // ---------- Dáta pre analýzu ----------
  // Ranný záznam z dňa D patrí k večeru dňa D-1. Faktory sa berú z večerného záznamu.
  function nightsF() {
    return D.nights.map(n => {
      const ev = D.evenings[addDays(n.date, -1)];
      return Object.assign({}, n, { f: ev ? ev.f : null });
    });
  }
  const analyzable = () => nightsF().filter(n => n.f);

  function analyze(list) {
    return FACTORS.map(F => {
      const w = list.filter(n => n.f[F.k]), wo = list.filter(n => !n.f[F.k]);
      const r = { F, nWith: w.length, nWithout: wo.length, m: {} };
      let best = null;
      for (const M of METRICS) {
        const a = mean(w.map(n => n[M.k])), b = mean(wo.map(n => n[M.k]));
        const harm = (M.better === "low" ? a - b : b - a) / M.thr;
        r.m[M.k] = { a, b, harm };
        if (!best || harm > best.harm) best = { M, a, b, harm };
      }
      r.best = best;
      const v = D.verdicts[F.k];
      if (v) r.status = v.confirmed ? "confirmed" : "acquitted";
      else if (w.length < 3 || wo.length < 3) r.status = "few";
      else if (best.harm >= 2.2) r.status = "prime";
      else if (best.harm >= 1.1) r.status = "suspect";
      else r.status = "clear";
      const order = { confirmed: 5, prime: 4, suspect: 3, clear: 1, acquitted: 0, few: -1 };
      r.rank = order[r.status] * 10 + Math.max(0, best.harm);
      return r;
    }).sort((x, y) => y.rank - x.rank);
  }

  function sentence(r) {
    const v = D.verdicts[r.F.k];
    if (v) return v.text;
    if (r.status === "few") {
      if (r.nWith < 3) return "Zatiaľ " + r.nWith + " " + nightsWord(r.nWith) + " s týmto faktorom. Potrebujem aspoň 3.";
      return "Zatiaľ len " + r.nWithout + " " + nightsWord(r.nWithout) + " bez neho. Potrebujem aspoň 3 na porovnanie.";
    }
    if (r.status === "clear") return "Zatiaľ žiadny jasný vplyv na tvoj spánok.";
    const { M, a, b } = r.best;
    if (M.k === "latency") return "Zaspávaš v priemere o " + Math.round(a - b) + " min dlhšie (" + Math.round(a) + " vs. " + Math.round(b) + " min).";
    if (M.k === "wakes") return "Budíš sa v priemere " + dec(a) + "× za noc, inak " + dec(b) + "×.";
    return "Kvalita spánku " + dec(a) + " z 5, bez neho " + dec(b) + ".";
  }

  // ---------- Graf ----------
  function nightChart(F, M, list, opts) {
    opts = opts || {};
    const nights = list.slice(-30);
    const W = 340, H = 132, pl = 30, pr = 4, pt = 10, pb = 22;
    const vals = nights.map(n => n[M.k]);
    const max = M.k === "quality" ? 5 : M.k === "wakes" ? Math.max(3, Math.ceil(Math.max(...vals))) : Math.max(10, Math.ceil(Math.max(...vals) / 10) * 10);
    const bw = (W - pl - pr) / Math.max(nights.length, 7), ih = H - pt - pb;
    const y = v => pt + ih - (v / max) * ih;
    let s = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + M.label + ' po nociach">';
    [0, max / 2, max].forEach(t => {
      s += '<line class="grid" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(t) + '" y2="' + y(t) + '"/>';
      s += '<text x="' + (pl - 5) + '" y="' + (y(t) + 3) + '" text-anchor="end">' + (M.k === "latency" ? Math.round(t) : dec(t).replace(",0", "")) + "</text>";
    });
    nights.forEach((n, i) => {
      const v = n[M.k], h = Math.max(1.5, (v / max) * ih);
      const x = pl + i * bw + 1.2, w = Math.max(2, bw - 2.4);
      s += '<rect class="' + (n.f[F.k] ? "b-on" : "b-off") + '" x="' + x.toFixed(1) + '" y="' + (pt + ih - h).toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="1.5"><title>' + short(n.date) + ": " + M.fmt(v) + (n.f[F.k] ? " · " + F.name : "") + "</title></rect>";
      if (opts.expMark && D.exp && D.exp.k === F.k && n.date >= D.exp.start) {
        s += '<rect class="b-exp" x="' + x.toFixed(1) + '" y="' + (pt + ih + 3) + '" width="' + w.toFixed(1) + '" height="3" rx="1"/>';
      }
    });
    s += '<text x="' + pl + '" y="' + (H - 4) + '">' + short(nights[0].date) + "</text>";
    if (nights.length > 1) s += '<text x="' + (pl + nights.length * bw) + '" y="' + (H - 4) + '" text-anchor="end">' + short(nights[nights.length - 1].date) + "</text>";
    return '<div class="chart">' + s + "</svg></div>";
  }

  // ---------- Experiment ----------
  function expNights() {
    if (!D.exp) return [];
    return nightsF().filter(n => n.date >= D.exp.start).slice(0, D.exp.length);
  }
  const brokeRule = (n, k) => !!(n.f && n.f[k]);

  function concludeExp() {
    const k = D.exp.k, F = FMAP[k];
    const all = nightsF();
    const en = expNights();
    const kept = en.filter(n => !brokeRule(n, k));
    const pre = all.filter(n => n.date < D.exp.start && n.f);
    const preW = pre.filter(n => n.f[k]), preWo = pre.filter(n => !n.f[k]);
    // porovnávame tú vec, v ktorej bol faktor podozrivý (pri nedostatku dát zaspávanie)
    let M = METRICS[0];
    if (preW.length && preWo.length) {
      let bestH = -Infinity;
      METRICS.forEach(m => {
        const a = mean(preW.map(n => n[m.k])), b = mean(preWo.map(n => n[m.k]));
        const hh = (m.better === "low" ? a - b : b - a) / m.thr;
        if (hh > bestH) { bestH = hh; M = m; }
      });
    }
    const when = short(D.exp.start) + " – " + short(en.length ? en[en.length - 1].date : today());
    let msg;
    if (preW.length < 2 || kept.length < 3) {
      const text = preW.length < 2
        ? "Nemám s čím porovnať: pred experimentom " + (preW.length === 1 ? "bola len 1 noc" : "nebola žiadna noc") + " s týmto faktorom."
        : "Pravidlo sa dodržalo len " + kept.length + " " + nightsWord(kept.length) + " z " + en.length + ", na záver to nestačí.";
      D.closed.unshift({ icon: F.icon, name: F.exp, when, tone: "t-few", label: "Bez záveru", text });
      msg = "Experiment skončil bez záveru.";
    } else {
      const before = mean(preW.map(n => n[M.k])), during = mean(kept.map(n => n[M.k]));
      const gain = (M.better === "low" ? before - during : during - before) / M.thr;
      const confirmed = gain >= 1;
      const text = M.k === "latency"
        ? "Počas experimentu trvalo zaspávanie v priemere " + Math.round(during) + " min. Predtým v dňoch s faktorom " + Math.round(before) + " min."
        : M.label + " počas experimentu " + M.fmt(during) + ", predtým v dňoch s faktorom " + M.fmt(before) + ".";
      D.verdicts[k] = {
        confirmed,
        text: (confirmed ? "Vina potvrdená. " : "Vplyv sa nepotvrdil. ") + text,
        advice: confirmed ? "Odporúčanie: " + F.expShort + " si nechaj ako návyk." : "Tento faktor ťa zrejme netrápi. Zameraj sa na ďalšieho podozrivého."
      };
      D.closed.unshift({ icon: F.icon, name: F.exp, when, tone: confirmed ? "t-bad" : "t-good", label: confirmed ? "Vina potvrdená" : "Nepotvrdené", text });
      msg = confirmed ? "Verdikt: " + F.name + " ti naozaj kazí spánok." : "Verdikt: " + F.name + " je nevinný.";
    }
    D.exp = null;
    return msg;
  }

  // ---------- Obrazovky ----------
  function greeting() {
    const h = new Date().getHours();
    const g = h < 11 ? "Dobré ráno" : h < 18 ? "Dobrý deň" : "Dobrý večer";
    return g + (SET.name ? ", " + esc(SET.name) : "");
  }
  function stat(v, l) { return '<div class="stat"><b>' + v + "</b><span>" + l + "</span></div>"; }
  function nightCard() {
    return '<div class="card"><div class="eyebrow">Nočný záznam zvuku</div><h3>Ideš spať?</h3>' +
      '<p class="small muted">Zapni počúvanie a polož telefón k posteli. Appka rozpozná chrápanie a hluk, celú noc nenahráva.</p>' +
      '<button class="btn ghost" data-act="startNight" type="button">Spustiť nočný záznam</button></div>';
  }

  function viewToday() {
    const t = today();
    const checked = D.nights.some(n => n.date === t);
    const list = analyzable();
    let h = '<div class="head"><div class="eyebrow">' + long(t) + "</div><h2>" + greeting() + "</h2></div>";
    h += installCard();

    if (!checked) {
      h += '<div class="card lamp"><div class="eyebrow">Ranný check-in</div><h3>Ako sa ti dnes spalo?</h3><p class="small">5 krátkych otázok, zaberie to pár sekúnd.</p><button class="btn dark" data-act="checkin" type="button">Začať check-in</button></div>';
    }
    const hr = new Date().getHours();
    if (hr >= 17 && !D.evenings[t]) {
      h += '<div class="card"><div class="eyebrow">Večerný záznam</div><h3>Čo sa dnes dialo?</h3><p class="small muted">Káva, alkohol, mobil v posteli… Ťukneš na ikonky a hotovo.</p><button class="btn" data-act="gotoEvening" type="button">Zapísať večer</button></div>';
    }
    if (hr >= 18 || hr < 4) h += nightCard();
    if (D.sounds[t]) {
      const s = D.sounds[t];
      h += '<div class="card"><div class="eyebrow">Zvuk dnešnej noci</div><p>' + soundLine(s).replace(/^./, c => c.toUpperCase()) + "</p>" +
        '<button class="link" data-act="soundReport" data-key="' + t + '" type="button">Zvuková stopa →</button></div>';
    }

    if (!D.nights.length) {
      h += '<div class="card"><div class="eyebrow">Ako to funguje</div><ol class="steps">' +
        "<li>Večer ťukni na to, čo sa cez deň dialo.</li>" +
        "<li>Ráno odpovedz na 5 otázok o spánku.</li>" +
        "<li>Po " + MIN_NIGHTS + " nociach ti ukážem prvých podozrivých, po " + GOOD_NIGHTS + " sú výsledky spoľahlivejšie.</li>" +
        "<li>Podozrenie overíš experimentom.</li></ol>" +
        '<p class="small muted">Všetko sa ukladá len v tomto zariadení.</p></div>';
      return h;
    }

    const last = D.nights[D.nights.length - 1];
    h += '<div class="card"><div class="eyebrow">Posledná noc · ' + short(last.date) + "</div>" +
      '<div class="stats">' + stat(hmShort(last.duration), "spánok") + stat(last.latency + " min", "zaspávanie") +
      stat(last.wakes + "×", "prebudenia") + stat(last.energy + "/5", "ráno energia") + "</div></div>";

    if (list.length < MIN_NIGHTS) {
      h += '<div class="card"><div class="row"><div class="eyebrow">Detektív zbiera stopy</div><span class="small muted">' + list.length + " / " + MIN_NIGHTS + "</span></div>" +
        '<span class="meter t-lamp"><i style="width:' + (list.length / MIN_NIGHTS * 100) + '%"></i></span>' +
        '<p class="small muted">Počítajú sa noci, ktoré majú večerný aj ranný záznam.</p></div>';
    } else {
      const top = analyze(list).find(r => r.status === "confirmed" || r.status === "prime" || r.status === "suspect");
      if (top) {
        const st = STATUS[top.status];
        h += '<div class="card"><div class="row"><div class="eyebrow">Zo spisu</div><span class="pill ' + st.cls + '">' + st.label + "</span></div>" +
          "<h3>" + top.F.icon + " " + top.F.name + '</h3><p class="small">' + sentence(top) + "</p>" +
          nightChart(top.F, top.best.M, list) +
          '<div class="legend"><span><i style="background:var(--lamp)"></i>noc po: ' + top.F.name.toLowerCase() + '</span><span><i style="background:var(--bar)"></i>ostatné noci</span></div>' +
          '<button class="link" data-act="detail" data-k="' + top.F.k + '" type="button">Otvoriť dôkazy →</button></div>';
      } else {
        h += '<div class="card"><div class="eyebrow">Zo spisu</div><p class="small">Zatiaľ nemám jasného podozrivého. Pokračuj v zápisoch.</p><button class="link" data-goto="case" type="button">Otvoriť spis →</button></div>';
      }
    }

    if (D.exp) {
      const n = expNights().length;
      h += '<div class="card"><div class="row"><div class="eyebrow">Bežiaci experiment</div><span class="small muted">noc ' + n + " z " + D.exp.length + "</span></div>" +
        "<h3>" + FMAP[D.exp.k].icon + " " + FMAP[D.exp.k].exp + "</h3>" +
        '<span class="meter t-lamp"><i style="width:' + (n / D.exp.length * 100) + '%"></i></span>' +
        '<button class="link" data-goto="exp" type="button">Pozrieť priebeh →</button></div>';
    }
    return h;
  }

  function viewLog() {
    const t = today();
    let h = '<div class="head"><div class="eyebrow">Stopy</div><h2>Záznam</h2></div>';
    h += '<div class="seg" role="group" aria-label="Typ záznamu">' +
      '<button type="button" data-mode="evening" aria-pressed="' + (UI.logMode === "evening") + '">Večer</button>' +
      '<button type="button" data-mode="morning" aria-pressed="' + (UI.logMode === "morning") + '">Ráno</button></div>';

    if (UI.logMode === "evening") {
      const ev = D.evenings[t];
      const f = ev ? ev.f : {};
      const temp = ev && ev.temp ? ev.temp : 20;
      h += '<div class="card"><h3>Čo sa dnes dialo?</h3><p class="small muted">Ťukni na všetko, čo platí. Zvyšok je „nie“.</p><div class="chips">';
      FACTORS.forEach(F => {
        h += '<button type="button" class="chip" data-chip="' + F.k + '" aria-pressed="' + !!f[F.k] + '"><span aria-hidden="true">' + F.icon + "</span>" + F.name + "</button>";
      });
      h += '</div><label class="small" for="temp">Teplota v spálni: <b id="tempv">' + temp + ' °C</b></label>' +
        '<input id="temp" type="range" min="16" max="26" step="1" value="' + temp + '">' +
        '<button class="btn" data-act="saveEvening" type="button"' + (ev && ev.saved ? " disabled" : "") + ">" + (ev && ev.saved ? "Večer je zapísaný" : "Uložiť večer") + "</button></div>";
      h += nightCard();
    } else {
      const checked = D.nights.some(n => n.date === t);
      h += '<div class="card"><h3>Ranný check-in</h3><p class="small muted">' + (checked ? "Dnešné ráno už máš zapísané." : "Kvalita, dĺžka spánku, zaspávanie, prebudenia a energia.") + "</p>" +
        '<button class="btn" data-act="checkin" type="button"' + (checked ? " disabled" : "") + ">" + (checked ? "Hotovo" : "Začať check-in") + "</button></div>";
    }

    h += '<div class="card"><div class="eyebrow">Posledné noci</div>';
    const recent = nightsF().slice(-7).reverse();
    if (!recent.length) {
      h += '<p class="small muted">Zatiaľ žiadne záznamy. Prvý pribudne po rannom check-ine.</p>';
    } else {
      h += '<div class="hist">';
      recent.forEach(n => {
        const icons = n.f ? FACTORS.filter(F => n.f[F.k]).map(F => '<span title="' + F.name + '">' + F.icon + "</span>").join(" ") : "";
        const what = !n.f ? '<span class="muted">bez večerného záznamu</span>' : (icons || '<span class="muted">nič zvláštne</span>');
        h += '<div class="hist-row"><span class="muted">' + short(n.date) + "</span><span>" + what + "</span>" +
          '<span class="small" style="text-align:right">' + n.latency + " min · " + n.quality + "/5</span></div>";
      });
      h += "</div>";
    }
    h += "</div>";

    const soundKeys = Object.keys(D.sounds).sort().reverse().slice(0, 7);
    if (soundKeys.length) {
      h += '<div class="card"><div class="eyebrow">Zvuk v noci</div>';
      soundKeys.forEach(k => {
        const s = D.sounds[k];
        h += '<button class="sound-row" data-act="soundReport" data-key="' + k + '" type="button"><span class="muted">' + short(k) + "</span><span>" + soundLine(s) + '</span><span class="t-lamp">→</span></button>';
      });
      h += "</div>";
    }
    return h;
  }

  function viewCase() {
    const list = analyzable();
    const n = list.length;
    let h = '<div class="head"><div class="eyebrow">Spis · ' + n + " " + nightsWord(n) + " dôkazov</div><h2>Kto ti kradne spánok?</h2></div>";
    if (n < MIN_NIGHTS) {
      h += '<div class="card"><div class="row"><h3>Zatiaľ málo stôp</h3><span class="small muted">' + n + " / " + MIN_NIGHTS + "</span></div>" +
        '<span class="meter t-lamp"><i style="width:' + (n / MIN_NIGHTS * 100) + '%"></i></span>' +
        '<p class="small muted">Prvých podozrivých ukážem po ' + MIN_NIGHTS + " nociach, ktoré majú večerný aj ranný záznam. Spoľahlivejšie výsledky budú po " + GOOD_NIGHTS + " nociach.</p></div>";
    } else {
      h += '<p class="small muted">Porovnávam noci s daným faktorom a bez neho. Súvislosť ešte nie je dôkaz. Vinu potvrdí až experiment.' +
        (n < GOOD_NIGHTS ? " Výsledky sú zatiaľ predbežné." : "") + "</p>";
      analyze(list).forEach(r => {
        const st = STATUS[r.status];
        const strength = r.status === "few" ? 0 : clamp(r.best.harm / 3.5, 0, 1);
        h += '<button class="suspect" type="button" data-act="detail" data-k="' + r.F.k + '">' +
          '<span class="ico" aria-hidden="true">' + r.F.icon + "</span>" +
          '<span class="name">' + r.F.name + ' <span class="pill ' + st.cls + '">' + st.label + "</span></span>" +
          '<span class="small muted">' + sentence(r) + "</span>" +
          '<span class="meter ' + st.cls + '"><i style="width:' + (strength * 100) + '%"></i></span></button>';
      });
    }
    h += snoreCard();
    h += '<p class="small muted">Sleep Detective nie je zdravotnícka pomôcka. Ak chrápeš s prestávkami v dýchaní alebo ťa cez deň stále premáha únava, zájdi k lekárovi.</p>';
    return h;
  }

  // Chrápanie a ráno: porovnanie nocí so zvukovým záznamom aj check-inom.
  const SNORE_NIGHT = 15;   // od koľkých minút chrápania je noc „s chrápaním“
  function snoreCard() {
    const rows = D.nights.filter(n => D.sounds[n.date] && !D.sounds[n.date].partial).map(n => Object.assign({ snore: D.sounds[n.date].snoreMin }, n));
    if (rows.length < 3) return "";
    const yes = rows.filter(n => n.snore >= SNORE_NIGHT), no = rows.filter(n => n.snore < SNORE_NIGHT);
    let h = '<div class="card"><div class="eyebrow">Chrápanie a ráno · ' + rows.length + " " + nightsWord(rows.length) + " so zvukom</div>";
    if (yes.length >= 2 && no.length >= 2) {
      h += "<p>Po nociach s chrápaním (" + SNORE_NIGHT + "+ min) máš ráno energiu <b>" + dec(mean(yes.map(n => n.energy))) + "/5</b>, inak <b>" + dec(mean(no.map(n => n.energy))) + "/5</b>.</p>" +
        '<p class="small muted">Kvalita spánku ' + dec(mean(yes.map(n => n.quality))) + " vs. " + dec(mean(no.map(n => n.quality))) + " z 5.</p>";
    } else if (!yes.length) {
      h += "<p>Zatiaľ žiadna noc s výrazným chrápaním.</p>";
    } else {
      h += '<p class="small muted">Na porovnanie potrebujem aspoň 2 noci s chrápaním a 2 bez neho.</p>';
    }
    const recent = Object.keys(D.sounds).sort().slice(-7).map(k => D.sounds[k]);
    if (recent.filter(s => s.snoreMin >= 30).length >= 3) {
      h += '<p class="small t-lamp">Chrápeš pravidelne. Ak ťa cez deň premáha únava alebo ti niekto povedal, že v spánku prestávaš dýchať, poraď sa s lekárom.</p>';
    }
    return h + "</div>";
  }

  function viewExp() {
    let h = '<div class="head"><div class="eyebrow">Výsluchy</div><h2>Experimenty</h2></div>';
    if (D.exp) {
      const F = FMAP[D.exp.k], en = expNights(), done = en.length;
      h += '<div class="card lamp"><div class="eyebrow">Beží · noc ' + done + " z " + D.exp.length + "</div>" +
        "<h3>" + F.icon + " " + F.exp + '</h3><div class="days" style="grid-template-columns:repeat(' + Math.min(D.exp.length, 7) + ',1fr)">';
      for (let i = 0; i < D.exp.length; i++) {
        const n = en[i];
        const cls = n ? (brokeRule(n, D.exp.k) ? " broke" : " done") : "";
        h += '<div class="day' + cls + '" title="' + (n ? short(n.date) + (brokeRule(n, D.exp.k) ? " · pravidlo porušené" : "") : "") + '">' + (n ? short(n.date).replace(/\s/g, "") : i + 1) + "</div>";
      }
      h += "</div>";
      if (!done) h += '<p class="small">Začína večer ' + short(addDays(D.exp.start, -1)) + ". Ráno to zapíš v check-ine ako obvykle.</p>";
      else h += '<p class="small">Pokračuj v ranných aj večerných zápisoch. Verdikt dostaneš po poslednej noci.</p>';
      h += '<button class="btn ghost" data-act="cancelExp" type="button">Ukončiť experiment</button></div>';
    }

    if (UI.msg) h += '<p class="inline-msg">' + UI.msg + "</p>";

    const list = analyzable();
    const ranked = list.length >= MIN_NIGHTS ? analyze(list) : FACTORS.map(F => ({ F, status: null }));
    h += '<div class="card"><div class="eyebrow">' + (D.exp ? "Ďalšie experimenty" : "Vyber experiment") + "</div>";
    if (list.length < MIN_NIGHTS) h += '<p class="small muted">Najlepšie je overovať podozrivého zo spisu. Ten sa ukáže po ' + MIN_NIGHTS + " nociach.</p>";
    ranked.filter(r => !D.verdicts[r.F.k] && !(D.exp && D.exp.k === r.F.k)).forEach(r => {
      const st = r.status ? STATUS[r.status] : null;
      h += '<div class="exp-item"><span class="ico" aria-hidden="true">' + r.F.icon + "</span><div><div>" + r.F.exp + "</div>" +
        (st ? '<span class="small ' + st.cls + '">' + st.label + "</span>" : "") + "</div>" +
        '<button class="btn ghost" data-act="startExp" data-k="' + r.F.k + '" type="button">Spustiť</button></div>';
    });
    h += "</div>";

    if (D.closed.length) {
      h += '<div class="card"><div class="eyebrow">Uzavreté prípady</div>';
      D.closed.forEach(c => {
        h += '<div class="exp-item"><span class="ico" aria-hidden="true">' + c.icon + "</span><div><div>" + c.name + ' <span class="small muted">· ' + c.when + '</span></div><span class="small muted">' + c.text + '</span></div><span class="pill ' + c.tone + '">' + c.label + "</span></div>";
      });
      h += "</div>";
    }
    return h;
  }

  // ---------- Vysúvacie obrazovky ----------
  function sheetTop(label, closeIcon) {
    return '<div class="sheet-top"><button class="icon-btn" data-act="close" type="button" aria-label="' + (closeIcon === "×" ? "Zavrieť" : "Späť") + '">' + (closeIcon || "←") + '</button><span class="eyebrow">' + label + '</span><span style="width:38px"></span></div>';
  }

  function openDetail(k) {
    const list = analyzable();
    const r = analyze(list).find(x => x.F.k === k);
    const F = r.F, st = STATUS[r.status];
    let h = sheetTop("Podozrivý") + '<div class="scroll">';
    h += '<div class="head"><span class="pill ' + st.cls + '" style="align-self:flex-start">' + st.label + "</span><h2>" + F.icon + " " + F.name + '</h2><p class="small muted">' + r.nWith + " " + nightsWord(r.nWith) + " s ním, " + r.nWithout + " bez neho</p></div>";
    h += '<div class="card"><h3>' + sentence(r) + "</h3>";
    METRICS.forEach(M => {
      const m = r.m[M.k];
      const scale = M.k === "quality" ? 5 : Math.max(m.a, m.b, 0.01) * 1.15;
      const bad = m.harm >= 1.1 && r.nWith >= 3 && r.nWithout >= 3;
      h += '<div class="cmp"><div class="eyebrow" style="margin-top:6px">' + M.label + (bad ? ' <span class="t-bad">· horšie</span>' : "") + "</div>" +
        '<div class="cmp-row"><span>S faktorom</span><span class="track"><i style="width:' + (m.a / scale * 100) + '%;background:var(--lamp)"></i></span><b>' + (r.nWith ? M.fmt(m.a) : "–") + "</b></div>" +
        '<div class="cmp-row"><span class="muted">Bez neho</span><span class="track"><i style="width:' + (m.b / scale * 100) + '%;background:var(--bar)"></i></span><b class="muted">' + (r.nWithout ? M.fmt(m.b) : "–") + "</b></div></div>";
    });
    h += "</div>";
    h += '<div class="card"><div class="eyebrow">Dôkazy noc po noci · ' + r.best.M.label.toLowerCase() + "</div>" + nightChart(F, r.best.M, list, { expMark: true }) +
      '<div class="legend"><span><i style="background:var(--lamp)"></i>s faktorom</span><span><i style="background:var(--bar)"></i>bez neho</span>' +
      (D.exp && D.exp.k === F.k ? '<span><i style="background:var(--good)"></i>počas experimentu</span>' : "") + "</div></div>";

    const v = D.verdicts[k];
    if (v) {
      h += '<div class="card"><div class="eyebrow">Verdikt experimentu</div><p>' + v.text + "</p>" + (v.advice ? '<p class="small muted">' + v.advice + "</p>" : "") + "</div>";
    } else if (D.exp && D.exp.k === k) {
      h += '<div class="card lamp"><div class="eyebrow">Overovanie beží</div><p>Experiment „' + F.exp + "“ je na noci " + expNights().length + " z " + D.exp.length + '.</p><button class="btn dark" data-act="gotoExp" type="button">Pozrieť experiment</button></div>';
    } else {
      h += '<div class="card"><div class="eyebrow">Ako to overiť</div><p>' + F.exp + " počas " + SET.expLength + " nocí. Potom porovnám tie noci s tvojím bežným spánkom.</p>" +
        '<button class="btn" data-act="startExp" data-k="' + k + '" type="button">Spustiť experiment</button></div>';
    }
    h += "</div>";
    showSheet(h);
  }

  // Ranný check-in
  const QUESTIONS = [
    { key: "quality",  title: "Ako sa ti spalo?", opts: [[1, "Hrozne"], [2, "Zle"], [3, "Dá sa"], [4, "Dobre"], [5, "Výborne"]], num: true },
    { key: "duration", title: "Koľko hodín trval tvoj spánok?", opts: [[4.5, "Menej ako 5"], [5.5, "5 až 6"], [6.5, "6 až 7"], [7.5, "7 až 8"], [8.5, "Viac ako 8"]] },
    { key: "latency",  title: "Ako dlho ti trvalo zaspať?", opts: [[10, "Do 15 minút"], [22, "15 až 30 minút"], [45, "30 až 60 minút"], [75, "Viac ako hodinu"]] },
    { key: "wakes",    title: "Koľkokrát ťa v noci niečo zobudilo?", opts: [[0, "Ani raz"], [1, "Raz"], [2, "Dvakrát"], [3, "Trikrát a viac"]] },
    { key: "energy",   title: "Koľko máš teraz energie?", opts: [[1, "Žiadnu"], [2, "Málo"], [3, "Akurát"], [4, "Dosť"], [5, "Plno"]], num: true }
  ];
  let ci = null;
  function openCheckin() {
    const y = addDays(today(), -1);
    ci = { step: 0, a: {}, needF: !D.evenings[y], f: {} };
    renderCheckin();
  }
  function renderCheckin() {
    const total = QUESTIONS.length + (ci.needF ? 1 : 0);
    const top = '<div class="sheet-top"><button class="icon-btn" data-act="close" type="button" aria-label="Zavrieť">×</button><div class="progress">' +
      Array.from({ length: total }, (_, i) => '<i class="' + (i <= ci.step ? "on" : "") + '"></i>').join("") + '</div><span style="width:38px"></span></div>';
    if (ci.step < QUESTIONS.length) {
      const q = QUESTIONS[ci.step];
      let h = top + '<div class="q"><div class="eyebrow">Otázka ' + (ci.step + 1) + " z " + total + "</div><h2>" + q.title + '</h2><div class="opts">';
      q.opts.forEach(([v, l], i) => { h += '<button class="opt" type="button" data-ans="' + v + '"><span class="n">' + (q.num ? v : i + 1) + "</span>" + l + "</button>"; });
      showSheet(h + "</div></div>");
    } else if (ci.needF && ci.step === QUESTIONS.length) {
      let h = top + '<div class="q"><div class="eyebrow">Otázka ' + total + " z " + total + '</div><h2>Čo platilo včera?</h2><p class="small muted">Včerajší večer nemáš zapísaný. Ťukni na všetko, čo platilo, alebo rovno ulož.</p><div class="chips">';
      FACTORS.forEach(F => { h += '<button type="button" class="chip" data-cichip="' + F.k + '" aria-pressed="' + !!ci.f[F.k] + '"><span aria-hidden="true">' + F.icon + "</span>" + F.name + "</button>"; });
      h += '</div><button class="btn" data-act="ciFactorsDone" type="button">Uložiť</button></div>';
      showSheet(h);
    } else {
      finishCheckin();
    }
  }
  function finishCheckin() {
    const t = today(), y = addDays(t, -1);
    if (ci.needF) D.evenings[y] = { f: ci.f, temp: null, saved: true };
    const night = { date: t, quality: ci.a.quality, duration: ci.a.duration, latency: ci.a.latency, wakes: ci.a.wakes, energy: ci.a.energy };
    const prev = D.nights.slice(-7);
    D.nights = D.nights.filter(n => n.date !== t).concat(night);
    let extra = "";
    if (D.exp) {
      const k = D.exp.k, n = expNights().length;
      if (n >= D.exp.length) {
        extra = '<div class="card"><div class="eyebrow">Experiment skončil</div><p>' + concludeExp() + "</p></div>";
      } else {
        extra = '<div class="card"><div class="eyebrow">Experiment</div><p>Noc ' + n + " z " + D.exp.length + " " + FMAP[k].expShort + ". Ešte " + (D.exp.length - n) + " " + nightsWord(D.exp.length - n) + ".</p></div>";
      }
    }
    save();
    if (D.sounds[t]) extra += '<div class="card"><div class="eyebrow">Zvuk v noci</div><p>' + soundLine(D.sounds[t]).replace(/^./, c => c.toUpperCase()) + "</p></div>";
    const note = prev.length ? "Za posledné " + (prev.length === 1 ? "ráno" : prev.length + " " + recordsWord(prev.length)) + " trvalo zaspávanie v priemere " + Math.round(mean(prev.map(n => n.latency))) + " min." : "Prvá stopa je v spise. Zajtra pribudne ďalšia.";
    const h = sheetTop("Hotovo", "×") +
      '<div class="q"><div class="eyebrow">Zapísané · ' + short(t) + "</div><h2>Ďakujem, stopa je v spise.</h2>" +
      '<div class="card"><div class="stats">' + stat(hmShort(night.duration), "spánok") + stat(night.latency + " min", "zaspávanie") + stat(night.wakes + "×", "prebudenia") + stat(night.energy + "/5", "energia") + "</div>" +
      '<p class="small muted">' + note + "</p></div>" + extra + '<button class="btn" data-act="close" type="button">Hotovo</button></div>';
    ci = null;
    showSheet(h);
  }

  // Nastavenia
  function openSettings() {
    const evCount = Object.keys(D.evenings).length;
    const seg = (attr, cur, items) => '<div class="seg" role="group" style="--n:' + items.length + '">' +
      items.map(([v, l]) => '<button type="button" ' + attr + '="' + v + '" aria-pressed="' + (String(cur) === String(v)) + '">' + l + "</button>").join("") + "</div>";
    const num = (id, label, val) => '<label class="small" for="' + id + '">' + label +
      '<input id="' + id + '" type="text" inputmode="numeric" autocomplete="off" maxlength="4" value="' + esc(String(val)) + '"></label>';
    const clipSet = (title, kind, n, sec) => '<span class="small">' + title + "</span>" +
      '<div class="num-row">' + num("set-clipn-" + kind, "Počet za noc", n) + num("set-clips-" + kind, "Dĺžka (s)", sec) + "</div>" +
      '<p class="small num-err" id="err-' + kind + '" role="alert" hidden></p>';
    let h = sheetTop("Nastavenia") + '<div class="scroll">';
    h += '<div class="head"><h2>Nastavenia</h2></div>';
    h += '<div class="card"><span class="set-label">Vzhľad</span>' + seg("data-theme-set", SET.theme, [["dark", "Tmavý"], ["light", "Svetlý"], ["system", "Podľa systému"]]) + "</div>";
    h += '<div class="card"><label class="set-label" for="set-name">Oslovenie</label><input id="set-name" type="text" maxlength="30" autocomplete="given-name" placeholder="Napríklad Jana" value="' + esc(SET.name) + '"><p class="small muted">Použije sa v pozdrave na obrazovke Dnes.</p></div>';
    h += '<div class="card"><span class="set-label">Dĺžka experimentu</span>' + seg("data-explen", SET.expLength, [[7, "7 nocí"], [10, "10 nocí"], [14, "14 nocí"]]) +
      '<p class="small muted">Platí pre nové experimenty. Dlhší experiment dá spoľahlivejší verdikt.</p></div>';
    h += '<div class="card"><span class="set-label">Nočný záznam zvuku</span>' +
      '<span class="small">Citlivosť</span>' + seg("data-sens", SET.soundSensitivity, [["low", "Nízka"], ["medium", "Stredná"], ["high", "Vysoká"]]) +
      '<p class="small muted">Vyššia citlivosť zachytí aj tichšie zvuky.</p>' +
      clipSet("Ukážky chrápania", "snore", SET.clipSnoreN, SET.clipSnoreSec) +
      clipSet("Ukážky hluku", "noise", SET.clipNoiseN, SET.clipNoiseSec) +
      '<label class="small" for="set-kbps">Kvalita ukážok' +
      '<select id="set-kbps">' + CLIP_KBPS.map(([v, l]) => '<option value="' + v + '"' + (v === SET.clipKbps ? " selected" : "") + ">" + l +
        (v ? " · 10 s ≈ " + Math.round(v * 10 / 8) + " kB" : "") + "</option>").join("") + "</select></label>" +
      '<p class="small muted">Počet 0 = žiadne ukážky tohto druhu. Celá noc sa nenahráva, ukladajú sa len krátke ukážky a len v tomto zariadení. Pri viacerých zvukoch si appka nechá tie najhlasnejšie. Ukážky staršie ako ' + KEEP_CLIP_DAYS + " dní sa mažú.</p></div>";
    h += '<div class="card"><span class="set-label">Moje dáta</span><p class="small muted">' + D.nights.length + " " + (D.nights.length === 1 ? "ranný záznam" : D.nights.length >= 2 && D.nights.length <= 4 ? "ranné záznamy" : "ranných záznamov") + ", " +
      evCount + " " + (evCount === 1 ? "večerný" : evCount >= 2 && evCount <= 4 ? "večerné" : "večerných") + ", " +
      Object.keys(D.sounds).length + " " + nightsWord(Object.keys(D.sounds).length) + " so zvukom, " + D.closed.length + " " + (D.closed.length === 1 ? "uzavretý experiment" : D.closed.length >= 2 && D.closed.length <= 4 ? "uzavreté experimenty" : "uzavretých experimentov") +
      ". Všetko je uložené len v tomto zariadení.</p>" +
      '<button class="btn ghost" data-act="export" type="button">Stiahnuť zálohu (JSON)</button>' +
      '<button class="btn danger" data-act="askReset" type="button">Vymazať všetky dáta</button></div>';
    h += '<p class="small muted" style="text-align:center">Sleep Detective · nie je zdravotnícka pomôcka</p>';
    h += "</div>";
    const sc = $("#sheet").querySelector(".scroll");
    const keep = sc ? sc.scrollTop : 0;
    showSheet(h, !!sc);
    const sc2 = $("#sheet").querySelector(".scroll");
    if (sc2) sc2.scrollTop = keep;
  }

  function showSheet(h, keepFocus) {
    const el = $("#sheet");
    el.innerHTML = h; el.hidden = false;
    if (!keepFocus) { const f = el.querySelector("button"); if (f) f.focus({ preventScroll: true }); }
  }
  function closeSheet() { stopPlaying(); $("#sheet").hidden = true; $("#sheet").innerHTML = ""; ci = null; render(); }

  // Potvrdzovacie okno
  let modalOk = null;
  function confirmModal(o, onOk) {
    const m = $("#modal");
    m.innerHTML = '<div class="modal-card" role="alertdialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-text">' +
      '<h3 id="modal-title">' + o.title + '</h3><p id="modal-text" class="small">' + o.text + "</p>" +
      '<div class="row"><button class="btn ghost" data-act="modalCancel" type="button">Zrušiť</button>' +
      '<button class="btn ' + (o.danger ? "danger-fill" : "") + '" data-act="modalOk" type="button">' + o.ok + "</button></div></div>";
    m.hidden = false;
    modalOk = onOk;
    m.querySelector('[data-act="modalCancel"]').focus();
  }
  function closeModal() { $("#modal").hidden = true; $("#modal").innerHTML = ""; modalOk = null; }

  let toastT;
  function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 2800); }

  // ---------- Zvuk v noci ----------
  // Ukážky zvuku (Blob) sú v IndexedDB, v localStorage je len súhrn noci.
  const IDB = (() => {
    let p = null;
    const open = () => p || (p = new Promise((res, rej) => {
      const r = indexedDB.open("sleep-detective", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("clips");
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    }));
    const tx = (mode, fn) => open().then(db => new Promise((res, rej) => {
      const t = db.transaction("clips", mode);
      const req = fn(t.objectStore("clips"));
      t.oncomplete = () => res(req ? req.result : undefined);
      t.onerror = () => rej(t.error);
    }));
    return {
      put: (id, blob) => tx("readwrite", s => s.put(blob, id)),
      get: id => tx("readonly", s => s.get(id)),
      del: id => tx("readwrite", s => s.delete(id)),
      clear: () => tx("readwrite", s => s.clear())
    };
  })();
  const dropClips = clips => (clips || []).forEach(c => IDB.del(c.id).catch(() => {}));

  const CLIP_SPACING = 60000, KEEP_CLIP_DAYS = 14, MIN_REC_MS = 60000;
  // Kvalita ukážok (kbit/s); 0 = predvolená prehliadača (zvyčajne ~128 kbit/s)
  const CLIP_KBPS = [[16, "Nízka – 16 kbit/s"], [32, "Stredná – 32 kbit/s"], [64, "Dobrá – 64 kbit/s"], [128, "Vysoká – 128 kbit/s"], [0, "Predvolená prehliadača"]];
  // Počet a dĺžka ukážok podľa druhu zvuku (z nastavení; neplatná hodnota = predvolená).
  function clipConf(kind) {
    const n = kind === "snore" ? SET.clipSnoreN : SET.clipNoiseN, sec = kind === "snore" ? SET.clipSnoreSec : SET.clipNoiseSec;
    return { n: Number.isInteger(n) && n >= 0 ? n : 4, ms: (Number.isInteger(sec) && sec > 0 ? sec : 10) * 1000 };
  }
  let rec = null;      // prebiehajúci nočný záznam
  let wake = null;     // zámok obrazovky (Screen Wake Lock)

  // Noc patrí k rannému dátumu: záznam ukončený po 15:00 patrí k nasledujúcemu ránu.
  const nightKey = ms => { const d = new Date(ms); return d.getHours() >= 15 ? addDays(iso(d), 1) : iso(d); };

  async function requestWake() {
    try {
      if ("wakeLock" in navigator) {
        wake = await navigator.wakeLock.request("screen");
        wake.addEventListener("release", () => { wake = null; updateNight(); });
      }
    } catch (e) { wake = null; }
    updateNight();
  }

  async function startRecording() {
    if (rec) { showNight(); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.SleepSound) {
      infoModal("Nahrávanie tu nefunguje", "Tento prehliadač nedovoľuje použiť mikrofón. Skús Chrome alebo Safari a appku otvor cez https.");
      return;
    }
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    } catch (e) {
      infoModal("Mikrofón nie je povolený", "Bez mikrofónu appka nemôže počúvať chrápanie a hluk. Povoľ mikrofón pre túto stránku v nastaveniach prehliadača a skús to znova.");
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    const ctx = new AC();
    try { await ctx.resume(); } catch (e) { /* nič */ }
    const an = ctx.createAnalyser();
    an.fftSize = 2048; an.smoothingTimeConstant = 0;
    ctx.createMediaStreamSource(stream).connect(an);
    const now = Date.now();
    rec = {
      stream, ctx, an, start: now,
      td: new Float32Array(an.fftSize), fd: new Float32Array(an.frequencyBinCount),
      det: new SleepSound.Detector({ sensitivity: SET.soundSensitivity }),
      clips: [], clipRec: null, clipDone: null, lastClipT: 0, db: -100, n: 0, live: { snoreMin: 0, noise: 0 }
    };
    rec.timer = setInterval(tick, 100);
    rec.saveTimer = setInterval(() => storeNight(rec, Date.now(), true), 60000);
    showNight();
    requestWake();
  }

  function tick() {
    const r = rec; if (!r) return;
    r.an.getFloatTimeDomainData(r.td);
    r.an.getFloatFrequencyData(r.fd);
    const db = SleepSound.levelDb(r.td);
    const low = SleepSound.lowRatio(r.fd, r.ctx.sampleRate, r.an.fftSize);
    r.db = db;
    const ev = r.det.feed(Date.now(), db, low);
    if (ev && ev.type === "start") maybeClip(r, ev.t);
    if (ev && ev.type === "end" && r.clipRec && ev.event.start === r.clipT) clipKnown(r, ev.event.kind);
    if (r.clipRec && Date.now() - r.clipFrom >= r.clipLen) stopClip(r);
    if (++r.n % 10 === 0) {
      if (r.n % 100 === 0) { const s = r.det.summary(Date.now()); r.live = { snoreMin: s.snoreMin, noise: s.noise }; }
      updateNight();
    }
  }

  function clipMime() {
    if (!window.MediaRecorder) return null;
    return ["audio/webm;codecs=opus", "audio/mp4", "audio/webm", "audio/ogg;codecs=opus"].find(m => MediaRecorder.isTypeSupported(m)) || "";
  }
  // Ukážka sa začne nahrávať so začiatkom zvuku. Druh zvuku ešte nepoznáme, preto beží
  // najdlhšiu povolenú dĺžku a skráti sa, keď zvuk skončí a vieme, či je to hluk alebo chrápanie.
  function maybeClip(r, t) {
    const mime = clipMime(), sn = clipConf("snore"), no = clipConf("noise");
    if (mime === null || (!sn.n && !no.n) || r.clipRec || t - r.lastClipT < CLIP_SPACING) return;
    let mr;
    const opts = {};
    if (mime) opts.mimeType = mime;
    if (SET.clipKbps > 0) opts.audioBitsPerSecond = SET.clipKbps * 1000;
    try { mr = new MediaRecorder(r.stream, opts); } catch (e) { return; }
    r.lastClipT = t;
    r.clipRec = mr; r.clipT = t; r.clipFrom = Date.now(); r.clipDrop = false;
    r.clipLen = Math.max(sn.n ? sn.ms : 0, no.n ? no.ms : 0);
    // počas chrápania (už rozpoznaná séria) bude aj ďalší zvuk pravdepodobne chrápanie
    const last = r.det.events[r.det.events.length - 1];
    if (last && last.kind === "snore" && t - last.end < 15000 && sn.n) r.clipLen = sn.ms;
    const chunks = [];
    mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    r.clipDone = new Promise(done => {
      mr.onstop = () => {
        r.clipRec = null;
        if (r.clipDrop) { done(); return; }
        const blob = new Blob(chunks, { type: mr.mimeType || mime || "audio/webm" });
        const id = "clip-" + t;
        IDB.put(id, blob).then(() => { r.clips.push({ id, t }); trimClips(r); }).catch(() => {}).then(done);
      };
    });
    mr.start();
  }
  // Zvuk s ukážkou skončil: dĺžku ukážky nastavíme podľa jeho druhu.
  // Kandidát na chrápanie ('cand') sa ešte môže stať chrápaním, preto beží ďalej.
  function clipKnown(r, kind) {
    const sn = clipConf("snore"), no = clipConf("noise");
    if (kind === "snore") r.clipLen = sn.n ? sn.ms : 0;
    else if (kind === "noise") r.clipLen = no.n ? no.ms : 0;
    if (!r.clipLen) { r.clipDrop = true; stopClip(r); }
  }
  function stopClip(r) {
    if (r.clipRec && r.clipRec.state !== "inactive") r.clipRec.stop();
  }
  // Počet ukážok podľa nastavení; pri prebytku zahodíme najtichšiu.
  function trimClips(r) {
    const info = c => ({ c, kind: r.det.kindAt(c.t) || "noise", peak: r.det.peakAt(c.t) });
    const drop = c => { r.clips = r.clips.filter(x => x !== c); IDB.del(c.id).catch(() => {}); };
    ["snore", "noise"].forEach(kind => {
      const list = r.clips.map(info).filter(x => x.kind === kind).sort((a, b) => b.peak - a.peak);
      list.slice(clipConf(kind).n).forEach(x => drop(x.c));
    });
  }

  // Uloží súhrn noci do D.sounds (počas noci každú minútu ako rozpracovaný).
  function storeNight(r, end, partial) {
    if (!r) return null;
    const s = r.det.summary(end);
    const key = nightKey(end);
    trimClips(r);   // druh zvuku sa mohol medzitým zmeniť (z kandidáta je chrápanie)
    const old = D.sounds[key];
    if (old && old.start !== r.start) dropClips(old.clips);   // nový záznam tej istej noci nahradí starý
    D.sounds[key] = Object.assign(s, {
      partial: !!partial, sensitivity: SET.soundSensitivity,
      clips: r.clips.map(c => ({ id: c.id, t: c.t, kind: r.det.kindAt(c.t) || "noise", peak: r.det.peakAt(c.t) }))
    });
    save();
    return key;
  }

  function closeAudio(r) {
    clearInterval(r.timer); clearInterval(r.saveTimer);
    r.stream.getTracks().forEach(tr => tr.stop());
    r.ctx.close().catch(() => {});
    if (wake) { wake.release().catch(() => {}); wake = null; }
  }

  async function stopRecording() {
    const r = rec; if (!r) return;
    rec = null;
    const end = Date.now();
    r.det.flush(end);
    if (r.clipRec && r.clipRec.state !== "inactive") r.clipRec.stop();
    if (r.clipDone) await r.clipDone;
    closeAudio(r);
    hideNight();
    if (end - r.start < MIN_REC_MS) {
      dropClips(r.clips);
      const old = D.sounds[nightKey(end)];
      if (old && old.start === r.start) { delete D.sounds[nightKey(end)]; save(); }
      render();
      toast("Záznam bol kratší ako minúta, neuložil som ho.");
      return;
    }
    const key = storeNight(r, end, false);
    render();
    openSoundReport(key);
  }

  // Pri vymazaní všetkých dát: záznam zastavíme bez uloženia.
  function abortRecording() {
    const r = rec; if (!r) return;
    rec = null;
    if (r.clipRec && r.clipRec.state !== "inactive") { r.clipRec.onstop = null; r.clipRec.stop(); }
    closeAudio(r);
    hideNight();
  }

  function showNight() {
    $("#night").innerHTML =
      '<div class="night-top"><i></i>Nočný záznam</div>' +
      '<div class="night-main"><div class="night-clock" id="n-clock"></div><div id="n-sub" class="small"></div>' +
      '<div class="night-lvl" aria-hidden="true"><i id="n-lvl"></i></div>' +
      '<div class="night-stats"><div><b id="n-snore">0</b><span>min chrápania</span></div><div><b id="n-noise">0</b><span>zvukov</span></div></div>' +
      '<p class="night-tip" id="n-tip"></p></div>' +
      '<button class="night-stop" data-act="askStopNight" type="button">Ukončiť záznam</button>';
    $("#night").hidden = false;
    updateNight();
  }
  function hideNight() { $("#night").hidden = true; $("#night").innerHTML = ""; }
  function updateNight() {
    const r = rec;
    if (!r || $("#night").hidden) return;
    const now = Date.now();
    $("#n-clock").textContent = clock(now);
    $("#n-sub").textContent = "Počúvam od " + clock(r.start) + " · " + hmShort((now - r.start) / 3600000) + " h";
    $("#n-lvl").style.width = clamp((r.db - r.det.floor) / 40, 0, 1) * 100 + "%";
    $("#n-snore").textContent = r.live.snoreMin;
    $("#n-noise").textContent = r.live.noise;
    const tip = $("#n-tip");
    if (!wake) {
      tip.className = "night-tip warn";
      tip.textContent = "Obrazovka sa môže sama zamknúť a záznam sa tým preruší. Vypni automatické zamykanie alebo nechaj telefón na nabíjačke s appkou otvorenou.";
    } else {
      tip.className = "night-tip";
      tip.textContent = "Polož telefón k posteli, ideálne na nabíjačku. Nezamykaj ho, obrazovka zostane zapnutá a tmavá.";
    }
  }

  // Graf noci: sivá = najhlasnejší zvuk v 5-min úseku, žltá = koľko z úseku bolo chrápanie.
  function soundChart(s) {
    const tl = s.timeline, W = 340, H = 120, pl = 6, pr = 6, pt = 8, pb = 20, ih = H - pt - pb;
    const bw = (W - pl - pr) / Math.max(tl.length, 12);
    const top = Math.max(30, ...tl.map(b => b.peak));
    let svg = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Zvuk počas noci">';
    svg += '<line class="grid" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + (pt + ih) + '" y2="' + (pt + ih) + '"/>';
    tl.forEach((b, i) => {
      const x = (pl + i * bw + 0.6).toFixed(1), w = Math.max(1.5, bw - 1.2).toFixed(1);
      const t0 = s.start + i * SleepSound.BUCKET_MS;
      if (b.peak > 0) {
        const h = Math.max(1, b.peak / top * ih);
        svg += '<rect class="b-off" x="' + x + '" y="' + (pt + ih - h).toFixed(1) + '" width="' + w + '" height="' + h.toFixed(1) + '" rx="1"><title>' + clock(t0) + ": najhlasnejšie +" + Math.round(b.peak) + " dB, " + b.noise + " zvukov</title></rect>";
      }
      if (b.snore > 0) {
        const h = Math.max(1.5, Math.min(1, b.snore / 300) * ih);
        svg += '<rect class="b-on" x="' + x + '" y="' + (pt + ih - h).toFixed(1) + '" width="' + w + '" height="' + h.toFixed(1) + '" rx="1"><title>' + clock(t0) + ": chrápanie " + Math.round(b.snore / 60) + " min</title></rect>";
      }
    });
    svg += '<text x="' + pl + '" y="' + (H - 4) + '">' + clock(s.start) + "</text>";
    svg += '<text x="' + (pl + tl.length * bw) + '" y="' + (H - 4) + '" text-anchor="end">' + clock(s.end) + "</text>";
    return '<div class="chart">' + svg + "</svg></div>";
  }

  function soundLine(s) {
    return (s.snoreMin ? "chrápanie " + s.snoreMin + " min" : "bez chrápania") + " · " + s.noise + " " + (s.noise === 1 ? "zvuk" : s.noise >= 2 && s.noise <= 4 ? "zvuky" : "zvukov");
  }

  function openSoundReport(key) {
    const s = D.sounds[key];
    if (!s) return;
    let h = sheetTop("Zvuk v noci") + '<div class="scroll">';
    h += '<div class="head"><div class="eyebrow">Noc na ' + long(key).toLowerCase() + "</div><h2>Zvuková stopa</h2></div>";
    h += '<div class="card"><div class="stats">' +
      stat(hmShort((s.end - s.start) / 3600000), "záznam") + stat(s.snoreMin + " min", "chrápanie") +
      stat(s.noise, "zvukov") + stat(s.loudest ? clock(s.loudest.t) : "–", "najhlasnejšie") + "</div>";
    if (s.gapMin > 0) h += '<p class="small t-lamp">Záznam bol ' + s.gapMin + " min prerušený, pravdepodobne sa zamkla obrazovka.</p>";
    if (s.interrupted) h += '<p class="small t-lamp">Záznam sa nečakane ukončil o ' + clock(s.end) + ". Appka bola asi zatvorená.</p>";
    h += soundChart(s) +
      '<div class="legend"><span><i style="background:var(--lamp)"></i>chrápanie</span><span><i style="background:var(--bar)"></i>najhlasnejší zvuk v 5 minútach</span></div></div>';
    h += '<div class="card"><div class="eyebrow">Ukážky</div>';
    if (s.clips && s.clips.length) {
      s.clips.slice().sort((a, b) => a.t - b.t).forEach(c => {
        h += '<div class="clip"><button class="icon-btn" data-act="playClip" data-id="' + c.id + '" type="button" aria-label="Prehrať ukážku z ' + clock(c.t) + '">▶</button>' +
          "<span>" + clock(c.t) + ' · <span class="' + (c.kind === "snore" ? "t-lamp" : "muted") + '">' + (c.kind === "snore" ? "chrápanie" : "hluk") + "</span></span>" +
          '<span class="small muted">+' + Math.round(c.peak) + " dB</span></div>";
      });
    } else {
      h += '<p class="small muted">' + (SET.clipSnoreN || SET.clipNoiseN ? "Táto noc nemá uložené ukážky." : "Ukladanie ukážok je vypnuté v nastaveniach.") + "</p>";
    }
    h += "</div>";
    h += '<p class="small muted">Chrápanie appka odhaduje podľa hĺbky a rytmu zvuku. Hlasitosť je relatívna k tichu v miestnosti, nie lekárske meranie.</p>';
    h += '<button class="btn danger" data-act="askDelSound" data-key="' + key + '" type="button">Vymazať záznam tejto noci</button>';
    h += "</div>";
    showSheet(h);
  }

  let playing = null;
  function stopPlaying() {
    if (!playing) return;
    playing.audio.pause();
    URL.revokeObjectURL(playing.url);
    if (playing.btn) playing.btn.textContent = "▶";
    playing = null;
  }
  async function playClip(btn) {
    const id = btn.dataset.id;
    const same = playing && playing.id === id;
    stopPlaying();
    if (same) return;
    let blob;
    try { blob = await IDB.get(id); } catch (e) { blob = null; }
    if (!blob) { toast("Ukážka sa nenašla."); return; }
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    playing = { id, audio, url, btn };
    btn.textContent = "■";
    audio.onended = stopPlaying;
    audio.play().catch(() => { stopPlaying(); toast("Ukážku sa nepodarilo prehrať."); });
  }

  // Po štarte: rozpracovaný záznam bez bežiaceho nahrávania = appka bola zatvorená; staré ukážky mažeme.
  function tidySounds() {
    const limit = addDays(today(), -KEEP_CLIP_DAYS);
    let changed = false;
    Object.keys(D.sounds).forEach(k => {
      const s = D.sounds[k];
      if (s.partial) { s.partial = false; s.interrupted = true; changed = true; }
      if (k < limit && s.clips && s.clips.length) { dropClips(s.clips); s.clips = []; changed = true; }
    });
    if (changed) save();
  }

  function infoModal(title, text) {
    confirmModal({ title, text, ok: "Rozumiem" }, closeModal);
    $("#modal").querySelector('[data-act="modalCancel"]').hidden = true;
    $("#modal").querySelector('[data-act="modalOk"]').focus();
  }

  // ---------- Akcie ----------
  function startExp(k) {
    if (D.exp) {
      UI.msg = "Naraz beží len jeden experiment, aby bolo jasné, čo zabralo. Najprv dokonči „" + FMAP[D.exp.k].exp + "“.";
      UI.tab = "exp"; closeSheet(); return;
    }
    D.exp = { k, start: addDays(today(), 1), length: SET.expLength };
    save();
    UI.msg = null;
    toast("Experiment spustený: " + FMAP[k].exp + ". Začína dnes večer.");
    UI.tab = "exp"; closeSheet();
  }

  function exportData() {
    // zvukové ukážky sa do zálohy nedávajú (sú veľké a citlivé), len súhrny nocí
    const blob = new Blob([JSON.stringify({ app: "sleep-detective", exported: new Date().toISOString(), note: "Bez zvukových ukážok.", data: D, settings: SET }, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "sleep-detective-" + today() + ".json";
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  function resetAll() {
    abortRecording();
    stopPlaying();
    D = emptyData();
    try { localStorage.removeItem(DATA_KEY); } catch (e) { /* nič */ }
    IDB.clear().catch(() => {});
    UI.tab = "today"; UI.msg = null;
    closeModal();
    closeSheet();
    toast("Všetky dáta sú vymazané. Začíname odznova.");
  }

  // ---------- Vykreslenie a udalosti ----------
  function render() {
    const v = { today: viewToday, log: viewLog, case: viewCase, exp: viewExp }[UI.tab];
    $("#view").innerHTML = v();
    $("#view").scrollTop = 0;
    document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-current", t.dataset.tab === UI.tab ? "page" : "false"));
  }

  function eveningRecord() {
    const t = today();
    if (!D.evenings[t]) D.evenings[t] = { f: {}, temp: 20, saved: false };
    return D.evenings[t];
  }
  function markEveningDirty() {
    const ev = eveningRecord(); ev.saved = false; save();
    const sv = document.querySelector('[data-act="saveEvening"]');
    if (sv) { sv.disabled = false; sv.textContent = "Uložiť večer"; }
  }

  document.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.tab) { UI.tab = b.dataset.tab; UI.msg = null; render(); return; }
    if (b.dataset.goto) { UI.tab = b.dataset.goto; render(); return; }
    if (b.dataset.mode) { UI.logMode = b.dataset.mode; render(); return; }
    if (b.dataset.chip) {
      const ev = eveningRecord(), k = b.dataset.chip;
      ev.f[k] = !ev.f[k]; if (!ev.f[k]) delete ev.f[k];
      b.setAttribute("aria-pressed", String(!!ev.f[k]));
      markEveningDirty(); return;
    }
    if (b.dataset.cichip && ci) { const k = b.dataset.cichip; ci.f[k] = !ci.f[k]; if (!ci.f[k]) delete ci.f[k]; b.setAttribute("aria-pressed", String(!!ci.f[k])); return; }
    if (b.dataset.ans !== undefined && ci) { ci.a[QUESTIONS[ci.step].key] = Number(b.dataset.ans); ci.step++; renderCheckin(); return; }
    if (b.dataset.themeSet) { SET.theme = b.dataset.themeSet; saveSet(); applyTheme(); openSettings(); return; }
    if (b.dataset.explen) { SET.expLength = Number(b.dataset.explen); saveSet(); openSettings(); return; }
    if (b.dataset.sens) { SET.soundSensitivity = b.dataset.sens; saveSet(); openSettings(); return; }
    switch (b.dataset.act) {
      case "settings": openSettings(); break;
      case "startNight": startRecording(); break;
      case "askStopNight":
        confirmModal({ title: "Ukončiť nočný záznam?", text: "Appka prestane počúvať a ukáže ti súhrn noci.", ok: "Ukončiť záznam" }, () => { closeModal(); stopRecording(); });
        break;
      case "soundReport": openSoundReport(b.dataset.key); break;
      case "playClip": playClip(b); break;
      case "askDelSound": {
        const key = b.dataset.key;
        confirmModal({ title: "Vymazať záznam tejto noci?", text: "Vymaže sa súhrn zvuku aj ukážky z noci " + short(key) + " Ranný check-in zostane.", ok: "Vymazať", danger: true }, () => {
          stopPlaying();
