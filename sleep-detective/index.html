          if (D.sounds[key]) { dropClips(D.sounds[key].clips); delete D.sounds[key]; save(); }
          closeModal(); closeSheet(); toast("Záznam noci je vymazaný.");
        });
        break;
      }
      case "checkin": if (!D.nights.some(n => n.date === today())) openCheckin(); break;
      case "ciFactorsDone": if (ci) { ci.step++; renderCheckin(); } break;
      case "gotoEvening": UI.tab = "log"; UI.logMode = "evening"; render(); break;
      case "detail": openDetail(b.dataset.k); break;
      case "close": closeSheet(); break;
      case "gotoExp": UI.tab = "exp"; closeSheet(); break;
      case "startExp": startExp(b.dataset.k); break;
      case "cancelExp":
        confirmModal({ title: "Ukončiť experiment?", text: "Experiment „" + FMAP[D.exp.k].exp + "“ sa zruší bez verdiktu. Tvoje ranné a večerné záznamy zostanú.", ok: "Ukončiť", danger: true }, () => {
          D.exp = null; save(); closeModal(); render(); toast("Experiment je ukončený.");
        });
        break;
      case "export": exportData(); break;
      case "askReset":
        confirmModal({
          title: "Vymazať všetky dáta?",
          text: "Vymažú sa všetky zozbierané informácie: ranné a večerné záznamy, nočné záznamy zvuku s ukážkami, experimenty aj verdikty. Appka začne od začiatku. Túto akciu nie je možné vrátiť späť. Nastavenia vzhľadu zostanú.",
          ok: "Vymazať všetko", danger: true
        }, resetAll);
        break;
      case "modalOk": if (modalOk) modalOk(); break;
      case "modalCancel": closeModal(); break;
      case "install":
        if (installPrompt) {
          installPrompt.prompt();
          installPrompt.userChoice.finally(() => { installPrompt = null; render(); });
        }
        break;
      case "installLater": SET.installDismissed = true; saveSet(); render(); break;
      case "saveEvening": {
        const ev = eveningRecord(); ev.saved = true; save();
        const n = Object.keys(ev.f).length;
        toast(n ? "Večer uložený (" + n + " " + (n === 1 ? "stopa" : n < 5 ? "stopy" : "stôp") + "). Ráno sa spýtam, ako sa ti spalo." : "Večer uložený. Pokojný deň, uvidíme ráno.");
        render(); break;
      }
    }
  });
  // klik na tmavé pozadie okna = Zrušiť
  $("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
  // Počet a dĺžka ukážok z textových polí: uloží sa len celé číslo (počet od 0, dĺžka od 1 s).
  const CLIP_FIELDS = {
    "set-clipn-snore": ["clipSnoreN", 0], "set-clips-snore": ["clipSnoreSec", 1],
    "set-clipn-noise": ["clipNoiseN", 0], "set-clips-noise": ["clipNoiseSec", 1]
  };
  function setClipNum(input) {
    const [key, min] = CLIP_FIELDS[input.id];
    const v = input.value.trim();
    const ok = /^\d+$/.test(v) && +v >= min;
    input.setAttribute("aria-invalid", ok ? "false" : "true");
    if (ok) { SET[key] = +v; saveSet(); }
    const kind = input.id.slice(-5), err = $("#err-" + kind);
    const bad = ["n", "s"].filter(x => $("#set-clip" + x + "-" + kind).getAttribute("aria-invalid") === "true");
    err.textContent = bad.length ? (bad.includes("n") ? "Počet musí byť celé číslo (0 a viac). " : "") + (bad.includes("s") ? "Dĺžka musí byť celé číslo sekúnd (1 a viac)." : "") : "";
    err.hidden = !bad.length;
  }
  document.addEventListener("input", e => {
    if (e.target.id === "temp") { const ev = eveningRecord(); ev.temp = Number(e.target.value); $("#tempv").textContent = ev.temp + " °C"; markEveningDirty(); }
    if (e.target.id === "set-name") { SET.name = e.target.value.trim(); saveSet(); }
    if (/^set-clip[ns]-(snore|noise)$/.test(e.target.id)) setClipNum(e.target);
    if (e.target.id === "set-kbps") { SET.clipKbps = Number(e.target.value); saveSet(); }
  });
  document.addEventListener("keydown", e => {
    if (e.key !== "Escape") return;
    if (!$("#modal").hidden) closeModal();
    else if (!$("#night").hidden) return;
    else if (!$("#sheet").hidden) closeSheet();
  });

  // ---------- Inštalácia ----------
  // Chrome a Edge (desktop aj Android) pošlú beforeinstallprompt, keď sa appka dá nainštalovať.
  // Safari na iPhone takú udalosť nemá, tam sa dá appka pridať len ručne cez Zdieľať → Pridať na plochu.
  let installPrompt = null;
  const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  function installCard() {
    if (isStandalone() || SET.installDismissed) return "";
    if (installPrompt) {
      return '<div class="card"><h3>Nainštaluj si appku</h3><p class="small muted">Otvoríš ju z plochy jedným ťuknutím a funguje aj bez internetu.</p>' +
        '<div class="row"><button class="btn" data-act="install" type="button" style="flex:1">Inštalovať</button><button class="btn ghost" data-act="installLater" type="button">Neskôr</button></div></div>';
    }
    if (isIOS) {
      return '<div class="card"><h3>Pridaj si appku na plochu</h3><p class="small muted">V Safari ťukni na <b>Zdieľať</b> (štvorček so šípkou) a vyber <b>Pridať na plochu</b>.</p>' +
        '<button class="btn ghost" data-act="installLater" type="button">Rozumiem</button></div>';
    }
    return "";
  }
  window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault();
    installPrompt = e;
    if (UI.tab === "today" && $("#sheet").hidden) render();
  });
  window.addEventListener("appinstalled", () => { installPrompt = null; toast("Appka je nainštalovaná."); render(); });

  // keď sa appka otvorí na druhý deň, obrazovka sa obnoví na aktuálny dátum
  let shownDay = today();
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible") return;
    if (rec && !wake) requestWake();   // zámok obrazovky sa po prepnutí appky stratí
    if (today() !== shownDay && $("#sheet").hidden && !rec) { shownDay = today(); render(); }
  });
  // pri zatváraní appky počas záznamu uložíme aspoň rozpracovaný súhrn
  window.addEventListener("pagehide", () => { if (rec) storeNight(rec, Date.now(), true); });

  load();
  tidySounds();
  applyTheme();
  render();

  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    navigator.serviceWorker.register("sw.js").catch(() => { /* offline režim nie je dostupný */ });
  }
})();
</script>
</body>
</html>
