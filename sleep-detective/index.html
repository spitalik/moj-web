<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sleep Detective</title>
<meta name="description" content="Zisti, čo ti kazí spánok: ranný a večerný záznam, podozriví a 7-dňové experimenty.">
<meta name="theme-color" content="#141a2d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sleep Detective">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/logo.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: na počítači appka v ráme telefónu v strede, na mobile a po inštalácii na celú obrazovku. Zámerne len tmavá nočná téma. */
:root {
  --ink: #0d1120;
  --night: #141a2d;
  --dusk: #1c2340;
  --dusk-2: #252e52;
  --line: #2d375e;
  --fg: #e9ebf5;
  --muted: #99a2c4;
  --lamp: #f3c46b;
  --lamp-ink: #2b1f06;
  --bar: #3a4677;
  --good: #72d6ab;
  --bad: #f2877d;
  --mid: #c7a6ff;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--ink); color: var(--fg); }
[hidden] { display: none !important; }
body {
  margin: 0;
  font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }

.stage { display: flex; gap: 56px; justify-content: center; align-items: flex-start; flex-wrap: wrap; max-width: 1040px; margin: 0 auto; }

/* Intro */
.reset { align-self: center; background: none; border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; color: var(--muted); font-size: 13px; }
.reset:hover { color: var(--fg); border-color: var(--muted); }
.reset.armed { color: var(--bad); border-color: var(--bad); }

/* Phone */
.phone {
  flex: 0 0 auto; width: 390px; max-width: 100%;
  height: min(820px, calc(100dvh - 64px)); min-height: 640px;
  background: var(--night); border: 1px solid var(--line); border-radius: 38px;
  box-shadow: 0 30px 80px -30px #000c, 0 0 0 8px #0a0d19;
  overflow: hidden; display: flex; flex-direction: column; position: relative;
}
.statusbar { display: flex; justify-content: space-between; padding: 14px 26px 4px; font-family: var(--f-mono); font-size: 12px; color: var(--muted); flex: none; }
.scroll { flex: 1; overflow-y: auto; padding: 8px 18px 24px; display: flex; flex-direction: column; gap: 14px; scrollbar-width: thin; }
.tabbar { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); background: var(--night); padding: 6px 6px 12px; }
.tab { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; font-size: 11px; color: var(--muted); border-radius: 12px; }
.tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--lamp); }

/* Shared app parts */
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.head { display: flex; flex-direction: column; gap: 4px; padding-top: 6px; }
.head h2 { font-size: 28px; line-height: 1.1; }
.card { background: var(--dusk); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.card h3 { font-size: 17px; }
.card.lamp { background: var(--lamp); color: var(--lamp-ink); }
.card.lamp .eyebrow { color: var(--lamp-ink); opacity: 0.7; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.btn { border: 0; border-radius: 14px; padding: 13px 16px; font-weight: 600; background: var(--lamp); color: var(--lamp-ink); text-align: center; }
.btn.dark { background: var(--lamp-ink); color: var(--lamp); }
.btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--fg); font-weight: 500; }
.btn:disabled { opacity: 0.45; cursor: default; }
.link { background: none; border: 0; padding: 0; color: var(--lamp); font-weight: 500; text-align: left; }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat b { font-family: var(--f-display); font-size: 19px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat span { font-size: 11px; color: var(--muted); }

.pill { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.t-bad { color: var(--bad); } .t-mid { color: var(--mid); } .t-good { color: var(--good); } .t-few { color: var(--muted); } .t-lamp { color: var(--lamp); }

/* Suspects */
.suspect { background: var(--dusk); border: 1px solid transparent; border-radius: 18px; padding: 14px 16px; display: grid; grid-template-columns: 34px 1fr; gap: 4px 12px; text-align: left; width: 100%; }
.suspect:hover { border-color: var(--line); }
.suspect .ico { grid-row: span 3; font-size: 22px; line-height: 1; padding-top: 2px; }
.suspect .name { font-weight: 600; font-size: 16px; display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
.meter { height: 5px; border-radius: 3px; background: var(--dusk-2); overflow: hidden; margin-top: 4px; }
.meter i { display: block; height: 100%; border-radius: 3px; background: currentColor; }

/* Chart */
.chart svg { width: 100%; height: auto; display: block; }
.chart .b-on { fill: var(--lamp); }
.chart .b-off { fill: var(--bar); }
.chart .b-exp { fill: none; stroke: var(--good); stroke-width: 1.2; }
.chart .grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 3; }
.chart text { fill: var(--muted); font-family: var(--f-mono); font-size: 9px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

/* Compare bars */
.cmp { display: flex; flex-direction: column; gap: 6px; }
.cmp-row { display: grid; grid-template-columns: 74px 1fr 64px; gap: 8px; align-items: center; font-size: 12px; }
.cmp-row .track { height: 10px; background: var(--dusk-2); border-radius: 5px; overflow: hidden; }
.cmp-row .track i { display: block; height: 100%; border-radius: 5px; }
.cmp-row b { font-variant-numeric: tabular-nums; text-align: right; font-weight: 600; }

/* Log */
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--dusk); border-radius: 12px; padding: 4px; }
.seg button { border: 0; background: none; padding: 9px; border-radius: 9px; color: var(--muted); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--dusk-2); color: var(--fg); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--night); border-radius: 999px; padding: 9px 13px; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
.chip[aria-pressed="true"] { background: var(--lamp); color: var(--lamp-ink); border-color: var(--lamp); font-weight: 600; }
input[type="range"] { width: 100%; accent-color: var(--lamp); }
.hist { display: flex; flex-direction: column; }
.hist-row { display: grid; grid-template-columns: 56px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-size: 13px; }
.hist-row:first-child { border-top: 0; }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--dusk-2); }
.dots i.on { background: var(--lamp); }

/* Experiments */
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day { aspect-ratio: 1; max-width: 100%; border-radius: 10px; border: 1px dashed var(--lamp-ink); display: grid; place-items: center; font-family: var(--f-mono); font-size: 12px; opacity: 0.55; }
.day.done { background: var(--lamp-ink); color: var(--lamp); border-style: solid; opacity: 1; }
.exp-item { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.exp-item:first-of-type { border-top: 0; }
.exp-item .ico { font-size: 20px; }
.exp-item .btn { padding: 8px 12px; font-size: 13px; border-radius: 10px; }
.inline-msg { font-size: 13px; color: var(--lamp); }

/* Sheet (check-in, detail) */
.sheet { position: absolute; inset: 0; background: var(--night); z-index: 5; display: flex; flex-direction: column; }
.sheet-top { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 6px; flex: none; }
.icon-btn { background: var(--dusk); border: 0; border-radius: 50%; width: 36px; height: 36px; display: grid; place-items: center; font-size: 18px; }
.progress { display: flex; gap: 5px; }
.progress i { width: 22px; height: 4px; border-radius: 2px; background: var(--dusk-2); }
.progress i.on { background: var(--lamp); }
.q { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 22px; padding: 0 22px 40px; }
.q h2 { font-size: 30px; line-height: 1.1; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { background: var(--dusk); border: 1px solid transparent; border-radius: 16px; padding: 15px 16px; text-align: left; display: flex; align-items: center; gap: 14px; font-size: 16px; }
.opt:hover { border-color: var(--lamp); }
.opt .n { font-family: var(--f-mono); font-size: 13px; width: 28px; height: 28px; border-radius: 50%; background: var(--dusk-2); display: grid; place-items: center; flex: none; }

.toast { position: absolute; left: 16px; right: 16px; bottom: 84px; background: var(--fg); color: var(--ink); border-radius: 14px; padding: 12px 14px; font-size: 14px; font-weight: 500; z-index: 9; box-shadow: 0 10px 30px -10px #000a; }

/* Mobil a nainštalovaná appka: bez rámu telefónu, na celú obrazovku */
@media (max-width: 520px), (display-mode: standalone) {
  html, body { height: 100%; }
  body { padding: 0; overflow: hidden; }
  .statusbar { display: none; }
  .stage { display: block; max-width: none; height: 100%; }
  .phone { width: 100%; height: 100%; min-height: 0; max-height: none; border: 0; border-radius: 0; box-shadow: none; }
  .scroll { padding-top: calc(env(safe-area-inset-top, 0px) + 12px); padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
  .sheet-top { padding-top: calc(env(safe-area-inset-top, 0px) + 16px); }
  .tabbar { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); }
  .toast { bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); }
}
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: up .22s ease-out; }
  @keyframes up { from { transform: translateY(24px); opacity: .6; } }
}
</style>
</head>
<body>

<div class="stage">
  <div class="phone" id="phone">
    <div class="statusbar"><span id="clock">7:12</span><span>Sleep Detective</span></div>
    <main class="scroll" id="view"></main>
    <nav class="tabbar" id="tabbar">
      <button class="tab" data-tab="today" type="button"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Dnes</button>
      <button class="tab" data-tab="log" type="button"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg>Záznam</button>
      <button class="tab" data-tab="case" type="button"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>Spis</button>
      <button class="tab" data-tab="exp" type="button"><svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6L4.5 18.5A1.7 1.7 0 0 0 6 21h12a1.7 1.7 0 0 0 1.5-2.5L14 9V3"/><path d="M7 15h10"/></svg>Experimenty</button>
    </nav>
    <div id="sheet" class="sheet" hidden></div>
    <div id="toast" class="toast" hidden></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------- Reference data ----------
  const FACTORS = [
    { k: "coffee",   name: "Káva po 14:00",    icon: "☕", exp: "7 dní bez kávy po 14:00",          expShort: "bez kávy po 14:00" },
    { k: "phone",    name: "Mobil v posteli",  icon: "📱", exp: "7 dní nechať mobil mimo postele",  expShort: "bez mobilu v posteli" },
    { k: "alcohol",  name: "Alkohol",          icon: "🍷", exp: "7 dní bez alkoholu",               expShort: "bez alkoholu" },
    { k: "lateMeal", name: "Jedlo po 20:00",   icon: "🍝", exp: "Večera najneskôr o 19:30",         expShort: "s večerou do 19:30" },
    { k: "stress",   name: "Stresný deň",      icon: "😣", exp: "10 min uvoľnenia pred spaním",     expShort: "s uvoľnením pred spaním" },
    { k: "sportEve", name: "Šport po 19:00",   icon: "🏃", exp: "Tréning presunúť pred 18:00",      expShort: "s tréningom pred 18:00" },
    { k: "nap",      name: "Šlofík cez deň",   icon: "💤", exp: "Bez šlofíka po 15:00",             expShort: "bez šlofíka" }
  ];
  const FMAP = Object.fromEntries(FACTORS.map(f => [f.k, f]));
  const METRICS = [
    { k: "latency", label: "Zaspávanie", better: "low",  thr: 10,   fmt: v => Math.round(v) + " min" },
    { k: "wakes",   label: "Prebudenia", better: "low",  thr: 0.5,  fmt: v => dec(v) + "×" },
    { k: "quality", label: "Kvalita",    better: "high", thr: 0.45, fmt: v => dec(v) + " / 5" }
  ];
  const MMAP = Object.fromEntries(METRICS.map(m => [m.k, m]));
  const STATUS = {
    confirmed: { label: "Potvrdené",            cls: "t-bad" },
    prime:     { label: "Hlavný podozrivý",     cls: "t-bad" },
    suspect:   { label: "Podozrivý",            cls: "t-mid" },
    clear:     { label: "Asi nevinný",          cls: "t-good" },
    acquitted: { label: "Oslobodený",           cls: "t-good" },
    few:       { label: "Málo dôkazov",         cls: "t-few" }
  };
  const DAYS = ["nedeľa", "pondelok", "utorok", "streda", "štvrtok", "piatok", "sobota"];
  const MONTHS = ["januára", "februára", "marca", "apríla", "mája", "júna", "júla", "augusta", "septembra", "októbra", "novembra", "decembra"];

  // ---------- Helpers ----------
  const $ = s => document.querySelector(s);
  const dec = v => (Math.round(v * 10) / 10).toFixed(1).replace(".", ",");
  const mean = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const toD = s => new Date(s + "T12:00:00");
  const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const addDays = (s, n) => { const d = toD(s); d.setDate(d.getDate() + n); return iso(d); };
  const short = s => { const d = toD(s); return d.getDate() + ". " + (d.getMonth() + 1) + "."; };
  const long = s => { const d = toD(s); const w = DAYS[d.getDay()]; return w.charAt(0).toUpperCase() + w.slice(1) + " " + d.getDate() + ". " + MONTHS[d.getMonth()]; };
  const hm = h => { const m = Math.round(h * 60); return Math.floor(m / 60) + " h " + String(m % 60).padStart(2, "0") + " min"; };
  const hmShort = h => { const m = Math.round(h * 60); return Math.floor(m / 60) + ":" + String(m % 60).padStart(2, "0"); };

  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // ---------- Simulated person ----------
  // Hidden "truth": coffee slows falling asleep, alcohol and late meals cause waking,
  // the phone in bed lowers quality, stress adds a little latency, evening sport does nothing.
  const PROB = { coffee: .42, alcohol: .25, sportEve: .3, lateMeal: .3, stress: .35, phone: .55, nap: .15 };
  let R;
  function randomFactors(noCoffee) {
    const f = {};
    for (const k in PROB) f[k] = R() < PROB[k];
    if (noCoffee) f.coffee = false;
    return f;
  }
  function simulate(date, f) {
    const latency = Math.round(12 + (f.coffee ? 32 : 0) + (f.stress ? 9 : 0) + (f.nap ? 6 : 0) + R() * 12);
    const wakes = Math.max(0, Math.round(0.3 + (f.alcohol ? 1.5 : 0) + (f.lateMeal ? 0.6 : 0) + R() * 1.1));
    const quality = clamp(Math.round(4.4 - (f.coffee ? 0.8 : 0) - (f.phone ? 0.8 : 0) - (f.alcohol ? 0.5 : 0) - wakes * 0.25 + (R() - 0.5) * 0.9), 1, 5);
    const duration = +(7.7 - latency / 60 - (f.phone ? 0.45 : 0) - wakes * 0.15 + (R() - 0.5) * 0.6).toFixed(2);
    const energy = clamp(Math.round(quality * 0.65 + (duration - 6) * 0.6 + 0.9 + (R() - 0.5)), 1, 5);
    return { date, f, latency, wakes, quality, duration, energy, source: "sim" };
  }

  // ---------- State ----------
  let S;
  function initState() {
    R = rng(20261116);
    const nights = [];
    const first = "2026-10-26", expStart = "2026-11-13";
    for (let i = 0; i < 21; i++) {
      const date = addDays(first, i);
      nights.push(simulate(date, randomFactors(date >= expStart)));
    }
    S = {
      tab: "today",
      today: "2026-11-16",
      nights,
      checkedToday: false,
      // factors from last evening's record, used for tonight's (= this morning's) entry
      lastEvening: { coffee: false, phone: true, alcohol: false, lateMeal: false, stress: true, sportEve: false, nap: false },
      evening: {},
      eveningSaved: false,
      temp: 20,
      logMode: "evening",
      exp: { k: "coffee", start: expStart, length: 7 },
      verdicts: {},           // factor key -> verdict object from finished experiments
      closed: [
        { icon: "🌡️", name: "Spálňa pod 20 °C", when: "október", tone: "t-mid", label: "Mierny vplyv", text: "Kvalita spánku stúpla z 3,2 na 3,6 z 5." }
      ],
      msg: null
    };
  }

  // ---------- Analysis ----------
  function analyze() {
    const nights = S.nights;
    return FACTORS.map(F => {
      const w = nights.filter(n => n.f[F.k]), wo = nights.filter(n => !n.f[F.k]);
      const r = { F, nWith: w.length, nWithout: wo.length, m: {} };
      let best = null;
      for (const M of METRICS) {
        const a = mean(w.map(n => n[M.k])), b = mean(wo.map(n => n[M.k]));
        const harm = (M.better === "low" ? a - b : b - a) / M.thr;
        r.m[M.k] = { a, b, harm };
        if (!best || harm > best.harm) best = { M, a, b, harm };
      }
      r.best = best;
      const v = S.verdicts[F.k];
      if (v) r.status = v.confirmed ? "confirmed" : "acquitted";
      else if (w.length < 3 || wo.length < 3) r.status = "few";
      else if (best.harm >= 2.2) r.status = "prime";
      else if (best.harm >= 1.1) r.status = "suspect";
      else r.status = "clear";
      const order = { confirmed: 5, prime: 4, suspect: 3, clear: 1, acquitted: 0, few: -1 };
      r.rank = order[r.status] * 10 + Math.max(0, best.harm);
      return r;
    }).sort((x, y) => y.rank - x.rank);
  }

  function sentence(r) {
    const v = S.verdicts[r.F.k];
    if (v) return v.text;
    if (r.status === "few") return "Zatiaľ len " + r.nWith + " " + nightsWord(r.nWith) + " s týmto faktorom. Potrebujem aspoň 3.";
    if (r.status === "clear") return "Zatiaľ žiadny jasný vplyv na tvoj spánok.";
    const { M, a, b } = r.best;
    if (M.k === "latency") return "Zaspávaš v priemere o " + Math.round(a - b) + " min dlhšie (" + Math.round(a) + " vs. " + Math.round(b) + " min).";
    if (M.k === "wakes") return "Budíš sa v priemere " + dec(a) + "× za noc, inak " + dec(b) + "×.";
    return "Kvalita spánku " + dec(a) + " z 5, bez neho " + dec(b) + ".";
  }
  function nightsWord(n) { return n === 1 ? "noc" : (n >= 2 && n <= 4 ? "noci" : "nocí"); }

  // ---------- Chart ----------
  function nightChart(F, M, opts) {
    opts = opts || {};
    const nights = S.nights, W = 340, H = 132, pl = 30, pr = 4, pt = 10, pb = 22;
    const vals = nights.map(n => n[M.k]);
    let max = M.k === "quality" ? 5 : M.k === "wakes" ? Math.max(3, Math.ceil(Math.max(...vals))) : Math.ceil(Math.max(...vals) / 10) * 10;
    const bw = (W - pl - pr) / nights.length, ih = H - pt - pb;
    const y = v => pt + ih - (v / max) * ih;
    let s = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + M.label + ' po nociach">';
    [0, max / 2, max].forEach(t => {
      s += '<line class="grid" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(t) + '" y2="' + y(t) + '"/>';
      s += '<text x="' + (pl - 5) + '" y="' + (y(t) + 3) + '" text-anchor="end">' + (M.k === "latency" ? Math.round(t) : dec(t).replace(",0", "")) + "</text>";
    });
    nights.forEach((n, i) => {
      const v = n[M.k], h = Math.max(1.5, (v / max) * ih);
      const x = pl + i * bw + 1.2, w = Math.max(2, bw - 2.4);
      s += '<rect class="' + (n.f[F.k] ? "b-on" : "b-off") + '" x="' + x.toFixed(1) + '" y="' + (pt + ih - h).toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="1.5"><title>' + short(n.date) + ": " + M.fmt(v) + (n.f[F.k] ? " · " + F.name : "") + "</title></rect>";
      if (opts.expMark && S.exp && n.date >= S.exp.start && S.exp.k === F.k) {
        s += '<rect class="b-exp" x="' + (x - 0.6).toFixed(1) + '" y="' + (pt + ih + 3) + '" width="' + (w + 1.2).toFixed(1) + '" height="3" rx="1"/>';
      }
    });
    s += '<text x="' + pl + '" y="' + (H - 4) + '">' + short(nights[0].date) + "</text>";
    s += '<text x="' + (W - pr) + '" y="' + (H - 4) + '" text-anchor="end">' + short(nights[nights.length - 1].date) + "</text>";
    return '<div class="chart">' + s + "</svg></div>";
  }

  // ---------- Experiment helpers ----------
  function expNights() { return S.exp ? S.nights.filter(n => n.date >= S.exp.start) : []; }
  function expBaseline(k) { return S.nights.filter(n => (!S.exp || n.date < S.exp.start) && n.f[k]); }

  // ---------- Views ----------
  function viewToday() {
    const A = analyze();
    const top = A.find(r => r.status === "confirmed" || r.status === "prime" || r.status === "suspect") || A[0];
    const last = S.nights[S.nights.length - 1];
    let h = '<div class="head"><div class="eyebrow">' + long(S.today) + '</div><h2>Dobré ráno</h2></div>';

    if (!S.checkedToday) {
      h += '<div class="card lamp"><div class="eyebrow">Ranný check-in</div><h3>Ako sa ti dnes spalo?</h3><p class="small">4 otázky, 10 sekúnd. Bez toho detektív nemá stopy.</p><button class="btn dark" data-act="checkin" type="button">Začať check-in</button></div>';
    }

    h += '<div class="card"><div class="row"><div class="eyebrow">Posledná noc · ' + short(last.date) + '</div>' +
      (last.source === "me" ? '<span class="pill t-lamp">Tvoj zápis</span>' : "") + "</div>" +
      '<div class="stats">' +
      stat(hmShort(last.duration), "spánok") + stat(last.latency + " min", "zaspávanie") +
      stat(last.wakes + "×", "prebudenia") + stat(last.energy + "/5", "ráno energia") +
      '</div><p class="small muted">Dĺžka spánku z hodiniek (Health Connect). Ostatné z tvojho check-inu.</p></div>';

    if (top) {
      const st = STATUS[top.status];
      h += '<div class="card"><div class="row"><div class="eyebrow">Zo spisu</div><span class="pill ' + st.cls + '">' + st.label + "</span></div>" +
        "<h3>" + top.F.icon + " " + top.F.name + "</h3><p class=\"small\">" + sentence(top) + "</p>" +
        nightChart(top.F, top.best.M) +
        '<div class="legend"><span><i style="background:var(--lamp)"></i>noc po: ' + top.F.name.toLowerCase() + '</span><span><i style="background:var(--bar)"></i>ostatné noci</span></div>' +
        '<button class="link" data-act="detail" data-k="' + top.F.k + '" type="button">Otvoriť dôkazy →</button></div>';
    }

    if (S.exp) {
      const n = Math.min(expNights().length, S.exp.length);
      h += '<div class="card"><div class="row"><div class="eyebrow">Bežiaci experiment</div><span class="small muted">noc ' + n + " zo " + S.exp.length + "</span></div>" +
        "<h3>" + FMAP[S.exp.k].icon + " " + FMAP[S.exp.k].exp + "</h3>" +
        '<div class="meter t-lamp"><i style="width:' + (n / S.exp.length * 100) + '%"></i></div>' +
        '<button class="link" data-goto="exp" type="button">Pozrieť priebeh →</button></div>';
    }
    return h;
  }
  function stat(v, l) { return '<div class="stat"><b>' + v + "</b><span>" + l + "</span></div>"; }

  function viewLog() {
    let h = '<div class="head"><div class="eyebrow">Stopy</div><h2>Záznam</h2></div>';
    h += '<div class="seg" role="group" aria-label="Typ záznamu">' +
      '<button type="button" data-mode="evening" aria-pressed="' + (S.logMode === "evening") + '">Večer</button>' +
      '<button type="button" data-mode="morning" aria-pressed="' + (S.logMode === "morning") + '">Ráno</button></div>';

    if (S.logMode === "evening") {
      h += '<div class="card"><h3>Čo sa dnes dialo?</h3><p class="small muted">Ťukni na všetko, čo platí. Zvyšok je „nie“.</p><div class="chips">';
      FACTORS.forEach(F => {
        h += '<button type="button" class="chip" data-chip="' + F.k + '" aria-pressed="' + !!S.evening[F.k] + '"><span aria-hidden="true">' + F.icon + "</span>" + F.name + "</button>";
      });
      h += '</div><label class="small" for="temp">Teplota v spálni: <b id="tempv">' + S.temp + ' °C</b></label>' +
        '<input id="temp" type="range" min="16" max="26" step="1" value="' + S.temp + '">' +
        '<button class="btn" data-act="saveEvening" type="button"' + (S.eveningSaved ? " disabled" : "") + ">" + (S.eveningSaved ? "Večer je zapísaný" : "Uložiť večer") + "</button></div>";
    } else {
      h += '<div class="card"><h3>Ranný check-in</h3><p class="small muted">' + (S.checkedToday ? "Dnešné ráno už máš zapísané." : "Kvalita, zaspávanie, prebudenia a energia. Dĺžku spánku doplníme z hodiniek.") + "</p>" +
        '<button class="btn" data-act="checkin" type="button"' + (S.checkedToday ? " disabled" : "") + ">" + (S.checkedToday ? "Hotovo" : "Začať check-in") + "</button></div>";
    }

    h += '<div class="card"><div class="eyebrow">Posledných 7 nocí</div><div class="hist">';
    S.nights.slice(-7).reverse().forEach(n => {
      const icons = FACTORS.filter(F => n.f[F.k]).map(F => '<span title="' + F.name + '">' + F.icon + "</span>").join(" ");
      h += '<div class="hist-row"><span class="muted">' + short(n.date) + "</span><span>" + (icons || '<span class="muted">nič zvláštne</span>') + "</span>" +
        '<span class="small" style="text-align:right">' + n.latency + " min · " + n.quality + "/5</span></div>";
    });
    h += "</div></div>";
    return h;
  }

  function viewCase() {
    const A = analyze();
    const n = S.nights.length;
    let h = '<div class="head"><div class="eyebrow">Spis č. ' + String(n).padStart(3, "0") + " · " + n + " nocí dôkazov</div><h2>Kto ti kradne spánok?</h2></div>";
    h += '<p class="small muted">Porovnávam noci s daným faktorom a bez neho. Súvislosť ešte nie je dôkaz. Vinu potvrdí až experiment.</p>';
    A.forEach(r => {
      const st = STATUS[r.status];
      const strength = r.status === "few" ? 0 : clamp(r.best.harm / 3.5, 0, 1);
      h += '<button class="suspect" type="button" data-act="detail" data-k="' + r.F.k + '">' +
        '<span class="ico" aria-hidden="true">' + r.F.icon + "</span>" +
        '<span class="name">' + r.F.name + ' <span class="pill ' + st.cls + '">' + st.label + "</span></span>" +
        '<span class="small muted">' + sentence(r) + "</span>" +
        '<span class="meter ' + st.cls + '"><i style="width:' + (strength * 100) + '%"></i></span></button>';
    });
    h += '<p class="small muted">Sleep Detective nie je zdravotnícka pomôcka. Ak chrápeš s prestávkami v dýchaní alebo ťa cez deň stále premáha únava, zájdi k lekárovi.</p>';
    return h;
  }

  function viewExp() {
    let h = '<div class="head"><div class="eyebrow">Výsluchy</div><h2>Experimenty</h2></div>';
    if (S.exp) {
      const F = FMAP[S.exp.k], en = expNights(), done = Math.min(en.length, S.exp.length);
      const base = expBaseline(F.k);
      h += '<div class="card lamp"><div class="row"><div class="eyebrow">Beží · noc ' + done + " zo " + S.exp.length + "</div></div>" +
        "<h3>" + F.icon + " " + F.exp + '</h3><div class="days">';
      for (let i = 0; i < S.exp.length; i++) {
        h += '<div class="day' + (i < done ? " done" : "") + '">' + (i < done ? short(en[i].date).replace(/\s/g, "") : i + 1) + "</div>";
      }
      h += "</div>";
      if (done > 0 && base.length) {
        h += '<p class="small">Zaspávanie počas experimentu: <b>' + Math.round(mean(en.map(n => n.latency))) + " min</b>. Predtým v dňoch s kávou: <b>" + Math.round(mean(base.map(n => n.latency))) + " min</b>.</p>";
      }
      h += '<button class="btn dark" data-act="finishExp" type="button">Demo: preskočiť na koniec</button>' +
        '<p class="small" style="opacity:.75">Simuluje zvyšné noci, ako keby sa experiment dodržal.</p></div>';
    }

    if (S.msg) h += '<p class="inline-msg">' + S.msg + "</p>";

    h += '<div class="card"><div class="eyebrow">Ďalšie experimenty</div>';
    const A = analyze();
    A.filter(r => !S.verdicts[r.F.k] && !(S.exp && S.exp.k === r.F.k)).forEach(r => {
      const st = STATUS[r.status];
      h += '<div class="exp-item"><span class="ico" aria-hidden="true">' + r.F.icon + "</span><div><div>" + r.F.exp + '</div><span class="small ' + st.cls + '">' + st.label + "</span></div>" +
        '<button class="btn ghost" data-act="startExp" data-k="' + r.F.k + '" type="button">Spustiť</button></div>';
    });
    h += "</div>";

    h += '<div class="card"><div class="eyebrow">Uzavreté prípady</div>';
    S.closed.forEach(c => {
      h += '<div class="exp-item"><span class="ico" aria-hidden="true">' + c.icon + "</span><div><div>" + c.name + ' <span class="small muted">· ' + c.when + '</span></div><span class="small muted">' + c.text + '</span></div><span class="pill ' + c.tone + '">' + c.label + "</span></div>";
    });
    h += "</div>";
    h += '<p class="small muted">Ukážkové dáta simulujú 3 týždne používania. Všetko sa ukladá len v tomto zariadení.</p>';
    h += '<button class="reset" id="reset" type="button">Začať odznova s ukážkovými dátami</button>';
    return h;
  }

  // ---------- Sheets ----------
  function openDetail(k) {
    const r = analyze().find(x => x.F.k === k);
    const F = r.F, st = STATUS[r.status];
    let h = '<div class="sheet-top"><button class="icon-btn" data-act="close" type="button" aria-label="Späť">←</button><span class="eyebrow">Podozrivý</span><span style="width:36px"></span></div>';
    h += '<div class="scroll">';
    h += '<div class="head"><span class="pill ' + st.cls + '" style="align-self:flex-start">' + st.label + "</span><h2>" + F.icon + " " + F.name + '</h2><p class="small muted">' + r.nWith + " " + nightsWord(r.nWith) + " s ním, " + r.nWithout + " bez neho</p></div>";
    h += '<div class="card"><h3>' + sentence(r) + "</h3>";
    METRICS.forEach(M => {
      const m = r.m[M.k];
      const scale = M.k === "quality" ? 5 : Math.max(m.a, m.b, 0.01) * 1.15;
      const bad = m.harm >= 1.1;
      h += '<div class="cmp"><div class="eyebrow" style="margin-top:6px">' + M.label + (bad ? ' <span class="t-bad">· horšie</span>' : "") + "</div>" +
        '<div class="cmp-row"><span>S faktorom</span><span class="track"><i style="width:' + (m.a / scale * 100) + '%;background:var(--lamp)"></i></span><b>' + (r.nWith ? M.fmt(m.a) : "–") + "</b></div>" +
        '<div class="cmp-row"><span class="muted">Bez neho</span><span class="track"><i style="width:' + (m.b / scale * 100) + '%;background:var(--bar)"></i></span><b class="muted">' + M.fmt(m.b) + "</b></div></div>";
    });
    h += "</div>";
    h += '<div class="card"><div class="eyebrow">Dôkazy noc po noci · ' + r.best.M.label.toLowerCase() + "</div>" + nightChart(F, r.best.M, { expMark: true }) +
      '<div class="legend"><span><i style="background:var(--lamp)"></i>s faktorom</span><span><i style="background:var(--bar)"></i>bez neho</span>' +
      (S.exp && S.exp.k === F.k ? '<span><i style="background:var(--good)"></i>počas experimentu</span>' : "") + "</div></div>";

    const v = S.verdicts[k];
    if (v) {
      h += '<div class="card"><div class="eyebrow">Verdikt experimentu</div><p>' + v.text + "</p>" + (v.advice ? '<p class="small muted">' + v.advice + "</p>" : "") + "</div>";
    } else if (S.exp && S.exp.k === k) {
      h += '<div class="card lamp"><div class="eyebrow">Overovanie beží</div><p>Experiment „' + F.exp + "“ je na noci " + Math.min(expNights().length, S.exp.length) + " zo " + S.exp.length + '.</p><button class="btn dark" data-act="gotoExp" type="button">Pozrieť experiment</button></div>';
    } else {
      h += '<div class="card"><div class="eyebrow">Ako to overiť</div><p>' + F.exp + ". Potom porovnáme tie noci s tvojím bežným spánkom.</p>" +
        '<button class="btn" data-act="startExp" data-k="' + k + '" type="button">Spustiť 7-dňový experiment</button></div>';
    }
    h += "</div>";
    showSheet(h);
  }

  const QUESTIONS = [
    { key: "quality", title: "Ako sa ti spalo?", opts: [[1, "Hrozne"], [2, "Zle"], [3, "Dá sa"], [4, "Dobre"], [5, "Výborne"]] },
    { key: "latency", title: "Ako dlho ti trvalo zaspať?", opts: [[10, "Do 15 minút"], [22, "15 až 30 minút"], [45, "30 až 60 minút"], [75, "Viac ako hodinu"]] },
    { key: "wakes", title: "Koľkokrát ťa v noci niečo zobudilo?", opts: [[0, "Ani raz"], [1, "Raz"], [2, "Dvakrát"], [3, "Trikrát a viac"]] },
    { key: "energy", title: "Koľko máš teraz energie?", opts: [[1, "Žiadnu"], [2, "Málo"], [3, "Akurát"], [4, "Dosť"], [5, "Plno"]] }
  ];
  let ci = null;
  function openCheckin() { ci = { step: 0, a: {} }; renderCheckin(); }
  function renderCheckin() {
    const top = '<div class="sheet-top"><button class="icon-btn" data-act="close" type="button" aria-label="Zavrieť">×</button><div class="progress">' +
      QUESTIONS.map((_, i) => '<i class="' + (i <= ci.step ? "on" : "") + '"></i>').join("") + '</div><span style="width:36px"></span></div>';
    if (ci.step < QUESTIONS.length) {
      const q = QUESTIONS[ci.step];
      let h = top + '<div class="q"><div class="eyebrow">Otázka ' + (ci.step + 1) + " zo " + QUESTIONS.length + "</div><h2>" + q.title + '</h2><div class="opts">';
      q.opts.forEach(([v, l], i) => { h += '<button class="opt" type="button" data-ans="' + v + '"><span class="n">' + (q.key === "quality" || q.key === "energy" ? v : i + 1) + "</span>" + l + "</button>"; });
      h += "</div></div>";
      showSheet(h);
    } else {
      // Save
      const duration = +(7.6 - ci.a.latency / 60 - (S.lastEvening.phone ? 0.4 : 0) - ci.a.wakes * 0.15).toFixed(2);
      const night = { date: S.today, f: Object.assign({}, S.lastEvening), latency: ci.a.latency, wakes: ci.a.wakes, quality: ci.a.quality, energy: ci.a.energy, duration, source: "me" };
      S.nights.push(night);
      S.checkedToday = true;
      let extra = "";
      if (S.exp) {
        const n = Math.min(expNights().length, S.exp.length);
        extra = '<div class="card"><div class="eyebrow">Experiment</div><p>Noc ' + n + " zo " + S.exp.length + " " + FMAP[S.exp.k].expShort + ". " + (n >= S.exp.length ? "Experiment je hotový." : "Ešte " + (S.exp.length - n) + " " + nightsWord(S.exp.length - n) + ".") + "</p></div>";
      }
      const avg = Math.round(mean(S.nights.slice(-8, -1).map(n => n.latency)));
      const h = '<div class="sheet-top"><button class="icon-btn" data-act="close" type="button" aria-label="Zavrieť">×</button><span class="eyebrow">Hotovo</span><span style="width:36px"></span></div>' +
        '<div class="q"><div class="eyebrow">Zapísané · ' + short(S.today) + "</div><h2>Ďakujem, stopa je v spise.</h2>" +
        '<div class="card"><div class="stats">' + stat(hmShort(duration), "spánok") + stat(ci.a.latency + " min", "zaspávanie") + stat(ci.a.wakes + "×", "prebudenia") + stat(ci.a.energy + "/5", "energia") + "</div>" +
        '<p class="small muted">Za posledný týždeň trvalo zaspávanie v priemere ' + avg + " min. Včerajší večerný zápis: " + FACTORS.filter(F => S.lastEvening[F.k]).map(F => F.name.toLowerCase()).join(", ") + ".</p></div>" +
        extra + '<button class="btn" data-act="close" type="button">Pozrieť spis</button></div>';
      showSheet(h);
      S.tab = "case";
      ci = null;
    }
  }

  function showSheet(h) { const el = $("#sheet"); el.innerHTML = h; el.hidden = false; const f = el.querySelector("button"); if (f) f.focus({ preventScroll: true }); }
  function closeSheet() { $("#sheet").hidden = true; $("#sheet").innerHTML = ""; ci = null; render(); }

  let toastT;
  function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 2600); }

  // ---------- Actions ----------
  function startExp(k) {
    if (S.exp) { S.msg = "Naraz beží len jeden experiment, aby bolo jasné, čo zabralo. Najprv dokonči „" + FMAP[S.exp.k].exp + "“."; S.tab = "exp"; closeSheet(); return; }
    S.exp = { k, start: addDays(S.today, 1), length: 7 };
    S.msg = null;
    toast("Experiment spustený: " + FMAP[k].exp + ". Začína dnes večer.");
    S.tab = "exp"; closeSheet();
  }

  function finishExp() {
    const k = S.exp.k, F = FMAP[k];
    if (!R) R = rng(7);
    let date = S.nights[S.nights.length - 1].date;
    while (expNights().length < S.exp.length) {
      date = addDays(date, 1);
      const f = randomFactors(false); f[k] = false;
      S.nights.push(simulate(date, f));
    }
    S.today = addDays(date, 1);
    S.checkedToday = false;
    const en = expNights(), base = expBaseline(k);
    // Compare on the metric the factor was suspected of
    const pre = S.nights.filter(n => n.date < S.exp.start);
    const preW = pre.filter(n => n.f[k]), preWo = pre.filter(n => !n.f[k]);
    let M = METRICS[0], bestH = -Infinity;
    METRICS.forEach(m => { const a = mean(preW.map(n => n[m.k])), b = mean(preWo.map(n => n[m.k])); const hh = (m.better === "low" ? a - b : b - a) / m.thr; if (hh > bestH) { bestH = hh; M = m; } });
    const before = mean(base.map(n => n[M.k])), during = mean(en.map(n => n[M.k]));
    const gain = (M.better === "low" ? before - during : during - before) / M.thr;
    const confirmed = gain >= 1;
    const text = M.k === "latency"
      ? "Počas experimentu trvalo zaspávanie v priemere " + Math.round(during) + " min. Predtým v dňoch s faktorom to bolo " + Math.round(before) + " min."
      : M.label + " počas experimentu " + M.fmt(during) + ", predtým " + M.fmt(before) + ".";
    S.verdicts[k] = {
      confirmed,
      text: (confirmed ? "Vina potvrdená. " : "Vplyv sa nepotvrdil. ") + text,
      advice: confirmed ? "Odporúčanie: " + F.expShort + " si nechaj ako návyk. O mesiac skontrolujem, či efekt trvá." : "Tento faktor ťa zrejme netrápi. Zameraj sa na ďalšieho podozrivého."
    };
    S.closed.unshift({ icon: F.icon, name: F.exp, when: short(S.exp.start) + " – " + short(date), tone: confirmed ? "t-bad" : "t-good", label: confirmed ? "Vina potvrdená" : "Nepotvrdené", text });
    S.exp = null; S.msg = null;
    toast(confirmed ? "Verdikt: " + F.name + " ti naozaj kazí spánok." : "Verdikt: " + F.name + " je nevinný.");
    render();
  }

  // ---------- Render & events ----------
  function render() {
    const v = { today: viewToday, log: viewLog, case: viewCase, exp: viewExp }[S.tab];
    $("#view").innerHTML = v();
    $("#view").scrollTop = 0;
    document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-current", t.dataset.tab === S.tab ? "page" : "false"));
    save();
  }

  // ---------- Ukladanie v zariadení ----------
  const STORE_KEY = "sleepDetective.state.v1";
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { /* bez úložiska appka beží len do zatvorenia */ }
  }
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(STORE_KEY));
      if (!s || !Array.isArray(s.nights) || !s.nights.length) return false;
      S = s;
      S.msg = null;
      R = rng(20261116 + S.nights.length);  // ďalšie simulované noci nadviažu bez opakovania
      return true;
    } catch (e) { return false; }
  }

  document.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.id === "reset") {
      // dvojité ťuknutie ako potvrdenie, aby sa záznamy nezmazali omylom
      if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "Ťukni znova: tvoje záznamy sa vymažú"; return; }
      initState(); S.tab = "exp"; $("#sheet").hidden = true; render(); toast("Začíname odznova s ukážkovými dátami."); return;
    }
    if (b.dataset.tab) { S.tab = b.dataset.tab; S.msg = null; render(); return; }
    if (b.dataset.goto) { S.tab = b.dataset.goto; render(); return; }
    if (b.dataset.mode) { S.logMode = b.dataset.mode; render(); return; }
    if (b.dataset.chip) { const k = b.dataset.chip; S.evening[k] = !S.evening[k]; S.eveningSaved = false; b.setAttribute("aria-pressed", String(!!S.evening[k])); save(); const sv = document.querySelector('[data-act="saveEvening"]'); if (sv) { sv.disabled = false; sv.textContent = "Uložiť večer"; } return; }
    if (b.dataset.ans !== undefined && ci) { ci.a[QUESTIONS[ci.step].key] = Number(b.dataset.ans); ci.step++; renderCheckin(); return; }
    switch (b.dataset.act) {
      case "checkin": if (!S.checkedToday) openCheckin(); break;
      case "detail": openDetail(b.dataset.k); break;
      case "close": closeSheet(); break;
      case "gotoExp": S.tab = "exp"; closeSheet(); break;
      case "startExp": startExp(b.dataset.k); break;
      case "finishExp": finishExp(); break;
      case "saveEvening": {
        S.eveningSaved = true;
        const n = FACTORS.filter(F => S.evening[F.k]).length;
        toast(n ? "Večer uložený (" + n + " " + (n === 1 ? "stopa" : n < 5 ? "stopy" : "stôp") + "). Ráno sa spýtam, ako sa ti spalo." : "Večer uložený. Pokojný deň, uvidíme ráno.");
        render(); break;
      }
    }
  });
  document.addEventListener("input", e => {
    if (e.target.id === "temp") { S.temp = Number(e.target.value); $("#tempv").textContent = S.temp + " °C"; S.eveningSaved = false; save(); const sv = document.querySelector('[data-act="saveEvening"]'); if (sv) { sv.disabled = false; sv.textContent = "Uložiť večer"; } }
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#sheet").hidden) closeSheet(); });

  if (!load()) initState();
  render();

  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    navigator.serviceWorker.register("sw.js").catch(() => { /* offline režim nie je dostupný */ });
  }
})();
</script>
</body>
</html>
