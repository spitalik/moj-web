<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arkádium · trailer</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:#000;overflow:hidden;}
  body{display:flex;align-items:center;justify-content:center;
       font-family:'DM Sans',system-ui,sans-serif;color:#f0eeff;}

  /* plocha trailera: 16:9 (alebo 9:16), vzdy cela v okne - kvoli nahravaniu */
  #stage{
    position:relative;overflow:hidden;
    width:min(100vw, calc(100vh * 16 / 9));
    height:min(100vh, calc(100vw * 9 / 16));
    background:radial-gradient(ellipse 80% 60% at 50% 0%, #1a1430 0%, #0a0a12 55%, #050507 100%);
    --u:calc((100vw + 100vh) / 200);      /* jednotka, aby vsetko skalovalo s plochou */
  }
  body.vertical #stage{
    width:min(100vw, calc(100vh * 9 / 16));
    height:min(100vh, calc(100vw * 16 / 9));
  }
  #stage::after{            /* jemna mriezka, rovnaka ako na kartickach v appke */
    content:'';position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(-45deg,transparent,transparent 3px,rgba(255,255,255,0.012) 3px,rgba(255,255,255,0.012) 6px);
  }

  .scene{position:absolute;inset:0;display:flex;flex-direction:column;
         align-items:center;justify-content:center;opacity:0;}
  .play .scene{animation-fill-mode:both;animation-timing-function:cubic-bezier(.22,1,.36,1);}

  /* ── typografia ─────────────────────────────────────────────── */
  .wordmark{
    font-family:'Syne',sans-serif;font-weight:800;letter-spacing:-.04em;line-height:.95;
    font-size:calc(var(--u) * 11);
    background:linear-gradient(140deg,#ffffff 22%,rgba(160,140,255,.9) 100%);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  }
  .kicker{font-size:calc(var(--u) * 2.1);font-weight:300;letter-spacing:.42em;
          text-transform:uppercase;color:rgba(240,238,255,.34);}
  .lead{font-size:calc(var(--u) * 3.1);font-weight:300;color:rgba(240,238,255,.62);}
  .huge{font-family:'Syne',sans-serif;font-weight:800;font-size:calc(var(--u) * 16);
        line-height:1;letter-spacing:-.05em;
        background:linear-gradient(120deg,#6ee7ff 0%,#ffffff 45%,#c08cff 100%);
        -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .claim{font-family:'Syne',sans-serif;font-weight:800;font-size:calc(var(--u) * 7.2);
         letter-spacing:-.03em;line-height:1.05;text-align:center;}
  .claim small{display:block;font-family:'DM Sans',sans-serif;font-weight:300;
               font-size:calc(var(--u) * 2.5);letter-spacing:.02em;color:rgba(240,238,255,.45);
               margin-top:calc(var(--u) * 1.2);}

  /* ── 1. logo ────────────────────────────────────────────────── */
  #s1 .wordmark{transform:scale(.88);filter:blur(calc(var(--u) * .5));}
  .play #s1{animation:sceneFade 4.2s .1s;}
  .play #s1 .wordmark{animation:logoIn 1.5s .35s both cubic-bezier(.2,1,.3,1);}
  .play #s1 .kicker{animation:upIn 1.1s 1.15s both cubic-bezier(.2,1,.3,1);}
  @keyframes logoIn{from{opacity:0;transform:scale(.88);filter:blur(calc(var(--u) * .6));}
                    to{opacity:1;transform:scale(1);filter:blur(0);}}
  @keyframes upIn{from{opacity:0;transform:translateY(calc(var(--u) * 1.6));}
                  to{opacity:1;transform:none;}}
  @keyframes sceneFade{0%{opacity:0;}8%{opacity:1;}86%{opacity:1;}100%{opacity:0;}}

  /* ── 2. stena ikon ──────────────────────────────────────────── */
  .play #s2{animation:sceneFade 6.4s 4.0s;}
  #wall{display:grid;grid-template-columns:repeat(9,1fr);gap:calc(var(--u) * 1.1);
        width:86%;transform:perspective(900px) rotateX(9deg);}
  body.vertical #wall{grid-template-columns:repeat(6,1fr);width:92%;}
  .tile{aspect-ratio:1;display:flex;align-items:center;justify-content:center;
        border-radius:calc(var(--u) * 1.5);background:rgba(255,255,255,.035);
        border:1px solid rgba(255,255,255,.07);opacity:0;}
  .tile svg{width:64%;height:64%;}
  .tile .emo{font-size:calc(var(--u) * 3.2);line-height:1;}
  .play .tile{animation:tileIn .75s both cubic-bezier(.2,1.5,.4,1);}
  @keyframes tileIn{from{opacity:0;transform:translateY(calc(var(--u) * 2.4)) scale(.6);}
                    to{opacity:1;transform:none;}}
  /* cislo sedi presne v strede sceny a stenu pod sebou pritmi */
  #count{position:absolute;inset:0;display:flex;flex-direction:column;
         align-items:center;justify-content:center;gap:calc(var(--u)*.6);}
  .play #count{animation:countIn 2.3s 7.4s both;}
  @keyframes countIn{0%{opacity:0;transform:scale(.9);}18%{opacity:1;transform:scale(1);}
                     82%{opacity:1;}100%{opacity:0;}}
  #count .veil{position:absolute;inset:0;
               background:radial-gradient(ellipse 62% 58% at 50% 50%,rgba(5,5,7,.96) 32%,rgba(5,5,7,0) 76%);}
  #count .huge,#count .lead{position:relative;}

  /* ── 3. tvrdenia ────────────────────────────────────────────── */
  .play #s3{animation:sceneFade 5.2s 10.2s;}
  #s3 .claim{position:absolute;opacity:0;}
  .play #s3 .claim{animation:claimIn 1.6s both cubic-bezier(.2,1,.3,1);}
  .play #s3 .claim:nth-child(1){animation-delay:10.4s;}
  .play #s3 .claim:nth-child(2){animation-delay:12.0s;}
  .play #s3 .claim:nth-child(3){animation-delay:13.6s;}
  @keyframes claimIn{0%{opacity:0;transform:translateY(calc(var(--u) * 1.8)) scale(.97);}
                     14%{opacity:1;transform:none;}
                     78%{opacity:1;transform:none;}
                     100%{opacity:0;transform:translateY(calc(var(--u) * -1.2)) scale(.99);}}

  /* ── 4. telefon a kategorie ─────────────────────────────────── */
  .play #s4{animation:sceneFade 5.0s 15.2s;}
  #s4{flex-direction:row;gap:calc(var(--u) * 6);}
  body.vertical #s4{flex-direction:column;gap:calc(var(--u) * 3);}
  .phone{width:calc(var(--u) * 26);aspect-ratio:9/18.5;border-radius:calc(var(--u) * 3.4);
         background:#0a0a12;border:calc(var(--u) * .34) solid rgba(255,255,255,.12);
         box-shadow:0 calc(var(--u)*3) calc(var(--u)*7) rgba(0,0,0,.7);
         padding:calc(var(--u) * 1.2);overflow:hidden;display:flex;flex-direction:column;
         gap:calc(var(--u) * .9);}
  .play .phone{animation:phoneIn 1.3s 15.4s both cubic-bezier(.2,1,.3,1);}
  @keyframes phoneIn{from{opacity:0;transform:translateY(calc(var(--u)*3)) rotate(-3deg);}
                     to{opacity:1;transform:none;}}
  .phone .bar{height:calc(var(--u) * 1.5);border-radius:100px;background:rgba(255,255,255,.07);}
  .phone .chips{display:flex;gap:calc(var(--u) * .5);}
  .phone .chip{flex:1;height:calc(var(--u) * 1.5);border-radius:100px;background:rgba(255,255,255,.05);}
  .phone .chip.on{background:rgba(255,255,255,.16);}
  .phone .card{flex:1;border-radius:calc(var(--u) * 1.5);background:rgba(255,255,255,.045);
               border:1px solid rgba(255,255,255,.07);display:flex;align-items:center;
               justify-content:center;}
  .phone .card svg{width:46%;height:46%;}
  .phone .card .emo{font-size:calc(var(--u) * 2.6);}
  .cats{display:flex;flex-direction:column;gap:calc(var(--u) * 1.15);align-items:flex-start;}
  body.vertical .cats{align-items:center;}
  .cat{font-family:'Syne',sans-serif;font-weight:800;font-size:calc(var(--u) * 4.2);
       letter-spacing:-.02em;color:rgba(240,238,255,.22);opacity:0;}
  .cat b{color:#f0eeff;font-weight:800;}
  .play .cat{animation:catIn 1s both cubic-bezier(.2,1,.3,1);}
  .play .cat:nth-child(1){animation-delay:15.7s;}
  .play .cat:nth-child(2){animation-delay:15.95s;}
  .play .cat:nth-child(3){animation-delay:16.2s;}
  .play .cat:nth-child(4){animation-delay:16.45s;}
  .play .cat:nth-child(5){animation-delay:16.7s;}
  .play .cat:nth-child(6){animation-delay:16.95s;}
  @keyframes catIn{from{opacity:0;transform:translateX(calc(var(--u) * -1.6));}
                   to{opacity:1;transform:none;}}

  /* ── 5. zaver ───────────────────────────────────────────────── */
  .play #s5{animation:sceneFade 4.2s 20.0s;}
  #s5 .wordmark{font-size:calc(var(--u) * 13);}
  .play #s5 .wordmark{animation:logoIn 1.2s 20.2s both cubic-bezier(.2,1,.3,1);}
  .play #s5 .lead{animation:upIn 1s 20.9s both cubic-bezier(.2,1,.3,1);}
  .play #s5 .pill{animation:upIn 1s 21.4s both cubic-bezier(.2,1,.3,1);}
  .pill{margin-top:calc(var(--u) * 2.4);padding:calc(var(--u) * 1.1) calc(var(--u) * 3);
        border-radius:100px;border:1px solid rgba(255,255,255,.18);
        background:rgba(255,255,255,.05);font-size:calc(var(--u) * 2.3);font-weight:500;
        letter-spacing:.02em;}

  /* ── ovladanie (v zazname nie je vidno, zmizne) ─────────────── */
  #hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);
        font-size:12px;color:rgba(240,238,255,.3);letter-spacing:.04em;
        transition:opacity .4s;}
  body.play #hint{opacity:0;}
  #hint b{color:rgba(240,238,255,.55);font-weight:500;}
</style>
</head>

    <div id="wall"></div>
    <div id="count"><div class="veil"></div>
      <div class="huge">110</div>

    <div class="claim" id="p3"></div>

  <div class="scene" id="s4">
    <div class="phone" id="phone"></div>
    <div class="cats" id="cats"></div>
  </div>

  <div class="scene" id="s5">
    <div class="wordmark">Arkádium</div>
    <div class="lead" id="e1"></div>
    <div class="pill" id="e2"></div>
  </div>

</div>

const wall = document.getElementById('wall');
const count = 36;   // 9x4 na sirku, 6x6 na vysku
wall.innerHTML = TILES.slice(0, count).map((t, i) =>
  '<div class="tile" style="animation-delay:' + (4.25 + i * 0.038).toFixed(3) + 's">' + t + '</div>').join('');

// telefon
document.getElementById('phone').innerHTML =
  '<div class="bar"></div>'
  + '<div class="chips"><div class="chip on"></div><div class="chip"></div><div class="chip"></div><div class="chip"></div></div>'
  + PHONE.map(p => '<div class="card">' + p + '</div>').join('');

// kategorie
document.getElementById('cats').innerHTML =
  T.cats.map(c => '<div class="cat"><b>' + c + '</b></div>').join('');

// ── prehravanie: pevna 24-sekundova os, dookola ───────────────────
const stage = document.getElementById('stage');
let timer = 0;
function play() {
  stage.classList.remove('play');
  document.body.classList.remove('play');
  void stage.offsetWidth;            // vynutim restart animacii
  stage.classList.add('play');
  document.body.classList.add('play');
  clearTimeout(timer);
  timer = setTimeout(play, 24400);   // slucka
}
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); play(); }
  if (e.key === 'v' || e.key === 'V') { Q.set('v', Q.get('v') === '1' ? '0' : '1'); location.search = Q; }
  if (e.key === 'e' || e.key === 'E') { Q.set('lang', EN ? 'sk' : 'en'); location.search = Q; }
});
addEventListener('click', play);
play();

// ── ?t=<sekundy>: presne zastavi trailer v danom case ──────────────
// Vdaka tomu sa da kazdy snimok vyrenderovat samostatne a poskladat z nich
// skutocne video (viz tools/render-promo.py).
const SEEK = parseFloat(Q.get('t'));
if (!isNaN(SEEK)) {
  clearTimeout(timer);
  document.getElementById('hint').style.display = 'none';
  const seek = () => {
    document.getAnimations().forEach(a => {
      try { a.currentTime = SEEK * 1000; a.pause(); } catch (e) {}
    });
    window.__frameReady = true;
  };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(seek);
  else seek();
  setTimeout(seek, 300);   // poistka, keby sa pismo nenacitalo
}
</script>
</body>
