<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sand · Arkádium</title>
<link href="../../fonts/fonts.css" rel="stylesheet">
<script src="../../i18n.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#050507;--bg2:#111116;--text:#f0eeff;--muted:rgba(240,238,255,0.38);--dim:rgba(240,238,255,0.22);--border:rgba(255,255,255,0.07);--border-h:rgba(255,255,255,0.14);--s1:#e0b872;--s2:#4aa3d4;}
html,body{background:var(--bg);height:100vh;overflow:hidden;font-family:'DM Sans',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;user-select:none;}
/* Horná lišta aj spodný pás sú jeden celok: plátno začína pod nimi,
   takže sa tlačidlá nikdy neprekryjú s pieskom ani na úzkom displeji. */
#top{position:fixed;top:0;left:0;right:0;z-index:9;display:flex;flex-direction:column;gap:7px;padding:9px 12px 8px;background:linear-gradient(180deg,rgba(5,5,7,.97) 74%,rgba(5,5,7,0));}
.top-bar{display:flex;align-items:center;gap:10px;}
#back-btn{display:flex;align-items:center;gap:7px;background:var(--bg2);border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:100px;text-decoration:none;font-size:11px;font-weight:500;transition:all .18s;flex-shrink:0;}
#back-btn:hover{border-color:var(--border-h);color:var(--text);}
.game-title{font-family:'Syne',sans-serif;font-weight:800;font-size:21px;letter-spacing:-.5px;flex:1;background:linear-gradient(110deg,#fff 22%,var(--s1) 70%,var(--s2) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
#toolbar{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;}
.mat-btn{background:var(--bg2);border:2px solid rgba(255,255,255,0.08);color:var(--muted);padding:5px 10px;border-radius:100px;font-size:11px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;display:flex;align-items:center;gap:4px;}
.mat-btn.active{color:#fff;}
.mat-btn:active{transform:scale(0.95);}
#brush-row{position:fixed;bottom:0;left:0;right:0;z-index:9;display:flex;gap:6px;justify-content:center;align-items:center;padding:8px 12px 9px;background:linear-gradient(0deg,rgba(5,5,7,.97) 74%,rgba(5,5,7,0));}
#lbl-brush{font-size:10px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;color:var(--dim);}
.brush-btn.active{font-weight:600;color:var(--s1);border-color:rgba(224,184,114,.45);}
.brush-btn{background:var(--bg2);border:1px solid var(--border);color:var(--muted);padding:4px 12px;border-radius:100px;font-size:11px;cursor:pointer;transition:all .15s;}
.brush-btn.active,.brush-btn:hover{border-color:rgba(255,255,255,0.2);color:var(--text);}
#clear-btn{background:rgba(255,107,107,0.1);border:1px solid rgba(255,107,107,0.3);color:#ff6b6b;padding:4px 12px;border-radius:100px;font-size:11px;cursor:pointer;}
#c{display:block;position:fixed;left:0;right:0;cursor:crosshair;touch-action:none;}
</style>
</head>
<body>
<div id="top">
  <div class="top-bar">
    <a href="../../index.html" id="back-btn">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      <span id="lbl-back"></span>
    </a>
    <div class="game-title" id="lbl-title"></div>
  </div>
  <div id="toolbar"></div>
</div>
<canvas id="c"></canvas>
<div id="brush-row">
  <span id="lbl-brush"></span>
  <button class="brush-btn active" onclick="setBrush(2)" id="bs-2">S</button>
  <button class="brush-btn" onclick="setBrush(5)" id="bs-5">M</button>
  <button class="brush-btn" onclick="setBrush(9)" id="bs-9">L</button>
  <button id="clear-btn" onclick="clearAll()"></button>
</div>
<script>
document.getElementById('lbl-back').textContent  = t('back');
document.getElementById('lbl-title').textContent = t('sandTitle');
document.getElementById('lbl-brush').textContent = t('sandBrush');
document.getElementById('clear-btn').textContent = t('sandClear');

const MATS = [
  {id:1,nameKey:'sandSand', colors:['#c8a96e','#d4b478','#b89558','#dab96e'],falls:true, liquid:false,flammable:true},
  {id:2,nameKey:'sandWater',colors:['#2980b9','#3498db','#1f6f9e','#4aa3d4'],falls:true, liquid:true, flammable:false},
  {id:3,nameKey:'sandWall', colors:['#555','#666','#4a4a4a','#5e5e5e'],       falls:false,liquid:false,flammable:false},
  {id:4,nameKey:'sandFire', colors:['#ff6b35','#ff4500','#ff8c00','#ffa500'], falls:false,liquid:false,flammable:false},
  {id:5,nameKey:'sandSmoke',colors:['#777','#888','#666','#999'],              falls:false,liquid:false,flammable:false},
  {id:6,nameKey:'sandOil',  colors:['#8B4513','#7a3b0e','#9b5523','#6b3510'], falls:true, liquid:true, flammable:true},
  {id:7,nameKey:'sandLava', colors:['#ff4500','#cc3700','#ff6633','#dd4400'],  falls:true, liquid:true, flammable:false},
  {id:8,nameKey:'sandEraser',colors:null,falls:false,liquid:false},
];

const CELL=4;
const C=document.getElementById('c'), ctx=C.getContext('2d');
const topEl=document.getElementById('top'), botEl=document.getElementById('brush-row');
let COLS,ROWS,grid,colorGrid,drawing=false,material=1,brushSize=2,animId;

// Výšku lišt meriam, nie hádam: materiálov je osem a na úzkom displeji sa
// zalomia do viacerých riadkov, takže pevné číslo by nechalo tlačidlá ležať
// na piesku.
function resize(){
  const TOP_H=Math.ceil(topEl.getBoundingClientRect().height)+2;
  const BOT_H=Math.ceil(botEl.getBoundingClientRect().height)+2;
  const W=window.innerWidth, H=Math.max(120, window.innerHeight-TOP_H-BOT_H);
  C.style.top=TOP_H+'px'; C.style.height=H+'px';
  C.width=W; C.height=H;
  COLS=Math.floor(W/CELL); ROWS=Math.floor(H/CELL);
  grid=new Uint8Array(COLS*ROWS); colorGrid=new Uint8Array(COLS*ROWS);
}

function clearAll(){grid.fill(0);colorGrid.fill(0);}
function idx(c,r){return r*COLS+c;}
function get(c,r){if(c<0||c>=COLS||r<0||r>=ROWS)return -1;return grid[idx(c,r)];}
function set(c,r,m,col){if(c<0||c>=COLS||r<0||r>=ROWS)return;grid[idx(c,r)]=m;if(col!==undefined)colorGrid[idx(c,r)]=col;}

function place(px,py){
  const c=Math.floor(px/CELL), r=Math.floor(py/CELL);
  for(let dr=-brushSize;dr<=brushSize;dr++){
    for(let dc=-brushSize;dc<=brushSize;dc++){
      if(dc*dc+dr*dr>brushSize*brushSize)continue;
      if(material===8){set(c+dc,r+dr,0,0);continue;}
      if(get(c+dc,r+dr)===0){
        const mat=MATS[material-1];
        set(c+dc,r+dr,material,Math.floor(Math.random()*mat.colors.length));
      }
    }
  }
}

function update(){
  for(let r=ROWS-1;r>=0;r--){
    const ltr=Math.random()<0.5;
    for(let ci=0;ci<COLS;ci++){
      const c=ltr?ci:COLS-1-ci;
      const m=get(c,r);if(!m)continue;
      const mat=MATS[m-1];
      if(m===4){
        if(r>0&&!get(c,r-1)&&Math.random()<0.12)set(c,r-1,5,Math.floor(Math.random()*4));
        for(const[dc,dr]of[[-1,0],[1,0],[0,-1],[0,1]]){
          const n=get(c+dc,r+dr);
          if(n&&n!==4&&n!==5&&MATS[n-1]?.flammable&&Math.random()<0.03)set(c+dc,r+dr,4,Math.floor(Math.random()*4));
        }
        if(Math.random()<0.008)set(c,r,0,0);
        continue;
      }
      if(m===5){
        if(r>0&&!get(c,r-1)){set(c,r-1,5,colorGrid[idx(c,r)]);set(c,r,0,0);}
        else if(Math.random()<0.004)set(c,r,0,0);
        continue;
      }
      if(!mat.falls&&!mat.liquid)continue;
      if(r<ROWS-1){
        const below=get(c,r+1);
        if(below===0){set(c,r+1,m,colorGrid[idx(c,r)]);set(c,r,0,0);continue;}
        const dir=Math.random()<0.5?1:-1;
        if(mat.liquid){
          if(!get(c+dir,r)){set(c+dir,r,m,colorGrid[idx(c,r)]);set(c,r,0,0);continue;}
          if(!get(c-dir,r)){set(c-dir,r,m,colorGrid[idx(c,r)]);set(c,r,0,0);continue;}
        }else{
          if(!get(c+dir,r+1)){set(c+dir,r+1,m,colorGrid[idx(c,r)]);set(c,r,0,0);continue;}
          if(!get(c-dir,r+1)){set(c-dir,r+1,m,colorGrid[idx(c,r)]);set(c,r,0,0);continue;}
        }
      }
      if(m===7){
        for(const[dc,dr]of[[-1,0],[1,0],[0,-1],[0,1]]){
          if(get(c+dc,r+dr)===2){set(c,r,3,0);set(c+dc,r+dr,5,0);break;}
        }
      }
    }
  }
}

const hexCache={};
function hexRGB(hex){
  if(hexCache[hex])return hexCache[hex];
  return hexCache[hex]=[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];
}

function draw(){
  const W=C.width,H=C.height;
  const img=ctx.createImageData(W,H);
  const d=img.data;
  for(let i=0;i<d.length;i+=4){d[i]=6;d[i+1]=6;d[i+2]=14;d[i+3]=255;}
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const m=get(c,r);if(!m)continue;
      const mat=MATS[m-1];if(!mat.colors)continue;
      const [R,G,B]=hexRGB(mat.colors[colorGrid[idx(c,r)]%mat.colors.length]);
      for(let dy=0;dy<CELL;dy++){
        for(let dx=0;dx<CELL;dx++){
          const p=((r*CELL+dy)*W+(c*CELL+dx))*4;
          if(p<0||p+3>=d.length)continue;
          d[p]=R;d[p+1]=G;d[p+2]=B;d[p+3]=255;
        }
      }
    }
  }
  ctx.putImageData(img,0,0);
}

function loop(){update();draw();animId=requestAnimationFrame(loop);}

function setBrush(s){
  brushSize=s;
  ['bs-2','bs-5','bs-9'].forEach(id=>document.getElementById(id)?.classList.remove('active'));
  document.getElementById(`bs-${s}`)?.classList.add('active');
}

const toolbar=document.getElementById('toolbar');
MATS.forEach(mat=>{
  const btn=document.createElement('button');
  btn.className='mat-btn'+(mat.id===1?' active':'');
  const col=mat.colors?mat.colors[0]:'#888';
  btn.style.borderColor=mat.id===1?col:'rgba(255,255,255,0.08)';
  btn.innerHTML=mat.colors
    ?`<span style="width:9px;height:9px;border-radius:50%;background:${col};display:inline-block;flex-shrink:0"></span>${t(mat.nameKey)}`
    :`✕ ${t(mat.nameKey)}`;
  btn.onclick=()=>{
    material=mat.id;
    toolbar.querySelectorAll('.mat-btn').forEach(b=>{b.classList.remove('active');b.style.borderColor='rgba(255,255,255,0.08)';});
    btn.classList.add('active');btn.style.borderColor=col;
  };
  toolbar.appendChild(btn);
});

function getPos(e){
  const rect=C.getBoundingClientRect();
  const src=e.touches?e.touches[0]:e.changedTouches?e.changedTouches[0]:e;
  return{x:src.clientX-rect.left,y:src.clientY-rect.top};
}

C.addEventListener('mousedown', e=>{drawing=true;const p=getPos(e);place(p.x,p.y);});
C.addEventListener('mousemove', e=>{if(drawing){const p=getPos(e);place(p.x,p.y);}});
C.addEventListener('mouseup',   ()=>drawing=false);
C.addEventListener('mouseleave',()=>drawing=false);
C.addEventListener('touchstart',e=>{e.preventDefault();drawing=true;const p=getPos(e);place(p.x,p.y);},{passive:false});
C.addEventListener('touchmove', e=>{e.preventDefault();if(drawing){const p=getPos(e);place(p.x,p.y);}},{passive:false});
C.addEventListener('touchend',  ()=>drawing=false,{passive:false});

function relayout(){cancelAnimationFrame(animId);resize();loop();}
resize();
window.addEventListener('resize',relayout);
window.addEventListener('orientationchange',relayout);
// Syne dorazí až po prvom rozložení stránky a titulok tým o kúsok narastie.
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(relayout);
loop();
</script>
</body>
</html>
