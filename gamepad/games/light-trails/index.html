<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Light Trails · GamePad</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<script src="../../i18n.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#03080e;--text:#e6faff;--muted:rgba(230,250,255,0.42);--dim:rgba(230,250,255,0.18);
  --border:rgba(255,255,255,0.09);--border-h:rgba(255,255,255,0.18);
  --c:#22d3ee;--c2:#ff7ad9;--gold:#ffd166;--danger:#ff5d6d;
}
html,body{background:var(--bg);height:100%;font-family:'DM Sans',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;user-select:none;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none;}
button,a{touch-action:manipulation;font-family:'DM Sans',sans-serif;}

#back-btn{position:fixed;top:14px;left:14px;z-index:60;display:flex;align-items:center;gap:7px;background:rgba(5,12,20,0.72);backdrop-filter:blur(8px);border:1px solid var(--border);color:var(--muted);padding:7px 14px;border-radius:100px;text-decoration:none;font-size:12px;font-weight:500;transition:border-color .18s,color .18s;}
#back-btn:hover,#back-btn:active{border-color:var(--border-h);color:var(--text);}
@media(max-width:520px){#back-btn{top:9px;left:9px;padding:6px 11px;font-size:11px;}}

#hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:12;display:none;align-items:center;gap:7px;pointer-events:none;}
#hud.show{display:flex;}
.pill{display:flex;align-items:center;gap:8px;padding:5px 12px;border-radius:100px;background:rgba(5,12,20,0.6);backdrop-filter:blur(8px);border:1px solid var(--border);font-size:9px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;color:var(--dim);white-space:nowrap;}
.pill b{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;letter-spacing:0;font-variant-numeric:tabular-nums;color:var(--c);transition:transform .18s;}
.pill.wins b{color:var(--text);}
.pill.best b{color:var(--gold);}
.pill.best.record{border-color:rgba(255,209,102,.45);}
.pill b.bump{transform:scale(1.3);}
.dots{display:flex;gap:5px;align-items:center;}
.dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,0.14);}
.dot.me{background:var(--c);box-shadow:0 0 8px rgba(34,211,238,.9);}
.dot.foe{background:var(--c2);box-shadow:0 0 8px rgba(255,122,217,.9);}
.vs{font-size:9px;color:var(--dim);}
@media(max-width:620px){#hud{left:auto;right:56px;transform:none;gap:5px;}.pill span{display:none;}.pill{padding:4px 10px;}.pill b{font-size:15px;}.pill.best{display:none;}}

#pause-btn{position:fixed;top:14px;right:14px;z-index:60;display:none;align-items:center;justify-content:center;width:36px;height:36px;background:rgba(5,12,20,0.7);backdrop-filter:blur(8px);border:1px solid var(--border);color:var(--muted);border-radius:50%;cursor:pointer;}
#pause-btn.show{display:flex;}
#pause-btn:hover{border-color:var(--border-h);color:var(--text);}

#pad{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:14;display:none;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,48px);gap:7px;}
body.touch #pad.show{display:grid;}
#pad button{background:linear-gradient(160deg,rgba(255,255,255,0.08),rgba(255,255,255,0.02));border:1px solid var(--border);color:var(--muted);border-radius:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .1s;}
#pad button svg{width:19px;height:19px;}
#pad button:active{background:rgba(34,211,238,0.2);border-color:rgba(34,211,238,0.5);color:var(--c);transform:scale(.94);}
#pad .up{grid-column:2;grid-row:1;}
#pad .left{grid-column:1;grid-row:2;}
#pad .down{grid-column:2;grid-row:2;}
#pad .right{grid-column:3;grid-row:2;}

#overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(ellipse at center,rgba(5,12,20,0.78) 0%,rgba(2,5,9,0.95) 78%);backdrop-filter:blur(6px);}
#overlay.hide{display:none;}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:11px;width:100%;max-width:334px;padding:26px 24px 24px;border-radius:24px;background:linear-gradient(165deg,rgba(255,255,255,0.06),rgba(255,255,255,0.015));border:1px solid var(--border-h);box-shadow:0 30px 70px -28px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.07);animation:pop .34s cubic-bezier(.2,1.4,.4,1);}
@keyframes pop{from{transform:scale(.9) translateY(8px);opacity:0;}to{transform:none;opacity:1;}}
.card::before{content:'';position:absolute;inset:-1px;border-radius:24px;padding:1px;background:linear-gradient(120deg,rgba(34,211,238,.5),transparent 42%,transparent 58%,rgba(255,122,217,.5));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;}
.emoji{font-size:34px;line-height:1;filter:drop-shadow(0 6px 16px rgba(34,211,238,.4));}
.ttl{font-family:'Syne',sans-serif;font-weight:800;font-size:24px;letter-spacing:-.5px;text-align:center;background:linear-gradient(110deg,var(--c) 5%,#fff 52%,var(--c2) 95%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
#result{display:none;flex-direction:column;align-items:center;gap:1px;}
#result.show{display:flex;}
#res-lbl{font-size:9px;letter-spacing:2.2px;text-transform:uppercase;color:var(--dim);}
#res-score{font-family:'Syne',sans-serif;font-weight:800;font-size:48px;line-height:1.05;letter-spacing:-2px;color:var(--c);text-shadow:0 0 30px rgba(34,211,238,.45);}
#res-note{font-size:11.5px;font-weight:600;color:var(--muted);}
#res-note.record{color:var(--gold);}
#ov-stats{display:none;width:100%;grid-template-columns:1fr 1fr;gap:7px;}
#ov-stats.show{display:grid;}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:14px;background:rgba(255,255,255,0.04);border:1px solid var(--border);}
.stat i{font-size:8px;font-style:normal;letter-spacing:1.3px;text-transform:uppercase;color:var(--dim);text-align:center;}
.stat b{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;color:var(--c2);white-space:nowrap;}
.seg{display:flex;gap:3px;background:rgba(255,255,255,0.04);border:1px solid var(--border);padding:3px;border-radius:100px;}
.seg button{background:transparent;border:none;color:var(--muted);padding:6px 15px;border-radius:100px;font-size:11.5px;font-weight:600;cursor:pointer;transition:color .16s,background .16s;}
.seg button:hover{color:var(--text);}
.seg button.active{background:rgba(34,211,238,0.16);color:#c3f5ff;box-shadow:inset 0 0 0 1px rgba(34,211,238,0.42);}
.lbl{font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);}
.hint{font-size:11.5px;line-height:1.55;color:var(--muted);text-align:center;}
.play-btn{margin-top:3px;width:100%;padding:13px 30px;border-radius:100px;border:1px solid rgba(34,211,238,.5);background:linear-gradient(180deg,rgba(34,211,238,.24),rgba(34,211,238,.1));color:#cdf6ff;font-size:14px;font-weight:600;cursor:pointer;transition:all .18s;}
.play-btn:hover{background:linear-gradient(180deg,rgba(34,211,238,.34),rgba(34,211,238,.16));color:#fff;box-shadow:0 0 24px -6px rgba(34,211,238,.5);}
.play-btn:active{transform:translateY(1px);}
@media(max-height:640px){.card{gap:8px;padding:18px 20px;}.emoji{display:none;}.ttl{font-size:20px;}#res-score{font-size:38px;}}
@media (max-height:820px){#overlay{align-items:flex-start !important;overflow-y:auto !important;}}
</style>
</head>
<body>
<a href="../../index.html" id="back-btn">
  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
  <span id="lbl-back"></span>
</a>

<canvas id="c"></canvas>

<div id="hud">
  <div class="pill"><span id="lbl-round"></span><b id="hud-round">1</b></div>
  <div class="pill wins"><div class="dots" id="wins-dots"></div></div>
  <div class="pill"><span id="lbl-score"></span><b id="hud-score">0</b></div>
  <div class="pill best" id="best-pill"><span id="lbl-best"></span><b id="hud-best">0</b></div>
</div>

<button id="pause-btn" aria-label="pause">
  <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1.4"/><rect x="14" y="4" width="4" height="16" rx="1.4"/></svg>
</button>

<div id="pad">
  <button class="up" data-dir="up" aria-label="up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  <button class="left" data-dir="left" aria-label="left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg></button>
  <button class="down" data-dir="down" aria-label="down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg></button>
  <button class="right" data-dir="right" aria-label="right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
</div>

<div id="overlay">
  <div class="card">
    <div id="brand"><div class="emoji">🏍️</div></div>
    <div class="ttl" id="ov-title"></div>
    <div id="result">
      <div id="res-lbl"></div>
      <div id="res-score">0</div>
      <div id="res-note"></div>
    </div>
    <div id="ov-stats">
      <div class="stat"><i id="lbl-s-wins"></i><b id="st-wins">0 : 0</b></div>
      <div class="stat"><i id="lbl-s-best"></i><b id="st-best">0</b></div>
    </div>
    <div class="lbl" id="lbl-diff"></div>
    <div class="seg" id="diff-row"></div>
    <div class="hint" id="ov-hint"></div>
    <button class="play-btn" id="ov-play"></button>
  </div>
</div>

<script>
// ── nastavenia ──────────────────────────────────────────────────────────
const DIFFS = [
  {key:'diffEasy',   step:0.115, blunder:0.22, look:90},
  {key:'diffMedium', step:0.082, blunder:0.08, look:220},
  {key:'diffHard',   step:0.062, blunder:0.02, look:420},
];
let diffIdx = 1;
const bestKey = () => 'lighttrails_best_' + diffIdx;
let best = 0;
const TARGET = 3;                      // kolo sa vyhrava na tri vitazstva
const DIRS = {up:[-1,0], down:[1,0], left:[0,-1], right:[0,1]};
const OPP = {up:'down', down:'up', left:'right', right:'left'};

const ST = {MENU:0, COUNT:1, PLAY:2, PAUSE:3, OVER:4, ROUND:5};
let state = ST.MENU;

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, CS = 12, COLS = 40, ROWS = 30, OX = 0, OY = 0;

let grid = [], me = null, foe = null;
let round = 1, wins = 0, losses = 0, score = 0;
let queued = null, acc = 0, cdLeft = 0, roundWait = 0, banner = 0, bannerTxt = '', bannerRgb = '34,211,238';
let parts = [], flash = 0, tPrev = 0, tSec = 0;
const isTouch = window.matchMedia('(pointer: coarse)').matches;

function applyLang() {
  document.getElementById('lbl-back').textContent  = t('back');
  document.getElementById('lbl-round').textContent = t('uiRound');
  document.getElementById('lbl-score').textContent = t('uiScore');
  document.getElementById('lbl-best').textContent  = t('uiBest');
  document.getElementById('lbl-s-wins').textContent = t('ltrWins');
  document.getElementById('lbl-s-best').textContent = t('uiBest');
  document.getElementById('res-lbl').textContent   = t('uiScore');
  document.getElementById('lbl-diff').textContent  = t('uiDifficulty');
}
function rnd(a, b) { return a + Math.random() * (b - a); }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
const D = () => DIFFS[diffIdx];
const blocked = (r, c) => r < 0 || r >= ROWS || c < 0 || c >= COLS || grid[r][c] !== 0;

// ── arena sa prizposobi obrazovke ───────────────────────────────────────
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth || 360;
  H = window.innerHeight || 640;
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const top = (W < 620 ? 58 : 52) + 22;
  const bot = (isTouch ? 130 : 24);
  CS = clamp(Math.round(Math.min(W, H) / 46), 9, 20);
  COLS = Math.max(18, Math.floor((W - 16) / CS));
  ROWS = Math.max(14, Math.floor((H - top - bot) / CS));
  OX = Math.round((W - COLS * CS) / 2);
  OY = Math.round(top + (H - top - bot - ROWS * CS) / 2);
}
window.addEventListener('resize', () => { resize(); if (state === ST.MENU) newMatch(true); });
window.addEventListener('orientationchange', () => setTimeout(() => { resize(); if (state === ST.MENU) newMatch(true); }, 250));

// ── kolo ────────────────────────────────────────────────────────────────
function startRound() {
  grid = Array.from({length: ROWS}, () => new Array(COLS).fill(0));
  const mid = ROWS >> 1;
  me = {r: mid, c: Math.max(3, Math.round(COLS * 0.14)), dir: 'right', alive: true};
  foe = {r: mid, c: Math.min(COLS - 4, Math.round(COLS * 0.86)), dir: 'left', alive: true};
  grid[me.r][me.c] = 1;
  grid[foe.r][foe.c] = 2;
  queued = null; acc = 0; roundWait = 0;
  parts = []; flash = 0;
  banner = 1.3;
  bannerTxt = t('ltrRoundStart', {n: round});
  bannerRgb = '34,211,238';
  cdLeft = 1.6;
  state = ST.COUNT;
}
// kolko volneho miesta by cyklu zostalo - zaplavove hladanie s hornym limitom
function room(r, c, cap) {
  if (blocked(r, c)) return 0;
  const seen = new Set([r * COLS + c]);
  const q = [[r, c]];
  let n = 0;
  while (q.length && n < cap) {
    const [cr, cc] = q.shift();
    n++;
    for (const [dr, dc] of Object.values(DIRS)) {
      const nr = cr + dr, nc = cc + dc;
      const k = nr * COLS + nc;
      if (blocked(nr, nc) || seen.has(k)) continue;
      seen.add(k); q.push([nr, nc]);
    }
  }
  return n;
}
function aiChoose() {
  const d = D();
  const opts = Object.keys(DIRS).filter(k => k !== OPP[foe.dir]);
  const scored = opts.map(k => {
    const [dr, dc] = DIRS[k];
    const nr = foe.r + dr, nc = foe.c + dc;
    if (blocked(nr, nc)) return {k, v: -1};
    let v = room(nr, nc, d.look);
    v += 6 - (Math.abs(nr - me.r) + Math.abs(nc - me.c)) * 0.08;
    return {k, v};
  }).filter(x => x.v >= 0);
  if (!scored.length) return foe.dir;
  if (Math.random() < d.blunder) return scored[Math.floor(Math.random() * scored.length)].k;
  scored.sort((a, b) => b.v - a.v);
  return scored[0].k;
}
function stepCycles() {
  if (queued && queued !== OPP[me.dir]) me.dir = queued;
  queued = null;
  foe.dir = aiChoose();
  const [mr, mc] = DIRS[me.dir], [fr, fc] = DIRS[foe.dir];
  const mTo = [me.r + mr, me.c + mc], fTo = [foe.r + fr, foe.c + fc];
  const mDead = blocked(mTo[0], mTo[1]);
  const fDead = blocked(fTo[0], fTo[1]);
  const headOn = mTo[0] === fTo[0] && mTo[1] === fTo[1];
  if (mDead || fDead || headOn) {
    me.alive = !(mDead || headOn);
    foe.alive = !(fDead || headOn);
    if (!me.alive) burst(me.c, me.r, '34,211,238');
    if (!foe.alive) burst(foe.c, foe.r, '255,122,217');
    flash = 0.3;
    endRound();
    return;
  }
  me.r = mTo[0]; me.c = mTo[1]; grid[me.r][me.c] = 1;
  foe.r = fTo[0]; foe.c = fTo[1]; grid[foe.r][foe.c] = 2;
  score += 1;
  syncHud();
}
function burst(c, r, rgb) {
  for (let i = 0; i < 26; i++) {
    const a = rnd(0, 6.2832), sp = rnd(30, 210);
    parts.push({x: OX + (c + 0.5) * CS, y: OY + (r + 0.5) * CS, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rnd(0.3, 0.8), max: 0.8, rgb});
  }
}
function endRound() {
  state = ST.ROUND;
  roundWait = 1.5;
  if (me.alive && !foe.alive) { wins++; score += 150; banner = 1.4; bannerTxt = t('ltrWon'); bannerRgb = '34,211,238'; }
  else if (!me.alive && foe.alive) { losses++; banner = 1.4; bannerTxt = t('ltrLost'); bannerRgb = '255,122,217'; }
  else { banner = 1.4; bannerTxt = t('uiDraw'); bannerRgb = '255,209,102'; }
  syncHud();
}
function nextRound() {
  if (wins >= TARGET || losses >= TARGET) { finish(); return; }
  round++;
  startRound();
  syncHud();
}
function finish() {
  state = ST.OVER;
  if (wins >= TARGET) score += 300;
  const rec = score > best;
  if (rec) { best = score; try { localStorage.setItem(bestKey(), best); } catch (e) {} }
  document.getElementById('res-score').textContent = score;
  const note = document.getElementById('res-note');
  note.textContent = rec ? t('uiNewRecord') : t('uiBest') + ' ' + best;
  note.classList.toggle('record', rec);
  document.getElementById('st-wins').textContent = wins + ' : ' + losses;
  document.getElementById('st-best').textContent = best;
  document.getElementById('ov-title').textContent = wins >= TARGET ? t('uiYouWin') : t('uiYouLose');
  showCard('over');
  setHud('hud-best', best);
  document.getElementById('best-pill').classList.toggle('record', rec);
}
function showCard(mode) {
  if (mode !== 'over') document.getElementById('ov-title').textContent = t('ltrTitle');
  document.getElementById('brand').style.display = mode === 'over' ? 'none' : '';
  document.getElementById('result').classList.toggle('show', mode === 'over');
  document.getElementById('ov-stats').classList.toggle('show', mode === 'over');
  document.getElementById('ov-hint').textContent = t('ltrRules');
  document.getElementById('ov-play').textContent = mode === 'over' ? t('uiPlayAgain') : t('uiStart');
  document.getElementById('overlay').classList.remove('hide');
  document.getElementById('hud').classList.remove('show');
  document.getElementById('pause-btn').classList.remove('show');
  document.getElementById('pad').classList.remove('show');
}
function newMatch(quiet) {
  resize();
  round = 1; wins = 0; losses = 0; score = 0;
  loadBest();
  startRound();
  if (quiet) { state = ST.MENU; return; }
  document.getElementById('overlay').classList.add('hide');
  document.getElementById('hud').classList.add('show');
  document.getElementById('pause-btn').classList.add('show');
  document.getElementById('pad').classList.add('show');
  syncHud(true);
}
function togglePause() {
  if (state === ST.PLAY) state = ST.PAUSE;
  else if (state === ST.PAUSE) { cdLeft = 1.2; state = ST.COUNT; }
}

// ── HUD ─────────────────────────────────────────────────────────────────
const hudVal = {};
function setHud(id, v) {
  if (hudVal[id] === v) return;
  hudVal[id] = v;
  const el = document.getElementById(id);
  el.textContent = v;
  el.classList.remove('bump');
  void el.offsetWidth;
  el.classList.add('bump');
  setTimeout(() => el.classList.remove('bump'), 180);
}
function syncHud(force) {
  setHud('hud-round', round);
  setHud('hud-score', score);
  const box = document.getElementById('wins-dots');
  if (box.children.length !== TARGET * 2 + 1) {
    box.textContent = '';
    for (let i = 0; i < TARGET; i++) { const d = document.createElement('div'); d.className = 'dot'; box.appendChild(d); }
    const vs = document.createElement('span'); vs.className = 'vs'; vs.textContent = ':'; box.appendChild(vs);
    for (let i = 0; i < TARGET; i++) { const d = document.createElement('div'); d.className = 'dot'; box.appendChild(d); }
  }
  const kids = [...box.children];
  for (let i = 0; i < TARGET; i++) kids[i].className = 'dot' + (i < wins ? ' me' : '');
  for (let i = 0; i < TARGET; i++) kids[TARGET + 1 + i].className = 'dot' + (i < losses ? ' foe' : '');
  if (force) setHud('hud-best', best);
}
function loadBest() {
  best = +(localStorage.getItem(bestKey()) || 0);
  setHud('hud-best', best);
  document.getElementById('best-pill').classList.remove('record');
}

// ── update ──────────────────────────────────────────────────────────────
function update(dt) {
  tSec += dt;
  for (const p of parts) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  if (parts.length) parts = parts.filter(p => p.life > 0);
  if (flash > 0) flash = Math.max(0, flash - dt * 2.6);
  if (banner > 0) banner = Math.max(0, banner - dt);

  if (state === ST.COUNT) {
    cdLeft -= dt;
    if (cdLeft <= 0) state = ST.PLAY;
    return;
  }
  if (state === ST.ROUND) {
    roundWait -= dt;
    if (roundWait <= 0) nextRound();
    return;
  }
  if (state !== ST.PLAY) return;

  // tempo sa s kolami zrychluje
  const stepEvery = Math.max(0.035, D().step - (round - 1) * 0.006);
  acc += dt;
  let guard = 0;
  while (acc >= stepEvery && state === ST.PLAY && guard++ < 8) {
    acc -= stepEvery;
    stepCycles();
  }
}

// ── kreslenie ───────────────────────────────────────────────────────────
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const g = ctx.createRadialGradient(W / 2, H / 2, 10, W / 2, H / 2, Math.max(W, H) * 0.75);
  g.addColorStop(0, '#071a26');
  g.addColorStop(1, '#02060b');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // mriezka arény
  ctx.strokeStyle = 'rgba(34,211,238,0.07)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let c = 0; c <= COLS; c++) { ctx.moveTo(OX + c * CS, OY); ctx.lineTo(OX + c * CS, OY + ROWS * CS); }
  for (let r = 0; r <= ROWS; r++) { ctx.moveTo(OX, OY + r * CS); ctx.lineTo(OX + COLS * CS, OY + r * CS); }
  ctx.stroke();
  // ramec
  ctx.strokeStyle = 'rgba(34,211,238,0.5)';
  ctx.lineWidth = 2;
  ctx.shadowColor = 'rgba(34,211,238,0.6)';
  ctx.shadowBlur = 14;
  ctx.strokeRect(OX - 1, OY - 1, COLS * CS + 2, ROWS * CS + 2);
  ctx.shadowBlur = 0;

  // stopy
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const v = grid[r] && grid[r][c];
    if (!v) continue;
    const x = OX + c * CS, y = OY + r * CS;
    ctx.fillStyle = v === 1 ? 'rgba(34,211,238,0.85)' : 'rgba(255,122,217,0.85)';
    ctx.shadowColor = v === 1 ? 'rgba(34,211,238,0.8)' : 'rgba(255,122,217,0.8)';
    ctx.shadowBlur = CS * 0.5;
    ctx.fillRect(x + 1, y + 1, CS - 2, CS - 2);
    ctx.shadowBlur = 0;
  }

  // hlavy
  for (const [e, rgb] of [[me, '34,211,238'], [foe, '255,122,217']]) {
    if (!e) continue;
    const x = OX + (e.c + 0.5) * CS, y = OY + (e.r + 0.5) * CS;
    ctx.save();
    ctx.shadowColor = 'rgba(' + rgb + ',1)';
    ctx.shadowBlur = CS * 1.2;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(x, y, CS * 0.45, 0, 6.2832);
    ctx.fill();
    ctx.restore();
    // svetelny kuzel dopredu
    const [dr, dc] = DIRS[e.dir];
    const lg = ctx.createLinearGradient(x, y, x + dc * CS * 5, y + dr * CS * 5);
    lg.addColorStop(0, 'rgba(' + rgb + ',0.4)');
    lg.addColorStop(1, 'rgba(' + rgb + ',0)');
    ctx.fillStyle = lg;
    ctx.beginPath();
    ctx.moveTo(x - dr * CS * 0.5, y - dc * CS * 0.5);
    ctx.lineTo(x + dr * CS * 0.5, y + dc * CS * 0.5);
    ctx.lineTo(x + dc * CS * 5 + dr * CS * 1.6, y + dr * CS * 5 + dc * CS * 1.6);
    ctx.lineTo(x + dc * CS * 5 - dr * CS * 1.6, y + dr * CS * 5 - dc * CS * 1.6);
    ctx.closePath();
    ctx.fill();
  }

  for (const p of parts) {
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = 'rgb(' + p.rgb + ')';
    ctx.beginPath();
    ctx.arc(p.x, p.y, CS * 0.2, 0, 6.2832);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if (state === ST.COUNT && cdLeft > 0) {
    const n = Math.ceil(cdLeft);
    const fr = 1 - (cdLeft - Math.floor(cdLeft));
    ctx.globalAlpha = clamp(1.15 - fr, 0.15, 1);
    ctx.font = '800 ' + Math.round(Math.min(W, H) * 0.16) + "px 'Syne',sans-serif";
    ctx.fillStyle = '#e6faff';
    ctx.shadowColor = 'rgba(34,211,238,0.8)';
    ctx.shadowBlur = 24;
    ctx.fillText(String(n), W / 2, H / 2);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }
  if (banner > 0) {
    ctx.globalAlpha = clamp(Math.min(banner / 0.3, 1), 0, 1);
    ctx.font = '800 ' + Math.round(Math.min(W, H) * 0.062) + "px 'Syne',sans-serif";
    ctx.fillStyle = 'rgb(' + bannerRgb + ')';
    ctx.shadowColor = 'rgba(' + bannerRgb + ',0.7)';
    ctx.shadowBlur = 20;
    ctx.fillText(bannerTxt, W / 2, OY + ROWS * CS * 0.22);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }
  if (state === ST.PAUSE) {
    ctx.fillStyle = 'rgba(2,5,9,0.62)';
    ctx.fillRect(0, 0, W, H);
    ctx.font = '800 ' + Math.round(Math.min(W, H) * 0.07) + "px 'Syne',sans-serif";
    ctx.fillStyle = '#e6faff';
    ctx.fillText(t('uiPaused'), W / 2, H / 2);
  }
  if (flash > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + (flash * 0.35) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

function frame(ts) {
  requestAnimationFrame(frame);
  const dt = tPrev ? Math.min(0.05, (ts - tPrev) / 1000) : 0;
  tPrev = ts;
  update(dt);
  draw();
}

// ── vstup ───────────────────────────────────────────────────────────────
const KEYS = {ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
  KeyW:'up', KeyS:'down', KeyA:'left', KeyD:'right'};
document.addEventListener('keydown', e => {
  if (e.code === 'Escape' || e.code === 'KeyP') {
    e.preventDefault();
    if (state === ST.PLAY || state === ST.PAUSE) togglePause();
    return;
  }
  if ((state === ST.MENU || state === ST.OVER) && (e.code === 'Enter' || e.code === 'Space')) {
    e.preventDefault(); newMatch(); return;
  }
  const d = KEYS[e.code];
  if (!d) return;
  e.preventDefault();
  if (state === ST.PAUSE) { cdLeft = 1.2; state = ST.COUNT; return; }
  queued = d;
});
document.querySelectorAll('#pad button').forEach(b => {
  b.addEventListener('pointerdown', e => { e.preventDefault(); queued = b.dataset.dir; }, {passive: false});
});
let sw = null;
cv.addEventListener('pointerdown', e => { sw = [e.clientX, e.clientY]; if (state === ST.PAUSE) { cdLeft = 1.2; state = ST.COUNT; } }, {passive: true});
cv.addEventListener('pointerup', e => {
  if (!sw) return;
  const dx = e.clientX - sw[0], dy = e.clientY - sw[1];
  sw = null;
  if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
  queued = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
});
document.getElementById('pause-btn').addEventListener('click', togglePause);
window.addEventListener('blur', () => { if (state === ST.PLAY) state = ST.PAUSE; });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === ST.PLAY) state = ST.PAUSE; });

// ── obtiaznost ──────────────────────────────────────────────────────────
const row = document.getElementById('diff-row');
DIFFS.forEach((d, i) => {
  const b = document.createElement('button');
  b.textContent = t(d.key);
  b.className = i === diffIdx ? 'active' : '';
  b.addEventListener('click', () => {
    diffIdx = i;
    [...row.children].forEach((c, j) => c.className = j === i ? 'active' : '');
    loadBest();
    if (state === ST.OVER) document.getElementById('res-note').textContent = t('uiBest') + ' ' + best;
  });
  row.appendChild(b);
});
document.getElementById('ov-play').addEventListener('click', () => newMatch());

applyLang();
if (isTouch) document.body.classList.add('touch');
resize();
loadBest();
newMatch(true);
showCard('menu');
requestAnimationFrame(frame);
</script>
</body>
