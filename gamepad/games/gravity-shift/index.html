<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Gravity Shift · GamePad</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <script src="../../i18n.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000010;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #orientation-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 11px;
            letter-spacing: 1px;
            pointer-events: none;
            transition: opacity 0.5s;
            text-align: center;
        }

        /* ===== UI OVERLAYS (start, gameover) ===== */
        .ui-overlay {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 20, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            color: #fff;
            padding: 30px;
            text-align: center;
            z-index: 60;
            pointer-events: none;
        }
        .ui-overlay.active {
            display: flex;
            pointer-events: auto;
        }
        .ui-overlay h1 {
            font-size: clamp(32px, 8vw, 56px);
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 60px rgba(0, 180, 255, 0.3);
            margin-bottom: 14px;
        }
        .ui-overlay .sub {
            font-size: clamp(14px, 3vw, 20px);
            color: #88bbff;
            font-weight: 300;
            margin-bottom: 30px;
        }
        .ui-overlay .score-display {
            font-size: clamp(16px, 3.5vw, 26px);
            color: #cce4ff;
            margin-bottom: 6px;
        }
        .ui-overlay .score-display span {
            color: #ffd866;
            font-weight: 700;
        }
        .ui-overlay .high-score {
            font-size: clamp(13px, 2.5vw, 18px);
            color: #88aaff;
            margin-bottom: 30px;
        }
        .ui-overlay .high-score span {
            color: #ffb347;
            font-weight: 700;
        }
        .game-over-title {
            font-size: clamp(36px, 9vw, 60px);
            font-weight: 900;
            color: #ff4466;
            text-shadow: 0 0 60px rgba(255, 40, 80, 0.4);
            margin-bottom: 14px;
        }
        .btn {
            padding: 16px 48px;
            font-size: clamp(16px, 3vw, 22px);
            font-weight: 700;
            border: none;
            border-radius: 60px;
            background: linear-gradient(135deg, #00b4ff, #6a2be0);
            color: #fff;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 8px 32px rgba(0, 100, 255, 0.35);
            letter-spacing: 1px;
            touch-action: manipulation;
            pointer-events: auto;
            position: relative;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .btn:hover {
            transform: scale(1.04);
            box-shadow: 0 12px 48px rgba(0, 100, 255, 0.5);
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), transparent);
            border-radius: inherit;
            pointer-events: none;
        }

        #back-btn {
            position: fixed; top: 20px; left: 20px; z-index: 150;
            display: flex; align-items: center; gap: 7px;
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.6); padding: 7px 14px; border-radius: 100px;
            text-decoration: none; font-size: 12px; font-weight: 500;
            transition: border-color 0.18s, color 0.18s;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        #back-btn:hover { border-color: rgba(255,255,255,0.35); color: #fff; }
        @media (max-width: 480px) {
            #back-btn { top: 10px; left: 10px; padding: 5px 12px; font-size: 11px; }
        }
    /* rodinny vzhlad */
    :root{--fc:#88ccff;--fc2:#ffaa44;--fgold:#ffd166;--fmuted:rgba(233,240,255,0.42);--fdim:rgba(233,240,255,0.18);--fborder:rgba(255,255,255,0.09);}
    html,body{font-family:'DM Sans',system-ui,sans-serif;}
    #hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:20;display:none;align-items:center;gap:7px;pointer-events:none;}
    #hud.show{display:flex;}
    #hud .pill{display:flex;align-items:center;gap:8px;padding:5px 12px;border-radius:100px;background:rgba(4,8,26,0.62);backdrop-filter:blur(8px);border:1px solid var(--fborder);font-size:9px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;color:var(--fdim);white-space:nowrap;}
    #hud .pill b{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;letter-spacing:0;font-variant-numeric:tabular-nums;color:var(--fc);}
    #hud .pill.lvl b{color:var(--fc2);}
    #hud .pill.best b{color:rgba(233,240,255,.72);}
    #hud .pill.best.record{border-color:rgba(136,204,255,.45);}
    #hud .pill.shield{display:none;}
    #hud .pill.shield.on{display:flex;border-color:rgba(136,204,255,.45);}
    #shield-bar{width:46px;height:5px;border-radius:3px;background:rgba(255,255,255,0.18);overflow:hidden;}
    #shield-bar i{display:block;height:100%;background:var(--fc);border-radius:3px;}
    @media(max-width:620px){#hud{left:auto;right:56px;transform:none;gap:5px;}#hud .pill span{display:none;}#hud .pill{padding:4px 10px;}#hud .pill b{font-size:15px;}#hud .pill.best{display:none;}}
    #pause-btn{position:fixed;top:14px;right:14px;z-index:60;display:none;align-items:center;justify-content:center;width:36px;height:36px;background:rgba(4,8,26,0.7);backdrop-filter:blur(8px);border:1px solid var(--fborder);color:var(--fmuted);border-radius:50%;cursor:pointer;}
    #pause-btn.show{display:flex;}
    .ui-overlay{background:radial-gradient(ellipse at center,rgba(4,8,26,0.8) 0%,rgba(0,1,8,0.95) 78%) !important;backdrop-filter:blur(6px) !important;padding:18px;}
    .fcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:11px;width:100%;max-width:334px;padding:26px 24px 24px;border-radius:24px;background:linear-gradient(165deg,rgba(255,255,255,0.06),rgba(255,255,255,0.015));border:1px solid rgba(255,255,255,0.17);box-shadow:0 30px 70px -28px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.07);animation:fpop .34s cubic-bezier(.2,1.4,.4,1);text-align:center;}
    @keyframes fpop{from{transform:scale(.9) translateY(8px);opacity:0;}to{transform:none;opacity:1;}}
    .fcard::before{content:'';position:absolute;inset:-1px;border-radius:24px;padding:1px;background:linear-gradient(120deg,rgba(136,204,255,.5),transparent 42%,transparent 58%,rgba(255,170,68,.5));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;}
    .fcard .femoji{font-size:34px;line-height:1;filter:drop-shadow(0 6px 16px rgba(136,204,255,.4));}
    .fcard .fttl{font-family:'Syne',sans-serif;font-weight:800;font-size:23px;letter-spacing:-.5px;background:linear-gradient(110deg,var(--fc) 5%,#fff 52%,var(--fc2) 95%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .fcard .fsub{font-size:11.5px;line-height:1.5;color:var(--fmuted);}
    .fcard .fbig{font-family:'Syne',sans-serif;font-weight:800;font-size:48px;line-height:1.05;letter-spacing:-2px;color:var(--fc);text-shadow:0 0 30px rgba(136,204,255,.4);}
    .fcard .flbl{font-size:9px;letter-spacing:2.2px;text-transform:uppercase;color:var(--fdim);}
    .fcard .fnote{font-size:11.5px;font-weight:600;color:var(--fmuted);}
    .fcard .fnote.record{color:var(--fgold);}
    .fstats{display:grid;width:100%;grid-template-columns:1fr 1fr;gap:7px;}
    .fstat{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:14px;background:rgba(255,255,255,0.04);border:1px solid var(--fborder);}
    .fstat i{font-size:8px;font-style:normal;letter-spacing:1.3px;text-transform:uppercase;color:var(--fdim);}
    .fstat b{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;color:var(--fc2);}
    .fbtn{margin-top:3px;width:100%;padding:13px 30px;border-radius:100px;border:1px solid rgba(136,204,255,.5);background:linear-gradient(180deg,rgba(136,204,255,.24),rgba(136,204,255,.1));color:#dcefff;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:all .18s;}
    .fbtn:hover{background:linear-gradient(180deg,rgba(136,204,255,.34),rgba(136,204,255,.16));color:#fff;box-shadow:0 0 24px -6px rgba(136,204,255,.5);}
    .fbtn:active{transform:translateY(1px);}
    #orientation-hint{font-size:10.5px;color:var(--fdim);}
    /* prekryv je stlpcovy flex: na nizkych obrazovkach sa scroluje po hlavnej osi, nie do strany */
    @media (max-height:820px){.ui-overlay{justify-content:flex-start !important;align-items:center !important;overflow-y:auto !important;}}
    </style>
</head>
<body>
    <a href="../../index.html" id="back-btn">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      <span id="lbl-back"></span>
    </a>
    <canvas id="gameCanvas"></canvas>
    <div id="orientation-hint"></div>

    <div id="hud">
      <div class="pill"><span id="lbl-h-score"></span><b id="hud-score">0</b></div>
      <div class="pill lvl"><span id="lbl-h-level"></span><b id="hud-level">1</b></div>
      <div class="pill shield" id="shield-pill"><span id="lbl-h-shield">&#128737;&#65039;</span><div id="shield-bar"><i style="width:100%"></i></div></div>
      <div class="pill best" id="best-pill"><span id="lbl-h-best"></span><b id="hud-best">0</b></div>
    </div>
    <button id="pause-btn" aria-label="pause">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1.4"/><rect x="14" y="4" width="4" height="16" rx="1.4"/></svg>
    </button>

    <!-- Start screen -->
    <div class="ui-overlay active" id="startOverlay">
      <div class="fcard">
        <div class="femoji">🌌</div>
        <div class="fttl" id="lbl-start-title">Gravity Shift</div>
        <div class="fsub" id="lbl-start-sub"></div>
        <button class="fbtn" id="startBtnHtml"></button>
      </div>
    </div>

    <!-- Game over -->
    <div class="ui-overlay" id="gameOverOverlay">
      <div class="fcard">
        <div class="fttl" id="lbl-over-title"></div>
        <div class="flbl" id="lbl-final-score"></div>
        <div class="fbig" id="finalScoreHtml">0</div>
        <div class="fnote" id="over-note"></div>
        <div class="fstats">
          <div class="fstat"><i id="lbl-final-level"></i><b id="finalLevelHtml">1</b></div>
          <div class="fstat"><i id="lbl-final-best"></i><b id="finalBestHtml">0</b></div>
        </div>
        <button class="fbtn" id="restartBtnHtml"></button>
      </div>
    </div>
    <script>
        (function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const hint = document.getElementById('orientation-hint');
            const startOverlay = document.getElementById('startOverlay');
            const gameOverOverlay = document.getElementById('gameOverOverlay');
            const startBtnHtml = document.getElementById('startBtnHtml');
            const restartBtnHtml = document.getElementById('restartBtnHtml');
            const finalScoreHtml = document.getElementById('finalScoreHtml');
            const finalLevelHtml = document.getElementById('finalLevelHtml');

            // ==================== AUDIO ====================
            let audioCtx = null;

            function initAudio() {
                if (!audioCtx) {
                    audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') audioCtx.resume();
            }

            function playSound(freq, duration, type = 'square', vol = 0.08, glideTo = null) {
                if (!audioCtx) return;
                const t = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, t);
                if (glideTo) osc.frequency.linearRampToValueAtTime(glideTo, t + duration);
                gain.gain.setValueAtTime(vol, t);
                gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(t);
                osc.stop(t + duration);
            }

            function sfxCollect() { playSound(800, 0.1, 'square', 0.06);
                playSound(1200, 0.12, 'square', 0.04, 1600); }

            function sfxHit() { playSound(50, 0.4, 'sawtooth', 0.15, 20);
                playSound(30, 0.5, 'triangle', 0.1, 10); }

            function sfxShield() { playSound(400, 0.15, 'square', 0.06);
                playSound(600, 0.2, 'square', 0.05, 900); }

            function sfxDestroy() { playSound(200, 0.2, 'sawtooth', 0.1);
                playSound(500, 0.25, 'square', 0.06, 700); }

            function sfxGameOver() { playSound(80, 0.6, 'sawtooth', 0.12, 30);
                playSound(40, 0.8, 'triangle', 0.1, 15); }

            // ==================== GAME STATE ====================
            let W, H, isLandscape, dpr = 1;
            let paused = false;
            const BEST_KEY = 'gravityshift_best';
            let best = 0;
            try { best = parseInt(localStorage.getItem(BEST_KEY), 10) || 0; } catch (e) {}
            let score = 0;
            let gameOver = false;
            let gameStarted = false;
            let scrollSpeed = 2.2;
            const MAX_SPEED = 9;
            const BASE_SPEED = 2.2;
            let difficultyLevel = 1;

            // Player
            const player = {
                size: 18,
                x: 0,
                y: 0,
                targetX: 0,
                targetY: 0,
                lerp: 0.18,
                shieldActive: false,
                shieldTimer: 0,
                shieldMax: 300, // 5 sekúnd pri 60fps
                trail: [],
                maxTrail: 8,
            };

            // Arrays
            let obstacles = [];
            let stars = [];
            let shields = [];
            let particles = [];
            let bgStars = [];

            // Timers
            let obstacleTimer = 0;
            let obstacleInterval = 55; // frames
            let starTimer = 0;
            let starInterval = 40;
            let shieldTimer = 0;
            let shieldInterval = 350; // ~6 sekúnd
            let frameCount = 0;

            // ==================== RESIZE & ORIENTATION ====================
            function resize() {
                // ostra kresba na displejoch s vysokou hustotou bodov
                dpr = Math.min(2, window.devicePixelRatio || 1);
                W = window.innerWidth;
                H = window.innerHeight;
                canvas.width = Math.round(W * dpr);
                canvas.height = Math.round(H * dpr);
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                const wasLandscape = isLandscape;
                isLandscape = W > H;
                initPlayerPosition();
                generateBgStars();
                // Ak sa orientácia zmenila počas hry
                if (wasLandscape !== undefined && wasLandscape !== isLandscape && gameStarted && !gameOver) {
                    obstacles = [];
                    stars = [];
                    shields = [];
                    particles = [];
                    obstacleTimer = 0;
                    starTimer = 0;
                    shieldTimer = 0;
                    // jemné vizuálne echo
                    for (let i = 0; i < 20; i++) {
                        particles.push({
                            x: player.x,
                            y: player.y,
                            vx: (Math.random() - 0.5) * 6,
                            vy: (Math.random() - 0.5) * 6,
                            life: 30 + Math.random() * 20,
                            maxLife: 50,
                            color: '#88ccff',
                            radius: 2 + Math.random() * 4,
                        });
                    }
                }
            }

            function initPlayerPosition() {
                if (isLandscape) {
                    player.x = 70;
                    player.y = H / 2;
                    player.targetY = player.y;
                    player.targetX = player.x;
                } else {
                    player.x = W / 2;
                    player.y = H - 70;
                    player.targetX = player.x;
                    player.targetY = player.y;
                }
                player.trail = [];
            }

            function generateBgStars() {
                bgStars = [];
                const count = Math.floor((W * H) / 3500);
                for (let i = 0; i < count; i++) {
                    bgStars.push({
                        x: Math.random() * W,
                        y: Math.random() * H,
                        radius: 0.4 + Math.random() * 1.8,
                        twinkle: Math.random() * Math.PI * 2,
                        twinkleSpeed: 0.01 + Math.random() * 0.04,
                        opacity: 0.3 + Math.random() * 0.7,
                    });
                }
            }

            // ==================== RESET ====================
            function restartGame() {
                gameOverOverlay.classList.remove('active');
                document.getElementById('hud').classList.add('show');
                document.getElementById('pause-btn').classList.add('show');
                document.getElementById('best-pill').classList.remove('record');
                paused = false;
                score = 0;
                gameOver = false;
                gameStarted = true;
                scrollSpeed = BASE_SPEED;
                difficultyLevel = 1;
                obstacles = [];
                stars = [];
                shields = [];
                particles = [];
                obstacleTimer = 0;
                starTimer = 0;
                shieldTimer = 0;
                player.shieldActive = false;
                player.shieldTimer = 0;
                player.trail = [];
                initPlayerPosition();
                obstacleInterval = 55;
                starInterval = 40;
                shieldInterval = 350;
                hint.style.opacity = '0';
                setTimeout(() => { hint.style.opacity = '1'; }, 2000);
            }

            // ==================== SPAWN ====================
            function spawnObstacle() {
                const r = 12 + Math.random() * 22;
                if (isLandscape) {
                    obstacles.push({
                        x: W + r + 20,
                        y: Math.random() * (H - r * 2) + r,
                        radius: r,
                        rotation: Math.random() * Math.PI * 2,
                        rotSpeed: (Math.random() - 0.5) * 0.06,
                        color: `hsl(${0 + Math.random()*20}, 70%, ${30 + Math.random()*25}%)`,
                        craterCount: Math.floor(Math.random() * 4) + 3,
                    });
                } else {
                    obstacles.push({
                        x: Math.random() * (W - r * 2) + r,
                        y: -r - 20,
                        radius: r,
                        rotation: Math.random() * Math.PI * 2,
                        rotSpeed: (Math.random() - 0.5) * 0.06,
                        color: `hsl(${0 + Math.random()*20}, 70%, ${30 + Math.random()*25}%)`,
                        craterCount: Math.floor(Math.random() * 4) + 3,
                    });
                }
            }

            function spawnStar() {
                const r = 7;
                if (isLandscape) {
                    stars.push({
                        x: W + r + 30,
                        y: Math.random() * (H - r * 2) + r,
                        radius: r,
                        glow: 0,
                        glowDir: 1,
                    });
                } else {
                    stars.push({
                        x: Math.random() * (W - r * 2) + r,
                        y: -r - 30,
                        radius: r,
                        glow: 0,
                        glowDir: 1,
                    });
                }
            }

            function spawnShield() {
                const r = 13;
                if (isLandscape) {
                    shields.push({
                        x: W + r + 20,
                        y: Math.random() * (H - r * 2) + r,
                        radius: r,
                        pulse: 0,
                    });
                } else {
                    shields.push({
                        x: Math.random() * (W - r * 2) + r,
                        y: -r - 20,
                        radius: r,
                        pulse: 0,
                    });
                }
            }

            function spawnParticles(x, y, count, color, spread = 4, life = 25) {
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * spread;
                    particles.push({
                        x: x,
                        y: y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        life: life + Math.random() * 15,
                        maxLife: life + 15,
                        color: color,
                        radius: 1.5 + Math.random() * 3.5,
                    });
                }
            }

            // ==================== UPDATE ====================
            function update() {
                if (!gameStarted || gameOver) return;
                frameCount++;

                // Zvyšovanie obtiažnosti
                if (frameCount % 300 === 0) {
                    difficultyLevel++;
                    scrollSpeed = Math.min(MAX_SPEED, BASE_SPEED + difficultyLevel * 0.4);
                    obstacleInterval = Math.max(18, 55 - difficultyLevel * 2);
                    starInterval = Math.max(20, 40 - difficultyLevel * 1);
                    shieldInterval = Math.max(200, 350 - difficultyLevel * 8);
                }

                // Shield timer
                if (player.shieldActive) {
                    player.shieldTimer--;
                    if (player.shieldTimer <= 0) {
                        player.shieldActive = false;
                        spawnParticles(player.x, player.y, 15, '#88ccff', 3, 20);
                    }
                }

                // Lerp player position
                if (isLandscape) {
                    player.targetY = Math.max(player.size, Math.min(H - player.size, player.targetY));
                    player.y += (player.targetY - player.y) * player.lerp;
                    player.x = 70;
                } else {
                    player.targetX = Math.max(player.size, Math.min(W - player.size, player.targetX));
                    player.x += (player.targetX - player.x) * player.lerp;
                    player.y = H - 70;
                }

                // Trail
                player.trail.push({ x: player.x, y: player.y, life: 8 });
                if (player.trail.length > player.maxTrail) player.trail.shift();
                for (let t of player.trail) t.life--;

                // Spawn obstacles
                obstacleTimer++;
                if (obstacleTimer >= obstacleInterval) {
                    obstacleTimer = 0;
                    spawnObstacle();
                }

                // Spawn stars
                starTimer++;
                if (starTimer >= starInterval) {
                    starTimer = 0;
                    spawnStar();
                }

                // Spawn shields
                shieldTimer++;
                if (shieldTimer >= shieldInterval && !player.shieldActive) {
                    shieldTimer = 0;
                    spawnShield();
                }

                // Move obstacles
                for (let obs of obstacles) {
                    if (isLandscape) {
                        obs.x -= scrollSpeed;
                    } else {
                        obs.y += scrollSpeed;
                    }
                    obs.rotation += obs.rotSpeed;
                }

                // Move stars
                for (let s of stars) {
                    if (isLandscape) {
                        s.x -= scrollSpeed;
                    } else {
                        s.y += scrollSpeed;
                    }
                    s.glow += 0.08 * s.glowDir;
                    if (s.glow > 1) s.glowDir = -1;
                    if (s.glow < 0) s.glowDir = 1;
                }

                // Move shields
                for (let sh of shields) {
                    if (isLandscape) {
                        sh.x -= scrollSpeed;
                    } else {
                        sh.y += scrollSpeed;
                    }
                    sh.pulse += 0.07;
                }

                // Update particles
                for (let p of particles) {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life--;
                }

                // Update BG stars
                for (let bg of bgStars) {
                    bg.twinkle += bg.twinkleSpeed;
                    if (isLandscape) {
                        bg.x -= scrollSpeed * 0.15;
                        if (bg.x < -5) { bg.x = W + 5;
                            bg.y = Math.random() * H; }
                    } else {
                        bg.y += scrollSpeed * 0.15;
                        if (bg.y > H + 5) { bg.y = -5;
                            bg.x = Math.random() * W; }
                    }
                }

                // Check collisions
                const px = player.x;
                const py = player.y;
                const ps = player.size;

                // Obstacles
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    const obs = obstacles[i];
                    const dx = px - obs.x;
                    const dy = py - obs.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < ps + obs.radius) {
                        if (player.shieldActive) {
                            // Znič prekážku
                            spawnParticles(obs.x, obs.y, 20, '#ffaa00', 5, 30);
                            sfxDestroy();
                            score += 3;
                            obstacles.splice(i, 1);
                        } else {
                            // Game over
                            gameOver = true;
                            spawnParticles(px, py, 50, '#ff4444', 7, 40);
                            spawnParticles(px, py, 30, '#ff8800', 5, 35);
                            sfxGameOver();
                            hint.style.opacity = '1';
                            const rec = score > best;
                            if (rec) { best = score; try { localStorage.setItem(BEST_KEY, String(best)); } catch (e2) {} }
                            finalScoreHtml.textContent = score;
                            finalLevelHtml.textContent = difficultyLevel;
                            document.getElementById('finalBestHtml').textContent = best;
                            const note = document.getElementById('over-note');
                            note.textContent = rec ? t('uiNewRecord') : t('uiBest') + ' ' + best;
                            note.classList.toggle('record', rec);
                            document.getElementById('best-pill').classList.toggle('record', rec);
                            document.getElementById('hud').classList.remove('show');
                            document.getElementById('pause-btn').classList.remove('show');
                            syncHud();
                            gameOverOverlay.classList.add('active');
                            break;
                        }
                    }
                }

                // Stars
                for (let i = stars.length - 1; i >= 0; i--) {
                    const s = stars[i];
                    const dx = px - s.x;
                    const dy = py - s.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < ps + s.radius + 6) {
                        spawnParticles(s.x, s.y, 12, '#ffdd44', 3, 20);
                        sfxCollect();
                        score += 5;
                        stars.splice(i, 1);
                    }
                }

                // Shields
                for (let i = shields.length - 1; i >= 0; i--) {
                    const sh = shields[i];
                    const dx = px - sh.x;
                    const dy = py - sh.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < ps + sh.radius + 6) {
                        player.shieldActive = true;
                        player.shieldTimer = player.shieldMax;
                        spawnParticles(sh.x, sh.y, 20, '#88ccff', 4, 25);
                        sfxShield();
                        shields.splice(i, 1);
                    }
                }

                // Cleanup offscreen
                obstacles = obstacles.filter(o => (isLandscape ? o.x > -o.radius - 30 : o.y < H + o.radius + 30));
                stars = stars.filter(s => (isLandscape ? s.x > -s.radius - 30 : s.y < H + s.radius + 30));
                shields = shields.filter(sh => (isLandscape ? sh.x > -sh.radius - 30 : sh.y < H + sh.radius + 30));
                particles = particles.filter(p => p.life > 0);
                player.trail = player.trail.filter(t => t.life > 0);

                // Score za prežitie
                if (frameCount % 30 === 0) score++;
            }

            // ==================== RENDER ====================
            function drawBgStars() {
                for (let bg of bgStars) {
                    const alpha = bg.opacity * (0.5 + 0.5 * Math.sin(bg.twinkle));
                    ctx.fillStyle = `rgba(200,220,255,${alpha})`;
                    ctx.beginPath();
                    ctx.arc(bg.x, bg.y, bg.radius, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function drawAsteroid(obs) {
                ctx.save();
                ctx.translate(obs.x, obs.y);
                ctx.rotate(obs.rotation);
                // Hlavné telo
                const r = obs.radius;
                ctx.fillStyle = obs.color;
                ctx.beginPath();
                // Nepravidelný tvar
                const points = 10;
                for (let i = 0; i < points; i++) {
                    const angle = (i / points) * Math.PI * 2;
                    const variation = 0.75 + Math.sin(i * 3.7) * 0.2 + Math.cos(i * 5.1) * 0.15;
                    const cr = r * variation;
                    const cx = Math.cos(angle) * cr;
                    const cy = Math.sin(angle) * cr;
                    if (i === 0) ctx.moveTo(cx, cy);
                    else ctx.lineTo(cx, cy);
                }
                ctx.closePath();
                ctx.fill();
                // Okraj
                ctx.strokeStyle = 'rgba(255,255,255,0.15)';
                ctx.lineWidth = 2;
                ctx.stroke();
                // Krátery
                for (let i = 0; i < obs.craterCount; i++) {
                    const ca = (i / obs.craterCount) * Math.PI * 2 + obs.rotation * 0.3;
                    const cd = r * (0.3 + Math.random() * 0.4);
                    const cx = Math.cos(ca) * cd;
                    const cy = Math.sin(ca) * cd;
                    ctx.fillStyle = 'rgba(0,0,0,0.35)';
                    ctx.beginPath();
                    ctx.arc(cx, cy, r * 0.12, 0, Math.PI * 2);
                    ctx.fill();
                }
                // Highlight
                const hlAngle = -0.7;
                const hlX = Math.cos(hlAngle) * r * 0.5;
                const hlY = Math.sin(hlAngle) * r * 0.5;
                const hlGrad = ctx.createRadialGradient(hlX, hlY, r * 0.05, hlX, hlY, r * 0.7);
                hlGrad.addColorStop(0, 'rgba(255,255,255,0.25)');
                hlGrad.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = hlGrad;
                ctx.beginPath();
                ctx.arc(0, 0, r, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            function drawStar(s) {
                ctx.save();
                ctx.translate(s.x, s.y);
                const glowAlpha = 0.5 + s.glow * 0.5;
                // Vonkajšia žiara
                const outerGlow = ctx.createRadialGradient(0, 0, s.radius * 0.3, 0, 0, s.radius * 2.5);
                outerGlow.addColorStop(0, `rgba(255,220,100,${glowAlpha})`);
                outerGlow.addColorStop(0.4, `rgba(255,200,50,${glowAlpha * 0.6})`);
                outerGlow.addColorStop(1, 'rgba(255,180,20,0)');
                ctx.fillStyle = outerGlow;
                ctx.beginPath();
                ctx.arc(0, 0, s.radius * 2.5, 0, Math.PI * 2);
                ctx.fill();
                // Telo hviezdy
                ctx.fillStyle = '#ffdd44';
                ctx.beginPath();
                const spikes = 5;
                for (let i = 0; i < spikes * 2; i++) {
                    const angle = (i / (spikes * 2)) * Math.PI * 2 - Math.PI / 2;
                    const cr = i % 2 === 0 ? s.radius : s.radius * 0.45;
                    const cx = Math.cos(angle) * cr;
                    const cy = Math.sin(angle) * cr;
                    if (i === 0) ctx.moveTo(cx, cy);
                    else ctx.lineTo(cx, cy);
                }
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = '#fffde0';
                ctx.beginPath();
                ctx.arc(0, 0, s.radius * 0.35, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            function drawShieldPU(sh) {
                ctx.save();
                ctx.translate(sh.x, sh.y);
                const pulse = 1 + Math.sin(sh.pulse) * 0.2;
                // Vonkajšia žiara
                const glow = ctx.createRadialGradient(0, 0, sh.radius * 0.4 * pulse, 0, 0, sh.radius * 2 * pulse);
                glow.addColorStop(0, 'rgba(120,200,255,0.8)');
                glow.addColorStop(0.5, 'rgba(60,150,255,0.35)');
                glow.addColorStop(1, 'rgba(30,80,255,0)');
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(0, 0, sh.radius * 2 * pulse, 0, Math.PI * 2);
                ctx.fill();
                // Kruh
                ctx.strokeStyle = 'rgba(180,230,255,0.9)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, sh.radius * pulse, 0, Math.PI * 2);
                ctx.stroke();
                // Vnútro
                ctx.fillStyle = 'rgba(200,240,255,0.7)';
                ctx.beginPath();
                ctx.arc(0, 0, sh.radius * 0.5 * pulse, 0, Math.PI * 2);
                ctx.fill();
                // Symbol blesku
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                const s = sh.radius * 0.45;
                ctx.moveTo(-s * 0.3, -s);
                ctx.lineTo(s * 0.5, -s * 0.2);
                ctx.lineTo(s * 0.1, s * 0.1);
                ctx.lineTo(s * 0.7, s);
                ctx.lineTo(-s * 0.1, s * 0.2);
                ctx.lineTo(s * 0.15, -s * 0.1);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }

            function drawPlayer() {
                ctx.save();
                ctx.translate(player.x, player.y);

                // Shield glow
                if (player.shieldActive) {
                    const shieldPulse = 1 + Math.sin(frameCount * 0.15) * 0.15;
                    const shieldGlow = ctx.createRadialGradient(0, 0, player.size * 0.5, 0, 0, player.size * 2.2 *
                        shieldPulse);
                    shieldGlow.addColorStop(0, 'rgba(100,200,255,0.6)');
                    shieldGlow.addColorStop(0.6, 'rgba(40,130,255,0.2)');
                    shieldGlow.addColorStop(1, 'rgba(20,60,255,0)');
                    ctx.fillStyle = shieldGlow;
                    ctx.beginPath();
                    ctx.arc(0, 0, player.size * 2.2 * shieldPulse, 0, Math.PI * 2);
                    ctx.fill();
                    // Kruh okolo
                    ctx.strokeStyle = `rgba(180,230,255,${0.7 + Math.sin(frameCount*0.2)*0.3})`;
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.arc(0, 0, player.size * 1.6 * shieldPulse, 0, Math.PI * 2);
                    ctx.stroke();
                }

                // Loď - trojuholník
                const s = player.size;
                if (isLandscape) {
                    // Smeruje doprava
                    ctx.fillStyle = player.shieldActive ? '#c0e8ff' : '#e8f4ff';
                    ctx.beginPath();
                    ctx.moveTo(s * 1.2, 0);
                    ctx.lineTo(-s * 0.7, -s * 0.9);
                    ctx.lineTo(-s * 0.3, 0);
                    ctx.lineTo(-s * 0.7, s * 0.9);
                    ctx.closePath();
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    // Motorový plameň
                    ctx.fillStyle = '#ff8844';
                    ctx.beginPath();
                    ctx.moveTo(-s * 0.65, -s * 0.35);
                    ctx.lineTo(-s * 1.3 - Math.random() * s * 0.4, 0);
                    ctx.lineTo(-s * 0.65, s * 0.35);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = '#ffcc66';
                    ctx.beginPath();
                    ctx.moveTo(-s * 0.55, -s * 0.2);
                    ctx.lineTo(-s * 1.0 - Math.random() * s * 0.3, 0);
                    ctx.lineTo(-s * 0.55, s * 0.2);
                    ctx.closePath();
                    ctx.fill();
                } else {
                    // Smeruje nahor
                    ctx.fillStyle = player.shieldActive ? '#c0e8ff' : '#e8f4ff';
                    ctx.beginPath();
                    ctx.moveTo(0, -s * 1.2);
                    ctx.lineTo(-s * 0.9, s * 0.7);
                    ctx.lineTo(0, s * 0.3);
                    ctx.lineTo(s * 0.9, s * 0.7);
                    ctx.closePath();
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    // Motorový plameň
                    ctx.fillStyle = '#ff8844';
                    ctx.beginPath();
                    ctx.moveTo(-s * 0.35, s * 0.6);
                    ctx.lineTo(0, s * 1.3 + Math.random() * s * 0.4);
                    ctx.lineTo(s * 0.35, s * 0.6);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = '#ffcc66';
                    ctx.beginPath();
                    ctx.moveTo(-s * 0.2, s * 0.5);
                    ctx.lineTo(0, s * 1.0 + Math.random() * s * 0.3);
                    ctx.lineTo(s * 0.2, s * 0.5);
                    ctx.closePath();
                    ctx.fill();
                }
                ctx.restore();
            }

            function drawParticles() {
                for (let p of particles) {
                    const alpha = p.life / p.maxLife;
                    ctx.fillStyle = p.color.replace(')', `,${alpha})`).replace('rgb',
                        'rgba').replace('hsl', 'hsla');
                    if (p.color.startsWith('#')) {
                        const hex = p.color;
                        const r = parseInt(hex.slice(1, 3), 16);
                        const g = parseInt(hex.slice(3, 5), 16);
                        const b = parseInt(hex.slice(5, 7), 16);
                        ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
                    }
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius * alpha, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // HUD je v DOM (sklenene pilulky), na canvase zostava len orientacia
            const hudVal = {};
            function setHud(id, v) {
                if (hudVal[id] === v) return;
                hudVal[id] = v;
                document.getElementById(id).textContent = v;
            }
            function syncHud() {
                setHud('hud-score', score);
                setHud('hud-level', difficultyLevel);
                setHud('hud-best', best);
                const sp = document.getElementById('shield-pill');
                sp.classList.toggle('on', !!player.shieldActive);
                if (player.shieldActive) {
                    const k = Math.max(0, Math.min(1, player.shieldTimer / player.shieldMax));
                    sp.querySelector('i').style.width = (k * 100) + '%';
                }
            }
            function drawUI() {
                syncHud();
                // rezim (na / vysku) zostava jemne dole vlavo
                ctx.fillStyle = 'rgba(255,255,255,0.28)';
                ctx.font = '600 10px "DM Sans", system-ui, sans-serif';
                ctx.textAlign = 'left';
                const orientText = isLandscape ? '\u2194 ' + t('gravityLandscape') : '\u2195 ' + t('gravityPortrait');
                ctx.fillText(t('gravityMode') + ': ' + orientText + '  \u00b7  ' + t('gravitySpeed') + ' ' + scrollSpeed.toFixed(1), 18, H - 16);
            }

            function render() {
                // Vyčistenie
                ctx.clearRect(0, 0, W, H);

                // Pozadie - gradient
                const bgGrad = ctx.createLinearGradient(0, 0, isLandscape ? W : 0, isLandscape ? 0 : H);
                bgGrad.addColorStop(0, '#000020');
                bgGrad.addColorStop(0.5, '#000a30');
                bgGrad.addColorStop(1, '#001040');
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, W, H);

                // BG hviezdy
                drawBgStars();

                // Shield power-upy
                for (let sh of shields) drawShieldPU(sh);

                // Hviezdy
                for (let s of stars) drawStar(s);

                // Prekážky
                for (let obs of obstacles) drawAsteroid(obs);

                // Trail hráča
                for (let i = 0; i < player.trail.length; i++) {
                    const t = player.trail[i];
                    const alpha = (t.life / 8) * 0.4;
                    ctx.fillStyle = `rgba(150,200,255,${alpha})`;
                    ctx.beginPath();
                    ctx.arc(t.x, t.y, player.size * 0.35 * (t.life / 8), 0, Math.PI * 2);
                    ctx.fill();
                }

                // Hráč
                drawPlayer();

                // Častice
                drawParticles();

                // UI
                if (gameStarted && !gameOver) {
                    drawUI();
                }
            }

            // ==================== GAME LOOP ====================
            let lastTs = 0, acc = 0;
            const STEP = 1 / 60;
            function gameLoop(ts) {
                requestAnimationFrame(gameLoop);
                const dt = lastTs ? Math.min(0.1, (ts - lastTs) / 1000) : 0;
                lastTs = ts;
                if (!paused) {
                    acc += dt;
                    let n = 0;
                    // logika bezi vzdy 60x za sekundu, aj na 144 Hz displeji
                    while (acc >= STEP && n < 4) { acc -= STEP; update(); n++; }
                } else {
                    acc = 0;
                }
                render();
                if (paused) {
                    ctx.fillStyle = 'rgba(0,1,8,0.62)';
                    ctx.fillRect(0, 0, W, H);
                    ctx.fillStyle = '#e9f0ff';
                    ctx.font = '800 ' + Math.round(Math.min(W, H) * 0.07) + 'px Syne, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(t('uiPaused'), W / 2, H / 2);
                }
            }
            function togglePause() {
                if (!gameStarted || gameOver) return;
                paused = !paused;
            }

            // ==================== INPUT ====================
            function doStart() {
                if (gameStarted) return;
                gameStarted = true;
                paused = false;
                startOverlay.classList.remove('active');
                document.getElementById('hud').classList.add('show');
                document.getElementById('pause-btn').classList.add('show');
                syncHud();
                hint.style.opacity = '0';
            }

            function handlePointer(x, y) {
                if (gameOver) return;
                if (!gameStarted) {
                    doStart();
                }
                if (isLandscape) {
                    player.targetY = y;
                } else {
                    player.targetX = x;
                }
            }

            canvas.addEventListener('mousedown', (e) => {
                e.preventDefault();
                initAudio();
                if (!gameOver) {
                    handlePointer(e.clientX, e.clientY);
                }
            });

            canvas.addEventListener('mousemove', (e) => {
                if (!gameOver && gameStarted) {
                    handlePointer(e.clientX, e.clientY);
                }
            });

            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                initAudio();
                if (!gameOver) {
                    handlePointer(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, { passive: false });

            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (!gameOver && gameStarted) {
                    handlePointer(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, { passive: false });

            canvas.addEventListener('touchend', (e) => {
                e.preventDefault();
            });

            document.addEventListener('keydown', (e) => {
                initAudio();
                if (gameOver) {
                    if (e.key === ' ' || e.key === 'Enter') {
                        restartGame();
                    }
                    return;
                }
                if (!gameStarted) {
                    if (e.key === ' ' || e.key === 'Enter') {
                        doStart();
                        return;
                    }
                }
                const moveAmount = 12;
                if (isLandscape) {
                    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') player.targetY -= moveAmount;
                    if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') player.targetY += moveAmount;
                } else {
                    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') player.targetX -= moveAmount;
                    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') player.targetX += moveAmount;
                }
                // Univerzálne šípky pre oba módy
                if (e.key === 'ArrowLeft' || e.key === 'a') player.targetX -= moveAmount;
                if (e.key === 'ArrowRight' || e.key === 'd') player.targetX += moveAmount;
                if (e.key === 'ArrowUp' || e.key === 'w') player.targetY -= moveAmount;
                if (e.key === 'ArrowDown' || e.key === 's') player.targetY += moveAmount;
            });

            // ==================== RESIZE EVENT ====================
            window.addEventListener('resize', () => {
                resize();
            });

            window.addEventListener('orientationchange', () => {
                setTimeout(resize, 150);
            });

            // ==================== INIT ====================
            document.getElementById('lbl-back').textContent = t('back');
            hint.textContent = '🔄 ' + t('gravityOrientHint');
            document.getElementById('lbl-start-title').textContent = t('gravityTitle');
            document.getElementById('lbl-start-sub').textContent = t('gravityStartSub');
            startBtnHtml.textContent = t('uiStart');
            document.getElementById('lbl-over-title').textContent = t('uiGameOver');
            document.getElementById('lbl-final-score').textContent = t('uiScore');
            document.getElementById('lbl-final-level').textContent = t('uiLevel');
            document.getElementById('lbl-final-best').textContent = t('uiBest');
            document.getElementById('lbl-h-score').textContent = t('uiScore');
            document.getElementById('lbl-h-level').textContent = t('uiLevel');
            document.getElementById('lbl-h-best').textContent = t('uiBest');
            restartBtnHtml.textContent = t('uiPlayAgain');

            startBtnHtml.addEventListener('click', doStart);
            document.getElementById('pause-btn').addEventListener('click', togglePause);
            document.addEventListener('keydown', e => {
                if (e.code === 'Escape' || e.code === 'KeyP') { e.preventDefault(); togglePause(); }
            });
            window.addEventListener('blur', () => { if (gameStarted && !gameOver) paused = true; });
            document.addEventListener('visibilitychange', () => { if (document.hidden && gameStarted && !gameOver) paused = true; });
            restartBtnHtml.addEventListener('click', () => {
                restartGame();
            });

            resize();
            initPlayerPosition();
            generateBgStars();
            gameLoop();

            // Skrytie hintu po niekoľkých sekundách ak hráč začne
            setTimeout(() => {
                if (gameStarted) hint.style.opacity = '0';
            }, 4000);
        })();
    </script>
</body>
</html>
