<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Alien Wave · GamePad</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<script src="../../i18n.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#07051a;--text:#eef0ff;--muted:rgba(238,240,255,0.42);--dim:rgba(238,240,255,0.18);
  --border:rgba(255,255,255,0.09);--border-h:rgba(255,255,255,0.18);
  --c:#7de3ff;--c2:#c08bff;--gold:#ffd166;--danger:#ff5d8f;
}
html,body{background:var(--bg);height:100%;font-family:'DM Sans',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;user-select:none;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none;}
button,a,[onclick]{touch-action:manipulation;}

#back-btn{position:fixed;top:14px;left:14px;z-index:60;display:flex;align-items:center;gap:7px;background:rgba(10,8,28,0.72);backdrop-filter:blur(8px);border:1px solid var(--border);color:var(--muted);padding:7px 14px;border-radius:100px;text-decoration:none;font-size:12px;font-weight:500;transition:border-color .18s,color .18s;}
#back-btn:hover,#back-btn:active{border-color:var(--border-h);color:var(--text);}
@media(max-width:520px){#back-btn{top:9px;left:9px;padding:6px 11px;font-size:11px;}}

#hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:12;display:none;align-items:center;gap:7px;pointer-events:none;}
#hud.show{display:flex;}
.pill{display:flex;align-items:center;gap:8px;padding:5px 12px;border-radius:100px;background:rgba(10,8,28,0.6);backdrop-filter:blur(8px);border:1px solid var(--border);font-size:9px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;color:var(--dim);white-space:nowrap;}
.pill b{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;letter-spacing:0;font-variant-numeric:tabular-nums;color:var(--c);transition:transform .18s;}
.pill.wave b{color:var(--c2);}
.pill.best b{color:var(--gold);}
.pill.best.record{border-color:rgba(255,209,102,.45);}
.pill b.bump{transform:scale(1.3);}
.lifes{display:flex;gap:4px;}
.life{width:9px;height:9px;background:var(--c);clip-path:polygon(50% 0,100% 100%,0 100%);box-shadow:0 0 8px rgba(125,227,255,.9);}
.life.gone{background:rgba(255,255,255,0.13);box-shadow:none;}
@media(max-width:620px){#hud{left:auto;right:56px;transform:none;gap:5px;}.pill span{display:none;}.pill{padding:4px 10px;}}

#pause-btn{position:fixed;top:14px;right:14px;z-index:60;display:none;align-items:center;justify-content:center;width:36px;height:36px;background:rgba(10,8,28,0.7);backdrop-filter:blur(8px);border:1px solid var(--border);color:var(--muted);border-radius:50%;cursor:pointer;}
#pause-btn.show{display:flex;}
#pause-btn:hover{border-color:var(--border-h);color:var(--text);}

#ctrl{position:fixed;bottom:18px;left:0;right:0;z-index:12;display:none;justify-content:space-between;padding:0 18px;pointer-events:none;}
body.touch #ctrl{display:flex;}
.pad{display:flex;gap:10px;pointer-events:auto;}
.btn{display:flex;align-items:center;justify-content:center;width:60px;height:60px;border-radius:16px;background:linear-gradient(160deg,rgba(255,255,255,0.07),rgba(255,255,255,0.02));border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:background .1s,border-color .1s,color .1s,transform .1s;}
.btn svg{width:19px;height:19px;}
.btn:active,.btn.pressed{background:rgba(125,227,255,0.18);border-color:rgba(125,227,255,0.45);color:var(--c);transform:scale(.94);}
#btn-fire{width:74px;height:74px;border-color:rgba(255,93,143,.45);color:var(--danger);}
#btn-fire:active,#btn-fire.pressed{background:rgba(255,93,143,.2);border-color:rgba(255,93,143,.6);}

#overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(ellipse at center,rgba(10,8,28,0.78) 0%,rgba(5,4,16,0.95) 78%);backdrop-filter:blur(6px);}
#overlay.hide{display:none;}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:11px;width:100%;max-width:330px;padding:26px 24px 24px;border-radius:24px;background:linear-gradient(165deg,rgba(255,255,255,0.06),rgba(255,255,255,0.015));border:1px solid var(--border-h);box-shadow:0 30px 70px -28px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.07);animation:pop .34s cubic-bezier(.2,1.4,.4,1);}
@keyframes pop{from{transform:scale(.9) translateY(8px);opacity:0;}to{transform:none;opacity:1;}}
.card::before{content:'';position:absolute;inset:-1px;border-radius:24px;padding:1px;background:linear-gradient(120deg,rgba(125,227,255,.5),transparent 42%,transparent 58%,rgba(192,139,255,.5));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;}
.emoji{font-size:36px;line-height:1;filter:drop-shadow(0 6px 16px rgba(125,227,255,.4));}
.title{font-family:'Syne',sans-serif;font-weight:800;font-size:24px;letter-spacing:-.5px;text-align:center;background:linear-gradient(110deg,var(--c) 5%,#fff 52%,var(--c2) 95%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
#result{display:none;flex-direction:column;align-items:center;gap:2px;}
#result.show{display:flex;}
#res-lbl{font-size:9px;letter-spacing:2.2px;text-transform:uppercase;color:var(--dim);}
#res-score{font-family:'Syne',sans-serif;font-weight:800;font-size:50px;line-height:1.05;letter-spacing:-2px;color:var(--c);text-shadow:0 0 30px rgba(125,227,255,.45);}
#res-note{font-size:11.5px;font-weight:600;color:var(--muted);}
#res-note.record{color:var(--gold);}
.seg{display:flex;gap:3px;background:rgba(255,255,255,0.04);border:1px solid var(--border);padding:3px;border-radius:100px;}
.seg button{background:transparent;border:none;color:var(--muted);padding:6px 15px;border-radius:100px;font-family:'DM Sans',sans-serif;font-size:11.5px;font-weight:600;cursor:pointer;transition:color .16s,background .16s;touch-action:manipulation;}
.seg button:hover{color:var(--text);}
.seg button.active{background:rgba(125,227,255,0.16);color:#c4f1ff;box-shadow:inset 0 0 0 1px rgba(125,227,255,0.42);}
.lbl{font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);}
.hint{font-size:11.5px;line-height:1.55;color:var(--muted);text-align:center;}
.play-btn{margin-top:3px;width:100%;padding:13px 30px;border-radius:100px;border:1px solid rgba(125,227,255,.5);background:linear-gradient(180deg,rgba(125,227,255,.24),rgba(125,227,255,.1));color:#d4f4ff;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:all .18s;touch-action:manipulation;}
.play-btn:hover{background:linear-gradient(180deg,rgba(125,227,255,.34),rgba(125,227,255,.16));color:#fff;box-shadow:0 0 24px -6px rgba(125,227,255,.5);}
.play-btn:active{transform:translateY(1px);}
@media(max-height:640px){.card{gap:8px;padding:18px 20px;}.emoji{display:none;}.title{font-size:20px;}#res-score{font-size:38px;}}
@media (max-height:820px){#overlay{justify-content:flex-start !important;overflow-y:auto !important;}}
</style>
</head>
<body>
<a href="../../index.html" id="back-btn">
  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
  <span id="lbl-back"></span>
</a>

<canvas id="c"></canvas>

<div id="hud">
  <div class="pill"><span id="lbl-score"></span><b id="hud-score">0</b></div>
  <div class="pill wave"><span id="lbl-wave"></span><b id="hud-wave">1</b></div>
  <div class="pill best" id="best-pill"><span id="lbl-best"></span><b id="hud-best">0</b></div>
  <div class="pill"><div class="lifes" id="lifes"></div></div>
</div>

<button id="pause-btn" aria-label="pause">
  <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1.4"/><rect x="14" y="4" width="4" height="16" rx="1.4"/></svg>
</button>

<div id="ctrl">
  <div class="pad">
    <button class="btn" id="btn-left" aria-label="left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg></button>
    <button class="btn" id="btn-right" aria-label="right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
  </div>
  <div class="pad">
    <button class="btn" id="btn-fire" aria-label="fire"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </div>
</div>

<div id="overlay">
  <div class="card">
    <div id="brand"><div class="emoji">🛰️</div></div>
    <div class="title" id="ov-title"></div>
    <div id="result">
      <div id="res-lbl"></div>
      <div id="res-score">0</div>
      <div id="res-note"></div>
    </div>
    <div class="lbl" id="lbl-diff"></div>
    <div class="seg" id="diff-row"></div>
    <div class="hint" id="ov-hint"></div>
    <button class="play-btn" id="ov-play"></button>
  </div>
</div>

<script>
// ── nastavenia (px/s, resp. podiely) ──────────────────────────────────────
const DIFFS = [
  {key:'diffEasy',   march:22, fireMs:340, alienFire:0.30, lives:4},
  {key:'diffMedium', march:34, fireMs:270, alienFire:0.55, lives:3},
  {key:'diffHard',   march:48, fireMs:210, alienFire:0.95, lives:3},
];
let diffIdx = 1;
const BEST_KEY = 'alienwave_best';
let best = +(localStorage.getItem(BEST_KEY) || 0);

// tri vlastné druhy útočníkov (kreslené, nie emoji)
const TIERS = [
  {rgb:'192,139,255', a:'#e6d2ff', b:'#7b3fd4', pts:40, kind:0},
  {rgb:'125,227,255', a:'#d6f6ff', b:'#2b8fbd', pts:25, kind:1},
  {rgb:'93,255,176',  a:'#d4ffe9', b:'#1e9e6a', pts:15, kind:2},
];

function applyLang() {
  document.getElementById('lbl-back').textContent  = t('back');
  document.getElementById('ov-title').textContent  = t('awvTitle');
  document.getElementById('ov-hint').textContent   = t('awvHint');
  document.getElementById('ov-play').textContent   = t('awvPlay');
  document.getElementById('lbl-diff').textContent  = t('uiDifficulty');
  document.getElementById('lbl-score').textContent = t('awvScore');
  document.getElementById('lbl-wave').textContent  = t('awvWave');
  document.getElementById('lbl-best').textContent  = t('uiBest');
  document.getElementById('hud-best').textContent  = best;
  buildDiffRow();
}

function buildDiffRow() {
  const row = document.getElementById('diff-row');
  row.innerHTML = '';
  DIFFS.forEach((d, i) => {
    const b = document.createElement('button');
    b.textContent = t(d.key);
    if (i === diffIdx) b.className = 'active';
    b.onclick = () => { diffIdx = i; buildDiffRow(); };
    row.appendChild(b);
  });
}

// ── canvas ────────────────────────────────────────────────────────────────
const C = document.getElementById('c'), ctx = C.getContext('2d');
let W = 0, H = 0, DPR = 1, SCL = 1;
let COLS = 10, ROWS = 4, AW = 28, AH = 22, GAPX = 10, GAPY = 12;
let TOP = 70, PLINE = 0, FLOOR = 0;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);

let vw = -1, vh = -1;
function resize() {
  vw = window.innerWidth; vh = window.innerHeight;
  W = vw || document.documentElement.clientWidth || 360;
  H = vh || document.documentElement.clientHeight || 640;
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  C.width = Math.round(W * DPR); C.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  SCL = clamp(H / 720, 0.7, 1.4);
  COLS = W < 430 ? 8 : (W < 620 ? 9 : 10);
  // formácia sa vždy vojde do šírky obrazovky (predtým bola pevná v px)
  const usable = Math.min(W - 32, 620);
  const cell = usable / COLS;
  AW = Math.floor(cell * 0.72); AH = Math.floor(AW * 0.78);
  GAPX = cell - AW; GAPY = Math.round(AH * 0.55);
  TOP = 62 * SCL + 24;
  const ctrlH = document.body.classList.contains('touch') ? 104 : 24;
  FLOOR = H - ctrlH - 14;
  PLINE = FLOOR - 34 * SCL;
}

// ── stav ──────────────────────────────────────────────────────────────────
const ST = {MENU:'menu', PLAY:'play', PAUSE:'pause', DEAD:'dead', WAVE:'wave'};
let state = ST.MENU;
let ship = null, aliens = [], shots = [], bombs = [], parts = [], pops = [], covers = [];
let score = 0, lives = 3, wave = 1;
let dir = 1, stepT = 0, phase = 0, fireT = 0, alienFireT = 0;
let shake = 0, flash = null, invuln = 0, deadT = 0, waveT = 0, stars = [];
const keys = {left:false, right:false, fire:false};

function difficulty() { return DIFFS[diffIdx]; }

function seedStars() {
  stars = [];
  for (let i = 0; i < 90; i++) stars.push({x: Math.random() * W, y: Math.random() * H, z: 0.3 + Math.random(), r: 0.5 + Math.random() * 1.5});
}

function spawnWave() {
  aliens = [];
  const totalW = COLS * (AW + GAPX) - GAPX;
  const startX = (W - totalW) / 2;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const tier = r === 0 ? 0 : (r < 3 ? 1 : 2);
    aliens.push({x: startX + c * (AW + GAPX), y: TOP + r * (AH + GAPY), row: r, tier, alive: true, hit: 0});
  }
  dir = 1; stepT = 0; phase = 0;
  shots = []; bombs = [];
  buildCovers();
}

// vlastné krycie bloky — erodujú po častiach
function buildCovers() {
  covers = [];
  const n = W < 430 ? 3 : 4;
  const bw = Math.min(74, W / (n + 2)) * 1.0;
  const bh = bw * 0.42;
  const cellW = bw / 6, cellH = bh / 3;
  for (let i = 0; i < n; i++) {
    const x0 = (W / (n + 1)) * (i + 1) - bw / 2;
    const y0 = PLINE - 52 * SCL - bh;
    const blocks = [];
    for (let r = 0; r < 3; r++) for (let c = 0; c < 6; c++) {
      if (r === 2 && (c === 2 || c === 3)) continue;         // vstup zospodu
      blocks.push({x: x0 + c * cellW, y: y0 + r * cellH, w: cellW, h: cellH, hp: 2});
    }
    covers.push(blocks);
  }
}

function startGame() {
  const d = difficulty();
  resize();
  score = 0; lives = d.lives; wave = 1;
  ship = {x: W / 2, vx: 0, muzzle: 0};
  parts = []; pops = []; invuln = 0; shake = 0; flash = null; deadT = 0; waveT = 0;
  fireT = 0; alienFireT = 0;
  seedStars();
  spawnWave();
  syncHud(true);
  document.getElementById('overlay').classList.add('hide');
  document.getElementById('result').classList.remove('show');
  document.getElementById('brand').style.display = '';
  document.getElementById('hud').classList.add('show');
  document.getElementById('pause-btn').classList.add('show');
  document.getElementById('ov-title').textContent = t('awvTitle');
  document.getElementById('ov-play').textContent = t('awvPlay');
  state = ST.PLAY;
}

function syncHud(silent) {
  const el = document.getElementById('hud-score');
  el.textContent = score;
  if (!silent) { el.classList.add('bump'); setTimeout(() => el.classList.remove('bump'), 170); }
  document.getElementById('hud-wave').textContent = wave;
  document.getElementById('hud-best').textContent = best;
  const box = document.getElementById('lifes');
  const total = Math.max(lives, difficulty().lives);
  box.innerHTML = '';
  for (let i = 0; i < total; i++) {
    const d = document.createElement('div');
    d.className = 'life' + (i < lives ? '' : ' gone');
    box.appendChild(d);
  }
}

let lastSave = 0, recordRun = false;
function saveBest(force) {
  let isNew = false;
  if (score > best) {
    best = score; isNew = true; recordRun = true;
    document.getElementById('hud-best').textContent = best;
    document.getElementById('best-pill').classList.add('record');
  }
  const now = Date.now();
  if ((isNew && now - lastSave > 2000) || (force && recordRun)) {
    lastSave = now;
    try { localStorage.setItem(BEST_KEY, best); } catch (_) {}
  }
  return isNew;
}

function burst(x, y, n, rgb, spread) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = (30 + Math.random() * 210) * SCL * (spread || 1);
    parts.push({x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, rgb, r: 2 * SCL});
  }
}

function fire() {
  if (state !== ST.PLAY || fireT > 0) return;
  shots.push({x: ship.x, y: PLINE - 16 * SCL, v: -620 * SCL});
  fireT = difficulty().fireMs / 1000;
  ship.muzzle = 1;
}

function loseLife() {
  if (invuln > 0) return;
  lives--; syncHud(true);
  shake = 0.36; flash = {a: 0.5, rgb: '255,93,143'};
  burst(ship.x, PLINE, 24, '125,227,255', 1.3);
  if (lives <= 0) { gameOver(); return; }
  invuln = 1.6;
  ship.x = W / 2;
}

function gameOver() {
  state = ST.DEAD; deadT = 0;
  saveBest();
  const rec = recordRun;
  saveBest(true);
  setTimeout(() => {
    if (state !== ST.DEAD) return;
    document.getElementById('ov-title').textContent = t('awvOver');
    document.getElementById('res-lbl').textContent = t('awvScore');
    document.getElementById('res-score').textContent = score;
    const note = document.getElementById('res-note');
    note.textContent = (rec ? '🏆 ' : '') + t('awvWave') + ' ' + wave + ' · ' + t('uiBest') + ': ' + best;
    note.classList.toggle('record', rec);
    document.getElementById('result').classList.add('show');
    document.getElementById('brand').innerHTML = '<div class="emoji">💥</div>';
    document.getElementById('ov-play').textContent = t('awvAgain');
    document.getElementById('overlay').classList.remove('hide');
    document.getElementById('hud').classList.remove('show');
    document.getElementById('pause-btn').classList.remove('show');
    state = ST.MENU;
  }, 660);
}

function nextWave() {
  if (state !== ST.PLAY) return;      // poistka proti opakovanému postupu vĺn
  wave++;
  score += 200;
  state = ST.WAVE; waveT = 1.4;
  flash = {a: 0.45, rgb: '192,139,255'};
  syncHud();
  saveBest();
}

function togglePause() {
  if (state === ST.PLAY) state = ST.PAUSE;
  else if (state === ST.PAUSE) state = ST.PLAY;
}

// ── slučka ────────────────────────────────────────────────────────────────
let prevTs = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (!prevTs) prevTs = ts;
  let dt = (ts - prevTs) / 1000;
  prevTs = ts;
  if (document.hidden) return;
  if (vw !== window.innerWidth || vh !== window.innerHeight) resize();
  dt = Math.min(dt, 1 / 25);

  if (state === ST.PLAY) update(dt);
  else if (state === ST.WAVE) {
    waveT -= dt;
    stepFx(dt);
    if (waveT <= 0) { spawnWave(); ship.x = W / 2; invuln = 1.2; state = ST.PLAY; }
  } else if (state === ST.DEAD) { deadT += dt; }
  if (state !== ST.PLAY && state !== ST.WAVE) stepFx(dt);
  draw(ts);
}

function update(dt) {
  const d = difficulty();
  if (fireT > 0) fireT -= dt;
  if (invuln > 0) invuln -= dt;
  ship.muzzle = Math.max(0, ship.muzzle - dt * 6);

  // loď
  const spd = 380 * SCL;
  ship.vx = (keys.left ? -spd : 0) + (keys.right ? spd : 0);
  if (ship.vx) ship.x = clamp(ship.x + ship.vx * dt, 24 * SCL, W - 24 * SCL);
  if (keys.fire) fire();

  const live = aliens.filter(a => a.alive);
  if (!live.length) { nextWave(); return; }

  // pochod: krokovo, so zrýchľovaním ako rad rednú
  const ratio = live.length / (ROWS * COLS);
  const stepEvery = clamp(0.62 * ratio + 0.1, 0.1, 0.72) / (1 + (wave - 1) * 0.14);
  stepT += dt;
  if (stepT >= stepEvery) {
    stepT = 0; phase ^= 1;
    const stepX = (d.march / 22) * (AW * 0.34);
    let hitEdge = false;
    for (const a of live) {
      a.x += dir * stepX;
      if (a.x < 10 || a.x + AW > W - 10) hitEdge = true;
    }
    if (hitEdge) {
      dir *= -1;
      for (const a of live) { a.x = clamp(a.x, 10, W - 10 - AW); a.y += AH * 0.6; }
    }
  }

  // paľba útočníkov
  alienFireT -= dt;
  if (alienFireT <= 0) {
    alienFireT = 0.55 / (d.alienFire * (1 + (wave - 1) * 0.12));
    // strieľa len spodný v náhodnom stĺpci
    const cols = {};
    for (const a of live) { const k = Math.round(a.x); if (!cols[k] || a.y > cols[k].y) cols[k] = a; }
    const list = Object.values(cols);
    if (list.length) {
      const a = list[Math.floor(Math.random() * list.length)];
      bombs.push({x: a.x + AW / 2, y: a.y + AH, v: (170 + wave * 12) * SCL, t: 0});
    }
  }

  // strely (pamätám si predchádzajúcu polohu — inak by preleteli tenký blok)
  for (const s of shots) { s.py = s.y; s.y += s.v * dt; }
  for (const b of bombs) { b.py = b.y; b.y += b.v * dt; b.t += dt; }
  shots = shots.filter(s => s.y > -30);
  bombs = bombs.filter(b => b.y < H + 30);

  // zásah útočníka
  for (const s of shots) {
    if (s.dead) continue;
    for (const a of live) {
      if (!a.alive) continue;
      if (s.x > a.x && s.x < a.x + AW && s.y > a.y && s.y < a.y + AH) {
        a.alive = false; s.dead = true;
        const tier = TIERS[a.tier];
        const pts = tier.pts + (wave - 1) * 5;
        score += pts;
        pops.push({x: a.x + AW / 2, y: a.y + AH / 2, t: 0, txt: '+' + pts});
        burst(a.x + AW / 2, a.y + AH / 2, 12, tier.rgb, 1);
        syncHud();
        saveBest();
        break;
      }
    }
  }
  shots = shots.filter(s => !s.dead);

  // strely vs krycie bloky — testujem celý úsek preletu medzi snímkami
  const hitCover = (x, ya, yb) => {
    const y0 = Math.min(ya, yb), y1 = Math.max(ya, yb);
    for (const blocks of covers) {
      for (const b of blocks) {
        if (b.hp <= 0) continue;
        if (x > b.x && x < b.x + b.w && y1 > b.y && y0 < b.y + b.h) {
          b.hp--; burst(x, clamp(y0, b.y, b.y + b.h), 5, '150,170,255', 0.6);
          return true;
        }
      }
    }
    return false;
  };
  shots = shots.filter(s => !hitCover(s.x, s.py === undefined ? s.y : s.py, s.y));
  bombs = bombs.filter(b => !hitCover(b.x, (b.py === undefined ? b.y : b.py) + 6 * SCL, b.y + 6 * SCL));

  // bomba vs loď
  for (const b of bombs) {
    if (Math.abs(b.x - ship.x) < 18 * SCL && b.y > PLINE - 18 * SCL && b.y < PLINE + 12 * SCL) {
      b.y = H + 999;
      loseLife();
      if (state !== ST.PLAY) return;
    }
  }
  bombs = bombs.filter(b => b.y < H + 30);

  // útočníci dorazili k lodi
  if (live.some(a => a.y + AH >= PLINE - 12 * SCL)) { lives = 0; loseLife(); return; }

  stepFx(dt);
}

function stepFx(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.95; p.vy = p.vy * 0.95 + 60 * SCL * dt;
    p.life -= dt * 1.5;
    if (p.life <= 0) parts.splice(i, 1);
  }
  for (let i = pops.length - 1; i >= 0; i--) { pops[i].t += dt * 1.4; if (pops[i].t >= 1) pops.splice(i, 1); }
  for (const a of aliens) if (a.hit > 0) a.hit -= dt * 4;
  if (shake > 0) shake = Math.max(0, shake - dt);
  if (flash) { flash.a -= dt * 1.4; if (flash.a <= 0) flash = null; }
  for (const s of stars) { s.y += s.z * 14 * dt; if (s.y > H) { s.y = -2; s.x = Math.random() * W; } }
}

// ── kreslenie ─────────────────────────────────────────────────────────────
function roundRect(g, x, y, w, h, r) {
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  g.beginPath();
  if (g.roundRect) g.roundRect(x, y, w, h, r);
  else {
    g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
    g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);
    g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y);
  }
}

function drawSpace() {
  const g = ctx.createLinearGradient(0, 0, W * 0.3, H);
  g.addColorStop(0, '#120b30');
  g.addColorStop(0.5, '#0a0722');
  g.addColorStop(1, '#06040f');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // nebula
  const n1 = ctx.createRadialGradient(W * 0.2, H * 0.25, 0, W * 0.2, H * 0.25, W * 0.55);
  n1.addColorStop(0, 'rgba(192,139,255,0.13)'); n1.addColorStop(1, 'transparent');
  ctx.fillStyle = n1; ctx.fillRect(0, 0, W, H);
  const n2 = ctx.createRadialGradient(W * 0.85, H * 0.65, 0, W * 0.85, H * 0.65, W * 0.5);
  n2.addColorStop(0, 'rgba(125,227,255,0.1)'); n2.addColorStop(1, 'transparent');
  ctx.fillStyle = n2; ctx.fillRect(0, 0, W, H);
  // hviezdy
  for (const s of stars) {
    ctx.globalAlpha = 0.25 + s.z * 0.5;
    ctx.fillStyle = s.z > 1 ? '#dff3ff' : '#b9a6ff';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r * s.z, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // planéta pri spodnej hrane
  const pg = ctx.createLinearGradient(0, FLOOR - 10, 0, H);
  pg.addColorStop(0, 'rgba(125,227,255,0.22)');
  pg.addColorStop(1, 'rgba(10,8,30,0)');
  ctx.fillStyle = pg;
  ctx.beginPath();
  ctx.ellipse(W / 2, H + W * 0.5, W * 0.95, W * 0.55, 0, Math.PI, 0);
  ctx.fill();
  ctx.strokeStyle = 'rgba(125,227,255,0.5)';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.ellipse(W / 2, H + W * 0.5, W * 0.95, W * 0.55, 0, Math.PI, 0);
  ctx.stroke();
}

// tri vlastné siluety útočníkov
function drawAlien(a) {
  const t = TIERS[a.tier], x = a.x, y = a.y, w = AW, h = AH;
  const wob = phase ? 1 : -1;
  ctx.save();
  ctx.shadowColor = 'rgba(' + t.rgb + ',0.85)';
  ctx.shadowBlur = 12 * SCL;
  const g = ctx.createLinearGradient(x, y, x, y + h);
  g.addColorStop(0, t.a);
  g.addColorStop(1, t.b);
  ctx.fillStyle = g;
  if (t.kind === 0) {
    // kupola s tromi chápadlami
    ctx.beginPath();
    ctx.ellipse(x + w / 2, y + h * 0.45, w * 0.42, h * 0.4, 0, Math.PI, 0);
    ctx.lineTo(x + w * 0.92, y + h * 0.62);
    ctx.lineTo(x + w * 0.08, y + h * 0.62);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.fillStyle = t.b;
    [-1, 0, 1].forEach((s, i) => {
      const bx = x + w / 2 + s * w * 0.28;
      roundRect(ctx, bx - w * 0.06, y + h * 0.6, w * 0.12, h * (0.28 + (i === 1 ? 0.1 : 0) * wob), w * 0.05);
      ctx.fill();
    });
  } else if (t.kind === 1) {
    // dron so dvomi krídlami
    roundRect(ctx, x + w * 0.2, y + h * 0.18, w * 0.6, h * 0.62, h * 0.24); ctx.fill();
    ctx.restore();
    ctx.fillStyle = t.b;
    [-1, 1].forEach(s => {
      const wy = y + h * (0.3 + 0.1 * (s * wob > 0 ? 1 : 0));
      roundRect(ctx, x + w / 2 + s * w * 0.46 - (s > 0 ? 0 : w * 0.2), wy, w * 0.2, h * 0.24, h * 0.1);
      ctx.fill();
    });
  } else {
    // krystalický tanier
    ctx.beginPath();
    ctx.moveTo(x + w / 2, y + h * 0.1);
    ctx.lineTo(x + w * 0.92, y + h * 0.5);
    ctx.lineTo(x + w / 2, y + h * 0.88);
    ctx.lineTo(x + w * 0.08, y + h * 0.5);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.beginPath();
    ctx.moveTo(x + w / 2, y + h * 0.16);
    ctx.lineTo(x + w * 0.74, y + h * 0.5);
    ctx.lineTo(x + w / 2, y + h * 0.5);
    ctx.closePath(); ctx.fill();
  }
  // oči
  ctx.fillStyle = 'rgba(10,6,26,0.85)';
  [-1, 1].forEach(s => {
    ctx.beginPath();
    ctx.ellipse(x + w / 2 + s * w * 0.15, y + h * (t.kind === 2 ? 0.46 : 0.38), w * 0.075, h * 0.1, 0, 0, 6.2832);
    ctx.fill();
  });
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  [-1, 1].forEach(s => {
    ctx.beginPath();
    ctx.arc(x + w / 2 + s * w * 0.15 - w * 0.02, y + h * (t.kind === 2 ? 0.43 : 0.35), w * 0.022, 0, 6.2832);
    ctx.fill();
  });
}

function drawShip() {
  if (invuln > 0 && Math.floor(invuln * 12) % 2 === 0) return;
  const x = ship.x, y = PLINE, w = 44 * SCL, h = 30 * SCL;
  // plamen motora
  const fl = 0.6 + Math.random() * 0.5;
  ctx.save();
  ctx.shadowColor = 'rgba(255,209,102,0.9)';
  ctx.shadowBlur = 14 * SCL;
  const fg = ctx.createLinearGradient(0, y + h * 0.4, 0, y + h * 0.4 + h * fl);
  fg.addColorStop(0, '#fff3c4');
  fg.addColorStop(1, 'rgba(255,120,60,0)');
  ctx.fillStyle = fg;
  ctx.beginPath();
  ctx.moveTo(x - w * 0.13, y + h * 0.36);
  ctx.lineTo(x + w * 0.13, y + h * 0.36);
  ctx.lineTo(x, y + h * 0.36 + h * fl);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  // trup
  ctx.save();
  ctx.shadowColor = 'rgba(125,227,255,0.85)';
  ctx.shadowBlur = 16 * SCL;
  const g = ctx.createLinearGradient(0, y - h * 0.6, 0, y + h * 0.4);
  g.addColorStop(0, '#ffffff');
  g.addColorStop(0.45, '#7de3ff');
  g.addColorStop(1, '#1b6f96');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(x, y - h * 0.62);
  ctx.quadraticCurveTo(x + w * 0.22, y - h * 0.2, x + w * 0.5, y + h * 0.34);
  ctx.lineTo(x + w * 0.16, y + h * 0.34);
  ctx.lineTo(x, y + h * 0.16);
  ctx.lineTo(x - w * 0.16, y + h * 0.34);
  ctx.lineTo(x - w * 0.5, y + h * 0.34);
  ctx.quadraticCurveTo(x - w * 0.22, y - h * 0.2, x, y - h * 0.62);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  // kokpit
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath(); ctx.ellipse(x, y - h * 0.12, w * 0.1, h * 0.18, 0, 0, 6.2832); ctx.fill();
  // záblesk pri výstrele
  if (ship.muzzle > 0) {
    ctx.save();
    ctx.globalAlpha = ship.muzzle;
    ctx.fillStyle = '#eaffff';
    ctx.beginPath(); ctx.ellipse(x, y - h * 0.7, w * 0.1, h * 0.22 * ship.muzzle, 0, 0, 6.2832); ctx.fill();
    ctx.restore();
  }
  // štít počas nezraniteľnosti
  if (invuln > 0) {
    ctx.save();
    ctx.globalAlpha = 0.35 + 0.25 * Math.sin(invuln * 12);
    ctx.strokeStyle = '#7de3ff';
    ctx.lineWidth = 2 * SCL;
    ctx.beginPath(); ctx.arc(x, y - h * 0.1, w * 0.62, 0, 6.2832); ctx.stroke();
    ctx.restore();
  }
}

function drawCovers() {
  for (const blocks of covers) {
    for (const b of blocks) {
      if (b.hp <= 0) continue;
      ctx.fillStyle = b.hp > 1 ? 'rgba(150,170,255,0.75)' : 'rgba(150,170,255,0.36)';
      roundRect(ctx, b.x, b.y, b.w - 1, b.h - 1, 2); ctx.fill();
    }
  }
}

function draw(ts) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (shake > 0) {
    const m = 11 * SCL * (shake / 0.36);
    ctx.translate((Math.random() - .5) * m, (Math.random() - .5) * m);
  }
  drawSpace();

  // vodoznak so skóre
  if (state !== ST.MENU) {
    ctx.save();
    ctx.font = '800 ' + Math.round(Math.min(H * 0.26, W * 0.26)) + "px Syne, sans-serif";
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    ctx.fillText(score, W / 2, H * 0.42);
    ctx.restore();
  }

  drawCovers();
  for (const a of aliens) if (a.alive) drawAlien(a);

  // strely
  ctx.save();
  ctx.shadowColor = 'rgba(234,255,255,0.9)';
  ctx.shadowBlur = 10 * SCL;
  ctx.fillStyle = '#eaffff';
  for (const s of shots) roundRect(ctx, s.x - 1.6 * SCL, s.y, 3.2 * SCL, 15 * SCL, 1.6 * SCL), ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.shadowColor = 'rgba(255,93,143,0.9)';
  ctx.shadowBlur = 10 * SCL;
  for (const b of bombs) {
    ctx.fillStyle = '#ff8fb5';
    const wig = Math.sin(b.t * 18) * 2.5 * SCL;
    ctx.beginPath(); ctx.ellipse(b.x + wig, b.y, 3.4 * SCL, 6 * SCL, 0, 0, 6.2832); ctx.fill();
  }
  ctx.restore();

  if (ship && state !== ST.MENU && (state !== ST.DEAD || deadT < 0.1)) drawShip();

  // iskry
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, p.life) * 0.9;
    ctx.fillStyle = 'rgba(' + p.rgb + ',1)';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * Math.max(0.3, p.life), 0, 6.2832); ctx.fill();
  }
  ctx.restore();

  // body
  ctx.save();
  ctx.font = '800 ' + Math.round(13 * SCL) + "px Syne, sans-serif";
  ctx.textAlign = 'center';
  for (const p of pops) {
    ctx.globalAlpha = 1 - p.t;
    ctx.fillStyle = '#dff3ff';
    ctx.fillText(p.txt, p.x, p.y - p.t * 26 * SCL);
  }
  ctx.restore();

  if (flash) {
    ctx.fillStyle = 'rgba(' + flash.rgb + ',' + (flash.a * 0.3).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  // hlásenie vlny
  if (state === ST.WAVE) {
    ctx.save();
    ctx.globalAlpha = clamp(waveT * 1.6, 0, 1);
    ctx.fillStyle = '#e8dcff';
    ctx.font = '800 ' + Math.round(Math.min(46, W * 0.11)) + "px Syne, sans-serif";
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(t('awvWave') + ' ' + wave, W / 2, H * 0.42);
    ctx.restore();
  }

  if (state === ST.PAUSE) {
    ctx.fillStyle = 'rgba(7,5,26,0.72)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(238,240,255,0.92)';
    ctx.font = '800 ' + Math.round(Math.min(34, H * 0.05)) + "px Syne, sans-serif";
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(t('uiPaused'), W / 2, H / 2);
    ctx.textBaseline = 'alphabetic';
  }
}

// ── vstup ─────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  const k = e.code;
  if (k === 'Escape' || k === 'KeyP') { e.preventDefault(); if (state === ST.PLAY || state === ST.PAUSE) togglePause(); return; }
  if (state === ST.MENU) {
    if (k === 'Space' || k === 'Enter') { e.preventDefault(); document.getElementById('ov-play').click(); }
    return;
  }
  if (k === 'ArrowLeft' || k === 'KeyA') { e.preventDefault(); keys.left = true; }
  if (k === 'ArrowRight' || k === 'KeyD') { e.preventDefault(); keys.right = true; }
  if (k === 'Space' || k === 'KeyF' || k === 'ArrowUp') { e.preventDefault(); if (state === ST.PAUSE) { state = ST.PLAY; return; } keys.fire = true; fire(); }
});
document.addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
  if (e.code === 'Space' || e.code === 'KeyF' || e.code === 'ArrowUp') keys.fire = false;
});

function holdBtn(id, on, off) {
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); el.classList.add('pressed'); on(); });
  const end = () => { el.classList.remove('pressed'); if (off) off(); };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('pointerleave', end);
}
holdBtn('btn-left',  () => keys.left = true,  () => keys.left = false);
holdBtn('btn-right', () => keys.right = true, () => keys.right = false);
holdBtn('btn-fire',  () => { keys.fire = true; fire(); }, () => keys.fire = false);

// vedenie lode prstom po ploche + ťuknutie strieľa
let drag = null;
C.addEventListener('pointerdown', e => {
  if (state === ST.PAUSE) { state = ST.PLAY; return; }
  if (state === ST.PLAY) { drag = e.pointerId; ship.x = clamp(e.clientX, 24 * SCL, W - 24 * SCL); fire(); }
});
C.addEventListener('pointermove', e => {
  if (drag !== e.pointerId || state !== ST.PLAY) return;
  ship.x = clamp(e.clientX, 24 * SCL, W - 24 * SCL);
});
C.addEventListener('pointerup', e => { if (drag === e.pointerId) drag = null; });
C.addEventListener('pointercancel', () => { drag = null; });

document.getElementById('ov-play').onclick = startGame;
document.getElementById('pause-btn').onclick = togglePause;
window.addEventListener('blur', () => { if (state === ST.PLAY) state = ST.PAUSE; saveBest(true); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { if (state === ST.PLAY) state = ST.PAUSE; saveBest(true); } });
window.addEventListener('pagehide', () => saveBest(true));

if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) document.body.classList.add('touch');
resize();
applyLang();
seedStars();
ship = {x: W / 2, vx: 0, muzzle: 0};
spawnWave();
requestAnimationFrame(frame);
</script>
</body>
</html>
