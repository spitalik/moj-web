<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Moon Lander · GamePad</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<script src="../../i18n.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#04060f;--text:#eef3fc;--muted:rgba(238,243,252,0.42);--dim:rgba(238,243,252,0.18);
  --border:rgba(255,255,255,0.09);--border-h:rgba(255,255,255,0.18);
  --c:#cbd5e1;--c2:#4ade80;--gold:#ffd166;--warn:#f87171;
}
html,body{background:var(--bg);height:100%;font-family:'DM Sans',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;user-select:none;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none;}
button,a{touch-action:manipulation;font-family:'DM Sans',sans-serif;}

#back-btn{position:fixed;top:14px;left:14px;z-index:60;display:flex;align-items:center;gap:7px;background:rgba(9,13,26,0.72);backdrop-filter:blur(8px);border:1px solid var(--border);color:var(--muted);padding:7px 14px;border-radius:100px;text-decoration:none;font-size:12px;font-weight:500;transition:border-color .18s,color .18s;}
#back-btn:hover,#back-btn:active{border-color:var(--border-h);color:var(--text);}
@media(max-width:520px){#back-btn{top:9px;left:9px;padding:6px 11px;font-size:11px;}}

#hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:12;display:none;align-items:center;gap:7px;pointer-events:none;}
#hud.show{display:flex;}
.pill{display:flex;align-items:center;gap:8px;padding:5px 12px;border-radius:100px;background:rgba(9,13,26,0.62);backdrop-filter:blur(8px);border:1px solid var(--border);font-size:9px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;color:var(--dim);white-space:nowrap;}
.pill b{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;letter-spacing:0;font-variant-numeric:tabular-nums;color:var(--c);transition:transform .18s;}
.pill.pad b{color:var(--c2);}
.pill.best b{color:rgba(238,243,252,.72);}
.pill.best.record{border-color:rgba(203,213,225,.45);}
.pill b.bump{transform:scale(1.3);}
#fuel-bar{width:58px;height:6px;border-radius:4px;background:rgba(255,255,255,0.16);overflow:hidden;}
#fuel-bar i{display:block;height:100%;width:100%;border-radius:4px;background:linear-gradient(90deg,#4ade80,#a3e635);transition:width .1s linear,background .3s;}
.pill.fuel.mid #fuel-bar i{background:linear-gradient(90deg,#ffd166,#ffa94d);}
.pill.fuel.low #fuel-bar i{background:linear-gradient(90deg,#f87171,#ff8a5c);}
.pill.fuel.low{border-color:rgba(248,113,113,.5);animation:warn 1s infinite;}
@keyframes warn{50%{border-color:rgba(248,113,113,.12);}}
.lifes{display:flex;gap:4px;}
.life{width:9px;height:9px;background:var(--c);clip-path:polygon(50% 0,100% 100%,0 100%);box-shadow:0 0 8px rgba(203,213,225,.8);}
.life.gone{background:rgba(255,255,255,0.13);box-shadow:none;}
@media(max-width:660px){#hud{left:auto;right:54px;transform:none;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 150px);}.pill span.txt{display:none;}.pill{padding:4px 10px;}.pill b{font-size:15px;}.pill.best{display:none;}#fuel-bar{width:42px;}}

#pause-btn{position:fixed;top:14px;right:14px;z-index:60;display:none;align-items:center;justify-content:center;width:36px;height:36px;background:rgba(9,13,26,0.7);backdrop-filter:blur(8px);border:1px solid var(--border);color:var(--muted);border-radius:50%;cursor:pointer;}
#pause-btn.show{display:flex;}
#pause-btn:hover{border-color:var(--border-h);color:var(--text);}

#ctrl{position:fixed;bottom:18px;left:0;right:0;z-index:12;display:none;justify-content:space-between;padding:0 16px;pointer-events:none;}
body.touch #ctrl.show{display:flex;}
.pad{display:flex;gap:9px;pointer-events:auto;}
.btn{display:flex;align-items:center;justify-content:center;width:60px;height:60px;border-radius:16px;background:linear-gradient(160deg,rgba(255,255,255,0.07),rgba(255,255,255,0.02));border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:background .1s,border-color .1s,color .1s,transform .1s;}
.btn svg{width:20px;height:20px;}
.btn:active,.btn.on{background:rgba(203,213,225,0.18);border-color:rgba(203,213,225,0.45);color:#fff;transform:scale(.94);}
#btn-thrust{width:78px;height:78px;border-color:rgba(255,209,102,.45);color:var(--gold);}
#btn-thrust:active,#btn-thrust.on{background:rgba(255,209,102,.2);border-color:rgba(255,209,102,.6);}

#overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(ellipse at center,rgba(9,13,26,0.78) 0%,rgba(2,3,9,0.95) 78%);backdrop-filter:blur(6px);}
#overlay.hide{display:none;}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:11px;width:100%;max-width:334px;padding:26px 24px 24px;border-radius:24px;background:linear-gradient(165deg,rgba(255,255,255,0.06),rgba(255,255,255,0.015));border:1px solid var(--border-h);box-shadow:0 30px 70px -28px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.07);animation:pop .34s cubic-bezier(.2,1.4,.4,1);}
@keyframes pop{from{transform:scale(.9) translateY(8px);opacity:0;}to{transform:none;opacity:1;}}
.card::before{content:'';position:absolute;inset:-1px;border-radius:24px;padding:1px;background:linear-gradient(120deg,rgba(203,213,225,.5),transparent 42%,transparent 58%,rgba(74,222,128,.5));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;}
.emoji{font-size:34px;line-height:1;filter:drop-shadow(0 6px 16px rgba(203,213,225,.35));}
.ttl{font-family:'Syne',sans-serif;font-weight:800;font-size:24px;letter-spacing:-.5px;text-align:center;background:linear-gradient(110deg,var(--c) 5%,#fff 52%,var(--c2) 95%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
#result{display:none;flex-direction:column;align-items:center;gap:1px;}
#result.show{display:flex;}
#res-lbl{font-size:9px;letter-spacing:2.2px;text-transform:uppercase;color:var(--dim);}
#res-score{font-family:'Syne',sans-serif;font-weight:800;font-size:50px;line-height:1.05;letter-spacing:-2px;color:var(--c);text-shadow:0 0 30px rgba(203,213,225,.35);}
#res-note{font-size:11.5px;font-weight:600;color:var(--muted);}
#res-note.record{color:var(--gold);}
#ov-stats{display:none;width:100%;grid-template-columns:1fr 1fr;gap:7px;}
#ov-stats.show{display:grid;}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:14px;background:rgba(255,255,255,0.04);border:1px solid var(--border);}
.stat i{font-size:8px;font-style:normal;letter-spacing:1.3px;text-transform:uppercase;color:var(--dim);text-align:center;}
.stat b{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;color:var(--c2);white-space:nowrap;}
.seg{display:flex;gap:3px;background:rgba(255,255,255,0.04);border:1px solid var(--border);padding:3px;border-radius:100px;}
.seg button{background:transparent;border:none;color:var(--muted);padding:6px 15px;border-radius:100px;font-size:11.5px;font-weight:600;cursor:pointer;transition:color .16s,background .16s;}
.seg button:hover{color:var(--text);}
.seg button.active{background:rgba(203,213,225,0.16);color:#fff;box-shadow:inset 0 0 0 1px rgba(203,213,225,0.42);}
.lbl{font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);}
.hint{font-size:11.5px;line-height:1.55;color:var(--muted);text-align:center;}
.play-btn{margin-top:3px;width:100%;padding:13px 30px;border-radius:100px;border:1px solid rgba(203,213,225,.5);background:linear-gradient(180deg,rgba(203,213,225,.22),rgba(203,213,225,.09));color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:all .18s;}
.play-btn:hover{background:linear-gradient(180deg,rgba(203,213,225,.32),rgba(203,213,225,.15));box-shadow:0 0 24px -6px rgba(203,213,225,.45);}
.play-btn:active{transform:translateY(1px);}
@media(max-height:640px){.card{gap:8px;padding:18px 20px;}.emoji{display:none;}.ttl{font-size:20px;}#res-score{font-size:38px;}}
@media (max-height:820px){#overlay{align-items:flex-start !important;overflow-y:auto !important;}}
</style>
</head>
<body>
<a href="../../index.html" id="back-btn">
  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
  <span id="lbl-back"></span>
</a>

<canvas id="c"></canvas>

<div id="hud">
  <div class="pill pad"><span class="txt" id="lbl-pad"></span><b id="hud-pad">1</b></div>
  <div class="pill fuel" id="fuel-pill"><span>&#9981;</span><div id="fuel-bar"><i></i></div></div>
  <div class="pill"><div class="lifes" id="lifes"></div></div>
  <div class="pill"><span class="txt" id="lbl-score"></span><b id="hud-score">0</b></div>
  <div class="pill best" id="best-pill"><span class="txt" id="lbl-best"></span><b id="hud-best">0</b></div>
</div>

<button id="pause-btn" aria-label="pause">
  <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1.4"/><rect x="14" y="4" width="4" height="16" rx="1.4"/></svg>
</button>

<div id="ctrl">
  <div class="pad">
    <button class="btn" id="btn-left" aria-label="left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg></button>
    <button class="btn" id="btn-right" aria-label="right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/></svg></button>
  </div>
  <div class="pad">
    <button class="btn" id="btn-thrust" aria-label="thrust"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </div>
</div>

<div id="overlay">
  <div class="card">
    <div id="brand"><div class="emoji">&#127765;</div></div>
    <div class="ttl" id="ov-title"></div>
    <div id="result">
      <div id="res-lbl"></div>
      <div id="res-score">0</div>
      <div id="res-note"></div>
    </div>
    <div id="ov-stats">
      <div class="stat"><i id="lbl-s-pad"></i><b id="st-pad">0</b></div>
      <div class="stat"><i id="lbl-s-best"></i><b id="st-best">0</b></div>
    </div>
    <div class="lbl" id="lbl-diff"></div>
    <div class="seg" id="diff-row"></div>
    <div class="hint" id="ov-hint"></div>
    <button class="play-btn" id="ov-play"></button>
  </div>
</div>

<script>
// ── nastavenia: zrychlenia v px/s2, rychlosti v px/s, rotacia v °/s ─────
const DIFFS = [
  {key:'diffEasy',   grav:72,  fuel:140, pad:78, tries:4, vy:70, vx:46, tilt:16},
  {key:'diffMedium', grav:97,  fuel:110, pad:62, tries:3, vy:56, vx:34, tilt:12},
  {key:'diffHard',   grav:122, fuel:88,  pad:48, tries:2, vy:44, vx:26, tilt:9},
];
let diffIdx = 1;
const bestKey = () => 'moonlander_best_' + diffIdx;
let best = 0;

const THRUST = 224;      // px/s2 (x SCL)
const SPIN = 156;        // °/s
const BURN = 25;         // palivo za sekundu drzania
const P_LAND = 120, P_FUEL = 2, P_NARROW = 3;

const ST = {MENU:0, COUNT:1, PLAY:2, PAUSE:3, OVER:4};
let state = ST.MENU;

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, SCL = 1;

let ground = null, pad = {x0:0, x1:0, y:0};
let ship = null, padNo = 1, tries = 3, score = 0;
let sparks = [], pops = [], stars = [];
let shake = 0, cdLeft = 0, goFlash = 0, msg = '', msgT = 0, holdT = 0;
let tSec = 0, tPrev = 0;
const keys = {};
const isTouch = window.matchMedia('(pointer: coarse)').matches;

function applyLang() {
  document.getElementById('lbl-back').textContent   = t('back');
  document.getElementById('lbl-pad').textContent    = t('mlnPad');
  document.getElementById('lbl-score').textContent  = t('uiScore');
  document.getElementById('lbl-best').textContent   = t('uiBest');
  document.getElementById('lbl-s-pad').textContent  = t('mlnPad');
  document.getElementById('lbl-s-best').textContent = t('uiBest');
  document.getElementById('res-lbl').textContent    = t('uiScore');
  document.getElementById('lbl-diff').textContent   = t('uiDifficulty');
  document.getElementById('fuel-pill').title        = t('mlnFuel');
  document.title = t('mlnTitle') + ' · GamePad';
}
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const D = () => DIFFS[diffIdx];

// ── rozmery ─────────────────────────────────────────────────────────────
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth || 360;
  H = window.innerHeight || 640;
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  SCL = clamp(Math.min(W, H) / 420, 0.78, 1.9);
  makeStars();
  buildTerrain(true);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 250));

function makeStars() {
  stars = Array.from({length: 70}, () => ({x: Math.random(), y: Math.random() * 0.62, r: rnd(0.7, 1.9), ph: rnd(0, 6.28)}));
}

// ── terén ───────────────────────────────────────────────────────────────
function buildTerrain(keepPad) {
  const n = Math.max(2, Math.ceil(W));
  ground = new Float32Array(n);
  const topLimit = H * (isTouch ? 0.5 : 0.46);
  const base = H * (isTouch ? 0.76 : 0.8);
  const bottom = H - 10 * SCL;
  const waves = [
    {amp: (26 + Math.random() * 16) * SCL, len: (300 + Math.random() * 180) * SCL, ph: rnd(0, 6.28)},
    {amp: (13 + Math.random() * 10) * SCL, len: (110 + Math.random() * 70) * SCL, ph: rnd(0, 6.28)},
    {amp: (6 + Math.random() * 5) * SCL,   len: (40 + Math.random() * 26) * SCL,  ph: rnd(0, 6.28)},
  ];
  for (let x = 0; x < n; x++) {
    let y = base;
    for (const w of waves) y += Math.sin(x / w.len * 6.283 + w.ph) * w.amp;
    ground[x] = clamp(y, topLimit, bottom);
  }
  // plosinu vyrovnam; kazda dalsia je uzsia
  const width = Math.max(30 * SCL, (D().pad - (padNo - 1) * 6) * SCL);
  const margin = Math.min(W * 0.12, 60 * SCL);
  const x0 = Math.round(clamp(keepPad && pad.x1 ? pad.x0 : rnd(margin, W - margin - width), 4, Math.max(4, W - width - 4)));
  const y = ground[clamp(Math.round(x0 + width / 2), 0, n - 1)];
  for (let x = x0; x < Math.min(n, x0 + width); x++) ground[x] = y;
  pad = {x0, x1: Math.min(W, x0 + width), y};
}
const groundAt = x => ground[clamp(Math.round(x), 0, ground.length - 1)];

function resetShip() {
  const margin = Math.min(W * 0.16, 90 * SCL);
  ship = {
    x: rnd(margin, W - margin), y: 40 * SCL,
    vx: rnd(-26, 26) * SCL, vy: 8 * SCL,
    a: 0, fuel: Math.max(40, D().fuel - (padNo - 1) * 8),
    alive: true, landed: false, burning: false,
  };
  sparks = [];
  holdT = 0;
}

// ── kolo ────────────────────────────────────────────────────────────────
function loadBest() {
  best = +(localStorage.getItem(bestKey()) || 0);
  setHud('hud-best', best);
  document.getElementById('best-pill').classList.remove('record');
}
function beginRound() {
  padNo = 1; tries = D().tries; score = 0;
  shake = 0; goFlash = 0; msg = ''; msgT = 0; pops = [];
  cdLeft = 2.4;
  for (const k in keys) keys[k] = false;
  buildTerrain(false);
  resetShip();
  state = ST.COUNT;
  document.getElementById('overlay').classList.add('hide');
  document.getElementById('hud').classList.add('show');
  document.getElementById('pause-btn').classList.add('show');
  document.getElementById('ctrl').classList.add('show');
  loadBest();
  syncHud(true);
}
function endRound() {
  state = ST.OVER;
  const rec = score > best;
  if (rec) { best = score; try { localStorage.setItem(bestKey(), best); } catch (e) {} }
  document.getElementById('res-score').textContent = score;
  const note = document.getElementById('res-note');
  note.textContent = rec ? t('uiNewRecord') : t('uiBest') + ' ' + best;
  note.classList.toggle('record', rec);
  document.getElementById('st-pad').textContent = padNo - 1;
  document.getElementById('st-best').textContent = best;
  showCard('over');
  setHud('hud-best', best);
  document.getElementById('best-pill').classList.toggle('record', rec);
}
function showCard(mode) {
  document.getElementById('ov-title').textContent = mode === 'over' ? t('uiGameOver') : t('mlnTitle');
  document.getElementById('brand').style.display = mode === 'over' ? 'none' : '';
  document.getElementById('result').classList.toggle('show', mode === 'over');
  document.getElementById('ov-stats').classList.toggle('show', mode === 'over');
  document.getElementById('ov-hint').textContent = isTouch ? t('mlnRules') : t('mlnHint');
  document.getElementById('ov-play').textContent = mode === 'over' ? t('uiPlayAgain') : t('uiStart');
  document.getElementById('overlay').classList.remove('hide');
  document.getElementById('hud').classList.remove('show');
  document.getElementById('pause-btn').classList.remove('show');
  document.getElementById('ctrl').classList.remove('show');
}
function togglePause() {
  if (state === ST.PLAY) state = ST.PAUSE;
  else if (state === ST.PAUSE) { cdLeft = 1.2; state = ST.COUNT; }
}
function say(txt, secs) { msg = txt; msgT = secs; }

// ── HUD ─────────────────────────────────────────────────────────────────
const hudVal = {};
function setHud(id, v) {
  if (hudVal[id] === v) return;
  hudVal[id] = v;
  const el = document.getElementById(id);
  el.textContent = v;
  el.classList.remove('bump');
  void el.offsetWidth;
  el.classList.add('bump');
  setTimeout(() => el.classList.remove('bump'), 180);
}
function syncHud(force) {
  setHud('hud-pad', padNo);
  setHud('hud-score', score);
  const box = document.getElementById('lifes');
  const total = D().tries;
  if (box.children.length !== total) {
    box.textContent = '';
    for (let i = 0; i < total; i++) { const d = document.createElement('div'); d.className = 'life'; box.appendChild(d); }
  }
  [...box.children].forEach((d, i) => d.classList.toggle('gone', i >= tries));
  const f = ship ? ship.fuel : 0;
  const fmax = Math.max(1, D().fuel);
  const fp = document.getElementById('fuel-pill');
  document.querySelector('#fuel-bar i').style.width = clamp(f / fmax * 100, 0, 100) + '%';
  fp.classList.toggle('mid', f / fmax < 0.5 && f / fmax >= 0.22);
  fp.classList.toggle('low', f / fmax < 0.22);
  if (force) setHud('hud-best', best);
}

// ── pristatie a naraz ───────────────────────────────────────────────────
function land() {
  ship.landed = true;
  ship.burning = false;
  const gained = Math.round(P_LAND + ship.fuel * P_FUEL + (D().pad * SCL - (pad.x1 - pad.x0)) / SCL * P_NARROW);
  score += gained;
  padNo++;
  pops.push({x: ship.x, y: ship.y - 26 * SCL, txt: '+' + gained, life: 1.4, rgb: '74,222,128'});
  for (let i = 0; i < 16; i++) {
    const a = rnd(-3.14, 0);
    sparks.push({x: ship.x, y: ship.y + 8 * SCL, vx: Math.cos(a) * rnd(20, 90) * SCL, vy: Math.sin(a) * rnd(10, 50) * SCL, life: 0.5, max: 0.5, rgb: '203,213,225'});
  }
  say(t('mlnLanded', {n: gained}), 1.6);
  syncHud();
  holdT = 1.5;
}
function crash() {
  ship.alive = false;
  ship.burning = false;
  shake = 1;
  for (let i = 0; i < 30; i++) {
    const a = rnd(0, 6.2832);
    sparks.push({x: ship.x, y: ship.y, vx: Math.cos(a) * rnd(40, 230) * SCL, vy: Math.sin(a) * rnd(40, 230) * SCL - 40 * SCL,
      life: rnd(0.4, 0.9), max: 0.9, rgb: Math.random() < 0.6 ? '251,146,60' : '248,113,113'});
  }
  tries--;
  syncHud();
  if (tries <= 0) { holdT = 1.1; say(t('mlnCrash'), 1.1); return; }
  say(t('mlnCrash') + ' · ' + t('mlnTriesLeft', {n: tries}), 1.7);
  holdT = 1.5;
}

// ── update ──────────────────────────────────────────────────────────────
function update(dt) {
  tSec += dt;
  for (const s of sparks) { s.life -= dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 60 * SCL * dt; }
  if (sparks.length) sparks = sparks.filter(s => s.life > 0);
  for (const p of pops) { p.life -= dt; p.y -= 28 * SCL * dt; }
  if (pops.length) pops = pops.filter(p => p.life > 0);
  if (shake > 0) shake = Math.max(0, shake - dt * 3.2);
  if (goFlash > 0) goFlash = Math.max(0, goFlash - dt * 2);
  if (msgT > 0) { msgT -= dt; if (msgT <= 0) msg = ''; }

  if (state === ST.COUNT) {
    cdLeft -= dt;
    if (cdLeft <= 0) { state = ST.PLAY; goFlash = 0.5; }
    return;
  }
  if (state !== ST.PLAY) return;

  // prestavka po pristati alebo naraze
  if (holdT > 0) {
    holdT -= dt;
    if (holdT <= 0) {
      if (tries <= 0) { endRound(); return; }
      buildTerrain(false);
      resetShip();
      say(t('mlnPadNext', {n: padNo}), 1.6);
      syncHud();
    }
    return;
  }

  const d = D();
  if (keys.left) ship.a -= SPIN * dt;
  if (keys.right) ship.a += SPIN * dt;
  ship.a = clamp(ship.a, -90, 90);

  ship.burning = false;
  if (keys.thrust && ship.fuel > 0) {
    const rad = ship.a * Math.PI / 180;
    ship.vx += Math.sin(rad) * THRUST * SCL * dt;
    ship.vy -= Math.cos(rad) * THRUST * SCL * dt;
    ship.fuel = Math.max(0, ship.fuel - BURN * dt);
    ship.burning = true;
    if (Math.random() < dt * 46) {
      sparks.push({
        x: ship.x - Math.sin(rad) * 10 * SCL, y: ship.y + Math.cos(rad) * 10 * SCL,
        vx: -Math.sin(rad) * 110 * SCL + rnd(-30, 30), vy: Math.cos(rad) * 110 * SCL + rnd(-30, 30),
        life: 0.28, max: 0.28, rgb: Math.random() < 0.5 ? '255,209,102' : '251,146,60',
      });
    }
    syncHud();
  }

  ship.vy += d.grav * SCL * dt;
  ship.x += ship.vx * dt;
  ship.y += ship.vy * dt;
  if (ship.x < 6 * SCL) { ship.x = 6 * SCL; ship.vx = Math.abs(ship.vx) * 0.4; }
  if (ship.x > W - 6 * SCL) { ship.x = W - 6 * SCL; ship.vx = -Math.abs(ship.vx) * 0.4; }
  if (ship.y < 8 * SCL) { ship.y = 8 * SCL; ship.vy = Math.max(0, ship.vy); }

  const surface = groundAt(ship.x);
  const foot = 10 * SCL;
  if (ship.y + foot >= surface) {
    ship.y = surface - foot;
    const onPad = ship.x >= pad.x0 && ship.x <= pad.x1;
    const gentle = Math.abs(ship.vy) <= d.vy * SCL && Math.abs(ship.vx) <= d.vx * SCL && Math.abs(ship.a) <= d.tilt;
    if (onPad && gentle) land(); else crash();
  }
}

// ── kreslenie ───────────────────────────────────────────────────────────
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#04060f');
  sky.addColorStop(0.55, '#0b1024');
  sky.addColorStop(1, '#151a2e');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // planeta v pozadi
  const pr = Math.min(W, H) * 0.26;
  const pg = ctx.createRadialGradient(W * 0.78, H * 0.2, pr * 0.2, W * 0.78, H * 0.2, pr);
  pg.addColorStop(0, 'rgba(148,163,184,0.16)');
  pg.addColorStop(1, 'rgba(148,163,184,0)');
  ctx.fillStyle = pg;
  ctx.beginPath(); ctx.arc(W * 0.78, H * 0.2, pr, 0, 6.2832); ctx.fill();

  for (const s of stars) {
    ctx.globalAlpha = 0.3 + 0.4 * Math.sin(tSec * 1.6 + s.ph);
    ctx.fillStyle = '#fff';
    ctx.fillRect(s.x * W, s.y * H, s.r, s.r);
  }
  ctx.globalAlpha = 1;

  ctx.save();
  if (shake > 0.02) {
    const s = shake * shake * 12 * SCL;
    ctx.translate(rnd(-s, s), rnd(-s, s));
  }

  // terén
  if (ground) {
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x < ground.length; x++) ctx.lineTo(x, ground[x]);
    ctx.lineTo(W, H);
    ctx.closePath();
    const gg = ctx.createLinearGradient(0, H * 0.45, 0, H);
    gg.addColorStop(0, '#232b40');
    gg.addColorStop(1, '#0d1120');
    ctx.fillStyle = gg;
    ctx.fill();
    ctx.strokeStyle = 'rgba(203,213,225,0.75)';
    ctx.lineWidth = 1.6 * SCL;
    ctx.beginPath();
    for (let x = 0; x < ground.length; x++) x ? ctx.lineTo(x, ground[x]) : ctx.moveTo(x, ground[x]);
    ctx.stroke();

    // plosina
    ctx.shadowColor = '#4ade80';
    ctx.shadowBlur = 16 * SCL;
    ctx.strokeStyle = '#4ade80';
    ctx.lineWidth = 4 * SCL;
    ctx.beginPath(); ctx.moveTo(pad.x0, pad.y); ctx.lineTo(pad.x1, pad.y); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#4ade80';
    ctx.fillRect(pad.x0 - 1.5 * SCL, pad.y - 8 * SCL, 3 * SCL, 8 * SCL);
    ctx.fillRect(pad.x1 - 1.5 * SCL, pad.y - 8 * SCL, 3 * SCL, 8 * SCL);
    // vodici pruh nad plosinou – smerom nahor sa vytraca
    const bandTop = Math.max(0, pad.y - H * 0.45);
    const bg2 = ctx.createLinearGradient(0, bandTop, 0, pad.y);
    bg2.addColorStop(0, 'rgba(74,222,128,0)');
    bg2.addColorStop(1, 'rgba(74,222,128,' + (0.075 + 0.03 * Math.sin(tSec * 2.4)).toFixed(3) + ')');
    ctx.fillStyle = bg2;
    ctx.fillRect(pad.x0, bandTop, pad.x1 - pad.x0, pad.y - bandTop);
  }

  // castice
  for (const s of sparks) {
    ctx.globalAlpha = clamp(s.life / s.max, 0, 1);
    ctx.fillStyle = 'rgb(' + s.rgb + ')';
    ctx.fillRect(s.x - 1.4 * SCL, s.y - 1.4 * SCL, 2.8 * SCL, 2.8 * SCL);
  }
  ctx.globalAlpha = 1;

  // lod
  if (ship && ship.alive) {
    const k = SCL;
    ctx.save();
    ctx.translate(ship.x, ship.y);
    ctx.rotate(ship.a * Math.PI / 180);
    if (ship.burning) {
      const fl = (10 + Math.random() * 8) * k;
      const g = ctx.createLinearGradient(0, 7 * k, 0, 7 * k + fl);
      g.addColorStop(0, 'rgba(255,209,102,0.95)');
      g.addColorStop(1, 'rgba(248,113,113,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(-4.4 * k, 7 * k); ctx.lineTo(4.4 * k, 7 * k); ctx.lineTo(0, 7 * k + fl); ctx.closePath(); ctx.fill();
    }
    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = 2 * k;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-5 * k, 6 * k); ctx.lineTo(-8.5 * k, 11 * k);
    ctx.moveTo(5 * k, 6 * k); ctx.lineTo(8.5 * k, 11 * k);
    ctx.stroke();
    const bg = ctx.createLinearGradient(-7 * k, -9 * k, 7 * k, 6 * k);
    bg.addColorStop(0, '#f8fafc');
    bg.addColorStop(1, '#7c8899');
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(0, -10 * k); ctx.lineTo(7 * k, 6 * k); ctx.lineTo(-7 * k, 6 * k);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#38bdf8';
    ctx.shadowColor = '#38bdf8'; ctx.shadowBlur = 8 * k;
    ctx.beginPath(); ctx.arc(0, -1 * k, 2.6 * k, 0, 6.2832); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  for (const p of pops) {
    ctx.globalAlpha = clamp(p.life, 0, 1);
    ctx.fillStyle = 'rgb(' + p.rgb + ')';
    ctx.font = '800 ' + Math.round(17 * SCL) + 'px Syne, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(p.txt, p.x, p.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // ── pristrojove hodnoty
  if (ship && state !== ST.MENU) {
    const d = D();
    const okv = Math.abs(ship.vy) <= d.vy * SCL, okh = Math.abs(ship.vx) <= d.vx * SCL, oka = Math.abs(ship.a) <= d.tilt;
    const fs = Math.round(clamp(11 * SCL, 10, 15));
    ctx.font = '600 ' + fs + 'px "DM Sans", system-ui, sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    const y0 = H - (fs + 6) * 3 - 12;
    // hodnota aj povolena hranica, nech hrac vie, kam sa musi dostat
    const u = v => (Math.abs(v) / SCL / 60).toFixed(2);
    ctx.fillStyle = okv ? '#4ade80' : '#f87171';
    ctx.fillText(t('mlnDown') + ' ' + u(ship.vy) + ' / ' + (d.vy / 60).toFixed(2), 14, y0);
    ctx.fillStyle = okh ? '#4ade80' : '#f87171';
    ctx.fillText(t('mlnDrift') + ' ' + u(ship.vx) + ' / ' + (d.vx / 60).toFixed(2), 14, y0 + fs + 6);
    ctx.fillStyle = oka ? '#4ade80' : '#f87171';
    ctx.fillText(t('mlnTilt') + ' ' + Math.abs(Math.round(ship.a)) + '° / ' + d.tilt + '°', 14, y0 + (fs + 6) * 2);
  }

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (msg) {
    ctx.globalAlpha = clamp(msgT * 2, 0, 1);
    ctx.fillStyle = '#e2e8f0';
    ctx.font = '600 ' + Math.round(clamp(14 * SCL, 12, 20)) + 'px "DM Sans", sans-serif';
    ctx.fillText(msg, W / 2, H * 0.16);
    ctx.globalAlpha = 1;
  }
  if (state === ST.COUNT) {
    const n = Math.ceil(cdLeft);
    const frac = cdLeft - Math.floor(cdLeft);
    ctx.globalAlpha = 0.35 + 0.55 * frac;
    ctx.fillStyle = '#eef3fc';
    ctx.font = '800 ' + Math.round(Math.min(W, H) * 0.2) + 'px Syne, sans-serif';
    ctx.fillText(n > 0 ? String(n) : '', W / 2, H / 2);
    ctx.globalAlpha = 1;
  }
  if (goFlash > 0) {
    ctx.globalAlpha = clamp(goFlash * 2, 0, 1);
    ctx.fillStyle = '#4ade80';
    ctx.font = '800 ' + Math.round(Math.min(W, H) * 0.13) + 'px Syne, sans-serif';
    ctx.fillText(t('uiGo'), W / 2, H / 2);
    ctx.globalAlpha = 1;
  }
  if (state === ST.PAUSE) {
    ctx.fillStyle = 'rgba(4,6,15,0.68)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#eef3fc';
    ctx.font = '800 ' + Math.round(Math.min(W, H) * 0.07) + 'px Syne, sans-serif';
    ctx.fillText(t('uiPaused'), W / 2, H / 2);
    ctx.fillStyle = 'rgba(238,243,252,0.42)';
    ctx.font = '600 12px "DM Sans", sans-serif';
    ctx.fillText(t('uiResume'), W / 2, H / 2 + Math.min(W, H) * 0.06);
  }
}

function frame(ts) {
  requestAnimationFrame(frame);
  const dt = tPrev ? Math.min(0.05, (ts - tPrev) / 1000) : 0;
  tPrev = ts;
  update(dt);
  draw();
}

// ── vstup ───────────────────────────────────────────────────────────────
const KEYMAP = {
  ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right',
  ArrowUp:'thrust', KeyW:'thrust', Space:'thrust',
};
document.addEventListener('keydown', e => {
  if (e.code === 'Escape' || e.code === 'KeyP') {
    e.preventDefault();
    if (state === ST.PLAY || state === ST.PAUSE) togglePause();
    return;
  }
  if (state === ST.PAUSE) { cdLeft = 1.2; state = ST.COUNT; return; }
  if ((state === ST.MENU || state === ST.OVER) && (e.code === 'Enter' || e.code === 'Space')) {
    e.preventDefault(); beginRound(); return;
  }
  const k = KEYMAP[e.code];
  if (!k) return;                        // ostatne klavesy nechavam prehliadacu
  e.preventDefault();
  keys[k] = true;
});
document.addEventListener('keyup', e => {
  const k = KEYMAP[e.code];
  if (k) keys[k] = false;
});
function bindBtn(id, k) {
  const el = document.getElementById(id);
  const on = e => { e.preventDefault(); el.classList.add('on'); keys[k] = true; };
  const off = e => { if (e) e.preventDefault(); el.classList.remove('on'); keys[k] = false; };
  el.addEventListener('pointerdown', on, {passive: false});
  el.addEventListener('pointerup', off);
  el.addEventListener('pointerleave', off);
  el.addEventListener('pointercancel', off);
}
bindBtn('btn-left', 'left');
bindBtn('btn-right', 'right');
bindBtn('btn-thrust', 'thrust');
// tuknutie na plochu = pohon (aj na desktope drzanim mysi)
cv.addEventListener('pointerdown', e => {
  if (state === ST.PAUSE) { cdLeft = 1.2; state = ST.COUNT; return; }
  keys.thrust = true;
});
cv.addEventListener('pointerup', () => { keys.thrust = false; });
cv.addEventListener('pointercancel', () => { keys.thrust = false; });
cv.addEventListener('pointerleave', () => { keys.thrust = false; });
document.getElementById('pause-btn').addEventListener('click', togglePause);
window.addEventListener('blur', () => { if (state === ST.PLAY) state = ST.PAUSE; for (const k in keys) keys[k] = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === ST.PLAY) state = ST.PAUSE; });

// ── obtiaznost ──────────────────────────────────────────────────────────
const row = document.getElementById('diff-row');
DIFFS.forEach((d, i) => {
  const b = document.createElement('button');
  b.textContent = t(d.key);
  b.className = i === diffIdx ? 'active' : '';
  b.addEventListener('click', () => {
    diffIdx = i;
    [...row.children].forEach((c, j) => c.className = j === i ? 'active' : '');
    loadBest();
    tries = DIFFS[i].tries;
    if (state === ST.OVER) document.getElementById('res-note').textContent = t('uiBest') + ' ' + best;
  });
  row.appendChild(b);
});
document.getElementById('ov-play').addEventListener('click', beginRound);

applyLang();
if (isTouch) document.body.classList.add('touch');
resize();
loadBest();
resetShip();
tries = D().tries;
showCard('menu');
requestAnimationFrame(frame);
</script>
