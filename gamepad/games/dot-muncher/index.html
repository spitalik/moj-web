<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dot Muncher · GamePad</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<script src="../../i18n.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#04060f;--text:#eaf0ff;--muted:rgba(234,240,255,0.42);--dim:rgba(234,240,255,0.18);
  --border:rgba(255,255,255,0.08);--border-h:rgba(255,255,255,0.17);
  --c:#22c55e;--c2:#7c93ff;--gold:#fde047;--danger:#f43f5e;
}
html,body{background:var(--bg);min-height:100%;font-family:'DM Sans',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
body{overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:
  radial-gradient(700px 430px at 50% -12%,rgba(124,147,255,0.11),transparent 70%),
  radial-gradient(520px 380px at 98% 106%,rgba(34,197,94,0.07),transparent 72%);}
button{font-family:'DM Sans',sans-serif;touch-action:manipulation;}

#back-btn{position:fixed;top:14px;left:14px;z-index:60;display:flex;align-items:center;gap:7px;background:rgba(7,10,20,0.75);backdrop-filter:blur(8px);border:1px solid var(--border);color:var(--muted);padding:7px 14px;border-radius:100px;text-decoration:none;font-size:12px;font-weight:500;transition:border-color .18s,color .18s;}
#back-btn:hover,#back-btn:active{border-color:var(--border-h);color:var(--text);}
@media(max-width:520px){#back-btn{top:9px;left:9px;padding:6px 11px;font-size:11px;}}

.page{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:52px 10px 12px;}
.title{font-family:'Syne',sans-serif;font-weight:800;font-size:20px;letter-spacing:-.4px;background:linear-gradient(110deg,#fff 26%,var(--c) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}

.pills{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;}
.pill{display:flex;align-items:center;gap:7px;padding:4px 11px;border-radius:100px;background:rgba(255,255,255,0.04);border:1px solid var(--border);font-size:8.5px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;color:var(--dim);white-space:nowrap;}
.pill b{font-family:'Syne',sans-serif;font-size:14px;font-weight:800;letter-spacing:0;font-variant-numeric:tabular-nums;color:var(--c);transition:transform .18s;}
.pill.lvl b{color:var(--c2);}
.pill.best b{color:var(--gold);}
.pill.best.record{border-color:rgba(253,224,71,.45);}
.pill b.bump{transform:scale(1.3);}
.lifes{display:flex;gap:4px;}
.life{width:9px;height:9px;border-radius:3px;background:var(--c);box-shadow:0 0 8px rgba(34,197,94,.9);}
.life.gone{background:rgba(255,255,255,0.13);box-shadow:none;}

.seg{display:flex;gap:3px;background:rgba(255,255,255,0.04);border:1px solid var(--border);padding:3px;border-radius:100px;}
.seg button{background:transparent;border:none;color:var(--muted);padding:5px 14px;border-radius:100px;font-size:11.5px;font-weight:600;cursor:pointer;transition:color .16s,background .16s;}
.seg button:hover{color:var(--text);}
.seg button.active{background:rgba(34,197,94,0.16);color:#c9ffdb;box-shadow:inset 0 0 0 1px rgba(34,197,94,0.42);}

#board-wrap{position:relative;padding:8px;border-radius:18px;background:linear-gradient(165deg,rgba(255,255,255,0.05),rgba(255,255,255,0.012));border:1px solid var(--border-h);box-shadow:0 24px 60px -30px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.06);}
canvas{display:block;border-radius:12px;touch-action:none;}

.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center;}
.tool{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--muted);padding:8px 14px;border-radius:100px;font-size:11.5px;font-weight:600;cursor:pointer;transition:all .16s;}
.tool:hover{border-color:var(--border-h);color:var(--text);}
.tool svg{width:14px;height:14px;}
.tool.primary{border-color:rgba(34,197,94,0.4);color:#c9ffdb;background:rgba(34,197,94,0.12);}
#status{font-size:11.5px;color:var(--muted);min-height:16px;text-align:center;}
#status.warn{color:var(--gold);}

#pad{display:none;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,46px);gap:6px;justify-content:center;}
body.touch #pad{display:grid;}
#pad button{background:linear-gradient(160deg,rgba(255,255,255,0.07),rgba(255,255,255,0.02));border:1px solid var(--border);color:var(--muted);border-radius:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .1s;}
#pad button svg{width:18px;height:18px;}
#pad button:active{background:rgba(34,197,94,0.2);border-color:rgba(34,197,94,0.5);color:var(--c);transform:scale(.94);}
#pad .up{grid-column:2;grid-row:1;}
#pad .left{grid-column:1;grid-row:2;}
#pad .down{grid-column:2;grid-row:2;}
#pad .right{grid-column:3;grid-row:2;}

#overlay{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(ellipse at center,rgba(7,10,20,0.82) 0%,rgba(2,4,8,0.95) 78%);backdrop-filter:blur(6px);}
#overlay.hide{display:none;}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:11px;width:100%;max-width:334px;padding:26px 24px 24px;border-radius:24px;background:linear-gradient(165deg,rgba(255,255,255,0.06),rgba(255,255,255,0.015));border:1px solid var(--border-h);box-shadow:0 30px 70px -28px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.07);animation:pop .34s cubic-bezier(.2,1.4,.4,1);}
@keyframes pop{from{transform:scale(.9) translateY(8px);opacity:0;}to{transform:none;opacity:1;}}
.card::before{content:'';position:absolute;inset:-1px;border-radius:24px;padding:1px;background:linear-gradient(120deg,rgba(34,197,94,.5),transparent 42%,transparent 58%,rgba(124,147,255,.5));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;}
.emoji{font-size:34px;line-height:1;filter:drop-shadow(0 6px 16px rgba(34,197,94,.4));}
.ttl{font-family:'Syne',sans-serif;font-weight:800;font-size:23px;letter-spacing:-.5px;text-align:center;background:linear-gradient(110deg,var(--c) 5%,#fff 52%,var(--c2) 95%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
#result{display:none;flex-direction:column;align-items:center;gap:1px;}
#result.show{display:flex;}
#res-lbl{font-size:9px;letter-spacing:2.2px;text-transform:uppercase;color:var(--dim);}
#res-score{font-family:'Syne',sans-serif;font-weight:800;font-size:48px;line-height:1.05;letter-spacing:-2px;color:var(--c);text-shadow:0 0 30px rgba(34,197,94,.4);}
#res-note{font-size:11.5px;font-weight:600;color:var(--muted);}
#res-note.record{color:var(--gold);}
#ov-stats{display:none;width:100%;grid-template-columns:1fr 1fr;gap:7px;}
#ov-stats.show{display:grid;}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:14px;background:rgba(255,255,255,0.04);border:1px solid var(--border);}
.stat i{font-size:8px;font-style:normal;letter-spacing:1.3px;text-transform:uppercase;color:var(--dim);text-align:center;}
.stat b{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;color:var(--c2);white-space:nowrap;}
.lbl{font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);}
.hint{font-size:11.5px;line-height:1.5;color:var(--muted);text-align:center;}
.play-btn{margin-top:3px;width:100%;padding:13px 30px;border-radius:100px;border:1px solid rgba(34,197,94,.5);background:linear-gradient(180deg,rgba(34,197,94,.24),rgba(34,197,94,.1));color:#d6ffe6;font-size:14px;font-weight:600;cursor:pointer;transition:all .18s;}
.play-btn:hover{background:linear-gradient(180deg,rgba(34,197,94,.34),rgba(34,197,94,.16));color:#fff;box-shadow:0 0 24px -6px rgba(34,197,94,.5);}
.play-btn:active{transform:translateY(1px);}
@media (max-height:820px){#overlay{align-items:flex-start !important;overflow-y:auto !important;}}
@media(max-height:700px){.title{display:none;}.page{padding-top:44px;gap:6px;}}
@media(max-width:380px){.seg button{padding:5px 10px;font-size:11px;}.tool{padding:7px 11px;font-size:11px;}}

/* krajina na nizkych obrazovkach: doska vlavo, ovladanie vpravo */
@media (orientation:landscape) and (max-height:560px){
  .page{display:grid;grid-template-columns:auto minmax(150px,200px);align-content:center;justify-content:center;
        column-gap:16px;row-gap:6px;padding:6px 12px 6px 88px;min-height:100vh;}
  .title{display:none;}
  #board-wrap{grid-column:1;grid-row:1 / span 5;align-self:center;padding:6px;}
  .pills{grid-column:2;grid-row:1;flex-wrap:wrap;max-width:200px;gap:4px;}
  .pill{padding:3px 8px;font-size:8px;}
  .pill b{font-size:12px;}
  .seg{grid-column:2;grid-row:2;justify-self:center;}
  .seg button{padding:4px 9px;font-size:10.5px;}
  .tools{grid-column:2;grid-row:3;max-width:200px;}
  #pad{grid-column:2;grid-row:4;justify-self:center;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(2,36px);}
  #status{grid-column:2;grid-row:5;font-size:10px;max-width:200px;}
  #back-btn{padding:5px 11px;font-size:11px;}
}
</style>
</head>
<body>
<a href="../../index.html" id="back-btn">
  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
  <span id="lbl-back"></span>
</a>

<div class="page" id="page">
  <div class="title" id="lbl-title"></div>

  <div class="pills">
    <div class="pill"><span id="lbl-score"></span><b id="hud-score">0</b></div>
    <div class="pill lvl"><span id="lbl-level"></span><b id="hud-level">1</b></div>
    <div class="pill"><div class="lifes" id="lifes"></div></div>
    <div class="pill best" id="best-pill"><span id="lbl-best"></span><b id="hud-best">0</b></div>
  </div>

  <div class="seg" id="diff-row"></div>

  <div id="board-wrap"><canvas id="c"></canvas></div>

  <div class="tools">
    <button class="tool" id="btn-pause">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1.4"/><rect x="14" y="4" width="4" height="16" rx="1.4"/></svg>
      <span id="lbl-pause"></span></button>
    <button class="tool primary" id="btn-new">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
      <span id="lbl-new"></span></button>
  </div>

  <div id="pad">
    <button class="up" data-dir="up" aria-label="up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    <button class="left" data-dir="left" aria-label="left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg></button>
    <button class="down" data-dir="down" aria-label="down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg></button>
    <button class="right" data-dir="right" aria-label="right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
  </div>
  <div id="status"></div>
</div>

<div id="overlay">
  <div class="card">
    <div id="brand"><div class="emoji">👻</div></div>
    <div class="ttl" id="ov-title"></div>
    <div id="result">
      <div id="res-lbl"></div>
      <div id="res-score">0</div>
      <div id="res-note"></div>
    </div>
    <div id="ov-stats">
      <div class="stat"><i id="lbl-s-level"></i><b id="st-level">1</b></div>
      <div class="stat"><i id="lbl-s-best"></i><b id="st-best">0</b></div>
    </div>
    <div class="lbl" id="lbl-diff"></div>
    <div class="seg" id="diff-row2"></div>
    <div class="hint" id="ov-hint"></div>
    <button class="play-btn" id="ov-play"></button>
  </div>
</div>

<script>
// ── vlastne bludisko (17 x 19) ──────────────────────────────────────────
const MAZE = [
  '#################',
  '#.......#.......#',
  '#o##.##.#.##.##o#',
  '#.##.##.#.##.##.#',
  '#...............#',
  '#.##.#.###.#.##.#',
  '#....#..#..#....#',
  '####.##.#.##.####',
  '#......#.#......#',
  '#.####.....####.#',
  '#......#.#......#',
  '####.##.#.##.####',
  '#....#..#..#....#',
  '#.##.#.###.#.##.#',
  '#...............#',
  '#.##.##.#.##.##.#',
  '#o##.##.#.##.##o#',
  '#.......#.......#',
  '#################',
];
const COLS = MAZE[0].length, ROWS = MAZE.length;
const START = {r: 14, c: 8};
const DENS = [{r: 9, c: 7}, {r: 8, c: 8}, {r: 9, c: 9}, {r: 10, c: 8}];
const DIRS = {up: [-1, 0], down: [1, 0], left: [0, -1], right: [0, 1]};
const OPP = {up: 'down', down: 'up', left: 'right', right: 'left'};
const HUNT_RGB = ['168,85,247', '251,191,36', '14,165,233', '244,63,94'];

// vlastne bodovanie
const P_DOT = 12, P_PELLET = 60, P_HUNT = 120, P_LEVEL = 250;

const DIFFS = [
  {id:'easy',   key:'diffEasy',   lives:4, ghost:0.72, fright:7.0},
  {id:'medium', key:'diffMedium', lives:3, ghost:0.86, fright:6.0},
  {id:'hard',   key:'diffHard',   lives:2, ghost:1.00, fright:4.6},
];
let diffIdx = 1;
const D = () => DIFFS[diffIdx];
const bestKey = () => 'dotmuncher_best_' + D().id;

const ST = {MENU:0, PLAY:1, PAUSE:2, OVER:3};
let state = ST.MENU;

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let TS = 20, DPR = 1, BW = 0, BH = 0;

let walls = [], dots = [], dotsLeft = 0;
let hero = null, hunts = [], level = 1, lives = 3, score = 0, best = 0;
let fright = 0, chain = 0, frozen = 0, queued = null;
let parts = [], pops = [], banner = 0, bannerTxt = '';
let tPrev = 0, tSec = 0;
const isTouch = window.matchMedia('(pointer: coarse)').matches;

function applyLang() {
  document.getElementById('lbl-back').textContent  = t('back');
  document.getElementById('lbl-title').textContent = t('dmuTitle');
  document.getElementById('lbl-score').textContent = t('uiScore');
  document.getElementById('lbl-level').textContent = t('uiLevel');
  document.getElementById('lbl-best').textContent  = t('uiBest');
  document.getElementById('lbl-pause').textContent = t('uiPaused');
  document.getElementById('lbl-new').textContent   = t('uiNewGame');
  document.getElementById('lbl-s-level').textContent = t('uiLevel');
  document.getElementById('lbl-s-best').textContent  = t('uiBest');
  document.getElementById('res-lbl').textContent   = t('uiScore');
  document.getElementById('lbl-diff').textContent  = t('uiDifficulty');
}
function rnd(a, b) { return a + Math.random() * (b - a); }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
const isWall = (r, c) => r < 0 || r >= ROWS || c < 0 || c >= COLS || walls[r][c];
const setStatus = (m, cls) => { const el = document.getElementById('status'); el.textContent = m; el.className = cls || ''; };

// ── rozmery ─────────────────────────────────────────────────────────────
function layout() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const vw = window.innerWidth || 360, vh = window.innerHeight || 640;
  const page = document.getElementById('page'), wrap = document.getElementById('board-wrap');
  let others = 0, n = 0;
  for (const el of page.children) { n++; if (el !== wrap) others += el.offsetHeight; }
  const cs = getComputedStyle(page);
  const gap = parseFloat(cs.rowGap) || 9;
  const pad = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  const chrome = others + gap * Math.max(0, n - 1) + pad + 24;
  let boxW, boxH;
  if (vh <= 560 && vw > vh) { boxW = vw - 330; boxH = vh - 34; }
  else { boxW = Math.min(vw, 620) - 34; boxH = Math.max(180, vh - chrome); }
  TS = Math.max(11, Math.floor(Math.min(boxW / COLS, boxH / ROWS)));
  BW = TS * COLS; BH = TS * ROWS;
  cv.style.width = BW + 'px';
  cv.style.height = BH + 'px';
  cv.width = Math.round(BW * DPR);
  cv.height = Math.round(BH * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 250));

// ── stavba ──────────────────────────────────────────────────────────────
function buildMaze() {
  walls = MAZE.map(row => [...row].map(ch => ch === '#'));
  dots = MAZE.map(row => [...row].map(ch => ch === '.' ? 1 : (ch === 'o' ? 2 : 0)));
  dots[START.r][START.c] = 0;
  for (const d of DENS) dots[d.r][d.c] = 0;
  dotsLeft = dots.flat().filter(v => v > 0).length;
}
function spawn() {
  hero = {r: START.r, c: START.c, x: START.c + 0.5, y: START.r + 0.5, dir: 'left', spin: 0};
  hunts = DENS.map((d, i) => ({r: d.r, c: d.c, x: d.c + 0.5, y: d.r + 0.5,
    dir: i % 2 ? 'up' : 'down', kind: i, eaten: false}));
  queued = null;
  fright = 0; chain = 0;
}

// ── pohyb (v mrieznych jednotkach za sekundu) ───────────────────────────
const HERO_SPD = 5.4;
const atMid = e => Math.abs(e.x - (e.c + 0.5)) < 0.06 && Math.abs(e.y - (e.r + 0.5)) < 0.06;
function canGo(r, c, dir) { const [dr, dc] = DIRS[dir]; return !isWall(r + dr, c + dc); }
function step(e, d) {
  const [dr, dc] = DIRS[e.dir];
  e.x += dc * d; e.y += dr * d;
  e.r = clamp(Math.floor(e.y), 0, ROWS - 1);
  e.c = clamp(Math.floor(e.x), 0, COLS - 1);
  const mx = e.c + 0.5, my = e.r + 0.5;
  if (!canGo(e.r, e.c, e.dir)) {
    if (e.dir === 'left' && e.x < mx) e.x = mx;
    if (e.dir === 'right' && e.x > mx) e.x = mx;
    if (e.dir === 'up' && e.y < my) e.y = my;
    if (e.dir === 'down' && e.y > my) e.y = my;
  }
  // drzim sa stredu chodby
  if (e.dir === 'left' || e.dir === 'right') e.y += (my - e.y) * 0.45;
  else e.x += (mx - e.x) * 0.45;
}
function heroTick(d) {
  if (queued && atMid(hero) && canGo(hero.r, hero.c, queued)) { hero.dir = queued; queued = null; }
  step(hero, d);
  hero.spin += d * 2.4;
  const v = dots[hero.r][hero.c];
  if (v) {
    dots[hero.r][hero.c] = 0;
    dotsLeft--;
    score += v === 2 ? P_PELLET : P_DOT;
    if (v === 2) {
      fright = D().fright; chain = 0;
      for (let i = 0; i < 14; i++) {
        const a = rnd(0, 6.2832), sp = rnd(0.6, 3);
        parts.push({x: hero.x, y: hero.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rnd(0.25, 0.6), max: 0.6, rgb: '253,224,71'});
      }
    }
    syncHud();
  }
  if (!dotsLeft) nextLevel();
}
const md = (ar, ac, br, bc) => Math.abs(ar - br) + Math.abs(ac - bc);
function target(g) {
  if (g.eaten) return DENS[g.kind];
  if (fright > 0) return {r: ROWS - 1 - hero.r, c: COLS - 1 - hero.c};
  if (g.kind === 1) { const [dr, dc] = DIRS[hero.dir]; return {r: hero.r + dr * 4, c: hero.c + dc * 4}; }
  if (g.kind === 3) return {r: Math.floor(Math.random() * ROWS), c: Math.floor(Math.random() * COLS)};
  return hero;
}
function huntTick(g, d) {
  if (atMid(g)) {
    const tg = target(g);
    const opts = Object.keys(DIRS).filter(k => canGo(g.r, g.c, k));
    const fwd = opts.filter(k => k !== OPP[g.dir]);
    const pool = fwd.length ? fwd : opts;
    let bd = pool[0], bv = Infinity;
    for (const k of pool) {
      const [dr, dc] = DIRS[k];
      const v = md(g.r + dr, g.c + dc, tg.r, tg.c);
      if (v < bv) { bv = v; bd = k; }
    }
    g.dir = bd;
  }
  step(g, d);
  if (g.eaten && g.r === DENS[g.kind].r && g.c === DENS[g.kind].c && atMid(g)) g.eaten = false;
}
function collisions() {
  for (const g of hunts) {
    if (g.eaten) continue;
    if (Math.hypot(g.x - hero.x, g.y - hero.y) > 0.7) continue;
    if (fright > 0) {
      g.eaten = true;
      chain = Math.min(chain + 1, 4);
      const gain = P_HUNT * chain * chain;
      score += gain;
      pops.push({x: g.x, y: g.y, txt: '+' + gain, life: 0.9, rgb: HUNT_RGB[g.kind]});
      for (let i = 0; i < 16; i++) {
        const a = rnd(0, 6.2832), sp = rnd(0.8, 3.4);
        parts.push({x: g.x, y: g.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rnd(0.3, 0.7), max: 0.7, rgb: HUNT_RGB[g.kind]});
      }
      syncHud();
    } else {
      lives--;
      syncHud();
      for (let i = 0; i < 22; i++) {
        const a = rnd(0, 6.2832), sp = rnd(0.8, 3.6);
        parts.push({x: hero.x, y: hero.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rnd(0.3, 0.8), max: 0.8, rgb: '34,197,94'});
      }
      if (lives <= 0) { finish(); return; }
      spawn();
      frozen = 1.1;
      setStatus(t('dmuCaught'), 'warn');
      return;
    }
  }
}
function nextLevel() {
  level++;
  score += P_LEVEL * (level - 1);
  buildMaze();
  spawn();
  frozen = 1.3;
  banner = 1.6;
  bannerTxt = t('dmuNextLevel', {n: level});
  setStatus('', '');
  syncHud();
}
function finish() {
  state = ST.OVER;
  const rec = score > best;
  if (rec) { best = score; try { localStorage.setItem(bestKey(), best); } catch (e) {} }
  document.getElementById('res-score').textContent = score;
  const note = document.getElementById('res-note');
  note.textContent = rec ? t('uiNewRecord') : t('uiBest') + ' ' + best;
  note.classList.toggle('record', rec);
  document.getElementById('st-level').textContent = level;
  document.getElementById('st-best').textContent = best;
  setHud('hud-best', best);
  document.getElementById('best-pill').classList.toggle('record', rec);
  setStatus('', '');
  setTimeout(() => showCard('over'), 600);
}
function showCard(mode) {
  document.getElementById('ov-title').textContent = mode === 'over' ? t('uiGameOver') : t('dmuTitle');
  document.getElementById('brand').style.display = mode === 'over' ? 'none' : '';
  document.getElementById('result').classList.toggle('show', mode === 'over');
  document.getElementById('ov-stats').classList.toggle('show', mode === 'over');
  document.getElementById('ov-hint').textContent = t('dmuRules');
  document.getElementById('ov-play').textContent = mode === 'over' ? t('uiPlayAgain') : t('uiStart');
  document.getElementById('overlay').classList.remove('hide');
}

// ── HUD ─────────────────────────────────────────────────────────────────
const hudVal = {};
function setHud(id, v) {
  if (hudVal[id] === v) return;
  hudVal[id] = v;
  const el = document.getElementById(id);
  el.textContent = v;
  el.classList.remove('bump');
  void el.offsetWidth;
  el.classList.add('bump');
  setTimeout(() => el.classList.remove('bump'), 180);
}
function syncHud(force) {
  setHud('hud-score', score);
  setHud('hud-level', level);
  const box = document.getElementById('lifes');
  const total = D().lives;
  if (box.children.length !== total) {
    box.textContent = '';
    for (let i = 0; i < total; i++) { const d = document.createElement('div'); d.className = 'life'; box.appendChild(d); }
  }
  [...box.children].forEach((d, i) => d.classList.toggle('gone', i >= lives));
  if (force) setHud('hud-best', best);
}
function loadBest() {
  best = +(localStorage.getItem(bestKey()) || 0);
  setHud('hud-best', best);
  document.getElementById('best-pill').classList.remove('record');
}
function newGame() {
  level = 1; lives = D().lives; score = 0;
  buildMaze(); spawn();
  parts = []; pops = []; banner = 0;
  frozen = 0.8; fright = 0; chain = 0;
  state = ST.PLAY;
  document.getElementById('overlay').classList.add('hide');
  loadBest();
  layout();
  setStatus(t('dmuHint'), '');
  syncHud(true);
}
function togglePause() {
  if (state === ST.PLAY) { state = ST.PAUSE; setStatus(t('uiPaused'), 'warn'); }
  else if (state === ST.PAUSE) { state = ST.PLAY; setStatus('', ''); }
}

// ── update ──────────────────────────────────────────────────────────────
function update(dt) {
  tSec += dt;
  for (const p of parts) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  if (parts.length) parts = parts.filter(p => p.life > 0);
  for (const p of pops) { p.life -= dt; p.y -= 0.9 * dt; }
  if (pops.length) pops = pops.filter(p => p.life > 0);
  if (banner > 0) banner = Math.max(0, banner - dt);
  if (state !== ST.PLAY) return;
  if (frozen > 0) { frozen = Math.max(0, frozen - dt); return; }
  if (fright > 0) fright = Math.max(0, fright - dt);
  heroTick(HERO_SPD * dt);
  const gs = D().ghost * (fright > 0 ? 0.62 : 1) * 4.6;
  for (const g of hunts) huntTick(g, (g.eaten ? gs * 1.7 : gs) * dt);
  collisions();
}

// ── kreslenie ───────────────────────────────────────────────────────────
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, BW, BH);
  const bg = ctx.createLinearGradient(0, 0, BW, BH);
  bg.addColorStop(0, '#0a1030');
  bg.addColorStop(1, '#050818');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, BW, BH);

  // steny — neonove bloky
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (!walls[r][c]) continue;
    const x = c * TS, y = r * TS;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x + TS * 0.13, y + TS * 0.13, TS * 0.74, TS * 0.74, TS * 0.22);
    else ctx.rect(x + TS * 0.13, y + TS * 0.13, TS * 0.74, TS * 0.74);
    const g = ctx.createLinearGradient(x, y, x + TS, y + TS);
    g.addColorStop(0, 'rgba(58,70,168,0.55)');
    g.addColorStop(1, 'rgba(22,26,77,0.75)');
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = 'rgba(124,147,255,0.55)';
    ctx.lineWidth = Math.max(1, TS * 0.06);
    ctx.stroke();
  }

  // body a energeticke pilulky
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const v = dots[r][c];
    if (!v) continue;
    const x = c * TS + TS / 2, y = r * TS + TS / 2;
    if (v === 2) {
      const pl = 0.8 + 0.2 * Math.sin(tSec * 6);
      ctx.fillStyle = '#fde047';
      ctx.shadowColor = 'rgba(253,224,71,0.9)';
      ctx.shadowBlur = TS * 0.6;
      ctx.beginPath(); ctx.arc(x, y, TS * 0.26 * pl, 0, 6.2832); ctx.fill();
      ctx.shadowBlur = 0;
    } else {
      ctx.fillStyle = 'rgba(230,226,200,0.9)';
      ctx.beginPath(); ctx.arc(x, y, TS * 0.10, 0, 6.2832); ctx.fill();
    }
  }

  // hrdina — rotujuci rezaci blok (vlastny tvar, nie klin s ustami)
  const hx = hero.x * TS, hy = hero.y * TS;
  const pulse = 0.86 + 0.14 * Math.abs(Math.sin(hero.spin * 2));
  const hr = TS * 0.40 * pulse;
  ctx.save();
  ctx.translate(hx, hy);
  ctx.rotate(hero.spin);
  ctx.shadowColor = 'rgba(34,197,94,0.9)';
  ctx.shadowBlur = TS * 0.5;
  const hg = ctx.createLinearGradient(-hr, -hr, hr, hr);
  hg.addColorStop(0, '#4ade80');
  hg.addColorStop(1, '#16a34a');
  ctx.fillStyle = hg;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(-hr, -hr, hr * 2, hr * 2, hr * 0.35);
  else ctx.rect(-hr, -hr, hr * 2, hr * 2);
  ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#ecfdf5';
  ctx.beginPath(); ctx.arc(hx, hy, hr * 0.34, 0, 6.2832); ctx.fill();
  const [hdr, hdc] = DIRS[hero.dir];
  ctx.fillStyle = '#bbf7d0';
  ctx.beginPath(); ctx.arc(hx + hdc * hr * 1.2, hy + hdr * hr * 1.2, hr * 0.22, 0, 6.2832); ctx.fill();

  // stihaci — sesťhranne drony s jednou skenovacou strbinou
  for (const g of hunts) {
    const gx = g.x * TS, gy = g.y * TS, rad = TS * 0.42;
    ctx.beginPath();
    for (let k = 0; k < 6; k++) {
      const a = -Math.PI / 2 + k * Math.PI / 3;
      const px = gx + rad * Math.cos(a), py = gy + rad * 0.94 * Math.sin(a);
      k ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath();
    if (g.eaten) ctx.fillStyle = 'rgba(148,163,184,0.3)';
    else if (fright > 0) ctx.fillStyle = (fright < 1.6 && Math.floor(fright * 6) % 2) ? '#e2e8f0' : '#475569';
    else {
      ctx.shadowColor = 'rgba(' + HUNT_RGB[g.kind] + ',0.85)';
      ctx.shadowBlur = TS * 0.45;
      ctx.fillStyle = 'rgb(' + HUNT_RGB[g.kind] + ')';
    }
    ctx.fill();
    ctx.shadowBlur = 0;
    if (!g.eaten) {
      ctx.fillStyle = 'rgba(8,10,20,0.72)';
      ctx.fillRect(gx - rad * 0.62, gy - rad * 0.16, rad * 1.24, rad * 0.32);
      ctx.fillStyle = fright > 0 ? '#94a3b8' : '#f8fafc';
      ctx.fillRect(gx - rad * 0.1, gy - rad * 0.11, rad * 0.2, rad * 0.22);
    }
  }

  for (const p of parts) {
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = 'rgb(' + p.rgb + ')';
    ctx.beginPath();
    ctx.arc(p.x * TS, p.y * TS, TS * 0.09, 0, 6.2832);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const p of pops) {
    ctx.globalAlpha = clamp(p.life / 0.9, 0, 1);
    ctx.font = '800 ' + Math.round(TS * 0.62) + "px 'Syne',sans-serif";
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(4,6,15,0.85)';
    ctx.strokeText(p.txt, p.x * TS, p.y * TS);
    ctx.fillStyle = 'rgb(' + p.rgb + ')';
    ctx.fillText(p.txt, p.x * TS, p.y * TS);
  }
  ctx.globalAlpha = 1;

  // ukazovatel energie
  if (fright > 0) {
    const w = BW * (fright / D().fright);
    ctx.fillStyle = 'rgba(253,224,71,0.22)';
    ctx.fillRect(0, BH - TS * 0.16, BW, TS * 0.16);
    ctx.fillStyle = '#fde047';
    ctx.fillRect(0, BH - TS * 0.16, w, TS * 0.16);
  }

  if (banner > 0) {
    ctx.globalAlpha = clamp(Math.min(banner / 0.3, (1.6 - banner) / 0.2), 0, 1);
    ctx.font = '800 ' + Math.round(TS * 1.1) + "px 'Syne',sans-serif";
    ctx.fillStyle = 'rgba(234,240,255,0.95)';
    ctx.shadowColor = 'rgba(124,147,255,0.7)';
    ctx.shadowBlur = 18;
    ctx.fillText(bannerTxt, BW / 2, BH / 2);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }
  if (state === ST.PAUSE) {
    ctx.fillStyle = 'rgba(4,6,15,0.7)';
    ctx.fillRect(0, 0, BW, BH);
    ctx.font = '800 ' + Math.round(TS * 1.1) + "px 'Syne',sans-serif";
    ctx.fillStyle = '#fde047';
    ctx.fillText(t('uiPaused'), BW / 2, BH / 2);
  }
}

function frame(ts) {
  requestAnimationFrame(frame);
  const dt = tPrev ? Math.min(0.05, (ts - tPrev) / 1000) : 0;
  tPrev = ts;
  update(dt);
  draw();
}

// ── vstup ───────────────────────────────────────────────────────────────
const KEYS = {ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
  KeyW:'up', KeyS:'down', KeyA:'left', KeyD:'right'};
document.addEventListener('keydown', e => {
  if (e.code === 'Escape' || e.code === 'KeyP') { e.preventDefault(); togglePause(); return; }
  if ((state === ST.MENU || state === ST.OVER) && (e.code === 'Enter' || e.code === 'Space')) { e.preventDefault(); newGame(); return; }
  const d = KEYS[e.code];
  if (!d) return;
  e.preventDefault();
  queued = d;
});
document.querySelectorAll('#pad button').forEach(b => {
  b.addEventListener('pointerdown', e => { e.preventDefault(); queued = b.dataset.dir; }, {passive: false});
});
let tStart = null;
cv.addEventListener('pointerdown', e => { tStart = [e.clientX, e.clientY]; }, {passive: true});
cv.addEventListener('pointerup', e => {
  if (!tStart) return;
  const dx = e.clientX - tStart[0], dy = e.clientY - tStart[1];
  tStart = null;
  if (Math.abs(dx) < 16 && Math.abs(dy) < 16) return;
  queued = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
});
document.getElementById('btn-pause').addEventListener('click', togglePause);
document.getElementById('btn-new').addEventListener('click', newGame);
document.getElementById('ov-play').addEventListener('click', newGame);
window.addEventListener('blur', () => { if (state === ST.PLAY) { state = ST.PAUSE; setStatus(t('uiPaused'), 'warn'); } });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === ST.PLAY) { state = ST.PAUSE; setStatus(t('uiPaused'), 'warn'); } });

// ── obtiaznost ──────────────────────────────────────────────────────────
function buildDiffs(el) {
  el.textContent = '';
  DIFFS.forEach((d, i) => {
    const b = document.createElement('button');
    b.textContent = t(d.key);
    b.className = i === diffIdx ? 'active' : '';
    b.addEventListener('click', () => { diffIdx = i; syncDiffs(); newGame(); });
    el.appendChild(b);
  });
}
function syncDiffs() {
  [document.getElementById('diff-row'), document.getElementById('diff-row2')].forEach(row => {
    [...row.children].forEach((b, j) => b.className = j === diffIdx ? 'active' : '');
  });
}

applyLang();
buildDiffs(document.getElementById('diff-row'));
buildDiffs(document.getElementById('diff-row2'));
if (isTouch) document.body.classList.add('touch');
buildMaze();
spawn();
level = 1; lives = D().lives; score = 0;
layout();
loadBest();
syncHud(true);
showCard('menu');
requestAnimationFrame(frame);
</script>
