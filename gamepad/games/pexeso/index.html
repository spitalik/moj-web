<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pexeso · GamePad</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<script src="../../i18n.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0a0806;--text:#f7f1e6;--muted:rgba(247,241,230,0.42);--dim:rgba(247,241,230,0.18);
  --border:rgba(255,255,255,0.08);--border-h:rgba(255,255,255,0.17);
  --c:#e8d5a3;--c2:#8ab4ff;--ok:#4ade80;--gold:#ffd166;
  --cs:76px;--cols:4;
}
html,body{background:var(--bg);min-height:100%;font-family:'DM Sans',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
body{overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:
  radial-gradient(700px 430px at 50% -12%,rgba(232,213,163,0.10),transparent 70%),
  radial-gradient(520px 380px at 98% 106%,rgba(138,180,255,0.07),transparent 72%);}
button{font-family:'DM Sans',sans-serif;touch-action:manipulation;}

#back-btn{position:fixed;top:14px;left:14px;z-index:60;display:flex;align-items:center;gap:7px;background:rgba(12,10,8,0.75);backdrop-filter:blur(8px);border:1px solid var(--border);color:var(--muted);padding:7px 14px;border-radius:100px;text-decoration:none;font-size:12px;font-weight:500;transition:border-color .18s,color .18s;}
#back-btn:hover,#back-btn:active{border-color:var(--border-h);color:var(--text);}
@media(max-width:520px){#back-btn{top:9px;left:9px;padding:6px 11px;font-size:11px;}}

.page{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:52px 10px 14px;}
.title{font-family:'Syne',sans-serif;font-weight:800;font-size:20px;letter-spacing:-.4px;background:linear-gradient(110deg,#fff 26%,var(--c) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}

.pills{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;}
.pill{display:flex;align-items:center;gap:7px;padding:4px 11px;border-radius:100px;background:rgba(255,255,255,0.04);border:1px solid var(--border);font-size:8.5px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;color:var(--dim);white-space:nowrap;}
.pill b{font-family:'Syne',sans-serif;font-size:14px;font-weight:800;letter-spacing:0;font-variant-numeric:tabular-nums;color:var(--c);}
.pill.pairs b{color:var(--ok);}
.pill.best b{color:var(--c2);}
.pill.best.record{border-color:rgba(138,180,255,.45);}

#grid{display:grid;grid-template-columns:repeat(var(--cols),var(--cs));gap:calc(var(--cs) * 0.09);justify-content:center;}
.card{width:var(--cs);height:var(--cs);perspective:900px;cursor:pointer;}
.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .42s cubic-bezier(.3,.9,.3,1);border-radius:calc(var(--cs) * 0.18);}
.card.flip .inner,.card.done .inner{transform:rotateY(180deg);}
.card.shake{animation:shk .4s ease;}
@keyframes shk{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:calc(var(--cs) * 0.18);display:flex;align-items:center;justify-content:center;border:1px solid var(--border);overflow:hidden;}
.front{background:linear-gradient(158deg,#241d14,#15110c);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 6px 16px -8px rgba(0,0,0,.9);transition:border-color .18s,transform .18s;}
.front::before{content:'';position:absolute;inset:0;opacity:.5;background:
  repeating-linear-gradient(45deg,rgba(232,213,163,0.08) 0 1px,transparent 1px 7px),
  repeating-linear-gradient(-45deg,rgba(232,213,163,0.06) 0 1px,transparent 1px 7px);}
.front::after{content:'?';font-family:'Syne',sans-serif;font-weight:800;font-size:calc(var(--cs) * 0.36);color:rgba(232,213,163,0.4);text-shadow:0 0 14px rgba(232,213,163,0.25);}
.card:hover:not(.flip):not(.done) .front{border-color:rgba(232,213,163,0.4);transform:translateY(-2px);}
.back{transform:rotateY(180deg);background:linear-gradient(158deg,#fffaf0,#e6dcc6);font-size:calc(var(--cs) * 0.46);line-height:1;box-shadow:inset 0 1px 0 rgba(255,255,255,.8);}
.card.done .back{background:linear-gradient(158deg,#d8ffe6,#a9e9c2);border-color:rgba(74,222,128,0.55);box-shadow:0 0 20px -4px rgba(74,222,128,0.6),inset 0 1px 0 rgba(255,255,255,.7);}
.card.done{animation:popm .42s ease;}
@keyframes popm{0%{transform:scale(1);}45%{transform:scale(1.09);}100%{transform:scale(1);}}

#status{font-size:11.5px;color:var(--muted);min-height:16px;text-align:center;}
#status.good{color:var(--ok);}
#status.bad{color:#ff9d9d;}

.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
.tool{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--muted);padding:8px 14px;border-radius:100px;font-size:11.5px;font-weight:600;cursor:pointer;transition:all .16s;}
.tool:hover{border-color:var(--border-h);color:var(--text);}
.tool svg{width:14px;height:14px;}
.tool.primary{border-color:rgba(232,213,163,0.4);color:#f6e7bf;background:rgba(232,213,163,0.12);}

#overlay{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(ellipse at center,rgba(12,10,8,0.82) 0%,rgba(4,3,2,0.95) 78%);backdrop-filter:blur(6px);}
#overlay.hide{display:none;}
.card-box{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:344px;padding:24px 22px 22px;border-radius:24px;background:linear-gradient(165deg,rgba(255,255,255,0.06),rgba(255,255,255,0.015));border:1px solid var(--border-h);box-shadow:0 30px 70px -28px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.07);animation:pop .34s cubic-bezier(.2,1.4,.4,1);}
@keyframes pop{from{transform:scale(.9) translateY(8px);opacity:0;}to{transform:none;opacity:1;}}
.card-box::before{content:'';position:absolute;inset:-1px;border-radius:24px;padding:1px;background:linear-gradient(120deg,rgba(232,213,163,.5),transparent 42%,transparent 58%,rgba(138,180,255,.5));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;}
.brand-emoji{font-size:32px;line-height:1;filter:drop-shadow(0 6px 16px rgba(232,213,163,.4));}
.ttl{font-family:'Syne',sans-serif;font-weight:800;font-size:23px;letter-spacing:-.5px;text-align:center;background:linear-gradient(110deg,var(--c) 5%,#fff 52%,var(--c2) 95%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
#result{display:none;flex-direction:column;align-items:center;gap:1px;}
#result.show{display:flex;}
#res-lbl{font-size:9px;letter-spacing:2.2px;text-transform:uppercase;color:var(--dim);}
#res-time{font-family:'Syne',sans-serif;font-weight:800;font-size:46px;line-height:1.05;letter-spacing:-2px;color:var(--c);text-shadow:0 0 30px rgba(232,213,163,.35);font-variant-numeric:tabular-nums;}
#res-note{font-size:11.5px;font-weight:600;color:var(--muted);}
#res-note.record{color:var(--gold);}
#ov-stats{display:none;width:100%;grid-template-columns:1fr 1fr;gap:7px;}
#ov-stats.show{display:grid;}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:14px;background:rgba(255,255,255,0.04);border:1px solid var(--border);}
.stat i{font-size:8px;font-style:normal;letter-spacing:1.3px;text-transform:uppercase;color:var(--dim);text-align:center;}
.stat b{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;color:var(--c2);white-space:nowrap;}
.sets{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;width:100%;}
.set{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:14px;background:rgba(255,255,255,0.035);border:1px solid var(--border);cursor:pointer;transition:all .16s;}
.set:hover{border-color:var(--border-h);}
.set.sel{background:rgba(232,213,163,0.16);border-color:rgba(232,213,163,0.5);}
.set .ic{font-size:19px;line-height:1;}
.set .nm{font-size:8px;font-weight:600;color:var(--muted);text-align:center;line-height:1.15;}
.set.sel .nm{color:var(--text);}
.seg{display:flex;gap:3px;background:rgba(255,255,255,0.04);border:1px solid var(--border);padding:3px;border-radius:100px;}
.seg button{background:transparent;border:none;color:var(--muted);padding:5px 13px;border-radius:100px;font-size:11.5px;font-weight:600;cursor:pointer;transition:color .16s,background .16s;}
.seg button:hover{color:var(--text);}
.seg button.active{background:rgba(232,213,163,0.16);color:#f8ecca;box-shadow:inset 0 0 0 1px rgba(232,213,163,0.42);}
.lbl{font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);}
.hint{font-size:11.5px;line-height:1.5;color:var(--muted);text-align:center;}
.play-btn{margin-top:2px;width:100%;padding:13px 30px;border-radius:100px;border:1px solid rgba(232,213,163,.5);background:linear-gradient(180deg,rgba(232,213,163,.24),rgba(232,213,163,.1));color:#fbf0d4;font-size:14px;font-weight:600;cursor:pointer;transition:all .18s;}
.play-btn:hover{background:linear-gradient(180deg,rgba(232,213,163,.34),rgba(232,213,163,.16));color:#fff;box-shadow:0 0 24px -6px rgba(232,213,163,.5);}
.play-btn:active{transform:translateY(1px);}
@media (max-height:820px){#overlay{align-items:flex-start !important;overflow-y:auto !important;}}
@media(max-height:700px){.title{display:none;}.page{padding-top:44px;gap:7px;}}
@media(max-height:640px){.card-box{gap:7px;padding:16px 18px;}.brand-emoji{display:none;}.ttl{font-size:20px;}#res-time{font-size:36px;}}
</style>
</head>
<body>
<a href="../../index.html" id="back-btn">
  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
  <span id="lbl-back"></span>
</a>

<div class="page" id="page">
  <div class="title" id="lbl-title"></div>

  <div class="pills">
    <div class="pill pairs"><span id="lbl-pairs"></span><b id="hud-pairs">0</b></div>
    <div class="pill"><span id="lbl-moves"></span><b id="hud-moves">0</b></div>
    <div class="pill"><span id="lbl-time"></span><b id="hud-time">0:00</b></div>
    <div class="pill best" id="best-pill"><span id="lbl-best"></span><b id="hud-best">—</b></div>
  </div>

  <div id="grid"></div>
  <div id="status"></div>

  <div class="tools">
    <button class="tool primary" id="btn-new">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
      <span id="lbl-new"></span></button>
    <button class="tool" id="btn-menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span id="lbl-sets"></span></button>
  </div>
</div>

<div id="overlay">
  <div class="card-box">
    <div id="brand"><div class="brand-emoji" id="brand-emoji">🃏</div></div>
    <div class="ttl" id="ov-title"></div>
    <div id="result">
      <div id="res-lbl"></div>
      <div id="res-time">0:00</div>
      <div id="res-note"></div>
    </div>
    <div id="ov-stats">
      <div class="stat"><i id="lbl-s-moves"></i><b id="st-moves">0</b></div>
      <div class="stat"><i id="lbl-s-best"></i><b id="st-best">—</b></div>
    </div>
    <div class="lbl" id="lbl-choose"></div>
    <div class="sets" id="set-grid"></div>
    <div class="lbl" id="lbl-diff"></div>
    <div class="seg" id="diff-row"></div>
    <div class="hint" id="ov-hint"></div>
    <button class="play-btn" id="ov-play"></button>
  </div>
</div>

<script>
// ── sady symbolov (12 na sadu, hra pouzije prvych N) ────────────────────
const SETS = [
  {id:'animals',   key:'pexSetAnimals',   icon:'🐾', em:['🐶','🐱','🦊','🐻','🐼','🦁','🐯','🐨','🐸','🐵','🐷','🐔']},
  {id:'trees',     key:'pexSetTrees',     icon:'🌲', em:['🌲','🌴','🌳','🌵','🎋','🎍','🍀','🌿','🍁','🍂','🌱','🪴']},
  {id:'flowers',   key:'pexSetFlowers',   icon:'🌸', em:['🌸','🌺','🌻','🌹','🌷','💐','🪷','🌼','🌾','🍄','🥀','🏵️']},
  {id:'space',     key:'pexSetSpace',     icon:'🚀', em:['🚀','🪐','⭐','🌙','☄️','🌍','🔭','👾','🛰️','🌌','✨','🌞']},
  {id:'buildings', key:'pexSetBuildings', icon:'🏛️', em:['🏛️','🗼','🏰','⛩️','🕌','🗽','🏯','🕍','🏟️','🏗️','🏠','⛲']},
];
const DIFFS = [{pairs:6, key:'diffEasy'}, {pairs:8, key:'diffMedium'}, {pairs:12, key:'diffHard'}];
let setIdx = 0, diffIdx = 1;
const pairsN = () => DIFFS[diffIdx].pairs;
const bestKey = () => 'pexeso_best_' + pairsN();

let deck = [], flipped = [], done = 0, moves = 0, lock = false;
let elapsed = 0, startedAt = 0, running = false, started = false, solved = false;
let cards = [];

const gridEl = document.getElementById('grid');
const statusEl = document.getElementById('status');

function applyLang() {
  document.getElementById('lbl-back').textContent   = t('back');
  document.getElementById('lbl-title').textContent  = 'Pexeso';
  document.getElementById('lbl-pairs').textContent  = t('pexPairs');
  document.getElementById('lbl-moves').textContent  = t('uiMoves');
  document.getElementById('lbl-time').textContent   = t('uiTime');
  document.getElementById('lbl-best').textContent   = t('uiBest');
  document.getElementById('lbl-new').textContent    = t('uiNewGame');
  document.getElementById('lbl-sets').textContent   = t('pexChoose');
  document.getElementById('lbl-choose').textContent = t('pexChoose');
  document.getElementById('lbl-diff').textContent   = t('uiDifficulty');
  document.getElementById('lbl-s-moves').textContent = t('uiMoves');
  document.getElementById('lbl-s-best').textContent  = t('uiBest');
  document.getElementById('res-lbl').textContent    = t('uiTime');
}
const fmt = ms => { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
function setStatus(msg, cls) { statusEl.textContent = msg; statusEl.className = cls || ''; }

// ── rozlozenie mriezky ──────────────────────────────────────────────────
function gridShape() {
  const n = pairsN() * 2;
  const vw = window.innerWidth || 360, vh = window.innerHeight || 640;
  const wide = vw > vh * 1.15;
  if (n === 12) return wide ? {c: 6, r: 2} : {c: 4, r: 3};
  if (n === 16) return wide ? {c: 8, r: 2} : {c: 4, r: 4};
  return wide ? {c: 8, r: 3} : {c: 4, r: 6};
}
function layout() {
  const {c, r} = gridShape();
  const vw = window.innerWidth || 360, vh = window.innerHeight || 640;
  const page = document.getElementById('page');
  let others = 0, k = 0;
  for (const el of page.children) { k++; if (el !== gridEl) others += el.offsetHeight; }
  const cs = getComputedStyle(page);
  const gap = parseFloat(cs.rowGap) || 10;
  const pad = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  const chrome = others + gap * Math.max(0, k - 1) + pad + 18;
  // velkost karty: 9 % medzera medzi kartami
  const byW = (Math.min(vw, 760) - 26) / (c + (c - 1) * 0.09);
  const byH = Math.max(120, vh - chrome) / (r + (r - 1) * 0.09);
  const size = Math.max(44, Math.min(byW, byH, 108));
  document.documentElement.style.setProperty('--cs', Math.floor(size) + 'px');
  document.documentElement.style.setProperty('--cols', c);
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 250));

// ── hra ─────────────────────────────────────────────────────────────────
function loadBest() {
  const b = +(localStorage.getItem(bestKey()) || 0);
  document.getElementById('hud-best').textContent = b ? fmt(b) : '—';
  document.getElementById('best-pill').classList.remove('record');
  return b;
}
function shuffle(a) {
  const x = [...a];
  for (let i = x.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t2 = x[i]; x[i] = x[j]; x[j] = t2; }
  return x;
}
function newGame() {
  const set = SETS[setIdx];
  const faces = set.em.slice(0, pairsN());
  deck = shuffle([...faces, ...faces]);
  flipped = []; done = 0; moves = 0; lock = false;
  elapsed = 0; started = false; running = false; solved = false;
  document.getElementById('hud-pairs').textContent = '0/' + pairsN();
  document.getElementById('hud-moves').textContent = '0';
  document.getElementById('hud-time').textContent = '0:00';
  document.getElementById('brand-emoji').textContent = set.icon;
  document.getElementById('overlay').classList.add('hide');
  loadBest();
  gridEl.textContent = '';
  cards = [];
  deck.forEach((em, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    const inner = document.createElement('div');
    inner.className = 'inner';
    const front = document.createElement('div');
    front.className = 'face front';
    const back = document.createElement('div');
    back.className = 'face back';
    back.textContent = em;
    inner.appendChild(front); inner.appendChild(back);
    card.appendChild(inner);
    card.addEventListener('pointerdown', e => { e.preventDefault(); flip(i); }, {passive: false});
    gridEl.appendChild(card);
    cards.push({el: card, em, done: false});
  });
  setStatus(t('pexFlip'), '');
  layout();
}
function flip(i) {
  if (lock || solved) return;
  const c = cards[i];
  if (c.done || c.el.classList.contains('flip')) return;
  if (!started) { started = true; running = true; startedAt = performance.now(); }
  c.el.classList.add('flip');
  flipped.push(i);
  if (flipped.length < 2) return;
  moves++;
  document.getElementById('hud-moves').textContent = moves;
  const [a, b] = flipped;
  if (cards[a].em === cards[b].em) {
    flipped = [];
    cards[a].done = true; cards[b].done = true;
    [a, b].forEach(k => { cards[k].el.classList.remove('flip'); cards[k].el.classList.add('done'); });
    done++;
    document.getElementById('hud-pairs').textContent = done + '/' + pairsN();
    setStatus(done < pairsN() ? t('pexMatch') : '', 'good');
    if (done === pairsN()) win();
  } else {
    lock = true;
    setStatus(t('pexNoMatch'), 'bad');
    [a, b].forEach(k => cards[k].el.classList.add('shake'));
    setTimeout(() => {
      [a, b].forEach(k => { cards[k].el.classList.remove('flip', 'shake'); });
      flipped = []; lock = false;
      if (!solved) setStatus(t('pexFlip'), '');
    }, 850);
  }
}
function win() {
  solved = true; running = false;
  elapsed = performance.now() - startedAt;
  const prev = +(localStorage.getItem(bestKey()) || 0);
  const rec = !prev || elapsed < prev;
  if (rec) { try { localStorage.setItem(bestKey(), Math.round(elapsed)); } catch (e) {} }
  const bestMs = rec ? elapsed : prev;
  document.getElementById('hud-best').textContent = fmt(bestMs);
  document.getElementById('best-pill').classList.toggle('record', rec);
  setStatus('', '');
  setTimeout(() => {
    document.getElementById('res-time').textContent = fmt(elapsed);
    const note = document.getElementById('res-note');
    note.textContent = rec ? t('uiNewRecord') : t('uiBest') + ' ' + fmt(prev);
    note.classList.toggle('record', rec);
    document.getElementById('st-moves').textContent = moves;
    document.getElementById('st-best').textContent = fmt(bestMs);
    showCard('win');
  }, 900);
}
function showCard(kind) {
  document.getElementById('ov-title').textContent = kind === 'win' ? t('pexWin') : 'Pexeso';
  document.getElementById('brand').style.display = kind === 'win' ? 'none' : '';
  document.getElementById('result').classList.toggle('show', kind === 'win');
  document.getElementById('ov-stats').classList.toggle('show', kind === 'win');
  document.getElementById('ov-hint').textContent = t('pexTagline');
  document.getElementById('ov-play').textContent = kind === 'win' ? t('uiPlayAgain') : t('uiStart');
  document.getElementById('overlay').classList.remove('hide');
}

document.getElementById('btn-new').addEventListener('click', newGame);
document.getElementById('btn-menu').addEventListener('click', () => { running = false; showCard('menu'); });
document.getElementById('ov-play').addEventListener('click', newGame);
window.addEventListener('blur', () => { if (running) { elapsed = performance.now() - startedAt; running = false; } });
window.addEventListener('focus', () => { if (started && !solved) { startedAt = performance.now() - elapsed; running = true; } });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (running) { elapsed = performance.now() - startedAt; running = false; } }
  else if (started && !solved) { startedAt = performance.now() - elapsed; running = true; }
});

// ── volba sady a obtiaznosti ────────────────────────────────────────────
const setGrid = document.getElementById('set-grid');
SETS.forEach((s, i) => {
  const el = document.createElement('div');
  el.className = 'set' + (i === setIdx ? ' sel' : '');
  const ic = document.createElement('div'); ic.className = 'ic'; ic.textContent = s.icon;
  const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = t(s.key);
  el.appendChild(ic); el.appendChild(nm);
  el.addEventListener('click', () => {
    setIdx = i;
    [...setGrid.children].forEach((c, j) => c.classList.toggle('sel', j === i));
    document.getElementById('brand-emoji').textContent = SETS[i].icon;
  });
  setGrid.appendChild(el);
});
const diffRow = document.getElementById('diff-row');
DIFFS.forEach((d, i) => {
  const b = document.createElement('button');
  b.textContent = t(d.key) + ' ' + d.pairs;
  b.className = i === diffIdx ? 'active' : '';
  b.addEventListener('click', () => {
    diffIdx = i;
    [...diffRow.children].forEach((c, j) => c.className = j === i ? 'active' : '');
    loadBest();
    if (solved) {
      const prev = +(localStorage.getItem(bestKey()) || 0);
      document.getElementById('res-note').textContent = prev ? t('uiBest') + ' ' + fmt(prev) : '';
      document.getElementById('st-best').textContent = prev ? fmt(prev) : '—';
    }
  });
  diffRow.appendChild(b);
});

function tick(ts) {
  requestAnimationFrame(tick);
  if (running && !solved) {
    elapsed = performance.now() - startedAt;
    document.getElementById('hud-time').textContent = fmt(elapsed);
  }
}

applyLang();
newGame();
running = false;
showCard('menu');
requestAnimationFrame(tick);
</script>
</body>
</html>
