<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Orbit Escape · GamePad</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<script src="../../i18n.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#03060e;--text:#eaf4ff;--muted:rgba(234,244,255,0.42);--dim:rgba(234,244,255,0.18);
  --border:rgba(255,255,255,0.09);--border-h:rgba(255,255,255,0.18);
  --c:#4dd2ff;--c2:#a78bfa;--gold:#ffd166;--warn:#ff6b6b;
}
html,body{background:var(--bg);height:100%;font-family:'DM Sans',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;user-select:none;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none;}
button,a{touch-action:manipulation;font-family:'DM Sans',sans-serif;}

#back-btn{position:fixed;top:14px;left:14px;z-index:60;display:flex;align-items:center;gap:7px;background:rgba(6,10,24,0.72);backdrop-filter:blur(8px);border:1px solid var(--border);color:var(--muted);padding:7px 14px;border-radius:100px;text-decoration:none;font-size:12px;font-weight:500;transition:border-color .18s,color .18s;}
#back-btn:hover,#back-btn:active{border-color:var(--border-h);color:var(--text);}
@media(max-width:520px){#back-btn{top:9px;left:9px;padding:6px 11px;font-size:11px;}}

#hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:12;display:none;align-items:center;gap:7px;pointer-events:none;}
#hud.show{display:flex;}
.pill{display:flex;align-items:center;gap:8px;padding:5px 12px;border-radius:100px;background:rgba(6,10,24,0.6);backdrop-filter:blur(8px);border:1px solid var(--border);font-size:9px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;color:var(--dim);white-space:nowrap;}
.pill b{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;letter-spacing:0;font-variant-numeric:tabular-nums;color:var(--c);transition:transform .18s;}
.pill.lvl b{color:var(--c2);}
.pill.best b{color:rgba(234,244,255,.72);}
.pill.best.record{border-color:rgba(77,210,255,.45);}
.pill b.bump{transform:scale(1.3);}
#fuel-bar{width:60px;height:6px;border-radius:4px;background:rgba(255,255,255,0.16);overflow:hidden;}
#fuel-bar i{display:block;height:100%;width:100%;border-radius:4px;background:linear-gradient(90deg,#4ade80,#4dd2ff);transition:width .12s linear,background .3s;}
.pill.fuel.mid #fuel-bar i{background:linear-gradient(90deg,#ffd166,#ffa94d);}
.pill.fuel.low #fuel-bar i{background:linear-gradient(90deg,#ff5d6d,#ff8a5c);}
.pill.fuel.low{border-color:rgba(255,93,109,.5);animation:warn 1s infinite;}
@keyframes warn{50%{border-color:rgba(255,93,109,.12);}}
.lifes{display:flex;gap:4px;}
.life{width:9px;height:9px;background:var(--c);clip-path:polygon(100% 50%,0 100%,26% 50%,0 0);box-shadow:0 0 8px rgba(77,210,255,.9);}
.life.gone{background:rgba(255,255,255,0.13);box-shadow:none;}
@media(max-width:620px){#hud{left:auto;right:56px;transform:none;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 150px);}.pill span.txt{display:none;}.pill{padding:4px 10px;}.pill b{font-size:15px;}.pill.best{display:none;}#fuel-bar{width:44px;}}

#pause-btn{position:fixed;top:14px;right:14px;z-index:60;display:none;align-items:center;justify-content:center;width:36px;height:36px;background:rgba(6,10,24,0.7);backdrop-filter:blur(8px);border:1px solid var(--border);color:var(--muted);border-radius:50%;cursor:pointer;}
#pause-btn.show{display:flex;}
#pause-btn:hover{border-color:var(--border-h);color:var(--text);}

#ctrl{position:fixed;bottom:18px;left:0;right:0;z-index:12;display:none;justify-content:space-between;padding:0 16px;pointer-events:none;}
body.touch #ctrl.show{display:flex;}
.pad{display:flex;gap:9px;pointer-events:auto;}
.btn{display:flex;align-items:center;justify-content:center;width:60px;height:60px;border-radius:16px;background:linear-gradient(160deg,rgba(255,255,255,0.07),rgba(255,255,255,0.02));border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:background .1s,border-color .1s,color .1s,transform .1s;}
.btn svg{width:20px;height:20px;}
.btn:active,.btn.on{background:rgba(77,210,255,0.18);border-color:rgba(77,210,255,0.45);color:var(--c);transform:scale(.94);}
#btn-thrust{width:74px;height:74px;border-color:rgba(255,209,102,.45);color:var(--gold);}
#btn-thrust:active,#btn-thrust.on{background:rgba(255,209,102,.2);border-color:rgba(255,209,102,.6);}

#overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(ellipse at center,rgba(6,10,24,0.78) 0%,rgba(2,3,10,0.95) 78%);backdrop-filter:blur(6px);}
#overlay.hide{display:none;}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:11px;width:100%;max-width:334px;padding:26px 24px 24px;border-radius:24px;background:linear-gradient(165deg,rgba(255,255,255,0.06),rgba(255,255,255,0.015));border:1px solid var(--border-h);box-shadow:0 30px 70px -28px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.07);animation:pop .34s cubic-bezier(.2,1.4,.4,1);}
@keyframes pop{from{transform:scale(.9) translateY(8px);opacity:0;}to{transform:none;opacity:1;}}
.card::before{content:'';position:absolute;inset:-1px;border-radius:24px;padding:1px;background:linear-gradient(120deg,rgba(77,210,255,.5),transparent 42%,transparent 58%,rgba(167,139,250,.5));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;}
.emoji{font-size:34px;line-height:1;filter:drop-shadow(0 6px 16px rgba(77,210,255,.4));}
.ttl{font-family:'Syne',sans-serif;font-weight:800;font-size:24px;letter-spacing:-.5px;text-align:center;background:linear-gradient(110deg,var(--c) 5%,#fff 52%,var(--c2) 95%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
#result{display:none;flex-direction:column;align-items:center;gap:1px;}
#result.show{display:flex;}
#res-lbl{font-size:9px;letter-spacing:2.2px;text-transform:uppercase;color:var(--dim);}
#res-score{font-family:'Syne',sans-serif;font-weight:800;font-size:50px;line-height:1.05;letter-spacing:-2px;color:var(--c);text-shadow:0 0 30px rgba(77,210,255,.45);}
#res-note{font-size:11.5px;font-weight:600;color:var(--muted);}
#res-note.record{color:var(--gold);}
#ov-stats{display:none;width:100%;grid-template-columns:1fr 1fr;gap:7px;}
#ov-stats.show{display:grid;}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:14px;background:rgba(255,255,255,0.04);border:1px solid var(--border);}
.stat i{font-size:8px;font-style:normal;letter-spacing:1.3px;text-transform:uppercase;color:var(--dim);text-align:center;}
.stat b{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;color:var(--c2);white-space:nowrap;}
.seg{display:flex;gap:3px;background:rgba(255,255,255,0.04);border:1px solid var(--border);padding:3px;border-radius:100px;}
.seg button{background:transparent;border:none;color:var(--muted);padding:6px 15px;border-radius:100px;font-size:11.5px;font-weight:600;cursor:pointer;transition:color .16s,background .16s;}
.seg button:hover{color:var(--text);}
.seg button.active{background:rgba(77,210,255,0.16);color:#d3f2ff;box-shadow:inset 0 0 0 1px rgba(77,210,255,0.42);}
.lbl{font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);}
.hint{font-size:11.5px;line-height:1.55;color:var(--muted);text-align:center;}
.play-btn{margin-top:3px;width:100%;padding:13px 30px;border-radius:100px;border:1px solid rgba(77,210,255,.5);background:linear-gradient(180deg,rgba(77,210,255,.24),rgba(77,210,255,.1));color:#dcf4ff;font-size:14px;font-weight:600;cursor:pointer;transition:all .18s;}
.play-btn:hover{background:linear-gradient(180deg,rgba(77,210,255,.34),rgba(77,210,255,.16));color:#fff;box-shadow:0 0 24px -6px rgba(77,210,255,.5);}
.play-btn:active{transform:translateY(1px);}
@media(max-height:640px){.card{gap:8px;padding:18px 20px;}.emoji{display:none;}.ttl{font-size:20px;}#res-score{font-size:38px;}}
@media (max-height:820px){#overlay{align-items:flex-start !important;overflow-y:auto !important;}}
</style>
</head>
<body>
<a href="../../index.html" id="back-btn">
  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
  <span id="lbl-back"></span>
</a>

<canvas id="c"></canvas>

<div id="hud">
  <div class="pill"><span class="txt" id="lbl-score"></span><b id="hud-score">0</b></div>
  <div class="pill lvl"><span class="txt" id="lbl-level"></span><b id="hud-level">1</b></div>
  <div class="pill fuel" id="fuel-pill"><span>&#9981;</span><div id="fuel-bar"><i></i></div></div>
  <div class="pill"><div class="lifes" id="lifes"></div></div>
  <div class="pill best" id="best-pill"><span class="txt" id="lbl-best"></span><b id="hud-best">0</b></div>
</div>

<button id="pause-btn" aria-label="pause">
  <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1.4"/><rect x="14" y="4" width="4" height="16" rx="1.4"/></svg>
</button>

<div id="ctrl">
  <div class="pad">
    <button class="btn" id="btn-left" aria-label="left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg></button>
    <button class="btn" id="btn-right" aria-label="right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/></svg></button>
  </div>
  <div class="pad">
    <button class="btn" id="btn-thrust" aria-label="thrust"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </div>
</div>

<div id="overlay">
  <div class="card">
    <div id="brand"><div class="emoji">&#128760;</div></div>
    <div class="ttl" id="ov-title"></div>
    <div id="result">
      <div id="res-lbl"></div>
      <div id="res-score">0</div>
      <div id="res-note"></div>
    </div>
    <div id="ov-stats">
      <div class="stat"><i id="lbl-s-level"></i><b id="st-level">1</b></div>
      <div class="stat"><i id="lbl-s-best"></i><b id="st-best">0</b></div>
    </div>
    <div class="lbl" id="lbl-diff"></div>
    <div class="seg" id="diff-row"></div>
    <div class="hint" id="ov-hint"></div>
    <button class="play-btn" id="ov-play"></button>
  </div>
</div>

<script>
// ── nastavenia: vsetko v px/s, px/s2, rad/s ─────────────────────────────
const DIFFS = [
  {key:'diffEasy',   rocks:4,  grav:0.75, drain:8,  lives:4, rockSpd:0.8},
  {key:'diffMedium', rocks:7,  grav:1.00, drain:12, lives:3, rockSpd:1.0},
  {key:'diffHard',   rocks:11, grav:1.30, drain:16, lives:2, rockSpd:1.3},
];
let diffIdx = 1;
const bestKey = () => 'orbitescape_best_' + diffIdx;
let best = 0;

const TURN = 3.2;            // rad/s
const THRUST = 620;          // px/s2 (x SCL)
const MAXV = 430;            // px/s (x SCL)
const GK = 2900;             // gravitacna konstanta scenoveho merítka
const DRY_LIMIT = 8;         // s bez palivа = strata lode
const PTS_SEC = 4;           // body za sekundu letu
const PTS_PORTAL = 200, PTS_PORTAL_LVL = 60, PTS_FUEL = 2;
const CAN_FUEL = 34;         // kolko doplni jedna nadrz

const ST = {MENU:0, COUNT:1, PLAY:2, PAUSE:3, OVER:4};
let state = ST.MENU;

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, SCL = 1;

let ship = {x:0, y:0, a:-Math.PI/2, vx:0, vy:0};
let planets = [], rocks = [], cans = [], parts = [], pops = [], stars = [], blobs = [];
let portal = {x:0, y:0, r:22, pulse:0};
let score = 0, scoreAcc = 0, lives = 3, level = 1, fuel = 100, dryT = 0;
let invuln = 0, shake = 0, cdLeft = 0, goFlash = 0, lvlFlash = 0, tSec = 0, tPrev = 0;
const keys = {};
const isTouch = window.matchMedia('(pointer: coarse)').matches;

function applyLang() {
  document.getElementById('lbl-back').textContent    = t('back');
  document.getElementById('lbl-score').textContent   = t('orbitScore');
  document.getElementById('lbl-level').textContent   = t('orbitLevel');
  document.getElementById('lbl-best').textContent    = t('uiBest');
  document.getElementById('lbl-s-level').textContent = t('orbitLevel');
  document.getElementById('lbl-s-best').textContent  = t('uiBest');
  document.getElementById('res-lbl').textContent     = t('orbitScore');
  document.getElementById('lbl-diff').textContent    = t('uiDifficulty');
  document.getElementById('fuel-pill').title         = t('orbitFuel');
  document.title = t('orbitTitle') + ' · GamePad';
}
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const D = () => DIFFS[diffIdx];
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);

// ── rozmery ─────────────────────────────────────────────────────────────
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth || 360;
  H = window.innerHeight || 640;
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  SCL = clamp(Math.min(W, H) / 620, 0.6, 1.4);
  makeStars();
  // po zmene velkosti drzim vsetko v novej ploche
  ship.x = clamp(ship.x, 0, W); ship.y = clamp(ship.y, 0, H);
  portal.x = clamp(portal.x, 40, W - 40); portal.y = clamp(portal.y, 60, H - 60);
  for (const p of planets) { p.x = clamp(p.x, p.r, W - p.r); p.y = clamp(p.y, p.r, H - p.r); }
  for (const r of rocks) { r.x = ((r.x % W) + W) % W; r.y = ((r.y % H) + H) % H; }
  for (const c of cans) { c.x = clamp(c.x, 20, W - 20); c.y = clamp(c.y, 20, H - 20); }
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 250));

function makeStars() {
  stars = [[70, 0.6, 1], [44, 1.1, 2.2], [24, 1.7, 3.6]].map(([n, r, depth]) =>
    Array.from({length: n}, () => ({x: Math.random(), y: Math.random(), r, depth, ph: rnd(0, 6.2832)})));
  blobs = [
    {cx:0.20, cy:0.28, r:430, rgb:'77,210,255', t:0, sp:0.07},
    {cx:0.80, cy:0.70, r:380, rgb:'167,139,250', t:2, sp:0.05},
    {cx:0.50, cy:0.88, r:300, rgb:'255,122,217', t:4, sp:0.09},
  ];
}

// ── stavba urovne ───────────────────────────────────────────────────────
function safeSpot(minFromShip, minFromPortal, pad) {
  let x = 0, y = 0;
  for (let n = 0; n < 80; n++) {
    x = rnd(pad, W - pad); y = rnd(pad + 40 * SCL, H - pad - 40 * SCL);
    if (dist(x, y, ship.x, ship.y) < minFromShip) continue;
    if (minFromPortal && dist(x, y, portal.x, portal.y) < minFromPortal) continue;
    let ok = true;
    for (const p of planets) if (dist(x, y, p.x, p.y) < p.r + 46 * SCL) { ok = false; break; }
    if (ok) return {x, y};
  }
  return {x, y};
}

function initLevel(keepShip) {
  const d = D();
  dryT = 0;
  if (!keepShip) ship = {x: W / 2, y: H / 2, a: -Math.PI / 2, vx: rnd(-30, 30), vy: rnd(-20, 20)};
  else { ship.x = W / 2; ship.y = H / 2; ship.vx = rnd(-30, 30); ship.vy = rnd(-20, 20); }
  parts = [];

  planets = [];
  const pn = Math.min(4, 1 + Math.floor(level / 2));
  for (let i = 0; i < pn; i++) {
    const r = rnd(20, 38) * SCL;
    const s = safeSpot(190 * SCL, 0, r + 30 * SCL);
    planets.push({x: s.x, y: s.y, r, g: GK * d.grav * rnd(0.75, 1.3),
      hue: (200 + Math.random() * 150) % 360 | 0, ring: Math.random() < 0.45, rot: rnd(0, 3)});
  }

  // portal – vzdy dalej od stredu, kde lod startuje
  let ps = null;
  for (let n = 0; n < 90; n++) {
    const x = rnd(70 * SCL, W - 70 * SCL), y = rnd(90 * SCL, H - 90 * SCL);
    if (dist(x, y, W / 2, H / 2) < Math.min(W, H) * 0.3) continue;
    let ok = true;
    for (const p of planets) if (dist(x, y, p.x, p.y) < p.r + 74 * SCL) { ok = false; break; }
    if (ok) { ps = {x, y}; break; }
  }
  portal = {x: ps ? ps.x : W - 80 * SCL, y: ps ? ps.y : 100 * SCL, r: 22 * SCL, pulse: 0};

  rocks = [];
  const rn = d.rocks + (level - 1) * 2;
  for (let i = 0; i < rn; i++) {
    const s = safeSpot(150 * SCL, 60 * SCL, 30 * SCL);
    const a = rnd(0, 6.2832);
    const sp = rnd(34, 96) * d.rockSpd * (1 + (level - 1) * 0.07) * SCL;
    const n = 5 + Math.floor(Math.random() * 4);
    const pts = [];
    const rr = rnd(9, 15) * SCL;
    for (let k = 0; k < n; k++) {
      const ang = k / n * 6.2832, q = rr * rnd(0.72, 1.3);
      pts.push({x: Math.cos(ang) * q, y: Math.sin(ang) * q});
    }
    rocks.push({x: s.x, y: s.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: rr,
      pts, rot: 0, spin: rnd(-1.6, 1.6), hue: (18 + Math.random() * 34) | 0});
  }

  cans = [];
  const cn = 1 + (level % 2 === 0 ? 1 : 0);
  for (let i = 0; i < cn; i++) {
    const s = safeSpot(120 * SCL, 70 * SCL, 34 * SCL);
    cans.push({x: s.x, y: s.y, ph: rnd(0, 6.2832)});
  }
  syncHud(true);
}

// ── kolo ────────────────────────────────────────────────────────────────
function loadBest() {
  best = +(localStorage.getItem(bestKey()) || 0);
  setHud('hud-best', best);
  document.getElementById('best-pill').classList.remove('record');
}
function beginRound() {
  score = 0; scoreAcc = 0; level = 1; lives = D().lives; fuel = 100;
  invuln = 1.4; shake = 0; goFlash = 0; lvlFlash = 0; cdLeft = 2.4;
  ship = {x: W / 2, y: H / 2, a: -Math.PI / 2, vx: 0, vy: 0};
  pops = [];
  state = ST.COUNT;
  initLevel(false);
  document.getElementById('overlay').classList.add('hide');
  document.getElementById('hud').classList.add('show');
  document.getElementById('pause-btn').classList.add('show');
  document.getElementById('ctrl').classList.add('show');
  loadBest();
  syncHud(true);
}
function endRound() {
  state = ST.OVER;
  const rec = score > best;
  if (rec) { best = score; try { localStorage.setItem(bestKey(), best); } catch (e) {} }
  document.getElementById('res-score').textContent = score;
  const note = document.getElementById('res-note');
  note.textContent = rec ? t('uiNewRecord') : t('uiBest') + ' ' + best;
  note.classList.toggle('record', rec);
  document.getElementById('st-level').textContent = level;
  document.getElementById('st-best').textContent = best;
  showCard('over');
  setHud('hud-best', best);
  document.getElementById('best-pill').classList.toggle('record', rec);
}
function showCard(mode) {
  document.getElementById('ov-title').textContent = mode === 'over' ? t('orbitOver') : t('orbitTitle');
  document.getElementById('brand').style.display = mode === 'over' ? 'none' : '';
  document.getElementById('result').classList.toggle('show', mode === 'over');
  document.getElementById('ov-stats').classList.toggle('show', mode === 'over');
  document.getElementById('ov-hint').textContent = isTouch ? t('orbitHint') : t('orbitKeys');
  document.getElementById('ov-play').textContent = mode === 'over' ? t('orbitAgain') : t('orbitPlay');
  document.getElementById('overlay').classList.remove('hide');
  document.getElementById('hud').classList.remove('show');
  document.getElementById('pause-btn').classList.remove('show');
  document.getElementById('ctrl').classList.remove('show');
}
function togglePause() {
  if (state === ST.PLAY) state = ST.PAUSE;
  else if (state === ST.PAUSE) { cdLeft = 1.2; state = ST.COUNT; }
}

// ── HUD ─────────────────────────────────────────────────────────────────
const hudVal = {};
function setHud(id, v) {
  if (hudVal[id] === v) return;
  hudVal[id] = v;
  const el = document.getElementById(id);
  el.textContent = v;
  el.classList.remove('bump');
  void el.offsetWidth;
  el.classList.add('bump');
  setTimeout(() => el.classList.remove('bump'), 180);
}
function syncHud(force) {
  setHud('hud-score', score);
  setHud('hud-level', level);
  const box = document.getElementById('lifes');
  const total = D().lives;
  if (box.children.length !== total) {
    box.textContent = '';
    for (let i = 0; i < total; i++) { const d = document.createElement('div'); d.className = 'life'; box.appendChild(d); }
  }
  [...box.children].forEach((d, i) => d.classList.toggle('gone', i >= lives));
  const fp = document.getElementById('fuel-pill');
  document.querySelector('#fuel-bar i').style.width = Math.max(0, fuel) + '%';
  fp.classList.toggle('mid', fuel < 55 && fuel >= 22);
  fp.classList.toggle('low', fuel < 22);
  if (force) setHud('hud-best', best);
}

// ── efekty ──────────────────────────────────────────────────────────────
function boom(x, y, rgb, n, pw) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, 6.2832), sp = rnd(40, 250) * pw * SCL;
    parts.push({x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rnd(0.3, 0.66), max: 0.66, rgb, sz: rnd(1.4, 3.2) * SCL});
  }
}
function loseLife(dry) {
  const why = dry ? t('orbitDry') : t('orbitCrash');
  lives--;
  invuln = 2.2;
  shake = 1;
  boom(ship.x, ship.y, '255,255,255', 22, 1.3);
  boom(ship.x, ship.y, '255,107,107', 12, 0.9);
  pops.push({x: ship.x, y: ship.y, txt: why, life: 1.1, rgb: '255,107,107'});
  ship.vx *= -0.3; ship.vy *= -0.3;
  if (dry) fuel = 45;      // po uvazneni dostane lod zalozny pohon
  dryT = 0;
  syncHud();
  if (lives <= 0) endRound();
}
function reachPortal() {
  const bonus = PTS_PORTAL + PTS_PORTAL_LVL * level + Math.round(fuel) * PTS_FUEL;
  score += bonus;
  pops.push({x: portal.x, y: portal.y, txt: '+' + bonus, life: 1.2, rgb: '77,210,255'});
  boom(portal.x, portal.y, '77,210,255', 26, 1.2);
  boom(portal.x, portal.y, '255,255,255', 10, 0.7);
  level++;
  fuel = 100;
  lvlFlash = 1.4;
  invuln = 1.6;
  initLevel(true);
  syncHud();
}

// ── update ──────────────────────────────────────────────────────────────
function update(dt) {
  tSec += dt;
  portal.pulse = (portal.pulse + dt * 2.2) % 6.2832;
  for (const p of planets) p.rot += dt * 0.28;
  for (const c of cans) c.ph += dt * 2.6;
  for (const p of parts) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  if (parts.length) parts = parts.filter(p => p.life > 0);
  for (const p of pops) { p.life -= dt; p.y -= 30 * SCL * dt; }
  if (pops.length) pops = pops.filter(p => p.life > 0);
  if (shake > 0) shake = Math.max(0, shake - dt * 3.2);
  if (goFlash > 0) goFlash = Math.max(0, goFlash - dt * 2);
  if (lvlFlash > 0) lvlFlash = Math.max(0, lvlFlash - dt);

  if (state === ST.COUNT) {
    cdLeft -= dt;
    if (cdLeft <= 0) { state = ST.PLAY; goFlash = 0.5; }
    return;
  }
  if (state !== ST.PLAY) return;

  if (invuln > 0) invuln = Math.max(0, invuln - dt);
  scoreAcc += dt * PTS_SEC;
  if (scoreAcc >= 1) { const g = Math.floor(scoreAcc); scoreAcc -= g; score += g; syncHud(); }

  // ── riadenie
  if (keys.left) ship.a -= TURN * dt;
  if (keys.right) ship.a += TURN * dt;
  const thrusting = keys.thrust && fuel > 0;
  if (thrusting) {
    ship.vx += Math.cos(ship.a) * THRUST * SCL * dt;
    ship.vy += Math.sin(ship.a) * THRUST * SCL * dt;
    fuel = Math.max(0, fuel - D().drain * dt);
    if (Math.random() < dt * 46) {
      parts.push({x: ship.x - Math.cos(ship.a) * 13 * SCL, y: ship.y - Math.sin(ship.a) * 13 * SCL,
        vx: rnd(-50, 50) - Math.cos(ship.a) * 140, vy: rnd(-50, 50) - Math.sin(ship.a) * 140,
        life: 0.3, max: 0.3, rgb: Math.random() < 0.5 ? '255,159,67' : '77,210,255', sz: rnd(1.4, 2.8) * SCL});
    }
    syncHud();
  }

  // ── gravitacia planet
  for (const p of planets) {
    const dx = p.x - ship.x, dy = p.y - ship.y;
    const d2 = Math.max(400 * SCL * SCL, dx * dx + dy * dy);
    const d1 = Math.sqrt(d2);
    const acc = p.g * SCL * (p.r / (26 * SCL)) / d2 * 1000;
    ship.vx += dx / d1 * acc * dt;
    ship.vy += dy / d1 * acc * dt;
  }

  const spd = Math.hypot(ship.vx, ship.vy);
  const maxv = MAXV * SCL * (1 + level * 0.03);
  if (spd > maxv) { ship.vx = ship.vx / spd * maxv; ship.vy = ship.vy / spd * maxv; }

  ship.x = ((ship.x + ship.vx * dt) % W + W) % W;
  ship.y = ((ship.y + ship.vy * dt) % H + H) % H;

  // ── prazdna nadrz: lod uvazne a po chvili je stratena
  if (fuel <= 0) {
    dryT += dt;
    if (dryT >= DRY_LIMIT) { loseLife(true); return; }
  } else dryT = 0;

  // ── ulomky
  for (const r of rocks) {
    r.x = ((r.x + r.vx * dt) % W + W) % W;
    r.y = ((r.y + r.vy * dt) % H + H) % H;
    r.rot += r.spin * dt;
  }

  // ── nadrze
  for (let i = cans.length - 1; i >= 0; i--) {
    const c = cans[i];
    if (dist(ship.x, ship.y, c.x, c.y) < 18 * SCL + 10 * SCL) {
      cans.splice(i, 1);
      fuel = Math.min(100, fuel + CAN_FUEL);
      score += 40;
      pops.push({x: c.x, y: c.y, txt: '+' + CAN_FUEL + '%', life: 1, rgb: '74,222,128'});
      boom(c.x, c.y, '74,222,128', 12, 0.7);
      syncHud();
    }
  }

  // ── zrazky
  if (invuln === 0) {
    for (const p of planets) {
      if (dist(ship.x, ship.y, p.x, p.y) < p.r + 7 * SCL) { loseLife(false); return; }
    }
    for (const r of rocks) {
      if (dist(ship.x, ship.y, r.x, r.y) < r.r + 6 * SCL) { loseLife(false); return; }
    }
  }

  if (dist(ship.x, ship.y, portal.x, portal.y) < portal.r + 9 * SCL) reachPortal();
}

// ── kreslenie ───────────────────────────────────────────────────────────
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#03060e';
  ctx.fillRect(0, 0, W, H);

  for (const n of blobs) {
    n.t += 0.0004;
    const cx = n.cx * W + Math.sin(n.t * 6.283 * n.sp * 10) * 40;
    const cy = n.cy * H + Math.cos(n.t * 6.283 * n.sp * 7) * 30;
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, n.r * SCL);
    g.addColorStop(0, 'rgba(' + n.rgb + ',0.10)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }
  for (const layer of stars) {
    for (const s of layer) {
      const sx = ((s.x * W - ship.x * 0.02 * s.depth) % W + W) % W;
      const sy = ((s.y * H - ship.y * 0.02 * s.depth) % H + H) % H;
      ctx.globalAlpha = 0.32 + 0.34 * Math.sin(tSec * 1.7 + s.ph);
      ctx.fillStyle = '#fff';
      ctx.fillRect(sx, sy, s.r * SCL, s.r * SCL);
    }
  }
  ctx.globalAlpha = 1;

  ctx.save();
  if (shake > 0.02) {
    const s = shake * shake * 13 * SCL;
    ctx.translate(rnd(-s, s), rnd(-s, s));
  }

  // planety
  for (const p of planets) {
    const col = 'hsl(' + p.hue + ',62%,52%)';
    const gr = p.r * 5.4;
    const g1 = ctx.createRadialGradient(p.x, p.y, p.r, p.x, p.y, gr);
    g1.addColorStop(0, 'hsla(' + p.hue + ',70%,55%,0.14)');
    g1.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g1;
    ctx.beginPath(); ctx.arc(p.x, p.y, gr, 0, 6.2832); ctx.fill();
    if (p.ring) {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.strokeStyle = 'hsla(' + p.hue + ',70%,72%,0.45)';
      ctx.lineWidth = 2.6 * SCL;
      ctx.beginPath(); ctx.ellipse(0, 0, p.r * 1.85, p.r * 0.52, 0.4, 0, 6.2832); ctx.stroke();
      ctx.restore();
    }
    const g2 = ctx.createRadialGradient(p.x - p.r * 0.34, p.y - p.r * 0.34, 0, p.x, p.y, p.r);
    g2.addColorStop(0, 'rgba(255,255,255,0.42)');
    g2.addColorStop(0.42, col);
    g2.addColorStop(1, 'rgba(0,0,0,0.62)');
    ctx.fillStyle = g2;
    ctx.shadowColor = col; ctx.shadowBlur = 16 * SCL;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
    ctx.shadowBlur = 0;
  }

  // portal
  const pr = portal.r;
  const pg = ctx.createRadialGradient(portal.x, portal.y, 0, portal.x, portal.y, pr * 2.7);
  pg.addColorStop(0, 'rgba(77,210,255,0.3)');
  pg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = pg;
  ctx.beginPath(); ctx.arc(portal.x, portal.y, pr * 2.7, 0, 6.2832); ctx.fill();
  for (let i = 0; i < 3; i++) {
    ctx.save(); ctx.translate(portal.x, portal.y); ctx.rotate(portal.pulse * 1.4 + i * 2.094);
    ctx.strokeStyle = 'rgba(77,210,255,' + (0.3 + Math.sin(portal.pulse + i) * 0.24) + ')';
    ctx.lineWidth = 2 * SCL;
    ctx.beginPath(); ctx.ellipse(0, 0, pr * (1 + i * 0.36), pr * (0.44 + i * 0.2), 0, 0, 6.2832); ctx.stroke();
    ctx.restore();
  }
  ctx.fillStyle = 'rgba(210,246,255,0.95)';
  ctx.shadowColor = '#4dd2ff'; ctx.shadowBlur = 20 * SCL;
  ctx.beginPath(); ctx.arc(portal.x, portal.y, pr * 0.36, 0, 6.2832); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(77,210,255,0.8)';
  ctx.font = '700 ' + Math.round(9.5 * SCL) + 'px "DM Sans", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText(t('orbitExit'), portal.x, portal.y + pr + 6 * SCL);

  // nadrze
  for (const c of cans) {
    const b = 0.6 + 0.4 * Math.sin(c.ph);
    ctx.save(); ctx.translate(c.x, c.y);
    ctx.shadowColor = '#4ade80'; ctx.shadowBlur = 14 * SCL * b;
    ctx.fillStyle = 'rgba(74,222,128,0.9)';
    const s = 7 * SCL;
    ctx.beginPath();
    ctx.moveTo(0, -s * 1.25); ctx.lineTo(s, -s * 0.4); ctx.lineTo(s, s * 0.8);
    ctx.lineTo(0, s * 1.25); ctx.lineTo(-s, s * 0.8); ctx.lineTo(-s, -s * 0.4);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(3,20,10,0.85)';
    ctx.fillRect(-s * 0.22, -s * 0.55, s * 0.44, s * 1.1);
    ctx.restore();
  }

  // ulomky
  for (const r of rocks) {
    ctx.save(); ctx.translate(r.x, r.y); ctx.rotate(r.rot);
    ctx.beginPath();
    r.pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    ctx.closePath();
    const g = ctx.createLinearGradient(-r.r, -r.r, r.r, r.r);
    g.addColorStop(0, 'hsl(' + r.hue + ',48%,56%)');
    g.addColorStop(1, 'hsl(' + r.hue + ',44%,30%)');
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.restore();
  }

  // castice
  for (const p of parts) {
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = 'rgb(' + p.rgb + ')';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.sz, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // lod
  if (!(invuln > 0 && Math.floor(invuln * 12) % 2 === 1)) {
    ctx.save(); ctx.translate(ship.x, ship.y); ctx.rotate(ship.a);
    const k = SCL;
    if (keys.thrust && fuel > 0) {
      const fl = 12 * k + Math.random() * 9 * k;
      const g = ctx.createLinearGradient(-6 * k, 0, -6 * k - fl, 0);
      g.addColorStop(0, 'rgba(255,209,102,0.95)');
      g.addColorStop(1, 'rgba(255,107,107,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(-5 * k, -4 * k); ctx.lineTo(-6 * k - fl, 0); ctx.lineTo(-5 * k, 4 * k); ctx.closePath(); ctx.fill();
    }
    ctx.shadowColor = '#4dd2ff'; ctx.shadowBlur = 12 * k;
    const g = ctx.createLinearGradient(-10 * k, 0, 14 * k, 0);
    g.addColorStop(0, '#2b6f93'); g.addColorStop(1, '#bfeeff');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(14 * k, 0); ctx.lineTo(-9 * k, 7 * k); ctx.lineTo(-5 * k, 0); ctx.lineTo(-9 * k, -7 * k);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath(); ctx.ellipse(4 * k, 0, 4.4 * k, 3 * k, 0, 0, 6.2832); ctx.fill();
    ctx.fillStyle = 'rgba(167,139,250,0.62)';
    ctx.beginPath(); ctx.moveTo(-2 * k, 0); ctx.lineTo(-9 * k, 12 * k); ctx.lineTo(-11 * k, 7 * k); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-2 * k, 0); ctx.lineTo(-9 * k, -12 * k); ctx.lineTo(-11 * k, -7 * k); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // smerovka k portalu, ked je daleko
  const dpx = portal.x - ship.x, dpy = portal.y - ship.y;
  if (Math.hypot(dpx, dpy) > Math.min(W, H) * 0.42) {
    const a = Math.atan2(dpy, dpx);
    ctx.save(); ctx.translate(ship.x + Math.cos(a) * 34 * SCL, ship.y + Math.sin(a) * 34 * SCL); ctx.rotate(a);
    ctx.globalAlpha = 0.5 + 0.3 * Math.sin(tSec * 5);
    ctx.fillStyle = '#4dd2ff';
    ctx.beginPath(); ctx.moveTo(7 * SCL, 0); ctx.lineTo(-4 * SCL, 4.4 * SCL); ctx.lineTo(-4 * SCL, -4.4 * SCL); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // odskakujuce texty
  for (const p of pops) {
    ctx.globalAlpha = clamp(p.life, 0, 1);
    ctx.fillStyle = 'rgb(' + p.rgb + ')';
    ctx.font = '800 ' + Math.round(15 * SCL) + 'px Syne, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(p.txt, p.x, p.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // ── prekryvne texty stavu
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (state === ST.COUNT) {
    const n = Math.ceil(cdLeft);
    const frac = cdLeft - Math.floor(cdLeft);
    ctx.globalAlpha = 0.35 + 0.55 * frac;
    ctx.fillStyle = '#eaf4ff';
    ctx.font = '800 ' + Math.round(Math.min(W, H) * 0.2) + 'px Syne, sans-serif';
    ctx.fillText(n > 0 ? String(n) : '', W / 2, H / 2);
    ctx.globalAlpha = 1;
  }
  if (goFlash > 0) {
    ctx.globalAlpha = clamp(goFlash * 2, 0, 1);
    ctx.fillStyle = '#4dd2ff';
    ctx.font = '800 ' + Math.round(Math.min(W, H) * 0.13) + 'px Syne, sans-serif';
    ctx.fillText(t('uiGo'), W / 2, H / 2);
    ctx.globalAlpha = 1;
  }
  if (lvlFlash > 0) {
    ctx.globalAlpha = clamp(lvlFlash, 0, 1) * 0.9;
    ctx.fillStyle = '#a78bfa';
    ctx.font = '800 ' + Math.round(Math.min(W, H) * 0.075) + 'px Syne, sans-serif';
    ctx.fillText(t('orbitLevel') + ' ' + level, W / 2, H * 0.3);
    ctx.globalAlpha = 1;
  }
  if (state === ST.PLAY && fuel <= 0) {
    const left = Math.max(0, DRY_LIMIT - dryT);
    ctx.globalAlpha = 0.55 + 0.4 * Math.sin(tSec * 8);
    ctx.fillStyle = '#ff6b6b';
    ctx.font = '800 ' + Math.round(15 * SCL) + 'px Syne, sans-serif';
    ctx.fillText(t('orbitDry') + '  ' + left.toFixed(1) + 's', W / 2, H - 46 * SCL);
    ctx.globalAlpha = 1;
  }
  if (state === ST.PAUSE) {
    ctx.fillStyle = 'rgba(3,6,14,0.66)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#eaf4ff';
    ctx.font = '800 ' + Math.round(Math.min(W, H) * 0.07) + 'px Syne, sans-serif';
    ctx.fillText(t('uiPaused'), W / 2, H / 2);
    ctx.fillStyle = 'rgba(234,244,255,0.42)';
    ctx.font = '600 ' + Math.round(12 * SCL) + 'px "DM Sans", sans-serif';
    ctx.fillText(t('uiResume'), W / 2, H / 2 + Math.min(W, H) * 0.06);
  }
}

function frame(ts) {
  requestAnimationFrame(frame);
  const dt = tPrev ? Math.min(0.05, (ts - tPrev) / 1000) : 0;
  tPrev = ts;
  update(dt);
  draw();
}

// ── vstup ───────────────────────────────────────────────────────────────
const KEYMAP = {
  ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right',
  ArrowUp:'thrust', KeyW:'thrust', Space:'thrust',
};
document.addEventListener('keydown', e => {
  if (e.code === 'Escape' || e.code === 'KeyP') {
    e.preventDefault();
    if (state === ST.PLAY || state === ST.PAUSE) togglePause();
    return;
  }
  if (state === ST.PAUSE) { cdLeft = 1.2; state = ST.COUNT; return; }
  if ((state === ST.MENU || state === ST.OVER) && (e.code === 'Enter' || e.code === 'Space')) {
    e.preventDefault(); beginRound(); return;
  }
  const k = KEYMAP[e.code];
  if (!k) return;                        // ostatne klavesy nechavam prehliadacu
  e.preventDefault();
  keys[k] = true;
});
document.addEventListener('keyup', e => {
  const k = KEYMAP[e.code];
  if (k) keys[k] = false;
});
function bindBtn(id, k) {
  const el = document.getElementById(id);
  const on = e => { e.preventDefault(); el.classList.add('on'); keys[k] = true; };
  const off = e => { if (e) e.preventDefault(); el.classList.remove('on'); keys[k] = false; };
  el.addEventListener('pointerdown', on, {passive: false});
  el.addEventListener('pointerup', off);
  el.addEventListener('pointerleave', off);
  el.addEventListener('pointercancel', off);
}
bindBtn('btn-left', 'left');
bindBtn('btn-right', 'right');
bindBtn('btn-thrust', 'thrust');
cv.addEventListener('pointerdown', () => { if (state === ST.PAUSE) { cdLeft = 1.2; state = ST.COUNT; } });
document.getElementById('pause-btn').addEventListener('click', togglePause);
window.addEventListener('blur', () => { if (state === ST.PLAY) state = ST.PAUSE; for (const k in keys) keys[k] = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === ST.PLAY) state = ST.PAUSE; });

// ── obtiaznost ──────────────────────────────────────────────────────────
const row = document.getElementById('diff-row');
DIFFS.forEach((d, i) => {
  const b = document.createElement('button');
  b.textContent = t(d.key);
  b.className = i === diffIdx ? 'active' : '';
  b.addEventListener('click', () => {
    diffIdx = i;
    [...row.children].forEach((c, j) => c.className = j === i ? 'active' : '');
    loadBest();
    if (state === ST.OVER) document.getElementById('res-note').textContent = t('uiBest') + ' ' + best;
  });
  row.appendChild(b);
});
document.getElementById('ov-play').addEventListener('click', beginRound);

applyLang();
if (isTouch) document.body.classList.add('touch');
resize();
loadBest();
ship = {x: W / 2, y: H / 2, a: -Math.PI / 2, vx: 0, vy: 0};
initLevel(false);
showCard('menu');
requestAnimationFrame(frame);
</script>
