<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Color Slide · GamePad</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <script src="../../i18n.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; user-select:none;
            -webkit-tap-highlight-color:transparent; }
        body {
            background:#0c0f16;
            font-family:'Segoe UI', Roboto, system-ui, sans-serif;
            display:flex; justify-content:center; align-items:center;
            min-height:100vh; padding:12px;
            touch-action: manipulation;
        }
        #back-btn{
            position:fixed;top:14px;left:14px;z-index:60;
            display:flex;align-items:center;gap:7px;
            background:rgba(7,9,15,.88);border:1px solid #2b2b56;color:#8d88b8;
            padding:7px 14px;border-radius:100px;text-decoration:none;
            font-size:12px;font-weight:600;backdrop-filter:blur(4px);transition:all .18s;
        }
        #back-btn:hover,#back-btn:active{border-color:#7c6fff;color:#ece9ff;}
        @media(max-width:480px){#back-btn{top:8px;left:8px;padding:5px 10px;font-size:11px;}}

        #game-container {
            background:#151d2b; border-radius:28px; padding:20px 20px 24px;
            max-width:500px; width:100%;
            box-shadow:0 12px 40px rgba(0,0,0,.7); border:1px solid #2e3a4e;
            display:flex; flex-direction:column; gap:12px; position:relative;
        }
        #header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
        #header h1 { font-size:21px; font-weight:700; display:flex; align-items:center; gap:8px; }
        #rules { font-size:12px; color:#8291ab; line-height:1.5; text-align:center; }
        #settings { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
        #settings label { color:#b0c4e0; font-size:12px; font-weight:500; }
        .btn-group { display:flex; gap:4px; background:#111a28; padding:4px; border-radius:10px; border:1px solid #29344a; }
        .btn-group button { background:transparent; border:none; color:#7a8aa8; padding:4px 10px;
                            border-radius:8px; font-size:12px; font-weight:600; cursor:pointer; }
        .btn-group button.active { background:#7c6fff; color:#0c0f16; }
        #info-panel { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
        .info-card { flex:1 1 auto; min-width:60px; background:#111a28; border-radius:14px;
                     padding:8px 10px; border:1px solid #29344a; text-align:center; }
        .info-card h3 { font-size:10px; text-transform:uppercase; color:#7a8aa8; margin-bottom:4px;
                        font-weight:500; letter-spacing:.4px; }
        .info-card .value { font-size:20px; font-weight:700; color:#eef3fc; display:block; }
        .high-score { border-color:#fbbf24; }
        .high-score h3 { color:#fbbf24 !important; }
        .high-score .value { color:#fbbf24 !important; }
        #status-line { text-align:center; font-size:12px; color:#b3aaff; min-height:16px; font-weight:600; }

        #canvas-wrapper { background:#0f1622; border-radius:18px; padding:9px; position:relative;
                          align-self:center; box-shadow:inset 0 0 0 1px #2a3446; }
        #gameBoard { position:relative; width:100%; aspect-ratio:1/1; touch-action:manipulation; }
        .tile {
            position:absolute; left:0; top:0;
            display:flex; align-items:center; justify-content:center;
            border-radius:16px; cursor:pointer;
            font-family:'Syne', sans-serif; font-weight:800; color:#fff;
            text-shadow:0 2px 6px rgba(0,0,0,.55);
            box-shadow:0 5px 0 rgba(0,0,0,.34), 0 8px 14px rgba(0,0,0,.4),
                       inset 0 1px 0 rgba(255,255,255,.18);
            transition:transform .13s cubic-bezier(.3,.8,.4,1), box-shadow .12s, filter .12s;
            will-change:transform;
        }
        .tile:active { box-shadow:0 2px 0 rgba(0,0,0,.34); filter:brightness(1.14); }
        .tile.home { box-shadow:0 5px 0 rgba(0,0,0,.34), 0 8px 14px rgba(0,0,0,.4),
                     inset 0 1px 0 rgba(255,255,255,.18), inset 0 0 0 2px rgba(255,255,255,.34); }
        #gameBoard.done .tile { filter:brightness(1.12) saturate(1.1); }

        #controls { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
        #controls button { background:#1e2a3e; border:1px solid #354460; color:#d0def0;
                           border-radius:12px; padding:10px 18px; font-size:13px; font-weight:600; cursor:pointer; }
        #controls button:active { transform:translateY(2px); }

        #win-overlay {
            position:absolute; inset:0; display:none; flex-direction:column;
            align-items:center; justify-content:center; gap:9px; padding:26px;
            border-radius:28px; z-index:20; text-align:center;
            background:rgba(8,12,22,.92); backdrop-filter:blur(6px);
        }
        #win-overlay.visible { display:flex; }
        #win-overlay h2 { font-size:26px; }
        #win-overlay p { font-size:14px; color:#b0c4e0; }
        #recordLine { font-size:12px; color:#ffd166; font-weight:600; letter-spacing:.3px; min-height:15px; }
        #playAgainBtn {
            background:#7c6fff; border:1px solid #cfc9ff; border-radius:40px;
            padding:12px 32px; font-size:16px; font-weight:700; color:#0c0f16;
            box-shadow:0 6px 0 #4b3fd0; cursor:pointer; margin-top:6px;
        }
        #playAgainBtn:active { transform:translateY(6px); box-shadow:0 1px 0 #4b3fd0; }

        /* nizke obrazovky: menej chromu, plocha si vezme volne miesto */
        @media (max-height:900px){
          body{padding:6px !important;}
          #game-container{padding:12px 14px 14px !important;gap:9px !important;}
        }
        @media (max-height:760px){
          body{padding:3px !important;}
          #game-container{padding:8px 10px 10px !important;gap:6px !important;border-radius:18px !important;}
          #win-overlay{border-radius:18px !important;}
        }
        @media (max-height:640px){
          #rules{display:none !important;}
          #header h1{font-size:16px !important;}
        }
        @media (max-width:560px){
          #game-container{padding-top:44px !important;}
        }
        @media (max-height:520px) and (orientation:landscape){
          /* na sirku nechavam co najviac miesta ploche: nazov ide vedla tlacidla Spat */
          body{padding:4px !important;align-items:flex-start !important;}
          #game-container{max-width:100% !important;padding:8px 10px 8px !important;gap:4px !important;}
          #header{padding-left:104px !important;}
          #settings label{display:none !important;}
          #info-panel{gap:4px !important;}
          .info-card{padding:4px 8px !important;min-width:52px !important;}
          .info-card h3{font-size:8px !important;margin-bottom:0 !important;}
          .info-card .value{font-size:15px !important;}
          #status-line{font-size:10px !important;min-height:12px !important;}
          #controls button{padding:6px 12px !important;font-size:11.5px !important;}
        }
        @media (min-width:700px){
          #game-container{max-width:560px !important;}
        }

<body>
<a href="../../index.html" id="back-btn">
  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
  <span id="lbl-back"></span>
</a>

<div id="game-container">
    <div id="header">
        <h1>🎲 <span id="lbl-title"></span></h1>
        <div id="settings">
            <label id="lbl-size"></label>
            <div class="btn-group" id="sizeGroup">
                <button data-n="4" class="active">4×4</button>
                <button data-n="5">5×5</button>
                <button data-n="6">6×6</button>
            </div>
        </div>
    </div>

    <p id="rules"></p>

    <div id="info-panel">
        <div class="info-card"><h3 id="lbl-moves"></h3><span class="value" id="moveValue">0</span></div>
        <div class="info-card"><h3 id="lbl-time"></h3><span class="value" id="timeValue">0:00</span></div>
        <div class="info-card high-score"><h3 id="lbl-best"></h3><span class="value" id="bestValue">-</span></div>
    </div>

    <div id="status-line"></div>

    <div id="canvas-wrapper">
        <div id="gameBoard"></div>
    </div>

    <div id="controls">
        <button id="newGameBtn"></button>
        <button id="restartBtn"></button>
    </div>

    <div id="win-overlay">
        <h2 id="lbl-win"></h2>
        <p><span id="lbl-win-moves"></span> <span id="finalMoves">0</span></p>
        <p><span id="lbl-win-time"></span> <span id="finalTime">0:00</span></p>
        <div id="recordLine"></div>
        <button id="playAgainBtn"></button>
    </div>
</div>

<script>
(function () {
    "use strict";

    const boardEl   = document.getElementById('gameBoard');
    const wrapEl    = document.getElementById('canvas-wrapper');
    const statusEl  = document.getElementById('status-line');
    const moveSpan  = document.getElementById('moveValue');
    const timeSpan  = document.getElementById('timeValue');
    const bestSpan  = document.getElementById('bestValue');
    const overlay   = document.getElementById('win-overlay');
    const recordEl  = document.getElementById('recordLine');
    const sizeGroup = document.getElementById('sizeGroup');

    const gapFor = n => n >= 6 ? 5 : (n === 5 ? 6 : 8);   // vacsia plocha, tesnejsie odstupy
    let N = 4;                           // strana plochy
    let board = [], startBoard = [], gap = 0;
    let moves = 0, solved = false;
    let tiles = new Map();               // hodnota dlazdice -> jej prvok
    let startedAt = 0, elapsed = 0, ticker = 0;
    let best = 0;

    // ----- rekord na velkost plochy -----
    const bestKey = () => 'colorslide_best_' + N;
    function loadBest() {
        best = parseInt(localStorage.getItem(bestKey()) || '0', 10) || 0;
        bestSpan.textContent = best ? best : '-';
    }
    function saveBest(m) {
        if (!best || m < best) {
            best = m;
            try { localStorage.setItem(bestKey(), String(best)); } catch (e) {}
            bestSpan.textContent = best;
            return true;
        }
        return false;
    }

    // ----- cas -----
    const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
    function stopClock() { clearInterval(ticker); ticker = 0; }
    function startClock() {
        stopClock();
        startedAt = Date.now();
        elapsed = 0;
        timeSpan.textContent = '0:00';
        ticker = setInterval(() => {
            if (solved) return;
            elapsed = (Date.now() - startedAt) / 1000;
            timeSpan.textContent = fmt(elapsed);
        }, 250);
    }

    // ----- zamiesanie, ktore je vzdy riesitelne (miesam z hotoveho stavu) -----
    function shuffled() {
        const arr = [];
        for (let i = 1; i < N * N; i++) arr.push(i);
        arr.push(0);
        let g = N * N - 1, last = -1;
        const steps = 90 * N;
        for (let i = 0; i < steps; i++) {
            const r = Math.floor(g / N), c = g % N, nb = [];
            if (r > 0) nb.push(g - N);
            if (r < N - 1) nb.push(g + N);
            if (c > 0) nb.push(g - 1);
            if (c < N - 1) nb.push(g + 1);
            let pick = nb.filter(x => x !== last);
            if (!pick.length) pick = nb;
            const to = pick[Math.floor(Math.random() * pick.length)];
            arr[g] = arr[to]; arr[to] = 0;
            last = g; g = to;
        }
        if (isDone(arr)) return shuffled();      // hotovu plochu na zaciatku nechcem
        return { board: arr, gap: arr.indexOf(0) };
    }

    function isDone(arr) {
        for (let i = 0; i < arr.length - 1; i++) if (arr[i] !== i + 1) return false;
        return arr[arr.length - 1] === 0;
    }

    // ----- kresba -----
    // farba nesie cielove miesto dlazdice: odtien plynie v poradi citania,
    // takze hotova plocha je plynuly farebny prechod a ziadne cisla netreba.
    // Svetlost mierne klesa po riadkoch, aby sa dva blizke odtiene odlisili.
    function tileColour(v) {
        const home = v - 1;
        const r = Math.floor(home / N);
        const hue = Math.round(home / (N * N - 2) * 320);
        const lig = 62 - r * 3;
        return 'linear-gradient(160deg,hsl(' + hue + ',74%,' + (lig + 7) + '%),hsl(' + hue + ',68%,' + (lig - 7) + '%))';
    }

    function build() {
        boardEl.innerHTML = '';
        tiles = new Map();
        for (let i = 0; i < board.length; i++) {
            const v = board[i];
            if (!v) continue;
            const el = document.createElement('div');
            el.className = 'tile';
            el.setAttribute('aria-label', String(v));
            el.style.background = tileColour(v);
            el.addEventListener('click', () => tap(v));
            tiles.set(v, el);
            boardEl.appendChild(el);
        }
        layout();
    }

    function layout() {
        const side = boardEl.clientWidth;
        if (side < 20) return;
        const GAP = gapFor(N);
        const cell = (side - GAP * (N - 1)) / N;
        boardEl.style.setProperty('--cell', cell + 'px');
        tiles.forEach((el, v) => {
            const i = board.indexOf(v);
            const r = Math.floor(i / N), c = i % N;
            el.style.width = cell + 'px';
            el.style.height = cell + 'px';
            el.style.borderRadius = Math.max(9, Math.round(cell * 0.2)) + 'px';
            el.style.transform = 'translate(' + (c * (cell + GAP)) + 'px,' + (r * (cell + GAP)) + 'px)';
            el.classList.toggle('home', v === i + 1);
        });
    }

    // plocha je stvorec: sirku beriem z panelu, ale nesmie prerast vysku okna
    function fitBoard(hint) {
        const cont = document.getElementById('game-container');
        const land = window.matchMedia('(max-height:520px) and (orientation:landscape)').matches;
        const availW = Math.min(430, (cont ? cont.clientWidth : 340) - 40);
        const availH = hint || Math.max(150, window.innerHeight - (land ? 150 : 300));
        const side = Math.max(120, Math.min(availW, availH));
        wrapEl.style.width = (side + 18) + 'px';
        layout();
        if (!hint) {
            // par bodov pretekania by vyvolalo posuvnik: vratim ich ploche
            const spill = document.documentElement.scrollHeight - window.innerHeight;
            if (spill > 2 && side - spill > 120) { fitBoard(side - spill - 3); }
        }
    }

    // ----- tah -----
    function canMove(i) {
        const r = Math.floor(i / N), c = i % N;
        const gr = Math.floor(gap / N), gc = gap % N;
        return (r === gr && Math.abs(c - gc) === 1) || (c === gc && Math.abs(r - gr) === 1);
    }

    function tap(v) {
        if (solved) return;
        const i = board.indexOf(v);
        if (!canMove(i)) { statusEl.textContent = t('cestyStatusInvalid'); return; }
        board[gap] = v; board[i] = 0; gap = i;
        moves++;
        moveSpan.textContent = moves;
        statusEl.textContent = '';
        layout();
        if (isDone(board)) win();
    }

    // klavesnica: smer je ten, ktorym sa dlazdica posunie
    function keyMove(dr, dc) {
        const gr = Math.floor(gap / N), gc = gap % N;
        const r = gr - dr, c = gc - dc;
        if (r < 0 || r >= N || c < 0 || c >= N) return;
        tap(board[r * N + c]);
    }

    function win() {
        solved = true;
        stopClock();
        boardEl.classList.add('done');
        statusEl.textContent = t('cestyStatusWin');
        document.getElementById('finalMoves').textContent = moves;
        document.getElementById('finalTime').textContent = fmt(elapsed);
        recordEl.textContent = saveBest(moves) ? t('uiNewRecord') : '';
        overlay.classList.add('visible');
    }

    // ----- start -----
    function newGame() {
        const s = shuffled();
        startBoard = s.board.slice();
        start(startBoard);
        statusEl.textContent = t('cestyStatusNewGame');
        setTimeout(() => { if (!solved && !moves) statusEl.textContent = t('cestyStatusReady'); }, 500);
    }

    function restart() {
        start(startBoard);
        statusEl.textContent = t('cestyStatusReset');
        setTimeout(() => { if (!solved && !moves) statusEl.textContent = t('cestyStatusReady'); }, 500);
    }

    function start(src) {
        board = src.slice();
        gap = board.indexOf(0);
        moves = 0; solved = false;
        moveSpan.textContent = '0';
        boardEl.classList.remove('done');
        overlay.classList.remove('visible');
        recordEl.textContent = '';
        loadBest();
        build();
        fitBoard();
        startClock();
    }

    // ----- ovladanie -----
    document.getElementById('newGameBtn').addEventListener('click', newGame);
    document.getElementById('restartBtn').addEventListener('click', restart);
    document.getElementById('playAgainBtn').addEventListener('click', newGame);
    sizeGroup.querySelectorAll('button').forEach(b => {
        b.addEventListener('click', () => {
            sizeGroup.querySelectorAll('button').forEach(x => x.classList.remove('active'));
            b.classList.add('active');
            N = parseInt(b.dataset.n, 10);
            newGame();
        });
    });
    document.addEventListener('keydown', e => {
        const k = e.key;
        let d = null;
        if (k === 'ArrowLeft' || k === 'a' || k === 'A') d = [0, -1];
        else if (k === 'ArrowRight' || k === 'd' || k === 'D') d = [0, 1];
        else if (k === 'ArrowUp' || k === 'w' || k === 'W') d = [-1, 0];
        else if (k === 'ArrowDown' || k === 's' || k === 'S') d = [1, 0];
        if (!d) return;
        e.preventDefault();
        keyMove(d[0], d[1]);
    });
    let fitTimer = 0;
    window.addEventListener('resize', () => { clearTimeout(fitTimer); fitTimer = setTimeout(fitBoard, 120); });
    window.addEventListener('load', () => fitBoard());   // udalost sa nesmie dostat do parametra

    // ----- jazyk -----
    function applyLang() {
        document.getElementById('lbl-back').textContent  = t('back');
        document.getElementById('lbl-title').textContent = t('cestyTitle');
        document.getElementById('lbl-size').textContent  = t('uiDifficulty');
        document.getElementById('lbl-moves').textContent = t('uiMoves');
        document.getElementById('lbl-time').textContent  = t('uiTime');
        document.getElementById('lbl-best').textContent  = t('uiBest');
        document.getElementById('rules').textContent     = t('cestyFooter');
        document.getElementById('newGameBtn').textContent  = t('cestyBtnNew');
        document.getElementById('restartBtn').textContent  = t('cestyBtnReset');
        document.getElementById('lbl-win').textContent     = t('uiSolved');
        document.getElementById('lbl-win-moves').textContent = t('uiMoves') + ':';
        document.getElementById('lbl-win-time').textContent  = t('uiTime') + ':';
        document.getElementById('playAgainBtn').textContent = t('uiNewGame');
        document.title = t('cestyTitle') + ' · GamePad';
    }
    window.addEventListener('storage', e => { if (e.key === 'gamepad_lang') applyLang(); });

    applyLang();
    newGame();
    requestAnimationFrame(() => fitBoard());
})();
</script>
</body>
</html>
