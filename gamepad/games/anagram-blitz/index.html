<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anagram Blitz · GamePad</title>
    <script src="../../i18n.js"></script>
    <style>
        #back-btn{
            position:fixed;top:14px;left:14px;z-index:60;
            display:flex;align-items:center;gap:7px;
            background:rgba(7,9,15,.88);border:1px solid #402049;color:#8291ab;
            padding:7px 14px;border-radius:100px;text-decoration:none;
            font-size:12px;font-weight:600;backdrop-filter:blur(4px);transition:all .18s;
        }
        #back-btn:hover,#back-btn:active{border-color:#e879f9;color:#f0f4fe;}
        @media(max-width:480px){#back-btn{top:8px;left:8px;padding:5px 10px;font-size:11px;}}
        * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
        body {
            background:#0c0f16;
            font-family:'Segoe UI', Roboto, system-ui, sans-serif;
            display:flex; justify-content:center; align-items:center;
            min-height:100vh; margin:0; padding:12px;
        }
        #game-container {
            background:#151d2b;
            border-radius:28px;
            padding:20px 24px 24px;
            max-width:460px;
            width:100%;
            box-shadow:0 12px 40px rgba(0,0,0,.7);
            border:1px solid #2e3a4e;
            display:flex; flex-direction:column; gap:14px;
            position:relative;
        }
        #header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
        #header h1 {
            font-size:21px; font-weight:700;
            background:linear-gradient(135deg,#f5d0fe,#e879f9);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
            margin:0;
        }
        #rules { font-size:12px; color:#8291ab; line-height:1.5; }
        #settings { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
        #settings label { color:#b0c4e0; font-size:12px; font-weight:500; }
        .btn-group { display:flex; gap:4px; background:#111a28; padding:4px; border-radius:10px; border:1px solid #29344a; }
        .btn-group button { background:transparent; border:none; color:#7a8aa8; padding:4px 10px; border-radius:8px; font-size:12px; font-weight:600; cursor:pointer; }
        .btn-group button.active { background:#e879f9; color:#0c0f16; }
        #info-panel { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
        .info-card { flex:1 1 auto; min-width:56px; background:#111a28; border-radius:14px; padding:8px 10px; border:1px solid #29344a; text-align:center; }
        .info-card h3 { font-size:10px; text-transform:uppercase; color:#7a8aa8; margin-bottom:4px; font-weight:500; }
        .info-card .value { font-size:20px; font-weight:700; color:#eef3fc; display:block; }
        .high-score { border-color:#fbbf24; }
        .high-score h3 { color:#fbbf24 !important; }
        .high-score .value { color:#fbbf24 !important; }
        #board {
            background:#0f1622; border-radius:16px; padding:18px 14px;
            box-shadow: inset 0 0 0 1px #2a3446;
            display:flex; flex-direction:column; gap:16px; align-items:center;
            position:relative;
        }
        #answer-row { display:flex; gap:6px; justify-content:center; min-height:48px; flex-wrap:wrap; }
        #scrambled-row { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; }
        .tile {
            width:42px; height:42px; border-radius:10px;
            display:flex; align-items:center; justify-content:center;
            font-size:19px; font-weight:800; cursor:pointer;
            transition: transform .08s;
        }
        .tile.scrambled {
            background:#1e2a3e; border:2px solid #354460; color:#eef3fc;
        }
        .tile.scrambled:active { transform:translateY(2px); }
        .tile.answer-slot {
            background:#2a1e3e; border:2px dashed #4c1d95; color:#f5d0fe;
        }
        .tile.answer-filled {
            background:#4c1d95; border:2px solid #e879f9; color:#fff;
            cursor:pointer;
        }
        #feedback { min-height:18px; font-size:13px; font-weight:600; text-align:center; }
        #feedback.error { color:#f87171; }
        #feedback.ok { color:#6ee7b7; }
        #controls { display:flex; gap:10px; justify-content:center; }
        #controls button {
            background:#1e2a3e; border:1px solid #354460; color:#d0def0;
            border-radius:12px; padding:9px 16px; font-size:13px; font-weight:600; cursor:pointer;
        }
        #controls button:active { transform:translateY(2px); }
        #end-overlay {
            position:absolute; inset:0; background:rgba(8,12,22,.94); backdrop-filter:blur(6px);
            border-radius:16px; display:none; flex-direction:column; align-items:center; justify-content:center;
            gap:8px; padding:26px; z-index:10; color:#f0f4fe; text-align:center;
        }
        #end-overlay.visible { display:flex; }
        #end-overlay h2 {
            font-size:26px;
            background:linear-gradient(135deg,#f5d0fe,#e879f9);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
        }
        #restartBtn {
            background:#e879f9; border:1px solid #f5d0fe; border-radius:40px;
            padding:12px 32px; font-size:17px; font-weight:700; color:#0c0f16;
            box-shadow:0 6px 0 #a21caf; cursor:pointer; margin-top:6px;
        }
        #restartBtn:active { transform:translateY(6px); box-shadow:0 1px 0 #a21caf; }
    </style>
</head>

]}, {"word": "throatily", "siblings": ["throatily"]}, {"word": "tinging", "siblings": ["tinging"]}, {"word": "tolerable", "siblings": ["tolerable"]}, {"word": "tonsure", "siblings": ["tonsure"]}, {"word": "topmast", "siblings": ["topmast"]}, {"word": "tortoises", "siblings": ["tortoises"]}, {"word": "touchstone", "siblings": ["touchstone"]}, {"word": "tramped", "siblings": ["tramped"]}, {"word": "trollies", "siblings": ["trollies"]}, {"word": "trusses", "siblings": ["russets", "trusses"]}, {"word": "tumbrils", "siblings": ["tumbrils"]}, {"word": "twigging", "siblings": ["twigging"]}, {"word": "unburdens", "siblings": ["sunburned", "unburdens"]}, {"word": "uncivil", "siblings": ["uncivil"]}, {"word": "undeceived", "siblings": ["undeceived"]}, {"word": "unformed", "siblings": ["unformed"]}, {"word": "unicameral", "siblings": ["unicameral"]}, {"word": "unoccupied", "siblings": ["unoccupied"]}, {"word": "unsaying", "siblings": ["unsaying"]}, {"word": "untimelier", "siblings": ["untimelier"]}, {"word": "untried", "siblings": ["intrude", "untried"]}, {"word": "unwashed", "siblings": ["unwashed"]}, {"word": "vaporized", "siblings": ["vaporized"]}, {"word": "variety", "siblings": ["variety"]}, {"word": "veiling", "siblings": ["veiling"]}, {"word": "verandahs", "siblings": ["verandahs"]}, {"word": "vulgarly", "siblings": ["vulgarly"]}, {"word": "wafting", "siblings": ["wafting"]}, {"word": "wardrobes", "siblings": ["wardrobes"]}, {"word": "widescreen", "siblings": ["widescreen"]}, {"word": "windowing", "siblings": ["windowing"]}, {"word": "witnesses", "siblings": ["witnesses"]}, {"word": "woodwind", "siblings": ["woodwind"]}]};

            const backLbl = document.getElementById('lbl-back');
            const sizeGroup = document.getElementById('sizeGroup');
            const rulesP = document.getElementById('rules');
            const timeSpan = document.getElementById('timeValue');
            const scoreSpan = document.getElementById('scoreValue');
            const comboSpan = document.getElementById('comboValue');
            const wordsSpan = document.getElementById('wordsValue');
            const bestSpan = document.getElementById('bestValue');
            const answerRow = document.getElementById('answer-row');
            const scrambledRow = document.getElementById('scrambled-row');
            const feedback = document.getElementById('feedback');
            const skipBtn = document.getElementById('skipBtn');
            const endOverlay = document.getElementById('end-overlay');
            const finalScore = document.getElementById('finalScore');
            const finalWords = document.getElementById('finalWords');
            const restartBtn = document.getElementById('restartBtn');

            // ----- PREKLADY -----
            backLbl.textContent = t('back');
            document.getElementById('lbl-size').textContent = t('anaDifficulty');
            document.getElementById('lbl-size-s').textContent = t('anaEasy');
            document.getElementById('lbl-size-m').textContent = t('anaMedium');
            document.getElementById('lbl-size-l').textContent = t('anaHard');
            document.getElementById('lbl-time').textContent = t('anaTime');
            document.getElementById('lbl-score').textContent = t('anaScore');
            document.getElementById('lbl-combo').textContent = t('anaCombo');
            document.getElementById('lbl-words').textContent = t('anaWords');
            document.getElementById('lbl-best').textContent = t('anaBest');
            document.getElementById('lbl-timeup').textContent = t('anaTimeUp');
            document.getElementById('lbl-final-score').textContent = t('anaScore') + ':';
            document.getElementById('lbl-final-words').textContent = t('anaWords') + ':';
            document.getElementById('lbl-skip').textContent = t('anaSkip');
            restartBtn.textContent = t('anaReplay');
            rulesP.textContent = t('anaRules');

            // ----- STAV -----
            const ROUND_MS = 60000;
            let diffKey = 'medium';
            let currentPuzzle = null;
            let scrambled = [];
            let answerIdx = [];
            let score = 0, combo = 0, wordsSolved = 0;
            let best = parseInt(localStorage.getItem('anagramBlitzBest') || '0', 10);
            let timeLeft = ROUND_MS;
            let running = true;
            let timerId = null;
            let recentWords = [];

            bestSpan.textContent = best;

            function pickPuzzle() {
                const pool = PUZZLES[diffKey];
                let p;
                let attempts = 0;
                do {
                    p = pool[Math.floor(Math.random() * pool.length)];
                    attempts++;
                } while (recentWords.includes(p.word) && attempts < 10);
                recentWords.push(p.word);
                if (recentWords.length > 15) recentWords.shift();
                return p;
            }

            function shuffleLetters(word) {
                const letters = word.split('');
                let attempts = 0;
                let sh;
                do {
                    sh = letters.slice();
                    for (let i = sh.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [sh[i], sh[j]] = [sh[j], sh[i]];
                    }
                    attempts++;
                } while (sh.join('') === word && attempts < 20 && word.length > 1);
                return sh;
            }

            function newWord() {
                currentPuzzle = pickPuzzle();
                scrambled = shuffleLetters(currentPuzzle.word);
                answerIdx = [];
                feedback.textContent = '';
                feedback.className = '';
                render();
            }

            function render() {
                answerRow.innerHTML = '';
                for (let i = 0; i < scrambled.length; i++) {
                    const div = document.createElement('div');
                    if (i < answerIdx.length) {
                        div.className = 'tile answer-filled';
                        div.textContent = scrambled[answerIdx[i]].toUpperCase();
                        const slotPos = i;
                        div.addEventListener('click', () => removeFromAnswer(slotPos));
                    } else {
                        div.className = 'tile answer-slot';
                        div.textContent = '';
                    }
                    answerRow.appendChild(div);
                }

                scrambledRow.innerHTML = '';
                scrambled.forEach((letter, idx) => {
                    const div = document.createElement('div');
                    const used = answerIdx.includes(idx);
                    div.className = 'tile scrambled';
                    div.textContent = letter.toUpperCase();
                    div.style.visibility = used ? 'hidden' : 'visible';
                    div.addEventListener('click', () => addToAnswer(idx));
                    scrambledRow.appendChild(div);
                });
            }

            function addToAnswer(idx) {
                if (!running || answerIdx.includes(idx)) return;
                answerIdx.push(idx);
                render();
                if (answerIdx.length === scrambled.length) {
                    checkAnswer();
                }
            }

            function removeFromAnswer(slotPos) {
                if (!running) return;
                answerIdx.splice(slotPos, 1);
                render();
            }

            function checkAnswer() {
                const answer = answerIdx.map(i => scrambled[i]).join('');
                if (currentPuzzle.siblings.includes(answer)) {
                    const gained = currentPuzzle.word.length * 8 + combo * 4;
                    score += gained;
                    combo++;
                    wordsSolved++;
                    scoreSpan.textContent = score;
                    comboSpan.textContent = combo;
                    wordsSpan.textContent = wordsSolved;
                    feedback.textContent = '+' + gained;
                    feedback.className = 'ok';
                    if (score > best) {
                        best = score;
                        bestSpan.textContent = best;
                        localStorage.setItem('anagramBlitzBest', String(best));
                    }
                    setTimeout(newWord, 350);
                } else {
                    combo = 0;
                    comboSpan.textContent = '0';
                    feedback.textContent = t('anaWrong');
                    feedback.className = 'error';
                    answerIdx = [];
                    render();
                }
            }

            skipBtn.addEventListener('click', () => {
                if (!running) return;
                combo = 0;
                comboSpan.textContent = '0';
                newWord();
            });

            function tick() {
                if (!running) return;
                timeLeft -= 1000;
                timeSpan.textContent = Math.max(0, Math.ceil(timeLeft / 1000)) + 's';
                if (timeLeft <= 0) endRound();
            }

            function endRound() {
                running = false;
                clearInterval(timerId);
                finalScore.textContent = score;
                finalWords.textContent = wordsSolved;
                endOverlay.classList.add('visible');
            }

            function resetGame() {
                clearInterval(timerId);
                score = 0; combo = 0; wordsSolved = 0;
                timeLeft = ROUND_MS;
                running = true;
                recentWords = [];
                scoreSpan.textContent = '0';
                comboSpan.textContent = '0';
                wordsSpan.textContent = '0';
                timeSpan.textContent = Math.ceil(ROUND_MS / 1000) + 's';
                endOverlay.classList.remove('visible');
                newWord();
                timerId = setInterval(tick, 1000);
            }

            restartBtn.addEventListener('click', resetGame);
            sizeGroup.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', () => {
                    sizeGroup.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    diffKey = btn.dataset.diff;
                    resetGame();
                });
            });

            resetGame();
        })();
