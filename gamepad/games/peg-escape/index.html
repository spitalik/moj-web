<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Peg Escape · GamePad</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <script src="../../i18n.js"></script>
    <style>
        #back-btn{
            position:fixed;top:14px;left:14px;z-index:60;
            display:flex;align-items:center;gap:7px;
            background:rgba(7,9,15,.88);border:1px solid #1a2e40;color:#8291ab;
            padding:7px 14px;border-radius:100px;text-decoration:none;
            font-size:12px;font-weight:600;backdrop-filter:blur(4px);transition:all .18s;
        }
        #back-btn:hover,#back-btn:active{border-color:#38bdf8;color:#f0f4fe;}
        @media(max-width:480px){#back-btn{top:8px;left:8px;padding:5px 10px;font-size:11px;}}
        * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
        body {
            background:#0c0f16;
            font-family:'Segoe UI', Roboto, system-ui, sans-serif;
            display:flex; justify-content:center; align-items:center;
            min-height:100vh; margin:0; padding:12px;
            touch-action: manipulation;
        }
        #game-container {
            background:#151d2b;
            border-radius:28px;
            padding:20px 24px 24px;
            max-width:440px;
            width:100%;
            box-shadow:0 12px 40px rgba(0,0,0,.7);
            border:1px solid #2e3a4e;
            display:flex; flex-direction:column; gap:14px;
            position:relative;
        }
        #header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
        #header h1 {
            font-size:21px; font-weight:700;
            background:linear-gradient(135deg,#bae6fd,#38bdf8);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
            margin:0;
        }
        #rules { font-size:12px; color:#8291ab; line-height:1.5; }
        #settings { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
        #settings label { color:#b0c4e0; font-size:12px; font-weight:500; }
        .btn-group { display:flex; gap:4px; background:#111a28; padding:4px; border-radius:10px; border:1px solid #29344a; }
        .btn-group button { background:transparent; border:none; color:#7a8aa8; padding:4px 10px; border-radius:8px; font-size:12px; font-weight:600; cursor:pointer; }
        .btn-group button.active { background:#38bdf8; color:#0c0f16; }
        #info-panel { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
        .info-card { flex:1 1 auto; min-width:60px; background:#111a28; border-radius:14px; padding:8px 10px; border:1px solid #29344a; text-align:center; }
        .info-card h3 { font-size:10px; text-transform:uppercase; color:#7a8aa8; margin-bottom:4px; font-weight:500; }
        .info-card .value { font-size:20px; font-weight:700; color:#eef3fc; display:block; }
        .high-score { border-color:#fbbf24; }
        .high-score h3 { color:#fbbf24 !important; }
        .high-score .value { color:#fbbf24 !important; }
        #canvas-wrapper {
            background:#0f1622; border-radius:16px; padding:8px;
            box-shadow: inset 0 0 0 1px #2a3446;
            position:relative; align-self:center;
        }
        #gameCanvas { display:block; border-radius:10px; touch-action:none; cursor:pointer; }
        #end-overlay {
            position:absolute; inset:8px; background:rgba(8,12,22,.92); backdrop-filter:blur(6px);
            border-radius:10px; display:none; flex-direction:column; align-items:center; justify-content:center;
            gap:8px; padding:26px; z-index:10; color:#f0f4fe; text-align:center;
        }
        #end-overlay.visible { display:flex; }
        #end-overlay h2 {
            font-size:26px;
            background:linear-gradient(135deg,#bae6fd,#38bdf8);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
        }
        #end-overlay h2.stuck {
            background:linear-gradient(135deg,#fca5a5,#f87171);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
        }
        #restartBtn {
            background:#38bdf8; border:1px solid #bae6fd; border-radius:40px;
            padding:12px 32px; font-size:17px; font-weight:700; color:#0c0f16;
            box-shadow:0 6px 0 #0369a1; cursor:pointer; margin-top:6px;
        }
        #restartBtn:active { transform:translateY(6px); box-shadow:0 1px 0 #0369a1; }
        #controls { display:flex; gap:10px; justify-content:center; }
        #controls button {
            background:#1e2a3e; border:1px solid #354460; color:#d0def0;
            border-radius:12px; padding:9px 16px; font-size:13px; font-weight:600; cursor:pointer;
        }
        #controls button:active { transform:translateY(2px); }
        #undoBtn { border-color:#fb923c; color:#fed7aa; }
    
/* mobil/tablet: na nízkych obrazovkách stlačím rámce, aby ovládanie zostalo viditeľné */
@media (max-height:900px){
  body{padding:6px !important;}
  #game-container{padding:12px 14px 14px !important;gap:9px !important;}
}
@media (max-height:760px){
  body{padding:3px !important;}
  #game-container{padding:8px 10px 10px !important;gap:6px !important;border-radius:18px !important;}
}

/* nízke obrazovky: hracia plocha sa zmenší do dostupného miesta namiesto pretečenia */
@media (max-height:900px){
  #game-container{max-height:calc(100vh - 10px);}
  #canvas-wrapper{min-height:0;flex:0 1 auto;}
  #gameCanvas{max-height:100%;max-width:100%;width:auto;height:auto;}
}

@media (max-height:700px){
  #rules{display:none !important;}
}

/* ── zladenie s ostatnymi hrami zbierky ─────────────────────────────── */
:root{
  --fa:#94a3b8;--fb:#38bdf8;--fgold:#ffd166;
  --ftext:#eef3fc;--fmuted:rgba(238,243,252,0.44);--fdim:rgba(238,243,252,0.2);
  --fbd:rgba(255,255,255,0.09);
}
body{
  font-family:'DM Sans',system-ui,sans-serif !important;
  background:radial-gradient(ellipse at 50% -8%, rgba(148,163,184,.14) 0%, transparent 58%), #070a12 !important;
  color:var(--ftext) !important;
}
#back-btn{background:rgba(10,13,24,0.72) !important;border:1px solid var(--fbd) !important;color:var(--fmuted) !important;font-weight:500 !important;}
#back-btn:hover,#back-btn:active{border-color:rgba(255,255,255,0.18) !important;color:#fff !important;}
#game-container{
  background:linear-gradient(165deg,rgba(255,255,255,0.045),rgba(255,255,255,0.012)) !important;
  border:1px solid rgba(255,255,255,0.13) !important;border-radius:26px !important;
  box-shadow:0 30px 70px -28px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.06) !important;
}
#header h1{
  font-family:'Syne',sans-serif !important;font-weight:800 !important;font-size:19px !important;
  letter-spacing:-.3px !important;
  background:linear-gradient(110deg,var(--fa) 5%,#fff 55%,var(--fb) 95%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
#settings label{color:var(--fdim) !important;font-size:9px !important;font-weight:600 !important;
  letter-spacing:1.1px !important;text-transform:uppercase !important;}
#rules{color:var(--fmuted) !important;font-size:11px !important;line-height:1.6 !important;}
.btn-group{background:rgba(255,255,255,0.04) !important;border:1px solid var(--fbd) !important;
  border-radius:100px !important;padding:3px !important;gap:2px !important;}
.btn-group button{border-radius:100px !important;color:var(--fmuted) !important;
  font-family:'DM Sans',sans-serif !important;font-size:11px !important;font-weight:600 !important;
  padding:5px 12px !important;transition:color .16s,background .16s !important;}
.btn-group button:hover{color:#fff !important;}
.btn-group button.active{background:rgba(148,163,184,.16) !important;color:#fff !important;
  box-shadow:inset 0 0 0 1px rgba(148,163,184,.42) !important;}
.info-card{background:rgba(255,255,255,0.04) !important;border:1px solid var(--fbd) !important;
  border-radius:14px !important;}
.info-card h3{font-size:8.5px !important;letter-spacing:1.3px !important;color:var(--fdim) !important;
  font-weight:600 !important;text-transform:uppercase !important;}
.info-card .value{font-family:'Syne',sans-serif !important;font-weight:800 !important;
  font-size:18px !important;letter-spacing:-.5px !important;font-variant-numeric:tabular-nums;
  color:var(--fa) !important;}
.high-score{border-color:rgba(255,209,102,.35) !important;}
.high-score h3{color:rgba(255,209,102,.55) !important;}
.high-score .value{color:var(--fgold) !important;}
#canvas-wrapper{background:rgba(0,0,0,0.34) !important;border-radius:18px !important;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,0.07) !important;}
#controls button,#padrow button,#controls>button{
  background:linear-gradient(160deg,rgba(255,255,255,0.07),rgba(255,255,255,0.02)) !important;
  border:1px solid var(--fbd) !important;color:var(--fmuted) !important;
  border-radius:15px !important;box-shadow:none !important;
  font-family:'DM Sans',sans-serif !important;
}
#controls button:active,#padrow button:active{background:rgba(148,163,184,.18) !important;
  border-color:rgba(148,163,184,.45) !important;color:#fff !important;transform:scale(.95) !important;}
#status-line{color:var(--fmuted) !important;font-weight:600 !important;}
/* prekryvy: rodinna karta */
#game-over-overlay,#win-overlay,#pause-overlay{
  background:radial-gradient(ellipse at center,rgba(8,10,20,0.84) 0%,rgba(3,4,9,0.96) 78%) !important;
  backdrop-filter:blur(6px) !important;border-radius:18px !important;
}
#game-over-overlay h2,#win-overlay h2,#pause-overlay span{
  font-family:'Syne',sans-serif !important;font-weight:800 !important;letter-spacing:-.5px !important;
}
#game-over-overlay h2,#win-overlay h2{
  font-size:24px !important;
  background:linear-gradient(110deg,var(--fa) 5%,#fff 55%,var(--fb) 95%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  text-shadow:none !important;
}
#game-over-overlay p,#win-overlay p{font-size:11.5px !important;color:var(--fmuted) !important;}
#game-over-overlay p span:last-child,#win-overlay p span:last-child{
  font-family:'Syne',sans-serif !important;font-weight:800 !important;font-size:20px !important;
  color:var(--fa) !important;
}
#restartBtn,#nextBtn,#newMazeBtn,#newGameBtn,#playAgainBtn{
  border-radius:100px !important;border:1px solid rgba(148,163,184,.5) !important;
  background:linear-gradient(180deg,rgba(148,163,184,.24),rgba(148,163,184,.1)) !important;
  color:#fff !important;font-family:'DM Sans',sans-serif !important;font-size:14px !important;
  font-weight:600 !important;box-shadow:none !important;padding:12px 30px !important;
  text-transform:none !important;
}
#restartBtn:hover,#nextBtn:hover,#newMazeBtn:hover,#newGameBtn:hover,#playAgainBtn:hover{
  background:linear-gradient(180deg,rgba(148,163,184,.34),rgba(148,163,184,.16)) !important;
  box-shadow:0 0 24px -6px rgba(148,163,184,.5) !important;transform:none !important;
}
#restartBtn:active,#nextBtn:active{transform:translateY(1px) !important;}

/* tlacidlo Spat nesmie sedet na hlavicke panelu */
@media (max-width:560px){
  #game-container{padding-top:46px !important;}
}
/* velmi nizke obrazovky: pravidla dole, udaje kompaktne */
@media (max-height:520px){
  #rules{display:none !important;}
  #header h1{font-size:15px !important;}
  #info-panel{gap:4px !important;padding:0 !important;}
  .info-card{padding:4px 8px !important;min-width:46px !important;}
  .info-card h3{font-size:8px !important;margin-bottom:0 !important;}
  .info-card .value{font-size:14px !important;}
}
/* telefon na sirku: panel zostava v stlpci, plocha si vezme vysku okna
   a zvysok panelu sa da doscrollovat */
@media (max-height:520px) and (orientation:landscape){
  body{padding:4px !important;align-items:flex-start !important;}
  #game-container{max-width:100% !important;max-height:none !important;padding-top:46px !important;}
  #gameCanvas{max-height:none !important;}
  #header{gap:5px !important;}
  #info-panel{gap:3px !important;}
  #info-panel .info-card{padding:3px 7px !important;}
}
/* velmi uzke obrazovky */
@media (max-width:380px){
  body{padding:4px !important;}
  #game-container{padding-left:8px !important;padding-right:8px !important;}
}
/* velke obrazovky: panel smie narast, hracia plocha tym dostane viac miesta */
@media (min-width:700px){
  #game-container{max-width:660px !important;}
}
/* pauza: len jemny zavoj a napis */
#pause-overlay span{background:none !important;border:none !important;box-shadow:none !important;
  font-size:26px !important;color:#fff !important;letter-spacing:-.5px !important;padding:0 !important;}
</style>
</head>
<body>

    <a href="../../index.html" id="back-btn">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      <span id="lbl-back"></span>
    </a>

    <div id="game-container">
        <div id="header">
            <h1>⚪ PEG ESCAPE</h1>
            <div id="settings">
                <label id="lbl-size">Obtiažnosť:</label>
                <div class="btn-group" id="sizeGroup">
                    <button data-diff="s" id="lbl-size-s">Ľahká</button>
                    <button data-diff="m" class="active" id="lbl-size-m">Stredná</button>
                    <button data-diff="l" id="lbl-size-l">Ťažká</button>
                </div>
            </div>
        </div>

        <p id="rules"></p>

        <div id="info-panel">
            <div class="info-card">
                <h3 id="lbl-pegs">Kolíky</h3>
                <span class="value" id="pegsValue">32</span>
            </div>
            <div class="info-card">
                <h3 id="lbl-moves">Ťahy</h3>
                <span class="value" id="movesValue">0</span>
            </div>
            <div class="info-card">
                <h3 id="lbl-score">Skóre</h3>
                <span class="value" id="scoreValue">0</span>
            </div>
            <div class="info-card high-score">
                <h3 id="lbl-best">Najlepšie</h3>
                <span class="value" id="bestValue">0</span>
            </div>
        </div>

        <div id="canvas-wrapper">
            <canvas id="gameCanvas"></canvas>
            <div id="end-overlay">
                <h2 id="lbl-result">Vyhral si!</h2>
                <p><span id="lbl-final-pegs">Kolíky:</span> <span id="finalPegs">1</span></p>
                <p style="font-size:16px; color:#fbbf24;"><span id="lbl-final-score">Skóre:</span> <span id="finalScore">0</span></p>
                <button id="restartBtn">Hrať znova</button>
            </div>
        </div>

        <div id="controls">
            <button id="undoBtn"><span id="lbl-undo">Späť</span></button>
            <button id="newLevelBtn"><span id="lbl-newlevel">Nová hra</span></button>
        </div>
    </div>

    <script>
        (function () {
            'use strict';

            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const pegsSpan = document.getElementById('pegsValue');
            const movesSpan = document.getElementById('movesValue');
            const scoreSpan = document.getElementById('scoreValue');
            const bestSpan = document.getElementById('bestValue');
            const endOverlay = document.getElementById('end-overlay');
            const resultH2 = document.getElementById('lbl-result');
            const finalPegs = document.getElementById('finalPegs');
            const finalScore = document.getElementById('finalScore');
            const restartBtn = document.getElementById('restartBtn');
            const undoBtn = document.getElementById('undoBtn');
            const newLevelBtn = document.getElementById('newLevelBtn');
            const sizeGroup = document.getElementById('sizeGroup');

            // ----- PREKLADY -----
            document.getElementById('lbl-back').textContent = t('back');
            document.getElementById('lbl-size').textContent = t('pegDifficulty');
            document.getElementById('lbl-size-s').textContent = t('pegEasy');
            document.getElementById('lbl-size-m').textContent = t('pegMedium');
            document.getElementById('lbl-size-l').textContent = t('pegHard');
            document.getElementById('lbl-pegs').textContent = t('pegPegs');
            document.getElementById('lbl-moves').textContent = t('pegMoves');
            document.getElementById('lbl-score').textContent = t('pegScore');
            document.getElementById('lbl-best').textContent = t('pegBest');
            document.getElementById('lbl-final-pegs').textContent = t('pegPegs') + ':';
            document.getElementById('lbl-final-score').textContent = t('pegScore') + ':';
            document.getElementById('lbl-undo').textContent = t('pegUndo');
            document.getElementById('lbl-newlevel').textContent = t('pegNewGame');
            restartBtn.textContent = t('pegNewGame');
            document.getElementById('rules').textContent = t('pegRules');

            // ----- DOSKA -----
            function buildBoard() {
                const valid = new Set();
                for (let r = 0; r < 7; r++) {
                    for (let c = 0; c < 7; c++) {
                        if ((r < 2 && c < 2) || (r < 2 && c > 4) || (r > 4 && c < 2) || (r > 4 && c > 4)) continue;
                        valid.add(r + ',' + c);
                    }
                }
                return valid;
            }
            const VALID = buildBoard();
            const CENTER = '3,3';
            const CELL = 44;
            const PAD = 22;
            const CW = 7 * CELL + PAD * 2, CH = CW;
            // ── ostra kresba: logicky priestor sa mapuje na skutocne body displeja,
            // logika aj mapovanie ukazovatela zostavaju v logickych px
            let DPR = 1;
            function fitCanvas(hintH) {
                DPR = Math.min(window.devicePixelRatio || 1, 2);
                const cont = document.getElementById('game-container');
                const land = window.matchMedia('(max-height:520px) and (orientation:landscape)').matches;
                const availW = Math.max(200, Math.min(620, (cont ? cont.clientWidth : 340) - 28));
                const availH = hintH || Math.max(200, window.innerHeight - (land ? 110 : 240));
                const k = Math.max(0.28, Math.min(availW / CW, availH / CH, 1.7));
                canvas.width = Math.round(CW * k * DPR);
                canvas.height = Math.round(CH * k * DPR);
                canvas.style.width = (canvas.width / DPR) + 'px';
                canvas.style.height = (canvas.height / DPR) + 'px';
                ctx.setTransform(k * DPR, 0, 0, k * DPR, 0, 0);
                if (!hintH && !land) {
                    const got = canvas.getBoundingClientRect();
                    if (got.height > 20 && CH * k - got.height > 1.5) { fitCanvas(got.height); return; }
                    if (got.width > 20 && CW * k - got.width > 1.5) { fitCanvas(got.width * CH / CW); return; }
                }
            }
            fitCanvas();
            // prve zavolanie bezi jeste pred rozvrhnutim panelu, preto prepocitam po layoute
            requestAnimationFrame(() => { fitCanvas(); draw(); });
            window.addEventListener('load', () => { fitCanvas(); draw(); });
            let fitTimer = 0;
            window.addEventListener('resize', () => {
                clearTimeout(fitTimer);
                fitTimer = setTimeout(() => { fitCanvas(); draw(); }, 120);
            });

            let diffKey = 'm';
            let pegs = new Set();
            let history = [];
            let selected = null;
            let moves = 0;
            let score = 0;
            const bestKey = () => 'pegescape_best_' + diffKey;
            let best = 0;
            function loadBest() { best = parseInt(localStorage.getItem(bestKey()) || '0', 10) || 0; bestSpan.textContent = best; }
            let ended = false;

            bestSpan.textContent = best;

            function legalMoves(pegSet) {
                const res = [];
                for (const key of pegSet) {
                    const [r, c] = key.split(',').map(Number);
                    for (const [dr, dc] of [[-2, 0], [2, 0], [0, -2], [0, 2]]) {
                        const mid = (r + dr / 2) + ',' + (c + dc / 2);
                        const dest = (r + dr) + ',' + (c + dc);
                        if (VALID.has(dest) && !pegSet.has(dest) && pegSet.has(mid)) {
                            res.push({ src: key, mid, dest });
                        }
                    }
                }
                return res;
            }

            function movesForPeg(key) {
                return legalMoves(pegs).filter(m => m.src === key);
            }

            function applyMove(mv) {
                pegs.delete(mv.src);
                pegs.delete(mv.mid);
                pegs.add(mv.dest);
            }

            function newGame() {
                loadBest();   // rekord patri k aktualnej obtiaznosti
                pegs = new Set(VALID);
                pegs.delete(CENTER);
                history = [];
                selected = null;
                moves = 0;
                score = 0;
                ended = false;
                pegsSpan.textContent = pegs.size;
                movesSpan.textContent = '0';
                scoreSpan.textContent = '0';
                endOverlay.classList.remove('visible');
                draw();
            }

            function cellCenter(r, c) {
                return { x: PAD + c * CELL + CELL / 2, y: PAD + r * CELL + CELL / 2 };
            }

            function keyAt(px, py) {
                for (const key of VALID) {
                    const [r, c] = key.split(',').map(Number);
                    const { x, y } = cellCenter(r, c);
                    if (Math.hypot(px - x, py - y) < CELL * 0.42) return key;
                }
                return null;
            }

            function canvasPoint(e) {
                const rect = canvas.getBoundingClientRect();
                // po prechode na dpr canvas je canvas.width v bodoch displeja,
                // takze prepocitavam na logicky priestor CW x CH
                const scaleX = CW / rect.width;
                const scaleY = CH / rect.height;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
            }

            function onTap(e) {
                if (ended) return;
                const pt = canvasPoint(e);
                const key = keyAt(pt.x, pt.y);
                if (!key) return;

                if (selected === null) {
                    if (pegs.has(key) && movesForPeg(key).length > 0) {
                        selected = key;
                        draw();
                    }
                    return;
                }
                if (key === selected) {
                    selected = null;
                    draw();
                    return;
                }
                const avail = movesForPeg(selected);
                const mv = avail.find(m => m.dest === key);
                if (mv) {
                    history.push({ pegsBefore: new Set(pegs), move: mv });
                    applyMove(mv);
                    moves++;
                    movesSpan.textContent = moves;
                    pegsSpan.textContent = pegs.size;
                    selected = null;
                    draw();
                    checkEnd();
                } else if (pegs.has(key) && movesForPeg(key).length > 0) {
                    selected = key;
                    draw();
                } else {
                    selected = null;
                    draw();
                }
            }

            canvas.addEventListener('mousedown', onTap);
            canvas.addEventListener('touchstart', (e) => { e.preventDefault(); onTap(e); }, { passive: false });

            function undo() {
                if (ended || history.length === 0) return;
                const last = history.pop();
                pegs = last.pegsBefore;
                moves = Math.max(0, moves - 1);
                movesSpan.textContent = moves;
                pegsSpan.textContent = pegs.size;
                selected = null;
                draw();
            }
            undoBtn.addEventListener('click', undo);

            function checkEnd() {
                const winThreshold = diffKey === 's' ? 3 : 1;
                const needCenter = diffKey === 'l';
                const mvs = legalMoves(pegs);

                if (pegs.size <= winThreshold && (!needCenter || (pegs.size === 1 && pegs.has(CENTER)))) {
                    winGame();
                    return;
                }
                if (mvs.length === 0) {
                    if (pegs.size <= winThreshold && (!needCenter || pegs.has(CENTER))) {
                        winGame();
                    } else {
                        stuckGame();
                    }
                }
            }

            function winGame() {
                ended = true;
                const centerBonus = pegs.size === 1 && pegs.has(CENTER) ? 40 : 0;
                score = Math.max(20, 220 - pegs.size * 30 - moves + centerBonus);
                scoreSpan.textContent = score;
                if (score > best) {
                    best = score;
                    bestSpan.textContent = best;
                    localStorage.setItem(bestKey(), String(best));
                }
                resultH2.textContent = t('pegWin');
                resultH2.classList.remove('stuck');
                finalPegs.textContent = pegs.size;
                finalScore.textContent = score;
                endOverlay.classList.add('visible');
            }

            function stuckGame() {
                ended = true;
                score = 0;
                scoreSpan.textContent = '0';
                resultH2.textContent = t('pegStuck');
                resultH2.classList.add('stuck');
                finalPegs.textContent = pegs.size;
                finalScore.textContent = 0;
                endOverlay.classList.add('visible');
            }

            function draw() {
                ctx.clearRect(0, 0, CW, CH);
                const grad = ctx.createLinearGradient(0, 0, 0, CH);
                grad.addColorStop(0, '#0b111e');
                grad.addColorStop(1, '#0f1a2b');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, CW, CH);

                const avail = selected ? movesForPeg(selected).map(m => m.dest) : [];

                for (const key of VALID) {
                    const [r, c] = key.split(',').map(Number);
                    const { x, y } = cellCenter(r, c);
                    const holeR = CELL * 0.32;

                    ctx.beginPath();
                    ctx.arc(x, y, holeR, 0, Math.PI * 2);
                    const hg = ctx.createRadialGradient(x, y, holeR * 0.2, x, y, holeR);
                    hg.addColorStop(0, '#0a0f1a');
                    hg.addColorStop(1, '#1f2c40');
                    ctx.fillStyle = hg;
                    ctx.fill();

                    if (avail.includes(key)) {
                        ctx.beginPath();
                        ctx.arc(x, y, holeR * 0.55, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(74,222,128,0.55)';
                        ctx.fill();
                    }

                    if (pegs.has(key)) {
                        const pegR = CELL * 0.28;
                        ctx.beginPath();
                        ctx.arc(x, y, pegR, 0, Math.PI * 2);
                        const pg = ctx.createRadialGradient(x - pegR * 0.3, y - pegR * 0.3, 1, x, y, pegR);
                        if (key === selected) {
                            pg.addColorStop(0, '#fef9c3');
                            pg.addColorStop(1, '#facc15');
                        } else {
                            pg.addColorStop(0, '#bae6fd');
                            pg.addColorStop(1, '#38bdf8');
                        }
                        ctx.fillStyle = pg;
                        ctx.fill();
                        ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }
                }
            }

            restartBtn.addEventListener('click', newGame);
            newLevelBtn.addEventListener('click', newGame);

            sizeGroup.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', () => {
                    sizeGroup.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    diffKey = btn.dataset.diff;
                    newGame();
                });
            });

            newGame();
        })();
    </script>
</body>
</html>
