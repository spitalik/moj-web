<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wobble Tower · GamePad</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <script src="../../i18n.js"></script>
    <style>
        #back-btn{
            position:fixed;top:14px;left:14px;z-index:60;
            display:flex;align-items:center;gap:7px;
            background:rgba(7,9,15,.88);border:1px solid #402a1a;color:#8291ab;
            padding:7px 14px;border-radius:100px;text-decoration:none;
            font-size:12px;font-weight:600;backdrop-filter:blur(4px);transition:all .18s;
        }
        #back-btn:hover,#back-btn:active{border-color:#fb923c;color:#f0f4fe;}
        @media(max-width:480px){#back-btn{top:8px;left:8px;padding:5px 10px;font-size:11px;}}
        * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
        body {
            background:#0c0f16;
            font-family:'Segoe UI', Roboto, system-ui, sans-serif;
            display:flex; justify-content:center; align-items:center;
            min-height:100vh; margin:0; padding:12px;
            touch-action: manipulation;
        }
        #game-container {
            background:#151d2b;
            border-radius:28px;
            padding:20px 24px 24px;
            max-width:420px;
            width:100%;
            box-shadow:0 12px 40px rgba(0,0,0,.7);
            border:1px solid #2e3a4e;
            display:flex; flex-direction:column; gap:14px;
            position:relative;
        }
        #header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
        #header h1 {
            font-size:23px; font-weight:700;
            background:linear-gradient(135deg,#fed7aa,#fb923c);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
            margin:0;
        }
        #rules { font-size:12px; color:#8291ab; line-height:1.5; }
        #settings { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
        #settings label { color:#b0c4e0; font-size:12px; font-weight:500; }
        .btn-group { display:flex; gap:4px; background:#111a28; padding:4px; border-radius:10px; border:1px solid #29344a; }
        .btn-group button { background:transparent; border:none; color:#7a8aa8; padding:4px 10px; border-radius:8px; font-size:12px; font-weight:600; cursor:pointer; }
        .btn-group button.active { background:#fb923c; color:#0c0f16; }
        #info-panel { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
        .info-card { flex:1 1 auto; min-width:60px; background:#111a28; border-radius:14px; padding:8px 10px; border:1px solid #29344a; text-align:center; }
        .info-card h3 { font-size:10px; text-transform:uppercase; color:#7a8aa8; margin-bottom:4px; font-weight:500; }
        .info-card .value { font-size:20px; font-weight:700; color:#eef3fc; display:block; }
        .high-score { border-color:#fbbf24; }
        .high-score h3 { color:#fbbf24 !important; }
        .high-score .value { color:#fbbf24 !important; }
        #canvas-wrapper {
            background:#0f1622; border-radius:16px; padding:8px;
            box-shadow: inset 0 0 0 1px #2a3446;
            position:relative; align-self:center;
        }
        #gameCanvas { display:block; border-radius:10px; cursor:pointer; touch-action:manipulation; }
        #pause-overlay {
            position:absolute; inset:8px; background:rgba(8,12,22,.75); backdrop-filter:blur(4px);
            border-radius:10px; display:none; align-items:center; justify-content:center;
            color:#f0f4fe; font-size:28px; font-weight:700; letter-spacing:4px; z-index:5; pointer-events:none;
        }
        #pause-overlay.visible { display:flex; }
        #pause-overlay span { background:rgba(251,146,60,.18); padding:14px 28px; border-radius:16px; border:2px solid rgba(251,146,60,.4); }
        #controls { display:flex; gap:10px; justify-content:center; }
        #pauseBtn {
            background:#3a2410; border:1px solid #fb923c; color:#fed7aa;
            border-radius:16px; width:56px; height:56px; font-size:22px;
            display:flex; align-items:center; justify-content:center; cursor:pointer;
        }
        #pauseBtn.paused { background:#2a1e3e; border-color:#4c1d95; color:#c4b5e3; }
        #game-over-overlay {
            position:absolute; inset:8px; background:rgba(8,12,22,.92); backdrop-filter:blur(6px);
            border-radius:10px; display:none; flex-direction:column; align-items:center; justify-content:center;
            gap:10px; padding:26px; z-index:10; color:#f0f4fe; text-align:center;
        }
        #game-over-overlay.visible { display:flex; }
        #game-over-overlay h2 {
            font-size:26px;
            background:linear-gradient(135deg,#fed7aa,#fb923c);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
        }
        #restartBtn {
            background:#fb923c; border:1px solid #fed7aa; border-radius:40px;
            padding:12px 32px; font-size:17px; font-weight:700; color:#0c0f16;
            box-shadow:0 6px 0 #c2410c; cursor:pointer; margin-top:6px;
        }
        #restartBtn:active { transform:translateY(6px); box-shadow:0 1px 0 #c2410c; }
    
/* mobil/tablet: na nízkych obrazovkách stlačím rámce, aby ovládanie zostalo viditeľné */
@media (max-height:900px){
  body{padding:6px !important;}
  #game-container{padding:12px 14px 14px !important;gap:9px !important;}
}
@media (max-height:760px){
  body{padding:3px !important;}
  #game-container{padding:8px 10px 10px !important;gap:6px !important;border-radius:18px !important;}
}

/* nízke obrazovky: hracia plocha sa zmenší do dostupného miesta namiesto pretečenia */
@media (max-height:900px){
  #game-container{max-height:calc(100vh - 10px);}
  #canvas-wrapper{min-height:0;flex:0 1 auto;}
  #gameCanvas{max-height:100%;max-width:100%;width:auto;height:auto;}
}

@media (max-height:700px){
  #rules{display:none !important;}
}

/* ── zladenie s ostatnymi hrami zbierky ─────────────────────────────── */
:root{
  --fa:#fbbf24;--fb:#fb7185;--fgold:#ffd166;
  --ftext:#eef3fc;--fmuted:rgba(238,243,252,0.44);--fdim:rgba(238,243,252,0.2);
  --fbd:rgba(255,255,255,0.09);
}
body{
  font-family:'DM Sans',system-ui,sans-serif !important;
  background:radial-gradient(ellipse at 50% -8%, rgba(251,191,36,.14) 0%, transparent 58%), #070a12 !important;
  color:var(--ftext) !important;
}
#back-btn{background:rgba(10,13,24,0.72) !important;border:1px solid var(--fbd) !important;color:var(--fmuted) !important;font-weight:500 !important;}
#back-btn:hover,#back-btn:active{border-color:rgba(255,255,255,0.18) !important;color:#fff !important;}
#game-container{
  background:linear-gradient(165deg,rgba(255,255,255,0.045),rgba(255,255,255,0.012)) !important;
  border:1px solid rgba(255,255,255,0.13) !important;border-radius:26px !important;
  box-shadow:0 30px 70px -28px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.06) !important;
}
#header h1{
  font-family:'Syne',sans-serif !important;font-weight:800 !important;font-size:19px !important;
  letter-spacing:-.3px !important;
  background:linear-gradient(110deg,var(--fa) 5%,#fff 55%,var(--fb) 95%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
#settings label{color:var(--fdim) !important;font-size:9px !important;font-weight:600 !important;
  letter-spacing:1.1px !important;text-transform:uppercase !important;}
#rules{color:var(--fmuted) !important;font-size:11px !important;line-height:1.6 !important;}
.btn-group{background:rgba(255,255,255,0.04) !important;border:1px solid var(--fbd) !important;
  border-radius:100px !important;padding:3px !important;gap:2px !important;}
.btn-group button{border-radius:100px !important;color:var(--fmuted) !important;
  font-family:'DM Sans',sans-serif !important;font-size:11px !important;font-weight:600 !important;
  padding:5px 12px !important;transition:color .16s,background .16s !important;}
.btn-group button:hover{color:#fff !important;}
.btn-group button.active{background:rgba(251,191,36,.16) !important;color:#fff !important;
  box-shadow:inset 0 0 0 1px rgba(251,191,36,.42) !important;}
.info-card{background:rgba(255,255,255,0.04) !important;border:1px solid var(--fbd) !important;
  border-radius:14px !important;}
.info-card h3{font-size:8.5px !important;letter-spacing:1.3px !important;color:var(--fdim) !important;
  font-weight:600 !important;text-transform:uppercase !important;}
.info-card .value{font-family:'Syne',sans-serif !important;font-weight:800 !important;
  font-size:18px !important;letter-spacing:-.5px !important;font-variant-numeric:tabular-nums;
  color:var(--fa) !important;}
.high-score{border-color:rgba(255,209,102,.35) !important;}
.high-score h3{color:rgba(255,209,102,.55) !important;}
.high-score .value{color:var(--fgold) !important;}
#canvas-wrapper{background:rgba(0,0,0,0.34) !important;border-radius:18px !important;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,0.07) !important;}
#controls button,#padrow button,#controls>button{
  background:linear-gradient(160deg,rgba(255,255,255,0.07),rgba(255,255,255,0.02)) !important;
  border:1px solid var(--fbd) !important;color:var(--fmuted) !important;
  border-radius:15px !important;box-shadow:none !important;
  font-family:'DM Sans',sans-serif !important;
}
#controls button:active,#padrow button:active{background:rgba(251,191,36,.18) !important;
  border-color:rgba(251,191,36,.45) !important;color:#fff !important;transform:scale(.95) !important;}
#status-line{color:var(--fmuted) !important;font-weight:600 !important;}
/* prekryvy: rodinna karta */
#game-over-overlay,#win-overlay,#pause-overlay{
  background:radial-gradient(ellipse at center,rgba(8,10,20,0.84) 0%,rgba(3,4,9,0.96) 78%) !important;
  backdrop-filter:blur(6px) !important;border-radius:18px !important;
}
#game-over-overlay h2,#win-overlay h2,#pause-overlay span{
  font-family:'Syne',sans-serif !important;font-weight:800 !important;letter-spacing:-.5px !important;
}
#game-over-overlay h2,#win-overlay h2{
  font-size:24px !important;
  background:linear-gradient(110deg,var(--fa) 5%,#fff 55%,var(--fb) 95%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  text-shadow:none !important;
}
#game-over-overlay p,#win-overlay p{font-size:11.5px !important;color:var(--fmuted) !important;}
#game-over-overlay p span:last-child,#win-overlay p span:last-child{
  font-family:'Syne',sans-serif !important;font-weight:800 !important;font-size:20px !important;
  color:var(--fa) !important;
}
#restartBtn,#nextBtn,#newMazeBtn,#newGameBtn,#playAgainBtn{
  border-radius:100px !important;border:1px solid rgba(251,191,36,.5) !important;
  background:linear-gradient(180deg,rgba(251,191,36,.24),rgba(251,191,36,.1)) !important;
  color:#fff !important;font-family:'DM Sans',sans-serif !important;font-size:14px !important;
  font-weight:600 !important;box-shadow:none !important;padding:12px 30px !important;
  text-transform:none !important;
}
#restartBtn:hover,#nextBtn:hover,#newMazeBtn:hover,#newGameBtn:hover,#playAgainBtn:hover{
  background:linear-gradient(180deg,rgba(251,191,36,.34),rgba(251,191,36,.16)) !important;
  box-shadow:0 0 24px -6px rgba(251,191,36,.5) !important;transform:none !important;
}
#restartBtn:active,#nextBtn:active{transform:translateY(1px) !important;}

/* velmi nizke obrazovky (telefon na sirku): pravidla dole, udaje kompaktne,
   aby na hraciu plochu zostalo pouzitelne miesto */
@media (max-height:520px){
  #rules{display:none !important;}
  #header h1{font-size:15px !important;}
  #info-panel{gap:4px !important;padding:0 !important;}
  .info-card{padding:4px 8px !important;min-width:46px !important;}
  .info-card h3{font-size:8px !important;margin-bottom:0 !important;}
  .info-card .value{font-size:14px !important;}
  #controls button,#padrow button{padding:6px 12px !important;}
}

/* tlacidlo Spat nesmie sedet na hlavicke panelu */
@media (max-width:560px){
  #game-container{padding-top:46px !important;}
}
/* telefon na sirku: panel sa preklopi do riadku, hracia plocha dostane celu vysku */
@media (max-height:520px) and (orientation:landscape){
  body{padding:4px !important;align-items:center !important;}
  #game-container{
    flex-direction:row !important;flex-wrap:wrap !important;align-items:center !important;
    justify-content:center !important;gap:8px !important;padding:8px 10px !important;
    padding-top:8px !important;max-width:100% !important;max-height:100vh !important;
  }
  #header{flex:0 0 auto !important;flex-direction:column !important;align-items:flex-start !important;gap:6px !important;}
  #settings{flex-direction:column !important;align-items:flex-start !important;gap:4px !important;}
  #info-panel{flex:0 0 auto !important;flex-direction:column !important;gap:4px !important;}
  #main{flex:1 1 auto !important;}
  #canvas-wrapper{flex:0 1 auto !important;padding:5px !important;}
  #controls{flex:0 0 auto !important;flex-direction:column !important;gap:6px !important;}
  #padrow{flex-direction:column !important;}
}

/* pauza: len jemny zavoj a napis, bez ramovania */
#pause-overlay span{background:none !important;border:none !important;box-shadow:none !important;
  font-size:26px !important;color:#fff !important;letter-spacing:-.5px !important;padding:0 !important;}
</style>
</head>
<body>

    <a href="../../index.html" id="back-btn">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      <span id="lbl-back"></span>
    </a>

    <div id="game-container">
        <div id="header">
            <h1>🗼 WOBBLE TOWER</h1>
            <div id="settings">
                <label id="lbl-size">Obtiažnosť:</label>
                <div class="btn-group" id="sizeGroup">
                    <button data-diff="s" id="lbl-size-s">Ľahká</button>
                    <button data-diff="m" class="active" id="lbl-size-m">Stredná</button>
                    <button data-diff="l" id="lbl-size-l">Ťažká</button>
                </div>
            </div>
        </div>

        <p id="rules"></p>

        <div id="info-panel">
            <div class="info-card">
                <h3 id="lbl-height">Výška</h3>
                <span class="value" id="heightValue">0</span>
            </div>
            <div class="info-card">
                <h3 id="lbl-score">Skóre</h3>
                <span class="value" id="scoreValue">0</span>
            </div>
            <div class="info-card">
                <h3 id="lbl-combo">Kombá</h3>
                <span class="value" id="comboValue">0</span>
            </div>
            <div class="info-card high-score">
                <h3 id="lbl-best">Najlepšie</h3>
                <span class="value" id="bestValue">0</span>
            </div>
        </div>

        <div id="canvas-wrapper">
            <canvas id="gameCanvas"></canvas>
            <div id="pause-overlay"><span>⏸ <span id="lbl-pause"></span></span></div>
            <div id="game-over-overlay">
                <h2 id="lbl-gameover">Veža sa zrútila!</h2>
                <p><span id="lbl-final-height">Výška:</span> <span id="finalHeight">0</span></p>
                <p style="font-size:16px; color:#fbbf24;"><span id="lbl-final-score">Skóre:</span> <span id="finalScore">0</span></p>
                <button id="restartBtn">Hrať znova</button>
            </div>
        </div>

        <div id="controls">
            <button id="pauseBtn">⏸</button>
        </div>
    </div>

    <script>
        (function () {
            'use strict';

            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const heightSpan = document.getElementById('heightValue');
            const scoreSpan = document.getElementById('scoreValue');
            const comboSpan = document.getElementById('comboValue');
            const bestSpan = document.getElementById('bestValue');
            const pauseBtn = document.getElementById('pauseBtn');
            const pauseOverlay = document.getElementById('pause-overlay');
            const gameOverOverlay = document.getElementById('game-over-overlay');
            const finalHeight = document.getElementById('finalHeight');
            const finalScore = document.getElementById('finalScore');
            const restartBtn = document.getElementById('restartBtn');
            const sizeGroup = document.getElementById('sizeGroup');

            // ----- PREKLADY -----
            document.getElementById('lbl-back').textContent = t('back');
            document.getElementById('lbl-size').textContent = t('wobDifficulty');
            document.getElementById('lbl-size-s').textContent = t('wobEasy');
            document.getElementById('lbl-size-m').textContent = t('wobMedium');
            document.getElementById('lbl-size-l').textContent = t('wobHard');
            document.getElementById('lbl-height').textContent = t('wobHeight');
            document.getElementById('lbl-score').textContent = t('wobScore');
            document.getElementById('lbl-combo').textContent = t('wobCombo');
            document.getElementById('lbl-best').textContent = t('wobBest');
            document.getElementById('lbl-pause').textContent = t('wobPause');
            document.getElementById('lbl-gameover').textContent = t('wobGameOver');
            document.getElementById('lbl-final-height').textContent = t('wobHeight') + ':';
            document.getElementById('lbl-final-score').textContent = t('wobScore') + ':';
            restartBtn.textContent = t('wobReplay');
            pauseBtn.title = t('wobPauseTooltip');
            document.getElementById('rules').textContent = t('wobRules');

            // ----- KONFIGURACIA -----
            const CW = 320, CH = 480;
            // ── plocha: logicky priestor 320 x 480 sa zmesti do okna a kresli
            // sa v skutocnych bodoch displeja (ostro), logika zostava v logickych px
            function fitCanvas(hintH) {
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                const wrap = document.getElementById('canvas-wrapper');
                const availW = Math.max(200, Math.min(430, (wrap.clientWidth || 340) - 14));
                const availH = hintH || Math.max(240, window.innerHeight - 260);
                const k = Math.max(0.4, Math.min(availW / CW, availH / CH));
                canvas.style.width = Math.round(CW * k) + 'px';
                canvas.style.height = Math.round(CH * k) + 'px';
                canvas.width = Math.round(CW * k * dpr);
                canvas.height = Math.round(CH * k * dpr);
                ctx.setTransform(k * dpr, 0, 0, k * dpr, 0, 0);
                if (!hintH) {
                    // ak layout pridelil menej vysky (max-height), prepocitam na nu
                    const got = canvas.getBoundingClientRect();
                    if (got.height > 20 && CH * k - got.height > 2) fitCanvas(got.height);
                }
            }
            let fitTimer = 0;
            window.addEventListener('resize', () => {
                clearTimeout(fitTimer);
                fitTimer = setTimeout(fitCanvas, 120);
            });

            const BLOCK_H = 30;
            const BASE_Y = CH - 50;
            const TRIGGER_Y = CH * 0.42;
            const GRAVITY = 0.55;

            const DIFFS = {
                s: { baseWidth: 160, speed: 2.1, speedInc: 0.045, maxSpeed: 6 },
                m: { baseWidth: 120, speed: 2.5, speedInc: 0.06, maxSpeed: 7.5 },
                l: { baseWidth: 90, speed: 2.9, speedInc: 0.08, maxSpeed: 9 }
            };
            const PALETTE = ['#fb923c', '#f97316', '#fbbf24', '#facc15', '#fb7185', '#f472b6', '#a78bfa', '#818cf8', '#38bdf8', '#4ade80'];

            let diffKey = 'm';
            let stack = [];
            let moving = null;
            let debris = [];
            let cameraOffset = 0;
            let targetCameraOffset = 0;
            let score = 0, combo = 0;
            const bestKey = () => 'wobbletower_best_' + diffKey;
            let best = 0;
            function loadBest() {
                best = parseInt(localStorage.getItem(bestKey()) || '0', 10) || 0;
                bestSpan.textContent = best;
            }
            let paused = false, ended = false;
            let popups = [];
            let animId = null;

            bestSpan.textContent = best;

            function colorFor(i) {
                return PALETTE[i % PALETTE.length];
            }

            function resetGame() {
                loadBest();       // rekord patri k aktualnej obtiaznosti
                const cfg = DIFFS[diffKey];
                stack = [{ left: (CW - cfg.baseWidth) / 2, width: cfg.baseWidth, color: '#475569' }];
                moving = null;
                debris = [];
                cameraOffset = 0;
                targetCameraOffset = 0;
                score = 0;
                combo = 0;
                popups = [];
                ended = false;
                paused = false;
                pauseOverlay.classList.remove('visible');
                pauseBtn.classList.remove('paused');
                gameOverOverlay.classList.remove('visible');
                heightSpan.textContent = '0';
                scoreSpan.textContent = '0';
                comboSpan.textContent = '0';
                spawnMoving();
            }

            function spawnMoving() {
                const cfg = DIFFS[diffKey];
                const level = stack.length - 1;
                const speed = Math.min(cfg.maxSpeed, cfg.speed + level * cfg.speedInc);
                const below = stack[stack.length - 1];
                const dir = Math.random() < 0.5 ? 1 : -1;
                const startLeft = dir === 1 ? 0 : CW - below.width;
                moving = {
                    left: startLeft,
                    width: below.width,
                    color: colorFor(stack.length),
                    dir,
                    speed
                };
            }

            function absoluteY(index) {
                return BASE_Y - index * BLOCK_H;
            }

            function updateCamera() {
                const topIndex = stack.length - 1;
                const topAbsY = absoluteY(topIndex);
                const needed = Math.max(0, TRIGGER_Y - topAbsY);
                targetCameraOffset = needed;
            }

            function drop() {
                if (paused || ended || !moving) return;
                const below = stack[stack.length - 1];
                const newLeft = moving.left;
                const newRight = moving.left + moving.width;
                const belowLeft = below.left;
                const belowRight = below.left + below.width;

                const overlapLeft = Math.max(newLeft, belowLeft);
                const overlapRight = Math.min(newRight, belowRight);
                const overlapWidth = overlapRight - overlapLeft;

                if (overlapWidth <= 4) {
                    triggerGameOver(moving);
                    return;
                }

                const diffLeft = Math.abs(newLeft - belowLeft);
                const diffRight = Math.abs(newRight - belowRight);
                const perfect = diffLeft < 4 && diffRight < 4;

                let placedLeft = overlapLeft, placedWidth = overlapWidth;
                if (perfect) {
                    placedLeft = belowLeft;
                    placedWidth = below.width;
                }

                const yIndex = stack.length;
                const absY = absoluteY(yIndex);

                if (newLeft < placedLeft - 0.5) {
                    spawnDebris(newLeft, placedLeft - newLeft, absY, moving.color);
                }
                if (newRight > placedLeft + placedWidth + 0.5) {
                    spawnDebris(placedLeft + placedWidth, newRight - (placedLeft + placedWidth), absY, moving.color);
                }

                stack.push({ left: placedLeft, width: placedWidth, color: moving.color });

                if (perfect) {
                    combo++;
                    score += 25 + combo * 3;
                    spawnPopup(t('wobPerfect'), absY);
                } else {
                    combo = 0;
                    score += 10;
                }

                heightSpan.textContent = stack.length - 1;
                scoreSpan.textContent = score;
                comboSpan.textContent = combo;
                if (score > best) {
                    best = score;
                    bestSpan.textContent = best;
                    localStorage.setItem(bestKey(), String(best));
                }

                updateCamera();
                spawnMoving();
            }

            function spawnDebris(left, width, absY, color) {
                if (width <= 0.5) return;
                debris.push({
                    x: left, y: absY, w: width, h: BLOCK_H,
                    vx: (left + width / 2 < CW / 2 ? -1 : 1) * (1 + Math.random()),
                    vy: -2 - Math.random() * 2,
                    rot: 0,
                    vrot: (Math.random() - 0.5) * 0.2,
                    color
                });
            }

            function spawnPopup(text, absY) {
                popups.push({ text, absY, life: 1 });
            }

            function triggerGameOver(fallingBlock) {
                ended = true;
                spawnDebris(fallingBlock.left, fallingBlock.width, absoluteY(stack.length), fallingBlock.color);
                setTimeout(() => {
                    finalHeight.textContent = stack.length - 1;
                    finalScore.textContent = score;
                    gameOverOverlay.classList.add('visible');
                }, 380);
            }

            function update() {
                if (paused || ended) return;
                if (moving) {
                    moving.left += moving.dir * moving.speed;
                    const below = stack[stack.length - 1];
                    if (moving.left <= 0) {
                        moving.left = 0;
                        moving.dir = 1;
                    } else if (moving.left + moving.width >= CW) {
                        moving.left = CW - moving.width;
                        moving.dir = -1;
                    }
                }

                cameraOffset += (targetCameraOffset - cameraOffset) * 0.15;

                for (const d of debris) {
                    d.vy += GRAVITY;
                    d.x += d.vx;
                    d.y += d.vy;
                    d.rot += d.vrot;
                }
                debris = debris.filter(d => (d.y + cameraOffset) < CH + 80);

                popups = popups.filter(p => p.life > 0);
                for (const p of popups) {
                    p.life -= 0.02;
                    p.absY -= 0.4;
                }
            }

            function drawBlock(left, absY, width, color) {
                const y = absY + cameraOffset;
                if (y > CH + 20 || y < -60) return;
                ctx.fillStyle = color;
                ctx.fillRect(left, y, width, BLOCK_H - 2);
                ctx.strokeStyle = 'rgba(255,255,255,0.12)';
                ctx.lineWidth = 1;
                ctx.strokeRect(left, y, width, BLOCK_H - 2);
            }

            function draw() {
                ctx.clearRect(0, 0, CW, CH);
                const grad = ctx.createLinearGradient(0, 0, 0, CH);
                grad.addColorStop(0, '#0b111e');
                grad.addColorStop(1, '#0f1a2b');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, CW, CH);

                for (let i = 0; i < stack.length; i++) {
                    const b = stack[i];
                    drawBlock(b.left, absoluteY(i), b.width, b.color);
                }

                for (const d of debris) {
                    ctx.save();
                    const y = d.y + cameraOffset;
                    ctx.translate(d.x + d.w / 2, y + d.h / 2);
                    ctx.rotate(d.rot);
                    ctx.fillStyle = d.color;
                    ctx.globalAlpha = 0.9;
                    ctx.fillRect(-d.w / 2, -d.h / 2, d.w, d.h - 2);
                    ctx.restore();
                }

                if (moving && !ended) {
                    drawBlock(moving.left, absoluteY(stack.length), moving.width, moving.color);
                }

                for (const p of popups) {
                    ctx.save();
                    ctx.globalAlpha = Math.max(0, p.life);
                    ctx.fillStyle = '#fde68a';
                    ctx.font = '800 15px Syne, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(p.text, CW / 2, p.absY + cameraOffset);
                    ctx.restore();
                }
            }

            let lastTs = 0, acc = 0;
            const STEP = 1 / 60;
            function loop(ts) {
                animId = requestAnimationFrame(loop);
                const dt = lastTs ? Math.min(0.1, (ts - lastTs) / 1000) : 0;
                lastTs = ts;
                acc += dt;
                let n = 0;
                // logika bezi vzdy 60x za sekundu, aj na 144 Hz displeji
                while (acc >= STEP && n < 4) { acc -= STEP; update(); n++; }
                draw();
            }

            function togglePause() {
                if (ended) return;
                paused = !paused;
                pauseOverlay.classList.toggle('visible', paused);
                pauseBtn.classList.toggle('paused', paused);
            }

            canvas.addEventListener('mousedown', drop);
            canvas.addEventListener('touchstart', (e) => { e.preventDefault(); drop(); }, { passive: false });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'p' || e.key === 'P') { togglePause(); return; }
                if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowUp') {
                    e.preventDefault();
                    drop();
                }
            });

            pauseBtn.addEventListener('click', togglePause);
            window.addEventListener('blur', () => { if (!ended && !paused) togglePause(); });
            pauseBtn.addEventListener('touchstart', (e) => { e.preventDefault(); togglePause(); }, { passive: false });
            restartBtn.addEventListener('click', resetGame);

            document.addEventListener('visibilitychange', () => {
                if (document.hidden && !ended && !paused) togglePause();
            });

            sizeGroup.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', () => {
                    sizeGroup.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    diffKey = btn.dataset.diff;
                    resetGame();
                });
            });

            fitCanvas();
            resetGame();
            loop();
        })();
    </script>
</body>
</html>
