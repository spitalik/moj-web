<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Type Rush · GamePad</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<script src="../../i18n.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#050a12;--text:#eaf4ff;--muted:rgba(234,244,255,0.42);--dim:rgba(234,244,255,0.18);
  --border:rgba(255,255,255,0.09);--border-h:rgba(255,255,255,0.18);
  --c:#60a5fa;--c2:#4ade80;--gold:#ffd166;--danger:#ff5d6d;
}
html,body{background:var(--bg);height:100%;font-family:'DM Sans',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;user-select:none;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none;}
button,a,[onclick]{touch-action:manipulation;}

#back-btn{position:fixed;top:14px;left:14px;z-index:60;display:flex;align-items:center;gap:7px;background:rgba(8,13,24,0.72);backdrop-filter:blur(8px);border:1px solid var(--border);color:var(--muted);padding:7px 14px;border-radius:100px;text-decoration:none;font-size:12px;font-weight:500;transition:border-color .18s,color .18s;}
#back-btn:hover,#back-btn:active{border-color:var(--border-h);color:var(--text);}
@media(max-width:520px){#back-btn{top:9px;left:9px;padding:6px 11px;font-size:11px;}}

#hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:12;display:none;align-items:center;gap:7px;pointer-events:none;}
#hud.show{display:flex;}
.pill{display:flex;align-items:center;gap:8px;padding:5px 12px;border-radius:100px;background:rgba(8,13,24,0.6);backdrop-filter:blur(8px);border:1px solid var(--border);font-size:9px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;color:var(--dim);white-space:nowrap;}
.pill b{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;letter-spacing:0;font-variant-numeric:tabular-nums;color:var(--c);transition:transform .18s;}
.pill.combo b{color:var(--c2);}
.pill.combo{opacity:.35;transition:opacity .2s,border-color .2s;}
.pill.combo.on{opacity:1;border-color:rgba(74,222,128,.4);}
.pill.best b{color:rgba(234,244,255,.72);}
.pill.best.record{border-color:rgba(96,165,250,.45);}
.pill b.bump{transform:scale(1.32);}
.lifes{display:flex;gap:4px;}
.life{width:9px;height:9px;border-radius:50%;background:var(--danger);box-shadow:0 0 8px rgba(255,93,109,.9);}
.life.gone{background:rgba(255,255,255,0.13);box-shadow:none;}
@media(max-width:620px){#hud{left:auto;right:56px;transform:none;gap:5px;}.pill span{display:none;}.pill{padding:4px 10px;}.pill b{font-size:15px;}.pill.best{display:none;}}

#pause-btn{position:fixed;top:14px;right:14px;z-index:60;display:none;align-items:center;justify-content:center;width:36px;height:36px;background:rgba(8,13,24,0.7);backdrop-filter:blur(8px);border:1px solid var(--border);color:var(--muted);border-radius:50%;cursor:pointer;}
#pause-btn.show{display:flex;}
#pause-btn:hover{border-color:var(--border-h);color:var(--text);}

#kb{position:fixed;left:0;right:0;bottom:0;z-index:14;display:none;flex-direction:column;gap:5px;padding:8px 6px 10px;background:linear-gradient(180deg,rgba(5,10,18,0),rgba(5,10,18,0.92) 32%);}
body.touch #kb.show{display:flex;}
.kb-row{display:flex;gap:4px;justify-content:center;}
.kb-key{flex:1 1 0;max-width:44px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:9px;background:linear-gradient(180deg,rgba(255,255,255,0.09),rgba(255,255,255,0.03));border:1px solid var(--border);color:var(--muted);font-size:14px;font-weight:600;text-transform:uppercase;cursor:pointer;transition:background .1s,color .1s,transform .08s;}
.kb-key:active,.kb-key.hit{background:rgba(96,165,250,0.28);border-color:rgba(96,165,250,0.6);color:#fff;transform:scale(.94);}
.kb-key.next{background:rgba(74,222,128,0.2);border-color:rgba(74,222,128,0.55);color:#d9ffe8;}
.kb-key.wide{max-width:120px;flex:0 0 92px;}

#overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(ellipse at center,rgba(8,13,24,0.78) 0%,rgba(3,6,12,0.95) 78%);backdrop-filter:blur(6px);}
#overlay.hide{display:none;}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:11px;width:100%;max-width:340px;padding:26px 24px 24px;border-radius:24px;background:linear-gradient(165deg,rgba(255,255,255,0.06),rgba(255,255,255,0.015));border:1px solid var(--border-h);box-shadow:0 30px 70px -28px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.07);animation:pop .34s cubic-bezier(.2,1.4,.4,1);}
@keyframes pop{from{transform:scale(.9) translateY(8px);opacity:0;}to{transform:none;opacity:1;}}
.card::before{content:'';position:absolute;inset:-1px;border-radius:24px;padding:1px;background:linear-gradient(120deg,rgba(96,165,250,.5),transparent 42%,transparent 58%,rgba(74,222,128,.5));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;}
.emoji{font-size:34px;line-height:1;filter:drop-shadow(0 6px 16px rgba(96,165,250,.4));}
.title{font-family:'Syne',sans-serif;font-weight:800;font-size:24px;letter-spacing:-.5px;text-align:center;background:linear-gradient(110deg,var(--c) 5%,#fff 52%,var(--c2) 95%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
#result{display:none;flex-direction:column;align-items:center;gap:2px;}
#result.show{display:flex;}
#res-lbl{font-size:9px;letter-spacing:2.2px;text-transform:uppercase;color:var(--dim);}
#res-score{font-family:'Syne',sans-serif;font-weight:800;font-size:50px;line-height:1.05;letter-spacing:-2px;color:var(--c);text-shadow:0 0 30px rgba(96,165,250,.45);}
#res-note{font-size:11.5px;font-weight:600;color:var(--muted);}
#res-note.record{color:var(--gold);}
#stats{display:none;width:100%;grid-template-columns:1fr 1fr 1fr;gap:7px;}
#stats.show{display:grid;}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:14px;background:rgba(255,255,255,0.04);border:1px solid var(--border);}
.stat i{font-size:8px;font-style:normal;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);text-align:center;}
.stat b{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;letter-spacing:-.6px;font-variant-numeric:tabular-nums;color:var(--c2);white-space:nowrap;}
.seg{display:flex;gap:3px;background:rgba(255,255,255,0.04);border:1px solid var(--border);padding:3px;border-radius:100px;}
.seg button{background:transparent;border:none;color:var(--muted);padding:6px 14px;border-radius:100px;font-family:'DM Sans',sans-serif;font-size:11.5px;font-weight:600;cursor:pointer;transition:color .16s,background .16s;}
.seg button:hover{color:var(--text);}
.seg button.active{background:rgba(96,165,250,0.16);color:#cfe4ff;box-shadow:inset 0 0 0 1px rgba(96,165,250,0.42);}
.lbl{font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);}
.hint{font-size:11.5px;line-height:1.55;color:var(--muted);text-align:center;}
.play-btn{margin-top:3px;width:100%;padding:13px 30px;border-radius:100px;border:1px solid rgba(96,165,250,.5);background:linear-gradient(180deg,rgba(96,165,250,.24),rgba(96,165,250,.1));color:#d8e9ff;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:all .18s;}
.play-btn:hover{background:linear-gradient(180deg,rgba(96,165,250,.34),rgba(96,165,250,.16));color:#fff;box-shadow:0 0 24px -6px rgba(96,165,250,.5);}
.play-btn:active{transform:translateY(1px);}
@media(max-height:640px){.card{gap:8px;padding:18px 20px;}.emoji{display:none;}.title{font-size:20px;}#res-score{font-size:38px;}.stat b{font-size:14px;}.stat{padding:6px 3px;}}
@media (max-height:820px){#overlay{align-items:flex-start !important;overflow-y:auto !important;}}
@media(max-width:360px){.seg button{padding:6px 10px;font-size:11px;}.kb-key{height:36px;font-size:13px;}}

/* krajina na nizkych obrazovkach: nizsia klavesnica, aby zostal priestor na padanie */
@media (orientation:landscape) and (max-height:520px){
  #kb{padding:4px 5px 6px;gap:3px;}
  .kb-key{height:28px;max-width:38px;font-size:12px;border-radius:7px;}
  .kb-key.wide{flex:0 0 70px;max-width:80px;}
}
</style>
</head>
<body>
<a href="../../index.html" id="back-btn">
  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
  <span id="lbl-back"></span>
</a>

<canvas id="c"></canvas>

<div id="hud">
  <div class="pill"><span id="lbl-score"></span><b id="hud-score">0</b></div>
  <div class="pill combo" id="combo-pill"><span id="lbl-combo"></span><b id="hud-combo">0</b></div>
  <div class="pill"><div class="lifes" id="lifes"></div></div>
  <div class="pill best" id="best-pill"><span id="lbl-best"></span><b id="hud-best">0</b></div>
</div>

<button id="pause-btn" aria-label="pause">
  <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1.4"/><rect x="14" y="4" width="4" height="16" rx="1.4"/></svg>
</button>

<div id="kb"></div>

<div id="overlay">
  <div class="card">
    <div id="brand"><div class="emoji">⌨️</div></div>
    <div class="title" id="ov-title"></div>
    <div id="result">
      <div id="res-lbl"></div>
      <div id="res-score">0</div>
      <div id="res-note"></div>
    </div>
    <div id="stats">
      <div class="stat"><i id="lbl-wpm"></i><b id="st-wpm">0</b></div>
      <div class="stat"><i id="lbl-acc"></i><b id="st-acc">0%</b></div>
      <div class="stat"><i id="lbl-words"></i><b id="st-words">0</b></div>
    </div>
    <div class="lbl" id="lbl-diff"></div>
    <div class="seg" id="diff-row"></div>
    <div class="hint" id="ov-hint"></div>
    <button class="play-btn" id="ov-play"></button>
  </div>
</div>

<script>
// ── vlastny zoznam bezych anglickych slov (bez cudzich zdrojov) ─────────
const POOLS = [
  ('bell bird blue boat book cake cave city clay cloud coal coin cold corn dawn deer dish dive door dust echo fern fire fish flag flame fox frog gate gift glass gold grape green hand hawk heart hill honey ice iron jade jump keen kind king lake lamp leaf lion lock luck maple mask milk mint moon moss mouse music night note oak ocean olive owl paper park pearl pine pixel plant plum pond pride prize quick quiet radio rain reef ride ring river road robot rock rope rose sail sand seal seed shell ship shoe silk sky snow song spark star stone storm sun swan table tent tide tiger time toast town tree tulip vase wave wheat wind wing wolf wood yard zebra zone').split(' '),
  ('anchor autumn basket bridge camera candle canyon carbon castle cavern circle clover coffee copper coral cosmos crater crystal current cyclone danger desert diamond dolphin dragon engine escape feather forest fossil garden glacier granite gravity harbor harvest helmet hollow iceberg island jungle keyhole kitchen lantern library machine magnet marble meadow mirror monsoon morning mosaic mystery nebula nickel orchard oxygen palace pattern pebble pepper planet plateau pocket prairie pumpkin puzzle quarry rabbit rainbow ribbon ripple rocket saddle sailor shadow shelter shuttle signal silver spiral splash spring stable statue stream studio summit sunset temple thunder ticket timber tunnel valley velvet violet voyage walnut whisper willow window winter wizard wonder yellow zephyr').split(' '),
  ('adventure aluminium ambulance architect astronaut atmosphere avalanche beautiful blueprint butterfly cathedral celebrate chandelier chemistry chocolate coastline community companion conductor continent crocodile curiosity dandelion dashboard deliberate dictionary difficult discovery education elevation equipment evergreen expedition fireplace framework furniture generator gladiator harmonica headlight helicopter highlight hurricane invention jellyfish journalist keyboards kilometer landscape lighthouse lightning limestone magnesium magnitude marmalade mechanism microscope milestone moonlight mountains mushrooms navigator nightfall nocturnal notebooks observant orchestra ornaments paintings parachute passenger peninsula periscope pineapple planetary porcelain professor quicksand radiation rainstorm raspberry reflection remarkable resonance sanctuary satellite saxophone sculpture signature snowflake spacecraft spectacle staircase starlight stargazer submarine sunflower telescope thunderous timekeeper trampoline transport treasures turbulence universal vegetable ventilate vibration volcanoes waterfall wilderness windmills wonderful woodlands yesterday').split(' '),
];

// ── obtiaznosti (px/s, sekundy) ─────────────────────────────────────────
const DIFFS = [
  {key:'diffEasy',   speed:32, gap:2.20, live:3, ramp:0.13},
  {key:'diffMedium', speed:44, gap:1.80, live:3, ramp:0.19},
  {key:'diffHard',   speed:54, gap:1.45, live:4, ramp:0.25},
];
let diffIdx = 1;
const bestKey = i => 'typerush_best_' + i;
let best = 0;
const LIVES = 3;

const ST = {MENU:0, COUNT:1, PLAY:2, PAUSE:3, OVER:4};
let state = ST.MENU;

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, SCL = 1;
let TOP = 90, LINE = 0, FS = 20, CW = 12;
const MONO = "'DM Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace";
function wordFont() { return '500 ' + FS + 'px ' + MONO; }

let words = [], parts = [], pops = [], shards = [];
let targetId = null, nextId = 1, recent = [];
let score = 0, combo = 0, maxCombo = 0, lives = LIVES;
let done = 0, keysOk = 0, keysBad = 0, charsOk = 0;
let spawnIn = 0, cdLeft = 0, goFlash = 0, runSec = 0;
let shake = 0, flash = 0, flashRgb = '255,93,109';
let tPrev = 0, bgDirty = true;
const bg = document.createElement('canvas'), bgx = bg.getContext('2d');
const isTouch = window.matchMedia('(pointer: coarse)').matches;

function applyLang() {
  document.getElementById('lbl-back').textContent  = t('back');
  document.getElementById('lbl-score').textContent = t('uiScore');
  document.getElementById('lbl-combo').textContent = t('uiCombo');
  document.getElementById('lbl-best').textContent  = t('uiBest');
  document.getElementById('lbl-wpm').textContent   = t('typWpm');
  document.getElementById('lbl-acc').textContent   = t('uiAccuracy');
  document.getElementById('lbl-words').textContent = t('typWords');
  document.getElementById('lbl-diff').textContent  = t('uiDifficulty');
  document.getElementById('res-lbl').textContent   = t('uiScore');
}

function rnd(a, b) { return a + Math.random() * (b - a); }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
const D = () => DIFFS[diffIdx];

// ── klavesnica na obrazovke ─────────────────────────────────────────────
const kbEl = document.getElementById('kb');
const keyEls = {};
function buildKb() {
  kbEl.textContent = '';
  ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'].forEach(rw => {
    const r = document.createElement('div');
    r.className = 'kb-row';
    rw.split('').forEach(ch => {
      const k = document.createElement('div');
      k.className = 'kb-key';
      k.textContent = ch;
      k.addEventListener('pointerdown', e => { e.preventDefault(); typeChar(ch); flick(k); }, {passive: false});
      r.appendChild(k);
      keyEls[ch] = k;
    });
    kbEl.appendChild(r);
  });
  const r = document.createElement('div');
  r.className = 'kb-row';
  const bs = document.createElement('div');
  bs.className = 'kb-key wide';
  bs.textContent = '⌫';
  bs.addEventListener('pointerdown', e => { e.preventDefault(); dropTarget(); flick(bs); }, {passive: false});
  r.appendChild(bs);
  kbEl.appendChild(r);
}
function flick(el) { el.classList.add('hit'); setTimeout(() => el.classList.remove('hit'), 110); }
function markNextKey() {
  for (const k in keyEls) keyEls[k].classList.remove('next');
  const w = words.find(x => x.id === targetId);
  if (!w || state !== ST.PLAY) return;
  const ch = w.text[w.typed];
  if (ch && keyEls[ch]) keyEls[ch].classList.add('next');
}

// ── rozmery ─────────────────────────────────────────────────────────────
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth || document.documentElement.clientWidth || 360;
  H = window.innerHeight || document.documentElement.clientHeight || 640;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  SCL = clamp(Math.min(W, H) / 620, 0.6, 1.3);
  FS = Math.round(clamp(Math.min(W / 22, H / 20), 14, 26));
  TOP = (W < 620 ? 58 : 52) + 30;
  const kbH = (isTouch && kbEl.classList.contains('show')) ? kbEl.offsetHeight : 0;
  LINE = H - kbH - (isTouch ? 14 : 40);
  bg.width = cv.width; bg.height = cv.height;
  bgx.setTransform(DPR, 0, 0, DPR, 0, 0);
  bgDirty = true;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 250));

// ── pozadie ─────────────────────────────────────────────────────────────
function drawBg() {
  bgx.clearRect(0, 0, W, H);
  const g = bgx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0a1526');
  g.addColorStop(0.6, '#070d1a');
  g.addColorStop(1, '#03060d');
  bgx.fillStyle = g; bgx.fillRect(0, 0, W, H);
  // datove stopy
  bgx.strokeStyle = 'rgba(96,165,250,0.05)';
  bgx.lineWidth = 1;
  bgx.beginPath();
  for (let x = 24; x < W; x += 46) { bgx.moveTo(x, 0); bgx.lineTo(x, H); }
  bgx.stroke();
  bgx.fillStyle = 'rgba(96,165,250,0.055)';
  for (let i = 0; i < 60; i++) {
    const x = Math.random() * W, y = Math.random() * H;
    bgx.fillRect(x, y, 2, rnd(6, 22));
  }
  const v = bgx.createRadialGradient(W / 2, H * 0.42, Math.min(W, H) * 0.2, W / 2, H * 0.42, Math.max(W, H) * 0.8);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,0.6)');
  bgx.fillStyle = v; bgx.fillRect(0, 0, W, H);
  bgDirty = false;
}

// ── slova ───────────────────────────────────────────────────────────────
function charW() {
  ctx.font = wordFont();
  return ctx.measureText('m').width;
}
function wordWidth(txt) {
  CW = charW();
  return txt.length * CW + FS * 0.7;
}
function pickWord() {
  const pool = POOLS[diffIdx];
  let w, n = 0;
  do { w = pool[Math.floor(Math.random() * pool.length)]; n++; } while (recent.includes(w) && n < 10);
  recent.push(w);
  if (recent.length > 14) recent.shift();
  return w;
}
function spawn() {
  const text = pickWord();
  const wd = wordWidth(text);
  const maxX = Math.max(8, W - wd - 8);
  let x = 0, ok = false;
  for (let i = 0; i < 24 && !ok; i++) {
    x = rnd(8, maxX);
    ok = true;
    for (const o of words) {
      if (o.y > TOP + 90) continue;
      if (x < o.x + o.w + 12 && x + wd + 12 > o.x) { ok = false; break; }
    }
  }
  if (!ok) return;
  words.push({id: nextId++, text, typed: 0, x, y: TOP - 10, w: wd, bad: 0});
}

function burst(x, y, rgb, n, pw) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, 6.2832), sp = rnd(50, 250) * pw;
    parts.push({x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30, life: rnd(0.3, 0.7), max: 0.7, rgb, sz: rnd(1.5, 3.4) * SCL});
  }
}
function pop(x, y, txt, rgb) { pops.push({x, y, txt, rgb, life: 0.8}); }
function shatter(w) {
  for (let i = 0; i < w.text.length; i++) {
    shards.push({ch: w.text[i], x: w.x + (i + 0.5) * CW, y: w.y,
      vx: rnd(-90, 90), vy: rnd(-150, -40), rot: rnd(-3, 3), a: 0, life: 0.9});
  }
}

// ── pisanie ─────────────────────────────────────────────────────────────
function typeChar(ch) {
  if (state === ST.PAUSE) { cdLeft = 1.2; state = ST.COUNT; return; }
  if (state !== ST.PLAY) return;
  ch = ch.toLowerCase();
  if (targetId !== null) {
    const w = words.find(x => x.id === targetId);
    if (!w) { targetId = null; return; }
    if (w.text[w.typed] === ch) {
      w.typed++; keysOk++; charsOk++;
      burst(w.x + (w.typed - 0.5) * CW, w.y, '74,222,128', 3, 0.4);
      if (w.typed === w.text.length) complete(w);
    } else {
      keysBad++;
      w.bad = 0.35;
      shake = Math.min(1, shake + 0.16);
    }
    markNextKey();
    return;
  }
  // ziadne slovo nie je rozpisane — zoberiem to najnizsie, ktore zacina na tento znak
  const cand = words.filter(w => w.text[0] === ch);
  if (!cand.length) { keysBad++; return; }
  cand.sort((a, b) => b.y - a.y);
  const w = cand[0];
  w.typed = 1; keysOk++; charsOk++;
  targetId = w.id;
  burst(w.x + 0.5 * CW, w.y, '74,222,128', 3, 0.4);
  if (w.typed === w.text.length) complete(w);
  markNextKey();
}
function dropTarget() {
  if (state === ST.PAUSE) { cdLeft = 1.2; state = ST.COUNT; return; }
  const w = words.find(x => x.id === targetId);
  if (w) w.typed = 0;
  targetId = null;
  markNextKey();
}
function complete(w) {
  words = words.filter(x => x.id !== w.id);
  targetId = null;
  const mult = Math.min(5, 1 + Math.floor(combo / 3));
  const gain = w.text.length * 10 * mult;
  score += gain;
  combo++; done++;
  if (combo > maxCombo) maxCombo = combo;
  burst(w.x + w.w / 2, w.y, '96,165,250', 18, 0.95);
  pop(w.x + w.w / 2, w.y, '+' + gain + (mult > 1 ? '  ×' + mult : ''), '96,165,250');
  if (combo % 5 === 0) { flash = 0.14; flashRgb = '74,222,128'; }
  syncHud();
}
function miss(w) {
  words = words.filter(x => x.id !== w.id);
  if (targetId === w.id) targetId = null;
  combo = 0;
  lives--;
  shatter(w);
  burst(w.x + w.w / 2, LINE, '255,93,109', 20, 1.1);
  shake = Math.min(1, shake + 0.8);
  flash = 0.3; flashRgb = '255,93,109';
  syncHud();
  if (lives <= 0) endRound();
}

// ── kolo ────────────────────────────────────────────────────────────────
function loadBest() {
  best = +(localStorage.getItem(bestKey(diffIdx)) || 0);
  setHud('hud-best', best);
  document.getElementById('best-pill').classList.remove('record');
}
function beginRound() {
  words = []; parts = []; pops = []; shards = []; recent = [];
  targetId = null;
  score = 0; combo = 0; maxCombo = 0; lives = LIVES;
  done = 0; keysOk = 0; keysBad = 0; charsOk = 0; runSec = 0;
  spawnIn = 0.6; shake = 0; flash = 0; goFlash = 0;
  cdLeft = 2.4;
  state = ST.COUNT;
  document.getElementById('overlay').classList.add('hide');
  document.getElementById('hud').classList.add('show');
  document.getElementById('pause-btn').classList.add('show');
  kbEl.classList.add('show');
  resize();
  syncHud(true);
  markNextKey();
}
function endRound() {
  state = ST.OVER;
  const rec = score > best;
  if (rec) { best = score; try { localStorage.setItem(bestKey(diffIdx), best); } catch (e) {} }
  const mins = Math.max(0.08, runSec / 60);
  const wpm = Math.round((charsOk / 5) / mins);
  const keys = keysOk + keysBad;
  const acc = keys ? Math.round(keysOk / keys * 100) : 0;
  document.getElementById('res-score').textContent = score;
  const note = document.getElementById('res-note');
  note.textContent = rec ? t('uiNewRecord') : t('uiBest') + ' ' + best;
  note.classList.toggle('record', rec);
  document.getElementById('st-wpm').textContent = wpm;
  document.getElementById('st-acc').textContent = acc + '%';
  document.getElementById('st-words').textContent = done;
  showCard('over');
  setHud('hud-best', best);
  document.getElementById('best-pill').classList.toggle('record', rec);
}
function showCard(mode) {
  document.getElementById('ov-title').textContent = mode === 'over' ? t('typGameOver') : t('typTitle');
  document.getElementById('brand').style.display = mode === 'over' ? 'none' : '';
  document.getElementById('result').classList.toggle('show', mode === 'over');
  document.getElementById('stats').classList.toggle('show', mode === 'over');
  document.getElementById('ov-hint').textContent = t('typRules');
  document.getElementById('ov-play').textContent = mode === 'over' ? t('typReplay') : t('uiStart');
  document.getElementById('overlay').classList.remove('hide');
  document.getElementById('hud').classList.remove('show');
  document.getElementById('pause-btn').classList.remove('show');
  kbEl.classList.remove('show');
}
function togglePause() {
  if (state === ST.PLAY) state = ST.PAUSE;
  else if (state === ST.PAUSE) { cdLeft = 1.2; state = ST.COUNT; }
}

// ── HUD ─────────────────────────────────────────────────────────────────
const hudVal = {};
function setHud(id, v) {
  if (hudVal[id] === v) return;
  hudVal[id] = v;
  const el = document.getElementById(id);
  el.textContent = v;
  el.classList.remove('bump');
  void el.offsetWidth;
  el.classList.add('bump');
  setTimeout(() => el.classList.remove('bump'), 180);
}
function syncHud(force) {
  setHud('hud-score', score);
  setHud('hud-combo', combo);
  document.getElementById('combo-pill').classList.toggle('on', combo >= 2);
  const box = document.getElementById('lifes');
  if (box.children.length !== LIVES) {
    box.textContent = '';
    for (let i = 0; i < LIVES; i++) { const d = document.createElement('div'); d.className = 'life'; box.appendChild(d); }
  }
  [...box.children].forEach((d, i) => d.classList.toggle('gone', i >= lives));
  if (force) setHud('hud-best', best);
}

// ── update ──────────────────────────────────────────────────────────────
function update(dt) {
  for (const p of parts) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; }
  if (parts.length) parts = parts.filter(p => p.life > 0);
  for (const p of pops) { p.life -= dt; p.y -= 40 * SCL * dt; }
  if (pops.length) pops = pops.filter(p => p.life > 0);
  for (const s of shards) { s.life -= dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 520 * dt; s.a += s.rot * dt; }
  if (shards.length) shards = shards.filter(s => s.life > 0);
  if (shake > 0) shake = Math.max(0, shake - dt * 3.2);
  if (flash > 0) flash = Math.max(0, flash - dt * 2.4);
  if (goFlash > 0) goFlash = Math.max(0, goFlash - dt * 2);
  for (const w of words) if (w.bad > 0) w.bad = Math.max(0, w.bad - dt * 2.6);

  if (state === ST.COUNT) {
    cdLeft -= dt;
    if (cdLeft <= 0) { state = ST.PLAY; goFlash = 0.5; }
    return;
  }
  if (state !== ST.PLAY) return;

  const d = D();
  runSec += dt;
  // tempo aj pocet slov rastu s poctom napisanych slov - aj rychly pisatel raz narazi
  const up = 1 + Math.min(3.4, done * d.ramp * 0.14);
  const sp = d.speed * up * SCL;
  const live = Math.min(8, d.live + Math.floor(done / 20));

  for (const w of words.slice()) {
    w.y += sp * dt;
    if (w.y >= LINE - FS * 0.55) miss(w);
  }
  spawnIn -= dt;
  if (spawnIn <= 0 && words.length < live) {
    spawn();
    spawnIn = (d.gap / up) * rnd(0.85, 1.15);
  }
}

// ── kreslenie ───────────────────────────────────────────────────────────
function draw() {
  if (bgDirty) drawBg();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(bg, 0, 0, W, H);

  if (shake > 0) {
    const s = shake * shake * 8 * SCL;
    ctx.translate(rnd(-s, s), rnd(-s, s));
  }

  // ciara zaniku
  const pulse = 0.35 + Math.sin(tPrev / 260) * 0.1;
  ctx.strokeStyle = 'rgba(255,93,109,' + pulse + ')';
  ctx.lineWidth = 2;
  ctx.setLineDash([7, 6]);
  ctx.beginPath(); ctx.moveTo(0, LINE); ctx.lineTo(W, LINE); ctx.stroke();
  ctx.setLineDash([]);
  const lg = ctx.createLinearGradient(0, LINE, 0, LINE + 26);
  lg.addColorStop(0, 'rgba(255,93,109,0.18)');
  lg.addColorStop(1, 'rgba(255,93,109,0)');
  ctx.fillStyle = lg;
  ctx.fillRect(0, LINE, W, 26);

  ctx.textBaseline = 'middle';
  ctx.font = wordFont();
  CW = charW();
  for (const w of words) {
    const isT = w.id === targetId;
    const cw = CW;
    const near = clamp((w.y - TOP) / Math.max(1, LINE - TOP), 0, 1);
    // kapsula
    ctx.save();
    const bad = w.bad > 0;
    ctx.fillStyle = bad ? 'rgba(255,93,109,0.22)' : (isT ? 'rgba(96,165,250,0.16)' : 'rgba(255,255,255,0.045)');
    ctx.strokeStyle = bad ? 'rgba(255,93,109,0.75)'
      : (isT ? 'rgba(96,165,250,0.75)' : 'rgba(255,255,255,' + (0.1 + near * 0.16) + ')');
    ctx.lineWidth = isT ? 1.8 : 1;
    const bx = w.x - FS * 0.35, by = w.y - FS * 0.72, bw = w.text.length * cw + FS * 0.7, bh = FS * 1.44;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(bx, by, bw, bh, bh / 2);
    else ctx.rect(bx, by, bw, bh);
    ctx.fill(); ctx.stroke();
    ctx.restore();
    // znaky
    let x = w.x;
    for (let i = 0; i < w.text.length; i++) {
      if (i < w.typed) {
        ctx.fillStyle = '#4ade80';
        ctx.shadowColor = 'rgba(74,222,128,0.8)';
        ctx.shadowBlur = 8;
      } else {
        ctx.fillStyle = isT ? '#eaf4ff' : 'rgba(234,244,255,' + (0.5 + near * 0.4) + ')';
        ctx.shadowBlur = 0;
      }
      ctx.fillText(w.text[i], x, w.y);
      x += cw;
    }
    ctx.shadowBlur = 0;
    if (isT && w.typed < w.text.length) {
      // kurzor pod dalsim znakom
      ctx.fillStyle = 'rgba(96,165,250,0.9)';
      ctx.fillRect(w.x + w.typed * cw, w.y + FS * 0.6, cw * 0.8, 2.2);
    }
  }

  // rozsypane znaky zmeskaneho slova
  for (const s of shards) {
    ctx.save();
    ctx.globalAlpha = clamp(s.life / 0.9, 0, 1);
    ctx.translate(s.x, s.y);
    ctx.rotate(s.a);
    ctx.fillStyle = '#ff5d6d';
    ctx.font = wordFont();
    ctx.fillText(s.ch, 0, 0);
    ctx.restore();
  }
  for (const p of parts) {
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = 'rgb(' + p.rgb + ')';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.sz, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  for (const p of pops) {
    ctx.globalAlpha = clamp(p.life / 0.8, 0, 1);
    ctx.font = '800 ' + Math.round(19 * SCL) + "px 'Syne',sans-serif";
    ctx.lineWidth = 3.5 * SCL;
    ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(3,6,12,0.8)';
    ctx.strokeText(p.txt, p.x, p.y);
    ctx.fillStyle = 'rgb(' + p.rgb + ')';
    ctx.fillText(p.txt, p.x, p.y);
  }
  ctx.globalAlpha = 1;

  if (state === ST.COUNT) {
    const n = Math.ceil(cdLeft);
    const fr = 1 - (cdLeft - Math.floor(cdLeft));
    ctx.globalAlpha = clamp(1.15 - fr, 0.15, 1);
    ctx.font = '800 ' + Math.round((70 + fr * 26) * SCL) + "px 'Syne',sans-serif";
    ctx.fillStyle = '#eaf4ff';
    ctx.shadowColor = 'rgba(96,165,250,0.75)';
    ctx.shadowBlur = 26;
    ctx.fillText(String(n), W / 2, H / 2);
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  } else if (goFlash > 0) {
    ctx.globalAlpha = clamp(goFlash / 0.5, 0, 1);
    ctx.font = '800 ' + Math.round(52 * SCL) + "px 'Syne',sans-serif";
    ctx.fillStyle = '#4ade80';
    ctx.shadowColor = 'rgba(74,222,128,0.7)';
    ctx.shadowBlur = 26;
    ctx.fillText(t('uiGo'), W / 2, H / 2);
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }
  if (state === ST.PAUSE) {
    ctx.fillStyle = 'rgba(3,6,12,0.62)';
    ctx.fillRect(0, 0, W, H);
    ctx.font = '800 ' + Math.round(34 * SCL) + "px 'Syne',sans-serif";
    ctx.fillStyle = '#eaf4ff';
    ctx.fillText(t('uiPaused'), W / 2, H / 2);
  }
  ctx.textAlign = 'left';
  if (flash > 0) {
    ctx.fillStyle = 'rgba(' + flashRgb + ',' + (flash * 0.45) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

function frame(ts) {
  if (!tPrev) tPrev = ts;
  const dt = Math.min(0.05, (ts - tPrev) / 1000);
  tPrev = ts;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

// ── vstup ───────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.code === 'Escape') { e.preventDefault(); if (state === ST.PLAY || state === ST.PAUSE) togglePause(); return; }
  if (e.key === 'Backspace') { e.preventDefault(); dropTarget(); return; }
  if (e.code === 'Enter' && (state === ST.MENU || state === ST.OVER)) { e.preventDefault(); beginRound(); return; }
  if (/^[a-zA-Z]$/.test(e.key)) { typeChar(e.key); return; }
  if (e.code === 'Space') { e.preventDefault(); if (state === ST.PAUSE) { cdLeft = 1.2; state = ST.COUNT; } }
});
cv.addEventListener('pointerdown', () => { if (state === ST.PAUSE) { cdLeft = 1.2; state = ST.COUNT; } });
document.getElementById('pause-btn').addEventListener('click', togglePause);
window.addEventListener('blur', () => { if (state === ST.PLAY) state = ST.PAUSE; });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === ST.PLAY) state = ST.PAUSE; });

// ── obtiaznost ──────────────────────────────────────────────────────────
const row = document.getElementById('diff-row');
DIFFS.forEach((d, i) => {
  const b = document.createElement('button');
  b.textContent = t(d.key);
  b.className = i === diffIdx ? 'active' : '';
  b.addEventListener('click', () => {
    diffIdx = i;
    [...row.children].forEach((c, j) => c.className = j === i ? 'active' : '');
    loadBest();
    if (state === ST.OVER) document.getElementById('res-note').textContent = t('uiBest') + ' ' + best;
  });
  row.appendChild(b);
});
document.getElementById('ov-play').addEventListener('click', beginRound);

applyLang();
buildKb();
if (isTouch) document.body.classList.add('touch');
resize();
loadBest();
showCard('menu');
requestAnimationFrame(frame);
</script>
