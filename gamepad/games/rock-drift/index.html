<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rock Drift · GamePad</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<script src="../../i18n.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#06040c;--text:#f0eeff;--muted:rgba(240,238,255,0.42);--dim:rgba(240,238,255,0.18);
  --border:rgba(255,255,255,0.09);--border-h:rgba(255,255,255,0.18);
  --c:#ff6b6b;--c2:#8f7dff;--ion:#4dd2ff;--gold:#ffd166;
}
html,body{background:var(--bg);height:100%;font-family:'DM Sans',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;user-select:none;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none;}
button,a{touch-action:manipulation;font-family:'DM Sans',sans-serif;}

#back-btn{position:fixed;top:14px;left:14px;z-index:60;display:flex;align-items:center;gap:7px;background:rgba(10,7,20,0.72);backdrop-filter:blur(8px);border:1px solid var(--border);color:var(--muted);padding:7px 14px;border-radius:100px;text-decoration:none;font-size:12px;font-weight:500;transition:border-color .18s,color .18s;}
#back-btn:hover,#back-btn:active{border-color:var(--border-h);color:var(--text);}
@media(max-width:520px){#back-btn{top:9px;left:9px;padding:6px 11px;font-size:11px;}}

#hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:12;display:none;align-items:center;gap:7px;pointer-events:none;}
#hud.show{display:flex;}
.pill{display:flex;align-items:center;gap:8px;padding:5px 12px;border-radius:100px;background:rgba(10,7,20,0.6);backdrop-filter:blur(8px);border:1px solid var(--border);font-size:9px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;color:var(--dim);white-space:nowrap;}
.pill b{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;letter-spacing:0;font-variant-numeric:tabular-nums;color:var(--c);transition:transform .18s;}
.pill.wave b{color:var(--c2);}
.pill.best b{color:rgba(240,238,255,.72);}
.pill.best.record{border-color:rgba(255,107,107,.45);}
.pill b.bump{transform:scale(1.3);}
.lifes{display:flex;gap:4px;}
.life{width:9px;height:9px;background:var(--ion);clip-path:polygon(100% 50%,0 100%,26% 50%,0 0);box-shadow:0 0 8px rgba(77,210,255,.9);}
.life.gone{background:rgba(255,255,255,0.13);box-shadow:none;}
@media(max-width:620px){#hud{left:auto;right:56px;transform:none;gap:5px;}.pill span{display:none;}.pill{padding:4px 10px;}.pill b{font-size:15px;}.pill.best{display:none;}}

#pause-btn{position:fixed;top:14px;right:14px;z-index:60;display:none;align-items:center;justify-content:center;width:36px;height:36px;background:rgba(10,7,20,0.7);backdrop-filter:blur(8px);border:1px solid var(--border);color:var(--muted);border-radius:50%;cursor:pointer;}
#pause-btn.show{display:flex;}
#pause-btn:hover{border-color:var(--border-h);color:var(--text);}

#ctrl{position:fixed;bottom:18px;left:0;right:0;z-index:12;display:none;justify-content:space-between;padding:0 16px;pointer-events:none;}
body.touch #ctrl.show{display:flex;}
.pad{display:flex;gap:9px;pointer-events:auto;}
.btn{display:flex;align-items:center;justify-content:center;width:58px;height:58px;border-radius:16px;background:linear-gradient(160deg,rgba(255,255,255,0.07),rgba(255,255,255,0.02));border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:background .1s,border-color .1s,color .1s,transform .1s;}
.btn svg{width:19px;height:19px;}
.btn:active,.btn.on{background:rgba(77,210,255,0.18);border-color:rgba(77,210,255,0.45);color:var(--ion);transform:scale(.94);}
#btn-fire{width:72px;height:72px;border-color:rgba(255,209,102,.45);color:var(--gold);}
#btn-fire:active,#btn-fire.on{background:rgba(255,209,102,.2);border-color:rgba(255,209,102,.6);}

#overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(ellipse at center,rgba(10,7,20,0.78) 0%,rgba(4,2,8,0.95) 78%);backdrop-filter:blur(6px);}
#overlay.hide{display:none;}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:11px;width:100%;max-width:334px;padding:26px 24px 24px;border-radius:24px;background:linear-gradient(165deg,rgba(255,255,255,0.06),rgba(255,255,255,0.015));border:1px solid var(--border-h);box-shadow:0 30px 70px -28px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.07);animation:pop .34s cubic-bezier(.2,1.4,.4,1);}
@keyframes pop{from{transform:scale(.9) translateY(8px);opacity:0;}to{transform:none;opacity:1;}}
.card::before{content:'';position:absolute;inset:-1px;border-radius:24px;padding:1px;background:linear-gradient(120deg,rgba(255,107,107,.5),transparent 42%,transparent 58%,rgba(143,125,255,.5));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;}
.emoji{font-size:34px;line-height:1;filter:drop-shadow(0 6px 16px rgba(255,107,107,.4));}
.ttl{font-family:'Syne',sans-serif;font-weight:800;font-size:24px;letter-spacing:-.5px;text-align:center;background:linear-gradient(110deg,var(--c) 5%,#fff 52%,var(--c2) 95%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
#result{display:none;flex-direction:column;align-items:center;gap:1px;}
#result.show{display:flex;}
#res-lbl{font-size:9px;letter-spacing:2.2px;text-transform:uppercase;color:var(--dim);}
#res-score{font-family:'Syne',sans-serif;font-weight:800;font-size:50px;line-height:1.05;letter-spacing:-2px;color:var(--c);text-shadow:0 0 30px rgba(255,107,107,.45);}
#res-note{font-size:11.5px;font-weight:600;color:var(--muted);}
#res-note.record{color:var(--gold);}
#ov-stats{display:none;width:100%;grid-template-columns:1fr 1fr;gap:7px;}
#ov-stats.show{display:grid;}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:14px;background:rgba(255,255,255,0.04);border:1px solid var(--border);}
.stat i{font-size:8px;font-style:normal;letter-spacing:1.3px;text-transform:uppercase;color:var(--dim);text-align:center;}
.stat b{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;color:var(--c2);white-space:nowrap;}
.seg{display:flex;gap:3px;background:rgba(255,255,255,0.04);border:1px solid var(--border);padding:3px;border-radius:100px;}
.seg button{background:transparent;border:none;color:var(--muted);padding:6px 15px;border-radius:100px;font-size:11.5px;font-weight:600;cursor:pointer;transition:color .16s,background .16s;}
.seg button:hover{color:var(--text);}
.seg button.active{background:rgba(255,107,107,0.16);color:#ffd0d0;box-shadow:inset 0 0 0 1px rgba(255,107,107,0.42);}
.lbl{font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);}
.hint{font-size:11.5px;line-height:1.55;color:var(--muted);text-align:center;}
.play-btn{margin-top:3px;width:100%;padding:13px 30px;border-radius:100px;border:1px solid rgba(255,107,107,.5);background:linear-gradient(180deg,rgba(255,107,107,.24),rgba(255,107,107,.1));color:#ffdede;font-size:14px;font-weight:600;cursor:pointer;transition:all .18s;}
.play-btn:hover{background:linear-gradient(180deg,rgba(255,107,107,.34),rgba(255,107,107,.16));color:#fff;box-shadow:0 0 24px -6px rgba(255,107,107,.5);}
.play-btn:active{transform:translateY(1px);}
@media(max-height:640px){.card{gap:8px;padding:18px 20px;}.emoji{display:none;}.ttl{font-size:20px;}#res-score{font-size:38px;}}
@media (max-height:820px){#overlay{align-items:flex-start !important;overflow-y:auto !important;}}
</style>
</head>
<body>
<a href="../../index.html" id="back-btn">
  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
  <span id="lbl-back"></span>
</a>

<canvas id="c"></canvas>

<div id="hud">
  <div class="pill"><span id="lbl-score"></span><b id="hud-score">0</b></div>
  <div class="pill wave"><span id="lbl-wave"></span><b id="hud-wave">1</b></div>
  <div class="pill"><div class="lifes" id="lifes"></div></div>
  <div class="pill best" id="best-pill"><span id="lbl-best"></span><b id="hud-best">0</b></div>
</div>

<button id="pause-btn" aria-label="pause">
  <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1.4"/><rect x="14" y="4" width="4" height="16" rx="1.4"/></svg>
</button>

<div id="ctrl">
  <div class="pad">
    <button class="btn" id="btn-left" aria-label="left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg></button>
    <button class="btn" id="btn-right" aria-label="right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/></svg></button>
  </div>
  <div class="pad">
    <button class="btn" id="btn-thrust" aria-label="thrust"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    <button class="btn" id="btn-fire" aria-label="fire"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
  </div>
</div>

<div id="overlay">
  <div class="card">
    <div id="brand"><div class="emoji">🚀</div></div>
    <div class="ttl" id="ov-title"></div>
    <div id="result">
      <div id="res-lbl"></div>
      <div id="res-score">0</div>
      <div id="res-note"></div>
    </div>
    <div id="ov-stats">
      <div class="stat"><i id="lbl-s-wave"></i><b id="st-wave">1</b></div>
      <div class="stat"><i id="lbl-s-best"></i><b id="st-best">0</b></div>
    </div>
    <div class="lbl" id="lbl-diff"></div>
    <div class="seg" id="diff-row"></div>
    <div class="hint" id="ov-hint"></div>
    <button class="play-btn" id="ov-play"></button>
  </div>
</div>

<script>
// ── nastavenia (vsetko v px/s, rad/s) ───────────────────────────────────
const DIFFS = [
  {key:'diffEasy',   base:4, extra:1, spd:0.75, lives:4},
  {key:'diffMedium', base:5, extra:2, spd:1.00, lives:3},
  {key:'diffHard',   base:7, extra:3, spd:1.40, lives:2},
];
let diffIdx = 1;
const bestKey = () => 'rockdrift_best_' + diffIdx;
let best = 0;

const TURN = 3.6, THRUST = 1080, BULLET_V = 600, BULLET_LIFE = 0.92, FIRE_CD = 0.19;
const TIER = {3:[143,125,255], 2:[196,110,220], 1:[255,159,67]};
const PTS = {3:20, 2:50, 1:100};

const ST = {MENU:0, COUNT:1, PLAY:2, PAUSE:3, OVER:4};
let state = ST.MENU;

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, SCL = 1;

let ship = {x:0, y:0, a:-Math.PI/2, vx:0, vy:0};
let rocks = [], shots = [], parts = [], pops = [], blobs = [], stars = [];
let score = 0, lives = 3, wave = 1, shots_fired = 0, hits = 0;
let invuln = 0, cd = 0, shake = 0, waveFlash = 0, cdLeft = 0, goFlash = 0;
let tPrev = 0, tSec = 0;
const keys = {};
const isTouch = window.matchMedia('(pointer: coarse)').matches;

function applyLang() {
  document.getElementById('lbl-back').textContent  = t('back');
  document.getElementById('lbl-score').textContent = t('uiScore');
  document.getElementById('lbl-wave').textContent  = t('uiWave');
  document.getElementById('lbl-best').textContent  = t('uiBest');
  document.getElementById('lbl-s-wave').textContent = t('uiWave');
  document.getElementById('lbl-s-best').textContent = t('uiBest');
  document.getElementById('res-lbl').textContent   = t('uiScore');
  document.getElementById('lbl-diff').textContent  = t('uiDifficulty');
}
function rnd(a, b) { return a + Math.random() * (b - a); }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
const D = () => DIFFS[diffIdx];
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);

// ── rozmery ─────────────────────────────────────────────────────────────
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth || 360;
  H = window.innerHeight || 640;
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  SCL = clamp(Math.min(W, H) / 620, 0.62, 1.35);
  makeStars();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 250));

function makeStars() {
  stars = [[80, 0.6, 1], [50, 1.1, 2.4], [30, 1.6, 3.8]].map(([n, r, depth]) =>
    Array.from({length: n}, () => ({x: Math.random(), y: Math.random(), r, depth, ph: rnd(0, 6.2832)})));
  blobs = [
    {cx:0.22, cy:0.30, r:420, rgb:'143,125,255', t:0, sp:0.07},
    {cx:0.78, cy:0.68, r:380, rgb:'255,107,107', t:2, sp:0.05},
    {cx:0.50, cy:0.85, r:300, rgb:'77,210,255',  t:4, sp:0.09},
  ];
}

// ── kolo ────────────────────────────────────────────────────────────────
function loadBest() {
  best = +(localStorage.getItem(bestKey()) || 0);
  setHud('hud-best', best);
  document.getElementById('best-pill').classList.remove('record');
}
function beginRound() {
  score = 0; lives = D().lives; wave = 1; shots_fired = 0; hits = 0;
  ship = {x: W / 2, y: H / 2, a: -Math.PI / 2, vx: 0, vy: 0};
  rocks = []; shots = []; parts = []; pops = [];
  invuln = 1.4; cd = 0; shake = 0; waveFlash = 0; goFlash = 0;
  cdLeft = 2.4;
  state = ST.COUNT;
  spawnWave();
  document.getElementById('overlay').classList.add('hide');
  document.getElementById('hud').classList.add('show');
  document.getElementById('pause-btn').classList.add('show');
  document.getElementById('ctrl').classList.add('show');
  loadBest();
  syncHud(true);
}
function spawnWave() {
  rocks = [];
  const d = D();
  const n = d.base + wave * d.extra;
  for (let i = 0; i < n; i++) {
    let x, y, guard = 0;
    do { x = Math.random() * W; y = Math.random() * H; guard++; }
    while (dist(x, y, ship.x, ship.y) < 140 * SCL && guard < 60);
    addRock(x, y, rnd(34, 46) * SCL, 3);
  }
}
function addRock(x, y, r, tier) {
  const a = rnd(0, 6.2832);
  const sp = rnd(1, 2) * (4 - tier) * 36 * D().spd * SCL;
  const pts = [];
  const n = 7 + Math.floor(Math.random() * 4);
  for (let i = 0; i < n; i++) {
    const ang = i / n * 6.2832;
    const rr = r * rnd(0.7, 1.2);
    pts.push({x: Math.cos(ang) * rr, y: Math.sin(ang) * rr});
  }
  const craters = [];
  for (let i = 0; i < 1 + Math.floor(Math.random() * 3); i++) {
    craters.push({x: rnd(-0.45, 0.45) * r, y: rnd(-0.45, 0.45) * r, r: r * rnd(0.12, 0.26)});
  }
  rocks.push({x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r, tier, pts, craters, a: 0, spin: rnd(-1.2, 1.2), c: TIER[tier]});
}
function endRound() {
  state = ST.OVER;
  const rec = score > best;
  if (rec) { best = score; try { localStorage.setItem(bestKey(), best); } catch (e) {} }
  document.getElementById('res-score').textContent = score;
  const note = document.getElementById('res-note');
  note.textContent = rec ? t('uiNewRecord') : t('uiBest') + ' ' + best;
  note.classList.toggle('record', rec);
  document.getElementById('st-wave').textContent = wave;
  document.getElementById('st-best').textContent = best;
  showCard('over');
  setHud('hud-best', best);
  document.getElementById('best-pill').classList.toggle('record', rec);
}
function showCard(mode) {
  document.getElementById('ov-title').textContent = mode === 'over' ? t('uiGameOver') : t('rdrTitle');
  document.getElementById('brand').style.display = mode === 'over' ? 'none' : '';
  document.getElementById('result').classList.toggle('show', mode === 'over');
  document.getElementById('ov-stats').classList.toggle('show', mode === 'over');
  document.getElementById('ov-hint').textContent = isTouch ? t('rdrDesc') : t('rdrHint');
  document.getElementById('ov-play').textContent = mode === 'over' ? t('uiPlayAgain') : t('uiStart');
  document.getElementById('overlay').classList.remove('hide');
  document.getElementById('hud').classList.remove('show');
  document.getElementById('pause-btn').classList.remove('show');
  document.getElementById('ctrl').classList.remove('show');
}
function togglePause() {
  if (state === ST.PLAY) state = ST.PAUSE;
  else if (state === ST.PAUSE) { cdLeft = 1.2; state = ST.COUNT; }
}

// ── HUD ─────────────────────────────────────────────────────────────────
const hudVal = {};
function setHud(id, v) {
  if (hudVal[id] === v) return;
  hudVal[id] = v;
  const el = document.getElementById(id);
  el.textContent = v;
  el.classList.remove('bump');
  void el.offsetWidth;
  el.classList.add('bump');
  setTimeout(() => el.classList.remove('bump'), 180);
}
function syncHud(force) {
  setHud('hud-score', score);
  setHud('hud-wave', wave);
  const box = document.getElementById('lifes');
  const total = D().lives;
  if (box.children.length !== total) {
    box.textContent = '';
    for (let i = 0; i < total; i++) { const d = document.createElement('div'); d.className = 'life'; box.appendChild(d); }
  }
  [...box.children].forEach((d, i) => d.classList.toggle('gone', i >= lives));
  if (force) setHud('hud-best', best);
}

// ── strelba a zrazky ────────────────────────────────────────────────────
function fire() {
  if (state !== ST.PLAY || cd > 0) return;
  cd = FIRE_CD;
  shots_fired++;
  shots.push({x: ship.x + Math.cos(ship.a) * 16 * SCL, y: ship.y + Math.sin(ship.a) * 16 * SCL,
    vx: Math.cos(ship.a) * BULLET_V * SCL + ship.vx, vy: Math.sin(ship.a) * BULLET_V * SCL + ship.vy, life: BULLET_LIFE});
}
function boom(x, y, rgb, n, pw) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, 6.2832), sp = rnd(40, 260) * pw * SCL;
    parts.push({x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rnd(0.3, 0.62), max: 0.62, rgb, sz: rnd(1.4, 3.2) * SCL});
  }
}
function hitRock(j) {
  const a = rocks[j];
  hits++;
  const [cr, cg, cb] = a.c;
  boom(a.x, a.y, cr + ',' + cg + ',' + cb, 14, 1);
  boom(a.x, a.y, '255,209,102', 6, 0.6);
  parts.push({x: a.x, y: a.y, ring: true, r0: a.r * 0.4, life: 0.3, max: 0.3, rgb: '255,255,255', sz: 0});
  shake = Math.min(1, shake + a.tier * 0.14);
  const gain = PTS[a.tier];
  score += gain;
  pops.push({x: a.x, y: a.y, txt: '+' + gain, life: 0.75, rgb: cr + ',' + cg + ',' + cb});
  if (a.tier > 1) { addRock(a.x, a.y, a.r * 0.55, a.tier - 1); addRock(a.x, a.y, a.r * 0.55, a.tier - 1); }
  rocks.splice(j, 1);
  syncHud();
}
function loseLife() {
  lives--;
  invuln = 2;
  shake = 1;
  boom(ship.x, ship.y, '255,255,255', 24, 1.3);
  ship.vx = 0; ship.vy = 0;
  syncHud();
  if (lives <= 0) endRound();
}

// ── update ──────────────────────────────────────────────────────────────
function update(dt) {
  tSec += dt;
  for (const p of parts) { p.life -= dt; if (!p.ring) { p.x += p.vx * dt; p.y += p.vy * dt; } }
  if (parts.length) parts = parts.filter(p => p.life > 0);
  for (const p of pops) { p.life -= dt; p.y -= 34 * SCL * dt; }
  if (pops.length) pops = pops.filter(p => p.life > 0);
  if (shake > 0) shake = Math.max(0, shake - dt * 3.4);
  if (waveFlash > 0) waveFlash = Math.max(0, waveFlash - dt);
  if (goFlash > 0) goFlash = Math.max(0, goFlash - dt * 2);
  if (cd > 0) cd = Math.max(0, cd - dt);

  if (state === ST.COUNT) {
    cdLeft -= dt;
    if (cdLeft <= 0) { state = ST.PLAY; goFlash = 0.5; }
    return;
  }
  if (state !== ST.PLAY) return;

  if (invuln > 0) invuln = Math.max(0, invuln - dt);

  // lod
  if (keys.left) ship.a -= TURN * dt;
  if (keys.right) ship.a += TURN * dt;
  if (keys.thrust) {
    ship.vx += Math.cos(ship.a) * THRUST * SCL * dt;
    ship.vy += Math.sin(ship.a) * THRUST * SCL * dt;
    if (Math.random() < dt * 34) {
      parts.push({x: ship.x - Math.cos(ship.a) * 14 * SCL, y: ship.y - Math.sin(ship.a) * 14 * SCL,
        vx: rnd(-60, 60) - Math.cos(ship.a) * 120, vy: rnd(-60, 60) - Math.sin(ship.a) * 120,
        life: 0.28, max: 0.28, rgb: '255,159,67', sz: rnd(1.4, 2.6) * SCL});
    }
  }
  if (keys.fire) fire();
  const fr = Math.pow(0.99, dt * 60);
  ship.vx *= fr; ship.vy *= fr;
  ship.x = (ship.x + ship.vx * dt + W) % W;
  ship.y = (ship.y + ship.vy * dt + H) % H;

  for (const b of shots) {
    b.life -= dt;
    b.px = b.x; b.py = b.y;
    b.x = (b.x + b.vx * dt + W) % W;
    b.y = (b.y + b.vy * dt + H) % H;
  }
  shots = shots.filter(b => b.life > 0);

  for (const a of rocks) {
    a.x = (a.x + a.vx * dt + W) % W;
    a.y = (a.y + a.vy * dt + H) % H;
    a.a += a.spin * dt;
  }

  // strela vs kamen (kontrolujem aj medzipolohu, nech nepreletí)
  for (let i = shots.length - 1; i >= 0; i--) {
    const b = shots[i];
    let done = false;
    for (let j = rocks.length - 1; j >= 0 && !done; j--) {
      const a = rocks[j];
      const steps = 3;
      for (let s = 0; s <= steps && !done; s++) {
        const q = s / steps;
        const bx = (b.px === undefined ? b.x : b.px + (b.x - b.px) * q);
        const by = (b.py === undefined ? b.y : b.py + (b.y - b.py) * q);
        if (Math.abs(bx - a.x) > W / 2 || Math.abs(by - a.y) > H / 2) continue;   // preskok cez okraj
        if (dist(bx, by, a.x, a.y) < a.r) { shots.splice(i, 1); hitRock(j); done = true; }
      }
    }
  }

  // lod vs kamen
  if (invuln === 0) {
    for (const a of rocks) {
      if (dist(ship.x, ship.y, a.x, a.y) < a.r - 4 * SCL) { loseLife(); break; }
    }
  }

  if (state === ST.PLAY && !rocks.length) {
    wave++;
    spawnWave();
    waveFlash = 1.5;
    syncHud();
  }
}

// ── kreslenie ───────────────────────────────────────────────────────────
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#05040a';
  ctx.fillRect(0, 0, W, H);

  for (const n of blobs) {
    n.t += 0.0004;
    const cx = n.cx * W + Math.sin(n.t * 6.283 * n.sp * 10) * 40;
    const cy = n.cy * H + Math.cos(n.t * 6.283 * n.sp * 7) * 30;
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, n.r * SCL);
    g.addColorStop(0, 'rgba(' + n.rgb + ',0.10)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }
  for (const layer of stars) {
    for (const s of layer) {
      const sx = ((s.x * W - ship.x * 0.02 * s.depth) % W + W) % W;
      const sy = ((s.y * H - ship.y * 0.02 * s.depth) % H + H) % H;
      ctx.globalAlpha = 0.35 + 0.35 * Math.sin(tSec * 1.8 + s.ph);
      ctx.fillStyle = '#fff';
      ctx.fillRect(sx, sy, s.r * SCL, s.r * SCL);
    }
  }
  ctx.globalAlpha = 1;

  ctx.save();
  if (shake > 0.02) {
    const s = shake * shake * 14 * SCL;
    ctx.translate(rnd(-s, s), rnd(-s, s));
  }

  // kamene
  for (const a of rocks) {
    const [cr, cg, cb] = a.c;
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(a.a);
    ctx.beginPath();
    a.pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    ctx.closePath();
    const g = ctx.createLinearGradient(-a.r, -a.r, a.r, a.r);
    g.addColorStop(0, 'rgba(' + cr + ',' + cg + ',' + cb + ',0.30)');
    g.addColorStop(1, 'rgba(' + cr + ',' + cg + ',' + cb + ',0.08)');
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = 'rgba(' + cr + ',' + cg + ',' + cb + ',0.9)';
    ctx.lineWidth = 1.6 * SCL;
    ctx.shadowColor = 'rgba(' + cr + ',' + cg + ',' + cb + ',0.6)';
    ctx.shadowBlur = 12 * SCL;
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    for (const c of a.craters) { ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, 6.2832); ctx.fill(); }
    ctx.restore();
  }

  // strely
  for (const b of shots) {
    ctx.strokeStyle = 'rgba(255,209,102,0.5)';
    ctx.lineWidth = 2 * SCL;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x - b.vx * 0.02, b.y - b.vy * 0.02);
    ctx.stroke();
    ctx.fillStyle = '#ffd166';
    ctx.shadowColor = '#ffd166';
    ctx.shadowBlur = 10 * SCL;
    ctx.beginPath();
    ctx.arc(b.x, b.y, 2.6 * SCL, 0, 6.2832);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // lod
  if (invuln === 0 || Math.floor(invuln * 12) % 2 === 0) {
    ctx.save();
    ctx.translate(ship.x, ship.y);
    ctx.rotate(ship.a);
    ctx.scale(SCL, SCL);
    if (keys.thrust && state === ST.PLAY) {
      const f = rnd(0.7, 1);
      ctx.fillStyle = 'rgba(255,159,67,' + (0.85 * f) + ')';
      ctx.beginPath(); ctx.moveTo(-6, 3.5); ctx.lineTo(-10 - 10 * f, 0); ctx.lineTo(-6, -3.5); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,220,140,' + (0.9 * f) + ')';
      ctx.beginPath(); ctx.moveTo(-6, 1.6); ctx.lineTo(-8 - 6 * f, 0); ctx.lineTo(-6, -1.6); ctx.closePath(); ctx.fill();
    }
    ctx.strokeStyle = invuln > 0 ? '#4dd2ff' : '#fff';
    ctx.lineWidth = 2;
    ctx.shadowColor = invuln > 0 ? 'rgba(77,210,255,0.7)' : 'rgba(255,255,255,0.5)';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.moveTo(15, 0); ctx.lineTo(-9, 8); ctx.lineTo(-4, 0); ctx.lineTo(-9, -8); ctx.closePath();
    ctx.fillStyle = 'rgba(240,238,255,0.08)';
    ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(77,210,255,0.55)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(4, 0); ctx.lineTo(-4, 3.5); ctx.lineTo(-4, -3.5); ctx.closePath(); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  for (const p of parts) {
    const k = clamp(p.life / p.max, 0, 1);
    ctx.globalAlpha = k;
    if (p.ring) {
      ctx.strokeStyle = 'rgba(255,255,255,' + (k * 0.7) + ')';
      ctx.lineWidth = 2 * SCL;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r0 * (1 + (1 - k) * 2.4), 0, 6.2832);
      ctx.stroke();
    } else {
      ctx.fillStyle = 'rgb(' + p.rgb + ')';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.sz, 0, 6.2832);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  ctx.restore();   // shake

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const p of pops) {
    ctx.globalAlpha = clamp(p.life / 0.75, 0, 1);
    ctx.font = '700 ' + Math.round(14 * SCL) + "px 'DM Sans',sans-serif";
    ctx.fillStyle = 'rgb(' + p.rgb + ')';
    ctx.fillText(p.txt, p.x, p.y);
  }
  ctx.globalAlpha = 1;

  if (waveFlash > 0) {
    ctx.globalAlpha = clamp(Math.min(waveFlash / 0.4, (1.5 - waveFlash) / 0.25), 0, 1);
    ctx.font = '800 ' + Math.round(30 * SCL) + "px 'Syne',sans-serif";
    ctx.fillStyle = 'rgba(240,238,255,0.92)';
    ctx.shadowColor = 'rgba(143,125,255,0.6)';
    ctx.shadowBlur = 20;
    ctx.fillText(t('uiWave') + ' ' + wave, W / 2, H / 2 - 60 * SCL);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }
  if (state === ST.COUNT) {
    const n = Math.ceil(cdLeft);
    const fr2 = 1 - (cdLeft - Math.floor(cdLeft));
    ctx.globalAlpha = clamp(1.15 - fr2, 0.15, 1);
    ctx.font = '800 ' + Math.round((70 + fr2 * 26) * SCL) + "px 'Syne',sans-serif";
    ctx.fillStyle = '#f0eeff';
    ctx.shadowColor = 'rgba(143,125,255,0.75)';
    ctx.shadowBlur = 26;
    ctx.fillText(String(n), W / 2, H / 2);
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  } else if (goFlash > 0) {
    ctx.globalAlpha = clamp(goFlash / 0.5, 0, 1);
    ctx.font = '800 ' + Math.round(52 * SCL) + "px 'Syne',sans-serif";
    ctx.fillStyle = '#4dd2ff';
    ctx.shadowColor = 'rgba(77,210,255,0.7)';
    ctx.shadowBlur = 26;
    ctx.fillText(t('uiGo'), W / 2, H / 2);
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }
  if (state === ST.PAUSE) {
    ctx.fillStyle = 'rgba(4,2,8,0.62)';
    ctx.fillRect(0, 0, W, H);
    ctx.font = '800 ' + Math.round(34 * SCL) + "px 'Syne',sans-serif";
    ctx.fillStyle = '#f0eeff';
    ctx.fillText(t('uiPaused'), W / 2, H / 2);
  }
}

function frame(ts) {
  requestAnimationFrame(frame);
  const dt = tPrev ? Math.min(0.05, (ts - tPrev) / 1000) : 0;
  tPrev = ts;
  update(dt);
  draw();
}

// ── vstup ───────────────────────────────────────────────────────────────
const KEYMAP = {
  ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right',
  ArrowUp:'thrust', KeyW:'thrust',
  Space:'fire', KeyF:'fire', ControlLeft:'fire', ControlRight:'fire',
};
document.addEventListener('keydown', e => {
  if (e.code === 'Escape' || e.code === 'KeyP') {
    e.preventDefault();
    if (state === ST.PLAY || state === ST.PAUSE) togglePause();
    return;
  }
  if (state === ST.PAUSE) { cdLeft = 1.2; state = ST.COUNT; return; }
  if ((state === ST.MENU || state === ST.OVER) && (e.code === 'Enter' || e.code === 'Space')) {
    e.preventDefault(); beginRound(); return;
  }
  const k = KEYMAP[e.code];
  if (!k) return;                       // ostatne klavesy nechavam prehliadacu
  e.preventDefault();
  keys[k] = true;
  if (k === 'fire') fire();
});
document.addEventListener('keyup', e => {
  const k = KEYMAP[e.code];
  if (k) keys[k] = false;
});
function bindBtn(id, k) {
  const el = document.getElementById(id);
  const on = e => { e.preventDefault(); el.classList.add('on'); keys[k] = true; if (k === 'fire') fire(); };
  const off = e => { if (e) e.preventDefault(); el.classList.remove('on'); keys[k] = false; };
  el.addEventListener('pointerdown', on, {passive: false});
  el.addEventListener('pointerup', off);
  el.addEventListener('pointerleave', off);
  el.addEventListener('pointercancel', off);
}
bindBtn('btn-left', 'left');
bindBtn('btn-right', 'right');
bindBtn('btn-thrust', 'thrust');
bindBtn('btn-fire', 'fire');
cv.addEventListener('pointerdown', () => { if (state === ST.PAUSE) { cdLeft = 1.2; state = ST.COUNT; } });
document.getElementById('pause-btn').addEventListener('click', togglePause);
window.addEventListener('blur', () => { if (state === ST.PLAY) state = ST.PAUSE; for (const k in keys) keys[k] = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === ST.PLAY) state = ST.PAUSE; });

// ── obtiaznost ──────────────────────────────────────────────────────────
const row = document.getElementById('diff-row');
DIFFS.forEach((d, i) => {
  const b = document.createElement('button');
  b.textContent = t(d.key);
  b.className = i === diffIdx ? 'active' : '';
  b.addEventListener('click', () => {
    diffIdx = i;
    [...row.children].forEach((c, j) => c.className = j === i ? 'active' : '');
    loadBest();
    if (state === ST.OVER) document.getElementById('res-note').textContent = t('uiBest') + ' ' + best;
  });
  row.appendChild(b);
});
document.getElementById('ov-play').addEventListener('click', beginRound);

applyLang();
if (isTouch) document.body.classList.add('touch');
resize();
loadBest();
ship = {x: W / 2, y: H / 2, a: -Math.PI / 2, vx: 0, vy: 0};
showCard('menu');
requestAnimationFrame(frame);
</script>
