<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sky Shield · GamePad</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<script src="../../i18n.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#04070f;--text:#eaf2ff;--muted:rgba(234,242,255,0.42);--dim:rgba(234,242,255,0.18);
  --border:rgba(255,255,255,0.09);--border-h:rgba(255,255,255,0.18);
  --c:#38bdf8;--c2:#4ade80;--gold:#fbbf24;--danger:#ff5d6d;
}
html,body{background:var(--bg);height:100%;font-family:'DM Sans',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;user-select:none;overflow:hidden;touch-action:none;-webkit-tap-highlight-color:transparent;}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;}
button,a{touch-action:manipulation;font-family:'DM Sans',sans-serif;}

#back-btn{position:fixed;top:14px;left:14px;z-index:60;display:flex;align-items:center;gap:7px;background:rgba(7,11,20,0.72);backdrop-filter:blur(8px);border:1px solid var(--border);color:var(--muted);padding:7px 14px;border-radius:100px;text-decoration:none;font-size:12px;font-weight:500;transition:border-color .18s,color .18s;}
#back-btn:hover,#back-btn:active{border-color:var(--border-h);color:var(--text);}
@media(max-width:520px){#back-btn{top:9px;left:9px;padding:6px 11px;font-size:11px;}}

#hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:12;display:none;align-items:center;gap:7px;pointer-events:none;}
#hud.show{display:flex;}
.pill{display:flex;align-items:center;gap:8px;padding:5px 12px;border-radius:100px;background:rgba(7,11,20,0.6);backdrop-filter:blur(8px);border:1px solid var(--border);font-size:9px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;color:var(--dim);white-space:nowrap;}
.pill b{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;letter-spacing:0;font-variant-numeric:tabular-nums;color:var(--c);transition:transform .18s;}
.pill.wave b{color:var(--gold);}
.pill.best b{color:rgba(234,242,255,.72);}
.pill.best.record{border-color:rgba(56,189,248,.45);}
.pill b.bump{transform:scale(1.3);}
.homes{display:flex;gap:4px;}
.home{width:9px;height:9px;background:var(--c2);clip-path:polygon(50% 0,100% 45%,100% 100%,0 100%,0 45%);box-shadow:0 0 8px rgba(74,222,128,.9);}
.home.gone{background:rgba(255,255,255,0.14);box-shadow:none;}
@media(max-width:620px){#hud{left:auto;right:56px;transform:none;gap:5px;}.pill span{display:none;}.pill{padding:4px 10px;}.pill b{font-size:15px;}.pill.best{display:none;}}

#pause-btn{position:fixed;top:14px;right:14px;z-index:60;display:none;align-items:center;justify-content:center;width:36px;height:36px;background:rgba(7,11,20,0.7);backdrop-filter:blur(8px);border:1px solid var(--border);color:var(--muted);border-radius:50%;cursor:pointer;}
#pause-btn.show{display:flex;}
#pause-btn:hover{border-color:var(--border-h);color:var(--text);}

#overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(ellipse at center,rgba(7,11,20,0.8) 0%,rgba(3,5,10,0.95) 78%);backdrop-filter:blur(6px);}
#overlay.hide{display:none;}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:11px;width:100%;max-width:334px;padding:26px 24px 24px;border-radius:24px;background:linear-gradient(165deg,rgba(255,255,255,0.06),rgba(255,255,255,0.015));border:1px solid var(--border-h);box-shadow:0 30px 70px -28px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.07);animation:pop .34s cubic-bezier(.2,1.4,.4,1);}
@keyframes pop{from{transform:scale(.9) translateY(8px);opacity:0;}to{transform:none;opacity:1;}}
.card::before{content:'';position:absolute;inset:-1px;border-radius:24px;padding:1px;background:linear-gradient(120deg,rgba(56,189,248,.5),transparent 42%,transparent 58%,rgba(74,222,128,.5));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;}
.emoji{font-size:34px;line-height:1;filter:drop-shadow(0 6px 16px rgba(56,189,248,.4));}
.ttl{font-family:'Syne',sans-serif;font-weight:800;font-size:24px;letter-spacing:-.5px;text-align:center;background:linear-gradient(110deg,var(--c) 5%,#fff 52%,var(--c2) 95%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
#result{display:none;flex-direction:column;align-items:center;gap:1px;}
#result.show{display:flex;}
#res-lbl{font-size:9px;letter-spacing:2.2px;text-transform:uppercase;color:var(--dim);}
#res-score{font-family:'Syne',sans-serif;font-weight:800;font-size:50px;line-height:1.05;letter-spacing:-2px;color:var(--c);text-shadow:0 0 30px rgba(56,189,248,.45);}
#res-note{font-size:11.5px;font-weight:600;color:var(--muted);}
#res-note.record{color:var(--gold);}
#ov-stats{display:none;width:100%;grid-template-columns:1fr 1fr;gap:7px;}
#ov-stats.show{display:grid;}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:14px;background:rgba(255,255,255,0.04);border:1px solid var(--border);}
.stat i{font-size:8px;font-style:normal;letter-spacing:1.3px;text-transform:uppercase;color:var(--dim);text-align:center;}
.stat b{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;color:var(--c2);white-space:nowrap;}
.seg{display:flex;gap:3px;background:rgba(255,255,255,0.04);border:1px solid var(--border);padding:3px;border-radius:100px;}
.seg button{background:transparent;border:none;color:var(--muted);padding:6px 15px;border-radius:100px;font-size:11.5px;font-weight:600;cursor:pointer;transition:color .16s,background .16s;}
.seg button:hover{color:var(--text);}
.seg button.active{background:rgba(56,189,248,0.16);color:#c9ecff;box-shadow:inset 0 0 0 1px rgba(56,189,248,0.42);}
.lbl{font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);}
.hint{font-size:11.5px;line-height:1.55;color:var(--muted);text-align:center;}
.play-btn{margin-top:3px;width:100%;padding:13px 30px;border-radius:100px;border:1px solid rgba(56,189,248,.5);background:linear-gradient(180deg,rgba(56,189,248,.24),rgba(56,189,248,.1));color:#d5f0ff;font-size:14px;font-weight:600;cursor:pointer;transition:all .18s;}
.play-btn:hover{background:linear-gradient(180deg,rgba(56,189,248,.34),rgba(56,189,248,.16));color:#fff;box-shadow:0 0 24px -6px rgba(56,189,248,.5);}
.play-btn:active{transform:translateY(1px);}
@media(max-height:640px){.card{gap:8px;padding:18px 20px;}.emoji{display:none;}.ttl{font-size:20px;}#res-score{font-size:38px;}}
@media (max-height:820px){#overlay{align-items:flex-start !important;overflow-y:auto !important;}}
</style>
</head>
<body>
<a href="../../index.html" id="back-btn">
  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
  <span id="lbl-back"></span>
</a>

<canvas id="c"></canvas>

<div id="hud">
  <div class="pill"><span id="lbl-score"></span><b id="hud-score">0</b></div>
  <div class="pill wave"><span id="lbl-wave"></span><b id="hud-wave">1</b></div>
  <div class="pill"><div class="homes" id="homes"></div></div>
  <div class="pill best" id="best-pill"><span id="lbl-best"></span><b id="hud-best">0</b></div>
</div>

<button id="pause-btn" aria-label="pause">
  <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1.4"/><rect x="14" y="4" width="4" height="16" rx="1.4"/></svg>
</button>

<div id="overlay">
  <div class="card">
    <div id="brand"><div class="emoji">🛡️</div></div>
    <div class="ttl" id="ov-title"></div>
    <div id="result">
      <div id="res-lbl"></div>
      <div id="res-score">0</div>
      <div id="res-note"></div>
    </div>
    <div id="ov-stats">
      <div class="stat"><i id="lbl-s-wave"></i><b id="st-wave">1</b></div>
      <div class="stat"><i id="lbl-s-best"></i><b id="st-best">0</b></div>
    </div>
    <div class="lbl" id="lbl-diff"></div>
    <div class="seg" id="diff-row"></div>
    <div class="hint" id="ov-hint"></div>
    <button class="play-btn" id="ov-play"></button>
  </div>
</div>

<script>
// ── nastavenia (px/s pri mierke 1, 600 px vysoke pole) ──────────────────
const DIFFS = [
  {key:'diffEasy',   spd:26, per:5, gap:1.5, salvo:3, reload:0.15},
  {key:'diffMedium', spd:36, per:7, gap:1.1, salvo:2, reload:0.15},
  {key:'diffHard',   spd:48, per:9, gap:0.8, salvo:2, reload:0.15},
];
let diffIdx = 1;
const bestKey = () => 'skyshield_best_' + diffIdx;
let best = 0;
// vlastne bodovanie
const PTS_HIT = 18, PTS_HIT_WAVE = 6, PTS_CITY = 120;
const SHOT_V = 300, BLAST_R = 34, BLAST_T = 0.7;

const ST = {MENU:0, COUNT:1, PLAY:2, PAUSE:3, OVER:4, BREAK:5};
let state = ST.MENU;

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, SCL = 1;
let FX = 0, FY = 0, FW = 0, FH = 0, GROUND = 0;    // pole

let cities = [], incoming = [], shots = [], blasts = [], parts = [];
let score = 0, wave = 1, toLaunch = 0, spawnGap = 0, reload = 0;
let cdLeft = 0, breakT = 0, banner = 0, bannerTxt = '', bannerRgb = '251,191,36';
let shake = 0, tPrev = 0, tSec = 0;
const isTouch = window.matchMedia('(pointer: coarse)').matches;

function applyLang() {
  document.getElementById('lbl-back').textContent  = t('back');
  document.getElementById('lbl-score').textContent = t('uiScore');
  document.getElementById('lbl-wave').textContent  = t('uiWave');
  document.getElementById('lbl-best').textContent  = t('uiBest');
  document.getElementById('lbl-s-wave').textContent = t('uiWave');
  document.getElementById('lbl-s-best').textContent = t('uiBest');
  document.getElementById('res-lbl').textContent   = t('uiScore');
  document.getElementById('lbl-diff').textContent  = t('uiDifficulty');
}
function rnd(a, b) { return a + Math.random() * (b - a); }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
const D = () => DIFFS[diffIdx];

// ── rozmery ─────────────────────────────────────────────────────────────
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth || 360;
  H = window.innerHeight || 640;
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const top = (W < 620 ? 58 : 52) + 20;
  FX = 0; FY = top;
  FW = W; FH = Math.max(220, H - top - 12);
  GROUND = FY + FH - Math.round(FH * 0.09);
  SCL = FH / 600;
}
window.addEventListener('resize', () => { resize(); layoutCities(); });
window.addEventListener('orientationchange', () => setTimeout(() => { resize(); layoutCities(); }, 250));

function layoutCities() {
  const slots = [0.09, 0.21, 0.33, 0.67, 0.79, 0.91];
  if (!cities.length) cities = slots.map(() => ({alive: true}));
  cities.forEach((c, i) => { c.x = FX + FW * slots[i]; });
}
const battery = () => ({x: FX + FW / 2, y: GROUND - 8 * SCL});
const liveCities = () => cities.filter(c => c.alive).length;

// ── kolo ────────────────────────────────────────────────────────────────
function loadBest() {
  best = +(localStorage.getItem(bestKey()) || 0);
  setHud('hud-best', best);
  document.getElementById('best-pill').classList.remove('record');
}
function beginRound() {
  resize();
  cities = [0.09, 0.21, 0.33, 0.67, 0.79, 0.91].map(() => ({alive: true}));
  layoutCities();
  incoming = []; shots = []; blasts = []; parts = [];
  score = 0; wave = 1; reload = 0; shake = 0;
  cdLeft = 2.0;
  state = ST.COUNT;
  startWave();
  document.getElementById('overlay').classList.add('hide');
  document.getElementById('hud').classList.add('show');
  document.getElementById('pause-btn').classList.add('show');
  loadBest();
  syncHud(true);
}
function startWave() {
  const d = D();
  toLaunch = d.per + Math.floor((wave - 1) * 1.7);
  spawnGap = 0;
  breakT = 1.4;
  banner = 1.4;
  bannerTxt = t('skyWaveStart', {n: wave});
  bannerRgb = '251,191,36';
}
function launch() {
  const d = D();
  const targets = cities.filter(c => c.alive).map(c => c.x).concat([FX + FW / 2]);
  const tx = targets[Math.floor(Math.random() * targets.length)];
  const sx = FX + 20 * SCL + Math.random() * (FW - 40 * SCL);
  const sp = d.spd * (1 + (wave - 1) * 0.06) * SCL;
  const dx = tx - sx, dy = GROUND - FY;
  const len = Math.hypot(dx, dy);
  incoming.push({x: sx, y: FY, vx: dx / len * sp, vy: dy / len * sp, tx, trail: [[sx, FY]]});
}
function fire(x, y) {
  if (state !== ST.PLAY || reload > 0) return;
  if (y > GROUND - 8 * SCL) return;
  const b = battery();
  const dx = x - b.x, dy = y - b.y;
  const len = Math.hypot(dx, dy) || 1;
  shots.push({x: b.x, y: b.y, vx: dx / len * SHOT_V * SCL, vy: dy / len * SHOT_V * SCL, tx: x, ty: y, trail: [[b.x, b.y]]});
  reload = D().reload;
}
function boom(x, y, big) {
  blasts.push({x, y, t: 0, max: BLAST_T, r: BLAST_R * SCL * (big ? 1.25 : 1)});
  shake = Math.min(1, shake + (big ? 0.4 : 0.16));
}
function spark(x, y, rgb, n) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, 6.2832), s = rnd(40, 180) * SCL;
    parts.push({x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(0.25, 0.6), max: 0.6, rgb});
  }
}
function endRound() {
  state = ST.OVER;
  const rec = score > best;
  if (rec) { best = score; try { localStorage.setItem(bestKey(), best); } catch (e) {} }
  document.getElementById('res-score').textContent = score;
  const note = document.getElementById('res-note');
  note.textContent = rec ? t('uiNewRecord') : t('uiBest') + ' ' + best;
  note.classList.toggle('record', rec);
  document.getElementById('st-wave').textContent = wave;
  document.getElementById('st-best').textContent = best;
  setHud('hud-best', best);
  document.getElementById('best-pill').classList.toggle('record', rec);
  showCard('over');
}
function showCard(mode) {
  document.getElementById('ov-title').textContent = mode === 'over' ? t('uiGameOver') : t('skyTitle');
  document.getElementById('brand').style.display = mode === 'over' ? 'none' : '';
  document.getElementById('result').classList.toggle('show', mode === 'over');
  document.getElementById('ov-stats').classList.toggle('show', mode === 'over');
  document.getElementById('ov-hint').textContent = t('skyRules');
  document.getElementById('ov-play').textContent = mode === 'over' ? t('uiPlayAgain') : t('uiStart');
  document.getElementById('overlay').classList.remove('hide');
  document.getElementById('hud').classList.remove('show');
  document.getElementById('pause-btn').classList.remove('show');
}
function togglePause() {
  if (state === ST.PLAY) state = ST.PAUSE;
  else if (state === ST.PAUSE) { cdLeft = 1.2; state = ST.COUNT; }
}

// ── HUD ─────────────────────────────────────────────────────────────────
const hudVal = {};
function setHud(id, v) {
  if (hudVal[id] === v) return;
  hudVal[id] = v;
  const el = document.getElementById(id);
  el.textContent = v;
  el.classList.remove('bump');
  void el.offsetWidth;
  el.classList.add('bump');
  setTimeout(() => el.classList.remove('bump'), 180);
}
function syncHud(force) {
  setHud('hud-score', score);
  setHud('hud-wave', wave);
  const box = document.getElementById('homes');
  if (box.children.length !== cities.length) {
    box.textContent = '';
    for (let i = 0; i < cities.length; i++) { const d = document.createElement('div'); d.className = 'home'; box.appendChild(d); }
  }
  [...box.children].forEach((d, i) => d.classList.toggle('gone', !cities[i].alive));
  if (force) setHud('hud-best', best);
}

// ── update ──────────────────────────────────────────────────────────────
function update(dt) {
  tSec += dt;
  for (const p of parts) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  if (parts.length) parts = parts.filter(p => p.life > 0);
  if (shake > 0) shake = Math.max(0, shake - dt * 3);
  if (banner > 0) banner = Math.max(0, banner - dt);
  if (reload > 0) reload = Math.max(0, reload - dt);

  if (state === ST.COUNT) {
    cdLeft -= dt;
    if (cdLeft <= 0) state = ST.PLAY;
    return;
  }
  if (state !== ST.PLAY) return;

  const d = D();
  // vypustanie rakiet
  if (breakT > 0) breakT -= dt;
  else if (toLaunch > 0) {
    spawnGap -= dt;
    if (spawnGap <= 0) {
      const n = Math.min(toLaunch, d.salvo);
      for (let i = 0; i < n; i++) { launch(); toLaunch--; }
      spawnGap = Math.max(0.3, d.gap - wave * 0.05);
    }
  }

  // vlastne strely
  for (const s of shots) {
    s.x += s.vx * dt; s.y += s.vy * dt;
    s.trail.push([s.x, s.y]);
    if (s.trail.length > 46) s.trail.shift();
    if (Math.hypot(s.x - s.tx, s.y - s.ty) < 8 * SCL) { boom(s.x, s.y); s.done = true; }
    if (s.y < FY) { boom(s.x, Math.max(FY + 4, s.y)); s.done = true; }
  }
  shots = shots.filter(s => !s.done);

  // prichadzajuce rakety
  for (const m of incoming) {
    m.x += m.vx * dt; m.y += m.vy * dt;
    m.trail.push([m.x, m.y]);
    if (m.trail.length > 90) m.trail.shift();
    if (m.y >= GROUND) {
      m.done = true;
      boom(m.x, GROUND, true);
      spark(m.x, GROUND, '255,93,109', 14);
      // zasah mesta
      for (const c of cities) {
        if (c.alive && Math.abs(c.x - m.x) < 26 * SCL) { c.alive = false; spark(c.x, GROUND - 8 * SCL, '74,222,128', 16); }
      }
      syncHud();
      if (!liveCities()) { endRound(); return; }
    }
  }
  incoming = incoming.filter(m => !m.done);

  // vybuchy nicia rakety
  for (const b of blasts) {
    b.t += dt;
    const r = b.r * Math.sin(Math.min(1, b.t / b.max) * Math.PI);
    for (const m of incoming) {
      if (m.done) continue;
      if (Math.hypot(m.x - b.x, m.y - b.y) < r) {
        m.done = true;
        score += PTS_HIT + PTS_HIT_WAVE * wave;
        spark(m.x, m.y, '251,191,36', 8);
        boom(m.x, m.y);
        syncHud();
      }
    }
  }
  blasts = blasts.filter(b => b.t < b.max);
  incoming = incoming.filter(m => !m.done);

  // konec vlny
  if (!toLaunch && !incoming.length && breakT <= 0 && state === ST.PLAY) {
    const bonus = PTS_CITY * liveCities();
    score += bonus;
    banner = 1.6;
    bannerTxt = t('skyCities') + ' +' + bonus;
    bannerRgb = '74,222,128';
    syncHud();
    wave++;
    startWave();
  }
}

// ── kreslenie ───────────────────────────────────────────────────────────
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const sky = ctx.createLinearGradient(0, FY, 0, GROUND);
  sky.addColorStop(0, '#0a1430');
  sky.addColorStop(0.6, '#070d1e');
  sky.addColorStop(1, '#0b1020');
  ctx.fillStyle = '#04070f';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = sky;
  ctx.fillRect(FX, FY, FW, GROUND - FY);

  // hviezdy
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  for (let i = 0; i < 60; i++) {
    const x = ((i * 7919) % 1000) / 1000 * FW;
    const y = FY + ((i * 6151) % 1000) / 1000 * (GROUND - FY) * 0.7;
    const tw = 0.4 + 0.4 * Math.sin(tSec * 1.5 + i);
    ctx.globalAlpha = tw * 0.6;
    ctx.fillRect(x, y, 1.6 * SCL, 1.6 * SCL);
  }
  ctx.globalAlpha = 1;

  ctx.save();
  if (shake > 0.02) {
    const s = shake * shake * 9 * SCL;
    ctx.translate(rnd(-s, s), rnd(-s, s));
  }

  // zem
  const gg = ctx.createLinearGradient(0, GROUND, 0, FY + FH);
  gg.addColorStop(0, '#1c3a2a');
  gg.addColorStop(1, '#0a1a12');
  ctx.fillStyle = gg;
  ctx.fillRect(FX, GROUND, FW, FY + FH - GROUND);
  ctx.strokeStyle = 'rgba(74,222,128,0.5)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(FX, GROUND); ctx.lineTo(FX + FW, GROUND);
  ctx.stroke();

  // mesta
  for (const c of cities) {
    const w = 30 * SCL, h = 22 * SCL;
    if (c.alive) {
      ctx.fillStyle = '#4ade80';
      ctx.shadowColor = 'rgba(74,222,128,0.7)';
      ctx.shadowBlur = 12 * SCL;
      ctx.beginPath();
      ctx.moveTo(c.x - w / 2, GROUND);
      ctx.lineTo(c.x - w / 2, GROUND - h * 0.55);
      ctx.lineTo(c.x - w * 0.22, GROUND - h * 0.55);
      ctx.lineTo(c.x - w * 0.22, GROUND - h);
      ctx.lineTo(c.x + w * 0.16, GROUND - h);
      ctx.lineTo(c.x + w * 0.16, GROUND - h * 0.62);
      ctx.lineTo(c.x + w / 2, GROUND - h * 0.62);
      ctx.lineTo(c.x + w / 2, GROUND);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(8,20,14,0.6)';
      for (let i = 0; i < 3; i++) ctx.fillRect(c.x - w * 0.36 + i * w * 0.26, GROUND - h * 0.42, w * 0.12, h * 0.2);
    } else {
      ctx.fillStyle = 'rgba(120,130,140,0.35)';
      ctx.beginPath();
      ctx.moveTo(c.x - w / 2, GROUND);
      ctx.lineTo(c.x - w * 0.3, GROUND - h * 0.28);
      ctx.lineTo(c.x + w * 0.1, GROUND - h * 0.16);
      ctx.lineTo(c.x + w / 2, GROUND);
      ctx.closePath();
      ctx.fill();
    }
  }

  // baterka
  const b = battery();
  ctx.fillStyle = '#38bdf8';
  ctx.shadowColor = 'rgba(56,189,248,0.8)';
  ctx.shadowBlur = 14 * SCL;
  ctx.beginPath();
  ctx.moveTo(b.x - 16 * SCL, GROUND);
  ctx.lineTo(b.x - 9 * SCL, GROUND - 14 * SCL);
  ctx.lineTo(b.x + 9 * SCL, GROUND - 14 * SCL);
  ctx.lineTo(b.x + 16 * SCL, GROUND);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = reload > 0 ? 'rgba(255,255,255,0.25)' : '#eaf2ff';
  ctx.lineWidth = 3 * SCL;
  ctx.beginPath();
  ctx.moveTo(b.x, GROUND - 12 * SCL);
  ctx.lineTo(b.x, GROUND - 24 * SCL);
  ctx.stroke();

  // stopy prichadzajucich rakiet
  for (const m of incoming) {
    ctx.strokeStyle = 'rgba(255,93,109,0.55)';
    ctx.lineWidth = 1.6 * SCL;
    ctx.beginPath();
    m.trail.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
    ctx.stroke();
    ctx.fillStyle = '#ff5d6d';
    ctx.shadowColor = '#ff5d6d';
    ctx.shadowBlur = 10 * SCL;
    ctx.beginPath();
    ctx.arc(m.x, m.y, 3.2 * SCL, 0, 6.2832);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // vlastne strely
  for (const s of shots) {
    ctx.strokeStyle = 'rgba(56,189,248,0.75)';
    ctx.lineWidth = 1.8 * SCL;
    ctx.beginPath();
    s.trail.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
    ctx.stroke();
    ctx.fillStyle = '#eaf2ff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, 2.4 * SCL, 0, 6.2832);
    ctx.fill();
    // znacka cieloveho bodu
    ctx.strokeStyle = 'rgba(56,189,248,0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(s.tx, s.ty, 5 * SCL, 0, 6.2832);
    ctx.stroke();
  }

  // vybuchy
  for (const bl of blasts) {
    const k = Math.min(1, bl.t / bl.max);
    const r = bl.r * Math.sin(k * Math.PI);
    const g2 = ctx.createRadialGradient(bl.x, bl.y, 0, bl.x, bl.y, Math.max(1, r));
    g2.addColorStop(0, 'rgba(255,255,255,' + (0.9 * (1 - k)) + ')');
    g2.addColorStop(0.5, 'rgba(251,191,36,' + (0.7 * (1 - k)) + ')');
    g2.addColorStop(1, 'rgba(255,93,109,0)');
    ctx.fillStyle = g2;
    ctx.beginPath();
    ctx.arc(bl.x, bl.y, Math.max(1, r), 0, 6.2832);
    ctx.fill();
  }

  for (const p of parts) {
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = 'rgb(' + p.rgb + ')';
    ctx.fillRect(p.x, p.y, 2.6 * SCL, 2.6 * SCL);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if (banner > 0) {
    ctx.globalAlpha = clamp(Math.min(banner / 0.3, 1), 0, 1);
    ctx.font = '800 ' + Math.round(24 * SCL) + "px 'Syne',sans-serif";
    ctx.fillStyle = 'rgb(' + bannerRgb + ')';
    ctx.shadowColor = 'rgba(0,0,0,0.7)';
    ctx.shadowBlur = 12;
    ctx.fillText(bannerTxt, W / 2, FY + 40 * SCL);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }
  if (state === ST.COUNT) {
    const n = Math.ceil(cdLeft);
    const fr = 1 - (cdLeft - Math.floor(cdLeft));
    ctx.globalAlpha = clamp(1.15 - fr, 0.15, 1);
    ctx.font = '800 ' + Math.round(Math.min(W, H) * 0.14) + "px 'Syne',sans-serif";
    ctx.fillStyle = '#eaf2ff';
    ctx.shadowColor = 'rgba(56,189,248,0.75)';
    ctx.shadowBlur = 26;
    ctx.fillText(String(n), W / 2, (FY + GROUND) / 2);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }
  if (state === ST.PAUSE) {
    ctx.fillStyle = 'rgba(3,5,10,0.62)';
    ctx.fillRect(0, 0, W, H);
    ctx.font = '800 ' + Math.round(Math.min(W, H) * 0.07) + "px 'Syne',sans-serif";
    ctx.fillStyle = '#eaf2ff';
    ctx.fillText(t('uiPaused'), W / 2, H / 2);
  }
}

function frame(ts) {
  requestAnimationFrame(frame);
  const dt = tPrev ? Math.min(0.033, (ts - tPrev) / 1000) : 0;
  tPrev = ts;
  update(dt);
  draw();
}

// ── vstup ───────────────────────────────────────────────────────────────
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (state === ST.PAUSE) { cdLeft = 1.2; state = ST.COUNT; return; }
  fire(e.clientX, e.clientY);
}, {passive: false});
document.addEventListener('keydown', e => {
  if (e.code === 'Escape' || e.code === 'KeyP') {
    e.preventDefault();
    if (state === ST.PLAY || state === ST.PAUSE) togglePause();
    return;
  }
  if ((state === ST.MENU || state === ST.OVER) && (e.code === 'Enter' || e.code === 'Space')) { e.preventDefault(); beginRound(); }
});
document.getElementById('pause-btn').addEventListener('click', togglePause);
window.addEventListener('blur', () => { if (state === ST.PLAY) state = ST.PAUSE; });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === ST.PLAY) state = ST.PAUSE; });

// ── obtiaznost ──────────────────────────────────────────────────────────
const row = document.getElementById('diff-row');
DIFFS.forEach((d, i) => {
  const b = document.createElement('button');
  b.textContent = t(d.key);
  b.className = i === diffIdx ? 'active' : '';
  b.addEventListener('click', () => {
    diffIdx = i;
    [...row.children].forEach((c, j) => c.className = j === i ? 'active' : '');
    loadBest();
    if (state === ST.OVER) document.getElementById('res-note').textContent = t('uiBest') + ' ' + best;
  });
  row.appendChild(b);
});
document.getElementById('ov-play').addEventListener('click', beginRound);

applyLang();
resize();
cities = [0.09, 0.21, 0.33, 0.67, 0.79, 0.91].map(() => ({alive: true}));
layoutCities();
loadBest();
showCard('menu');
requestAnimationFrame(frame);
</script>
</body>
