<style>

  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>

<div id="game-container">
    <div id="header">
        <h1>⚙️ <span id="lbl-title"></span></h1>
        <div id="settings">
            <label id="lbl-diff"></label>
            <div class="btn-group" id="diffGroup">
                <button data-diff="easy"   id="lbl-easy"></button>
                <button data-diff="medium" id="lbl-medium" class="active"></button>
                <button data-diff="hard"   id="lbl-hard"></button>

        </div>
    </div>

    <p id="rules"></p>

    <div id="info-panel">
        <div class="info-card"><h3 id="lbl-level"></h3><span class="value" id="levelValue">1</span></div>
        <div class="info-card"><h3 id="lbl-moves"></h3><span class="value" id="movesValue">0</span></div>
        <div class="info-card high-score"><h3 id="lbl-best"></h3><span class="value" id="bestValue">-</span></div>
    </div>

    <div id="canvas-wrapper">
        <canvas id="gameCanvas"></canvas>
    </div>

        <button id="newBtn"></button>
        <button id="resetBtn"></button>
    </div>

    <div id="win-overlay">
        <h2 id="lbl-win"></h2>
        <p id="winSub"></p>
        <p><span id="lbl-win-moves"></span> <span id="finalMoves">0</span></p>
        <div id="recordLine"></div>
        <button id="nextBtn"></button>
    </div>

<script>
(function () {
    "use strict";

    const canvas    = document.getElementById('gameCanvas');
    const ctx       = canvas.getContext('2d');
    const wrapEl    = document.getElementById('canvas-wrapper');
    const statusEl  = document.getElementById('status-line');
    const levelSpan = document.getElementById('levelValue');
    const movesSpan = document.getElementById('movesValue');
    const bestSpan  = document.getElementById('bestValue');
    const overlay   = document.getElementById('win-overlay');
    const recordEl  = document.getElementById('recordLine');
    const diffGroup = document.getElementById('diffGroup');

    // ── obtiaznost: kolko policok, kluciek a hviezd ─────────────────────
    const DIFFS = {
        easy:   { cols: 5, rows: 4, cells: 9,  cranks: 2, blobs: 1, maxWin: 0.34 },
        medium: { cols: 6, rows: 5, cells: 13, cranks: 3, blobs: 2, maxWin: 0.15 },
        hard:   { cols: 6, rows: 6, cells: 16, cranks: 4, blobs: 3, maxWin: 0.10 },
    };
    let diffKey = 'medium', D = DIFFS.medium;

    const CRANK_COLOURS = ['#6ee7ff', '#fbbf24', '#a3e635', '#f472b6'];
    const JAM = '#f87171';

    let gears = [];           // {col,row,kind,colour,need,dir,jam,comp,parity,angle}
    let comps = [];           // zoznam komponentov (polia indexov)
    let level = 1, moves = 0, solved = false, best = 0, par = 0;
    let cell = 60, originX = 0, originY = 0;

    // ── rekord: najmenej tahov na obtiaznost ────────────────────────────
    const bestKey = () => 'gearpuzzle_best_' + diffKey;
    function loadBest() {
        best = parseInt(localStorage.getItem(bestKey()) || '0', 10) || 0;
        bestSpan.textContent = best ? best : '-';
    }
    function saveBest(m) {
        if (!best || m < best) {
            best = m;
            try { localStorage.setItem(bestKey(), String(best)); } catch (e) {}
            bestSpan.textContent = best;
            return true;
        }
        return false;
    }

    // ── susedia su len ortogonalni: mriezka je sachovnica ───────────────
    const key = (c, r) => c + ',' + r;
    function neighbours(g) {
        const out = [];
        for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
            const i = gears.findIndex(o => o.col === g.col + dc && o.row === g.row + dr);
            if (i >= 0) out.push(i);
        }
        return out;
    }

    // ── stav stroja: kazdy pohon ma svoj smer, alebo sa zasekne ─────────
    // Kolesa v jednom pohone sa striedaju: parita policka urcuje smer.
    function solve(state) {
        // state: pole smerov kluciek (0 / 1 / -1) v poradi gears
        const n = gears.length;
        const dir = new Array(n).fill(0);
        const jam = new Array(n).fill(false);
        for (const comp of comps) {
            let root = 0, conflict = null;
            for (const i of comp) {
                const d = state[i] || 0;
                if (gears[i].kind !== 'crank' || d === 0) continue;
                const implied = gears[i].parity ? -d : d;      // smer kolesa na parite 0
                if (root === 0) root = implied;
                else if (root !== implied) { conflict = i; break; }
            }
            if (conflict !== null) {
                for (const i of comp) jam[i] = true;
                continue;
            }
            if (root === 0) continue;                           // pohon stoji
            for (const i of comp) dir[i] = gears[i].parity ? -root : root;
        }
        return { dir, jam };
    }

    function applyState() {
        const st = gears.map(g => g.kind === 'crank' ? g.set : 0);
        const { dir, jam } = solve(st);
        for (let i = 0; i < gears.length; i++) { gears[i].dir = dir[i]; gears[i].jam = jam[i]; }
        return { dir, jam };
    }

    // vyhra: kazda hviezda sa toci svojim smerom, ziadny zamok sa netoci,
    // a nic nie je zaseknute
    function solvedWith(dir, jam) {
        for (let i = 0; i < gears.length; i++) {
            if (jam[i]) return false;
            if (gears[i].kind === 'target' && dir[i] !== gears[i].need) return false;
            if (gears[i].kind === 'lock' && dir[i] !== 0) return false;
        }
        return true;
    }

    // ── generator ───────────────────────────────────────────────────────
    // Plocha je z niekolkych oddelenych pohonov. Kazdy ma bud hviezdu, alebo
    // zamok, takze kazda klucka ma prave jednu spravnu polohu a hlavolam sa da
    // dopocitat: parita policka urcuje smer, poziadavka hviezdy ho zafixuje.
    const DIRS4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];

    function freeCell(taken, c, r, d, own) {
        if (c < 0 || r < 0 || c >= d.cols || r >= d.rows) return false;
        if (taken.has(key(c, r))) return false;
        for (const [dc, dr] of DIRS4) {
            const o = taken.get(key(c + dc, r + dr));
            if (o !== undefined && o !== own) return false;   // nesmie sa dotykat ineho pohonu
        }
        return true;
    }

    // rozdelenie na oddelene pohony + parita policka (sachovnica)
    function components() {
        const seen = new Array(gears.length).fill(false);
        const out = [];
        for (let i = 0; i < gears.length; i++) {
            if (seen[i]) continue;
            const comp = [], q = [i];
            seen[i] = true;
            while (q.length) {
                const a = q.pop();
                comp.push(a);
                gears[a].parity = (gears[a].col + gears[a].row) % 2;
                for (const b of neighbours(gears[a])) {
                    if (seen[b]) continue;
                    seen[b] = true;
                    q.push(b);
                }
            }
            out.push(comp);
        }
        return out;
    }

    function grow(d) {
        const taken = new Map();
        const blobs = [];
        const sizes = [];
        let left = d.cells;
        for (let b = 0; b < d.blobs; b++) {
            const want = b === d.blobs - 1 ? left : Math.max(3, Math.round(d.cells / d.blobs));
            sizes.push(Math.min(want, left - (d.blobs - 1 - b) * 3));
            left -= sizes[b];
            if (sizes[b] < 3) return null;
        }
        for (let b = 0; b < d.blobs; b++) {
            let seed = null;
            for (let t = 0; t < 260 && !seed; t++) {
                const c = Math.floor(Math.random() * d.cols), r = Math.floor(Math.random() * d.rows);
                if (freeCell(taken, c, r, d, b)) seed = [c, r];
            }
            if (!seed) return null;
            const blob = [seed];
            taken.set(key(seed[0], seed[1]), b);
            let guard = 0;
            while (blob.length < sizes[b] && guard++ < 700) {
                const [bc, br] = blob[Math.floor(Math.random() * blob.length)];
                const [dc, dr] = DIRS4[Math.floor(Math.random() * 4)];
                const nc = bc + dc, nr = br + dr;
                if (!freeCell(taken, nc, nr, d, b)) continue;
                taken.set(key(nc, nr), b);
                blob.push([nc, nr]);
            }
            if (blob.length < 3) return null;
            blobs.push(blob);
        }
        return blobs;
    }

    function build(d) {
        const blobs = grow(d);
        if (!blobs) return false;
        gears = [];
        blobs.forEach(blob => blob.forEach(([c, r]) => gears.push({
            col: c, row: r, kind: 'idle', colour: null, need: 0,
            dir: 0, jam: false, set: 0, angle: Math.random() * Math.PI * 2,
            parity: (c + r) % 2,
        })));
        comps = components();
        if (comps.length !== d.blobs) return false;

        // klucky: kazdy pohon aspon jednu, zvysok nahodne
        const perComp = comps.map(() => []);
        let k = 0;
        for (let ci = 0; ci < comps.length && k < d.cranks; ci++) perComp[ci].push(k++);
        while (k < d.cranks) perComp[Math.floor(Math.random() * comps.length)].push(k++);

        for (let ci = 0; ci < comps.length; ci++) {
            const spots = comps[ci].slice().sort(() => Math.random() - 0.5);
            const used = [];
            for (let n = 0; n < perComp[ci].length; n++) {
                const spot = spots.find(i => gears[i].kind === 'idle' &&
                    !used.some(u => Math.abs(gears[u].col - gears[i].col)
                                  + Math.abs(gears[u].row - gears[i].row) < 2));
                if (spot === undefined) return false;
                used.push(spot);
                gears[spot].kind = 'crank';
                gears[spot].colour = CRANK_COLOURS[perComp[ci][n]];
            }
        }

        // kazdy pohon dostane hviezdu alebo zamok; aspon jedna hviezda musi byt
        const order = comps.map((c, i) => i).sort(() => Math.random() - 0.5);
        let stars = 0;
        for (let n = 0; n < order.length; n++) {
            const comp = comps[order[n]];
            const free = comp.filter(i => gears[i].kind === 'idle');
            if (!free.length) return false;
            const i = free[Math.floor(Math.random() * free.length)];
            const mustStar = n === 0 || stars === 0;
            if (mustStar || Math.random() < 0.5) {
                gears[i].kind = 'target';
                gears[i].need = Math.random() < 0.5 ? 1 : -1;
                stars++;
            } else {
                gears[i].kind = 'lock';
            }
        }
        return stars > 0;
    }

    // vsetky kombinacie kluciek: hra musi mat riesenie, nesmie vyjst nahodou
    // a zasek musi byt mozny, nech sa hrac s nim stretne
    function analyse(d) {
        const crankIdx = gears.map((g, i) => g.kind === 'crank' ? i : -1).filter(i => i >= 0);
        const total = Math.pow(3, crankIdx.length);
        let wins = 0, jams = 0, bestPar = Infinity;
        for (let m = 0; m < total; m++) {
            const st = new Array(gears.length).fill(0);
            let x = m, clicks = 0;
            for (const i of crankIdx) {
                const v = x % 3; x = Math.floor(x / 3);
                st[i] = v === 0 ? 0 : (v === 1 ? 1 : -1);
                clicks += v;                       // stop 0, ↻ 1 klik, ↺ 2 kliky
            }
            const { dir, jam } = solve(st);
            if (jam.some(Boolean)) jams++;
            let ok = true;
            for (let i = 0; i < gears.length; i++) {
                if (jam[i]) { ok = false; break; }
                if (gears[i].kind === 'target' && dir[i] !== gears[i].need) { ok = false; break; }
                if (gears[i].kind === 'lock' && dir[i] !== 0) { ok = false; break; }
            }
            if (ok) { wins++; if (clicks < bestPar) bestPar = clicks; }
        }
        return { total, wins, jams, par: bestPar };
    }

    // relax 0 = vsetky pravidla, 1 = zasek nemusi byt mozny, 2 = volnejsi podiel rieseni
    function generate(relax) {
        for (let attempt = 0; attempt < 500; attempt++) {
            if (!build(D)) continue;
            const a = analyse(D);
            if (a.wins === 0) continue;                             // musi mat riesenie
            if (a.wins / a.total > D.maxWin * (relax >= 2 ? 2 : 1)) continue;  // nesmie vyjst nahodou
            if (relax < 1 && a.jams === 0) continue;                // zasek musi byt mozny
            if (a.par < 2) continue;                                // aspon dva tahy
            par = a.par;
            return true;
        }
        return false;
    }

    // ── rozmery plochy ──────────────────────────────────────────────────
    function bounds() {
        let minC = 99, maxC = -99, minR = 99, maxR = -99;
        for (const g of gears) {
            minC = Math.min(minC, g.col); maxC = Math.max(maxC, g.col);
            minR = Math.min(minR, g.row); maxR = Math.max(maxR, g.row);
        }
        return { w: maxC - minC + 1, h: maxR - minR + 1, minC, minR };
    }

    let DPR = 1;
    function fitCanvas(hintH) {
        const b = bounds();
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        const cont = document.getElementById('game-container');
        const land = window.matchMedia('(max-height:520px) and (orientation:landscape)').matches;
        const availW = Math.max(180, Math.min(470, (cont ? cont.clientWidth : 340) - 44));
        const availH = hintH || Math.max(150, window.innerHeight - (land ? 170 : 340));
        cell = Math.max(34, Math.min(availW / b.w, availH / b.h, 92));
        const W = Math.round(cell * b.w), H = Math.round(cell * b.h);
        originX = -b.minC * cell + cell / 2;
        originY = -b.minR * cell + cell / 2;
        canvas.width = Math.round(W * DPR);
        canvas.height = Math.round(H * DPR);
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        if (!hintH) {
            const spill = document.documentElement.scrollHeight - window.innerHeight;
            if (spill > 2 && H - spill > 120) { fitCanvas(H - spill - 3); return; }
        }
        draw();
    }
    let fitTimer = 0;
    window.addEventListener('resize', () => {
        clearTimeout(fitTimer);
        fitTimer = setTimeout(() => fitCanvas(), 120);
    });
    window.addEventListener('load', () => fitCanvas());
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitCanvas());

    const px = g => originX + g.col * cell;
    const py = g => originY + g.row * cell;

    // ── kresba ──────────────────────────────────────────────────────────
    function teeth(x, y, r, angle, n) {
        const inner = r * 0.80;
        ctx.beginPath();
        const step = (Math.PI * 2) / n;
        for (let i = 0; i < n; i++) {
            const a0 = angle + i * step, a1 = a0 + step * 0.30,
                  a2 = a0 + step * 0.70, a3 = a0 + step;
            ctx.arc(x, y, inner, a0, a1);
            ctx.lineTo(x + Math.cos(a1) * r, y + Math.sin(a1) * r);
            ctx.arc(x, y, r, a1, a2);
            ctx.lineTo(x + Math.cos(a2) * inner, y + Math.sin(a2) * inner);
            ctx.arc(x, y, inner, a2, a3);
        }
        ctx.closePath();
    }

    // farba pohonu, ktoremu koleso patri (aj ked prave stoji)
    function compColour(i) {
        const comp = comps.find(c => c.includes(i));
        if (!comp) return '#94a3b8';
        const crank = comp.find(j => gears[j].kind === 'crank');
        return crank === undefined ? '#94a3b8' : gears[crank].colour;
    }

    function draw() {
        const b = bounds();
        const W = cell * b.w, H = cell * b.h;
        ctx.clearRect(0, 0, W, H);

        // podklad kazdeho pohonu vo vlastnej farbe + sachovnica (parita = smer)
        for (let i = 0; i < gears.length; i++) {
            const g = gears[i];
            const jam = g.jam;
            ctx.fillStyle = jam ? 'rgba(248,113,113,0.14)' : hexA(compColour(i), g.parity ? 0.07 : 0.115);
            ctx.fillRect(px(g) - cell / 2, py(g) - cell / 2, cell, cell);
        }

        for (const g of gears) drawGear(g);

        // svetielko v mieste zaberu, ked sa dvojica toci
        for (let i = 0; i < gears.length; i++) {
            for (const j of neighbours(gears[i])) {
                if (j < i) continue;
                const a = gears[i], c = gears[j];
                if (a.jam || c.jam) continue;
                if (a.dir === 0 || c.dir === 0) continue;
                const mx = (px(a) + px(c)) / 2, my = (py(a) + py(c)) / 2;
                ctx.save();
                ctx.fillStyle = compColour(i);
                ctx.shadowColor = compColour(i);
                ctx.shadowBlur = cell * 0.3;
                ctx.beginPath();
                ctx.arc(mx, my, Math.max(2, cell * 0.045), 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }
    }

    function hexA(hex, a) {
        const h = hex.replace('#', '');
        const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
        return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
    }

    function drawGear(g) {
        const i = gears.indexOf(g);
        const x = px(g), y = py(g), r = cell * 0.5;
        const spinning = g.dir !== 0 && !g.jam;
        const badLock = g.kind === 'lock' && g.dir !== 0;
        const okTarget = g.kind === 'target' && !g.jam && g.dir === g.need;

        let edge;
        if (g.jam || badLock) edge = JAM;
        else if (g.kind === 'crank') edge = g.colour;
        else if (okTarget) edge = '#4ade80';
        else if (g.kind === 'target') edge = '#ffd166';
        else if (g.kind === 'lock') edge = '#cbd5e1';
        else edge = spinning ? hexA(compColour(i), 0.85) : 'rgba(255,255,255,0.22)';

        ctx.save();
        if (spinning || g.jam) { ctx.shadowColor = edge; ctx.shadowBlur = cell * 0.22; }
        teeth(x, y, r, g.angle, 10);
        ctx.fillStyle = g.jam || badLock ? 'rgba(248,113,113,0.20)'
            : spinning ? 'rgba(255,255,255,0.11)' : 'rgba(255,255,255,0.05)';
        ctx.fill();
        ctx.lineWidth = g.kind === 'idle' ? 1.5 : Math.max(2, cell * 0.045);
        ctx.strokeStyle = edge;
        if (g.kind === 'target' && !okTarget) ctx.setLineDash([cell * 0.1, cell * 0.075]);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.shadowBlur = 0;

        // naboj
        ctx.beginPath();
        ctx.arc(x, y, r * 0.52, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(9,13,22,0.94)';
        ctx.fill();
        ctx.lineWidth = 1.2;
        ctx.strokeStyle = hexA(edge.startsWith('#') ? edge : '#94a3b8', 0.6);
        ctx.stroke();

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const big = '800 ' + Math.round(cell * 0.3) + 'px "Syne", system-ui, sans-serif';

        if (g.jam) {
            ctx.fillStyle = JAM; ctx.font = big; ctx.fillText('\u2715', x, y + 1);
            // klucku musi byt vidno aj v zaseknutom stroji, inak hrac nevie, comu ustupit
            if (g.kind === 'crank') {
                ctx.save();
                ctx.strokeStyle = g.colour;
                ctx.globalAlpha = 0.95;
                ctx.lineWidth = Math.max(2, cell * 0.04);
                teeth(x, y, r * 0.99, g.angle, 10);
                ctx.stroke();
                ctx.translate(x, y);
                ctx.rotate(g.angle);
                ctx.fillStyle = g.colour;
                ctx.beginPath();
                ctx.arc(r * 0.72, 0, Math.max(2.4, cell * 0.055), 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        } else if (g.kind === 'crank') {
            ctx.fillStyle = g.set === 0 ? 'rgba(239,248,255,0.4)' : g.colour;
            ctx.font = big;
            ctx.fillText(g.set === 1 ? '\u21bb' : g.set === -1 ? '\u21ba' : '\u25cb', x, y + 1);
            // rucka klucky na okraji kolesa, aby bolo jasne, ze sa s nim toci
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(g.angle);
            ctx.fillStyle = g.colour;
            ctx.beginPath();
            ctx.arc(r * 0.72, 0, Math.max(2.4, cell * 0.055), 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        } else if (g.kind === 'lock') {
            ctx.fillStyle = badLock ? JAM : '#cbd5e1';
            ctx.font = big;
            ctx.fillText('\u2298', x, y + 1);
        } else if (g.kind === 'target') {
            ctx.fillStyle = okTarget ? '#86efac' : '#ffd166';
            ctx.font = big;
            ctx.fillText(g.need === 1 ? '\u21bb' : '\u21ba', x, y + 1);
            // hviezdicka na venci kolesa, stale vo vnutri policka
            ctx.fillStyle = okTarget ? '#4ade80' : '#ffd166';
            ctx.font = '800 ' + Math.round(cell * 0.19) + 'px "Syne", system-ui, sans-serif';
            ctx.fillText('\u2605', x, y - r * 0.74);
        }
        ctx.restore();
    }

    // ── stav v riadku pod plochou ───────────────────────────────────────
    function updateStatus(dir, jam) {
        const targets = gears.filter(g => g.kind === 'target');
        const done = targets.filter(g => !g.jam && g.dir === g.need).length;
        if (gears.some(g => g.jam)) {
            const comp = comps.find(c => c.some(i => gears[i].jam));
            const names = comp.filter(i => gears[i].kind === 'crank' && gears[i].set !== 0);
            statusEl.className = 'jam';
            statusEl.textContent = t('gearJam');
            if (names.length >= 2) {
                statusEl.innerHTML = '<span style="color:' + gears[names[0]].colour + '">\u25cf</span>&nbsp;'
                    + '<span style="color:' + gears[names[1]].colour + '">\u25cf</span>&nbsp;' + t('gearJam');
            }
            return;
        }
        if (gears.some(g => g.kind === 'lock' && g.dir !== 0)) {
            statusEl.className = 'jam';
            statusEl.textContent = t('gearLock');
            return;
        }
        statusEl.className = done === targets.length ? 'done' : '';
        statusEl.textContent = '\u2605 ' + done + ' / ' + targets.length;
    }

    // ── tah ─────────────────────────────────────────────────────────────
    function toggle(i) {
        if (solved) return;
        const g = gears[i];
        g.set = g.set === 0 ? 1 : g.set === 1 ? -1 : 0;
        moves++;
        movesSpan.textContent = moves;
        const { dir, jam } = applyState();
        updateStatus(dir, jam);
        draw();
        if (solvedWith(dir, jam)) win();
    }

    canvas.addEventListener('pointerdown', e => {
        const rect = canvas.getBoundingClientRect();
        const b = bounds();
        const mx = (e.clientX - rect.left) / rect.width * (cell * b.w);
        const my = (e.clientY - rect.top) / rect.height * (cell * b.h);
        for (let i = 0; i < gears.length; i++) {
            if (gears[i].kind !== 'crank') continue;
            if (Math.hypot(mx - px(gears[i]), my - py(gears[i])) <= cell * 0.56) { toggle(i); return; }
        }
    });

    document.addEventListener('keydown', e => {
        if (e.key >= '1' && e.key <= '4') {
            const cranks = gears.map((g, i) => g.kind === 'crank' ? i : -1).filter(i => i >= 0);
            const i = cranks[parseInt(e.key, 10) - 1];
            if (i !== undefined) { e.preventDefault(); toggle(i); }
        }
        if (e.key === 'n' || e.key === 'N') newPuzzle();
        if (e.key === 'r' || e.key === 'R') resetCranks();
    });

    function win() {
        solved = true;
        document.getElementById('finalMoves').textContent = moves;
        document.getElementById('winSub').textContent = t('gearWinSub');
        recordEl.textContent = saveBest(moves) ? t('uiNewRecord') : '';
        setTimeout(() => overlay.classList.add('visible'), 520);
    }

    function resetCranks() {
        for (const g of gears) if (g.kind === 'crank') g.set = 0;
        moves = 0;
        movesSpan.textContent = '0';
        const { dir, jam } = applyState();
        updateStatus(dir, jam);
        draw();
    }

    function newPuzzle() {
        loadBest();
        let ok = false;
        for (let relax = 0; relax <= 2 && !ok; relax++) ok = generate(relax);
        if (!ok) { console.warn('gear-puzzle: zadanie sa nepodarilo zostavit'); }
        moves = 0; solved = false;
        movesSpan.textContent = '0';
        levelSpan.textContent = level;
        overlay.classList.remove('visible');
        recordEl.textContent = '';
        const { dir, jam } = applyState();
        updateStatus(dir, jam);
        fitCanvas();
    }

    // ── animacia: tocia sa len kolesa, ktore maju smer ───────────────────
    let last = 0;
    function frame(ts) {
        const now = ts || performance.now();
        const dt = last ? Math.min(0.05, (now - last) / 1000) : 0.016;
        last = now;
        let moving = false;
        for (const g of gears) {
            if (g.dir !== 0 && !g.jam) { g.angle += g.dir * dt * 1.5; moving = true; }
        }
        if (moving) draw();
        requestAnimationFrame(frame);
    }

    document.getElementById('newBtn').addEventListener('click', () => { newPuzzle(); });
    document.getElementById('resetBtn').addEventListener('click', resetCranks);
    document.getElementById('nextBtn').addEventListener('click', () => { level++; newPuzzle(); });
    diffGroup.querySelectorAll('button').forEach(b => {
        b.addEventListener('click', () => {
            diffGroup.querySelectorAll('button').forEach(x => x.classList.remove('active'));
            b.classList.add('active');
            diffKey = b.dataset.diff;
            D = DIFFS[diffKey];
            level = 1;
            newPuzzle();
        });
    });

    // ── jazyk ───────────────────────────────────────────────────────────
    function applyLang() {
        document.getElementById('lbl-back').textContent   = t('back');
        document.getElementById('lbl-title').textContent  = t('gearTitle');
        document.getElementById('lbl-diff').textContent   = t('uiDifficulty');
        document.getElementById('lbl-easy').textContent   = t('diffEasy');
        document.getElementById('lbl-medium').textContent = t('diffMedium');
        document.getElementById('lbl-hard').textContent   = t('diffHard');
        document.getElementById('lbl-level').textContent  = t('gearLevel');
        document.getElementById('lbl-moves').textContent  = t('gearMoves');
        document.getElementById('lbl-best').textContent   = t('uiBest');
        document.getElementById('rules').textContent      = t('gearHint');
        document.getElementById('newBtn').textContent     = t('gearNew');
        document.getElementById('resetBtn').textContent   = t('uiRestart');
        document.getElementById('lbl-win').textContent    = t('gearWin');
        document.getElementById('lbl-win-moves').textContent = t('gearMoves') + ':';
        document.getElementById('nextBtn').textContent    = t('gearNext');
        document.title = t('gearTitle') + ' \u00b7 GamePad';
    }
    window.addEventListener('storage', e => { if (e.key === 'gamepad_lang') applyLang(); });

    applyLang();
    newPuzzle();
    requestAnimationFrame(() => fitCanvas());
    requestAnimationFrame(frame);
})();
</script>
</body>
</html>
