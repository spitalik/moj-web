<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini Putt · GamePad</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <script src="../../i18n.js"></script>
    <style>
        #back-btn{
            position:fixed;top:14px;left:14px;z-index:60;
            display:flex;align-items:center;gap:7px;
            background:rgba(7,9,15,.88);border:1px solid #17401f;color:#84a88d;
            padding:7px 14px;border-radius:100px;text-decoration:none;
            font-size:12px;font-weight:600;backdrop-filter:blur(4px);transition:all .18s;
        }
        #back-btn:hover,#back-btn:active{border-color:#22c55e;color:#ecfff1;}
        @media(max-width:480px){#back-btn{top:8px;left:8px;padding:5px 10px;font-size:11px;}}
        * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
        body {
            background:#0c0f16;
            font-family:'Segoe UI', Roboto, system-ui, sans-serif;
            display:flex; justify-content:center; align-items:center;
            min-height:100vh; margin:0; padding:12px;
            touch-action: manipulation;
        }
        #game-container {
            background:#151d2b; border-radius:28px; padding:20px 20px 24px;
            max-width:500px; width:100%;
            box-shadow:0 12px 40px rgba(0,0,0,.7); border:1px solid #2e3a4e;
            display:flex; flex-direction:column; gap:12px; position:relative;
        }
        #header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
        #header h1 {
            font-size:21px; font-weight:700;
            background:linear-gradient(135deg,#bbf7d0,#22c55e);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin:0;
        }
        #rules { font-size:12px; color:#8291ab; line-height:1.5; }
        #settings { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
        #settings label { color:#b0c4e0; font-size:12px; font-weight:500; }
        .btn-group { display:flex; gap:4px; background:#111a28; padding:4px; border-radius:10px; border:1px solid #29344a; }
        .btn-group button { background:transparent; border:none; color:#7a8aa8; padding:4px 10px; border-radius:8px; font-size:12px; font-weight:600; cursor:pointer; }
        .btn-group button.active { background:#22c55e; color:#0c0f16; }
        #info-panel { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
        .info-card { flex:1 1 auto; min-width:60px; background:#111a28; border-radius:14px; padding:8px 10px; border:1px solid #29344a; text-align:center; }
        .info-card h3 { font-size:10px; text-transform:uppercase; color:#7a8aa8; margin-bottom:4px; font-weight:500; letter-spacing:.4px; }
        .info-card .value { font-size:20px; font-weight:700; color:#eef3fc; display:block; }
        .high-score { border-color:#fbbf24; }
        .high-score h3 { color:#fbbf24 !important; }
        .high-score .value { color:#fbbf24 !important; }
        #status-line { text-align:center; font-size:12px; color:#86efac; min-height:16px; font-weight:600; }
        #canvas-wrapper { background:#0f1622; border-radius:16px; padding:8px; box-shadow: inset 0 0 0 1px #2a3446; position:relative; align-self:center; max-width:100%; }
        #gameCanvas { display:block; border-radius:10px; touch-action:none; cursor:crosshair; max-width:100%; height:auto; }
        #end-overlay {
            position:absolute; inset:8px; background:rgba(8,12,22,.92); backdrop-filter:blur(6px);
            border-radius:10px; display:none; flex-direction:column; align-items:center; justify-content:center;
            gap:8px; padding:26px; z-index:10; color:#f0f4fe; text-align:center;
        }
        #end-overlay.visible { display:flex; }
        #end-overlay h2 { font-size:26px; background:linear-gradient(135deg,#bbf7d0,#22c55e); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        #end-overlay p { font-size:14px; color:#b0c4e0; }
        #restartBtn {
            background:#22c55e; border:1px solid #bbf7d0; border-radius:40px;
            padding:12px 32px; font-size:17px; font-weight:700; color:#0c0f16;
            box-shadow:0 6px 0 #15803d; cursor:pointer; margin-top:6px;
        }
        #restartBtn:active { transform:translateY(6px); box-shadow:0 1px 0 #15803d; }
        #controls { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
        #controls button { background:#1e2a3e; border:1px solid #354460; color:#d0def0; border-radius:12px; padding:9px 16px; font-size:13px; font-weight:600; cursor:pointer; }
        #controls button:active { transform:translateY(2px); }
    
/* mobil/tablet: na nízkych obrazovkách stlačím rámce, aby ovládanie zostalo viditeľné */
@media (max-height:900px){
  body{padding:6px !important;}
  #game-container{padding:12px 14px 14px !important;gap:9px !important;}
}
@media (max-height:760px){
  body{padding:3px !important;}
  #game-container{padding:8px 10px 10px !important;gap:6px !important;border-radius:18px !important;}
}

/* nízke obrazovky: hracia plocha sa zmenší do dostupného miesta namiesto pretečenia */
@media (max-height:900px){
  #game-container{max-height:calc(100vh - 10px);}
  #canvas-wrapper{min-height:0;flex:0 1 auto;}
  #gameCanvas{max-height:100%;max-width:100%;width:auto;height:auto;}
}

@media (max-height:700px){
  #rules{display:none !important;}
}

  --ftext:#eef3fc;--fmuted:rgba(238,243,252,0.44);--fdim:rgba(238,243,252,0.2);
  --fbd:rgba(255,255,255,0.09);
}
body{
  font-family:'DM Sans',system-ui,sans-serif !important;
  background:radial-gradient(ellipse at 50% -8%, rgba(74,222,128,.14) 0%, transparent 58%), #070a12 !important;
  color:var(--ftext) !important;
}
#back-btn{background:rgba(10,13,24,0.72) !important;border:1px solid var(--fbd) !important;color:var(--fmuted) !important;font-weight:500 !important;}
#back-btn:hover,#back-btn:active{border-color:rgba(255,255,255,0.18) !important;color:#fff !important;}
#game-container{
  background:linear-gradient(165deg,rgba(255,255,255,0.045),rgba(255,255,255,0.012)) !important;
  border:1px solid rgba(255,255,255,0.13) !important;border-radius:26px !important;

}
#header h1{
  font-family:'Syne',sans-serif !important;font-weight:800 !important;font-size:19px !important;
  letter-spacing:-.3px !important;
  background:linear-gradient(110deg,var(--fa) 5%,#fff 55%,var(--fb) 95%);

.btn-group{background:rgba(255,255,255,0.04) !important;border:1px solid var(--fbd) !important;

<body>

    <a href="../../index.html" id="back-btn">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      <span id="lbl-back"></span>
    </a>

    <div id="game-container">
        <div id="header">
            <h1 id="lbl-title">⛳</h1>
            <div id="settings">
                <label id="lbl-diff"></label>
                <div class="btn-group" id="diffGroup">
                    <button data-diff="easy"   id="lbl-easy"></button>
                    <button data-diff="medium" id="lbl-medium" class="active"></button>
                    <button data-diff="hard"   id="lbl-hard"></button>
                </div>
            </div>
        </div>

        <p id="rules"></p>

        <div id="info-panel">
            <div class="info-card"><h3 id="lbl-hole"></h3><span class="value" id="holeValue">1/9</span></div>
            <div class="info-card"><h3 id="lbl-strokes"></h3><span class="value" id="strokeValue">0</span></div>
            <div class="info-card"><h3 id="lbl-total"></h3><span class="value" id="totalValue">0</span></div>
            <div class="info-card high-score"><h3 id="lbl-best"></h3><span class="value" id="bestValue">0</span></div>
        </div>

        <div id="status-line"></div>

        <div id="canvas-wrapper">
            <canvas id="gameCanvas"></canvas>
            <div id="end-overlay">
                <h2 id="lbl-result"></h2>
                <p id="lbl-final-detail"></p>
                <p style="font-size:16px;color:#fbbf24;"><span id="lbl-final-score"></span> <span id="finalScore">0</span></p>
                <button id="restartBtn"></button>
            </div>
        </div>

        <div id="controls">
            <button id="replayBtn"></button>
            <button id="newGameBtn"></button>
        </div>
    </div>

    <script>
    (function () {
        'use strict';

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const holeSpan = document.getElementById('holeValue');
        const strokeSpan = document.getElementById('strokeValue');
        const totalSpan = document.getElementById('totalValue');
        const bestSpan = document.getElementById('bestValue');
        const statusLine = document.getElementById('status-line');
        const endOverlay = document.getElementById('end-overlay');
        const resultH2 = document.getElementById('lbl-result');
        const finalDetail = document.getElementById('lbl-final-detail');
        const finalScore = document.getElementById('finalScore');
        const restartBtn = document.getElementById('restartBtn');
        const newGameBtn = document.getElementById('newGameBtn');
        const replayBtn = document.getElementById('replayBtn');
        const diffGroup = document.getElementById('diffGroup');

        // ----- PREKLADY -----
        document.getElementById('lbl-back').textContent    = t('back');
        document.getElementById('lbl-title').textContent   = '⛳ ' + t('mptTitle');
        document.getElementById('lbl-diff').textContent    = t('uiDifficulty') + ':';
        document.getElementById('lbl-easy').textContent    = t('diffEasy');
        document.getElementById('lbl-medium').textContent  = t('diffMedium');
        document.getElementById('lbl-hard').textContent    = t('diffHard');
        document.getElementById('lbl-hole').textContent    = t('mptHole');
        document.getElementById('lbl-strokes').textContent = t('mptStrokes');
        document.getElementById('lbl-total').textContent   = t('mptTotal');
        document.getElementById('lbl-best').textContent    = t('uiBest');
        document.getElementById('lbl-final-score').textContent = t('uiScore') + ':';
        document.getElementById('rules').textContent       = t('mptRules');
        replayBtn.textContent  = t('mptReplay');
        restartBtn.textContent = t('uiPlayAgain');
        newGameBtn.textContent = t('uiNewGame');
        document.title = t('mptTitle') + ' · GamePad';

        // ----- KONFIGURACIA -----
        const W = 440, H = 300, WALL = 12, R = 7, CUP = 12;
        // ── ostra kresba: logicky priestor sa mapuje na skutocne body displeja
        let DPR = 1;
        function fitCanvas(hintH) {
            DPR = Math.min(window.devicePixelRatio || 1, 2);
            const cont = document.getElementById('game-container');
            const land = window.matchMedia('(max-height:520px) and (orientation:landscape)').matches;
            const availW = Math.max(200, Math.min(620, (cont ? cont.clientWidth : 340) - 28));
            const availH = hintH || Math.max(180, window.innerHeight - (land ? 110 : 260));
            const k = Math.max(0.28, Math.min(availW / W, availH / H, 1.8));
            canvas.width = Math.round(W * k * DPR);
            canvas.height = Math.round(H * k * DPR);
            canvas.style.width = (canvas.width / DPR) + 'px';
            canvas.style.height = (canvas.height / DPR) + 'px';
            ctx.setTransform(k * DPR, 0, 0, k * DPR, 0, 0);
            if (!hintH) {
                const got = canvas.getBoundingClientRect();
                if (!land) {
                    if (got.height > 20 && H * k - got.height > 1.5) { fitCanvas(got.height); return; }
                    if (got.width > 20 && W * k - got.width > 1.5) { fitCanvas(got.width * H / W); return; }
                    // par bodov pretekania (zaokruhlenie) by vyvolalo zbytocny posuvnik
                    const spill = document.documentElement.scrollHeight - window.innerHeight;
                    if (spill > 1 && spill <= 26 && got.height - spill > 150) { fitCanvas(got.height - spill - 3); return; }
                } else {
                    // na sirku: nech sa cely panel vojde do okna aj s ovladanim
                    const over = document.documentElement.scrollHeight - window.innerHeight;
                    if (over > 4 && got.height - over > 150) { fitCanvas(got.height - over); return; }
                }
            }
        }
        fitCanvas();
        let fitTimer = 0;
        window.addEventListener('resize', () => {
            clearTimeout(fitTimer);
            fitTimer = setTimeout(() => { fitCanvas(); draw(); }, 120);
        });
        const HOLES = 9;
        const SETUP = {
            easy:   { blocks: [1, 2], par: 3, power: 0.20 },
            medium: { blocks: [2, 3], par: 3, power: 0.22 },
            hard:   { blocks: [3, 4], par: 2, power: 0.24 },
        };
        const FRICTION = 0.978, STOP = 0.06;

        let diffKey = 'medium';
        let blocks = [], tee = { x: 0, y: 0 }, cup = { x: 0, y: 0 };
        let ball = { x: 0, y: 0, vx: 0, vy: 0, sunk: false };
        let hole = 1, strokes = 0, total = 0, par = 3;
        let aim = null, over = false, raf = 0, lastTick = 0;
        let best = { easy: 0, medium: 0, hard: 0 };
        try { best = Object.assign(best, JSON.parse(localStorage.getItem('miniPuttBest') || '{}')); } catch (e) { /* ignore */ }

        // ----- GENEROVANIE JAMKY -----
        const inWall = (x, y) => x < WALL + R || x > W - WALL - R || y < WALL + R || y > H - WALL - R;

        function overlapsAny(rect, list, pad) {
            return list.some(b => rect.x < b.x + b.w + pad && rect.x + rect.w + pad > b.x
                               && rect.y < b.y + b.h + pad && rect.y + rect.h + pad > b.y);
        }

        // A coarse grid flood fill decides whether the cup is actually reachable from the tee.
        function pathExists(bs, from, to) {
            const step = 8;
            const cols = Math.ceil(W / step), rows = Math.ceil(H / step);
            const free = (c, r) => {
                const x = c * step + step / 2, y = r * step + step / 2;
                if (inWall(x, y)) return false;
                return !bs.some(b => x > b.x - R && x < b.x + b.w + R && y > b.y - R && y < b.y + b.h + R);
            };
            const start = [Math.floor(from.x / step), Math.floor(from.y / step)];
            const goal = [Math.floor(to.x / step), Math.floor(to.y / step)];
            if (!free(start[0], start[1])) return false;
            const seen = Array.from({ length: rows }, () => new Array(cols).fill(false));
            const queue = [start];
            seen[start[1]][start[0]] = true;
            while (queue.length) {
                const [c, r] = queue.pop();
                if (c === goal[0] && r === goal[1]) return true;
                for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
                    const nc = c + dc, nr = r + dr;
                    if (nc < 0 || nr < 0 || nc >= cols || nr >= rows || seen[nr][nc] || !free(nc, nr)) continue;
                    seen[nr][nc] = true; queue.push([nc, nr]);
                }
            }
            return false;
        }

        function buildHole() {
            const setup = SETUP[diffKey];
            const want = setup.blocks[0] + Math.floor(Math.random() * (setup.blocks[1] - setup.blocks[0] + 1))
                       + Math.floor((hole - 1) / 3);
            for (let attempt = 0; attempt < 260; attempt++) {
                const leftTee = hole % 2 === 1;
                tee = { x: leftTee ? WALL + 26 : W - WALL - 26, y: WALL + 22 + Math.random() * (H - 2 * WALL - 44) };
                cup = { x: leftTee ? W - WALL - 30 : WALL + 30, y: WALL + 22 + Math.random() * (H - 2 * WALL - 44) };
                const bs = [];
                for (let i = 0; i < want; i++) {
                    for (let tryB = 0; tryB < 40; tryB++) {
                        const vertical = Math.random() < 0.55;
                        const w = vertical ? 14 + Math.random() * 10 : 50 + Math.random() * 90;
                        const h = vertical ? 50 + Math.random() * 90 : 14 + Math.random() * 10;
                        const rect = {
                            x: WALL + 30 + Math.random() * (W - 2 * WALL - 60 - w),
                            y: WALL + 10 + Math.random() * (H - 2 * WALL - 20 - h),
                            w, h,
                        };
                        const nearTee = rect.x - 24 < tee.x && rect.x + rect.w + 24 > tee.x
                                     && rect.y - 24 < tee.y && rect.y + rect.h + 24 > tee.y;
                        const nearCup = rect.x - 26 < cup.x && rect.x + rect.w + 26 > cup.x
                                     && rect.y - 26 < cup.y && rect.y + rect.h + 26 > cup.y;
                        if (nearTee || nearCup || overlapsAny(rect, bs, 18)) continue;
                        bs.push(rect);
                        break;
                    }
                }
                if (pathExists(bs, tee, cup)) { blocks = bs; return; }
            }
            blocks = [];
        }

        function teeUp() {
            ball = { x: tee.x, y: tee.y, vx: 0, vy: 0, sunk: false };
            aim = null;
        }

        // ----- FYZIKA -----
        const moving = () => Math.hypot(ball.vx, ball.vy) > STOP;

        function bounceBlocks() {
            for (const b of blocks) {
                const nx = Math.max(b.x, Math.min(ball.x, b.x + b.w));
                const ny = Math.max(b.y, Math.min(ball.y, b.y + b.h));
                const dx = ball.x - nx, dy = ball.y - ny;
                const d2 = dx * dx + dy * dy;
                if (d2 > R * R) continue;
                // push the ball back out along whichever axis it entered by
                if (Math.abs(dx) > Math.abs(dy)) {
                    ball.x = dx >= 0 ? b.x + b.w + R : b.x - R;
                    ball.vx *= -0.72;
                } else {
                    ball.y = dy >= 0 ? b.y + b.h + R : b.y - R;
                    ball.vy *= -0.72;
                }
            }
        }

        function physics(dt) {
            if (ball.sunk) return;
            const steps = Math.max(1, Math.ceil(Math.hypot(ball.vx, ball.vy) * dt / 3));
            for (let s = 0; s < steps; s++) {
                ball.x += ball.vx * dt / steps;
                ball.y += ball.vy * dt / steps;
                if (ball.x < WALL + R) { ball.x = WALL + R; ball.vx *= -0.74; }
                if (ball.x > W - WALL - R) { ball.x = W - WALL - R; ball.vx *= -0.74; }
                if (ball.y < WALL + R) { ball.y = WALL + R; ball.vy *= -0.74; }
                if (ball.y > H - WALL - R) { ball.y = H - WALL - R; ball.vy *= -0.74; }
                bounceBlocks();

                const d = Math.hypot(ball.x - cup.x, ball.y - cup.y);
                const speed = Math.hypot(ball.vx, ball.vy);
                if (d < CUP - 2 && speed < 3.4) { sink(); return; }
                if (d < CUP - 4 && speed < 5.5) { sink(); return; }
            }
            ball.vx *= Math.pow(FRICTION, dt);
            ball.vy *= Math.pow(FRICTION, dt);
            if (!moving()) { ball.vx = 0; ball.vy = 0; }
        }

        function sink() {
            ball.sunk = true; ball.vx = 0; ball.vy = 0;
            ball.x = cup.x; ball.y = cup.y;
            const diff = strokes - par;
            total += strokes;
            refresh();
            statusLine.textContent = diff <= -2 ? t('mptEagle') : (diff === -1 ? t('mptBirdie')
                : (diff === 0 ? t('mptPar') : t('mptOver', { n: diff })));
            setTimeout(() => {
                if (over) return;
                if (hole >= HOLES) { finish(); return; }
                hole++;
                nextHole();
            }, 1200);
        }

        function nextHole() {
            par = SETUP[diffKey].par + (hole > 6 ? 1 : 0);
            strokes = 0;
            buildHole();
            teeUp();
            refresh();
            statusLine.textContent = t('mptHoleStart', { n: hole, p: par });
        }

        function finish() {
            over = true;
            cancelAnimationFrame(raf);
            const parTotal = HOLES * SETUP[diffKey].par + 3;
            const score = Math.max(40, Math.round((parTotal - total) * 40 + 300));
            if (score > (best[diffKey] || 0)) {
                best[diffKey] = score;
                localStorage.setItem('miniPuttBest', JSON.stringify(best));
            }
            bestSpan.textContent = best[diffKey] || 0;
            resultH2.textContent = t('mptRoundDone');
            finalDetail.textContent = t('mptStrokes') + ': ' + total + '  (' + t('mptPar') + ' ' + parTotal + ')';
            finalScore.textContent = score;
            statusLine.textContent = '';
            draw();
            endOverlay.classList.add('visible');
        }

        function refresh() {
            holeSpan.textContent = hole + '/' + HOLES;
            strokeSpan.textContent = strokes;
            totalSpan.textContent = total;
        }

        function loop(now) {
            raf = requestAnimationFrame(loop);
            if (over) return;
            const dt = Math.min(3, (now - lastTick) / 16.67 || 1);
            lastTick = now;
            physics(dt);
            draw();
        }

        function newGame() {
            hole = 1; strokes = 0; total = 0; over = false;
            par = SETUP[diffKey].par;
            buildHole(); teeUp();
            bestSpan.textContent = best[diffKey] || 0;
            endOverlay.classList.remove('visible');
            statusLine.textContent = t('mptHint');
            refresh();
            cancelAnimationFrame(raf);
            lastTick = performance.now();
            raf = requestAnimationFrame(loop);
            draw();
        }

        // ----- OVLADANIE -----
        function pointer(e) {
            const rect = canvas.getBoundingClientRect();
            const src = e.touches ? e.touches[0] : (e.changedTouches ? e.changedTouches[0] : e);
            return {
                x: (src.clientX - rect.left) / rect.width * W,
                y: (src.clientY - rect.top) / rect.height * H,
            };
        }

        function startAim(e) {
            if (over || ball.sunk || moving()) return;
            const p = pointer(e);
            if (Math.hypot(p.x - ball.x, p.y - ball.y) > 60) return;
            aim = { x: p.x, y: p.y };
        }
        function moveAim(e) { if (aim) aim = pointer(e); }
        function releaseAim(e) {
            if (!aim) return;
            const p = pointer(e);
            const dx = ball.x - p.x, dy = ball.y - p.y;      // pull back, release to shoot
            const len = Math.hypot(dx, dy);
            aim = null;
            if (len < 8) return;
            const power = Math.min(len, 130) * SETUP[diffKey].power;
            const inv = 1 / len;
            ball.vx = dx * inv * power;
            ball.vy = dy * inv * power;
            strokes++;
            refresh();
            statusLine.textContent = '';
        }

        canvas.addEventListener('mousedown', startAim);
        canvas.addEventListener('mousemove', moveAim);
        canvas.addEventListener('mouseup', releaseAim);
        canvas.addEventListener('mouseleave', () => { aim = null; });
        canvas.addEventListener('touchstart', e => { e.preventDefault(); startAim(e); }, { passive: false });
        canvas.addEventListener('touchmove', e => { e.preventDefault(); moveAim(e); }, { passive: false });
        canvas.addEventListener('touchend', e => { e.preventDefault(); releaseAim(e); }, { passive: false });

        replayBtn.addEventListener('click', () => {
            if (over || moving()) return;
            teeUp();
            statusLine.textContent = t('mptReplayed');
            draw();
        });
        restartBtn.addEventListener('click', newGame);
        newGameBtn.addEventListener('click', newGame);
        diffGroup.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                diffGroup.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                diffKey = btn.dataset.diff;
                newGame();
            });
        });

        // ----- VYKRESLENIE -----
        function draw() {
            ctx.fillStyle = '#123d20'; ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = '#1a5c2e';
            ctx.fillRect(WALL, WALL, W - 2 * WALL, H - 2 * WALL);
            ctx.strokeStyle = '#6b4b23'; ctx.lineWidth = WALL;
            ctx.strokeRect(WALL / 2, WALL / 2, W - WALL, H - WALL);

            ctx.fillStyle = 'rgba(255,255,255,.04)';
            for (let x = WALL; x < W - WALL; x += 22) ctx.fillRect(x, WALL, 11, H - 2 * WALL);

            for (const b of blocks) {
                ctx.fillStyle = '#6b4b23';
                ctx.fillRect(b.x, b.y, b.w, b.h);
                ctx.fillStyle = '#8b6534';
                ctx.fillRect(b.x + 2, b.y + 2, b.w - 4, b.h - 4);
            }

            ctx.beginPath(); ctx.arc(cup.x, cup.y, CUP, 0, Math.PI * 2);
            ctx.fillStyle = '#04160a'; ctx.fill();
            ctx.strokeStyle = '#0f2f18'; ctx.lineWidth = 2; ctx.stroke();
            // flag
            ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(cup.x, cup.y - CUP); ctx.lineTo(cup.x, cup.y - CUP - 22); ctx.stroke();
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.moveTo(cup.x, cup.y - CUP - 22); ctx.lineTo(cup.x + 16, cup.y - CUP - 16);
            ctx.lineTo(cup.x, cup.y - CUP - 10); ctx.closePath(); ctx.fill();

            if (!ball.sunk) {
                ctx.beginPath(); ctx.arc(ball.x, ball.y + 2, R, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fill();
                const g = ctx.createRadialGradient(ball.x - 2.5, ball.y - 2.5, 1, ball.x, ball.y, R);
                g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#cbd5e1');
                ctx.beginPath(); ctx.arc(ball.x, ball.y, R, 0, Math.PI * 2);
                ctx.fillStyle = g; ctx.fill();
            }

            if (aim) {
                const dx = ball.x - aim.x, dy = ball.y - aim.y;
                const len = Math.min(Math.hypot(dx, dy), 130);
                const ang = Math.atan2(dy, dx);
                ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2;
                ctx.setLineDash([5, 4]);
                ctx.beginPath(); ctx.moveTo(ball.x, ball.y);
                ctx.lineTo(ball.x + Math.cos(ang) * len, ball.y + Math.sin(ang) * len);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(ball.x, ball.y);
                ctx.lineTo(ball.x - Math.cos(ang) * len * 0.5, ball.y - Math.sin(ang) * len * 0.5);
                ctx.stroke();
                ctx.fillStyle = '#fde68a'; ctx.font = '600 11px system-ui';
                ctx.textAlign = 'left'; ctx.textBaseline = 'top';
                ctx.fillText(Math.round(len / 130 * 100) + '%', 16, 16);
            }
        }

        newGame();
    })();
    </script>
</body>
</html>
