<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Block Cascade · GamePad</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<script src="../../i18n.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#05070e;--text:#eef2ff;--muted:rgba(238,242,255,0.42);--dim:rgba(238,242,255,0.18);
  --border:rgba(255,255,255,0.08);--border-h:rgba(255,255,255,0.17);
  --c:#ff8a3d;--c2:#22d3ee;--gold:#ffd23d;--danger:#ff4d6d;
}
html,body{background:var(--bg);min-height:100%;font-family:'DM Sans',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
body{overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:
  radial-gradient(700px 430px at 50% -12%,rgba(255,138,61,0.10),transparent 70%),
  radial-gradient(520px 380px at 98% 106%,rgba(34,211,238,0.07),transparent 72%);}
button{font-family:'DM Sans',sans-serif;touch-action:manipulation;}

#back-btn{position:fixed;top:14px;left:14px;z-index:60;display:flex;align-items:center;gap:7px;background:rgba(8,11,20,0.75);backdrop-filter:blur(8px);border:1px solid var(--border);color:var(--muted);padding:7px 14px;border-radius:100px;text-decoration:none;font-size:12px;font-weight:500;transition:border-color .18s,color .18s;}
#back-btn:hover,#back-btn:active{border-color:var(--border-h);color:var(--text);}
@media(max-width:520px){#back-btn{top:9px;left:9px;padding:6px 11px;font-size:11px;}}

.page{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:50px 10px 10px;}

.pills{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;}
.pill{display:flex;align-items:center;gap:7px;padding:4px 11px;border-radius:100px;background:rgba(255,255,255,0.04);border:1px solid var(--border);font-size:8.5px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;color:var(--dim);white-space:nowrap;}
.pill b{font-family:'Syne',sans-serif;font-size:14px;font-weight:800;letter-spacing:0;font-variant-numeric:tabular-nums;color:var(--c);transition:transform .18s;}
.pill.lines b{color:var(--c2);}
.pill.lvl b{color:var(--gold);}
.pill.best b{color:rgba(238,242,255,.72);}
.pill.best.record{border-color:rgba(255,138,61,.45);}
.pill b.bump{transform:scale(1.3);}

.strip{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:14px;background:rgba(255,255,255,0.035);border:1px solid var(--border);}
.strip span{font-size:8.5px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;color:var(--dim);}
.strip canvas{display:block;}

.seg{display:flex;gap:3px;background:rgba(255,255,255,0.04);border:1px solid var(--border);padding:3px;border-radius:100px;}
.seg button{background:transparent;border:none;color:var(--muted);padding:5px 13px;border-radius:100px;font-size:11.5px;font-weight:600;cursor:pointer;transition:color .16s,background .16s;}
.seg button:hover{color:var(--text);}
.seg button.active{background:rgba(255,138,61,0.16);color:#ffd8bd;box-shadow:inset 0 0 0 1px rgba(255,138,61,0.42);}

#board-wrap{position:relative;padding:7px;border-radius:16px;background:linear-gradient(165deg,rgba(255,255,255,0.05),rgba(255,255,255,0.012));border:1px solid var(--border-h);box-shadow:0 24px 60px -30px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.06);}
#board{display:block;border-radius:10px;touch-action:none;}

#pad{display:none;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;max-width:340px;}
body.touch #pad{display:grid;}
#pad button{height:52px;background:linear-gradient(160deg,rgba(255,255,255,0.07),rgba(255,255,255,0.02));border:1px solid var(--border);color:var(--muted);border-radius:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .1s;}
#pad button svg{width:19px;height:19px;}
#pad button:active{background:rgba(255,138,61,0.2);border-color:rgba(255,138,61,0.5);color:var(--c);transform:scale(.95);}
#pad button.drop{border-color:rgba(34,211,238,0.35);color:#a5edff;}

.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
.tool{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--muted);padding:7px 13px;border-radius:100px;font-size:11.5px;font-weight:600;cursor:pointer;transition:all .16s;}
.tool:hover{border-color:var(--border-h);color:var(--text);}
.tool svg{width:13px;height:13px;}
.tool.primary{border-color:rgba(255,138,61,0.4);color:#ffd8bd;background:rgba(255,138,61,0.12);}
.foot{font-size:10px;color:var(--dim);text-align:center;}

#overlay{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(ellipse at center,rgba(8,11,20,0.82) 0%,rgba(3,4,8,0.95) 78%);backdrop-filter:blur(6px);}
#overlay.hide{display:none;}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:11px;width:100%;max-width:334px;padding:26px 24px 24px;border-radius:24px;background:linear-gradient(165deg,rgba(255,255,255,0.06),rgba(255,255,255,0.015));border:1px solid var(--border-h);box-shadow:0 30px 70px -28px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.07);animation:pop .34s cubic-bezier(.2,1.4,.4,1);}
@keyframes pop{from{transform:scale(.9) translateY(8px);opacity:0;}to{transform:none;opacity:1;}}
.card::before{content:'';position:absolute;inset:-1px;border-radius:24px;padding:1px;background:linear-gradient(120deg,rgba(255,138,61,.5),transparent 42%,transparent 58%,rgba(34,211,238,.5));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;}
.emoji{font-size:32px;line-height:1;filter:drop-shadow(0 6px 16px rgba(255,138,61,.4));}
.ttl{font-family:'Syne',sans-serif;font-weight:800;font-size:23px;letter-spacing:-.5px;text-align:center;background:linear-gradient(110deg,var(--c) 5%,#fff 52%,var(--c2) 95%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
#result{display:none;flex-direction:column;align-items:center;gap:1px;}
#result.show{display:flex;}
#res-lbl{font-size:9px;letter-spacing:2.2px;text-transform:uppercase;color:var(--dim);}
#res-score{font-family:'Syne',sans-serif;font-weight:800;font-size:48px;line-height:1.05;letter-spacing:-2px;color:var(--c);text-shadow:0 0 30px rgba(255,138,61,.4);}
#res-note{font-size:11.5px;font-weight:600;color:var(--muted);}
#res-note.record{color:var(--gold);}
#ov-stats{display:none;width:100%;grid-template-columns:1fr 1fr 1fr;gap:7px;}
#ov-stats.show{display:grid;}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:14px;background:rgba(255,255,255,0.04);border:1px solid var(--border);}
.stat i{font-size:8px;font-style:normal;letter-spacing:1.3px;text-transform:uppercase;color:var(--dim);text-align:center;}
.stat b{font-family:'Syne',sans-serif;font-size:15px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;color:var(--c2);white-space:nowrap;}
.lbl{font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);}
.hint{font-size:11.5px;line-height:1.5;color:var(--muted);text-align:center;}
.play-btn{margin-top:3px;width:100%;padding:13px 30px;border-radius:100px;border:1px solid rgba(255,138,61,.5);background:linear-gradient(180deg,rgba(255,138,61,.24),rgba(255,138,61,.1));color:#ffe0c8;font-size:14px;font-weight:600;cursor:pointer;transition:all .18s;}
.play-btn:hover{background:linear-gradient(180deg,rgba(255,138,61,.34),rgba(255,138,61,.16));color:#fff;box-shadow:0 0 24px -6px rgba(255,138,61,.5);}
.play-btn:active{transform:translateY(1px);}
@media (max-height:820px){#overlay{align-items:flex-start !important;overflow-y:auto !important;}}
@media(max-height:700px){.page{padding-top:44px;gap:6px;}.foot{display:none;}}
@media(max-width:380px){.seg button{padding:5px 10px;font-size:11px;}}

/* krajina na nizkych obrazovkach: doska vlavo, ovladanie vpravo */
@media (orientation:landscape) and (max-height:600px){
  .page{display:grid;grid-template-columns:auto minmax(160px,210px);align-content:center;justify-content:center;
        column-gap:16px;row-gap:6px;padding:6px 12px 6px 88px;min-height:100vh;}
  #board-wrap{grid-column:1;grid-row:1 / span 5;align-self:center;padding:6px;}
  .pills{grid-column:2;grid-row:1;flex-wrap:wrap;max-width:210px;gap:4px;}
  .pill{padding:3px 8px;font-size:8px;}
  .pill b{font-size:12px;}
  .strip{grid-column:2;grid-row:2;justify-self:center;}
  .seg{grid-column:2;grid-row:3;justify-self:center;}
  #pad{grid-column:2;grid-row:4;max-width:210px;}
  #pad button{height:42px;}
  .tools{grid-column:2;grid-row:5;max-width:210px;}
  #back-btn{padding:5px 11px;font-size:11px;}
}
</style>
</head>
<body>
<a href="../../index.html" id="back-btn">
  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
  <span id="lbl-back"></span>
</a>

<div class="page" id="page">
  <div class="pills">
    <div class="pill"><span id="lbl-score"></span><b id="hud-score">0</b></div>
    <div class="pill lines"><span id="lbl-lines"></span><b id="hud-lines">0</b></div>
    <div class="pill lvl"><span id="lbl-level"></span><b id="hud-level">1</b></div>
    <div class="pill best" id="best-pill"><span id="lbl-best"></span><b id="hud-best">0</b></div>
  </div>

  <div class="strip">
    <span id="lbl-next"></span>
    <canvas id="next1"></canvas>
    <canvas id="next2"></canvas>
  </div>

  <div class="seg" id="diff-row"></div>

  <div id="board-wrap"><canvas id="board"></canvas></div>

  <div id="pad">
    <button data-act="left" aria-label="left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg></button>
    <button data-act="rot" aria-label="rotate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
    <button data-act="right" aria-label="right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
    <button class="drop" data-act="drop" aria-label="drop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v13M6 11l6 6 6-6"/></svg></button>
  </div>

  <div class="tools">
    <button class="tool" id="btn-pause">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1.4"/><rect x="14" y="4" width="4" height="16" rx="1.4"/></svg>
      <span id="lbl-pause"></span></button>
    <button class="tool primary" id="btn-new">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
      <span id="lbl-new"></span></button>
  </div>
  <div class="foot" id="foot"></div>
</div>

<div id="overlay">
  <div class="card">
    <div id="brand"><div class="emoji">⬡</div></div>
    <div class="ttl" id="ov-title"></div>
    <div id="result">
      <div id="res-lbl"></div>
      <div id="res-score">0</div>
      <div id="res-note"></div>
    </div>
    <div id="ov-stats">
      <div class="stat"><i id="lbl-s-lines"></i><b id="st-lines">0</b></div>
      <div class="stat"><i id="lbl-s-level"></i><b id="st-level">1</b></div>
      <div class="stat"><i id="lbl-s-best"></i><b id="st-best">0</b></div>
    </div>
    <div class="lbl" id="lbl-diff"></div>
    <div class="seg" id="diff-row2"></div>
    <div class="hint" id="ov-hint"></div>
    <button class="play-btn" id="ov-play"></button>
  </div>
</div>

<script>
// ── vlastne bloky a vlastne priradenie farieb ───────────────────────────
const SHAPES = [
  {rgb:'255,138,61',  cells:[[0,0],[1,0],[2,0],[3,0]]},   // I
  {rgb:'45,212,167',  cells:[[0,0],[1,0],[0,1],[1,1]]},   // O
  {rgb:'255,210,61',  cells:[[0,0],[1,0],[2,0],[1,1]]},   // T
  {rgb:'59,123,255',  cells:[[1,0],[2,0],[0,1],[1,1]]},   // S
  {rgb:'168,85,247',  cells:[[0,0],[1,0],[1,1],[2,1]]},   // Z
  {rgb:'34,211,238',  cells:[[0,0],[1,0],[2,0],[2,1]]},   // L
  {rgb:'255,77,109',  cells:[[0,0],[1,0],[2,0],[0,1]]},   // J
];
const COLS = 10, ROWS = 20, PREVIEW = 2;
// vlastna bodova tabulka
const LINE_PTS = [0, 60, 150, 280, 520];
const SOFT_PT = 1, HARD_PT = 2;

const DIFFS = [
  {key:'diffEasy',   start:1},
  {key:'diffMedium', start:4},
  {key:'diffHard',   start:8},
];
let diffIdx = 0;
const bestKey = () => 'blockcascade_best_' + DIFFS[diffIdx].start;
let best = 0;

const ST = {MENU:0, PLAY:1, PAUSE:2, OVER:3};
let state = ST.MENU;

const cv = document.getElementById('board');
const ctx = cv.getContext('2d');
const n1 = document.getElementById('next1'), n1x = n1.getContext('2d');
const n2 = document.getElementById('next2'), n2x = n2.getContext('2d');
let CS = 24, DPR = 1, NS = 14;

let grid = [], piece = null, nextQ = [];
let score = 0, lines = 0, level = 1, dropAcc = 0, dropEvery = 1;
let parts = [], clearFlash = [], banner = 0, bannerTxt = '';
let tPrev = 0, tSec = 0, softHold = false;
const isTouch = window.matchMedia('(pointer: coarse)').matches;

function applyLang() {
  document.getElementById('lbl-back').textContent  = t('back');
  document.getElementById('lbl-score').textContent = t('uiScore');
  document.getElementById('lbl-lines').textContent = t('bcsLines');
  document.getElementById('lbl-level').textContent = t('uiLevel');
  document.getElementById('lbl-best').textContent  = t('uiBest');
  document.getElementById('lbl-next').textContent  = t('bcsNext');
  document.getElementById('lbl-pause').textContent = t('uiPaused');
  document.getElementById('lbl-new').textContent   = t('uiNewGame');
  document.getElementById('lbl-s-lines').textContent = t('bcsLines');
  document.getElementById('lbl-s-level').textContent = t('uiLevel');
  document.getElementById('lbl-s-best').textContent  = t('uiBest');
  document.getElementById('res-lbl').textContent   = t('uiScore');
  document.getElementById('lbl-diff').textContent  = t('uiDifficulty');
  document.getElementById('foot').textContent      = t('bcsDesc');
  // dostupnost: prelozene popisy dotykovych tlacidiel
  const aria = {left:'bcsLeftAria', rot:'bcsRotateAria', right:'bcsRightAria', drop:'bcsDropAria'};
  document.querySelectorAll('#pad button').forEach(b => {
    const k = aria[b.dataset.act];
    if (k) b.setAttribute('aria-label', t(k));
  });
  document.getElementById('btn-pause').setAttribute('aria-label', t('bcsPauseAria'));
}
function rnd(a, b) { return a + Math.random() * (b - a); }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

// ── rozmery ─────────────────────────────────────────────────────────────
function layout() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const vw = window.innerWidth || 360, vh = window.innerHeight || 640;
  const page = document.getElementById('page'), wrap = document.getElementById('board-wrap');
  let others = 0, n = 0;
  for (const el of page.children) { n++; if (el !== wrap) others += el.offsetHeight; }
  const cs = getComputedStyle(page);
  const gap = parseFloat(cs.rowGap) || 8;
  const pad = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  const chrome = others + gap * Math.max(0, n - 1) + pad + 22;
  let boxW, boxH;
  if (vh <= 600 && vw > vh) { boxW = vw - 340; boxH = vh - 30; }
  else { boxW = Math.min(vw, 560) - 34; boxH = Math.max(200, vh - chrome); }
  CS = Math.max(10, Math.floor(Math.min(boxW / COLS, boxH / ROWS)));
  cv.style.width = CS * COLS + 'px';
  cv.style.height = CS * ROWS + 'px';
  cv.width = Math.round(CS * COLS * DPR);
  cv.height = Math.round(CS * ROWS * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  NS = clamp(Math.round(CS * 0.5), 8, 16);
  for (const [c, x] of [[n1, n1x], [n2, n2x]]) {
    c.style.width = NS * 4 + 'px';
    c.style.height = NS * 2 + 'px';
    c.width = Math.round(NS * 4 * DPR);
    c.height = Math.round(NS * 2 * DPR);
    x.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  drawNext();
}
window.addEventListener('resize', () => { layout(); draw(); });
window.addEventListener('orientationchange', () => setTimeout(() => { layout(); draw(); }, 250));

// ── hra ─────────────────────────────────────────────────────────────────
function newPiece() {
  const s = SHAPES[Math.floor(Math.random() * SHAPES.length)];
  return {rgb: s.rgb, cells: s.cells.map(c => [...c])};
}
function spawn() {
  while (nextQ.length < PREVIEW + 1) nextQ.push(newPiece());
  const p = nextQ.shift();
  const maxX = Math.max(...p.cells.map(c => c[0]));
  const minY = Math.min(...p.cells.map(c => c[1]));
  piece = {rgb: p.rgb, cells: p.cells, x: Math.floor((COLS - maxX - 1) / 2), y: -minY};
  drawNext();
  if (hits(piece.cells, piece.x, piece.y)) finish();
}
function hits(cells, px, py) {
  for (const [cxx, cyy] of cells) {
    const gx = px + cxx, gy = py + cyy;
    if (gx < 0 || gx >= COLS || gy >= ROWS) return true;
    if (gy >= 0 && grid[gy][gx]) return true;
  }
  return false;
}
function rotated(p) {
  // otocenie o 90° okolo tvaru, potom zarovnanie do lavého horného rohu
  const cells = p.cells.map(([x, y]) => [-y, x]);
  const minX = Math.min(...cells.map(c => c[0]));
  const minY = Math.min(...cells.map(c => c[1]));
  return cells.map(([x, y]) => [x - minX, y - minY]);
}
function tryRotate() {
  if (state !== ST.PLAY || !piece) return;
  const cells = rotated(piece);
  for (const dx of [0, -1, 1, -2, 2]) {
    if (!hits(cells, piece.x + dx, piece.y)) { piece.cells = cells; piece.x += dx; return; }
  }
}
function move(dx) {
  if (state !== ST.PLAY || !piece) return;
  if (!hits(piece.cells, piece.x + dx, piece.y)) piece.x += dx;
}
function ghostY() {
  let y = piece.y;
  while (!hits(piece.cells, piece.x, y + 1)) y++;
  return y;
}
function lockPiece() {
  for (const [cxx, cyy] of piece.cells) {
    const gy = piece.y + cyy, gx = piece.x + cxx;
    if (gy >= 0) grid[gy][gx] = piece.rgb;
  }
  clearLines();
  piece = null;
  spawn();
}
function softDrop() {
  if (state !== ST.PLAY || !piece) return;
  if (!hits(piece.cells, piece.x, piece.y + 1)) { piece.y++; score += SOFT_PT; syncHud(); }
  else lockPiece();
}
function hardDrop() {
  if (state !== ST.PLAY || !piece) return;
  const gy = ghostY();
  score += (gy - piece.y) * HARD_PT;
  piece.y = gy;
  // prach pri dopade
  for (const [cxx, cyy] of piece.cells) {
    if (cyy !== Math.max(...piece.cells.map(c => c[1]))) continue;
    for (let i = 0; i < 4; i++) {
      parts.push({x: (piece.x + cxx + 0.5) * CS, y: (piece.y + cyy + 1) * CS,
        vx: rnd(-60, 60), vy: rnd(-120, -20), life: rnd(0.2, 0.45), max: 0.45, rgb: piece.rgb});
    }
  }
  lockPiece();
  syncHud();
}
function clearLines() {
  const full = [];
  for (let r = 0; r < ROWS; r++) if (grid[r].every(v => v)) full.push(r);
  if (!full.length) return;
  for (const r of full) {
    clearFlash.push({row: r, life: 0.28});
    for (let c = 0; c < COLS; c++) {
      for (let i = 0; i < 3; i++) {
        parts.push({x: (c + 0.5) * CS, y: (r + 0.5) * CS, vx: rnd(-140, 140), vy: rnd(-160, 40),
          life: rnd(0.3, 0.7), max: 0.7, rgb: grid[r][c] || '255,255,255'});
      }
    }
  }
  for (const r of full) { grid.splice(r, 1); grid.unshift(new Array(COLS).fill(null)); }
  const n = full.length;
  score += LINE_PTS[Math.min(n, 4)];
  lines += n;
  const lv = Math.floor(lines / 10) + DIFFS[diffIdx].start;
  if (lv > level) { level = lv; banner = 1.4; bannerTxt = t('uiLevel') + ' ' + level; }
  dropEvery = Math.max(0.09, 1.0 - (level - 1) * 0.08);
  syncHud();
}
function finish() {
  state = ST.OVER;
  const rec = score > best;
  if (rec) { best = score; try { localStorage.setItem(bestKey(), best); } catch (e) {} }
  document.getElementById('res-score').textContent = score;
  const note = document.getElementById('res-note');
  note.textContent = rec ? t('uiNewRecord') : t('uiBest') + ' ' + best;
  note.classList.toggle('record', rec);
  document.getElementById('st-lines').textContent = lines;
  document.getElementById('st-level').textContent = level;
  document.getElementById('st-best').textContent = best;
  setHud('hud-best', best);
  document.getElementById('best-pill').classList.toggle('record', rec);
  setTimeout(() => showCard('over'), 400);
}
function showCard(mode) {
  document.getElementById('ov-title').textContent = mode === 'over' ? t('uiGameOver') : t('bcsTitle');
  document.getElementById('brand').style.display = mode === 'over' ? 'none' : '';
  document.getElementById('result').classList.toggle('show', mode === 'over');
  document.getElementById('ov-stats').classList.toggle('show', mode === 'over');
  document.getElementById('ov-hint').textContent = t('bcsDesc');
  document.getElementById('ov-play').textContent = mode === 'over' ? t('uiPlayAgain') : t('uiStart');
  document.getElementById('overlay').classList.remove('hide');
}
function newGame() {
  grid = Array.from({length: ROWS}, () => new Array(COLS).fill(null));
  nextQ = [];
  score = 0; lines = 0; level = DIFFS[diffIdx].start;
  dropEvery = Math.max(0.09, 1.0 - (level - 1) * 0.08);
  dropAcc = 0;
  parts = []; clearFlash = []; banner = 0;
  state = ST.PLAY;
  document.getElementById('overlay').classList.add('hide');
  loadBest();
  layout();
  spawn();
  syncHud(true);
}
function togglePause() {
  if (state === ST.PLAY) state = ST.PAUSE;
  else if (state === ST.PAUSE) state = ST.PLAY;
}

// ── HUD ─────────────────────────────────────────────────────────────────
const hudVal = {};
function setHud(id, v) {
  if (hudVal[id] === v) return;
  hudVal[id] = v;
  const el = document.getElementById(id);
  el.textContent = v;
  el.classList.remove('bump');
  void el.offsetWidth;
  el.classList.add('bump');
  setTimeout(() => el.classList.remove('bump'), 180);
}
function syncHud(force) {
  setHud('hud-score', score);
  setHud('hud-lines', lines);
  setHud('hud-level', level);
  if (force) setHud('hud-best', best);
}
function loadBest() {
  best = +(localStorage.getItem(bestKey()) || 0);
  setHud('hud-best', best);
  document.getElementById('best-pill').classList.remove('record');
}

// ── update ──────────────────────────────────────────────────────────────
function update(dt) {
  tSec += dt;
  for (const p of parts) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 420 * dt; }
  if (parts.length) parts = parts.filter(p => p.life > 0);
  for (const f of clearFlash) f.life -= dt;
  if (clearFlash.length) clearFlash = clearFlash.filter(f => f.life > 0);
  if (banner > 0) banner = Math.max(0, banner - dt);
  if (state !== ST.PLAY) return;
  dropAcc += dt;
  const every = softHold ? Math.min(dropEvery, 0.05) : dropEvery;
  while (dropAcc >= every && state === ST.PLAY) {
    dropAcc -= every;
    if (!piece) break;
    if (!hits(piece.cells, piece.x, piece.y + 1)) { piece.y++; if (softHold) { score += SOFT_PT; syncHud(); } }
    else lockPiece();
  }
}

// ── kreslenie ───────────────────────────────────────────────────────────
function cell(x, y, rgb, alpha, ghost) {
  const px = x * CS, py = y * CS, r = Math.max(2, CS * 0.16);
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(px + 1, py + 1, CS - 2, CS - 2, r);
  else ctx.rect(px + 1, py + 1, CS - 2, CS - 2);
  if (ghost) {
    ctx.strokeStyle = 'rgba(' + rgb + ',0.55)';
    ctx.lineWidth = Math.max(1.2, CS * 0.07);
    ctx.setLineDash([CS * 0.22, CS * 0.16]);
    ctx.stroke();
    ctx.setLineDash([]);
  } else {
    const g = ctx.createLinearGradient(px, py, px + CS, py + CS);
    g.addColorStop(0, 'rgba(' + rgb + ',1)');
    g.addColorStop(1, 'rgba(' + rgb + ',0.68)');
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.28)';
    ctx.lineWidth = 1;
    ctx.stroke();
    // horny lesk
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(px + CS * 0.18, py + CS * 0.14, CS * 0.64, CS * 0.16, CS * 0.08);
    else ctx.rect(px + CS * 0.18, py + CS * 0.14, CS * 0.64, CS * 0.16);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function draw() {
  const W = CS * COLS, H = CS * ROWS;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0a0f1c');
  bg.addColorStop(1, '#060912');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(255,255,255,0.045)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let c = 1; c < COLS; c++) { ctx.moveTo(c * CS, 0); ctx.lineTo(c * CS, H); }
  for (let r = 1; r < ROWS; r++) { ctx.moveTo(0, r * CS); ctx.lineTo(W, r * CS); }
  ctx.stroke();

  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (grid[r] && grid[r][c]) cell(c, r, grid[r][c]);
  }
  if (piece && state !== ST.OVER) {
    const gy = ghostY();
    if (gy !== piece.y) for (const [cxx, cyy] of piece.cells) {
      if (gy + cyy >= 0) cell(piece.x + cxx, gy + cyy, piece.rgb, 1, true);
    }
    for (const [cxx, cyy] of piece.cells) {
      if (piece.y + cyy >= 0) cell(piece.x + cxx, piece.y + cyy, piece.rgb);
    }
  }
  for (const f of clearFlash) {
    ctx.fillStyle = 'rgba(255,255,255,' + (f.life / 0.28 * 0.75) + ')';
    ctx.fillRect(0, f.row * CS, W, CS);
  }
  for (const p of parts) {
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = 'rgb(' + p.rgb + ')';
    ctx.fillRect(p.x - CS * 0.08, p.y - CS * 0.08, CS * 0.16, CS * 0.16);
  }
  ctx.globalAlpha = 1;

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if (banner > 0) {
    ctx.globalAlpha = clamp(Math.min(banner / 0.3, 1), 0, 1);
    ctx.font = '800 ' + Math.round(CS * 1.05) + "px 'Syne',sans-serif";
    ctx.fillStyle = '#ffd23d';
    ctx.shadowColor = 'rgba(255,210,61,0.7)';
    ctx.shadowBlur = 18;
    ctx.fillText(bannerTxt, W / 2, H * 0.35);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }
  if (state === ST.PAUSE) {
    ctx.fillStyle = 'rgba(3,4,8,0.72)';
    ctx.fillRect(0, 0, W, H);
    ctx.font = '800 ' + Math.round(CS * 1.1) + "px 'Syne',sans-serif";
    ctx.fillStyle = '#ff8a3d';
    ctx.fillText(t('uiPaused'), W / 2, H / 2);
  }
}
function drawNext() {
  for (const [i, x, c] of [[0, n1x, n1], [1, n2x, n2]]) {
    x.setTransform(DPR, 0, 0, DPR, 0, 0);
    x.clearRect(0, 0, NS * 4, NS * 2);
    const p = nextQ[i];
    if (!p) continue;
    const w = Math.max(...p.cells.map(q => q[0])) + 1;
    const h = Math.max(...p.cells.map(q => q[1])) + 1;
    const ox = (4 - w) / 2, oy = (2 - h) / 2;
    for (const [qx, qy] of p.cells) {
      const px = (ox + qx) * NS, py = (oy + qy) * NS;
      x.beginPath();
      if (x.roundRect) x.roundRect(px + 1, py + 1, NS - 2, NS - 2, Math.max(1.5, NS * 0.16));
      else x.rect(px + 1, py + 1, NS - 2, NS - 2);
      const g = x.createLinearGradient(px, py, px + NS, py + NS);
      g.addColorStop(0, 'rgba(' + p.rgb + ',1)');
      g.addColorStop(1, 'rgba(' + p.rgb + ',0.66)');
      x.fillStyle = g;
      x.fill();
    }
  }
}

function frame(ts) {
  requestAnimationFrame(frame);
  const dt = tPrev ? Math.min(0.05, (ts - tPrev) / 1000) : 0;
  tPrev = ts;
  update(dt);
  draw();
}

// ── vstup ───────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.code === 'Escape' || e.code === 'KeyP') { e.preventDefault(); togglePause(); return; }
  if ((state === ST.MENU || state === ST.OVER) && (e.code === 'Enter')) { e.preventDefault(); newGame(); return; }
  if (state === ST.PAUSE) { state = ST.PLAY; return; }
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') { e.preventDefault(); move(-1); }
  else if (e.code === 'ArrowRight' || e.code === 'KeyD') { e.preventDefault(); move(1); }
  else if (e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); tryRotate(); }
  else if (e.code === 'ArrowDown' || e.code === 'KeyS') { e.preventDefault(); softHold = true; }
  else if (e.code === 'Space') { e.preventDefault(); hardDrop(); }
});
document.addEventListener('keyup', e => {
  if (e.code === 'ArrowDown' || e.code === 'KeyS') softHold = false;
});
// dotykove ovladanie s opakovanim pri drzani
document.querySelectorAll('#pad button').forEach(b => {
  const act = b.dataset.act;
  let rep = null, hold = null;
  const fire = () => {
    if (act === 'left') move(-1);
    else if (act === 'right') move(1);
    else if (act === 'rot') tryRotate();
    else if (act === 'drop') hardDrop();
  };
  const down = e => {
    e.preventDefault();
    if (state === ST.PAUSE) { state = ST.PLAY; return; }
    fire();
    if (act === 'left' || act === 'right') {
      hold = setTimeout(() => { rep = setInterval(fire, 70); }, 220);
    }
  };
  const up = () => { clearTimeout(hold); clearInterval(rep); rep = null; };
  b.addEventListener('pointerdown', down, {passive: false});
  b.addEventListener('pointerup', up);
  b.addEventListener('pointerleave', up);
  b.addEventListener('pointercancel', up);
});
// swipe na doske: dolava/doprava posun, dole rychly pad, tuk = otocenie
let sw = null;
cv.addEventListener('pointerdown', e => { sw = [e.clientX, e.clientY, Date.now()]; if (state === ST.PAUSE) state = ST.PLAY; }, {passive: true});
cv.addEventListener('pointerup', e => {
  if (!sw) return;
  const dx = e.clientX - sw[0], dy = e.clientY - sw[1], dtm = Date.now() - sw[2];
  sw = null;
  if (Math.abs(dx) < 20 && Math.abs(dy) < 20 && dtm < 350) { tryRotate(); return; }
  if (Math.abs(dx) > Math.abs(dy)) {
    const steps = Math.round(dx / Math.max(18, CS));
    for (let i = 0; i < Math.abs(steps); i++) move(steps > 0 ? 1 : -1);
  } else if (dy > 24) hardDrop();
});
document.getElementById('btn-pause').addEventListener('click', togglePause);
document.getElementById('btn-new').addEventListener('click', newGame);
document.getElementById('ov-play').addEventListener('click', newGame);
window.addEventListener('blur', () => { if (state === ST.PLAY) state = ST.PAUSE; softHold = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === ST.PLAY) state = ST.PAUSE; });

// ── obtiaznost (startovacia uroven) ─────────────────────────────────────
function buildDiffs(el) {
  el.textContent = '';
  DIFFS.forEach((d, i) => {
    const b = document.createElement('button');
    b.textContent = t(d.key) + ' ' + d.start;
    b.className = i === diffIdx ? 'active' : '';
    b.addEventListener('click', () => { diffIdx = i; syncDiffs(); newGame(); });
    el.appendChild(b);
  });
}
function syncDiffs() {
  [document.getElementById('diff-row'), document.getElementById('diff-row2')].forEach(row => {
    [...row.children].forEach((b, j) => b.className = j === diffIdx ? 'active' : '');
  });
}

applyLang();
buildDiffs(document.getElementById('diff-row'));
buildDiffs(document.getElementById('diff-row2'));
if (isTouch) document.body.classList.add('touch');
grid = Array.from({length: ROWS}, () => new Array(COLS).fill(null));
nextQ = [newPiece(), newPiece()];
level = DIFFS[diffIdx].start;
layout();
loadBest();
syncHud(true);
showCard('menu');
requestAnimationFrame(frame);
</script>
