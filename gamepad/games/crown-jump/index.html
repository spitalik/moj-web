<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Crown Jump · GamePad</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<script src="../../i18n.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0b0d08;--text:#f5f7ee;--muted:rgba(245,247,238,0.42);--dim:rgba(245,247,238,0.18);
  --border:rgba(255,255,255,0.09);--border-h:rgba(255,255,255,0.18);
  --c:#fbbf24;--c2:#a3e635;--gold:#ffd166;
}
html,body{background:var(--bg);height:100%;font-family:'DM Sans',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;user-select:none;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none;}
button,a{touch-action:manipulation;font-family:'DM Sans',sans-serif;}

#back-btn{position:fixed;top:14px;left:14px;z-index:60;display:flex;align-items:center;gap:7px;background:rgba(16,19,12,0.72);backdrop-filter:blur(8px);border:1px solid var(--border);color:var(--muted);padding:7px 14px;border-radius:100px;text-decoration:none;font-size:12px;font-weight:500;transition:border-color .18s,color .18s;}
#back-btn:hover,#back-btn:active{border-color:var(--border-h);color:var(--text);}
@media(max-width:520px){#back-btn{top:9px;left:9px;padding:6px 11px;font-size:11px;}}

#hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:12;display:none;align-items:center;gap:7px;pointer-events:none;}
#hud.show{display:flex;}
.pill{display:flex;align-items:center;gap:8px;padding:5px 12px;border-radius:100px;background:rgba(16,19,12,0.62);backdrop-filter:blur(8px);border:1px solid var(--border);font-size:9px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;color:var(--dim);white-space:nowrap;}
.pill b{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;letter-spacing:0;font-variant-numeric:tabular-nums;color:var(--c);transition:transform .18s;}
.pill.opp b{color:#cbd5e1;}
.pill.best b{color:rgba(245,247,238,.72);}
.pill.best.record{border-color:rgba(251,191,36,.45);}
.pill b.bump{transform:scale(1.3);}
.dot{width:9px;height:9px;border-radius:50%;}
.dot.me{background:linear-gradient(160deg,#fde68a,#d97706);box-shadow:0 0 8px rgba(251,191,36,.75);}
.dot.ai{background:linear-gradient(160deg,#64748b,#111827);box-shadow:0 0 8px rgba(100,116,139,.6);}
@media(max-width:640px){#hud{left:auto;right:16px;transform:none;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 150px);}.pill span.txt{display:none;}.pill{padding:4px 10px;}.pill b{font-size:15px;}.pill.best{display:none;}}

#tools{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:14;display:none;gap:8px;}
#tools.show{display:flex;}
.tool{display:flex;align-items:center;gap:7px;padding:9px 18px;border-radius:100px;background:rgba(16,19,12,0.7);backdrop-filter:blur(8px);border:1px solid var(--border);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;transition:all .16s;}
.tool:hover{border-color:var(--border-h);color:var(--text);}
.tool svg{width:14px;height:14px;}

#overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(ellipse at center,rgba(16,19,12,0.8) 0%,rgba(5,6,4,0.95) 78%);backdrop-filter:blur(6px);}
#overlay.hide{display:none;}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:11px;width:100%;max-width:334px;padding:26px 24px 24px;border-radius:24px;background:linear-gradient(165deg,rgba(255,255,255,0.06),rgba(255,255,255,0.015));border:1px solid var(--border-h);box-shadow:0 30px 70px -28px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.07);animation:pop .34s cubic-bezier(.2,1.4,.4,1);}
@keyframes pop{from{transform:scale(.9) translateY(8px);opacity:0;}to{transform:none;opacity:1;}}
.card::before{content:'';position:absolute;inset:-1px;border-radius:24px;padding:1px;background:linear-gradient(120deg,rgba(251,191,36,.5),transparent 42%,transparent 58%,rgba(163,230,53,.5));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;}
.emoji{font-size:34px;line-height:1;filter:drop-shadow(0 6px 16px rgba(251,191,36,.4));}
.ttl{font-family:'Syne',sans-serif;font-weight:800;font-size:24px;letter-spacing:-.5px;text-align:center;background:linear-gradient(110deg,var(--c) 5%,#fff 52%,var(--c2) 95%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
#result{display:none;flex-direction:column;align-items:center;gap:1px;}
#result.show{display:flex;}
#res-lbl{font-size:9px;letter-spacing:2.2px;text-transform:uppercase;color:var(--dim);}
#res-score{font-family:'Syne',sans-serif;font-weight:800;font-size:50px;line-height:1.05;letter-spacing:-2px;color:var(--c);text-shadow:0 0 30px rgba(251,191,36,.4);}
#res-note{font-size:11.5px;font-weight:600;color:var(--muted);}
#res-note.record{color:var(--gold);}
#ov-stats{display:none;width:100%;grid-template-columns:1fr 1fr;gap:7px;}
#ov-stats.show{display:grid;}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:14px;background:rgba(255,255,255,0.04);border:1px solid var(--border);}
.stat i{font-size:8px;font-style:normal;letter-spacing:1.3px;text-transform:uppercase;color:var(--dim);text-align:center;}
.stat b{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;color:var(--c2);white-space:nowrap;}
.seg{display:flex;gap:3px;background:rgba(255,255,255,0.04);border:1px solid var(--border);padding:3px;border-radius:100px;}
.seg button{background:transparent;border:none;color:var(--muted);padding:6px 15px;border-radius:100px;font-size:11.5px;font-weight:600;cursor:pointer;transition:color .16s,background .16s;}
.seg button:hover{color:var(--text);}
.seg button.active{background:rgba(251,191,36,0.16);color:#ffe9b0;box-shadow:inset 0 0 0 1px rgba(251,191,36,0.42);}
.lbl{font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);}
.hint{font-size:11.5px;line-height:1.55;color:var(--muted);text-align:center;}
.play-btn{margin-top:3px;width:100%;padding:13px 30px;border-radius:100px;border:1px solid rgba(251,191,36,.5);background:linear-gradient(180deg,rgba(251,191,36,.24),rgba(251,191,36,.1));color:#ffeec2;font-size:14px;font-weight:600;cursor:pointer;transition:all .18s;}
.play-btn:hover{background:linear-gradient(180deg,rgba(251,191,36,.34),rgba(251,191,36,.16));color:#fff;box-shadow:0 0 24px -6px rgba(251,191,36,.5);}
.play-btn:active{transform:translateY(1px);}
@media(max-height:640px){.card{gap:8px;padding:18px 20px;}.emoji{display:none;}.ttl{font-size:20px;}#res-score{font-size:38px;}}
@media (max-height:820px){#overlay{align-items:flex-start !important;overflow-y:auto !important;}}
</style>
</head>
<body>
<a href="../../index.html" id="back-btn">
  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
  <span id="lbl-back"></span>
</a>

<canvas id="c"></canvas>

<div id="hud">
  <div class="pill"><span class="dot me"></span><span class="txt" id="lbl-you"></span><b id="hud-you">12</b></div>
  <div class="pill opp"><span class="dot ai"></span><span class="txt" id="lbl-opp"></span><b id="hud-opp">12</b></div>
  <div class="pill best" id="best-pill"><span class="txt" id="lbl-best"></span><b id="hud-best">0</b></div>
</div>

<div id="tools">
  <button class="tool" id="btn-new">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    <span id="lbl-new"></span></button>
</div>

<div id="overlay">
  <div class="card">
    <div id="brand"><div class="emoji">&#9819;</div></div>
    <div class="ttl" id="ov-title"></div>
    <div id="result">
      <div id="res-lbl"></div>
      <div id="res-score">0</div>
      <div id="res-note"></div>
    </div>
    <div id="ov-stats">
      <div class="stat"><i id="lbl-s-you"></i><b id="st-you">0</b></div>
      <div class="stat"><i id="lbl-s-opp"></i><b id="st-opp">0</b></div>
    </div>
    <div class="lbl" id="lbl-diff"></div>
    <div class="seg" id="diff-row"></div>
    <div class="hint" id="ov-hint"></div>
    <button class="play-btn" id="ov-play"></button>
  </div>
</div>

<script>
// ── nastavenia ──────────────────────────────────────────────────────────
const N = 8;
const HUMAN = 'r', AI = 'b';
const DIFFS = [
  {key:'diffEasy',   depth:1, mult:1,   slip:0.35},
  {key:'diffMedium', depth:4, mult:1.5, slip:0},
  {key:'diffHard',   depth:6, mult:2,   slip:0},
];
let diffIdx = 1;
const bestKey = () => 'crownjump_best_' + diffIdx;
let best = 0;

const ST = {MENU:0, PLAY:1, OVER:2};
let state = ST.MENU;

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, CELL = 44, OX = 0, OY = 0;

let board = [], turn = HUMAN, score = 0, busy = false, idleMoves = 0;
let selected = null, partial = [], candidates = [], lastMove = null;
let msg = '', flash = 0, tPrev = 0, tSec = 0;
const isTouch = window.matchMedia('(pointer: coarse)').matches;

function applyLang() {
  document.getElementById('lbl-back').textContent   = t('back');
  document.getElementById('lbl-you').textContent    = t('uiYou');
  document.getElementById('lbl-opp').textContent    = t('uiOpponent');
  document.getElementById('lbl-best').textContent   = t('uiBest');
  document.getElementById('lbl-s-you').textContent  = t('uiYou');
  document.getElementById('lbl-s-opp').textContent  = t('uiOpponent');
  document.getElementById('res-lbl').textContent    = t('uiScore');
  document.getElementById('lbl-diff').textContent   = t('uiDifficulty');
  document.getElementById('lbl-new').textContent    = t('uiNewGame');
  document.title = t('crjTitle') + ' · GamePad';
}
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const D = () => DIFFS[diffIdx];

// ── rozmery: doska sa vzdy zmesti ───────────────────────────────────────
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth || 360;
  H = window.innerHeight || 640;
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const top = 56, bot = 76;
  const availW = W - 20, availH = Math.max(160, H - top - bot);
  CELL = Math.floor(Math.min(availW, availH) / N);
  CELL = clamp(CELL, 20, 74);
  OX = Math.round((W - CELL * N) / 2);
  OY = Math.round(top + (availH - CELL * N) / 2);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 250));

// ── pravidla (anglicke damy) ────────────────────────────────────────────
const inB = (r, c) => r >= 0 && r < N && c >= 0 && c < N;
const cloneBoard = bd => bd.map(row => row.map(cell => cell ? {p: cell.p, king: cell.king} : null));

function makeBoard() {
  const bd = Array.from({length: N}, () => Array(N).fill(null));
  for (let r = 0; r < 3; r++)
    for (let c = 0; c < N; c++)
      if ((r + c) % 2 === 1) bd[r][c] = {p: AI, king: false};
  for (let r = N - 3; r < N; r++)
    for (let c = 0; c < N; c++)
      if ((r + c) % 2 === 1) bd[r][c] = {p: HUMAN, king: false};
  return bd;
}
function stepDirs(piece) {
  if (piece.king) return [[-1, -1], [-1, 1], [1, -1], [1, 1]];
  return piece.p === HUMAN ? [[-1, -1], [-1, 1]] : [[1, -1], [1, 1]];
}
// premena uprostred skoku tah ukoncuje (standardne anglicke damy)
const promotes = (piece, r) => !piece.king && ((piece.p === HUMAN && r === 0) || (piece.p === AI && r === N - 1));

function collectJumps(bd, r, c, piece, taken, path, out) {
  let extended = false;
  for (const [dr, dc] of stepDirs(piece)) {
    const mr = r + dr, mc = c + dc, lr = r + dr * 2, lc = c + dc * 2;
    if (!inB(lr, lc) || bd[lr][lc] !== null) continue;
    const mid = bd[mr] && bd[mr][mc];
    if (!mid || mid.p === piece.p) continue;
    if (taken.some(([tr, tc]) => tr === mr && tc === mc)) continue;
    extended = true;
    const save = bd[mr][mc];
    bd[mr][mc] = null; bd[r][c] = null; bd[lr][lc] = piece;
    path.push([lr, lc]); taken.push([mr, mc]);
    if (promotes(piece, lr)) out.push({path: path.slice(), captured: taken.slice()});
    else collectJumps(bd, lr, lc, piece, taken, path, out);
    path.pop(); taken.pop();
    bd[lr][lc] = null; bd[r][c] = piece; bd[mr][mc] = save;
  }
  if (!extended && path.length > 1) out.push({path: path.slice(), captured: taken.slice()});
}

function legalMoves(bd, player) {
  const jumps = [], plain = [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const piece = bd[r][c];
    if (!piece || piece.p !== player) continue;
    collectJumps(bd, r, c, piece, [], [[r, c]], jumps);
    for (const [dr, dc] of stepDirs(piece)) {
      const nr = r + dr, nc = c + dc;
      if (inB(nr, nc) && bd[nr][nc] === null) plain.push({path: [[r, c], [nr, nc]], captured: []});
    }
  }
  return jumps.length ? jumps : plain;   // branie je povinne
}
function applyMove(bd, mv) {
  const [sr, sc] = mv.path[0];
  const [er, ec] = mv.path[mv.path.length - 1];
  const piece = bd[sr][sc];
  bd[sr][sc] = null;
  for (const [cr, cc] of mv.captured) bd[cr][cc] = null;
  if (promotes(piece, er)) piece.king = true;
  bd[er][ec] = piece;
}
function countPieces(bd, player) {
  let n = 0;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++)
    if (bd[r][c] && bd[r][c].p === player) n++;
  return n;
}

// ── protivnik ───────────────────────────────────────────────────────────
function evaluate(bd) {
  let s = 0;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const piece = bd[r][c];
    if (!piece) continue;
    let v = piece.king ? 180 : 100;
    if (!piece.king) v += (piece.p === AI ? r : N - 1 - r) * 5;   // postup dopredu
    if (c === 0 || c === N - 1) v += 4;                           // kraj je bezpecny
    s += piece.p === AI ? v : -v;
  }
  return s;
}
function search(bd, player, depth, alpha, beta) {
  const moves = legalMoves(bd, player);
  if (!moves.length) return player === AI ? -100000 : 100000;     // kto nema tah, prehrava
  if (depth === 0) return evaluate(bd);
  if (player === AI) {
    let value = -Infinity;
    for (const mv of moves) {
      const nb = cloneBoard(bd); applyMove(nb, mv);
      value = Math.max(value, search(nb, HUMAN, depth - 1, alpha, beta));
      alpha = Math.max(alpha, value);
      if (alpha >= beta) break;
    }
    return value;
  }
  let value = Infinity;
  for (const mv of moves) {
    const nb = cloneBoard(bd); applyMove(nb, mv);
    value = Math.min(value, search(nb, AI, depth - 1, alpha, beta));
    beta = Math.min(beta, value);
    if (alpha >= beta) break;
  }
  return value;
}
function aiPick(moves) {
  if (D().slip && Math.random() < D().slip) return moves[Math.floor(Math.random() * moves.length)];
  const depth = D().depth;
  let bestVal = -Infinity, pool = [];
  for (const mv of moves) {
    const nb = cloneBoard(board); applyMove(nb, mv);
    const v = search(nb, HUMAN, depth - 1, -Infinity, Infinity);
    if (v > bestVal) { bestVal = v; pool = [mv]; }
    else if (v === bestVal) pool.push(mv);
  }
  return pool[Math.floor(Math.random() * pool.length)];
}
function aiTurn() {
  if (state !== ST.PLAY) return;
  const moves = legalMoves(board, AI);
  if (!moves.length) { finish(); return; }
  const mv = aiPick(moves);
  idleMoves = mv.captured.length ? 0 : idleMoves + 1;
  applyMove(board, mv);
  lastMove = mv;
  flash = 0.7;
  turn = HUMAN;
  busy = false;
  afterMove();
}

function afterMove() {
  syncHud();
  if (state !== ST.PLAY) return;
  if (countPieces(board, HUMAN) === 0 || countPieces(board, AI) === 0) { finish(); return; }
  if (!legalMoves(board, turn).length) { finish(); return; }
  if (idleMoves >= 40) { finish(true); return; }
  if (turn === HUMAN) {
    msg = t('uiYourTurn');
  } else {
    msg = t('uiOppTurn');
    busy = true;
    // dam prehliadacu snimku na prekreslenie, nez zacnem pocitat
    setTimeout(() => requestAnimationFrame(() => setTimeout(aiTurn, 0)), 260);
  }
}

function finish(forcedDraw) {
  state = ST.OVER;
  busy = true;
  const mine = countPieces(board, HUMAN), theirs = countPieces(board, AI);
  let result;
  if (forcedDraw) result = 'draw';
  else if (theirs === 0 || !legalMoves(board, AI).length) result = 'win';
  else if (mine === 0 || !legalMoves(board, HUMAN).length) result = 'lose';
  else result = 'draw';

  if (result === 'win') score = Math.round((120 + mine * 12) * D().mult);
  else if (result === 'draw') score = Math.round(40 * D().mult);
  else score = 0;

  const rec = score > best;
  if (rec) { best = score; try { localStorage.setItem(bestKey(), best); } catch (e) {} }
  document.getElementById('res-score').textContent = score;
  const note = document.getElementById('res-note');
  note.textContent = rec && score > 0 ? t('uiNewRecord') : t('uiBest') + ' ' + best;
  note.classList.toggle('record', rec && score > 0);
  document.getElementById('st-you').textContent = mine;
  document.getElementById('st-opp').textContent = theirs;
  showCard(result === 'win' ? t('uiYouWin') : result === 'lose' ? t('uiYouLose') : t('uiDraw'));
  setHud('hud-best', best);
  document.getElementById('best-pill').classList.toggle('record', rec && score > 0);
  msg = '';
}

// ── kolo ────────────────────────────────────────────────────────────────
function loadBest() {
  best = +(localStorage.getItem(bestKey()) || 0);
  setHud('hud-best', best);
  document.getElementById('best-pill').classList.remove('record');
}
function newGame() {
  board = makeBoard();
  turn = HUMAN; score = 0; busy = false; idleMoves = 0;
  selected = null; partial = []; candidates = []; lastMove = null; flash = 0;
  state = ST.PLAY;
  msg = t('uiYourTurn');
  document.getElementById('overlay').classList.add('hide');
  document.getElementById('hud').classList.add('show');
  document.getElementById('tools').classList.add('show');
  loadBest();
  syncHud();
}
function showCard(title) {
  const over = state === ST.OVER;
  document.getElementById('ov-title').textContent = over ? title : t('crjTitle');
  document.getElementById('brand').style.display = over ? 'none' : '';
  document.getElementById('result').classList.toggle('show', over);
  document.getElementById('ov-stats').classList.toggle('show', over);
  document.getElementById('ov-hint').textContent = t('crjRules');
  document.getElementById('ov-play').textContent = over ? t('uiPlayAgain') : t('uiStart');
  document.getElementById('overlay').classList.remove('hide');
  document.getElementById('hud').classList.remove('show');
  document.getElementById('tools').classList.remove('show');
}

// ── HUD ─────────────────────────────────────────────────────────────────
const hudVal = {};
function setHud(id, v) {
  if (hudVal[id] === v) return;
  hudVal[id] = v;
  const el = document.getElementById(id);
  el.textContent = v;
  el.classList.remove('bump');
  void el.offsetWidth;
  el.classList.add('bump');
  setTimeout(() => el.classList.remove('bump'), 180);
}
function syncHud() {
  if (!board.length) return;
  setHud('hud-you', countPieces(board, HUMAN));
  setHud('hud-opp', countPieces(board, AI));
}

// ── ovladanie ───────────────────────────────────────────────────────────
function cellAt(e) {
  return [Math.floor((e.clientY - OY) / CELL), Math.floor((e.clientX - OX) / CELL)];
}
function selectPiece(r, c) {
  const all = legalMoves(board, HUMAN);
  const mine = all.filter(m => m.path[0][0] === r && m.path[0][1] === c);
  if (!mine.length) return false;
  selected = [r, c]; partial = [[r, c]]; candidates = mine;
  msg = mine[0].captured.length ? t('crjMustCapture') : t('uiYourTurn');
  return true;
}
function onTap(e) {
  if (state !== ST.PLAY || busy || turn !== HUMAN) return;
  const [r, c] = cellAt(e);
  if (!inB(r, c)) return;

  if (selected) {
    const step = candidates.filter(m => {
      const nxt = m.path[partial.length];
      return nxt && nxt[0] === r && nxt[1] === c;
    });
    if (step.length) {
      partial.push([r, c]);
      const done = step.find(m => m.path.length === partial.length);
      if (done) {
        idleMoves = done.captured.length ? 0 : idleMoves + 1;
        applyMove(board, done);
        lastMove = done;
        flash = 0.5;
        selected = null; partial = []; candidates = [];
        turn = AI;
        afterMove();
        return;
      }
      candidates = step;
      return;
    }
  }
  selected = null; partial = []; candidates = [];
  selectPiece(r, c);
}
cv.addEventListener('pointerdown', onTap);
document.getElementById('btn-new').addEventListener('click', newGame);
document.getElementById('ov-play').addEventListener('click', newGame);
document.addEventListener('keydown', e => {
  if ((state === ST.MENU || state === ST.OVER) && (e.code === 'Enter' || e.code === 'Space')) {
    e.preventDefault(); newGame();
  }
});

// ── obtiaznost ──────────────────────────────────────────────────────────
const row = document.getElementById('diff-row');
DIFFS.forEach((d, i) => {
  const b = document.createElement('button');
  b.textContent = t(d.key);
  b.className = i === diffIdx ? 'active' : '';
  b.addEventListener('click', () => {
    diffIdx = i;
    [...row.children].forEach((c, j) => c.className = j === i ? 'active' : '');
    loadBest();
    if (state === ST.OVER) document.getElementById('res-note').textContent = t('uiBest') + ' ' + best;
  });
  row.appendChild(b);
});

// ── kreslenie ───────────────────────────────────────────────────────────
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function drawPiece(r, c, piece) {
  const cx = OX + c * CELL + CELL / 2, cy = OY + r * CELL + CELL / 2, rad = CELL * 0.37;
  ctx.beginPath(); ctx.arc(cx, cy + 2.5, rad, 0, 6.2832);
  ctx.fillStyle = 'rgba(0,0,0,0.42)'; ctx.fill();
  const g = ctx.createRadialGradient(cx - rad * 0.35, cy - rad * 0.4, rad * 0.1, cx, cy, rad);
  if (piece.p === HUMAN) { g.addColorStop(0, '#fde68a'); g.addColorStop(1, '#c2650a'); }
  else { g.addColorStop(0, '#8b98ab'); g.addColorStop(1, '#111827'); }
  ctx.beginPath(); ctx.arc(cx, cy, rad, 0, 6.2832);
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, rad * 0.72, 0, 6.2832);
  ctx.strokeStyle = piece.p === HUMAN ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 1; ctx.stroke();
  if (piece.king) {
    ctx.fillStyle = piece.p === HUMAN ? 'rgba(120,53,15,.95)' : 'rgba(226,232,240,.95)';
    ctx.font = '800 ' + Math.round(CELL * 0.34) + 'px Syne, serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('♛', cx, cy + 1);
  }
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, '#0b0d08');
  bg.addColorStop(1, '#141709');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  const bw = CELL * N;
  // ram dosky
  ctx.fillStyle = 'rgba(255,255,255,0.03)';
  roundRect(OX - 9, OY - 9, bw + 18, bw + 18, 18);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.09)';
  ctx.lineWidth = 1;
  ctx.stroke();

  if (!board.length) return;

  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const x = OX + c * CELL, y = OY + r * CELL;
    ctx.fillStyle = (r + c) % 2 === 1 ? '#2f2a1d' : '#c9bda0';
    ctx.fillRect(x, y, CELL, CELL);
  }

  // posledny tah protivnika
  if (lastMove && flash > 0) {
    ctx.globalAlpha = clamp(flash, 0, 1) * 0.55;
    ctx.fillStyle = '#a3e635';
    for (const [r, c] of lastMove.path) ctx.fillRect(OX + c * CELL, OY + r * CELL, CELL, CELL);
    ctx.globalAlpha = 1;
  }

  // dostupne polia
  if (state === ST.PLAY && turn === HUMAN && !busy) {
    if (selected) {
      const [sr, sc] = partial[partial.length - 1];
      ctx.fillStyle = 'rgba(251,191,36,.32)';
      ctx.fillRect(OX + sc * CELL, OY + sr * CELL, CELL, CELL);
      for (const m of candidates) {
        const nxt = m.path[partial.length];
        if (!nxt) continue;
        ctx.beginPath();
        ctx.arc(OX + nxt[1] * CELL + CELL / 2, OY + nxt[0] * CELL + CELL / 2, CELL * 0.16, 0, 6.2832);
        ctx.fillStyle = 'rgba(252,211,77,.85)'; ctx.fill();
      }
    } else {
      const starts = new Set(legalMoves(board, HUMAN).map(m => m.path[0].join(',')));
      ctx.strokeStyle = 'rgba(252,211,77,' + (0.4 + 0.22 * Math.sin(tSec * 3)) + ')';
      ctx.lineWidth = 2;
      for (const key of starts) {
        const [r, c] = key.split(',').map(Number);
        ctx.strokeRect(OX + c * CELL + 2, OY + r * CELL + 2, CELL - 4, CELL - 4);
      }
    }
  }

  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++)
    if (board[r][c]) drawPiece(r, c, board[r][c]);

  if (msg) {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = busy ? 'rgba(203,213,225,0.85)' : '#fbbf24';
    ctx.font = '600 ' + Math.round(clamp(CELL * 0.3, 12, 17)) + 'px "DM Sans", sans-serif';
    ctx.fillText(msg, W / 2, Math.min(H - 46, OY + bw + 24));
  }
}

function frame(ts) {
  requestAnimationFrame(frame);
  const dt = tPrev ? Math.min(0.05, (ts - tPrev) / 1000) : 0;
  tPrev = ts;
  tSec += dt;
  if (flash > 0) flash = Math.max(0, flash - dt);
  draw();
}

applyLang();
resize();
loadBest();
board = makeBoard();
showCard('');
requestAnimationFrame(frame);
</script>
