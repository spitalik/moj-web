<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tilt Maze · GamePad</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<script src="../../i18n.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#050f0d;--text:#eafff9;--muted:rgba(234,255,249,0.42);--dim:rgba(234,255,249,0.18);
  --border:rgba(255,255,255,0.09);--border-h:rgba(255,255,255,0.18);
  --c:#2dd4bf;--c2:#a3e635;--gold:#ffd166;--warn:#f87171;
}
html,body{background:var(--bg);height:100%;font-family:'DM Sans',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;user-select:none;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none;}
button,a{touch-action:manipulation;font-family:'DM Sans',sans-serif;}

#back-btn{position:fixed;top:14px;left:14px;z-index:60;display:flex;align-items:center;gap:7px;background:rgba(8,20,18,0.72);backdrop-filter:blur(8px);border:1px solid var(--border);color:var(--muted);padding:7px 14px;border-radius:100px;text-decoration:none;font-size:12px;font-weight:500;transition:border-color .18s,color .18s;}
#back-btn:hover,#back-btn:active{border-color:var(--border-h);color:var(--text);}
@media(max-width:520px){#back-btn{top:9px;left:9px;padding:6px 11px;font-size:11px;}}

#hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:12;display:none;align-items:center;gap:7px;pointer-events:none;}
#hud.show{display:flex;}
.pill{display:flex;align-items:center;gap:8px;padding:5px 12px;border-radius:100px;background:rgba(8,20,18,0.62);backdrop-filter:blur(8px);border:1px solid var(--border);font-size:9px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;color:var(--dim);white-space:nowrap;}
.pill b{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;letter-spacing:0;font-variant-numeric:tabular-nums;color:var(--c);transition:transform .18s;}
.pill.falls b{color:var(--warn);}
.pill.best b{color:rgba(234,255,249,.72);}
.pill.best.record{border-color:rgba(45,212,191,.45);}
.pill b.bump{transform:scale(1.3);}
@media(max-width:620px){#hud{left:auto;right:54px;transform:none;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 150px);}.pill span.txt{display:none;}.pill{padding:4px 10px;}.pill b{font-size:15px;}.pill.best{display:none;}}

#pause-btn{position:fixed;top:14px;right:14px;z-index:60;display:none;align-items:center;justify-content:center;width:36px;height:36px;background:rgba(8,20,18,0.7);backdrop-filter:blur(8px);border:1px solid var(--border);color:var(--muted);border-radius:50%;cursor:pointer;}
#pause-btn.show{display:flex;}
#pause-btn:hover{border-color:var(--border-h);color:var(--text);}

#stick{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:14;display:none;width:118px;height:118px;border-radius:50%;background:rgba(8,20,18,0.6);backdrop-filter:blur(8px);border:1px solid var(--border);touch-action:none;}
body.touch #stick.show{display:block;}
#knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:linear-gradient(160deg,rgba(45,212,191,.5),rgba(45,212,191,.18));border:1px solid rgba(45,212,191,.6);box-shadow:0 0 18px -4px rgba(45,212,191,.7);}
#stick.hide{display:none !important;}
body.sidestick #stick{left:26px;bottom:26px;transform:none;}
#tilt-hint{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:14;display:none;padding:8px 16px;border-radius:100px;background:rgba(8,20,18,0.6);backdrop-filter:blur(8px);border:1px solid var(--border);color:var(--muted);font-size:11px;font-weight:600;}
#tilt-hint.show{display:block;}

#overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(ellipse at center,rgba(8,20,18,0.8) 0%,rgba(2,7,6,0.95) 78%);backdrop-filter:blur(6px);}
#overlay.hide{display:none;}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:11px;width:100%;max-width:334px;padding:26px 24px 24px;border-radius:24px;background:linear-gradient(165deg,rgba(255,255,255,0.06),rgba(255,255,255,0.015));border:1px solid var(--border-h);box-shadow:0 30px 70px -28px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.07);animation:pop .34s cubic-bezier(.2,1.4,.4,1);}
@keyframes pop{from{transform:scale(.9) translateY(8px);opacity:0;}to{transform:none;opacity:1;}}
.card::before{content:'';position:absolute;inset:-1px;border-radius:24px;padding:1px;background:linear-gradient(120deg,rgba(45,212,191,.5),transparent 42%,transparent 58%,rgba(163,230,53,.5));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;}
.emoji{font-size:34px;line-height:1;filter:drop-shadow(0 6px 16px rgba(45,212,191,.4));}
.ttl{font-family:'Syne',sans-serif;font-weight:800;font-size:24px;letter-spacing:-.5px;text-align:center;background:linear-gradient(110deg,var(--c) 5%,#fff 52%,var(--c2) 95%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
#result{display:none;flex-direction:column;align-items:center;gap:1px;}
#result.show{display:flex;}
#res-lbl{font-size:9px;letter-spacing:2.2px;text-transform:uppercase;color:var(--dim);}
#res-score{font-family:'Syne',sans-serif;font-weight:800;font-size:50px;line-height:1.05;letter-spacing:-2px;color:var(--c);text-shadow:0 0 30px rgba(45,212,191,.45);}
#res-note{font-size:11.5px;font-weight:600;color:var(--muted);}
#res-note.record{color:var(--gold);}
#ov-stats{display:none;width:100%;grid-template-columns:1fr 1fr;gap:7px;}
#ov-stats.show{display:grid;}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:14px;background:rgba(255,255,255,0.04);border:1px solid var(--border);}
.stat i{font-size:8px;font-style:normal;letter-spacing:1.3px;text-transform:uppercase;color:var(--dim);text-align:center;}
.stat b{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;color:var(--c2);white-space:nowrap;}
.seg{display:flex;gap:3px;background:rgba(255,255,255,0.04);border:1px solid var(--border);padding:3px;border-radius:100px;}
.seg button{background:transparent;border:none;color:var(--muted);padding:6px 15px;border-radius:100px;font-size:11.5px;font-weight:600;cursor:pointer;transition:color .16s,background .16s;}
.seg button:hover{color:var(--text);}
.seg button.active{background:rgba(45,212,191,0.16);color:#c8fff3;box-shadow:inset 0 0 0 1px rgba(45,212,191,0.42);}
.lbl{font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);}
.hint{font-size:11.5px;line-height:1.55;color:var(--muted);text-align:center;}
.play-btn{margin-top:3px;width:100%;padding:13px 30px;border-radius:100px;border:1px solid rgba(45,212,191,.5);background:linear-gradient(180deg,rgba(45,212,191,.24),rgba(45,212,191,.1));color:#d6fff7;font-size:14px;font-weight:600;cursor:pointer;transition:all .18s;}
.play-btn:hover{background:linear-gradient(180deg,rgba(45,212,191,.34),rgba(45,212,191,.16));color:#fff;box-shadow:0 0 24px -6px rgba(45,212,191,.5);}
.play-btn:active{transform:translateY(1px);}
#mode-row{display:none;}
body.touch #mode-row{display:flex;}
@media(max-height:640px){.card{gap:8px;padding:18px 20px;}.emoji{display:none;}.ttl{font-size:20px;}#res-score{font-size:38px;}}
@media (max-height:820px){#overlay{align-items:flex-start !important;overflow-y:auto !important;}}
</style>
</head>
<body>
<a href="../../index.html" id="back-btn">
  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
  <span id="lbl-back"></span>
</a>

<canvas id="c"></canvas>

<div id="hud">
  <div class="pill"><span class="txt" id="lbl-time"></span><b id="hud-time">0.0</b></div>
  <div class="pill falls"><span class="txt" id="lbl-falls"></span><b id="hud-falls">0</b></div>
  <div class="pill best" id="best-pill"><span class="txt" id="lbl-best"></span><b id="hud-best">0</b></div>
</div>

<button id="pause-btn" aria-label="pause">
  <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1.4"/><rect x="14" y="4" width="4" height="16" rx="1.4"/></svg>
</button>

<div id="stick"><div id="knob"></div></div>
<div id="tilt-hint"><span id="lbl-tilt-hint"></span></div>

<div id="overlay">
  <div class="card">
    <div id="brand"><div class="emoji">&#127921;</div></div>
    <div class="ttl" id="ov-title"></div>
    <div id="result">
      <div id="res-lbl"></div>
      <div id="res-score">0</div>
      <div id="res-note"></div>
    </div>
    <div id="ov-stats">
      <div class="stat"><i id="lbl-s-time"></i><b id="st-time">0</b></div>
      <div class="stat"><i id="lbl-s-falls"></i><b id="st-falls">0</b></div>
    </div>
    <div class="lbl" id="lbl-diff"></div>
    <div class="seg" id="diff-row"></div>
    <div class="lbl" id="lbl-mode" style="display:none"></div>
    <div class="seg" id="mode-row"></div>
    <div class="hint" id="ov-hint"></div>
    <button class="play-btn" id="ov-play"></button>
  </div>
</div>

<script>
// ── nastavenia ──────────────────────────────────────────────────────────
const DIFFS = [
  {key:'diffEasy',   n:8,  holes:3},
  {key:'diffMedium', n:10, holes:5},
  {key:'diffHard',   n:12, holes:8},
];
let diffIdx = 1;
const bestKey = () => 'tiltmaze_best_' + diffIdx;
let best = 0;

const ACCEL = 520;         // px/s2 na jednotku vychylky (x SCL)
const MAXV = 300;          // px/s (x SCL)
const FRICT = 0.965;       // za snimku pri 60 Hz, prepocitane na dt
const P_BASE = 200, P_SEC = 3, P_FALL = 20, P_MIN = 10;

const ST = {MENU:0, COUNT:1, PLAY:2, PAUSE:3, WIN:4};
let state = ST.MENU;

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, BS = 320, OX = 0, OY = 0, SCL = 1;

let N = 10, cell = 32;
let wallRight = [], wallDown = [], walls = [];
let ball = {x:0, y:0, r:6, vx:0, vy:0};
let goal = {x:0, y:0, r:10};
let holes = [], parts = [], trail = [];
let score = 0, falls = 0, elapsed = 0;
let cdLeft = 0, goFlash = 0, shake = 0, winFlash = 0;
let inputX = 0, inputY = 0, keyX = 0, keyY = 0, joyX = 0, joyY = 0, tiltX = 0, tiltY = 0;
let tiltOn = false, tiltReady = false;
let tSec = 0, tPrev = 0;
const keys = {};
const isTouch = window.matchMedia('(pointer: coarse)').matches;

function applyLang() {
  document.getElementById('lbl-back').textContent    = t('back');
  document.getElementById('lbl-time').textContent    = t('tltTime');
  document.getElementById('lbl-falls').textContent   = t('tltFalls');
  document.getElementById('lbl-best').textContent    = t('uiBest');
  document.getElementById('lbl-s-time').textContent  = t('tltTime');
  document.getElementById('lbl-s-falls').textContent = t('tltFalls');
  document.getElementById('res-lbl').textContent     = t('uiScore');
  document.getElementById('lbl-diff').textContent    = t('uiDifficulty');
  document.getElementById('lbl-mode').textContent    = t('tltControl');
  document.getElementById('lbl-tilt-hint').textContent = t('tltTiltHint');
  document.title = t('tltTitle') + ' · GamePad';
}
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const D = () => DIFFS[diffIdx];

// ── rozmery: doska je stvorec, ktory sa zmesti do okna ──────────────────
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth || 360;
  H = window.innerHeight || 640;
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const top = 56;
  let bot = isTouch ? (tiltOn ? 76 : 156) : 30;
  let side = false;
  if (isTouch && !tiltOn && W > H * 1.2) {
    // na sirku sa palica zmesti k boku dosky, netreba pas dole
    const t2 = Math.floor(Math.min(W - 24, H - top - 30));
    if ((W - t2) / 2 >= 150) { bot = 30; side = true; }
  }
  document.body.classList.toggle('sidestick', side);
  const availW = W - 24, availH = Math.max(150, H - top - bot);
  const newBS = Math.floor(Math.min(availW, availH));
  const k = BS ? newBS / BS : 1;
  BS = newBS;
  cell = BS / N;
  OX = Math.round((W - BS) / 2);
  OY = Math.round(top + (availH - BS) / 2);
  SCL = BS / 320;
  // stavbu prepocitam do novej velkosti, nech sa pri otoceni nic nerozsype
  if (walls.length) {
    ball.x *= k; ball.y *= k; ball.r = Math.max(4, cell * 0.22);
    goal.x *= k; goal.y *= k; goal.r = cell * 0.32;
    for (const h of holes) { h.x *= k; h.y *= k; h.r = cell * 0.26; }
    walls = buildWallRects(N, wallRight, wallDown);
    trail = [];
  }
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 250));

// ── labyrint ────────────────────────────────────────────────────────────
function mulberry32(seed) {
  let a = seed;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function generateMaze(n) {
  const rg = mulberry32(Date.now() ^ Math.floor(Math.random() * 1e9));
  const wr = Array.from({length: n}, () => Array(n).fill(true));
  const wd = Array.from({length: n}, () => Array(n).fill(true));
  const visited = Array.from({length: n}, () => Array(n).fill(false));
  const stack = [[0, 0]];
  visited[0][0] = true;
  while (stack.length) {
    const [r, c] = stack[stack.length - 1];
    const nbs = [];
    if (r > 0 && !visited[r - 1][c]) nbs.push(['U', r - 1, c]);
    if (r < n - 1 && !visited[r + 1][c]) nbs.push(['D', r + 1, c]);
    if (c > 0 && !visited[r][c - 1]) nbs.push(['L', r, c - 1]);
    if (c < n - 1 && !visited[r][c + 1]) nbs.push(['R', r, c + 1]);
    if (!nbs.length) { stack.pop(); continue; }
    const [dir, nr, nc] = nbs[Math.floor(rg() * nbs.length)];
    if (dir === 'U') wd[nr][nc] = false;
    else if (dir === 'D') wd[r][c] = false;
    else if (dir === 'L') wr[nr][nc] = false;
    else if (dir === 'R') wr[r][c] = false;
    visited[nr][nc] = true;
    stack.push([nr, nc]);
  }
  // par prierazov, aby chodby neboli klaustrofobne
  const extra = Math.floor(n * n * 0.12);
  for (let i = 0; i < extra; i++) {
    const r = Math.floor(rg() * n), c = Math.floor(rg() * n);
    if (rg() < 0.5 && c < n - 1) wr[r][c] = false;
    else if (r < n - 1) wd[r][c] = false;
  }
  return {wr, wd};
}
function buildWallRects(n, wr, wd) {
  const T = Math.max(3, cell * 0.14);
  const rects = [];
  for (let r = 0; r <= n; r++) for (let c = 0; c < n; c++) {
    const border = (r === 0 || r === n);
    if (border || (r > 0 && r < n && wd[r - 1][c]))
      rects.push({x: c * cell - T / 2, y: r * cell - T / 2, w: cell + T, h: T});
  }
  for (let c = 0; c <= n; c++) for (let r = 0; r < n; r++) {
    const border = (c === 0 || c === n);
    if (border || (c > 0 && c < n && wr[r][c - 1]))
      rects.push({x: c * cell - T / 2, y: r * cell - T / 2, w: T, h: cell + T});
  }
  return rects;
}
function farthestCell(n, wr, wd, start) {
  const dist = Array.from({length: n}, () => Array(n).fill(-1));
  dist[start[0]][start[1]] = 0;
  const q = [start];
  let far = start, maxD = 0, head = 0;
  while (head < q.length) {
    const [r, c] = q[head++];
    const d = dist[r][c];
    if (d > maxD) { maxD = d; far = [r, c]; }
    const nbs = [];
    if (c < n - 1 && !wr[r][c]) nbs.push([r, c + 1]);
    if (c > 0 && !wr[r][c - 1]) nbs.push([r, c - 1]);
    if (r < n - 1 && !wd[r][c]) nbs.push([r + 1, c]);
    if (r > 0 && !wd[r - 1][c]) nbs.push([r - 1, c]);
    for (const [nr, nc] of nbs) if (dist[nr][nc] === -1) { dist[nr][nc] = d + 1; q.push([nr, nc]); }
  }
  return far;
}
const cellCenter = (r, c) => ({x: c * cell + cell / 2, y: r * cell + cell / 2});

// ── kolo ────────────────────────────────────────────────────────────────
function newMaze() {
  const cfg = D();
  N = cfg.n;
  cell = BS / N;
  const {wr, wd} = generateMaze(N);
  wallRight = wr; wallDown = wd;
  walls = buildWallRects(N, wr, wd);

  const startCell = [0, 0];
  const goalCell = farthestCell(N, wr, wd, startCell);
  const sp = cellCenter(startCell[0], startCell[1]);
  ball = {x: sp.x, y: sp.y, r: Math.max(4, cell * 0.22), vx: 0, vy: 0};
  const gp = cellCenter(goalCell[0], goalCell[1]);
  goal = {x: gp.x, y: gp.y, r: cell * 0.32};

  holes = [];
  const used = new Set([startCell.join(','), goalCell.join(',')]);
  let guard = 0;
  while (holes.length < cfg.holes && guard < 400) {
    guard++;
    const r = Math.floor(Math.random() * N), c = Math.floor(Math.random() * N);
    const key = r + ',' + c;
    if (used.has(key)) continue;
    if (Math.hypot(r - startCell[0], c - startCell[1]) < 2) continue;
    used.add(key);
    const p = cellCenter(r, c);
    holes.push({x: p.x, y: p.y, r: cell * 0.26, ph: rnd(0, 6.28)});
  }

  score = 0; falls = 0; elapsed = 0;
  parts = []; trail = [];
  shake = 0; winFlash = 0; goFlash = 0;
  cdLeft = 1.6;
  state = ST.COUNT;
  document.getElementById('overlay').classList.add('hide');
  document.getElementById('hud').classList.add('show');
  document.getElementById('pause-btn').classList.add('show');
  document.getElementById('stick').classList.add('show');
  document.getElementById('stick').classList.toggle('hide', tiltOn);
  document.getElementById('tilt-hint').classList.toggle('show', isTouch && tiltOn);
  loadBest();
  syncHud(true);
}
function loadBest() {
  best = +(localStorage.getItem(bestKey()) || 0);
  setHud('hud-best', best);
  document.getElementById('best-pill').classList.remove('record');
}
function respawn() {
  const p = cellCenter(0, 0);
  ball.x = p.x; ball.y = p.y; ball.vx = 0; ball.vy = 0;
  trail = [];
}
function win() {
  state = ST.WIN;
  const penalty = Math.round(elapsed * P_SEC) + falls * P_FALL;
  score = Math.max(P_MIN, P_BASE - penalty);
  winFlash = 1;
  for (let i = 0; i < 26; i++) {
    const a = rnd(0, 6.2832), sp = rnd(40, 210) * SCL;
    parts.push({x: goal.x, y: goal.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: rnd(0.4, 0.8), max: 0.8, rgb: Math.random() < 0.5 ? '45,212,191' : '163,230,53', sz: rnd(1.6, 3.4) * SCL});
  }
  const rec = score > best;
  if (rec) { best = score; try { localStorage.setItem(bestKey(), best); } catch (e) {} }
  document.getElementById('res-score').textContent = score;
  const note = document.getElementById('res-note');
  note.textContent = rec ? t('uiNewRecord') : t('uiBest') + ' ' + best;
  note.classList.toggle('record', rec);
  document.getElementById('st-time').textContent = elapsed.toFixed(1) + 's';
  document.getElementById('st-falls').textContent = falls;
  setHud('hud-best', best);
  document.getElementById('best-pill').classList.toggle('record', rec);
  showCard('win');
}
function showCard(mode) {
  const win = mode === 'win';
  document.getElementById('ov-title').textContent = win ? t('tltWin') : t('tltTitle');
  document.getElementById('brand').style.display = win ? 'none' : '';
  document.getElementById('result').classList.toggle('show', win);
  document.getElementById('ov-stats').classList.toggle('show', win);
  document.getElementById('lbl-mode').style.display = isTouch ? '' : 'none';
  document.getElementById('ov-hint').textContent = isTouch ? t('tltRules') : t('tltKeys');
  document.getElementById('ov-play').textContent = win ? t('tltNewMaze') : t('uiStart');
  document.getElementById('overlay').classList.remove('hide');
  document.getElementById('hud').classList.remove('show');
  document.getElementById('pause-btn').classList.remove('show');
  document.getElementById('stick').classList.remove('show');
  document.getElementById('tilt-hint').classList.remove('show');
}
function togglePause() {
  if (state === ST.PLAY) state = ST.PAUSE;
  else if (state === ST.PAUSE) { cdLeft = 1.2; state = ST.COUNT; }
}

// ── HUD ─────────────────────────────────────────────────────────────────
const hudVal = {};
function setHud(id, v) {
  if (hudVal[id] === v) return;
  hudVal[id] = v;
  const el = document.getElementById(id);
  el.textContent = v;
  el.classList.remove('bump');
  void el.offsetWidth;
  el.classList.add('bump');
  setTimeout(() => el.classList.remove('bump'), 180);
}
function syncHud(force) {
  setHud('hud-time', elapsed.toFixed(1));
  setHud('hud-falls', falls);
  if (force) setHud('hud-best', best);
}

// ── fyzika ──────────────────────────────────────────────────────────────
function resolveWalls() {
  for (const rect of walls) {
    const cx = clamp(ball.x, rect.x, rect.x + rect.w);
    const cy = clamp(ball.y, rect.y, rect.y + rect.h);
    const dx = ball.x - cx, dy = ball.y - cy;
    const d2 = dx * dx + dy * dy;
    if (d2 < ball.r * ball.r && d2 > 0.0001) {
      const d = Math.sqrt(d2);
      const nx = dx / d, ny = dy / d;
      ball.x += nx * (ball.r - d);
      ball.y += ny * (ball.r - d);
      const vn = ball.vx * nx + ball.vy * ny;
      if (vn < 0) { ball.vx -= vn * nx * 1.3; ball.vy -= vn * ny * 1.3; }
    } else if (d2 <= 0.0001) {
      ball.x += (Math.random() - 0.5) * 0.5;
    }
  }
}

function update(dt) {
  tSec += dt;
  for (const p of parts) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  if (parts.length) parts = parts.filter(p => p.life > 0);
  for (const h of holes) h.ph += dt * 2;
  if (shake > 0) shake = Math.max(0, shake - dt * 3.2);
  if (goFlash > 0) goFlash = Math.max(0, goFlash - dt * 2);
  if (winFlash > 0) winFlash = Math.max(0, winFlash - dt);

  if (state === ST.COUNT) {
    cdLeft -= dt;
    if (cdLeft <= 0) { state = ST.PLAY; goFlash = 0.5; }
    return;
  }
  if (state !== ST.PLAY) return;

  elapsed += dt;
  syncHud();

  // vstup: klavesy, palica alebo naklonenie
  inputX = clamp(keyX + joyX + (tiltOn ? tiltX : 0), -1, 1);
  inputY = clamp(keyY + joyY + (tiltOn ? tiltY : 0), -1, 1);

  ball.vx += inputX * ACCEL * SCL * dt;
  ball.vy += inputY * ACCEL * SCL * dt;
  const fr = Math.pow(FRICT, dt * 60);
  ball.vx *= fr; ball.vy *= fr;
  const maxv = MAXV * SCL;
  const sp = Math.hypot(ball.vx, ball.vy);
  if (sp > maxv) { ball.vx = ball.vx / sp * maxv; ball.vy = ball.vy / sp * maxv; }

  // rozdelim krok, nech gulicka nepreleti stenu pri velkom dt
  const steps = Math.max(1, Math.ceil(sp * dt / (ball.r * 0.6)));
  for (let i = 0; i < steps; i++) {
    ball.x += ball.vx * dt / steps;
    ball.y += ball.vy * dt / steps;
    resolveWalls();
  }
  ball.x = clamp(ball.x, ball.r, BS - ball.r);
  ball.y = clamp(ball.y, ball.r, BS - ball.r);

  trail.push({x: ball.x, y: ball.y, life: 0.35});
  for (const p of trail) p.life -= dt;
  if (trail.length) trail = trail.filter(p => p.life > 0);

  for (const h of holes) {
    if (Math.hypot(ball.x - h.x, ball.y - h.y) < h.r * 0.7) {
      falls++;
      shake = 1;
      for (let i = 0; i < 14; i++) {
        const a = rnd(0, 6.2832), s = rnd(20, 120) * SCL;
        parts.push({x: h.x, y: h.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(0.25, 0.5), max: 0.5, rgb: '248,113,113', sz: rnd(1.4, 2.8) * SCL});
      }
      respawn();
      syncHud();
      break;
    }
  }
  if (Math.hypot(ball.x - goal.x, ball.y - goal.y) < goal.r * 0.62) win();
}

// ── kreslenie ───────────────────────────────────────────────────────────
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, '#050f0d');
  bg.addColorStop(1, '#0a1a18');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  // doska sa jemne nakláňa podľa vstupu
  const tilt = clamp(inputX, -1, 1) * 0.035;
  ctx.translate(OX + BS / 2, OY + BS / 2);
  ctx.rotate(tilt);
  if (shake > 0.02) {
    const s = shake * shake * 8 * SCL;
    ctx.translate(rnd(-s, s), rnd(-s, s));
  }
  ctx.translate(-BS / 2, -BS / 2);

  // podlozka
  ctx.fillStyle = 'rgba(255,255,255,0.03)';
  roundRect(-10, -10, BS + 20, BS + 20, 20);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.09)';
  ctx.lineWidth = 1;
  ctx.stroke();
  const floor = ctx.createLinearGradient(0, 0, 0, BS);
  floor.addColorStop(0, '#0a1620');
  floor.addColorStop(1, '#0d2028');
  ctx.fillStyle = floor;
  ctx.fillRect(0, 0, BS, BS);
  ctx.strokeStyle = 'rgba(45,212,191,0.05)';
  ctx.lineWidth = 1;
  for (let i = 1; i < N; i++) {
    ctx.beginPath(); ctx.moveTo(i * cell, 0); ctx.lineTo(i * cell, BS); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * cell); ctx.lineTo(BS, i * cell); ctx.stroke();
  }

  // ciel
  const pulse = 1 + Math.sin(tSec * 3.2) * 0.09;
  const gg = ctx.createRadialGradient(goal.x, goal.y, 0, goal.x, goal.y, goal.r * 2.6 * pulse);
  gg.addColorStop(0, 'rgba(163,230,53,0.34)');
  gg.addColorStop(1, 'rgba(163,230,53,0)');
  ctx.fillStyle = gg;
  ctx.beginPath(); ctx.arc(goal.x, goal.y, goal.r * 2.6 * pulse, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = 'rgba(163,230,53,0.75)';
  ctx.lineWidth = 2 * SCL;
  ctx.beginPath(); ctx.arc(goal.x, goal.y, goal.r * pulse, 0, 6.2832); ctx.stroke();
  ctx.fillStyle = 'rgba(214,255,143,0.9)';
  ctx.beginPath(); ctx.arc(goal.x, goal.y, goal.r * 0.42 * pulse, 0, 6.2832); ctx.fill();

  // priepasti
  for (const h of holes) {
    const g = ctx.createRadialGradient(h.x, h.y, 0, h.x, h.y, h.r);
    g.addColorStop(0, '#000');
    g.addColorStop(0.72, '#1b0708');
    g.addColorStop(1, '#48161a');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = 'rgba(248,113,113,' + (0.5 + 0.25 * Math.sin(h.ph)) + ')';
    ctx.lineWidth = 1.4 * SCL;
    ctx.stroke();
  }

  // steny
  for (const w of walls) {
    const g = ctx.createLinearGradient(w.x, w.y, w.x + w.w, w.y + w.h);
    g.addColorStop(0, '#3f5a63');
    g.addColorStop(1, '#1d3038');
    ctx.fillStyle = g;
    roundRect(w.x, w.y, w.w, w.h, Math.min(w.w, w.h) * 0.45);
    ctx.fill();
  }

  // chvost gulicky
  for (const p of trail) {
    ctx.globalAlpha = clamp(p.life / 0.35, 0, 1) * 0.4;
    ctx.fillStyle = '#2dd4bf';
    ctx.beginPath(); ctx.arc(p.x, p.y, ball.r * 0.7, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // gulicka
  ctx.beginPath(); ctx.arc(ball.x, ball.y + 2 * SCL, ball.r, 0, 6.2832);
  ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fill();
  const bgd = ctx.createRadialGradient(ball.x - ball.r * 0.35, ball.y - ball.r * 0.4, ball.r * 0.1, ball.x, ball.y, ball.r);
  bgd.addColorStop(0, '#f0fffb');
  bgd.addColorStop(1, '#12a396');
  ctx.fillStyle = bgd;
  ctx.shadowColor = '#2dd4bf'; ctx.shadowBlur = 12 * SCL;
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, 6.2832); ctx.fill();
  ctx.shadowBlur = 0;

  for (const p of parts) {
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = 'rgb(' + p.rgb + ')';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.sz, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // ── stavove texty
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (state === ST.COUNT) {
    const n = Math.ceil(cdLeft);
    const frac = cdLeft - Math.floor(cdLeft);
    ctx.globalAlpha = 0.35 + 0.55 * frac;
    ctx.fillStyle = '#eafff9';
    ctx.font = '800 ' + Math.round(Math.min(W, H) * 0.2) + 'px Syne, sans-serif';
    ctx.fillText(n > 0 ? String(n) : '', W / 2, OY + BS / 2);
    ctx.globalAlpha = 1;
  }
  if (goFlash > 0) {
    ctx.globalAlpha = clamp(goFlash * 2, 0, 1);
    ctx.fillStyle = '#2dd4bf';
    ctx.font = '800 ' + Math.round(Math.min(W, H) * 0.13) + 'px Syne, sans-serif';
    ctx.fillText(t('uiGo'), W / 2, OY + BS / 2);
    ctx.globalAlpha = 1;
  }
  if (state === ST.PAUSE) {
    ctx.fillStyle = 'rgba(4,12,11,0.68)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#eafff9';
    ctx.font = '800 ' + Math.round(Math.min(W, H) * 0.07) + 'px Syne, sans-serif';
    ctx.fillText(t('uiPaused'), W / 2, H / 2);
    ctx.fillStyle = 'rgba(234,255,249,0.42)';
    ctx.font = '600 12px "DM Sans", sans-serif';
    ctx.fillText(t('uiResume'), W / 2, H / 2 + Math.min(W, H) * 0.06);
  }
}

function frame(ts) {
  requestAnimationFrame(frame);
  const dt = tPrev ? Math.min(0.05, (ts - tPrev) / 1000) : 0;
  tPrev = ts;
  update(dt);
  draw();
}

// ── vstup: klavesy ──────────────────────────────────────────────────────
const KEYMAP = {
  ArrowLeft:'l', KeyA:'l', ArrowRight:'r', KeyD:'r',
  ArrowUp:'u', KeyW:'u', ArrowDown:'d', KeyS:'d',
};
function fromKeys() {
  let x = 0, y = 0;
  if (keys.l) x -= 1;
  if (keys.r) x += 1;
  if (keys.u) y -= 1;
  if (keys.d) y += 1;
  if (x && y) { x *= 0.7071; y *= 0.7071; }
  keyX = x; keyY = y;
}
document.addEventListener('keydown', e => {
  if (e.code === 'Escape' || e.code === 'KeyP') {
    e.preventDefault();
    if (state === ST.PLAY || state === ST.PAUSE) togglePause();
    return;
  }
  if (state === ST.PAUSE) { cdLeft = 1.2; state = ST.COUNT; return; }
  if ((state === ST.MENU || state === ST.WIN) && (e.code === 'Enter' || e.code === 'Space')) {
    e.preventDefault(); newMaze(); return;
  }
  const k = KEYMAP[e.code];
  if (!k) return;                        // ostatne klavesy nechavam prehliadacu
  e.preventDefault();
  keys[k] = true;
  fromKeys();
});
document.addEventListener('keyup', e => {
  const k = KEYMAP[e.code];
  if (!k) return;
  keys[k] = false;
  fromKeys();
});

// ── vstup: palica ───────────────────────────────────────────────────────
const stick = document.getElementById('stick');
const knob = document.getElementById('knob');
const JOY_MAX = 34;
let joyId = null;
function joyFrom(e) {
  const rect = stick.getBoundingClientRect();
  const px = e.clientX - (rect.left + rect.width / 2);
  const py = e.clientY - (rect.top + rect.height / 2);
  const d = Math.hypot(px, py);
  const cl = Math.min(d, JOY_MAX);
  const a = Math.atan2(py, px);
  const kx = d ? Math.cos(a) * cl : 0, ky = d ? Math.sin(a) * cl : 0;
  knob.style.transform = 'translate(' + kx + 'px,' + ky + 'px)';
  joyX = kx / JOY_MAX;
  joyY = ky / JOY_MAX;
}
function joyEnd() {
  joyId = null;
  knob.style.transform = 'translate(0,0)';
  joyX = 0; joyY = 0;
}
stick.addEventListener('pointerdown', e => {
  e.preventDefault();
  joyId = e.pointerId;
  stick.setPointerCapture(e.pointerId);
  joyFrom(e);
}, {passive: false});
stick.addEventListener('pointermove', e => { if (joyId === e.pointerId) joyFrom(e); });
stick.addEventListener('pointerup', joyEnd);
stick.addEventListener('pointercancel', joyEnd);
stick.addEventListener('lostpointercapture', joyEnd);

// ── vstup: naklonenie zariadenia ────────────────────────────────────────
function onTilt(e) {
  // gamma = doleva/doprava, beta = dopredu/dozadu (v stupnoch)
  const g = e.gamma, b = e.beta;
  if (g === null || b === null) return;
  tiltReady = true;
  const land = Math.abs(window.orientation || 0) === 90;
  const rawX = land ? b : g;
  const rawY = land ? -g : b - 28;      // v drzani na vysku je telefon mierne naklonený k sebe
  tiltX = clamp(rawX / 22, -1, 1);
  tiltY = clamp(rawY / 22, -1, 1);
}
async function enableTilt() {
  try {
    const DOE = window.DeviceOrientationEvent;
    if (!DOE) return false;
    if (typeof DOE.requestPermission === 'function') {
      const res = await DOE.requestPermission();
      if (res !== 'granted') return false;
    }
    window.addEventListener('deviceorientation', onTilt);
    return true;
  } catch (e) { return false; }
}
function disableTilt() {
  window.removeEventListener('deviceorientation', onTilt);
  tiltX = 0; tiltY = 0; tiltReady = false;
}

// ── ovladacie prvky karty ───────────────────────────────────────────────
const row = document.getElementById('diff-row');
DIFFS.forEach((d, i) => {
  const b = document.createElement('button');
  b.textContent = t(d.key);
  b.className = i === diffIdx ? 'active' : '';
  b.addEventListener('click', () => {
    diffIdx = i;
    [...row.children].forEach((c, j) => c.className = j === i ? 'active' : '');
    loadBest();
    if (state === ST.WIN) document.getElementById('res-note').textContent = t('uiBest') + ' ' + best;
  });
  row.appendChild(b);
});

const modeRow = document.getElementById('mode-row');
[['tltStick', false], ['tltTilt', true]].forEach(([key, wantTilt], i) => {
  const b = document.createElement('button');
  b.textContent = t(key);
  b.className = (wantTilt === tiltOn) ? 'active' : '';
  b.addEventListener('click', async () => {
    if (wantTilt) {
      const ok = await enableTilt();
      if (!ok) { b.textContent = t('tltTiltNo'); setTimeout(() => { b.textContent = t('tltTilt'); }, 1800); return; }
      tiltOn = true;
    } else {
      disableTilt();
      tiltOn = false;
    }
    [...modeRow.children].forEach((c, j) => c.className = j === i ? 'active' : '');
    document.getElementById('stick').classList.toggle('hide', tiltOn);
    document.getElementById('tilt-hint').classList.toggle('show', isTouch && tiltOn && state !== ST.MENU && state !== ST.WIN);
    resize();
  });
  modeRow.appendChild(b);
});

document.getElementById('ov-play').addEventListener('click', newMaze);
document.getElementById('pause-btn').addEventListener('click', togglePause);
cv.addEventListener('pointerdown', () => { if (state === ST.PAUSE) { cdLeft = 1.2; state = ST.COUNT; } });
window.addEventListener('blur', () => {
  if (state === ST.PLAY) state = ST.PAUSE;
  for (const k in keys) keys[k] = false;
  fromKeys(); joyEnd();
});
document.addEventListener('visibilitychange', () => { if (document.hidden && state === ST.PLAY) state = ST.PAUSE; });

applyLang();
if (isTouch) document.body.classList.add('touch');
resize();
loadBest();
newMaze();
state = ST.MENU;
showCard('menu');
requestAnimationFrame(frame);
</script>
</body>
