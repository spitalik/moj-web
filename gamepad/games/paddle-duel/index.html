<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Paddle Duel · GamePad</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<script src="../../i18n.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#04060a;--bg2:#0d1018;--text:#eef6ff;--muted:rgba(238,246,255,0.4);--dim:rgba(238,246,255,0.18);
  --border:rgba(255,255,255,0.08);--border-h:rgba(255,255,255,0.16);
  --p1:#22e0ff;--p2:#ff56c8;
}
html,body{background:var(--bg);height:100%;font-family:'DM Sans',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;user-select:none;overflow:hidden;-webkit-tap-highlight-color:transparent;}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none;}

#back-btn{position:fixed;top:16px;left:16px;z-index:60;display:flex;align-items:center;gap:7px;background:rgba(10,14,22,0.7);backdrop-filter:blur(8px);border:1px solid var(--border);color:var(--muted);padding:7px 14px;border-radius:100px;text-decoration:none;font-size:12px;font-weight:500;transition:border-color .18s,color .18s;}
#back-btn:hover,#back-btn:active{border-color:var(--border-h);color:var(--text);}

/* ── HUD ──────────────────────────────────────────────────── */
#hud{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:12;display:none;align-items:center;gap:10px;pointer-events:none;}
#hud.show{display:flex;}
.tag{display:flex;align-items:center;gap:7px;padding:6px 13px;border-radius:100px;background:rgba(10,14,22,0.6);backdrop-filter:blur(8px);border:1px solid var(--border);font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);}
.tag .chip{width:8px;height:8px;border-radius:2px;}
.tag.l .chip{background:var(--p1);box-shadow:0 0 10px var(--p1);}
.tag.r .chip{background:var(--p2);box-shadow:0 0 10px var(--p2);}
.tag.r{flex-direction:row-reverse;}
.tally{display:flex;align-items:baseline;gap:9px;font-family:'Syne',sans-serif;font-weight:800;font-size:26px;line-height:1;font-variant-numeric:tabular-nums;}
.tally .d{min-width:24px;text-align:center;}
.tally #d1{color:var(--p1);text-shadow:0 0 18px rgba(34,224,255,.5);}
.tally #d2{color:var(--p2);text-shadow:0 0 18px rgba(255,86,200,.5);}
.tally .sl{font-size:15px;color:var(--dim);}
/* na úzkych displejoch nechávam len farebné čipy a skóre, aby HUD nekolidoval so Späť */
@media(max-width:600px){
  #hud{gap:7px;}
  .tag{padding:6px 7px;}
  .tag span:not(.chip){display:none;}
  .tally{font-size:23px;}
}

#pause-btn{position:fixed;top:16px;right:16px;z-index:60;display:none;align-items:center;justify-content:center;width:36px;height:36px;background:rgba(10,14,22,0.7);backdrop-filter:blur(8px);border:1px solid var(--border);color:var(--muted);border-radius:50%;cursor:pointer;transition:border-color .18s,color .18s;}
#pause-btn.show{display:flex;}
#pause-btn:hover{border-color:var(--border-h);color:var(--text);}

/* ── prekryv / menu ───────────────────────────────────────── */
#overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at center,rgba(4,6,10,0.82) 0%,rgba(4,6,10,0.94) 75%);backdrop-filter:blur(6px);}
#overlay.hide{display:none;}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:13px;width:100%;max-width:340px;padding:26px 24px 24px;border-radius:24px;background:linear-gradient(165deg,rgba(255,255,255,0.06),rgba(255,255,255,0.015));border:1px solid var(--border-h);box-shadow:0 30px 70px -28px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.07);animation:pop .34s cubic-bezier(.2,1.4,.4,1);}
@keyframes pop{from{transform:scale(.9) translateY(8px);opacity:0;}to{transform:none;opacity:1;}}
.card::before{content:'';position:absolute;inset:-1px;border-radius:24px;padding:1px;background:linear-gradient(120deg,rgba(34,224,255,.4),transparent 40%,transparent 60%,rgba(255,86,200,.4));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;}

.emoji{font-size:38px;line-height:1;filter:drop-shadow(0 6px 14px rgba(34,224,255,.35));}
.title{font-family:'Syne',sans-serif;font-weight:800;font-size:25px;letter-spacing:-.5px;text-align:center;background:linear-gradient(110deg,var(--p1) 5%,#fff 50%,var(--p2) 95%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}

#result{display:none;flex-direction:column;align-items:center;gap:6px;}
#result.show{display:flex;}
#res-name{font-family:'Syne',sans-serif;font-weight:800;font-size:23px;letter-spacing:-.3px;text-align:center;}
#res-score{font-family:'Syne',sans-serif;font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums;display:flex;gap:10px;align-items:baseline;}
#res-score .sl{font-size:20px;color:var(--dim);}
#rs1{color:var(--p1);}#rs2{color:var(--p2);}

.seg{display:flex;gap:3px;background:rgba(255,255,255,0.04);border:1px solid var(--border);padding:3px;border-radius:100px;}
.seg button{background:transparent;border:none;color:var(--muted);padding:7px 16px;border-radius:100px;font-family:'DM Sans',sans-serif;font-size:11.5px;font-weight:600;cursor:pointer;transition:color .16s,background .16s;}
.seg button:hover{color:var(--text);}
.seg button.active{background:rgba(34,224,255,0.14);color:#8beeff;box-shadow:inset 0 0 0 1px rgba(34,224,255,0.36);}
.seg.small button{padding:6px 13px;font-size:11px;}
.lbl{font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);}
.hint{font-size:11.5px;line-height:1.55;color:var(--muted);text-align:center;}
.play-btn{margin-top:3px;width:100%;padding:13px 30px;border-radius:100px;border:1px solid rgba(34,224,255,.45);background:linear-gradient(180deg,rgba(34,224,255,.22),rgba(34,224,255,.1));color:#c9f6ff;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;letter-spacing:.3px;cursor:pointer;transition:all .18s;}
.play-btn:hover{background:linear-gradient(180deg,rgba(34,224,255,.32),rgba(34,224,255,.16));color:#fff;box-shadow:0 0 24px -6px rgba(34,224,255,.5);}
.play-btn:active{transform:translateY(1px);}
@media(max-height:520px){.card{gap:9px;padding:18px 20px;}.emoji{display:none;}.title{font-size:21px;}}
</style>
</head>
<body>
<a href="../../index.html" id="back-btn">
  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
  <span id="lbl-back"></span>
</a>

<canvas id="c"></canvas>

<div id="hud">
  <div class="tag l"><span class="chip"></span><span id="name1"></span></div>
  <div class="tally"><span class="d" id="d1">0</span><span class="sl">:</span><span class="d" id="d2">0</span></div>
  <div class="tag r"><span class="chip"></span><span id="name2"></span></div>
</div>

<button id="pause-btn" aria-label="pause">
  <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1.4"/><rect x="14" y="4" width="4" height="16" rx="1.4"/></svg>
</button>

<div id="overlay">
  <div class="card">
    <div id="result">
      <div id="res-name"></div>
      <div id="res-score"><span id="rs1">0</span><span class="sl">:</span><span id="rs2">0</span></div>
    </div>
    <div id="brand">
      <div class="emoji">🏓</div>
    </div>
    <div class="title" id="ov-title"></div>

    <div class="seg" id="mode-row">
      <button id="m-cpu" class="active"></button>
      <button id="m-2p"></button>
    </div>

    <div class="lbl" id="lbl-diff"></div>
    <div class="seg small" id="diff-row"></div>

    <div class="hint" id="ov-hint"></div>
    <button class="play-btn" id="ov-play"></button>
  </div>
</div>

<script>
// ── i18n ──────────────────────────────────────────────────────────────────
// cpu = px/s (×SCL), err = chyba odhadu v podieloch výšky pádla,
// reactX = odkiaľ (podiel šírky) sa CPU vôbec rozbehne
const DIFFS = [
  {key:'diffEasy',   cpu:310, ball:3.9, err:0.85, reactX:0.56},
  {key:'diffMedium', cpu:430, ball:4.5, err:0.40, reactX:0.34},
  {key:'diffHard',   cpu:460, ball:5.4, err:0.30, reactX:0.14},
];
let diffIdx = 1, mode = 'cpu';

function applyLang() {
  document.getElementById('lbl-back').textContent  = t('back');
  document.getElementById('ov-title').textContent  = t('pdlTitle');
  document.getElementById('ov-hint').textContent   = t('pdlHint');
  document.getElementById('lbl-diff').textContent  = t('uiDifficulty');
  document.getElementById('m-cpu').textContent     = t('pdlVsCPU');
  document.getElementById('m-2p').textContent      = t('pdl2P');
  document.getElementById('ov-play').textContent   = t('pdlPlay');
  buildDiffRow();
  syncNames();
}

function buildDiffRow() {
  const row = document.getElementById('diff-row');
  row.innerHTML = '';
  DIFFS.forEach((d, i) => {
    const b = document.createElement('button');
    b.textContent = t(d.key);
    if (i === diffIdx) b.className = 'active';
    b.onclick = () => { diffIdx = i; buildDiffRow(); };
    row.appendChild(b);
  });
}

function syncNames() {
  document.getElementById('name1').textContent = t('pdlP1');
  document.getElementById('name2').textContent = mode === 'cpu' ? t('uiOpponent') : t('pdlP2');
}

// ── canvas ────────────────────────────────────────────────────────────────
const C = document.getElementById('c'), ctx = C.getContext('2d');
const layer = document.createElement('canvas'), lctx = layer.getContext('2d');
let W = 0, H = 0, DPR = 1;
let PAD_H = 90, PAD_W = 12, BALL_R = 8, PAD_X = 26, SCL = 1;
const WIN = 7;

let vw = -1, vh = -1;   // naposledy videný viewport (aj 0, kým sa stránka nerozloží)
function resize() {
  vw = window.innerWidth; vh = window.innerHeight;
  W = vw || document.documentElement.clientWidth || 360;
  H = vh || document.documentElement.clientHeight || 640;
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  C.width = Math.round(W * DPR); C.height = Math.round(H * DPR);
  layer.width = C.width; layer.height = C.height;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  lctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  SCL    = Math.max(0.68, Math.min(1.35, H / 720));
  PAD_H  = Math.max(60, Math.min(150, H * 0.17));
  PAD_W  = Math.max(9,  Math.min(16,  H * 0.016));
  BALL_R = Math.max(6,  Math.min(12,  H * 0.017));
  PAD_X  = Math.max(14, Math.min(46,  W * 0.035));
  if (p1) { p1.y = clamp(p1.y, 0, H - PAD_H); p2.y = clamp(p2.y, 0, H - PAD_H); }
  paintBg();
}
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);

// ── stav ──────────────────────────────────────────────────────────────────
const ST = {MENU:'menu', SERVE:'serve', PLAY:'play', PAUSE:'pause', OVER:'over'};
let state = ST.MENU;
let p1 = null, p2 = null, ball = null, score = {a:0, b:0};
let serveT = 0, serveDir = 1, lastHit = 'p1';
let trail = [], parts = [], ripples = [], flash = null;
let shake = 0, shakeMag = 0;
const keys = {};
const pointers = new Map();

function newPaddle(side) {
  return {y: H / 2 - PAD_H / 2, vy: 0, hit: 0, target: null, side};
}

function serve(dir) {
  serveDir = dir;
  serveT = 0.75;
  ball = {x: W / 2, y: H / 2, vx: 0, vy: 0, spd: DIFFS[diffIdx].ball * 60 * SCL};
  trail = []; cpuPlan = null;
  state = ST.SERVE;
}

function startGame() {
  p1 = newPaddle('p1'); p2 = newPaddle('p2');
  score = {a:0, b:0}; updateHud();
  parts = []; ripples = []; flash = null; shake = 0;
  document.getElementById('overlay').classList.add('hide');
  document.getElementById('hud').classList.add('show');
  document.getElementById('pause-btn').classList.add('show');
  document.getElementById('result').classList.remove('show');
  document.getElementById('brand').style.display = '';
  serve(1);
}

function openMenu(resultWinner) {
  state = ST.MENU;
  const ov = document.getElementById('overlay');
  const res = document.getElementById('result');
  if (resultWinner) {
    document.getElementById('res-name').textContent = resultWinner + ' ' + t('pdlWins');
    document.getElementById('res-name').style.color = score.a >= WIN ? 'var(--p1)' : 'var(--p2)';
    document.getElementById('rs1').textContent = score.a;
    document.getElementById('rs2').textContent = score.b;
    res.classList.add('show');
    document.getElementById('brand').style.display = 'none';
    document.getElementById('ov-play').textContent = t('pdlAgain');
  }
  ov.classList.remove('hide');
  document.getElementById('pause-btn').classList.remove('show');
  document.getElementById('hud').classList.remove('show');
}

function updateHud() {
  document.getElementById('d1').textContent = score.a;
  document.getElementById('d2').textContent = score.b;
}

function setMode(m) {
  mode = m;
  document.getElementById('m-cpu').classList.toggle('active', m === 'cpu');
  document.getElementById('m-2p').classList.toggle('active', m === '2p');
  syncNames();
}

function togglePause() {
  if (state === ST.PLAY || state === ST.SERVE) { state = ST.PAUSE; }
  else if (state === ST.PAUSE) { state = ball && (ball.vx || ball.vy) ? ST.PLAY : ST.SERVE; }
}

// ── efekty ────────────────────────────────────────────────────────────────
function spark(x, y, col, n, spread) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const v = (60 + Math.random() * 240) * SCL;
    parts.push({x, y, vx: Math.cos(a) * v * (spread || 1), vy: Math.sin(a) * v, life: 1, col});
  }
}
function ripple(x, y, col) { ripples.push({x, y, t: 0, col}); }

// ── slučka ────────────────────────────────────────────────────────────────
let prevTs = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (!prevTs) prevTs = ts;
  let dt = (ts - prevTs) / 1000;
  prevTs = ts;
  if (document.hidden) return;
  if (vw !== window.innerWidth || vh !== window.innerHeight) resize();
  dt = Math.min(dt, 1 / 30);
  if (state === ST.SERVE || state === ST.PLAY) update(dt);
  stepEffects(dt);
  draw(ts);
}

function movePaddle(p, dt, up, dn) {
  const spd = 430 * SCL;
  const before = p.y;
  if (p.target !== null) {
    // ťah prstom / myšou — stred pádla ide za ukazovateľom
    const want = clamp(p.target - PAD_H / 2, 0, H - PAD_H);
    const step = spd * 1.9 * dt;
    p.y += clamp(want - p.y, -step, step);
  }
  if (up) p.y -= spd * dt;
  if (dn) p.y += spd * dt;
  p.y = clamp(p.y, 0, H - PAD_H);
  p.vy = (p.y - before) / Math.max(dt, 1e-4);
}

// kam doletí loptička k pravému pádlu (aj s odrazmi od stien)
function predictY() {
  const tt = (W - PAD_X - PAD_W - ball.x) / Math.max(ball.vx, 1);
  let py = ball.y + ball.vy * tt;
  const span = H - 2 * BALL_R;
  if (span <= 0) return H / 2;
  let m = (py - BALL_R) % (2 * span);
  if (m < 0) m += 2 * span;
  return BALL_R + (m > span ? 2 * span - m : m);
}

let cpuPlan = null;
function cpuThink(dt) {
  const d = DIFFS[diffIdx];
  const cy = p2.y + PAD_H / 2;
  let want, spd = d.cpu * SCL;
  if (ball.vx > 0) {
    // plán na výmenu — jedna chyba odhadu, nie nový hod kockou každý frame
    if (!cpuPlan) cpuPlan = predictY() + (Math.random() - 0.5) * PAD_H * d.err;
    if (ball.x < W * d.reactX) return;   // reakčný odstup
    want = cpuPlan;
  } else {
    cpuPlan = null;
    want = H / 2;                        // po odpálení sa vracia do stredu
    spd *= 0.5;
  }
  const step = clamp(want - cy, -spd * dt, spd * dt);
  const before = p2.y;
  p2.y = clamp(p2.y + step, 0, H - PAD_H);
  p2.vy = (p2.y - before) / Math.max(dt, 1e-4);
}

function update(dt) {
  movePaddle(p1, dt, keys['KeyW'] || (mode === 'cpu' && keys['ArrowUp']), keys['KeyS'] || (mode === 'cpu' && keys['ArrowDown']));
  if (mode === '2p') movePaddle(p2, dt, keys['ArrowUp'], keys['ArrowDown']);
  else cpuThink(dt);

  if (state === ST.SERVE) {
    serveT -= dt;
    ball.x = W / 2; ball.y = H / 2;
    if (serveT <= 0) {
      const a = (Math.random() - 0.5) * 0.7;
      ball.vx = serveDir * ball.spd * Math.cos(a);
      ball.vy = ball.spd * Math.sin(a);
      state = ST.PLAY;
      spark(W / 2, H / 2, serveDir > 0 ? '34,224,255' : '255,86,200', 14);
    }
    return;
  }

  const px0 = ball.x, py0 = ball.y;
  ball.x += ball.vx * dt;
  ball.y += ball.vy * dt;

  // steny
  if (ball.y - BALL_R < 0) { ball.y = BALL_R; ball.vy = Math.abs(ball.vy); ripple(ball.x, 0, hitCol()); spark(ball.x, BALL_R, hitCol(), 5, .4); }
  else if (ball.y + BALL_R > H) { ball.y = H - BALL_R; ball.vy = -Math.abs(ball.vy); ripple(ball.x, H, hitCol()); spark(ball.x, H - BALL_R, hitCol(), 5, .4); }

  // pádla — kontrola preletu (ball sa nesmie „prestreliť" pri vysokej rýchlosti)
  const faceL = PAD_X + PAD_W, faceR = W - PAD_X - PAD_W;
  if (ball.vx < 0 && px0 - BALL_R >= faceL && ball.x - BALL_R <= faceL) {
    const k = (px0 - BALL_R - faceL) / Math.max(px0 - ball.x, 1e-6);
    const yAt = py0 + (ball.y - py0) * k;
    if (yAt > p1.y - BALL_R && yAt < p1.y + PAD_H + BALL_R) bounce(p1, faceL + BALL_R, yAt, 1);
  } else if (ball.vx > 0 && px0 + BALL_R <= faceR && ball.x + BALL_R >= faceR) {
    const k = (faceR - px0 - BALL_R) / Math.max(ball.x - px0, 1e-6);
    const yAt = py0 + (ball.y - py0) * k;
    if (yAt > p2.y - BALL_R && yAt < p2.y + PAD_H + BALL_R) bounce(p2, faceR - BALL_R, yAt, -1);
  }

  // gól
  if (ball.x + BALL_R < 0)      goal('b');
  else if (ball.x - BALL_R > W) goal('a');

  // chvost
  trail.push({x: ball.x, y: ball.y});
  if (trail.length > 16) trail.shift();
}

const hitCol = () => lastHit === 'p1' ? '34,224,255' : '255,86,200';

function bounce(p, nx, ny, dir) {
  const rel = clamp((ny - (p.y + PAD_H / 2)) / (PAD_H / 2), -1, 1);
  ball.spd = Math.min(ball.spd * 1.055, 1250 * SCL);
  // uhol držím do 57°, aby výmena nezastala v takmer svislom lete
  const ang = clamp(rel * 0.9 + clamp(p.vy / (900 * SCL), -0.35, 0.35), -1, 1);
  ball.vx = dir * ball.spd * Math.cos(ang);
  ball.vy = ball.spd * Math.sin(ang);
  ball.x = nx; ball.y = ny;
  p.hit = 1;
  lastHit = p.side;
  spark(nx, ny, hitCol(), 12, .6);
  shake = 0.12; shakeMag = 4 * SCL;
}

function goal(who) {
  score[who]++; updateHud();
  const col = who === 'a' ? '34,224,255' : '255,86,200';
  flash = {a: 0.4, col};
  shake = 0.3; shakeMag = 12 * SCL;
  spark(who === 'a' ? W - 4 : 4, ball.y, col, 26, .5);
  if (score.a >= WIN || score.b >= WIN) {
    state = ST.OVER;
    trail = [];
    openMenu(score.a >= WIN ? t('pdlP1') : (mode === 'cpu' ? t('uiOpponent') : t('pdlP2')));
    return;
  }
  serve(who === 'a' ? 1 : -1);
}

function stepEffects(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.94; p.vy *= 0.94;
    p.life -= dt * 2.2;
    if (p.life <= 0) parts.splice(i, 1);
  }
  for (let i = ripples.length - 1; i >= 0; i--) {
    ripples[i].t += dt * 2.6;
    if (ripples[i].t >= 1) ripples.splice(i, 1);
  }
  if (flash) { flash.a -= dt * 1.5; if (flash.a <= 0) flash = null; }
  if (shake > 0) shake = Math.max(0, shake - dt);
  if (p1) p1.hit = Math.max(0, p1.hit - dt * 5);
  if (p2) p2.hit = Math.max(0, p2.hit - dt * 5);
}

// ── kreslenie ─────────────────────────────────────────────────────────────
function roundRect(g, x, y, w, h, r) {
  g.beginPath();
  if (g.roundRect) g.roundRect(x, y, w, h, r);
  else {
    g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
    g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);
    g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y);
  }
}

// statické pozadie (kurt) sa prekresľuje len pri zmene rozmerov
function paintBg() {
  const g = lctx;
  g.clearRect(0, 0, W, H);
  const bg = g.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, '#080c14');
  bg.addColorStop(0.5, '#04060a');
  bg.addColorStop(1, '#0a0710');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  const gl = g.createRadialGradient(0, H / 2, 0, 0, H / 2, W * 0.55);
  gl.addColorStop(0, 'rgba(34,224,255,0.10)'); gl.addColorStop(1, 'transparent');
  g.fillStyle = gl; g.fillRect(0, 0, W, H);
  const gr = g.createRadialGradient(W, H / 2, 0, W, H / 2, W * 0.55);
  gr.addColorStop(0, 'rgba(255,86,200,0.10)'); gr.addColorStop(1, 'transparent');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);

  const inset = Math.max(6, Math.min(18, H * 0.018));
  g.strokeStyle = 'rgba(255,255,255,0.07)';
  g.lineWidth = 1.4;
  roundRect(g, inset, inset, W - inset * 2, H - inset * 2, Math.min(26, H * 0.04)); g.stroke();

  g.save();
  g.setLineDash([Math.max(6, H * 0.014), Math.max(10, H * 0.022)]);
  g.strokeStyle = 'rgba(255,255,255,0.11)';
  g.lineWidth = 2;
  g.beginPath(); g.moveTo(W / 2, inset); g.lineTo(W / 2, H - inset); g.stroke();
  g.restore();
  g.strokeStyle = 'rgba(255,255,255,0.06)';
  g.lineWidth = 1.4;
  g.beginPath(); g.arc(W / 2, H / 2, Math.min(H, W) * 0.12, 0, 6.2832); g.stroke();
}

function drawPaddle(p, x, col) {
  const sq = p.hit;
  const h = PAD_H * (1 - sq * 0.1), w = PAD_W * (1 + sq * 0.55);
  const y = p.y + (PAD_H - h) / 2;
  const cx = x + PAD_W / 2 - w / 2;
  // dosvit
  ctx.save();
  ctx.shadowColor = 'rgba(' + col + ',' + (0.75 + sq * 0.25) + ')';
  ctx.shadowBlur = (16 + sq * 26) * SCL;
  ctx.fillStyle = 'rgba(' + col + ',0.95)';
  roundRect(ctx, cx, y, w, h, w / 2); ctx.fill();
  ctx.restore();
  // svetlé jadro
  const g = ctx.createLinearGradient(cx, y, cx + w, y + h);
  g.addColorStop(0, 'rgba(255,255,255,0.95)');
  g.addColorStop(0.5, 'rgba(' + col + ',1)');
  g.addColorStop(1, 'rgba(' + col + ',0.55)');
  ctx.fillStyle = g;
  roundRect(ctx, cx + w * 0.22, y + h * 0.04, w * 0.56, h * 0.92, w * 0.28); ctx.fill();
}

function draw(ts) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (shake > 0) {
    const m = shakeMag * (shake / 0.3);
    ctx.translate((Math.random() - .5) * m, (Math.random() - .5) * m);
  }

  // pozadie z vyrovnávacej vrstvy
  ctx.clearRect(-40, -40, W + 80, H + 80);
  ctx.drawImage(layer, 0, 0, W, H);

  // skóre ako vodoznak na kurte
  if (state !== ST.MENU) {
    ctx.save();
    ctx.font = '800 ' + Math.round(Math.min(H * 0.4, W * 0.3)) + "px Syne, sans-serif";
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(34,224,255,0.055)';
    ctx.fillText(score.a, W * 0.27, H / 2);
    ctx.fillStyle = 'rgba(255,86,200,0.055)';
    ctx.fillText(score.b, W * 0.73, H / 2);
    ctx.restore();
  }

  // vlnky pri odraze od steny
  ripples.forEach(r => {
    ctx.save();
    ctx.globalAlpha = (1 - r.t) * 0.5;
    ctx.strokeStyle = 'rgba(' + r.col + ',1)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.t * 70 * SCL, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  });

  if (state !== ST.MENU && ball) {
    // chvost loptičky
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    trail.forEach((t2, i) => {
      const k = (i + 1) / trail.length;
      ctx.globalAlpha = k * 0.32;
      ctx.fillStyle = 'rgba(' + hitCol() + ',1)';
      ctx.beginPath(); ctx.arc(t2.x, t2.y, BALL_R * k * 0.95, 0, 6.2832); ctx.fill();
    });
    ctx.restore();

    // loptička
    const pulse = state === ST.SERVE ? 1 + Math.sin(ts / 90) * 0.16 : 1;
    ctx.save();
    ctx.shadowColor = 'rgba(' + hitCol() + ',0.9)';
    ctx.shadowBlur = 24 * SCL;
    const bgd = ctx.createRadialGradient(ball.x - BALL_R * 0.3, ball.y - BALL_R * 0.35, BALL_R * 0.1, ball.x, ball.y, BALL_R * pulse);
    bgd.addColorStop(0, '#ffffff');
    bgd.addColorStop(0.55, '#ffffff');
    bgd.addColorStop(1, 'rgba(' + hitCol() + ',0.95)');
    ctx.fillStyle = bgd;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R * pulse, 0, 6.2832); ctx.fill();
    ctx.restore();

    drawPaddle(p1, PAD_X, '34,224,255');
    drawPaddle(p2, W - PAD_X - PAD_W, '255,86,200');
  }

  // iskry
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  parts.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life) * 0.9;
    ctx.fillStyle = 'rgba(' + p.col + ',1)';
    const s = Math.max(1, BALL_R * 0.3 * p.life);
    ctx.beginPath(); ctx.arc(p.x, p.y, s, 0, 6.2832); ctx.fill();
  });
  ctx.restore();

  // záblesk pri góle
  if (flash) {
    ctx.fillStyle = 'rgba(' + flash.col + ',' + (flash.a * 0.35).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  // pauza
  if (state === ST.PAUSE) {
    ctx.fillStyle = 'rgba(4,6,10,0.72)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(238,246,255,0.9)';
    ctx.font = '800 ' + Math.round(Math.min(34, H * 0.05)) + "px Syne, sans-serif";
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(t('uiPaused'), W / 2, H / 2);
  }
}

// ── vstup ─────────────────────────────────────────────────────────────────
const GAME_KEYS = ['KeyW','KeyS','ArrowUp','ArrowDown','Space','KeyP','Escape'];
document.addEventListener('keydown', e => {
  if (!GAME_KEYS.includes(e.code)) return;
  e.preventDefault();
  if (e.code === 'KeyP' || e.code === 'Escape') { if (state !== ST.MENU && state !== ST.OVER) togglePause(); return; }
  if (e.code === 'Space') { if (state === ST.MENU || state === ST.OVER) startGame(); else togglePause(); return; }
  keys[e.code] = true;
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

function sideFor(x) { return (mode === 'cpu' || x < W / 2) ? p1 : p2; }
C.addEventListener('pointerdown', e => {
  if (state === ST.MENU || state === ST.OVER || !p1) return;
  try { C.setPointerCapture(e.pointerId); } catch (_) {}
  const p = sideFor(e.clientX);
  pointers.set(e.pointerId, p);
  p.target = e.clientY;
});
C.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (p) { p.target = e.clientY; return; }
  // myš bez stlačenia ovláda ľavé pádlo
  if (e.pointerType === 'mouse' && p1 && (state === ST.PLAY || state === ST.SERVE)) p1.target = e.clientY;
});
function dropPointer(e) {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  if (p.side !== 'p1' || e.pointerType !== 'mouse') p.target = null;
  pointers.delete(e.pointerId);
}
C.addEventListener('pointerup', dropPointer);
C.addEventListener('pointercancel', dropPointer);

document.getElementById('m-cpu').onclick = () => setMode('cpu');
document.getElementById('m-2p').onclick  = () => setMode('2p');
document.getElementById('ov-play').onclick = startGame;
document.getElementById('pause-btn').onclick = togglePause;
window.addEventListener('blur', () => { if (state === ST.PLAY || state === ST.SERVE) state = ST.PAUSE; });
window.addEventListener('resize', resize);

resize();
applyLang();
setMode('cpu');
requestAnimationFrame(frame);
</script>
