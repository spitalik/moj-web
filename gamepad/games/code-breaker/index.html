<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Code Breaker · GamePad</title>
    <script src="../../i18n.js"></script>
    <style>
        #back-btn{
            position:fixed;top:14px;left:14px;z-index:60;
            display:flex;align-items:center;gap:7px;
            background:rgba(7,9,15,.88);border:1px solid #3d1430;color:#ab7f9c;
            padding:7px 14px;border-radius:100px;text-decoration:none;
            font-size:12px;font-weight:600;backdrop-filter:blur(4px);transition:all .18s;
        }
        #back-btn:hover,#back-btn:active{border-color:#e879f9;color:#fdeaff;}
        @media(max-width:480px){#back-btn{top:8px;left:8px;padding:5px 10px;font-size:11px;}}
        * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
        body {
            background:#0c0f16;
            font-family:'Segoe UI', Roboto, system-ui, sans-serif;
            display:flex; justify-content:center; align-items:center;
            min-height:100vh; margin:0; padding:12px;
            touch-action: manipulation;
        }
        #game-container {
            background:#151d2b; border-radius:28px; padding:20px 24px 24px;
            max-width:440px; width:100%;
            box-shadow:0 12px 40px rgba(0,0,0,.7); border:1px solid #2e3a4e;
            display:flex; flex-direction:column; gap:12px; position:relative;
        }
        #header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
        #header h1 {
            font-size:21px; font-weight:700;
            background:linear-gradient(135deg,#f5d0fe,#e879f9);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin:0;
        }
        #rules { font-size:12px; color:#8291ab; line-height:1.5; }
        #settings { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
        #settings label { color:#b0c4e0; font-size:12px; font-weight:500; }
        .btn-group { display:flex; gap:4px; background:#111a28; padding:4px; border-radius:10px; border:1px solid #29344a; }
        .btn-group button { background:transparent; border:none; color:#7a8aa8; padding:4px 10px; border-radius:8px; font-size:12px; font-weight:600; cursor:pointer; }
        .btn-group button.active { background:#e879f9; color:#0c0f16; }
        #info-panel { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
        .info-card { flex:1 1 auto; min-width:60px; background:#111a28; border-radius:14px; padding:8px 10px; border:1px solid #29344a; text-align:center; }
        .info-card h3 { font-size:10px; text-transform:uppercase; color:#7a8aa8; margin-bottom:4px; font-weight:500; letter-spacing:.4px; }
        .info-card .value { font-size:20px; font-weight:700; color:#eef3fc; display:block; }
        .high-score { border-color:#fbbf24; }
        .high-score h3 { color:#fbbf24 !important; }
        .high-score .value { color:#fbbf24 !important; }
        #status-line { text-align:center; font-size:12px; color:#f0abfc; min-height:16px; font-weight:600; }
        #canvas-wrapper { background:#0f1622; border-radius:16px; padding:8px; box-shadow: inset 0 0 0 1px #2a3446; position:relative; align-self:center; max-width:100%; }
        #gameCanvas { display:block; border-radius:10px; touch-action:none; cursor:pointer; max-width:100%; height:auto; }
        #palette { display:flex; gap:7px; justify-content:center; flex-wrap:wrap; }
        #palette button {
            width:36px; height:36px; border-radius:50%; border:2px solid rgba(255,255,255,.25);
            cursor:pointer; padding:0;
        }
        #palette button:active { transform:translateY(2px); }
        #submitBtn {
            background:#e879f9; border:1px solid #f5d0fe; border-radius:14px;
            padding:11px 22px; font-size:15px; font-weight:700; color:#0c0f16;
            box-shadow:0 4px 0 #a21caf; cursor:pointer;
        }
        #submitBtn:disabled { opacity:.45; box-shadow:none; cursor:default; }
        #submitBtn:active:not(:disabled) { transform:translateY(4px); box-shadow:0 0 0 #a21caf; }
        #end-overlay {
            position:absolute; inset:8px; background:rgba(8,12,22,.92); backdrop-filter:blur(6px);
            border-radius:10px; display:none; flex-direction:column; align-items:center; justify-content:center;
            gap:8px; padding:26px; z-index:10; color:#f0f4fe; text-align:center;
        }
        #end-overlay.visible { display:flex; }
        #end-overlay h2 { font-size:25px; background:linear-gradient(135deg,#f5d0fe,#e879f9); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        #end-overlay p { font-size:14px; color:#b0c4e0; }
        #secretRow { display:flex; gap:7px; justify-content:center; margin-top:2px; }
        #secretRow span { width:24px; height:24px; border-radius:50%; border:2px solid rgba(255,255,255,.3); }
        #restartBtn {
            background:#e879f9; border:1px solid #f5d0fe; border-radius:40px;
            padding:12px 32px; font-size:17px; font-weight:700; color:#0c0f16;
            box-shadow:0 6px 0 #a21caf; cursor:pointer; margin-top:6px;
        }
        #restartBtn:active { transform:translateY(6px); box-shadow:0 1px 0 #a21caf; }
        #controls { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; align-items:center; }
        #controls button.plain { background:#1e2a3e; border:1px solid #354460; color:#d0def0; border-radius:12px; padding:9px 16px; font-size:13px; font-weight:600; cursor:pointer; }
        #controls button.plain:active { transform:translateY(2px); }
    </style>
</head>
<body>

    <a href="../../index.html" id="back-btn">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      <span id="lbl-back"></span>
    </a>

    <div id="game-container">
        <div id="header">
            <h1 id="lbl-title">🔐</h1>
            <div id="settings">
                <label id="lbl-diff"></label>
                <div class="btn-group" id="diffGroup">
                    <button data-diff="easy"   id="lbl-easy"></button>
                    <button data-diff="medium" id="lbl-medium" class="active"></button>
                    <button data-diff="hard"   id="lbl-hard"></button>
                </div>
            </div>
        </div>

        <p id="rules"></p>

        <div id="info-panel">
            <div class="info-card"><h3 id="lbl-tries"></h3><span class="value" id="triesValue">0/0</span></div>
            <div class="info-card"><h3 id="lbl-time"></h3><span class="value" id="timeValue">0:00</span></div>
            <div class="info-card"><h3 id="lbl-score"></h3><span class="value" id="scoreValue">0</span></div>
            <div class="info-card high-score"><h3 id="lbl-best"></h3><span class="value" id="bestValue">0</span></div>
        </div>

        <div id="status-line"></div>

        <div id="canvas-wrapper">
            <canvas id="gameCanvas"></canvas>
            <div id="end-overlay">
                <h2 id="lbl-result"></h2>
                <p id="lbl-secret-label"></p>
                <div id="secretRow"></div>
                <p style="font-size:16px;color:#fbbf24;"><span id="lbl-final-score"></span> <span id="finalScore">0</span></p>
                <button id="restartBtn"></button>
            </div>
        </div>

        <div id="palette"></div>

        <div id="controls">
            <button id="submitBtn"></button>
            <button class="plain" id="clearBtn"></button>
            <button class="plain" id="newGameBtn"></button>
        </div>
    </div>

    <script>
    (function () {
        'use strict';

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const triesSpan = document.getElementById('triesValue');
        const timeSpan = document.getElementById('timeValue');
        const scoreSpan = document.getElementById('scoreValue');
        const bestSpan = document.getElementById('bestValue');
        const statusLine = document.getElementById('status-line');
        const endOverlay = document.getElementById('end-overlay');
        const resultH2 = document.getElementById('lbl-result');
        const secretLabel = document.getElementById('lbl-secret-label');
        const secretRow = document.getElementById('secretRow');
        const finalScore = document.getElementById('finalScore');
        const restartBtn = document.getElementById('restartBtn');
        const newGameBtn = document.getElementById('newGameBtn');
        const submitBtn = document.getElementById('submitBtn');
        const clearBtn = document.getElementById('clearBtn');
        const palette = document.getElementById('palette');
        const diffGroup = document.getElementById('diffGroup');

        // ----- PREKLADY -----
        document.getElementById('lbl-back').textContent   = t('back');
        document.getElementById('lbl-title').textContent  = '🔐 ' + t('cdbTitle');
        document.getElementById('lbl-diff').textContent   = t('uiDifficulty') + ':';
        document.getElementById('lbl-easy').textContent   = t('diffEasy');
        document.getElementById('lbl-medium').textContent = t('diffMedium');
        document.getElementById('lbl-hard').textContent   = t('diffHard');
        document.getElementById('lbl-tries').textContent  = t('cdbTries');
        document.getElementById('lbl-time').textContent   = t('uiTime');
        document.getElementById('lbl-score').textContent  = t('uiScore');
        document.getElementById('lbl-best').textContent   = t('uiBest');
        document.getElementById('lbl-final-score').textContent = t('uiScore') + ':';
        document.getElementById('rules').textContent      = t('cdbRules');
        submitBtn.textContent  = t('cdbSubmit');
        clearBtn.textContent   = t('islClear');
        restartBtn.textContent = t('uiPlayAgain');
        newGameBtn.textContent = t('uiNewGame');
        document.title = t('cdbTitle') + ' · GamePad';

        // ----- KONFIGURACIA -----
        const SETUP = {
            easy:   { pegs: 4, colours: 6, tries: 12, base: 240 },
            medium: { pegs: 4, colours: 8, tries: 10, base: 480 },
            hard:   { pegs: 5, colours: 8, tries: 10, base: 820 },
        };
        const COLOURS = ['#ef4444', '#f59e0b', '#facc15', '#22c55e', '#06b6d4', '#3b82f6', '#a855f7', '#ec4899'];
        const MARGIN = 12, STEP = 38, PEG = 14, FB = 48;

        let diffKey = 'medium';
        let PEGS = 4, NCOL = 8, TRIES = 10, W = 0, H = 0;
        let secret = [], guesses = [], marks = [], current = [];
        let over = false, won = false, startedAt = 0, elapsed = 0, timer = null, score = 0;
        let best = { easy: 0, medium: 0, hard: 0 };
        try { best = Object.assign(best, JSON.parse(localStorage.getItem('codeBreakerBest') || '{}')); } catch (e) { /* ignore */ }

        // ----- LOGIKA -----
        // Standard peg scoring: exact matches first, then colours present but misplaced.
        function scoreGuess(guess, code) {
            let exact = 0;
            const leftG = [], leftC = [];
            for (let i = 0; i < code.length; i++) {
                if (guess[i] === code[i]) exact++;
                else { leftG.push(guess[i]); leftC.push(code[i]); }
            }
            let misplaced = 0;
            const pool = leftC.slice();
            for (const g of leftG) {
                const at = pool.indexOf(g);
                if (at >= 0) { misplaced++; pool.splice(at, 1); }
            }
            return { exact, misplaced };
        }

        function submit() {
            if (over) return;
            if (current.some(v => v === null)) { statusLine.textContent = t('cdbIncomplete'); return; }
            const res = scoreGuess(current, secret);
            guesses.push(current.slice());
            marks.push(res);
            current = new Array(PEGS).fill(null);
            triesSpan.textContent = guesses.length + '/' + TRIES;
            statusLine.textContent = '';
            if (res.exact === PEGS) { finish(true); return; }
            if (guesses.length >= TRIES) { finish(false); return; }
            draw();
            syncSubmit();
        }

        function finish(win) {
            over = true; won = win;
            clearInterval(timer);
            score = win ? Math.max(30, Math.round(SETUP[diffKey].base - (guesses.length - 1) * 28 - elapsed)) : 0;
            scoreSpan.textContent = score;
            if (score > (best[diffKey] || 0)) {
                best[diffKey] = score;
                localStorage.setItem('codeBreakerBest', JSON.stringify(best));
            }
            bestSpan.textContent = best[diffKey] || 0;
            resultH2.textContent = win ? t('cdbCracked') : t('uiGameOver');
            secretLabel.textContent = t('cdbSecret');
            secretRow.innerHTML = secret.map(c => `<span style="background:${COLOURS[c]}"></span>`).join('');
            finalScore.textContent = score;
            statusLine.textContent = '';
            submitBtn.disabled = true;
            draw();
            endOverlay.classList.add('visible');
        }

        const fmt = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
        const syncSubmit = () => { submitBtn.disabled = over || current.some(v => v === null); };

        function buildPalette() {
            palette.innerHTML = '';
            for (let i = 0; i < NCOL; i++) {
                const b = document.createElement('button');
                b.style.background = COLOURS[i];
                b.setAttribute('aria-label', 'colour ' + (i + 1));
                b.addEventListener('click', () => {
                    if (over) return;
                    const slot = current.indexOf(null);
                    if (slot < 0) return;
                    current[slot] = i;
                    statusLine.textContent = '';
                    draw();
                    syncSubmit();
                });
                palette.appendChild(b);
            }
        }

        function newGame() {
            const setup = SETUP[diffKey];
            PEGS = setup.pegs; NCOL = setup.colours; TRIES = setup.tries;
            W = MARGIN * 2 + PEGS * STEP + FB;
            H = MARGIN * 2 + TRIES * STEP;
            canvas.width = W; canvas.height = H;
            secret = Array.from({ length: PEGS }, () => Math.floor(Math.random() * NCOL));
            guesses = []; marks = []; current = new Array(PEGS).fill(null);
            over = false; won = false; score = 0; elapsed = 0;
            scoreSpan.textContent = '0';
            bestSpan.textContent = best[diffKey] || 0;
            timeSpan.textContent = '0:00';
            triesSpan.textContent = '0/' + TRIES;
            endOverlay.classList.remove('visible');
            statusLine.textContent = t('cdbHintTap');
            buildPalette();
            syncSubmit();
            clearInterval(timer);
            startedAt = Date.now();
            timer = setInterval(() => {
                if (over) return;
                elapsed = Math.floor((Date.now() - startedAt) / 1000);
                timeSpan.textContent = fmt(elapsed);
            }, 1000);
            draw();
        }

        // ----- OVLADANIE -----
        // Tapping a peg in the row being built clears it again.
        function onTap(e) {
            if (over) return;
            const rect = canvas.getBoundingClientRect();
            const x = ((e.touches ? e.touches[0].clientX : e.clientX) - rect.left) / rect.width * W;
            const y = ((e.touches ? e.touches[0].clientY : e.clientY) - rect.top) / rect.height * H;
            const row = guesses.length;
            const cy = MARGIN + row * STEP + STEP / 2;
            if (Math.abs(y - cy) > STEP / 2) return;
            for (let i = 0; i < PEGS; i++) {
                const cx = MARGIN + i * STEP + STEP / 2;
                if (Math.hypot(cx - x, cy - y) <= PEG + 4) {
                    current[i] = null;
                    draw();
                    syncSubmit();
                    return;
                }
            }
        }

        canvas.addEventListener('mousedown', onTap);
        canvas.addEventListener('touchstart', e => { e.preventDefault(); onTap(e); }, { passive: false });
        submitBtn.addEventListener('click', submit);
        clearBtn.addEventListener('click', () => {
            if (over) return;
            current = new Array(PEGS).fill(null);
            statusLine.textContent = '';
            draw(); syncSubmit();
        });
        restartBtn.addEventListener('click', newGame);
        newGameBtn.addEventListener('click', newGame);
        diffGroup.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                diffGroup.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                diffKey = btn.dataset.diff;
                newGame();
            });
        });

        // ----- VYKRESLENIE -----
        function drawFeedback(x, y, res) {
            // exact matches as filled dots, misplaced colours as hollow ones
            const dots = [];
            for (let i = 0; i < res.exact; i++) dots.push(true);
            for (let i = 0; i < res.misplaced; i++) dots.push(false);
            const per = Math.ceil(PEGS / 2);
            dots.forEach((solid, i) => {
                const col = i % per, row = Math.floor(i / per);
                const cx = x + 9 + col * 12, cy = y + STEP / 2 + (row === 0 ? -6 : 6);
                ctx.beginPath(); ctx.arc(cx, cy, 4.2, 0, Math.PI * 2);
                if (solid) { ctx.fillStyle = '#f0abfc'; ctx.fill(); }
                else { ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1.6; ctx.stroke(); }
            });
        }

        function draw() {
            ctx.fillStyle = '#141a26'; ctx.fillRect(0, 0, W, H);

            for (let row = 0; row < TRIES; row++) {
                const y = MARGIN + row * STEP;
                const isCurrent = row === guesses.length && !over;
                if (isCurrent) {
                    ctx.fillStyle = 'rgba(232,121,249,.09)';
                    ctx.fillRect(MARGIN - 6, y, W - 2 * MARGIN + 12, STEP);
                }
                for (let i = 0; i < PEGS; i++) {
                    const cx = MARGIN + i * STEP + STEP / 2, cy = y + STEP / 2;
                    let v = null;
                    if (row < guesses.length) v = guesses[row][i];
                    else if (isCurrent) v = current[i];
                    ctx.beginPath(); ctx.arc(cx, cy, PEG, 0, Math.PI * 2);
                    if (v === null || v === undefined) {
                        ctx.fillStyle = '#1c2434'; ctx.fill();
                        ctx.strokeStyle = isCurrent ? 'rgba(240,171,252,.5)' : 'rgba(255,255,255,.07)';
                        ctx.lineWidth = 1.4; ctx.stroke();
                    } else {
                        const g = ctx.createRadialGradient(cx - PEG * .35, cy - PEG * .35, 1, cx, cy, PEG);
                        g.addColorStop(0, 'rgba(255,255,255,.55)');
                        g.addColorStop(0.35, COLOURS[v]);
                        g.addColorStop(1, COLOURS[v]);
                        ctx.fillStyle = g; ctx.fill();
                        ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1.2; ctx.stroke();
                    }
                }
                if (row < marks.length) drawFeedback(MARGIN + PEGS * STEP, y, marks[row]);
            }
        }

        newGame();
    })();
    </script>
</body>
</html>
