<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Maze · GamePad</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<script src="../../i18n.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#050b12;--text:#eaf6ff;--muted:rgba(234,246,255,0.42);--dim:rgba(234,246,255,0.18);
  --border:rgba(255,255,255,0.08);--border-h:rgba(255,255,255,0.17);
  --c:#63f5c8;--c2:#8b9cff;--gold:#ffd166;
}
html,body{background:var(--bg);min-height:100vh;font-family:'DM Sans',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;user-select:none;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
button,a,[onclick]{touch-action:manipulation;}
body::before,body::after{content:'';position:fixed;border-radius:50%;pointer-events:none;z-index:0;}
body::before{width:560px;height:560px;top:-230px;left:-150px;background:radial-gradient(circle,rgba(99,245,200,0.09) 0%,transparent 66%);}
body::after{width:600px;height:600px;bottom:-270px;right:-160px;background:radial-gradient(circle,rgba(139,156,255,0.09) 0%,transparent 66%);}

#back-btn{position:fixed;top:14px;left:14px;z-index:60;display:flex;align-items:center;gap:7px;background:rgba(8,14,22,0.75);backdrop-filter:blur(8px);border:1px solid var(--border);color:var(--muted);padding:7px 14px;border-radius:100px;text-decoration:none;font-size:12px;font-weight:500;transition:border-color .18s,color .18s;}
#back-btn:hover,#back-btn:active{border-color:var(--border-h);color:var(--text);}
@media(max-width:520px){#back-btn{top:9px;left:9px;padding:6px 11px;font-size:11px;}}

.page{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 12px 14px;gap:10px;}

/* ── HUD ──────────────────────────────────────────────────── */
.top-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;}
.game-title{font-family:'Syne',sans-serif;font-weight:800;font-size:23px;letter-spacing:-.5px;background:linear-gradient(110deg,#fff 22%,var(--c) 70%,var(--c2) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.pill{display:flex;align-items:center;gap:8px;padding:5px 12px;border-radius:100px;background:linear-gradient(160deg,rgba(255,255,255,0.055),rgba(255,255,255,0.015));border:1px solid var(--border);font-size:9px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;color:var(--dim);white-space:nowrap;}
.pill b{font-family:'Syne',sans-serif;font-size:15px;font-weight:800;letter-spacing:0;font-variant-numeric:tabular-nums;color:var(--c);transition:transform .18s;}
.pill.best b{color:var(--gold);}
.pill.best.record{border-color:rgba(255,209,102,.45);}
.pill b.bump{transform:scale(1.28);}
#hint-btn{display:flex;align-items:center;gap:6px;padding:5px 13px;border-radius:100px;border:1px solid rgba(139,156,255,.4);background:linear-gradient(180deg,rgba(139,156,255,.18),rgba(139,156,255,.07));color:#c3ccff;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;cursor:pointer;transition:all .18s;}
#hint-btn b{font-family:'Syne',sans-serif;font-size:12px;}
#hint-btn:hover:not(:disabled){background:rgba(139,156,255,.28);color:#fff;}
#hint-btn:disabled{opacity:.35;cursor:default;}

/* ── doska ────────────────────────────────────────────────── */
.board{position:relative;padding:7px;border-radius:20px;background:linear-gradient(160deg,rgba(255,255,255,0.07),rgba(255,255,255,0.015));box-shadow:0 26px 60px -28px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.07);flex-shrink:0;}
canvas{display:block;border-radius:14px;touch-action:none;}

#overlay{position:absolute;inset:7px;border-radius:14px;z-index:5;display:flex;align-items:center;justify-content:center;padding:12px;background:radial-gradient(ellipse at center,rgba(5,11,18,0.74) 0%,rgba(5,11,18,0.93) 78%);backdrop-filter:blur(5px);}
#overlay.hide{display:none;}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:9px;padding:18px 22px 20px;border-radius:20px;background:rgba(7,13,21,0.86);border:1px solid var(--border-h);box-shadow:0 22px 54px -22px rgba(0,0,0,.95);animation:pop .32s cubic-bezier(.2,1.45,.4,1);max-width:100%;}
@keyframes pop{from{transform:scale(.9);opacity:0;}to{transform:none;opacity:1;}}
.emoji{font-size:30px;line-height:1;filter:drop-shadow(0 6px 14px rgba(99,245,200,.35));}
.ov-title{font-family:'Syne',sans-serif;font-weight:800;font-size:21px;letter-spacing:-.4px;text-align:center;background:linear-gradient(110deg,var(--c),#fff 58%,var(--c2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
#result{display:none;flex-direction:column;align-items:center;gap:1px;}
#result.show{display:flex;}
#res-lbl{font-size:9px;letter-spacing:2.2px;text-transform:uppercase;color:var(--dim);}
#res-time{font-family:'Syne',sans-serif;font-weight:800;font-size:42px;line-height:1.05;letter-spacing:-1.5px;color:var(--c);text-shadow:0 0 26px rgba(99,245,200,.4);}
#res-note{font-size:11px;font-weight:600;color:var(--muted);text-align:center;}
#res-note.record{color:var(--gold);}
.seg{display:flex;gap:3px;background:rgba(255,255,255,0.04);border:1px solid var(--border);padding:3px;border-radius:100px;}
.seg button{background:transparent;border:none;color:var(--muted);padding:6px 14px;border-radius:100px;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;cursor:pointer;transition:color .16s,background .16s;touch-action:manipulation;}
.seg button:hover{color:var(--text);}
.seg button.active{background:rgba(99,245,200,0.15);color:#b3fce6;box-shadow:inset 0 0 0 1px rgba(99,245,200,0.4);}
.lbl{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);}
.hint{font-size:11px;line-height:1.5;color:var(--muted);text-align:center;max-width:240px;}
.btn-col{display:flex;flex-direction:column;gap:6px;width:100%;margin-top:2px;}
.play-btn{padding:11px 28px;border-radius:100px;border:1px solid rgba(99,245,200,.48);background:linear-gradient(180deg,rgba(99,245,200,.22),rgba(99,245,200,.09));color:#c6fdef;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .18s;touch-action:manipulation;}
.play-btn:hover{background:linear-gradient(180deg,rgba(99,245,200,.32),rgba(99,245,200,.15));color:#fff;}
.play-btn:active{transform:translateY(1px);}
.ghost-btn{display:none;padding:8px 18px;border-radius:100px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:11.5px;font-weight:600;cursor:pointer;transition:all .18s;touch-action:manipulation;}
.ghost-btn.show{display:block;}
.ghost-btn:hover{border-color:var(--border-h);color:var(--text);}

/* ── krížový ovládač (len dotykové zariadenia) ────────────── */
#dpad{display:none;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:5px;}
body.touch #dpad{display:grid;}
.d{display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,rgba(255,255,255,0.06),rgba(255,255,255,0.02));border:1px solid var(--border);border-radius:14px;color:var(--muted);cursor:pointer;transition:background .1s,border-color .1s,color .1s,transform .1s;}
.d svg{width:17px;height:17px;}
.d:active,.d.pressed{background:rgba(99,245,200,0.17);border-color:rgba(99,245,200,0.45);color:var(--c);transform:scale(.94);}
#d-up{grid-column:2;grid-row:1;}#d-left{grid-column:1;grid-row:2;}#d-down{grid-column:2;grid-row:2;}#d-right{grid-column:3;grid-row:2;}
@media (max-height:700px){
  .page{padding:44px 10px 8px;gap:6px;}
  .game-title{font-size:18px;}
  #dpad{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,44px);}
}
@media (max-height:820px){#overlay{justify-content:flex-start !important;overflow-y:auto !important;}}
</style>
</head>
<body>
<a href="../../index.html" id="back-btn">
  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
  <span id="lbl-back"></span>
</a>

<div class="page">
  <div class="game-title" id="lbl-title"></div>

  <div class="top-bar" id="top-bar">
    <div class="pill"><span id="lbl-level"></span><b id="hud-level">1</b></div>
    <div class="pill"><span id="lbl-time"></span><b id="hud-time">0</b></div>
    <div class="pill best" id="best-pill"><span id="lbl-best"></span><b id="hud-best">1</b></div>
    <button id="hint-btn"><span id="lbl-hint"></span><b id="hint-left">3</b></button>
  </div>

  <div class="board" id="board">
    <canvas id="c"></canvas>
    <div id="overlay">
      <div class="card">
        <div id="brand"><div class="emoji">🌀</div></div>
        <div class="ov-title" id="ov-title"></div>
        <div id="result">
          <div id="res-lbl"></div>
          <div id="res-time">0</div>
          <div id="res-note"></div>
        </div>
        <div class="lbl" id="lbl-diff"></div>
        <div class="seg" id="diff-row"></div>
        <div class="hint" id="ov-hint"></div>
        <div class="btn-col">
          <button class="play-btn" id="ov-play"></button>
          <button class="ghost-btn" id="ov-ghost"></button>
        </div>
      </div>
    </div>
  </div>

  <div id="dpad">
    <button class="d" id="d-up" aria-label="up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    <button class="d" id="d-left" aria-label="left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg></button>
    <button class="d" id="d-down" aria-label="down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg></button>
    <button class="d" id="d-right" aria-label="right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
  </div>
</div>

<script>
// ── nastavenia ────────────────────────────────────────────────────────────
const DIFFS = [
  {key:'diffEasy',   cols:11, rows:11, hints:3},
  {key:'diffMedium', cols:17, rows:17, hints:3},
  {key:'diffHard',   cols:25, rows:25, hints:2},
];
let diffIdx = 1;
const BEST_KEY = 'maze_best_level';
let best = +(localStorage.getItem(BEST_KEY) || 1);

function applyLang() {
  document.getElementById('lbl-back').textContent  = t('back');
  document.getElementById('lbl-title').textContent = t('mazeTitle');
  document.getElementById('lbl-level').textContent = t('mazeLevel');
  document.getElementById('lbl-time').textContent  = t('uiTime');
  document.getElementById('lbl-best').textContent  = t('mazeBest');
  document.getElementById('lbl-hint').textContent  = t('uiHint');
  document.getElementById('ov-title').textContent  = t('mazeTitle');
  document.getElementById('ov-hint').textContent   = t('mazeHint');
  document.getElementById('ov-play').textContent   = t('mazePlay');
  document.getElementById('ov-ghost').textContent  = t('mazeRestart');
  document.getElementById('lbl-diff').textContent  = t('uiDifficulty');
  document.getElementById('hud-best').textContent  = best;
  buildDiffRow();
}

function buildDiffRow() {
  const row = document.getElementById('diff-row');
  row.innerHTML = '';
  DIFFS.forEach((d, i) => {
    const b = document.createElement('button');
    b.textContent = t(d.key);
    if (i === diffIdx) b.className = 'active';
    b.onclick = () => { diffIdx = i; buildDiffRow(); };
    row.appendChild(b);
  });
}

// ── canvas ────────────────────────────────────────────────────────────────
const C = document.getElementById('c'), ctx = C.getContext('2d');
let CS = 20, COLS = 17, ROWS = 17, DPR = 1, SIZE_W = 0, SIZE_H = 0;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);

// dostupné miesto: spočítam výšku všetkého OKREM dosky, aby nevznikla spätná väzba
function availBox() {
  const vw = window.innerWidth || document.documentElement.clientWidth || 360;
  const vh = window.innerHeight || document.documentElement.clientHeight || 640;
  const page = document.querySelector('.page');
  const board = document.getElementById('board');
  let chrome = 210;
  if (page && board) {
    const cs = getComputedStyle(page);
    const gap = parseFloat(cs.rowGap || cs.gap) || 10;
    let others = 0, n = 0;
    for (const el of page.children) { n++; if (el !== board) others += el.offsetHeight; }
    chrome = others + gap * Math.max(0, n - 1)
           + (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0)
           + 16;                                   // vnútorný okraj dosky
  }
  return {
    w: Math.min(vw - 30, 520),
    h: clamp(vh - chrome, 180, 700)
  };
}

let vw = -1, vh = -1;
function layout() {
  vw = window.innerWidth; vh = window.innerHeight;
  const box = availBox();
  CS = Math.max(9, Math.floor(Math.min(box.w / COLS, box.h / ROWS)));
  SIZE_W = CS * COLS; SIZE_H = CS * ROWS;
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  C.width = Math.round(SIZE_W * DPR); C.height = Math.round(SIZE_H * DPR);
  C.style.width = SIZE_W + 'px'; C.style.height = SIZE_H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

// ── stav ──────────────────────────────────────────────────────────────────
const ST = {MENU:'menu', PLAY:'play', PAUSE:'pause', WON:'won'};
let state = ST.MENU;
let maze = null, seen = null, player = null, exitCell = {r:0, c:0};
let level = 1, hintsLeft = 3, hintPath = null, hintT = 0;
let timeMs = 0, trail = [], parts = [], bump = null, glowT = 0;
const held = {dx:0, dy:0, t:0};

// ── generovanie (iteratívne, aby hlboké labyrinty nepreťažili zásobník) ──
function genMaze(cols, rows) {
  const w = Array.from({length: rows}, () => Array.from({length: cols}, () => ({r:true, d:true})));
  const vis = Array.from({length: rows}, () => Array(cols).fill(false));
  const stack = [[0, 0]];
  vis[0][0] = true;
  while (stack.length) {
    const [r, c] = stack[stack.length - 1];
    const opts = [];
    if (r > 0 && !vis[r-1][c]) opts.push([-1, 0]);
    if (r < rows-1 && !vis[r+1][c]) opts.push([1, 0]);
    if (c > 0 && !vis[r][c-1]) opts.push([0, -1]);
    if (c < cols-1 && !vis[r][c+1]) opts.push([0, 1]);
    if (!opts.length) { stack.pop(); continue; }
    const [dr, dc] = opts[Math.floor(Math.random() * opts.length)];
    const nr = r + dr, nc = c + dc;
    if (dr === 0 && dc === 1)  w[r][c].r = false;
    if (dr === 0 && dc === -1) w[r][nc].r = false;
    if (dr === 1 && dc === 0)  w[r][c].d = false;
    if (dr === -1 && dc === 0) w[nr][c].d = false;
    vis[nr][nc] = true;
    stack.push([nr, nc]);
  }
  return w;
}

function open(r, c, dr, dc) {
  const nr = r + dr, nc = c + dc;
  if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) return false;
  if (dr === 0 && dc === 1)  return !maze[r][c].r;
  if (dr === 0 && dc === -1) return !maze[r][nc].r;
  if (dr === 1 && dc === 0)  return !maze[r][c].d;
  if (dr === -1 && dc === 0) return !maze[nr][c].d;
  return false;
}

// najkratšia cesta k východu (na nápovedu)
function solve() {
  const prev = Array.from({length: ROWS}, () => Array(COLS).fill(null));
  const q = [[Math.round(player.r), Math.round(player.c)]];
  const seenB = Array.from({length: ROWS}, () => Array(COLS).fill(false));
  seenB[q[0][0]][q[0][1]] = true;
  while (q.length) {
    const [r, c] = q.shift();
    if (r === exitCell.r && c === exitCell.c) break;
    for (const [dr, dc] of [[0,1],[1,0],[0,-1],[-1,0]]) {
      if (!open(r, c, dr, dc)) continue;
      const nr = r + dr, nc = c + dc;
      if (seenB[nr][nc]) continue;
      seenB[nr][nc] = true; prev[nr][nc] = [r, c];
      q.push([nr, nc]);
    }
  }
  const path = [];
  let cur = [exitCell.r, exitCell.c];
  while (cur) { path.push(cur); cur = prev[cur[0]][cur[1]]; }
  return path.reverse();
}

function startLevel(keepLevel) {
  const d = DIFFS[diffIdx];
  if (!keepLevel) level = 1;
  COLS = d.cols + (level - 1) * 2;
  ROWS = d.rows + (level - 1) * 2;
  maze = genMaze(COLS, ROWS);
  seen = Array.from({length: ROWS}, () => Array(COLS).fill(0));
  player = {r: 0, c: 0, fromR: 0, fromC: 0, t: 1};
  seen[0][0] = 1;
  exitCell = {r: ROWS - 1, c: COLS - 1};
  hintsLeft = d.hints; hintPath = null; hintT = 0;
  timeMs = 0; trail = []; parts = []; bump = null;
  layout();
  syncHud();
  document.getElementById('overlay').classList.add('hide');
  document.getElementById('result').classList.remove('show');
  document.getElementById('brand').style.display = '';
  document.getElementById('ov-ghost').classList.remove('show');
  document.getElementById('ov-title').textContent = t('mazeTitle');
  document.getElementById('ov-play').textContent = t('mazePlay');
  state = ST.PLAY;
}

function syncHud() {
  document.getElementById('hud-level').textContent = level;
  document.getElementById('hud-time').textContent = Math.floor(timeMs / 1000);
  document.getElementById('hud-best').textContent = best;
  document.getElementById('hint-left').textContent = hintsLeft;
  document.getElementById('hint-btn').disabled = hintsLeft <= 0 || state !== ST.PLAY;
}

function saveBest() {
  if (level > best) {
    best = level;
    try { localStorage.setItem(BEST_KEY, best); } catch (_) {}
    document.getElementById('hud-best').textContent = best;
    document.getElementById('best-pill').classList.add('record');
    return true;
  }
  return false;
}

function useHint() {
  if (state !== ST.PLAY || hintsLeft <= 0) return;
  hintsLeft--;
  hintPath = solve();
  hintT = 2.2;
  syncHud();
}

// ── pohyb ─────────────────────────────────────────────────────────────────
function step(dx, dy) {
  if (state === ST.PAUSE) { state = ST.PLAY; return; }
  if (state !== ST.PLAY || player.t < 1) return;
  const r = Math.round(player.r), c = Math.round(player.c);
  const el = document.getElementById(dy < 0 ? 'd-up' : dy > 0 ? 'd-down' : dx > 0 ? 'd-right' : 'd-left');
  if (el) { el.classList.add('pressed'); setTimeout(() => el.classList.remove('pressed'), 110); }
  if (!open(r, c, dy, dx)) {
    bump = {r, c, dx, dy, t: 1};
    return;
  }
  player.fromR = r; player.fromC = c;
  player.r = r + dy; player.c = c + dx;
  player.t = 0;
  seen[player.r][player.c] = 1;
  trail.push({r: player.r, c: player.c, t: 1});
  if (trail.length > 60) trail.shift();
  if (hintPath && hintPath.length > 1 && hintPath[1][0] === player.r && hintPath[1][1] === player.c) hintPath.shift();
}

function reachExit() {
  state = ST.WON;
  const cx = (exitCell.c + 0.5) * CS, cy = (exitCell.r + 0.5) * CS;
  for (let i = 0; i < 26; i++) {
    const a = Math.random() * Math.PI * 2, v = (0.5 + Math.random() * 2.2) * CS;
    parts.push({x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1});
  }
  const secs = Math.floor(timeMs / 1000);
  level++;
  const rec = saveBest();
  setTimeout(() => {
    if (state !== ST.WON) return;
    document.getElementById('ov-title').textContent = t('mazeEscaped');
    document.getElementById('res-lbl').textContent = t('uiTime');
    document.getElementById('res-time').textContent = secs + 's';
    const note = document.getElementById('res-note');
    note.textContent = (rec ? '🏆 ' : '') + t('mazeLevel') + ' ' + level + ' — ' + t('mazeBigger');
    note.classList.toggle('record', rec);
    document.getElementById('result').classList.add('show');
    document.getElementById('brand').innerHTML = '<div class="emoji">🏆</div>';
    document.getElementById('ov-play').textContent = t('mazeNext');
    document.getElementById('ov-play').dataset.next = '1';
    document.getElementById('ov-ghost').classList.add('show');
    document.getElementById('overlay').classList.remove('hide');
    syncHud();
    state = ST.MENU;
  }, 520);
}

function togglePause() {
  if (state === ST.PLAY) state = ST.PAUSE;
  else if (state === ST.PAUSE) state = ST.PLAY;
  syncHud();
}

// ── slučka ────────────────────────────────────────────────────────────────
let prevTs = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (!prevTs) prevTs = ts;
  let dt = (ts - prevTs) / 1000;
  prevTs = ts;
  if (document.hidden) return;
  if (vw !== window.innerWidth || vh !== window.innerHeight) layout();
  dt = Math.min(dt, 1 / 20);
  glowT += dt;

  if (state === ST.PLAY) {
    const before = Math.floor(timeMs / 1000);
    timeMs += dt * 1000;
    if (Math.floor(timeMs / 1000) !== before) document.getElementById('hud-time').textContent = Math.floor(timeMs / 1000);
    if (player.t < 1) {
      player.t = Math.min(1, player.t + dt * 11);
      if (player.t >= 1 && Math.round(player.r) === exitCell.r && Math.round(player.c) === exitCell.c) reachExit();
    } else if (held.dx || held.dy) {
      held.t -= dt;
      if (held.t <= 0) { held.t = 0.115; step(held.dx, held.dy); }
    }
  }

  // efekty
  for (let i = trail.length - 1; i >= 0; i--) { trail[i].t -= dt * 0.5; if (trail[i].t <= 0) trail.splice(i, 1); }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.94; p.vy *= 0.94;
    p.life -= dt * 1.4;
    if (p.life <= 0) parts.splice(i, 1);
  }
  if (bump) { bump.t -= dt * 4; if (bump.t <= 0) bump = null; }
  if (hintT > 0) hintT = Math.max(0, hintT - dt);

  draw();
}

// ── kreslenie ─────────────────────────────────────────────────────────────
function draw() {
  if (!maze) return;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // podklad
  const bg = ctx.createLinearGradient(0, 0, SIZE_W, SIZE_H);
  bg.addColorStop(0, '#0a1520');
  bg.addColorStop(0.55, '#070f18');
  bg.addColorStop(1, '#0a1018');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, SIZE_W, SIZE_H);

  // navštívené políčka
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (!seen[r][c]) continue;
    ctx.fillStyle = 'rgba(99,245,200,0.05)';
    ctx.fillRect(c * CS + 1, r * CS + 1, CS - 2, CS - 2);
  }

  // svieža stopa za hráčom
  for (const s of trail) {
    ctx.fillStyle = 'rgba(99,245,200,' + (s.t * 0.16).toFixed(3) + ')';
    ctx.fillRect(s.c * CS + 1, s.r * CS + 1, CS - 2, CS - 2);
  }

  const px = (player.fromC + (player.c - player.fromC) * ease(player.t) + 0.5) * CS;
  const py = (player.fromR + (player.r - player.fromR) * ease(player.t) + 0.5) * CS;

  // svetlo okolo hráča
  const lg = ctx.createRadialGradient(px, py, 0, px, py, CS * 4.2);
  lg.addColorStop(0, 'rgba(99,245,200,0.16)');
  lg.addColorStop(1, 'transparent');
  ctx.fillStyle = lg;
  ctx.fillRect(px - CS * 4.2, py - CS * 4.2, CS * 8.4, CS * 8.4);

  // nápoveda: svietiaca čiara po najkratšej ceste
  if (hintPath && hintT > 0 && hintPath.length > 1) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, hintT) * 0.75;
    ctx.strokeStyle = '#8b9cff';
    ctx.lineWidth = Math.max(2, CS * 0.16);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.shadowColor = 'rgba(139,156,255,0.9)';
    ctx.shadowBlur = CS * 0.6;
    ctx.beginPath();
    hintPath.forEach(([r, c], i) => {
      const x = (c + 0.5) * CS, y = (r + 0.5) * CS;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    });
    ctx.stroke();
    ctx.restore();
  }

  // východ — pulzujúci portál
  const ex = (exitCell.c + 0.5) * CS, ey = (exitCell.r + 0.5) * CS;
  const pulse = 0.5 + 0.5 * Math.sin(glowT * 2.6);
  ctx.save();
  const eg = ctx.createRadialGradient(ex, ey, 0, ex, ey, CS * 1.1);
  eg.addColorStop(0, 'rgba(99,245,200,' + (0.5 + pulse * 0.3) + ')');
  eg.addColorStop(1, 'transparent');
  ctx.fillStyle = eg;
  ctx.fillRect(ex - CS * 1.1, ey - CS * 1.1, CS * 2.2, CS * 2.2);
  ctx.strokeStyle = 'rgba(190,255,238,' + (0.55 + pulse * 0.4) + ')';
  ctx.lineWidth = Math.max(1.4, CS * 0.08);
  for (let i = 0; i < 2; i++) {
    const rr = CS * (0.2 + i * 0.13) + pulse * CS * 0.08;
    ctx.beginPath(); ctx.arc(ex, ey, rr, 0, 6.2832); ctx.stroke();
  }
  ctx.restore();

  // steny ako svietiace kapsuly
  const wallW = Math.max(1.6, CS * 0.15);
  ctx.save();
  ctx.strokeStyle = 'rgba(150,220,255,0.75)';
  ctx.lineWidth = wallW;
  ctx.lineCap = 'round';
  ctx.shadowColor = 'rgba(120,200,255,0.55)';
  ctx.shadowBlur = Math.max(3, CS * 0.32);
  ctx.beginPath();
  // vonkajší obvod
  const h = wallW / 2;
  ctx.moveTo(h, h); ctx.lineTo(SIZE_W - h, h);
  ctx.lineTo(SIZE_W - h, SIZE_H - h); ctx.lineTo(h, SIZE_H - h); ctx.closePath();
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (maze[r][c].r && c < COLS - 1) { ctx.moveTo((c+1)*CS, r*CS); ctx.lineTo((c+1)*CS, (r+1)*CS); }
      if (maze[r][c].d && r < ROWS - 1) { ctx.moveTo(c*CS, (r+1)*CS); ctx.lineTo((c+1)*CS, (r+1)*CS); }
    }
  }
  ctx.stroke();
  ctx.restore();

  // náraz do steny
  if (bump) {
    const bx = (bump.c + 0.5 + bump.dx * 0.5) * CS, by = (bump.r + 0.5 + bump.dy * 0.5) * CS;
    ctx.save();
    ctx.globalAlpha = bump.t * 0.8;
    ctx.strokeStyle = '#ff8fa3';
    ctx.lineWidth = Math.max(2, CS * 0.18);
    ctx.lineCap = 'round';
    ctx.beginPath();
    if (bump.dx) { ctx.moveTo(bx, by - CS * 0.34); ctx.lineTo(bx, by + CS * 0.34); }
    else { ctx.moveTo(bx - CS * 0.34, by); ctx.lineTo(bx + CS * 0.34, by); }
    ctx.stroke();
    ctx.restore();
  }

  // hráč
  const pr = CS * 0.3;
  ctx.save();
  ctx.shadowColor = 'rgba(99,245,200,0.95)';
  ctx.shadowBlur = CS * 0.7;
  const pg = ctx.createRadialGradient(px - pr * 0.3, py - pr * 0.35, pr * 0.1, px, py, pr);
  pg.addColorStop(0, '#ffffff');
  pg.addColorStop(0.5, '#9dffe4');
  pg.addColorStop(1, '#1c9e7c');
  ctx.fillStyle = pg;
  ctx.beginPath(); ctx.arc(px, py, pr, 0, 6.2832); ctx.fill();
  ctx.restore();

  // iskry
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, p.life) * 0.9;
    ctx.fillStyle = '#b6ffe8';
    ctx.beginPath(); ctx.arc(p.x, p.y, CS * 0.1 * Math.max(0.3, p.life), 0, 6.2832); ctx.fill();
  }
  ctx.restore();

  if (state === ST.PAUSE) {
    ctx.fillStyle = 'rgba(5,11,18,0.74)';
    ctx.fillRect(0, 0, SIZE_W, SIZE_H);
    ctx.fillStyle = 'rgba(234,246,255,0.92)';
    ctx.font = '800 ' + Math.round(Math.min(30, SIZE_H * 0.09)) + "px Syne, sans-serif";
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(t('uiPaused'), SIZE_W / 2, SIZE_H / 2);
    ctx.textBaseline = 'alphabetic';
  }
}
function ease(t) { return t >= 1 ? 1 : 1 - Math.pow(1 - t, 2.4); }

// ── vstup ─────────────────────────────────────────────────────────────────
const KEYS = {
  ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0],
  KeyW:[0,-1], KeyS:[0,1], KeyA:[-1,0], KeyD:[1,0]
};
document.addEventListener('keydown', e => {
  if (e.code === 'Escape' || e.code === 'KeyP') { e.preventDefault(); if (state === ST.PLAY || state === ST.PAUSE) togglePause(); return; }
  if (e.code === 'KeyH') { e.preventDefault(); useHint(); return; }
  if (state === ST.MENU) {
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); document.getElementById('ov-play').click(); }
    return;
  }
  const m = KEYS[e.code];
  if (!m) return;
  e.preventDefault();
  if (held.dx !== m[0] || held.dy !== m[1]) { held.dx = m[0]; held.dy = m[1]; held.t = 0.22; step(m[0], m[1]); }
});
document.addEventListener('keyup', e => {
  const m = KEYS[e.code];
  if (m && held.dx === m[0] && held.dy === m[1]) { held.dx = 0; held.dy = 0; }
});

[['d-up',0,-1],['d-left',-1,0],['d-down',0,1],['d-right',1,0]].forEach(([id, dx, dy]) => {
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', e => { e.preventDefault(); held.dx = dx; held.dy = dy; held.t = 0.24; step(dx, dy); });
  const stop = () => { if (held.dx === dx && held.dy === dy) { held.dx = 0; held.dy = 0; } };
  el.addEventListener('pointerup', stop);
  el.addEventListener('pointercancel', stop);
  el.addEventListener('pointerleave', stop);
});

// plynulé vedenie prstom po doske
let tx = 0, ty = 0, tid = null;
C.addEventListener('pointerdown', e => { tid = e.pointerId; tx = e.clientX; ty = e.clientY; });
C.addEventListener('pointermove', e => {
  if (tid !== e.pointerId || state !== ST.PLAY) return;
  const rect = C.getBoundingClientRect();
  const scale = SIZE_W / rect.width;
  const dx = (e.clientX - tx) * scale, dy = (e.clientY - ty) * scale;
  const thr = CS * 0.5;
  if (Math.abs(dx) < thr && Math.abs(dy) < thr) return;
  if (Math.abs(dx) >= Math.abs(dy)) step(dx > 0 ? 1 : -1, 0);
  else step(0, dy > 0 ? 1 : -1);
  tx = e.clientX; ty = e.clientY;
});
C.addEventListener('pointerup', e => {
  if (tid !== e.pointerId) return;
  tid = null;
  if (state === ST.PAUSE) state = ST.PLAY;
});
C.addEventListener('pointercancel', () => { tid = null; });

document.getElementById('hint-btn').onclick = useHint;
document.getElementById('ov-play').onclick = () => {
  const next = document.getElementById('ov-play').dataset.next === '1';
  document.getElementById('ov-play').dataset.next = '';
  startLevel(next);
};
document.getElementById('ov-ghost').onclick = () => { document.getElementById('ov-play').dataset.next = ''; startLevel(false); };
window.addEventListener('blur', () => { if (state === ST.PLAY) state = ST.PAUSE; });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === ST.PLAY) state = ST.PAUSE; });

if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) document.body.classList.add('touch');
COLS = DIFFS[diffIdx].cols; ROWS = DIFFS[diffIdx].rows;
maze = genMaze(COLS, ROWS);
seen = Array.from({length: ROWS}, () => Array(COLS).fill(0));
player = {r:0, c:0, fromR:0, fromC:0, t:1};
exitCell = {r: ROWS - 1, c: COLS - 1};
layout();
applyLang();
syncHud();
requestAnimationFrame(frame);
</script>
</body>
</html>
