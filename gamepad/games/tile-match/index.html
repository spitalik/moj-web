<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tile Match · GamePad</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<script src="../../i18n.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#050a08;--text:#eafff2;--muted:rgba(234,255,242,0.42);--dim:rgba(234,255,242,0.18);
  --border:rgba(255,255,255,0.08);--border-h:rgba(255,255,255,0.17);
  --c:#4ade80;--c2:#fbbf24;--gold:#ffd166;--danger:#ff6b81;
}
html,body{background:var(--bg);min-height:100%;font-family:'DM Sans',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
body{overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:
  radial-gradient(720px 440px at 50% -12%,rgba(74,222,128,0.10),transparent 70%),
  radial-gradient(520px 380px at 98% 106%,rgba(251,191,36,0.07),transparent 72%);}
button{font-family:'DM Sans',sans-serif;touch-action:manipulation;}

#back-btn{position:fixed;top:14px;left:14px;z-index:60;display:flex;align-items:center;gap:7px;background:rgba(7,13,10,0.75);backdrop-filter:blur(8px);border:1px solid var(--border);color:var(--muted);padding:7px 14px;border-radius:100px;text-decoration:none;font-size:12px;font-weight:500;transition:border-color .18s,color .18s;}
#back-btn:hover,#back-btn:active{border-color:var(--border-h);color:var(--text);}
@media(max-width:520px){#back-btn{top:9px;left:9px;padding:6px 11px;font-size:11px;}}

.page{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:52px 10px 12px;}
.title{font-family:'Syne',sans-serif;font-weight:800;font-size:20px;letter-spacing:-.4px;background:linear-gradient(110deg,#fff 26%,var(--c) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}

.pills{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;}
.pill{display:flex;align-items:center;gap:7px;padding:4px 11px;border-radius:100px;background:rgba(255,255,255,0.04);border:1px solid var(--border);font-size:8.5px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;color:var(--dim);white-space:nowrap;}
.pill b{font-family:'Syne',sans-serif;font-size:14px;font-weight:800;letter-spacing:0;font-variant-numeric:tabular-nums;color:var(--c);}
.pill.best b{color:var(--c2);}
.pill.best.record{border-color:rgba(251,191,36,.45);}

.seg{display:flex;gap:3px;background:rgba(255,255,255,0.04);border:1px solid var(--border);padding:3px;border-radius:100px;}
.seg button{background:transparent;border:none;color:var(--muted);padding:5px 14px;border-radius:100px;font-size:11.5px;font-weight:600;cursor:pointer;transition:color .16s,background .16s;}
.seg button:hover{color:var(--text);}
.seg button.active{background:rgba(74,222,128,0.16);color:#d3ffe4;box-shadow:inset 0 0 0 1px rgba(74,222,128,0.42);}

#board-wrap{position:relative;padding:8px;border-radius:18px;background:linear-gradient(165deg,rgba(255,255,255,0.05),rgba(255,255,255,0.012));border:1px solid var(--border-h);box-shadow:0 24px 60px -30px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.06);}
canvas{display:block;border-radius:12px;touch-action:none;cursor:pointer;}

.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
.tool{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--muted);padding:8px 14px;border-radius:100px;font-size:11.5px;font-weight:600;cursor:pointer;transition:all .16s;}
.tool:hover{border-color:var(--border-h);color:var(--text);}
.tool svg{width:14px;height:14px;}
.tool:disabled{opacity:.4;cursor:default;}
.tool.primary{border-color:rgba(74,222,128,0.4);color:#ccffdd;background:rgba(74,222,128,0.12);}
#status{font-size:11.5px;color:var(--muted);min-height:16px;text-align:center;}
#status.warn{color:var(--c2);}

#overlay{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(ellipse at center,rgba(7,13,10,0.8) 0%,rgba(2,6,4,0.95) 78%);backdrop-filter:blur(6px);}
#overlay.hide{display:none;}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:11px;width:100%;max-width:334px;padding:26px 24px 24px;border-radius:24px;background:linear-gradient(165deg,rgba(255,255,255,0.06),rgba(255,255,255,0.015));border:1px solid var(--border-h);box-shadow:0 30px 70px -28px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.07);animation:pop .34s cubic-bezier(.2,1.4,.4,1);}
@keyframes pop{from{transform:scale(.9) translateY(8px);opacity:0;}to{transform:none;opacity:1;}}
.card::before{content:'';position:absolute;inset:-1px;border-radius:24px;padding:1px;background:linear-gradient(120deg,rgba(74,222,128,.5),transparent 42%,transparent 58%,rgba(251,191,36,.5));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;}
.emoji{font-size:34px;line-height:1;filter:drop-shadow(0 6px 16px rgba(74,222,128,.4));}
.ttl{font-family:'Syne',sans-serif;font-weight:800;font-size:23px;letter-spacing:-.5px;text-align:center;background:linear-gradient(110deg,var(--c) 5%,#fff 52%,var(--c2) 95%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
#result{display:none;flex-direction:column;align-items:center;gap:1px;}
#result.show{display:flex;}
#res-lbl{font-size:9px;letter-spacing:2.2px;text-transform:uppercase;color:var(--dim);}
#res-score{font-family:'Syne',sans-serif;font-weight:800;font-size:48px;line-height:1.05;letter-spacing:-2px;color:var(--c);text-shadow:0 0 30px rgba(74,222,128,.4);}
#res-note{font-size:11.5px;font-weight:600;color:var(--muted);}
#res-note.record{color:var(--gold);}
#ov-stats{display:none;width:100%;grid-template-columns:1fr 1fr;gap:7px;}
#ov-stats.show{display:grid;}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:14px;background:rgba(255,255,255,0.04);border:1px solid var(--border);}
.stat i{font-size:8px;font-style:normal;letter-spacing:1.3px;text-transform:uppercase;color:var(--dim);text-align:center;}
.stat b{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;color:var(--c2);white-space:nowrap;}
.lbl{font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);}
.hint{font-size:11.5px;line-height:1.5;color:var(--muted);text-align:center;}
.play-btn{margin-top:3px;width:100%;padding:13px 30px;border-radius:100px;border:1px solid rgba(74,222,128,.5);background:linear-gradient(180deg,rgba(74,222,128,.24),rgba(74,222,128,.1));color:#ddffe9;font-size:14px;font-weight:600;cursor:pointer;transition:all .18s;}
.play-btn:hover{background:linear-gradient(180deg,rgba(74,222,128,.34),rgba(74,222,128,.16));color:#fff;box-shadow:0 0 24px -6px rgba(74,222,128,.5);}
.play-btn:active{transform:translateY(1px);}
@media (max-height:820px){#overlay{align-items:flex-start !important;overflow-y:auto !important;}}
@media(max-height:700px){.title{display:none;}.page{padding-top:44px;gap:6px;}}
@media(max-width:380px){.seg button{padding:5px 10px;font-size:11px;}.tool{padding:7px 11px;font-size:11px;}}

/* krajina na nizkych obrazovkach: doska vlavo, ovladanie vpravo */
@media (orientation:landscape) and (max-height:560px){
  .page{display:grid;grid-template-columns:auto minmax(150px,200px);align-content:center;justify-content:center;
        column-gap:16px;row-gap:6px;padding:6px 12px 6px 88px;min-height:100vh;}
  .title{display:none;}
  #board-wrap{grid-column:1;grid-row:1 / span 4;align-self:center;padding:6px;}
  .pills{grid-column:2;grid-row:1;flex-wrap:wrap;max-width:200px;gap:4px;}
  .pill{padding:3px 8px;font-size:8px;}
  .pill b{font-size:12px;}
  .seg{grid-column:2;grid-row:2;justify-self:center;}
  .seg button{padding:4px 9px;font-size:10.5px;}
  .tools{grid-column:2;grid-row:3;max-width:200px;}
  .tool{padding:6px 10px;font-size:10.5px;}
  #status{grid-column:2;grid-row:4;font-size:10px;max-width:200px;}
  #back-btn{padding:5px 11px;font-size:11px;}
}
</style>
</head>
<body>
<a href="../../index.html" id="back-btn">
  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
  <span id="lbl-back"></span>
</a>

<div class="page" id="page">
  <div class="title" id="lbl-title"></div>

  <div class="pills">
    <div class="pill"><span id="lbl-tiles"></span><b id="hud-tiles">0</b></div>
    <div class="pill"><span id="lbl-time"></span><b id="hud-time">0:00</b></div>
    <div class="pill best" id="best-pill"><span id="lbl-best"></span><b id="hud-best">0</b></div>
  </div>

  <div class="seg" id="diff-row"></div>

  <div id="board-wrap"><canvas id="c"></canvas></div>

  <div class="tools">
    <button class="tool" id="btn-hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a6 6 0 0 1 4 10.5V16H8v-3.5A6 6 0 0 1 12 2Z"/></svg>
      <span id="lbl-hint"></span></button>
    <button class="tool" id="btn-shuffle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></svg>
      <span id="lbl-shuffle"></span></button>
    <button class="tool" id="btn-undo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M3.5 13a9 9 0 1 0 2.6-7"/></svg>
      <span id="lbl-undo"></span></button>
    <button class="tool primary" id="btn-new">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
      <span id="lbl-new"></span></button>
  </div>
  <div id="status"></div>
</div>

<div id="overlay">
  <div class="card">
    <div id="brand"><div class="emoji">🀄</div></div>
    <div class="ttl" id="ov-title"></div>
    <div id="result">
      <div id="res-lbl"></div>
      <div id="res-score">0</div>
      <div id="res-note"></div>
    </div>
    <div id="ov-stats">
      <div class="stat"><i id="lbl-s-time"></i><b id="st-time">0:00</b></div>
      <div class="stat"><i id="lbl-s-best"></i><b id="st-best">0</b></div>
    </div>
    <div class="lbl" id="lbl-diff"></div>
    <div class="seg" id="diff-row2"></div>
    <div class="hint" id="ov-hint"></div>
    <button class="play-btn" id="ov-play"></button>
  </div>
</div>

<script>
// ── rozlozenia: kazda vrstva lezi cela na tej pod nou ───────────────────
const SETUP = {
  easy:   {base: 320, layers: [{r0:0,r1:3,c0:0,c1:5}, {r0:1,r1:2,c0:1,c1:4}, {r0:1,r1:2,c0:2,c1:3}]},
  medium: {base: 620, layers: [{r0:0,r1:4,c0:0,c1:7}, {r0:1,r1:3,c0:1,c1:6}, {r0:1,r1:3,c0:2,c1:5}, {r0:2,r1:2,c0:3,c1:4}]},
  hard:   {base: 980, layers: [{r0:0,r1:5,c0:0,c1:7}, {r0:1,r1:4,c0:1,c1:6}, {r0:2,r1:3,c0:2,c1:5}, {r0:2,r1:3,c0:3,c1:4}]},
};
const DIFFS = [{id:'easy', key:'diffEasy'}, {id:'medium', key:'diffMedium'}, {id:'hard', key:'diffHard'}];
let diffIdx = 1;
const diffId = () => DIFFS[diffIdx].id;
const bestKey = () => 'tilematch_best_' + diffId();

// vlastne znaky na kamienkoch — tri farby po devat a sedem zvlastnych
const SUITS = [
  {mark:'●', col:'#c0392b', soft:'#f6d7d2'},
  {mark:'❙', col:'#1e7a45', soft:'#d3f0de'},
  {mark:'◆', col:'#22539b', soft:'#d3e2f6'},
];
const HONOURS = ['★', '☽', '✦', '❋', '▲', '◈', '✚'];
const KINDS = 27 + HONOURS.length;

let TW = 44, TH = 54, DX = 0, DY = 0, BW = 0, BH = 0, MARGIN = 10, DPR = 1;
let tiles = [], selected = -1, hintPair = null, hints = 0, shuffles = 0;
let plan = [], history = [];
let solved = false, elapsed = 0, startedAt = 0, running = false, score = 0;
let anim = [], parts = [], tPrev = 0;

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const statusEl = document.getElementById('status');

function applyLang() {
  document.getElementById('lbl-back').textContent  = t('back');
  document.getElementById('lbl-title').textContent = t('tmhTitle');
  document.getElementById('lbl-tiles').textContent = t('tmhTiles');
  document.getElementById('lbl-time').textContent  = t('uiTime');
  document.getElementById('lbl-best').textContent  = t('uiBest');
  document.getElementById('lbl-hint').textContent  = t('uiHint');
  document.getElementById('lbl-shuffle').textContent = t('tmhShuffle');
  document.getElementById('lbl-undo').textContent  = t('uiUndo');
  document.getElementById('lbl-new').textContent   = t('uiNewGame');
  document.getElementById('lbl-s-time').textContent = t('uiTime');
  document.getElementById('lbl-s-best').textContent = t('uiBest');
  document.getElementById('res-lbl').textContent   = t('uiScore');
  document.getElementById('lbl-diff').textContent  = t('uiDifficulty');
}

const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
function rnd(a, b) { return a + Math.random() * (b - a); }
const keyOf = t2 => t2.l + ':' + t2.r + ':' + t2.c;
const tileX = t2 => MARGIN + t2.c * TW + t2.l * DX;
const tileY = t2 => MARGIN + t2.r * TH + t2.l * DY;

function layoutCells() {
  const cells = [];
  SETUP[diffId()].layers.forEach((L, l) => {
    for (let r = L.r0; r <= L.r1; r++) for (let c = L.c0; c <= L.c1; c++) cells.push({l, r, c});
  });
  return cells;
}

// kamienok sa da vziat, ak na nom nic nelezi a jedna dlha strana je volna
function freeIn(live, t2) {
  if (live.has((t2.l + 1) + ':' + t2.r + ':' + t2.c)) return false;
  const left = live.has(t2.l + ':' + t2.r + ':' + (t2.c - 1));
  const right = live.has(t2.l + ':' + t2.r + ':' + (t2.c + 1));
  return !left || !right;
}

// rozdavam odzadu: vzdy dve prave volne pozicie dostanu rovnaky znak,
// takze zopakovanim toho poradia sa hra vzdy da dohrat
function deal(cells) {
  for (let attempt = 0; attempt < 60; attempt++) {
    const live = new Set(cells.map(keyOf));
    const faces = new Map();
    const pl = [];
    let pair = 0, ok = true;
    while (live.size) {
      const free = cells.filter(c => live.has(keyOf(c)) && freeIn(live, c));
      if (free.length < 2) { ok = false; break; }
      const i = Math.floor(Math.random() * free.length);
      let j = Math.floor(Math.random() * (free.length - 1));
      if (j >= i) j++;
      const face = pair % KINDS;
      faces.set(keyOf(free[i]), face);
      faces.set(keyOf(free[j]), face);
      pl.push([keyOf(free[i]), keyOf(free[j])]);
      live.delete(keyOf(free[i])); live.delete(keyOf(free[j]));
      pair++;
    }
    if (ok) return {faces, plan: pl};
  }
  return null;
}

const liveSet = () => new Set(tiles.filter(t2 => !t2.gone).map(keyOf));
function freeTiles() {
  const live = liveSet();
  return tiles.filter(t2 => !t2.gone && freeIn(live, t2));
}
function findPair() {
  const free = freeTiles();
  for (let i = 0; i < free.length; i++) for (let j = i + 1; j < free.length; j++)
    if (free[i].face === free[j].face) return [free[i], free[j]];
  return null;
}
const remaining = () => tiles.filter(t2 => !t2.gone).length;

// ── velkost dosky ───────────────────────────────────────────────────────
function layout() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const cells = layoutCells();
  const layers = SETUP[diffId()].layers.length;
  let maxC = 0, maxR = 0;
  for (const c of cells) { maxC = Math.max(maxC, c.c); maxR = Math.max(maxR, c.r); }
  const vw = window.innerWidth || 360, vh = window.innerHeight || 640;
  const page = document.getElementById('page'), wrap = document.getElementById('board-wrap');
  let others = 0, n = 0;
  for (const el of page.children) { n++; if (el !== wrap) others += el.offsetHeight; }
  const cs = getComputedStyle(page);
  const gap = parseFloat(cs.rowGap) || 9;
  const pad = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  const chrome = others + gap * Math.max(0, n - 1) + pad + 24;
  let boxW, boxH;
  if (vh <= 560 && vw > vh) { boxW = vw - 330; boxH = vh - 34; }   // krajina: doska vlavo, ovladanie vpravo
  else { boxW = Math.min(vw, 700) - 34; boxH = Math.max(200, vh - chrome); }
  // navrhove rozmery, z nich vypocitam mierku
  const TW0 = 44, TH0 = 54, DX0 = -Math.round(TW0 * 0.12), DY0 = -Math.round(TH0 * 0.12);
  MARGIN = 10;
  const W0 = MARGIN * 2 + (maxC + 1) * TW0 + Math.abs(DX0) * (layers - 1);
  const H0 = MARGIN * 2 + (maxR + 1) * TH0 + Math.abs(DY0) * (layers - 1);
  const scale = Math.min(boxW / W0, boxH / H0, 1.5);
  TW = Math.max(20, Math.round(TW0 * scale));
  TH = Math.max(24, Math.round(TH0 * scale));
  DX = -Math.round(TW * 0.12);
  DY = -Math.round(TH * 0.12);
  MARGIN = Math.max(6, Math.round(10 * scale));
  BW = MARGIN * 2 + (maxC + 1) * TW + Math.abs(DX) * (layers - 1);
  BH = MARGIN * 2 + (maxR + 1) * TH + Math.abs(DY) * (layers - 1);
  cv.style.width = BW + 'px';
  cv.style.height = BH + 'px';
  cv.width = Math.round(BW * DPR);
  cv.height = Math.round(BH * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', () => { layout(); draw(); });
window.addEventListener('orientationchange', () => setTimeout(() => { layout(); draw(); }, 250));

// ── hra ─────────────────────────────────────────────────────────────────
function loadBest() {
  const b = +(localStorage.getItem(bestKey()) || 0);
  document.getElementById('hud-best').textContent = b;
  document.getElementById('best-pill').classList.remove('record');
  return b;
}
function newGame() {
  const cells = layoutCells();
  const dealt = deal(cells);
  const faces = dealt ? dealt.faces : new Map(cells.map((c, i) => [keyOf(c), Math.floor(i / 2) % KINDS]));
  plan = dealt ? dealt.plan : [];
  tiles = cells.map(c => ({...c, face: faces.get(keyOf(c)), gone: false, pop: 0}));
  selected = -1; hintPair = null; hints = 0; shuffles = 0; history = [];
  solved = false; score = 0; elapsed = 0; startedAt = performance.now(); running = true;
  anim = []; parts = [];
  document.getElementById('overlay').classList.add('hide');
  document.getElementById('hud-tiles').textContent = remaining();
  document.getElementById('hud-time').textContent = '0:00';
  loadBest();
  setStatus(t('tmhHintTap'), '');
  syncTools();
  layout();
  draw();
}
function setStatus(msg, cls) { statusEl.textContent = msg; statusEl.className = cls || ''; }
function syncTools() {
  document.getElementById('btn-undo').disabled = !history.length || solved;
  document.getElementById('btn-hint').disabled = solved;
  document.getElementById('btn-shuffle').disabled = solved;
}

function afterRemoval() {
  document.getElementById('hud-tiles').textContent = remaining();
  if (!remaining()) { win(); return; }
  if (!findPair()) setStatus(t('tmhNoMoves'), 'warn');
}
function win() {
  solved = true; running = false;
  elapsed = (performance.now() - startedAt) / 1000;
  score = Math.max(40, Math.round(SETUP[diffId()].base - elapsed - hints * 30 - shuffles * 60));
  const prev = +(localStorage.getItem(bestKey()) || 0);
  const rec = score > prev;
  if (rec) { try { localStorage.setItem(bestKey(), score); } catch (e) {} }
  const bestVal = rec ? score : prev;
  document.getElementById('hud-best').textContent = bestVal;
  document.getElementById('best-pill').classList.toggle('record', rec);
  setStatus('', '');
  syncTools();
  setTimeout(() => {
    document.getElementById('ov-title').textContent = t('uiSolved');
    document.getElementById('res-score').textContent = score;
    const note = document.getElementById('res-note');
    note.textContent = rec ? t('uiNewRecord') : t('uiBest') + ' ' + prev;
    note.classList.toggle('record', rec);
    document.getElementById('st-time').textContent = fmt(elapsed);
    document.getElementById('st-best').textContent = bestVal;
    showCard('win');
  }, 700);
}
function showCard(kind) {
  document.getElementById('ov-title').textContent = kind === 'win' ? t('uiSolved') : t('tmhTitle');
  document.getElementById('brand').style.display = kind === 'win' ? 'none' : '';
  document.getElementById('result').classList.toggle('show', kind === 'win');
  document.getElementById('ov-stats').classList.toggle('show', kind === 'win');
  document.getElementById('ov-hint').textContent = t('tmhRules');
  document.getElementById('ov-play').textContent = kind === 'win' ? t('uiPlayAgain') : t('uiStart');
  document.getElementById('overlay').classList.remove('hide');
}

// ── ovladanie ───────────────────────────────────────────────────────────
function tileAt(x, y) {
  let hit = -1;
  tiles.forEach((t2, i) => {
    if (t2.gone) return;
    const tx = tileX(t2), ty = tileY(t2);
    if (x < tx || x > tx + TW || y < ty || y > ty + TH) return;
    if (hit < 0 || t2.l >= tiles[hit].l) hit = i;
  });
  return hit;
}
function onTap(clientX, clientY) {
  if (solved) return;
  const r = cv.getBoundingClientRect();
  const x = (clientX - r.left) / r.width * BW;
  const y = (clientY - r.top) / r.height * BH;
  const i = tileAt(x, y);
  if (i < 0) { selected = -1; draw(); return; }
  const live = liveSet();
  if (!freeIn(live, tiles[i])) { setStatus(t('tmhBlocked'), 'warn'); draw(); return; }
  hintPair = null;
  if (selected === i) { selected = -1; draw(); return; }
  if (selected >= 0 && tiles[selected].face === tiles[i].face) {
    const a = selected, b = i;
    tiles[a].gone = true; tiles[b].gone = true;
    history.push([a, b]);
    selected = -1;
    setStatus('', '');
    // efekt zaniku
    [a, b].forEach(k => {
      const t2 = tiles[k];
      anim.push({l: t2.l, r: t2.r, c: t2.c, face: t2.face, life: 0.34, max: 0.34});
      for (let n = 0; n < 9; n++) {
        const ang = rnd(0, 6.2832), sp = rnd(40, 170);
        parts.push({x: tileX(t2) + TW / 2, y: tileY(t2) + TH / 2, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 40, life: rnd(0.3, 0.7), max: 0.7});
      }
    });
    syncTools();
    draw();
    afterRemoval();
    return;
  }
  selected = i;
  setStatus('', '');
  draw();
}
cv.addEventListener('pointerdown', e => { e.preventDefault(); onTap(e.clientX, e.clientY); }, {passive: false});
cv.addEventListener('contextmenu', e => e.preventDefault());

document.getElementById('btn-hint').addEventListener('click', () => {
  if (solved) return;
  const live = liveSet();
  const byKey = new Map(tiles.map((t2, i) => [keyOf(t2), i]));
  // najprv krok z vlastnej vyhernej linie, nech napoveda nikdy nezavedie do slepej ulicky
  let pick = null;
  for (const [a, b] of plan) {
    if (!live.has(a) || !live.has(b)) continue;
    const ia = byKey.get(a), ib = byKey.get(b);
    if (freeIn(live, tiles[ia]) && freeIn(live, tiles[ib])) { pick = [ia, ib]; break; }
  }
  if (!pick) {
    const pair = findPair();
    if (!pair) { setStatus(t('tmhNoMoves'), 'warn'); return; }
    pick = pair.map(t2 => tiles.indexOf(t2));
  }
  hintPair = pick;
  hints++;
  setStatus('', '');
  draw();
});
document.getElementById('btn-undo').addEventListener('click', () => {
  if (solved || !history.length) return;
  const [a, b] = history.pop();
  tiles[a].gone = false; tiles[b].gone = false;
  selected = -1; hintPair = null;
  setStatus('', '');
  document.getElementById('hud-tiles').textContent = remaining();
  syncTools();
  draw();
});
document.getElementById('btn-shuffle').addEventListener('click', () => {
  if (solved) return;
  // premiesam len kamienky, ktore su na doske, aby pozicia zostala dohratelna
  const livecells = tiles.filter(t2 => !t2.gone).map(t2 => ({l: t2.l, r: t2.r, c: t2.c}));
  if (livecells.length < 2) return;
  const dealt = deal(livecells);
  if (!dealt) { setStatus(t('tmhNoMoves'), 'warn'); return; }
  tiles.forEach(t2 => { if (!t2.gone) t2.face = dealt.faces.get(keyOf(t2)); });
  plan = dealt.plan;
  shuffles++; selected = -1; hintPair = null;
  setStatus('', '');
  draw();
});
document.getElementById('btn-new').addEventListener('click', newGame);
document.getElementById('ov-play').addEventListener('click', newGame);
window.addEventListener('blur', () => { if (running) { elapsed = (performance.now() - startedAt) / 1000; running = false; } });
window.addEventListener('focus', () => { if (!solved && tiles.length) { startedAt = performance.now() - elapsed * 1000; running = true; } });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (running) { elapsed = (performance.now() - startedAt) / 1000; running = false; } }
  else if (!solved && tiles.length) { startedAt = performance.now() - elapsed * 1000; running = true; }
});

// ── kreslenie ───────────────────────────────────────────────────────────
function faceOf(face) {
  if (face < 27) {
    const s = SUITS[Math.floor(face / 9)];
    return {text: String(face % 9 + 1), mark: s.mark, col: s.col, soft: s.soft};
  }
  return {text: HONOURS[face - 27], mark: '', col: '#6d28d9', soft: '#e4dbff'};
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}
function drawTile(t2, state, scale) {
  const x = tileX(t2), y = tileY(t2);
  const w = TW - 3, h = TH - 3;
  const rr = Math.max(4, TW * 0.16);
  const dep = Math.max(2, TW * 0.09);           // hrubka kamienka
  ctx.save();
  if (scale !== 1) {
    ctx.translate(x + w / 2, y + h / 2);
    ctx.scale(scale, scale);
    ctx.translate(-(x + w / 2), -(y + h / 2));
  }
  // tien
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  roundRect(x + dep * 0.8, y + dep, w, h, rr);
  ctx.fill();
  // bocna hrana
  ctx.fillStyle = state === 'blocked' ? '#8f9a90' : '#b9c2ac';
  roundRect(x + dep * 0.5, y + dep * 0.6, w, h, rr);
  ctx.fill();
  // horna plocha
  const g = ctx.createLinearGradient(x, y, x + w * 0.4, y + h);
  if (state === 'blocked') { g.addColorStop(0, '#d7dcd2'); g.addColorStop(1, '#aab3a6'); }
  else { g.addColorStop(0, '#fffdf4'); g.addColorStop(1, '#e2e6d4'); }
  ctx.fillStyle = g;
  roundRect(x, y, w, h, rr);
  ctx.fill();
  // vnutorny lesk
  ctx.strokeStyle = 'rgba(255,255,255,0.75)';
  ctx.lineWidth = 1;
  roundRect(x + 1.5, y + 1.5, w - 3, h - 3, rr - 1);
  ctx.stroke();
  // ramik podla stavu
  if (state === 'selected' || state === 'hint') {
    ctx.strokeStyle = state === 'selected' ? '#22c55e' : '#f59e0b';
    ctx.lineWidth = Math.max(2, TW * 0.06);
    ctx.shadowColor = state === 'selected' ? 'rgba(34,197,94,0.85)' : 'rgba(245,158,11,0.85)';
    ctx.shadowBlur = TW * 0.3;
    roundRect(x, y, w, h, rr);
    ctx.stroke();
    ctx.shadowBlur = 0;
  } else {
    ctx.strokeStyle = 'rgba(60,66,48,0.35)';
    ctx.lineWidth = 1;
    roundRect(x, y, w, h, rr);
    ctx.stroke();
  }
  // znak
  const f = faceOf(t2.face);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const dim = state === 'blocked';
  if (f.mark) {
    ctx.fillStyle = dim ? 'rgba(40,50,40,0.45)' : f.soft;
    roundRect(x + w * 0.16, y + h * 0.1, w * 0.68, h * 0.5, rr * 0.5);
    ctx.globalAlpha = dim ? 0.4 : 0.9;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = dim ? 'rgba(40,50,40,0.5)' : f.col;
  ctx.font = '800 ' + Math.round(TH * (f.mark ? 0.34 : 0.44)) + "px 'Syne',sans-serif";
  ctx.fillText(f.text, x + w / 2, y + h * (f.mark ? 0.34 : 0.5));
  if (f.mark) {
    ctx.font = Math.round(TH * 0.26) + 'px system-ui,sans-serif';
    ctx.fillText(f.mark, x + w / 2, y + h * 0.74);
  }
  ctx.restore();
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, BW, BH);
  const g = ctx.createRadialGradient(BW / 2, BH * 0.4, 10, BW / 2, BH * 0.4, Math.max(BW, BH) * 0.8);
  g.addColorStop(0, '#123023');
  g.addColorStop(1, '#08170f');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, BW, BH);
  // jemna textura sukna
  ctx.fillStyle = 'rgba(255,255,255,0.018)';
  for (let y = 0; y < BH; y += 6) ctx.fillRect(0, y, BW, 1);

  const live = liveSet();
  const order = tiles.map((t2, i) => i).filter(i => !tiles[i].gone)
    .sort((a, b) => tiles[a].l - tiles[b].l || tiles[a].r - tiles[b].r || tiles[a].c - tiles[b].c);
  for (const i of order) {
    const t2 = tiles[i];
    let state = freeIn(live, t2) ? 'free' : 'blocked';
    if (i === selected) state = 'selected';
    else if (hintPair && hintPair.includes(i)) state = 'hint';
    drawTile(t2, state, state === 'selected' ? 1.05 : 1);
  }
  // miznuce kamienky
  for (const a of anim) {
    const k = Math.max(0, a.life / a.max);
    ctx.globalAlpha = k;
    drawTile(a, 'free', 0.6 + k * 0.5);
    ctx.globalAlpha = 1;
  }
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = '#eaffb0';
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2, 0, 6.2832);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function frame(ts) {
  requestAnimationFrame(frame);
  const dt = tPrev ? Math.min(0.05, (ts - tPrev) / 1000) : 0;
  tPrev = ts;
  let redraw = false;
  if (anim.length) { for (const a of anim) a.life -= dt; anim = anim.filter(a => a.life > 0); redraw = true; }
  if (parts.length) { for (const p of parts) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt; } parts = parts.filter(p => p.life > 0); redraw = true; }
  if (running) {
    elapsed = (performance.now() - startedAt) / 1000;
    document.getElementById('hud-time').textContent = fmt(elapsed);
  }
  if (redraw) draw();
}

// ── obtiaznost ──────────────────────────────────────────────────────────
function buildDiffs(el) {
  el.textContent = '';
  DIFFS.forEach((d, i) => {
    const b = document.createElement('button');
    b.textContent = t(d.key);
    b.className = i === diffIdx ? 'active' : '';
    b.addEventListener('click', () => { diffIdx = i; syncDiffs(); newGame(); });
    el.appendChild(b);
  });
}
function syncDiffs() {
  [document.getElementById('diff-row'), document.getElementById('diff-row2')].forEach(row => {
    [...row.children].forEach((b, j) => b.className = j === diffIdx ? 'active' : '');
  });
}

applyLang();
buildDiffs(document.getElementById('diff-row'));
buildDiffs(document.getElementById('diff-row2'));
newGame();
running = false;
showCard('menu');
requestAnimationFrame(frame);
</script>
