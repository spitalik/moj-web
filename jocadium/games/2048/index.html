<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2048 · Jocadium</title>
<link href="../../fonts/fonts.css" rel="stylesheet">
<script src="../../i18n.js"></script>
<script src="../../sfx.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#05060c;--text:#eef4ff;--muted:rgba(238,244,255,0.4);--dim:rgba(238,244,255,0.18);
  --border:rgba(255,255,255,0.08);--border-h:rgba(255,255,255,0.16);
  --c:#38e8c8;--gold:#ffd166;
  --glow:56,232,200;              /* mení sa podľa najvyššej dlaždice */
}
html,body{background:var(--bg);min-height:100vh;font-family:'DM Sans',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;user-select:none;overflow:hidden;-webkit-tap-highlight-color:transparent;}
body::before,body::after{content:'';position:fixed;border-radius:50%;pointer-events:none;z-index:0;transition:background .8s;}
body::before{width:560px;height:560px;top:-230px;left:-150px;background:radial-gradient(circle,rgba(var(--glow),0.11) 0%,transparent 66%);}
body::after{width:600px;height:600px;bottom:-280px;right:-170px;background:radial-gradient(circle,rgba(var(--glow),0.08) 0%,transparent 66%);}

#back-btn{position:fixed;top:16px;left:16px;z-index:60;display:flex;align-items:center;gap:7px;background:rgba(9,11,20,0.75);backdrop-filter:blur(8px);border:1px solid var(--border);color:var(--muted);padding:7px 14px;border-radius:100px;text-decoration:none;font-size:12px;font-weight:500;transition:border-color .18s,color .18s;}
#back-btn:hover,#back-btn:active{border-color:var(--border-h);color:var(--text);}
@media(max-width:520px){#back-btn{top:10px;left:10px;padding:6px 11px;font-size:11px;}}

.page{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:58px 14px 20px;gap:12px;}

/* ── HUD ──────────────────────────────────────────────────── */
.top-bar{display:flex;align-items:center;gap:8px;width:100%;}
.game-title{font-family:'Syne',sans-serif;font-weight:800;font-size:27px;letter-spacing:-1px;flex:1;background:linear-gradient(115deg,#fff 20%,rgb(var(--glow)) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;transition:background .8s;}
.pill{display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 14px;border-radius:14px;background:linear-gradient(160deg,rgba(255,255,255,0.055),rgba(255,255,255,0.015));border:1px solid var(--border);min-width:62px;}
.pill i{font-style:normal;font-size:8.5px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);}
.pill b{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--text);transition:transform .18s;}
.pill.best b{color:var(--gold);}
.pill.best.record{border-color:rgba(255,209,102,.45);}
.pill b.bump{transform:scale(1.28);}
.new-btn{align-self:stretch;padding:0 16px;border-radius:14px;border:1px solid var(--border);background:linear-gradient(160deg,rgba(255,255,255,0.05),rgba(255,255,255,0.015));color:var(--muted);font-family:'DM Sans',sans-serif;font-size:11.5px;font-weight:600;cursor:pointer;transition:all .18s;white-space:nowrap;touch-action:manipulation;}
.new-btn:hover{border-color:var(--border-h);color:var(--text);}
.new-btn:active{transform:translateY(1px);}

/* ── druhý riadok: veľkosť dosky, krok späť, cieľ ─────────── */
.sub-bar{display:flex;align-items:center;gap:8px;width:100%;}
.seg{display:flex;gap:3px;background:rgba(255,255,255,0.04);border:1px solid var(--border);padding:3px;border-radius:100px;}
.seg button{background:transparent;border:none;color:var(--muted);padding:5px 11px;border-radius:100px;
  font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;cursor:pointer;transition:all .16s;
  touch-action:manipulation;font-variant-numeric:tabular-nums;}
.seg button:hover{color:var(--text);}
.seg button.active{background:rgba(var(--glow),.18);color:#fff;box-shadow:inset 0 0 0 1px rgba(var(--glow),.4);}
#undo-btn{margin-left:auto;display:flex;align-items:center;gap:6px;padding:6px 13px;border-radius:100px;
  border:1px solid var(--border);background:linear-gradient(160deg,rgba(255,255,255,0.05),rgba(255,255,255,0.015));
  color:var(--muted);font-family:'DM Sans',sans-serif;font-size:11.5px;font-weight:600;cursor:pointer;
  transition:all .18s;touch-action:manipulation;white-space:nowrap;}
#undo-btn:hover:not(:disabled){border-color:var(--border-h);color:var(--text);}
#undo-btn:active:not(:disabled){transform:translateY(1px);}
#undo-btn:disabled{opacity:.3;cursor:default;}
#undo-n{font-family:'Syne',sans-serif;font-weight:800;color:rgb(var(--glow));}

/* Prútok k ďalšiemu míľniku. Plní sa súčtom hodnôt na doske — presne toľko
   materiálu treba mať pokope, aby ďalšia méta vôbec mohla vzniknúť. */
.goal{position:relative;width:100%;height:22px;border-radius:100px;overflow:hidden;
  background:rgba(255,255,255,0.045);border:1px solid var(--border);}
.goal i{position:absolute;inset:0;width:0;border-radius:100px;
  background:linear-gradient(90deg,rgba(var(--glow),.35),rgba(var(--glow),.75));
  transition:width .35s cubic-bezier(.3,.9,.3,1);}
.goal span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:5px;
  font-size:10px;font-weight:700;letter-spacing:1.1px;color:rgba(238,244,255,.72);}
.goal span b{font-family:'Syne',sans-serif;font-size:12px;font-weight:800;color:#fff;letter-spacing:0;}
.goal.hit i{transition:none;}
.goal.hit{animation:goalhit .5s ease;}
@keyframes goalhit{0%{box-shadow:0 0 0 0 rgba(var(--glow),.8);}100%{box-shadow:0 0 0 14px rgba(var(--glow),0);}}

/* ── šťava pri spájaní ────────────────────────────────────── */
.ring{position:absolute;border-radius:50%;pointer-events:none;z-index:3;
  border:2px solid rgba(var(--mg),.9);animation:ring .42s cubic-bezier(.2,.7,.3,1) forwards;}
@keyframes ring{from{transform:scale(.35);opacity:.85;}to{transform:scale(1.9);opacity:0;}}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;pointer-events:none;z-index:3;
  background:rgb(var(--mg));box-shadow:0 0 8px rgba(var(--mg),.9);animation:spark .5s ease-out forwards;}
@keyframes spark{from{transform:translate(0,0) scale(1);opacity:.95;}
                 to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0;}}
.board-wrap.shake{animation:shake .26s ease;}
@keyframes shake{0%,100%{transform:translate(0,0);}25%{transform:translate(-3px,2px);}
                 55%{transform:translate(3px,-2px);}80%{transform:translate(-2px,-1px);}}
.combo{position:absolute;left:50%;top:14%;transform:translateX(-50%);z-index:5;pointer-events:none;
  font-family:'Syne',sans-serif;font-weight:800;font-size:17px;letter-spacing:.4px;color:#fff;
  text-shadow:0 3px 14px rgba(0,0,0,.8);animation:combo .8s ease-out forwards;white-space:nowrap;}
@keyframes combo{0%{opacity:0;transform:translateX(-50%) scale(.7);}
                 25%{opacity:1;transform:translateX(-50%) scale(1.06);}
                 100%{opacity:0;transform:translateX(-50%) translateY(-18px) scale(1);}}
.milestone{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);z-index:5;pointer-events:none;
  font-family:'Syne',sans-serif;font-weight:800;font-size:46px;letter-spacing:-2px;color:#fff;
  text-shadow:0 6px 26px rgba(var(--mg),.9);animation:miles 1.05s ease-out forwards;}
@keyframes miles{0%{opacity:0;transform:translate(-50%,-50%) scale(.5);}
                 22%{opacity:1;transform:translate(-50%,-50%) scale(1.12);}
                 70%{opacity:1;transform:translate(-50%,-50%) scale(1);}
                 100%{opacity:0;transform:translate(-50%,-62%) scale(1);}}

/* ── doska ────────────────────────────────────────────────── */
.board-wrap{position:relative;border-radius:22px;background:linear-gradient(160deg,rgba(255,255,255,0.075),rgba(255,255,255,0.015));box-shadow:0 28px 64px -30px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.07);}
#board{position:relative;}
.well{position:absolute;border-radius:12px;background:rgba(255,255,255,0.028);box-shadow:inset 0 1px 3px rgba(0,0,0,.35);}
.tile{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:12px;font-family:'Syne',sans-serif;font-weight:800;letter-spacing:-.5px;will-change:transform;transition:transform .13s cubic-bezier(.25,.6,.35,1);}
.tile .v{position:relative;z-index:1;}
.tile.spawn{animation:spawn .18s cubic-bezier(.2,1.5,.4,1);}
@keyframes spawn{from{transform:var(--tf) scale(.35);opacity:0;}to{transform:var(--tf) scale(1);opacity:1;}}
.tile.merge{animation:merge .2s cubic-bezier(.2,1.6,.4,1);}
@keyframes merge{0%{transform:var(--tf) scale(.72);}55%{transform:var(--tf) scale(1.14);}100%{transform:var(--tf) scale(1);}}
.gain{position:absolute;font-family:'Syne',sans-serif;font-weight:800;font-size:15px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6);pointer-events:none;animation:gain .7s ease-out forwards;z-index:4;}
@keyframes gain{from{opacity:1;transform:translateY(0) scale(1);}to{opacity:0;transform:translateY(-26px) scale(1.15);}}

#overlay{position:absolute;inset:0;border-radius:22px;z-index:6;display:flex;align-items:center;justify-content:center;padding:14px;background:radial-gradient(ellipse at center,rgba(5,6,12,0.72) 0%,rgba(5,6,12,0.93) 78%);backdrop-filter:blur(5px);}
#overlay.hide{display:none;}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:9px;padding:20px 24px 22px;border-radius:20px;background:rgba(8,10,18,0.85);border:1px solid var(--border-h);box-shadow:0 22px 54px -22px rgba(0,0,0,.95);animation:pop .32s cubic-bezier(.2,1.45,.4,1);max-width:100%;}
@keyframes pop{from{transform:scale(.9);opacity:0;}to{transform:none;opacity:1;}}
.emoji{font-size:32px;line-height:1;filter:drop-shadow(0 6px 14px rgba(var(--glow),.4));}
.ov-title{font-family:'Syne',sans-serif;font-weight:800;font-size:23px;letter-spacing:-.5px;text-align:center;background:linear-gradient(110deg,rgb(var(--glow)),#fff 62%,var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
#result{display:none;flex-direction:column;align-items:center;gap:1px;}
#result.show{display:flex;}
#res-lbl{font-size:9px;letter-spacing:2.2px;text-transform:uppercase;color:var(--dim);}
#res-score{font-family:'Syne',sans-serif;font-weight:800;font-size:46px;line-height:1.05;letter-spacing:-1.5px;color:rgb(var(--glow));}
#res-note{font-size:11px;font-weight:600;color:var(--muted);}
#res-note.record{color:var(--gold);}
.hint{font-size:11px;line-height:1.5;color:var(--muted);text-align:center;max-width:230px;}
.btn-col{display:flex;flex-direction:column;gap:6px;width:100%;margin-top:2px;}
.play-btn{padding:11px 28px;border-radius:100px;border:1px solid rgba(var(--glow),.5);background:linear-gradient(180deg,rgba(var(--glow),.22),rgba(var(--glow),.09));color:#eafffb;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .18s;touch-action:manipulation;}
.play-btn:hover{background:linear-gradient(180deg,rgba(var(--glow),.32),rgba(var(--glow),.15));color:#fff;}
.play-btn:active{transform:translateY(1px);}
.ghost-btn{display:none;padding:8px 20px;border-radius:100px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:11.5px;font-weight:600;cursor:pointer;transition:all .18s;touch-action:manipulation;}
.ghost-btn.show{display:block;}
.ghost-btn:hover{border-color:var(--border-h);color:var(--text);}

/* Nízke displeje (telefón naležato): dva riadky navyše a prútok sa inak
   nezmestia a doska pretečie pod spodný okraj. Všetko sa stiahne. */
@media (max-height:470px){
  .page{padding:40px 14px 10px;gap:7px;}
  .game-title{font-size:20px;letter-spacing:-.6px;}
  .pill{padding:3px 10px;min-width:54px;border-radius:11px;}
  .pill b{font-size:14px;}
  .pill i{font-size:8px;}
  .new-btn{padding:0 12px;font-size:10.5px;}
  .seg button{padding:4px 9px;font-size:10px;}
  #undo-btn{padding:4px 10px;font-size:10.5px;}
  .goal{height:16px;}
  .goal span{font-size:9px;}
  .goal span b{font-size:11px;}
}

/* úzke displeje: horná lišta sa zlomí, inak jej pilulky pretečú z obrazovky */
@media (max-width:470px){
  .top-bar{flex-wrap:wrap;justify-content:center;max-width:100% !important;gap:6px !important;}
}
</style>
</head>
<body>
<a href="../../index.html" id="back-btn">
  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
  <span id="lbl-back"></span>
</a>

<div class="page">
  <div class="top-bar" id="top-bar">
    <div class="game-title">2048</div>
    <div class="pill"><i id="lbl-score"></i><b id="score">0</b></div>
    <div class="pill best" id="best-pill"><i id="lbl-best"></i><b id="best">0</b></div>
    <button class="new-btn" id="lbl-new"></button>
  </div>

  <div class="sub-bar" id="sub-bar">
    <div class="seg" id="size-row">
      <button data-n="3">3×3</button>
      <button data-n="4" class="active">4×4</button>
      <button data-n="5">5×5</button>
    </div>
    <button id="undo-btn" disabled>↶ <span id="lbl-undo"></span> <span id="undo-n">5</span></button>
  </div>

  <div class="goal" id="goal"><i id="goal-fill"></i><span id="goal-txt"></span></div>

  <div class="board-wrap" id="board-wrap">
    <div id="board"></div>
    <div id="overlay">
      <div class="card">
        <div id="brand"><div class="emoji">🔢</div></div>
        <div class="ov-title" id="ov-title">2048</div>
        <div id="result">
          <div id="res-lbl"></div>
          <div id="res-score">0</div>
          <div id="res-note"></div>
        </div>
        <div class="hint" id="ov-hint"></div>
        <div class="btn-col">
          <button class="play-btn" id="ov-play"></button>
          <button class="ghost-btn" id="ov-ghost"></button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ── vlastná farebná stupnica: od chladnej po zlatú ────────────────────────
// (poradie hodnôt je mechanika hry, konkrétne odtiene sú vlastné tejto zbierke)
const SKIN = {
  2:    {a:'#1b2536', b:'#131b29', fg:'rgba(238,244,255,0.62)', rgb:'120,140,180', glow:0},
  4:    {a:'#25344a', b:'#1a2637', fg:'rgba(238,244,255,0.8)',  rgb:'140,165,205', glow:0},
  8:    {a:'#38e8c8', b:'#11796b', fg:'#04211c', rgb:'56,232,200',  glow:.30},
  16:   {a:'#4dc4ff', b:'#12558f', fg:'#031a2b', rgb:'77,196,255',  glow:.34},
  32:   {a:'#4d9bff', b:'#12376f', fg:'#02142b', rgb:'77,155,255',  glow:.38},
  64:   {a:'#8b7bff', b:'#332a7a', fg:'#0b0630', rgb:'139,123,255', glow:.42},
  128:  {a:'#c07bff', b:'#4a2278', fg:'#160730', rgb:'192,123,255', glow:.46},
  256:  {a:'#e871d8', b:'#65205c', fg:'#210620', rgb:'232,113,216', glow:.50},
  512:  {a:'#ff6b9d', b:'#6e1638', fg:'#2b0512', rgb:'255,107,157', glow:.54},
  1024: {a:'#ff9f6b', b:'#6e3212', fg:'#2b1004', rgb:'255,159,107', glow:.58},
  2048: {a:'#ffd166', b:'#6e5010', fg:'#2b2004', rgb:'255,209,102', glow:.70},
  4096: {a:'#eaf6ff', b:'#6b7c8c', fg:'#141a22', rgb:'234,246,255', glow:.75},
};
const skinOf = v => SKIN[v] || SKIN[4096];

// Doska sa da prepnut, takze N uz nie je konstanta. Kazda velkost ma vlastny
// rekord — 5x5 je pokojna partia a 3x3 ostry hlavolam, spolocne cislo by nic
// nepovedalo. Stvorka si drzi povodny kluc, aby doterajsie rekordy zostali.
let N = 4;
const SIZE_KEY = 'tile2048_size';
const BEST_KEYS = {3:'tile2048_best_3', 4:'tile2048_best', 5:'tile2048_best_5'};
const GOAL_TILE = {3:512, 4:2048, 5:4096};
const UNDO_MAX = 5;

try { const n = +localStorage.getItem(SIZE_KEY); if (GOAL_TILE[n]) N = n; } catch (_) {}
let best = 0;
function loadBest() {
  try { best = +(localStorage.getItem(BEST_KEYS[N]) || 0) || 0; } catch (_) { best = 0; }
}
loadBest();

// Rebrik milnikov. Dalsi ciel je najblizsia meta nad najvyssou dlazdicou.
const LADDER = [64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768];
let reached = 0;            // najvyssi uz oslavovany milnik
let undoStack = [], undosLeft = UNDO_MAX;

function applyLang() {
  document.getElementById('lbl-back').textContent  = t('back');
  document.getElementById('lbl-score').textContent = t('g2048Score');
  document.getElementById('lbl-best').textContent  = t('g2048Best');
  document.getElementById('lbl-new').textContent   = t('g2048New');
  document.getElementById('ov-hint').textContent   = t('g2048Hint');
  document.getElementById('ov-play').textContent   = t('g2048Play');
  document.getElementById('lbl-undo').textContent  = t('uiUndo');
  document.getElementById('best').textContent      = best;
}

// ── rozmery ───────────────────────────────────────────────────────────────
const boardEl = document.getElementById('board');
const wrapEl = document.getElementById('board-wrap');
let CS = 76, GAP = 9, PAD = 10;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);

let lastVW = -1, lastVH = -1;
function fitLayout() {
  lastVW = window.innerWidth; lastVH = window.innerHeight;
  const vw = lastVW || document.documentElement.clientWidth || 360;
  const vh = lastVH || document.documentElement.clientHeight || 640;
  // Nad doskou su uz dva riadky a prutok ciela — vysku beriem meranim, inak by
  // doska na nizkych displejoch pretiekla pod okraj.
  const page = document.querySelector('.page');
  const wrap = document.getElementById('board-wrap');
  let above = 0, gaps = 0;
  for (const el of page.children) {
    if (el === wrap || !el.offsetHeight) continue;
    above += el.offsetHeight; gaps++;
  }
  const reserved = 58 + 20 + above + gaps * 12 + 14;
  const availW = Math.min(vw - 32, 430);
  const availH = vh - reserved;
  const box = clamp(Math.min(availW, availH), vh < 470 ? 180 : 220, 430);
  GAP = Math.round(clamp(box * 0.024, 6, 11));
  PAD = GAP + 1;
  CS = Math.floor((box - PAD * 2 - GAP * (N - 1)) / N);
  const size = CS * N + GAP * (N - 1) + PAD * 2;
  boardEl.style.width = size + 'px';
  boardEl.style.height = size + 'px';
  document.getElementById('top-bar').style.maxWidth = size + 'px';
  document.getElementById('sub-bar').style.maxWidth = size + 'px';
  document.getElementById('goal').style.maxWidth = size + 'px';
  drawWells();
  for (const tl of tiles.values()) placeTile(tl, true);
}

const posX = c => PAD + c * (CS + GAP);
const posY = r => PAD + r * (CS + GAP);

function drawWells() {
  boardEl.querySelectorAll('.well').forEach(w => w.remove());
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const w = document.createElement('div');
    w.className = 'well';
    w.style.width = CS + 'px'; w.style.height = CS + 'px';
    w.style.left = posX(c) + 'px'; w.style.top = posY(r) + 'px';
    w.style.borderRadius = Math.round(CS * 0.16) + 'px';
    boardEl.appendChild(w);
  }
}

// ── stav ──────────────────────────────────────────────────────────────────
let grid = [], tiles = new Map(), nextId = 1;
let score = 0, won = false, busy = false, queued = null, over = false;

function fontFor(v) {
  const d = String(v).length;
  const k = d <= 2 ? 0.40 : d === 3 ? 0.30 : d === 4 ? 0.24 : 0.19;
  return Math.round(CS * k);
}

// Syne je široký font, takže veľkosť dolaďujem meraním, nie odhadom
function fitText(tl) {
  const el = tl.el, sp = el.querySelector('.v');
  const fs = fontFor(tl.v);
  el.style.fontSize = fs + 'px';
  const maxW = CS * 0.82;
  const w = sp.getBoundingClientRect().width;
  if (w > maxW) el.style.fontSize = Math.max(8, Math.floor(fs * maxW / w)) + 'px';
}

function placeTile(tl, instant) {
  const el = tl.el;
  const tf = 'translate(' + posX(tl.c) + 'px,' + posY(tl.r) + 'px)';
  el.style.setProperty('--tf', tf);
  if (instant) {
    const prev = el.style.transition;
    el.style.transition = 'none';
    el.style.transform = tf;
    el.offsetHeight;                      // vynúti prekreslenie
    el.style.transition = prev;
  } else {
    el.style.transform = tf;
  }
  el.style.width = CS + 'px'; el.style.height = CS + 'px';
  el.style.borderRadius = Math.round(CS * 0.16) + 'px';
  fitText(tl);
}

function styleTile(tl) {
  const s = skinOf(tl.v);
  const el = tl.el;
  el.style.background = 'linear-gradient(158deg,' + s.a + ',' + s.b + ')';
  el.style.color = s.fg;
  el.style.boxShadow = s.glow
    ? 'inset 0 1px 0 rgba(255,255,255,.35), 0 6px 18px -6px rgba(' + s.rgb + ',' + s.glow + '), 0 0 22px -4px rgba(' + s.rgb + ',' + (s.glow * 0.8) + ')'
    : 'inset 0 1px 0 rgba(255,255,255,.16), 0 5px 14px -8px rgba(0,0,0,.7)';
  el.querySelector('.v').textContent = tl.v;
  fitText(tl);
}

function addTile(r, c, v, how) {
  const el = document.createElement('div');
  el.className = 'tile' + (how ? ' ' + how : '');
  el.innerHTML = '<span class="v"></span>';
  boardEl.appendChild(el);
  const tl = {id: nextId++, r, c, v, el};
  tiles.set(tl.id, tl);
  grid[r][c] = tl;
  styleTile(tl);
  placeTile(tl, true);
  if (how) setTimeout(() => el.classList.remove(how), 260);
  return tl;
}

function removeTile(tl) {
  tiles.delete(tl.id);
  tl.el.remove();
}

function emptyCells() {
  const out = [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!grid[r][c]) out.push([r, c]);
  return out;
}

function spawn(how) {
  const free = emptyCells();
  if (!free.length) return null;
  const [r, c] = free[Math.floor(Math.random() * free.length)];
  return addTile(r, c, Math.random() < 0.9 ? 2 : 4, how || 'spawn');
}

function setSize(n) {
  if (n === N) return;
  N = n;
  try { localStorage.setItem(SIZE_KEY, String(n)); } catch (_) {}
  document.querySelectorAll('#size-row button').forEach(b => b.classList.toggle('active', +b.dataset.n === n));
  loadBest();
  document.getElementById('best').textContent = best;
  document.getElementById('best-pill').classList.remove('record');
  fitLayout();
  newGame();
  SFX.play('select');
}

function newGame() {
  grid = Array.from({length: N}, () => Array(N).fill(null));
  for (const tl of [...tiles.values()]) removeTile(tl);
  tiles.clear();
  score = 0; won = false; over = false; busy = false; queued = null;
  undoStack = []; undosLeft = UNDO_MAX; reached = 0;
  syncScore(true);
  spawn(); spawn();
  updateGlow();
  syncGoal(true);
  syncUndo();
  document.getElementById('overlay').classList.add('hide');
  document.getElementById('result').classList.remove('show');
  document.getElementById('brand').style.display = '';
  document.getElementById('ov-ghost').classList.remove('show');
  document.getElementById('ov-title').textContent = '2048';
  document.getElementById('ov-play').textContent = t('g2048Play');
  document.getElementById('ov-play').dataset.mode = 'new';
}

function syncScore(silent) {
  document.getElementById('score').textContent = score;
  if (!silent) {
    const el = document.getElementById('score');
    el.classList.add('bump'); setTimeout(() => el.classList.remove('bump'), 180);
  }
  if (score > best) {
    best = score;
    try { localStorage.setItem(BEST_KEYS[N], best); } catch (_) {}
    document.getElementById('best').textContent = best;
    document.getElementById('best-pill').classList.add('record');
  }
}

// ── cieľ a prútok ─────────────────────────────────────────────────────────
function maxTile() {
  let mx = 0;
  for (const tl of tiles.values()) if (tl.v > mx) mx = tl.v;
  return mx;
}
function boardSum() {
  let sum = 0;
  for (const tl of tiles.values()) sum += tl.v;
  return sum;
}
function nextGoal() {
  const mx = maxTile();
  for (const g of LADDER) if (g > mx) return g;
  return mx * 2;
}

function syncGoal(silent) {
  const g = nextGoal();
  const fill = document.getElementById('goal-fill');
  const pct = Math.max(0, Math.min(100, boardSum() / g * 100));
  fill.style.width = pct.toFixed(1) + '%';
  document.getElementById('goal-txt').innerHTML = '\u25B8 <b>' + g + '</b>';

  // Oslava sa pusti len pri prekroceni metely, nie pri kazdom tahu.
  const mx = maxTile();
  if (!silent && mx > reached && LADDER.indexOf(mx) >= 0 && mx >= LADDER[0]) {
    reached = mx;
    milestone(mx);
  } else if (silent) {
    reached = LADDER.indexOf(mx) >= 0 ? mx : reached;
  }
}

function milestone(v) {
  const el = document.createElement('div');
  el.className = 'milestone';
  el.textContent = v;
  el.style.setProperty('--mg', skinOf(v).rgb);
  boardEl.appendChild(el);
  setTimeout(() => el.remove(), 1100);
  document.getElementById('goal').classList.add('hit');
  setTimeout(() => document.getElementById('goal').classList.remove('hit'), 520);
  SFX.play('levelup');
}

// pozadie a akcenty preberajú farbu najvyššej dlaždice
function updateGlow() {
  let mx = 2;
  for (const tl of tiles.values()) if (tl.v > mx) mx = tl.v;
  document.documentElement.style.setProperty('--glow', skinOf(mx).rgb);
}

function gain(v, r, c) {
  const g = document.createElement('div');
  g.className = 'gain';
  g.textContent = '+' + v;
  g.style.left = (posX(c) + CS / 2 - 16) + 'px';
  g.style.top = (posY(r) + CS * 0.2) + 'px';
  g.style.width = '32px';
  g.style.textAlign = 'center';
  boardEl.appendChild(g);
  setTimeout(() => g.remove(), 720);
}

// ── krok späť ─────────────────────────────────────────────────────────────
// Jedno zle švihnuté gesto doteraz zahodilo celú partiu. Päť krokov na hru je
// úľava, ktorá ešte nerobí z rekordu formalitu — a počítadlo je vidieť.
function snapshot() {
  const vals = [];
  for (let r = 0; r < N; r++) {
    const row = [];
    for (let c = 0; c < N; c++) row.push(grid[r][c] ? grid[r][c].v : 0);
    vals.push(row);
  }
  return {vals, score, won, reached};
}

function restore(st) {
  for (const tl of [...tiles.values()]) removeTile(tl);
  tiles.clear();
  grid = Array.from({length: N}, () => Array(N).fill(null));
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    if (st.vals[r][c]) addTile(r, c, st.vals[r][c]);
  }
  score = st.score; won = st.won; reached = st.reached;
  document.getElementById('score').textContent = score;
  updateGlow();
  syncGoal(true);
}

function syncUndo() {
  const b = document.getElementById('undo-btn');
  b.disabled = !undoStack.length || undosLeft <= 0 || busy;
  document.getElementById('undo-n').textContent = undosLeft;
}

function undo() {
  if (busy || !undoStack.length || undosLeft <= 0) return;
  undosLeft--;
  restore(undoStack.pop());
  over = false;
  queued = null;
  closeCard();
  SFX.play('whoosh');
  syncUndo();
}

// ── posun ─────────────────────────────────────────────────────────────────
const VEC = {left:[0,-1], right:[0,1], up:[-1,0], down:[1,0]};

function move(dir) {
  if (over) return;
  if (busy) { queued = dir; return; }
  const before = snapshot();     // na zásobník sa dostane, až keď sa naozaj pohlo
  const [dr, dc] = VEC[dir];
  const rows = [...Array(N).keys()], cols = [...Array(N).keys()];
  if (dc > 0) cols.reverse();
  if (dr > 0) rows.reverse();

  let moved = false;
  const merges = [];
  for (const r of rows) for (const c of cols) {
    const tl = grid[r][c];
    if (!tl) continue;
    let nr = r, nc = c;
    while (true) {
      const tr = nr + dr, tc = nc + dc;
      if (tr < 0 || tr >= N || tc < 0 || tc >= N) break;
      const other = grid[tr][tc];
      if (!other) { nr = tr; nc = tc; continue; }
      if (other.v === tl.v && !other.merged && !tl.merged) {
        // spojenie: dlaždica dokĺže na cieľ a obe zmiznú za novú
        grid[r][c] = null;
        tl.r = tr; tl.c = tc;
        placeTile(tl);
        other.merged = true;
        merges.push({r: tr, c: tc, v: tl.v * 2, src: [tl, other]});
        moved = true;
        nr = -1;
        break;
      }
      break;
    }
    if (nr === -1) continue;
    if (nr !== r || nc !== c) {
      grid[r][c] = null;
      grid[nr][nc] = tl;
      tl.r = nr; tl.c = nc;
      placeTile(tl);
      moved = true;
    }
  }

  if (!moved) {
    for (const tl of tiles.values()) tl.merged = false;
    return;
  }

  busy = true;
  undoStack.push(before);
  if (undoStack.length > UNDO_MAX) undoStack.shift();
  syncUndo();

  // Ťah znie inak než spojenie: spojenie je odmena, posun len pohyb. A čím
  // vyššia dlaždica vznikla, tým vyšší tón — spojiť 1024 nemá znieť ako 4.
  if (merges.length) {
    let top = 0;
    for (const m of merges) if (m.v > top) top = m.v;
    const steps = Math.log2(top);
    const f = Math.min(2100, 300 * Math.pow(1.17, steps));
    SFX.tone({f: f, f2: f * 1.9, type: 'sine', dur: 0.08, vol: 0.13});
  } else {
    SFX.play('move');
  }
  let addScore = 0;
  for (const m of merges) addScore += m.v;

  setTimeout(() => {
    let justWon = false;
    for (const m of merges) {
      m.src.forEach(removeTile);
      grid[m.r][m.c] = null;
      const tl = addTile(m.r, m.c, m.v, 'merge');
      gain(m.v, m.r, m.c);
      burst(m.r, m.c, m.v);
      // `won` znamená „výhru sme už oslávili" — po Pokračovať sa karta nevracia
      if (tl.v >= GOAL_TILE[N] && !won) { won = true; justWon = true; }
    }
    for (const tl of tiles.values()) tl.merged = false;
    if (addScore) { score += addScore; syncScore(); }
    // Tri spojenia v jednom ťahu nie sú náhoda — oplatí sa chystať si ťahy.
    if (merges.length >= 3) combo(merges.length);
    spawn();
    updateGlow();
    syncGoal();
    busy = false;
    syncUndo();
    if (justWon) { showCard('win'); return; }
    if (!canMove()) { showCard('lose'); return; }
    if (queued) { const q = queued; queued = null; move(q); }
  }, 135);
}

// ── šťava pri spájaní ─────────────────────────────────────────────────────
function burst(r, c, v) {
  const rgb = skinOf(v).rgb;
  const cx = posX(c) + CS / 2, cy = posY(r) + CS / 2;

  const ring = document.createElement('div');
  ring.className = 'ring';
  ring.style.setProperty('--mg', rgb);
  ring.style.width = CS + 'px'; ring.style.height = CS + 'px';
  ring.style.left = (cx - CS / 2) + 'px'; ring.style.top = (cy - CS / 2) + 'px';
  boardEl.appendChild(ring);
  setTimeout(() => ring.remove(), 440);

  const n = v >= 256 ? 10 : 7;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + Math.random() * 0.6;
    const d = CS * (0.45 + Math.random() * 0.45);
    const sp = document.createElement('div');
    sp.className = 'spark';
    sp.style.setProperty('--mg', rgb);
    sp.style.setProperty('--dx', (Math.cos(a) * d).toFixed(1) + 'px');
    sp.style.setProperty('--dy', (Math.sin(a) * d).toFixed(1) + 'px');
    sp.style.left = (cx - 3) + 'px'; sp.style.top = (cy - 3) + 'px';
    boardEl.appendChild(sp);
    setTimeout(() => sp.remove(), 520);
  }

  // Od 256 vyššie to už doskou aj trhne.
  if (v >= 256) {
    wrapEl.classList.remove('shake');
    void wrapEl.offsetWidth;
    wrapEl.classList.add('shake');
    setTimeout(() => wrapEl.classList.remove('shake'), 280);
  }
}

function combo(n) {
  const el = document.createElement('div');
  el.className = 'combo';
  el.textContent = t('uiCombo') + ' ×' + n;
  boardEl.appendChild(el);
  setTimeout(() => el.remove(), 820);
  SFX.play('coin');
}

function canMove() {
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const tl = grid[r][c];
    if (!tl) return true;
    if (c < N - 1 && grid[r][c + 1] && grid[r][c + 1].v === tl.v) return true;
    if (r < N - 1 && grid[r + 1][c] && grid[r + 1][c].v === tl.v) return true;
  }
  return false;
}

function showCard(kind) {
  SFX.play(kind === 'win' ? 'win' : 'lose');
  const rec = score >= best && score > 0;
  document.getElementById('ov-title').textContent = kind === 'win' ? t('g2048Win') : t('g2048Over');
  document.getElementById('res-lbl').textContent = t('g2048Score');
  document.getElementById('res-score').textContent = score;
  const note = document.getElementById('res-note');
  note.textContent = (rec ? '🏆 ' : '') + t('g2048Best') + ': ' + best;
  note.classList.toggle('record', rec);
  document.getElementById('result').classList.add('show');
  document.getElementById('brand').innerHTML = '<div class="emoji">' + (kind === 'win' ? '🏆' : '🔢') + '</div>';
  document.getElementById('ov-hint').textContent = kind === 'win' ? '' : t('g2048Hint');
  const play = document.getElementById('ov-play');
  const ghost = document.getElementById('ov-ghost');
  if (kind === 'win') {
    play.textContent = t('g2048Cont');
    play.dataset.mode = 'cont';
    ghost.textContent = t('g2048New');
    ghost.classList.add('show');
  } else {
    over = true;
    play.textContent = t('g2048Again');
    play.dataset.mode = 'new';
    ghost.classList.remove('show');
  }
  document.getElementById('overlay').classList.remove('hide');
}

function closeCard() {
  document.getElementById('overlay').classList.add('hide');
  document.getElementById('result').classList.remove('show');
}

// ── vstup ─────────────────────────────────────────────────────────────────
const KEYMAP = {
  ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down',
  KeyA:'left', KeyD:'right', KeyW:'up', KeyS:'down'
};
document.addEventListener('keydown', e => {
  const cardOpen = !document.getElementById('overlay').classList.contains('hide');
  if (e.code === 'Space' || e.code === 'Enter') {
    if (cardOpen) { e.preventDefault(); document.getElementById('ov-play').click(); }
    return;
  }
  if (e.code === 'KeyZ' || e.code === 'Backspace') { e.preventDefault(); undo(); return; }
  const dir = KEYMAP[e.code];
  if (!dir) return;
  e.preventDefault();
  if (cardOpen) return;
  move(dir);
});

let sx = 0, sy = 0, sid = null;
wrapEl.addEventListener('pointerdown', e => { sid = e.pointerId; sx = e.clientX; sy = e.clientY; });
wrapEl.addEventListener('pointerup', e => {
  if (sid !== e.pointerId) return;
  sid = null;
  if (!document.getElementById('overlay').classList.contains('hide')) return;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  const min = Math.max(18, CS * 0.3);
  if (Math.abs(dx) < min && Math.abs(dy) < min) return;
  if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
  else move(dy > 0 ? 'down' : 'up');
});
wrapEl.addEventListener('touchmove', e => e.preventDefault(), {passive:false});

document.getElementById('ov-play').onclick = () => {
  if (document.getElementById('ov-play').dataset.mode === 'cont') closeCard();
  else newGame();
};
document.getElementById('ov-ghost').onclick = newGame;
document.getElementById('lbl-new').onclick = newGame;
document.getElementById('undo-btn').onclick = undo;
document.querySelectorAll('#size-row button').forEach(b => {
  b.onclick = () => setSize(+b.dataset.n);
});
window.addEventListener('resize', () => { if (lastVW !== window.innerWidth || lastVH !== window.innerHeight) fitLayout(); });

applyLang();
document.querySelectorAll('#size-row button').forEach(b => b.classList.toggle('active', +b.dataset.n === N));
document.getElementById('best').textContent = best;
fitLayout();
newGame();
// prvé spustenie ukáže úvodnú kartu, aby si hráč prečítal ovládanie
document.getElementById('overlay').classList.remove('hide');
</script>
</body>
</html>
