<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'none'; form-action 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spellweft · Jocadium</title>
    <link href="../../fonts/fonts.css" rel="stylesheet">
    <script src="../../i18n.js"></script>
    <script src="../../sfx.js"></script>
    <style>
        #back-btn{
            position:fixed;top:14px;left:14px;z-index:60;
            display:flex;align-items:center;gap:7px;
            background:rgba(7,9,15,.88);border:1px solid #204030;color:#8291ab;
            padding:7px 14px;border-radius:100px;text-decoration:none;
            font-size:12px;font-weight:600;backdrop-filter:blur(4px);transition:all .18s;
        }
        #back-btn:hover,#back-btn:active{border-color:#4ade80;color:#f0f4fe;}
        @media(max-width:480px){#back-btn{top:8px;left:8px;padding:5px 10px;font-size:11px;}}
        * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; }
        body {
            background:#0c0f16;
            font-family:'Segoe UI', Roboto, system-ui, sans-serif;
            display:flex; justify-content:center; align-items:center;
            min-height:100vh; margin:0; padding:12px;
            touch-action: manipulation;
        }
        #game-container {
            background:#151d2b;
            border-radius:28px;
            padding:20px 24px 24px;
            max-width:640px;
            width:100%;
            box-shadow:0 12px 40px rgba(0,0,0,.7);
            border:1px solid #2e3a4e;
            display:flex; flex-direction:column; gap:14px;
            position:relative;
        }
        #header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
        #header h1 {
            font-size:24px; font-weight:700;
            background:linear-gradient(135deg,#bbf7d0,#4ade80);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
            margin:0;
        }
        #rules { font-size:12px; color:#8291ab; line-height:1.5; }
        #settings { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
        #settings label { color:#b0c4e0; font-size:12px; font-weight:500; }
        .btn-group { display:flex; gap:4px; background:#111a28; padding:4px; border-radius:10px; border:1px solid #29344a; }
        .btn-group button { background:transparent; border:none; color:#7a8aa8; padding:4px 10px; border-radius:8px; font-size:12px; font-weight:600; cursor:pointer; }
        .btn-group button.active { background:#4ade80; color:#0c0f16; }
        #info-panel { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
        .info-card { flex:1 1 auto; min-width:60px; background:#111a28; border-radius:14px; padding:8px 10px; border:1px solid #29344a; text-align:center; }
        .info-card h3 { font-size:10px; text-transform:uppercase; color:#7a8aa8; margin-bottom:4px; font-weight:500; }
        .info-card .value { font-size:20px; font-weight:700; color:#eef3fc; display:block; }
        .high-score { border-color:#fbbf24; }
        .high-score h3 { color:#fbbf24 !important; }
        .high-score .value { color:#fbbf24 !important; }
        #main { display:flex; gap:18px; flex-wrap:wrap; justify-content:center; align-items:flex-start; }
        #board-wrap { position:relative; background:#0f1622; border-radius:16px; padding:10px; box-shadow: inset 0 0 0 1px #2a3446; }
        #board {
            display:grid; gap:6px; position:relative;
        }
        .cell {
            background:#1c2739; border:1px solid #2e3a4e; border-radius:10px;
            display:flex; align-items:center; justify-content:center;
            font-size:var(--cellf, 20px); font-weight:700; color:#eef3fc; min-width:0;
            aspect-ratio:1; cursor:pointer; transition:background .1s, transform .08s;
        }
        .cell.selected { background:#166534; border-color:#4ade80; color:#bbf7d0; transform:scale(0.94); }
        .cell.flash-ok { background:#15803d !important; border-color:#4ade80 !important; }
        .cell.flash-bad { background:#7f1d1d !important; border-color:#f87171 !important; }
        #pathCanvas { position:absolute; inset:10px; pointer-events:none; }
        #current-word {
            min-height:30px; text-align:center; font-size:20px; font-weight:700;
            letter-spacing:3px; color:#bbf7d0;
        }
        #feedback { min-height:16px; font-size:12px; font-weight:600; text-align:center; }
        #feedback.error { color:#f87171; }
        #feedback.ok { color:#6ee7b7; }
        #found-panel {
            flex:1 1 160px; min-width:150px; max-height:340px; overflow-y:auto;
            background:#111a28; border-radius:14px; border:1px solid #29344a; padding:10px 12px;
        }
        #found-panel h3 { font-size:11px; text-transform:uppercase; color:#7a8aa8; margin-bottom:8px; font-weight:600; }
        #foundList { display:flex; flex-direction:column; gap:4px; }
        .found-word { font-size:13px; color:#bbf7d0; font-weight:600; letter-spacing:1px; }
        #controls { display:flex; gap:10px; justify-content:center; }
        #pauseBtn {
            background:#103a2e; border:1px solid #4ade80; color:#86efac;
            border-radius:16px; width:56px; height:56px; font-size:22px;
            display:flex; align-items:center; justify-content:center; cursor:pointer;
        }
        #pauseBtn.paused { background:#2a1e3e; border-color:#4c1d95; color:#c4b5e3; }
        #pause-overlay {
            position:absolute; inset:8px; background:rgba(8,12,22,.75); backdrop-filter:blur(4px);
            border-radius:10px; display:none; align-items:center; justify-content:center;
            color:#f0f4fe; font-size:26px; font-weight:700; letter-spacing:4px; z-index:5;
        }
        #pause-overlay.visible { display:flex; }
        #pause-overlay span { background:rgba(74,222,128,.18); padding:14px 26px; border-radius:16px; border:2px solid rgba(74,222,128,.4); }
        #end-overlay {
            position:absolute; inset:0; background:rgba(8,12,22,.92); backdrop-filter:blur(6px);
            border-radius:28px; display:none; flex-direction:column; align-items:center; justify-content:center;
            gap:10px; padding:26px; z-index:10; color:#f0f4fe; text-align:center; overflow-y:auto;
        }
        #end-overlay.visible { display:flex; }
        #end-overlay h2 {
            font-size:28px;
            background:linear-gradient(135deg,#bbf7d0,#4ade80);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
        }
        #missedWrap { max-width:320px; }
        #missedWrap h4 { font-size:11px; color:#7a8aa8; text-transform:uppercase; margin:8px 0 4px; }
        #missedList { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; }
        .missed-word { background:#1c2739; border:1px solid #354460; border-radius:8px; padding:3px 8px; font-size:12px; color:#93c5fd; letter-spacing:1px; }
        #replayBtn {
            background:#4ade80; border:1px solid #bbf7d0; border-radius:40px;
            padding:12px 32px; font-size:17px; font-weight:700; color:#0c0f16;
            box-shadow:0 6px 0 #15803d; cursor:pointer; margin-top:6px;
        }
        #replayBtn:active { transform:translateY(6px); box-shadow:0 1px 0 #15803d; }
        @media (max-width:480px) {
            .cell { font-size:18px; }
            #current-word { font-size:16px; }
        }
    
/* mobil/tablet: na nízkych obrazovkách stlačím rámce, aby ovládanie zostalo viditeľné */
@media (max-height:900px){
  body{padding:6px !important;}
  #game-container{padding:12px 14px 14px !important;gap:9px !important;}
}
@media (max-height:760px){
  body{padding:3px !important;}
  #game-container{padding:8px 10px 10px !important;gap:6px !important;border-radius:18px !important;}
}

@media (max-height:700px){
  #rules{display:none !important;}
}

/* nizka-obrazovka-fix: na nízkych displejoch zmenším hraciu plochu */
@media (max-height:720px){
  #main{gap:10px !important;}
  #board-wrap{padding:6px !important;}
}

@media (max-height:760px){
  #info-panel{flex-direction:row !important;flex-wrap:wrap !important;justify-content:center !important;gap:6px !important;}
  #info-panel > *{padding:4px 8px !important;}
}

/* nizka-obrazovka-fix 2 */
@media (max-height:700px){
  #board-wrap{padding:4px !important;}
  #main{gap:6px !important;}
  #controls{gap:5px !important;}
  #controls button{padding:6px 12px !important;font-size:12px !important;}
}

/* nizka-obrazovka-fix 3 */
@media (max-height:700px){
  #header{gap:3px !important;}
  #header h1{font-size:17px !important;}
  #info-panel{gap:4px !important;}
  #info-panel > *{padding:3px 7px !important;}
  #info-panel h3{font-size:8.5px !important;margin-bottom:1px !important;}
  #info-panel .value{font-size:15px !important;}
  #board-wrap{padding:2px !important;}
}

/* ── zladenie s ostatnymi hrami zbierky ─────────────────────────────── */
:root{
  --fa:#4ade80;--fb:#22d3ee;--fgold:#ffd166;
  --ftext:#eef3fc;--fmuted:rgba(238,243,252,0.44);--fdim:rgba(238,243,252,0.2);
  --fbd:rgba(255,255,255,0.09);
}
body{
  font-family:'DM Sans',system-ui,sans-serif !important;
  background:radial-gradient(ellipse at 50% -8%, rgba(74,222,128,.14) 0%, transparent 58%), #070a12 !important;
  color:var(--ftext) !important;
}
#back-btn{background:rgba(10,13,24,0.72) !important;border:1px solid var(--fbd) !important;color:var(--fmuted) !important;font-weight:500 !important;}
#back-btn:hover,#back-btn:active{border-color:rgba(255,255,255,0.18) !important;color:#fff !important;}
#game-container{
  background:linear-gradient(165deg,rgba(255,255,255,0.045),rgba(255,255,255,0.012)) !important;
  border:1px solid rgba(255,255,255,0.13) !important;border-radius:26px !important;
  box-shadow:0 30px 70px -28px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.06) !important;
}
#header h1{
  font-family:'Syne',sans-serif !important;font-weight:800 !important;font-size:19px !important;
  letter-spacing:-.3px !important;
  background:linear-gradient(110deg,var(--fa) 5%,#fff 55%,var(--fb) 95%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
#settings label{color:var(--fdim) !important;font-size:9px !important;font-weight:600 !important;
  letter-spacing:1.1px !important;text-transform:uppercase !important;}
#rules{color:var(--fmuted) !important;font-size:11px !important;line-height:1.6 !important;}
.btn-group{background:rgba(255,255,255,0.04) !important;border:1px solid var(--fbd) !important;
  border-radius:100px !important;padding:3px !important;gap:2px !important;}
.btn-group button{border-radius:100px !important;color:var(--fmuted) !important;
  font-family:'DM Sans',sans-serif !important;font-size:11px !important;font-weight:600 !important;
  padding:5px 12px !important;transition:color .16s,background .16s !important;}
.btn-group button:hover{color:#fff !important;}
.btn-group button.active{background:rgba(74,222,128,.16) !important;color:#fff !important;
  box-shadow:inset 0 0 0 1px rgba(74,222,128,.42) !important;}
.info-card{background:rgba(255,255,255,0.04) !important;border:1px solid var(--fbd) !important;
  border-radius:14px !important;}
.info-card h3{font-size:8.5px !important;letter-spacing:1.3px !important;color:var(--fdim) !important;
  font-weight:600 !important;text-transform:uppercase !important;}
.info-card .value{font-family:'Syne',sans-serif !important;font-weight:800 !important;
  font-size:18px !important;letter-spacing:-.5px !important;font-variant-numeric:tabular-nums;
  color:var(--fa) !important;}
.high-score{border-color:rgba(255,209,102,.35) !important;}
.high-score h3{color:rgba(255,209,102,.55) !important;}
.high-score .value{color:var(--fgold) !important;}
#canvas-wrapper{background:rgba(0,0,0,0.34) !important;border-radius:18px !important;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,0.07) !important;}
#controls button,#padrow button,#controls>button{
  background:linear-gradient(160deg,rgba(255,255,255,0.07),rgba(255,255,255,0.02)) !important;
  border:1px solid var(--fbd) !important;color:var(--fmuted) !important;
  border-radius:15px !important;box-shadow:none !important;
  font-family:'DM Sans',sans-serif !important;
}
#controls button:active,#padrow button:active{background:rgba(74,222,128,.18) !important;
  border-color:rgba(74,222,128,.45) !important;color:#fff !important;transform:scale(.95) !important;}
#status-line{color:var(--fmuted) !important;font-weight:600 !important;}
/* prekryvy: rodinna karta */
#game-over-overlay,#win-overlay,#pause-overlay{
  background:radial-gradient(ellipse at center,rgba(8,10,20,0.84) 0%,rgba(3,4,9,0.96) 78%) !important;
  backdrop-filter:blur(6px) !important;border-radius:18px !important;
}
#game-over-overlay h2,#win-overlay h2,#pause-overlay span{
  font-family:'Syne',sans-serif !important;font-weight:800 !important;letter-spacing:-.5px !important;
}
#game-over-overlay h2,#win-overlay h2{
  font-size:24px !important;
  background:linear-gradient(110deg,var(--fa) 5%,#fff 55%,var(--fb) 95%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  text-shadow:none !important;
}
#game-over-overlay p,#win-overlay p{font-size:11.5px !important;color:var(--fmuted) !important;}
#game-over-overlay p span:last-child,#win-overlay p span:last-child{
  font-family:'Syne',sans-serif !important;font-weight:800 !important;font-size:20px !important;
  color:var(--fa) !important;
}
#restartBtn,#nextBtn,#newMazeBtn,#newGameBtn,#playAgainBtn{
  border-radius:100px !important;border:1px solid rgba(74,222,128,.5) !important;
  background:linear-gradient(180deg,rgba(74,222,128,.24),rgba(74,222,128,.1)) !important;
  color:#fff !important;font-family:'DM Sans',sans-serif !important;font-size:14px !important;
  font-weight:600 !important;box-shadow:none !important;padding:12px 30px !important;
  text-transform:none !important;
}
#restartBtn:hover,#nextBtn:hover,#newMazeBtn:hover,#newGameBtn:hover,#playAgainBtn:hover{
  background:linear-gradient(180deg,rgba(74,222,128,.34),rgba(74,222,128,.16)) !important;
  box-shadow:0 0 24px -6px rgba(74,222,128,.5) !important;transform:none !important;
}
#restartBtn:active,#nextBtn:active{transform:translateY(1px) !important;}

/* tlacidlo Spat nesmie sedet na hlavicke panelu */
@media (max-width:560px){
  #game-container{padding-top:46px !important;}
}
/* nizke telefony: menej chromu */
@media (max-height:620px){
  #rules{display:none !important;}
  #header h1{font-size:15px !important;}
  #info-panel{gap:5px !important;padding:0 !important;}
  .info-card{padding:5px 9px !important;min-width:50px !important;}
  .info-card h3{font-size:8px !important;margin-bottom:0 !important;}
  .info-card .value{font-size:15px !important;}
}
/* telefon na sirku: panel v stlpci, plocha si vezme vysku okna */
@media (max-height:520px) and (orientation:landscape){
  body{padding:4px !important;align-items:flex-start !important;}
  #game-container{max-width:100% !important;max-height:none !important;padding-top:46px !important;}
  #gameCanvas{max-height:none !important;}
  #header{gap:5px !important;}
  #info-panel{gap:3px !important;}
  #info-panel .info-card{padding:3px 7px !important;}
}
/* velmi uzke obrazovky */
@media (max-width:380px){
  body{padding:4px !important;}
  #game-container{padding-left:8px !important;padding-right:8px !important;}
}
/* velke obrazovky: panel smie narast */
@media (min-width:700px){
  #game-container{max-width:660px !important;}
}
/* hracie plochy bez platna (pismenka) dostanu rovnake sklo ako platno */
#board-wrap{background:rgba(0,0,0,0.34) !important;border-radius:18px !important;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,0.07) !important;}
.cell{background:rgba(255,255,255,0.045) !important;border:1px solid rgba(255,255,255,0.09) !important;
  border-radius:13px !important;font-family:'Syne',sans-serif !important;font-weight:800 !important;
  color:var(--ftext) !important;}
#current-word{font-family:'Syne',sans-serif !important;font-weight:800 !important;}
#feedback{font-size:11.5px !important;}
#palette button,#palette .swatch{box-shadow:inset 0 1px 0 rgba(255,255,255,.25) !important;}
#pause-overlay span{background:rgba(255,255,255,0.05) !important;border:1px solid rgba(255,255,255,0.14) !important;
  border-radius:100px !important;padding:11px 26px !important;font-size:17px !important;color:var(--ftext) !important;}

/* telefon na sirku: co najmenej chromu, plocha ma prednost */
@media (max-height:520px) and (orientation:landscape){
  #game-container{gap:4px !important;padding-bottom:6px !important;}
  #canvas-wrapper,#board-wrap{padding:4px !important;}
  #status-line,#feedback{font-size:10px !important;min-height:12px !important;}
  #current-word{font-size:15px !important;min-height:18px !important;}
  #settings label{display:none !important;}
  .btn-group button{padding:4px 9px !important;font-size:10px !important;}
  #controls{gap:5px !important;}
  #controls button{padding:6px 12px !important;font-size:11.5px !important;}
  #palette{gap:5px !important;}
  #palette button{width:24px !important;height:24px !important;}
  #found-panel{display:none !important;}
}
</style>
</head>
<body>

    <a href="../../index.html" id="back-btn">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      <span id="lbl-back"></span>
    </a>

    <div id="game-container">
        <div id="header">
            <h1>🔤 WORD WEAVE</h1>
            <div id="settings">
                <label id="lbl-size">Veľkosť:</label>
                <div class="btn-group" id="sizeGroup">
                    <button data-size="s" id="lbl-size-s">Malá</button>
                    <button data-size="m" class="active" id="lbl-size-m">Stredná</button>
                    <button data-size="l" id="lbl-size-l">Veľká</button>
                </div>
            </div>
        </div>

        <p id="rules"></p>

        <div id="info-panel">
            <div class="info-card">
                <h3 id="lbl-time">Čas</h3>
                <span class="value" id="timeValue">90</span>
            </div>
            <div class="info-card">
                <h3 id="lbl-score">Skóre</h3>
                <span class="value" id="scoreValue">0</span>
            </div>
            <div class="info-card high-score">
                <h3 id="lbl-best">Najlepšie</h3>
                <span class="value" id="bestValue">0</span>
            </div>
            <div class="info-card">
                <h3 id="lbl-combo">Kombá</h3>
                <span class="value" id="comboValue">0</span>
            </div>
            <div class="info-card">
                <h3 id="lbl-found">Nájdené</h3>
                <span class="value" id="foundValue">0/0</span>
            </div>
        </div>

        <div id="main">
            <div id="board-wrap">
                <div id="board"></div>
                <svg id="pathCanvas"></svg>
                <div id="pause-overlay"><span>⏸ <span id="lbl-pause"></span></span></div>
            </div>
            <div id="found-panel">
                <h3 id="lbl-found-panel">Nájdené</h3>
                <div id="foundList"></div>
            </div>
        </div>

        <div id="current-word"></div>
        <div id="feedback"></div>

        <div id="controls">
            <button id="pauseBtn">⏸</button>
        </div>

        <div id="end-overlay">
            <h2 id="lbl-timeup">Čas vypršal!</h2>
            <p><span id="lbl-final-score">Skóre:</span> <span id="finalScore">0</span></p>
            <p><span id="lbl-final-found">Nájdené:</span> <span id="finalFound">0/0</span></p>
            <div id="missedWrap">
                <h4 id="lbl-missed">Slová, ktoré si nenašiel:</h4>
                <div id="missedList"></div>
            </div>
            <button id="replayBtn">Hrať znova</button>
        </div>
    </div>

    <script>

            function makeNode() { return { children: {}, isWord: false }; }

            // ----- KONFIGURACIA -----
            const SIZES = {
                s: { n: 4, time: 90, minWords: 12 },
                m: { n: 5, time: 120, minWords: 22 },
                l: { n: 6, time: 150, minWords: 32 }
            };
            const LETTER_BAG = ('EEEEEEEEEEEEAAAAAAAAARRRRRRRRIIIIIIIIOOOOOOOOTTTTTTNNNNNNSSSSSSLLLLCCCUUUDDDDPPHHGGBBFFYYWWKVXZJQ').toLowerCase().split('');

            let sizeKey = 'm';
            let N = 5, roundTime = 120;
            let grid = [];
            let cellsEl = [];
            let selectedPath = [];
            let allPossible = new Set();
            let foundWords = new Set();
            let score = 0, combo = 0;
            const bestKey = () => 'wordweave_best_' + sizeKey;
            let best = 0;
            function loadBest() { best = parseInt(localStorage.getItem(bestKey()) || '0', 10) || 0; bestSpan.textContent = best; }
            let timeLeft = 0;
            let timerId = null;
            let paused = false;
            let ended = false;
            let dragging = false;

            bestSpan.textContent = best;

            function randomLetter() {
                return LETTER_BAG[Math.floor(Math.random() * LETTER_BAG.length)];
            }

            function neighborsOf(r, c) {
                const res = [];
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        if (dr === 0 && dc === 0) continue;
                        const nr = r + dr, nc = c + dc;
                        if (nr >= 0 && nr < N && nc >= 0 && nc < N) res.push([nr, nc]);
                    }
                }
                return res;
            }

            function solveGrid() {
                const found = new Set();
                function dfs(r, c, node, path, visited) {
                    const letter = grid[r][c];
                    const child = node.children[letter];
                    if (!child) return;
                    const newPath = path + letter;
                    if (child.isWord && newPath.length >= 3) found.add(newPath);
                    visited.add(r + ',' + c);
                    for (const [nr, nc] of neighborsOf(r, c)) {
                        const key = nr + ',' + nc;
                        if (!visited.has(key)) dfs(nr, nc, child, newPath, visited);
                    }
                    visited.delete(r + ',' + c);
                }
                for (let r = 0; r < N; r++) {
                    for (let c = 0; c < N; c++) {
                        dfs(r, c, trieRoot, '', new Set());
                    }
                }
                return found;
            }

            function generateGrid() {
                const cfg = SIZES[sizeKey];
                N = cfg.n;
                roundTime = cfg.time;
                let attempts = 0;
                do {
                    grid = [];
                    for (let r = 0; r < N; r++) {
                        const row = [];
                        for (let c = 0; c < N; c++) row.push(randomLetter());
                        grid.push(row);
                    }
                    allPossible = solveGrid();
                    attempts++;
                } while (allPossible.size < cfg.minWords && attempts < 40);
            }

            // plocha je stvorec z volneho miesta, nie pevnych 56 bodov na policko
            function fitBoard() {
                const cont = document.getElementById('game-container');
                const land = window.matchMedia('(max-height:520px) and (orientation:landscape)').matches;
                const availW = Math.max(170, Math.min(430, (cont ? cont.clientWidth : 340) - 46));
                const availH = Math.max(130, window.innerHeight - (land ? 150 : 350));
                let side = Math.max(130, Math.min(availW, availH, N * 62));
                boardEl.style.width = side + 'px';
                boardEl.style.setProperty('--cellf', Math.max(11, Math.round(side / N * 0.46)) + 'px');
                for (let pass = 0; pass < 3; pass++) {
                    const spill = document.documentElement.scrollHeight - window.innerHeight;
                    if (spill <= 2 || side - spill <= 120) break;
                    side = side - spill - 3;
                    boardEl.style.width = side + 'px';
                    boardEl.style.setProperty('--cellf', Math.max(11, Math.round(side / N * 0.46)) + 'px');
                }
                pathCanvas.setAttribute('viewBox', '0 0 ' + boardEl.offsetWidth + ' ' + boardEl.offsetHeight);
                pathCanvas.style.width = boardEl.offsetWidth + 'px';
                pathCanvas.style.height = boardEl.offsetHeight + 'px';
                if (cellsEl.length) drawPath();
            }
            let weaveFitTimer = 0;
            window.addEventListener('resize', () => {
                clearTimeout(weaveFitTimer);
                weaveFitTimer = setTimeout(() => fitBoard(), 120);
            });
            window.addEventListener('load', () => fitBoard());
            // pismo z webu dorazi neskor a zmeni vysky, tak plochu prepocitam este raz
            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(() => fitBoard());
            }

            function renderBoard() {
                boardEl.style.gridTemplateColumns = `repeat(${N}, minmax(0, 1fr))`;
                boardEl.innerHTML = '';
                cellsEl = [];
                for (let r = 0; r < N; r++) {
                    const rowEls = [];
                    for (let c = 0; c < N; c++) {
                        const div = document.createElement('div');
                        div.className = 'cell';
                        div.textContent = grid[r][c].toUpperCase();
                        div.dataset.r = r;
                        div.dataset.c = c;
                        boardEl.appendChild(div);
                        rowEls.push(div);
                    }
                    cellsEl.push(rowEls);
                }
                fitBoard();
            }

            function cellCenter(r, c) {
                const el = cellsEl[r][c];
                return { x: el.offsetLeft + el.offsetWidth / 2, y: el.offsetTop + el.offsetHeight / 2 };
            }

            function drawPath() {
                let svg = '';
                if (selectedPath.length > 1) {
                    const pts = selectedPath.map(([r, c]) => cellCenter(r, c));
                    svg += '<polyline points="' + pts.map(p => p.x + ',' + p.y).join(' ') + '" fill="none" stroke="#4ade80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>';
                }
                pathCanvas.innerHTML = svg;
            }

            function isAdjacent(a, b) {
                return Math.abs(a[0] - b[0]) <= 1 && Math.abs(a[1] - b[1]) <= 1 && !(a[0] === b[0] && a[1] === b[1]);
            }

            function pathContains(r, c) {
                return selectedPath.some(([pr, pc]) => pr === r && pc === c);
            }

            function updateCurrentWord() {
                const word = selectedPath.map(([r, c]) => grid[r][c]).join('');
                currentWordEl.textContent = word.toUpperCase();
            }

            function clearSelection() {
                selectedPath.forEach(([r, c]) => cellsEl[r][c].classList.remove('selected'));
                selectedPath = [];
                updateCurrentWord();
                drawPath();
            }

            function flashCell(r, c, cls) {
                const el = cellsEl[r][c];
                el.classList.add(cls);
                setTimeout(() => el.classList.remove(cls), 320);
            }

            function addFoundWordToPanel(word) {
                const div = document.createElement('div');
                div.className = 'found-word';
                div.textContent = word.toUpperCase();
                foundListEl.insertBefore(div, foundListEl.firstChild);
            }

            function scoreForWord(word) {
                if (word.length <= 4) return 1;
                if (word.length === 5) return 2;
                return 3;
            }

            function submitWord() {
                if (selectedPath.length === 0) return;
                const word = selectedPath.map(([r, c]) => grid[r][c]).join('');
                const cellsCopy = selectedPath.slice();

                if (word.length < 3) {
                    feedback.textContent = t('swftTooShort');
                    feedback.className = 'error';
                    combo = 0;
                    comboSpan.textContent = '0';
                } else if (foundWords.has(word)) {
                    feedback.textContent = t('swftAlready');
                    feedback.className = 'error';
                    combo = 0;
                    comboSpan.textContent = '0';
                    cellsCopy.forEach(([r, c]) => flashCell(r, c, 'flash-bad'));
                } else if (!wordSet.has(word)) {
                    SFX.play('error');
                    feedback.textContent = t('swftInvalid');
                    feedback.className = 'error';
                    combo = 0;
                    comboSpan.textContent = '0';
                    cellsCopy.forEach(([r, c]) => flashCell(r, c, 'flash-bad'));
                } else {
                    SFX.play('correct');
                    foundWords.add(word);
                    const gained = scoreForWord(word);
                    score += gained;
                    combo += 1;
                    scoreSpan.textContent = score;
                    comboSpan.textContent = combo;
                    foundSpan.textContent = foundWords.size + '/' + allPossible.size;
                    addFoundWordToPanel(word);
                    feedback.textContent = '+' + gained;
                    feedback.className = 'ok';
                    cellsCopy.forEach(([r, c]) => flashCell(r, c, 'flash-ok'));
                    if (score > best) {
                        best = score;
                        bestSpan.textContent = best;
                        localStorage.setItem(bestKey(), String(best));
                    }
                }
                clearSelection();
            }

            function cellFromEvent(e) {
                const target = document.elementFromPoint(
                    e.touches ? e.touches[0].clientX : e.clientX,
                    e.touches ? e.touches[0].clientY : e.clientY
                );
                if (!target || !target.classList || !target.classList.contains('cell')) return null;
                return { r: parseInt(target.dataset.r, 10), c: parseInt(target.dataset.c, 10), el: target };
            }

            function startDrag(e) {
                if (paused || ended) return;
                const cell = cellFromEvent(e);
                if (!cell) return;
                dragging = true;
                clearSelection();
                selectedPath.push([cell.r, cell.c]);
                cell.el.classList.add('selected');
                updateCurrentWord();
                drawPath();
            }

            function moveDrag(e) {
                if (!dragging || paused || ended) return;
                const cell = cellFromEvent(e);
                if (!cell) return;
                const last = selectedPath[selectedPath.length - 1];
                if (pathContains(cell.r, cell.c)) {
                    if (selectedPath.length > 1) {
                        const prev = selectedPath[selectedPath.length - 2];
                        if (prev[0] === cell.r && prev[1] === cell.c) {
                            cellsEl[last[0]][last[1]].classList.remove('selected');
                            selectedPath.pop();
                            updateCurrentWord();
                            drawPath();
                        }
                    }
                    return;
                }
                if (isAdjacent(last, [cell.r, cell.c])) {
                    selectedPath.push([cell.r, cell.c]);
                    cell.el.classList.add('selected');
                    updateCurrentWord();
                    drawPath();
                }
            }

            function endDrag() {
                if (!dragging) return;
                dragging = false;
                if (selectedPath.length >= 1) submitWord();
            }

            boardEl.addEventListener('mousedown', startDrag);
            boardEl.addEventListener('mousemove', moveDrag);
            document.addEventListener('mouseup', endDrag);
            boardEl.addEventListener('touchstart', (e) => { e.preventDefault(); startDrag(e); }, { passive: false });
            boardEl.addEventListener('touchmove', (e) => { e.preventDefault(); moveDrag(e); }, { passive: false });
            boardEl.addEventListener('touchend', (e) => { e.preventDefault(); endDrag(); }, { passive: false });

            function tick() {
                if (paused || ended) return;
                timeLeft -= 1;
                timeSpan.textContent = timeLeft;
                if (timeLeft <= 0) endRound();
            }

            function endRound() {
                SFX.play('win');
                ended = true;
                clearInterval(timerId);
                clearSelection();
                finalScore.textContent = score;
                finalFound.textContent = foundWords.size + '/' + allPossible.size;
                missedList.innerHTML = '';
                const missed = Array.from(allPossible).filter(w => !foundWords.has(w));
                missed.sort((a, b) => b.length - a.length);
                missed.slice(0, 12).forEach(w => {
                    const span = document.createElement('span');
                    span.className = 'missed-word';
                    span.textContent = w.toUpperCase();
                    missedList.appendChild(span);
                });
                document.getElementById('missedWrap').style.display = missed.length ? 'block' : 'none';
                endOverlay.classList.add('visible');
            }

            function newRound() {
                SFX.play('shuffle');
                loadBest();   // rekord patri k aktualnej velkosti plochy
                clearInterval(timerId);
                ended = false;
                paused = false;
                pauseOverlay.classList.remove('visible');
                pauseBtn.classList.remove('paused');
                endOverlay.classList.remove('visible');
                score = 0;
                combo = 0;
                foundWords = new Set();
                scoreSpan.textContent = '0';
                comboSpan.textContent = '0';
                feedback.textContent = '';
                feedback.className = '';
                generateGrid();
                renderBoard();
                foundSpan.textContent = '0/' + allPossible.size;
                foundListEl.innerHTML = '';
                timeLeft = roundTime;
                timeSpan.textContent = timeLeft;
                clearSelection();
                timerId = setInterval(tick, 1000);
            }

            function togglePause() {
                if (ended) return;
                paused = !paused;
                pauseOverlay.classList.toggle('visible', paused);
                pauseBtn.classList.toggle('paused', paused);
                if (paused) clearSelection();
            }

            pauseBtn.addEventListener('click', togglePause);
            pauseBtn.addEventListener('touchstart', (e) => { e.preventDefault(); togglePause(); }, { passive: false });
            replayBtn.addEventListener('click', newRound);

            document.addEventListener('keydown', (e) => {
                if (e.key === 'p' || e.key === 'P') togglePause();
                if (e.key === 'Enter' && dragging) endDrag();
                if (e.key === 'Escape') clearSelection();
            });

            document.addEventListener('visibilitychange', () => {
                if (document.hidden && !ended && !paused) togglePause();
            });

            sizeGroup.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', () => {
                    sizeGroup.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    sizeKey = btn.dataset.size;
                    newRound();
                });
            });

            newRound();
        })();
    </script>
</body>
</html>
