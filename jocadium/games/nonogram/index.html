<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nonogram · Jocadium</title>
<link href="../../fonts/fonts.css" rel="stylesheet">
<script src="../../i18n.js"></script>
<script src="../../sfx.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#050507;--bg1:#0c0c10;--bg2:#111116;--bg3:#18181f;--text:#f0eeff;--muted:rgba(240,238,255,0.38);--dim:rgba(240,238,255,0.18);--border:rgba(255,255,255,0.07);--border-h:rgba(255,255,255,0.14);--c:#4dff91;--cdim:rgba(77,255,145,0.14);}
html,body{background:var(--bg);min-height:100vh;font-family:'DM Sans',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;user-select:none;}
body::before{content:'';position:fixed;width:500px;height:500px;top:-150px;left:-100px;background:radial-gradient(circle,rgba(77,255,145,0.07) 0%,transparent 65%);border-radius:50%;pointer-events:none;z-index:0;}
#back-btn{position:fixed;top:20px;left:20px;z-index:60;display:flex;align-items:center;gap:7px;background:var(--bg2);border:1px solid var(--border);color:var(--muted);padding:7px 14px;border-radius:100px;text-decoration:none;font-size:12px;font-weight:500;transition:all .18s;}
#back-btn:hover{border-color:var(--border-h);color:var(--text);}
.page{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px 12px 30px;gap:12px;}
.game-title{font-family:'Syne',sans-serif;font-weight:800;font-size:22px;letter-spacing:-.5px;background:linear-gradient(135deg,#fff 30%,var(--c) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;}
.stat-pill{background:var(--bg2);border:1px solid var(--border);border-radius:100px;padding:5px 14px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap;}
.stat-pill span{color:var(--c);}
.ctrl-btn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:5px 14px;border-radius:100px;font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;transition:all .18s;}
.ctrl-btn:hover{border-color:var(--border-h);color:var(--text);}
.ctrl-btn.active{border-color:var(--c);color:var(--c);background:var(--cdim);}
#board-wrap{background:var(--bg1);border:1px solid var(--border);border-radius:14px;padding:10px;display:inline-flex;position:relative;}

/* ── hotový obrazec ──────────────────────────────────────────────────
   Po vyriešení sa pomôcky stiahnu do pozadia a zostane len to, čo hráč
   vykreslil; políčka sa rozsvietia po diagonálach, aby bolo vidieť, že
   je to jeden obraz, nie mriežka. */
#grid-table.solved .clue-cell{opacity:.18;transition:opacity .5s ease;}
#grid-table.solved .grid-cell{border-color:transparent;transition:background .35s ease,box-shadow .35s ease,transform .35s ease;}
#grid-table.solved .grid-cell.marked::after{opacity:0;transition:opacity .3s ease;}
#grid-table.solved .grid-cell.filled{
  background:linear-gradient(145deg,#8affc0,#39d7ff);
  box-shadow:0 0 14px rgba(77,255,200,.45);
  transform:scale(1.06);
}
#solved-banner{
  position:absolute;left:50%;top:2px;transform:translate(-50%,0) scale(.92);
  display:flex;align-items:center;gap:10px;white-space:nowrap;
  padding:7px 16px;border-radius:100px;z-index:4;
  background:rgba(8,14,12,.92);border:1px solid rgba(138,255,192,.55);
  box-shadow:0 10px 30px -12px rgba(0,0,0,.9);
  font-family:'Syne',sans-serif;font-weight:800;font-size:14px;color:#8affc0;
  opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;
}
#solved-banner.show{opacity:1;transform:translate(-50%,0) scale(1);}
#solved-banner .pic{font-size:20px;line-height:1;}
#solved-banner small{font-family:'DM Sans',sans-serif;font-weight:500;font-size:11.5px;color:rgba(239,248,255,.55);}
table{border-collapse:collapse;}
.clue-cell{padding:2px 4px;text-align:center;font-size:clamp(9px,2vw,12px);color:var(--muted);font-weight:500;min-width:20px;}
.clue-cell.done{color:var(--dim);opacity:.4;text-decoration:line-through;
  text-decoration-thickness:1px;transition:opacity .18s ease,color .18s ease;}
.grid-cell{width:clamp(22px,6vw,32px);height:clamp(22px,6vw,32px);border:1px solid rgba(255,255,255,0.07);cursor:pointer;transition:background .1s;-webkit-tap-highlight-color:transparent;position:relative;}
.grid-cell.filled{background:var(--c);box-shadow:0 0 6px rgba(77,255,145,0.4);}
.grid-cell.marked{background:transparent;}
.grid-cell.marked::after{content:'×';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,107,107,0.6);font-size:14px;pointer-events:none;}
.grid-cell.wrong{background:rgba(255,107,107,0.55)!important;box-shadow:0 0 8px rgba(255,107,107,0.55);}
#hud-errors{transition:color .15s;}
#hud-errors.err-flash{color:#ff6b6b;}
.grid-cell.correct{background:rgba(77,255,145,0.15)!important;}
/* thick borders every 5 */
.border-r5{border-right:2px solid rgba(255,255,255,0.2)!important;}
.border-b5{border-bottom:2px solid rgba(255,255,255,0.2)!important;}
#overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(5,5,7,.9);backdrop-filter:blur(10px);z-index:20;}
#overlay h2{font-family:'Syne',sans-serif;font-weight:800;font-size:26px;}
.score-big{font-family:'Syne',sans-serif;font-size:48px;font-weight:800;color:var(--c);letter-spacing:-2px;}
.hint-txt{font-size:12px;color:var(--muted);text-align:center;padding:0 20px;}
.play-btn{margin-top:6px;background:var(--cdim);border:1px solid rgba(77,255,145,.3);color:var(--c);padding:10px 30px;border-radius:100px;font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;transition:background .18s;}
.play-btn:hover{background:rgba(77,255,145,.22);}
.diff-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
.diff-btn{background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--muted);padding:6px 14px;border-radius:100px;font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;transition:all .18s;}
.diff-btn:hover,.diff-btn.active{border-color:rgba(77,255,145,.4);color:var(--c);background:var(--cdim);}

/* mobil: žiadna 300 ms odozva ťuknutia, žiadne priblíženie dvojťukom */
html,body{touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
button,a,[onclick]{touch-action:manipulation;}

/* prekryv: ak sa obsah nezmestí, nesmie zmiznúť mimo obrazovky (flex centrovanie ho odreže) */
@media (max-height:820px){
  #overlay{justify-content:flex-start !important;overflow-y:auto !important;-webkit-overflow-scrolling:touch;}
}
</style>
</head>
<body>
<a href="../../index.html" id="back-btn">
  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
  <span id="lbl-back"></span>
</a>
<div id="overlay"></div>
<div class="page">
  <div class="game-title" id="lbl-title"></div>
  <div class="hud">
    <div class="stat-pill">⏱ <span id="hud-time">0</span>s</div>
    <div class="stat-pill"><span id="lbl-err-txt"></span>&nbsp;<span id="hud-errors">0</span></div>
    <button class="ctrl-btn active" id="btn-mode-fill" onclick="setMode('fill')"></button>
    <button class="ctrl-btn" id="btn-mode-mark" onclick="setMode('mark')"></button>
    <button class="ctrl-btn" id="btn-new" onclick="showMenu()"></button>
  </div>
  <div id="board-wrap"><table id="grid-table"></table><div id="solved-banner"></div></div>
  <div style="font-size:12px;color:var(--dim);text-align:center;max-width:340px" id="status-txt"></div>
</div>
<script>
document.getElementById('lbl-back').textContent     = t('back');
document.getElementById('lbl-title').textContent    = t('nonogramTitle');
document.getElementById('lbl-err-txt').textContent  = t('nonogramErrors');
document.getElementById('btn-mode-fill').textContent= t('nonogramFill');
document.getElementById('btn-mode-mark').textContent= t('nonogramMark');
document.getElementById('btn-new').textContent      = t('nonogramNew');

const DIFFS=[{key:'easy',size:5},{key:'medium',size:10},{key:'hard',size:15}];
const MAX_ERRORS=3;        // toľko chýb a hra končí
let diffIdx=0;

let solution,state,SIZE,mode='fill',errors=0,timerVal=0,timerInt,dragging=false,dragVal=null;
let rowClues=[],colClues=[];   // nápovedy, aby sa dalo odškrtávať
let penalized=new Set();   // políčka, za ktoré už chyba bola pripísaná (aby ťahanie nenafúklo počítadlo)
let errFlashTO=null;
let gameOver=false;

// preklad s náhradou – ak kľúč v i18n.js (ešte) nie je, použije sa fallback
function tr(key,fallback){
  try{const v=t(key);return(!v||v===key)?fallback:v;}catch(e){return fallback;}
}
function diffLabel(d){
  return `${t('diff'+d.key[0].toUpperCase()+d.key.slice(1))} (${d.size}×${d.size})`;
}

function setMode(m){
  mode=m;
  document.getElementById('btn-mode-fill').classList.toggle('active',m==='fill');
  document.getElementById('btn-mode-mark').classList.toggle('active',m==='mark');
}

// ── predlohy ────────────────────────────────────────────────────────
// Náhodná mriežka vyzerá ako šum a navyše sa v nej často nedá dôjsť k cieľu
// úvahou – na ťažkej úrovni skoro v štyroch z desiatich prípadov nastane bod,
// kde už hráčovi neostáva nič iné, len hádať. A hádanie tu stojí chybu.
// Preto sú to kreslené obrázky; každý prešiel riešiteľom (tools/check-nonograms.py),
// ktorý overil, že sa dá dokončiť čistou úvahou – a teda má jediné riešenie.
// Prvý prvok je emodži, ktoré sa ukáže až po vyriešení.
const PICTURES={
 5:[
  ['💗','.#.#.','#####','#####','.###.','..#..'],
  ['➕','..#..','..#..','#####','..#..','..#..'],
  ['🌲','..#..','.###.','#####','..#..','.###.'],
  ['🏠','..#..','.###.','#####','#.#.#','#.#.#'],
  ['☕','#####','#...#','#...#','.###.','#####'],
  ['⭐','..#..','#####','.###.','.#.#.','#...#'],
  ['⚓','..#..','.###.','..#..','#.#.#','.###.'],
  ['🔑','.###.','.#.#.','.###.','..#..','..##.'],
  ['⛵','...#.','..##.','.###.','#####','.###.'],
  ['🐟','..#..','.####','#####','.####','..#..'],
 ],
 10:[
  ['🐱','.#......#.','.##....##.','.########.','.#.##.##.#','.########.','.##.##.##.','.########.','..######..','...####...','....##....'],
  ['⛵','....#.....','....##....','....###...','....####..','....#####.','....#.....','..#######.','.#########','..#######.','...#####..'],
  ['🚀','....##....','...####...','...#..#...','...####...','..######..','..#.##.#..','..######..','...####...','...#..#...','...#..#...'],
  ['🌼','...####...','..######..','.###..###.','.###..###.','..######..','...####...','....##....','...###....','....##....','...####...'],
  ['🍄','...####...','..######..','.########.','##########','.########.','....##....','....##....','....##....','...####...','..######..'],
  ['💧','....#.....','....##....','...####...','...####...','..######..','..######..','.########.','..######..','..######..','...####...'],
  ['☕','..#..#....','..#..#....','..........','.########.','.########.','.######.##','.######..#','.######.##','.########.','..######..'],
  ['🏠','....##....','...####...','..######..','.########.','##########','.#......#.','.#.####.#.','.#.####.#.','.#.####.#.','.########.'],
 ],
 15:[
  ['⛵','.......#.......','.......##......','.......###.....','.......####....','.......#####...','.......######..','.......#######.','.......#.......','.......#.......','...#########...','..###########..','.#############.','..###########..','...#########...','.....#####.....'],
  ['💗','...###...###...','..#####.#####..','.#############.','###############','###############','###############','.#############.','..###########..','...#########...','....#######....','.....#####.....','......###......','.......#.......','...............','...............'],
  ['🌲','.......#.......','......###......','.....#####.....','....#######....','......###......','.....#####.....','....#######....','...#########...','.....#####.....','....#######....','...#########...','..###########..','.......#.......','.......#.......','.....#####.....'],
  ['🔑','.....#####.....','....##...##....','....#.....#....','....#.....#....','....##...##....','.....#####.....','.......#.......','.......#.......','.......#.......','.......###.....','.......#.......','.......###.....','.......#.......','.......##......','.......#.......'],
  ['🐱','.##.........##.','.###.......###.','.####.....####.','.#############.','.#############.','.##...###...##.','.##...###...##.','.#############.','.######.######.','.#####.#.#####.','.#############.','.#############.','..###########..','...#########...','.....#####.....'],
  ['🍄','....#######....','..###########..','.#############.','###############','###.#######.###','###.#######.###','.#############.','..###########..','.....#####.....','.....#####.....','.....#####.....','.....#####.....','....#######....','...#########...','...#########...'],
 ],
};

let picEmoji='🎉';
let lastPic={};

function genSolution(sz){
  const set=PICTURES[sz];
  let i=Math.floor(Math.random()*set.length);
  if(set.length>1&&i===lastPic[sz])i=(i+1+Math.floor(Math.random()*(set.length-1)))%set.length;
  lastPic[sz]=i;
  picEmoji=set[i][0];
  return set[i].slice(1).map(row=>[...row].map(ch=>ch==='#'?1:0));
}

function clues(arr){
  const groups=[];let cnt=0;
  for(const v of arr){if(v){cnt++;}else if(cnt){groups.push(cnt);cnt=0;}}
  if(cnt)groups.push(cnt);
  return groups.length?groups:[0];
}

// jedno miesto, ktoré stavia prekrytie – menu, výhru aj prehru
function showOverlay({icon,title,big,bigColor,sub,btn}){
  const ov=document.getElementById('overlay');
  ov.innerHTML=`<div style="font-size:42px">${icon}</div>
    <h2>${title}</h2>
    ${big?`<div class="score-big"${bigColor?` style="color:${bigColor}"`:''}>${big}</div>`:''}
    ${sub?`<div class="hint-txt">${sub}</div>`:''}
    <div class="diff-row" id="diff-row"></div>
    <button class="play-btn" onclick="startGame()">${btn}</button>`;
  const dr=document.getElementById('diff-row');
  DIFFS.forEach((d,i)=>{
    const b=document.createElement('button');
    b.className='diff-btn'+(i===diffIdx?' active':'');
    b.textContent=diffLabel(d);
    b.onclick=()=>{diffIdx=i;dr.querySelectorAll('.diff-btn').forEach((x,j)=>x.classList.toggle('active',j===i));};
    dr.appendChild(b);
  });
  ov.style.display='flex';
}

function showMenu(){
  clearInterval(timerInt);
  showOverlay({
    icon:'🖼️',
    title:t('nonogramTitle'),
    sub:`${t('nonogramHint')}<br><span style="color:var(--dim)">${t('nonogramErrors')}: max ${MAX_ERRORS}</span>`,
    btn:t('nonogramPlay')
  });
}

function gameOverScreen(){
  SFX.play('lose');
  showOverlay({
    icon:'💥',
    title:tr('nonogramLose','Game over'),
    big:`${errors} / ${MAX_ERRORS}`,
    bigColor:'#ff6b6b',
    sub:`${tr('nonogramLoseHint','Too many mistakes.')} &nbsp;⏱ ${timerVal}s`,
    btn:t('nonogramAgain')
  });
}

function updateErrHud(){
  document.getElementById('hud-errors').textContent=`${errors} / ${MAX_ERRORS}`;
}

function startGame(){
  clearTimeout(revealTO);
  const tbl0=document.getElementById('grid-table');
  if(tbl0) tbl0.classList.remove('solved');
  const ban=document.getElementById('solved-banner');
  if(ban) ban.classList.remove('show');
  SFX.play('start');
  document.getElementById('overlay').style.display='none';
  SIZE=DIFFS[diffIdx].size;
  solution=genSolution(SIZE);
  state=Array.from({length:SIZE},()=>Array(SIZE).fill(0)); // 0=empty,1=filled,2=marked
  errors=0;timerVal=0;gameOver=false;dragging=false;
  penalized=new Set();
  clearTimeout(errFlashTO);
  document.getElementById('hud-errors').classList.remove('err-flash');
  updateErrHud();
  document.getElementById('hud-time').textContent='0';
  document.getElementById('status-txt').textContent='';
  clearInterval(timerInt);
  timerInt=setInterval(()=>{timerVal++;document.getElementById('hud-time').textContent=timerVal;},1000);
  renderGrid();
}

function renderGrid(){
  const tbl=document.getElementById('grid-table');
  tbl.innerHTML='';
  rowClues=solution.map(row=>clues(row));
  colClues=solution[0].map((_,c)=>clues(solution.map(r=>r[c])));
  const maxRowClue=Math.max(...rowClues.map(c=>c.length));
  const maxColClue=Math.max(...colClues.map(c=>c.length));

  // Header rows (col clues)
  for(let hRow=0;hRow<maxColClue;hRow++){
    const tr=document.createElement('tr');
    // corner cells
    for(let i=0;i<maxRowClue;i++){const td=document.createElement('td');tr.appendChild(td);}
    for(let c=0;c<SIZE;c++){
      const td=document.createElement('td');
      td.className='clue-cell';
      const idx=colClues[c].length-(maxColClue-hRow);
      td.textContent=idx>=0?colClues[c][idx]:'';
      if(idx>=0)td.dataset.col=c;
      tr.appendChild(td);
    }
    tbl.appendChild(tr);
  }

  // Grid rows
  for(let r=0;r<SIZE;r++){
    const tr=document.createElement('tr');
    // row clues
    for(let i=0;i<maxRowClue;i++){
      const td=document.createElement('td');
      td.className='clue-cell';
      const idx=rowClues[r].length-(maxRowClue-i);
      td.textContent=idx>=0?rowClues[r][idx]:'';
      if(idx>=0)td.dataset.row=r;
      tr.appendChild(td);
    }
    // grid cells
    for(let c=0;c<SIZE;c++){
      const td=document.createElement('td');
      td.className='grid-cell';
      if(state[r][c]===1)td.classList.add('filled');
      if(state[r][c]===2)td.classList.add('marked');
      if((c+1)%5===0&&c<SIZE-1)td.classList.add('border-r5');
      if((r+1)%5===0&&r<SIZE-1)td.classList.add('border-b5');
      td.dataset.r=r;td.dataset.c=c;
      td.addEventListener('mousedown',e=>{e.preventDefault();startDrag(r,c);});
      td.addEventListener('mouseover',()=>{if(dragging)applyDrag(r,c);});
      td.addEventListener('touchstart',e=>{e.preventDefault();startDrag(r,c);},{passive:false});
      td.addEventListener('touchmove',e=>{
        e.preventDefault();
        const touch=e.touches[0];
        const el=document.elementFromPoint(touch.clientX,touch.clientY);
        if(el?.dataset?.r!==undefined)applyDrag(+el.dataset.r,+el.dataset.c);
      },{passive:false});
      tr.appendChild(td);
    }
    tbl.appendChild(tr);
  }
  for(let i=0;i<SIZE;i++){markDone('row',i);markDone('col',i);}
}

// ── odškrtávanie hotových nápovied ──────────────────────────────────
// Keď sa riadok (stĺpec) zhoduje so svojou nápoveďou, čísla zblednú a
// preškrtnú sa. Pri 15×15 je to hlavná úľava: hráč nemusí po každom ťahu
// prechádzať celý okraj a kontrolovať, čo už má za sebou.
// Zle vyfarbené políčko hra nikdy nenechá stáť, takže vyfarbené políčka sú
// vždy podmnožinou riešenia – ak teda nápoveď sedí, riadok je naozaj hotový.
function sameClue(a,b){return a.length===b.length&&a.every((v,i)=>v===b[i]);}

function markDone(kind,idx){
  const line=kind==='row'
    ? state[idx].map(v=>v===1?1:0)
    : state.map(row=>row[idx]===1?1:0);
  const done=sameClue(clues(line),kind==='row'?rowClues[idx]:colClues[idx]);
  document.querySelectorAll(`.clue-cell[data-${kind==='row'?'row':'col'}="${idx}"]`)
    .forEach(td=>td.classList.toggle('done',done));
}

function startDrag(r,c){
  if(gameOver)return;
  dragging=true;
  // toggle logic
  if(mode==='fill') dragVal=state[r][c]===1?0:1;
  else dragVal=state[r][c]===2?0:2;
  applyDrag(r,c);
}

function cellEl(r,c){
  return document.querySelector(`.grid-cell[data-r="${r}"][data-c="${c}"]`);
}

function paintCell(r,c){
  const td=cellEl(r,c);
  if(!td)return null;
  td.className='grid-cell';
  if((c+1)%5===0&&c<SIZE-1)td.classList.add('border-r5');
  if((r+1)%5===0&&r<SIZE-1)td.classList.add('border-b5');
  if(state[r][c]===1)td.classList.add('filled');
  if(state[r][c]===2)td.classList.add('marked');
  return td;
}

// chyba = vyfarbenie prázdneho políčka, alebo krížik na políčku, ktoré má byť vyfarbené
function isWrongMove(r,c,val){
  if(val===1)return solution[r][c]===0;
  if(val===2)return solution[r][c]===1;
  return false;  // mazanie nikdy nie je chyba
}

function registerError(r,c){
  SFX.play('error');
  const key=r+','+c;
  if(!penalized.has(key)){
    penalized.add(key);
    errors++;
    const errEl=document.getElementById('hud-errors');
    updateErrHud();
    errEl.classList.add('err-flash');
    clearTimeout(errFlashTO);
    errFlashTO=setTimeout(()=>errEl.classList.remove('err-flash'),400);
  }
  state[r][c]=0;              // ťah sa zruší
  const td=paintCell(r,c);
  markDone('row',r);markDone('col',c);
  if(td){
    td.classList.add('wrong');
    setTimeout(()=>td.classList.remove('wrong'),280);
  }
  if(errors>=MAX_ERRORS){
    gameOver=true;dragging=false;      // ďalšie kliky sa už neberú
    clearInterval(timerInt);
    setTimeout(gameOverScreen,450);    // nech je posledné bliknutie vidieť
  }
}

function applyDrag(r,c){
  if(!dragging||gameOver)return;
  if(isWrongMove(r,c,dragVal)){registerError(r,c);return;}
  SFX.play('tick');
  state[r][c]=dragVal;
  paintCell(r,c);
  markDone('row',r);markDone('col',c);
  checkWin();
}

document.addEventListener('mouseup',()=>dragging=false);
document.addEventListener('touchend',()=>dragging=false);

function checkWin(){
  if(gameOver)return;
  const solved=solution.every((row,r)=>row.every((v,c)=>(v===1)===(state[r][c]===1)));
  if(!solved)return;
  SFX.play('win');
  clearInterval(timerInt);
  gameOver=true;
  revealSolved();
}

// Okno s vysledkom az po tom, co si hrac stihne pozriet, co vyriesil.
const REVEAL_MS=2600;
let revealTO=null;

function revealSolved(){
  const tbl=document.getElementById('grid-table');
  tbl.classList.add('solved');
  // policka sa rozsvecuju po diagonalach, nie naraz
  tbl.querySelectorAll('.grid-cell').forEach(td=>{
    const r=+td.dataset.r, c=+td.dataset.c;
    td.style.transitionDelay=((r+c)*0.035)+'s';
  });
  const banner=document.getElementById('solved-banner');
  banner.innerHTML=`<span class="pic">${picEmoji}</span> ${t('nonogramWin')} `
    +`<small>${timerVal}s · ${t('nonogramErrors')} ${errors}/${MAX_ERRORS}</small>`;
  banner.classList.add('show');
  // ťuknutie preskoci cakanie
  const skip=()=>{clearTimeout(revealTO);finishReveal();};
  document.addEventListener('pointerdown',skip,{once:true});
  revealTO=setTimeout(()=>{document.removeEventListener('pointerdown',skip);finishReveal();},REVEAL_MS);
}

function finishReveal(){
  showOverlay({
    icon:picEmoji,
    title:t('nonogramWin'),
    big:`${timerVal}s`,
    sub:`${t('nonogramErrors')}: ${errors} / ${MAX_ERRORS}`,
    btn:t('nonogramAgain')
  });
}

showMenu();   // úvodné menu
</script>
