<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Neon Lane · Jocadium</title>
<link href="../../fonts/fonts.css" rel="stylesheet">
<script src="../../i18n.js"></script>
<script src="../../sfx.js"></script>
<script src="../../endcard.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#050507;--bg1:#0c0c10;--bg2:#111116;--text:#f0eeff;--muted:rgba(240,238,255,.42);
  --border:rgba(255,255,255,.08);--border-h:rgba(255,255,255,.16);--cyan:#65d6ff;--pink:#ff86d1;--gold:#ffd166;
}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;user-select:none;touch-action:none}
body::before{content:"";position:fixed;right:-190px;top:-230px;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(101,214,255,.08),transparent 66%);pointer-events:none}
body::after{content:"";position:fixed;left:-210px;bottom:-260px;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(255,134,209,.055),transparent 66%);pointer-events:none}
#back-btn{position:fixed;top:20px;left:20px;z-index:10;display:flex;align-items:center;gap:7px;background:var(--bg2);border:1px solid var(--border);color:var(--muted);padding:7px 14px;border-radius:100px;text-decoration:none;font-size:12px;font-weight:500;transition:all .18s}
#back-btn:hover{border-color:var(--border-h);color:var(--text)}
.page{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;padding:64px 14px 18px}
.game-title{font-family:'Syne',sans-serif;font-size:clamp(25px,7vw,38px);font-weight:800;letter-spacing:0;background:linear-gradient(135deg,#fff 25%,var(--cyan) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hud{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;max-width:760px}
.pill,.ctrl-btn{height:32px;border-radius:100px;border:1px solid var(--border);background:var(--bg2);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500}
.pill{display:flex;align-items:center;gap:6px;color:var(--muted);padding:0 12px;white-space:nowrap}
.pill span{color:var(--cyan);font-variant-numeric:tabular-nums}
.ctrl-btn{color:var(--muted);padding:0 13px;cursor:pointer;transition:all .18s}
.ctrl-btn:hover,.ctrl-btn:focus-visible{border-color:var(--border-h);color:var(--text);outline:none}

/* Boost je zásoba, nie číslo — prúžok povie jedným pohľadom, koľko zostáva. */
#boost-track{width:46px;height:6px;border-radius:100px;background:rgba(255,255,255,.1);overflow:hidden}
#boost-fill{display:block;height:100%;width:45%;border-radius:100px;background:linear-gradient(90deg,var(--gold),#ffe9a8);box-shadow:0 0 8px rgba(255,209,102,.8);transition:width .12s linear}
#hud-lives{letter-spacing:1px;color:var(--pink);text-shadow:0 0 10px rgba(255,134,209,.6)}
#hud-lives .spent{opacity:.22;text-shadow:none}

#game-wrap{position:relative;border:1px solid var(--border);border-radius:16px;background:linear-gradient(180deg,var(--bg2),var(--bg1));padding:8px;box-shadow:0 22px 80px rgba(0,0,0,.35)}
canvas{display:block;width:min(92vw,640px);height:auto;border-radius:11px;background:#070b10}
#overlay{position:absolute;z-index:20;inset:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;background:rgba(5,5,7,.91);backdrop-filter:blur(14px);border-radius:12px;text-align:center;padding:18px}
#overlay.hidden{display:none}
.ov-icon{font-size:42px;line-height:1}
#overlay h2{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;letter-spacing:0}
.hint{max-width:390px;color:var(--muted);font-size:12px;line-height:1.5}
.play-btn{min-width:118px;height:40px;border-radius:100px;border:1px solid rgba(101,214,255,.46);background:rgba(101,214,255,.15);color:var(--cyan);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;padding:0 28px;cursor:pointer;box-shadow:0 10px 28px rgba(0,0,0,.34)}
.touch-controls{display:flex;gap:8px;margin-top:2px}
.touch-controls button{width:58px;height:38px;border-radius:12px;border:1px solid var(--border);background:var(--bg2);color:var(--muted);font-size:16px}
.touch-controls button:active{border-color:var(--border-h);color:var(--text)}
#touch-boost:active{border-color:rgba(255,209,102,.5);color:var(--gold)}
/* Na úzkom displeji je každý riadok HUD-u uberaný z cesty. Rýchlosť je
   jediný údaj, ktorý hráč vidí aj bez čísla - na pruhoch pod kolesami. */
@media (max-width:520px){#pill-speed{display:none}}
@media (max-height:700px){.page{gap:9px}.game-title{font-size:24px}.pill,.ctrl-btn{height:29px}.touch-controls button{height:34px}}
@media (orientation: landscape) and (max-height: 560px) {
  .page { padding: 46px 10px 8px; gap: 6px; }
  #back-btn { top: 8px; left: 8px; padding: 5px 12px; font-size: 11px; }
  .game-title { font-size: 18px; }
  .pill,.ctrl-btn { height: 24px; font-size: 10px; }
  .touch-controls { gap: 5px; margin-top: 0; }
  .touch-controls button { width: 44px; height: 28px; font-size: 13px; }
}

/* landscape-fix: nízke obrazovky */
@media (max-height:760px){
  .page{gap:5px !important;padding-top:40px !important;}
  button{height:30px !important;}
}

/* landscape-fix 2 */
@media (max-height:700px){
  .page{gap:4px !important;padding-top:34px !important;}
}
</style>
</head>
<body>
<a href="../../index.html" id="back-btn">
  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
  <span id="lbl-back"></span>
</a>

<main class="page">
  <h1 class="game-title" id="lbl-title"></h1>
  <div class="hud">
    <div class="pill"><span id="lbl-score"></span>&nbsp;<span id="hud-score">0</span></div>
    <div class="pill"><span id="hud-lives"></span></div>
    <div class="pill" id="pill-speed"><span id="lbl-speed"></span>&nbsp;<span id="hud-speed">0</span></div>
    <div class="pill"><span id="lbl-boost"></span><i id="boost-track"><i id="boost-fill"></i></i></div>
    <div class="pill"><span id="lbl-best"></span>&nbsp;<span id="hud-best">0</span></div>
    <button class="ctrl-btn" id="btn-pause"></button>
    <button class="ctrl-btn" id="btn-reset"></button>
  </div>
  <div id="game-wrap">
    <canvas id="c" width="560" height="520"></canvas>
    <div id="overlay">
      <div class="ov-icon" id="ov-icon">🏎️</div>
      <h2 id="ov-title"></h2>
      <p class="hint" id="ov-hint"></p>
      <button class="play-btn" id="ov-btn"></button>
    </div>
  </div>
  <div class="touch-controls">
    <button id="touch-left">◀</button>
    <button id="touch-boost">◆</button>
    <button id="touch-right">▶</button>
  </div>
</main>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 560, H = 520;

// Plátno sa roztiahne cez CSS, takže v pozadí musí mať toľko bodov, koľko ich
// displej naozaj má — inak je celá hra mäkká. Súradnice zostávajú 560x520.
function fitCanvas(){
  const winW = window.innerWidth || document.documentElement.clientWidth || 0;
  const winH = window.innerHeight || document.documentElement.clientHeight || 0;
  if(!winW || !winH){ requestAnimationFrame(fitCanvas); return; }
  const page = document.querySelector('.page');
  const title = document.querySelector('.game-title');
  const hud = document.querySelector('.hud');
  const wrap = document.getElementById('game-wrap');
  const touch = document.querySelector('.touch-controls');
  const pageCs = getComputedStyle(page);
  const gap = parseFloat(pageCs.rowGap || pageCs.gap) || 13;
  const padTop = parseFloat(pageCs.paddingTop) || 0;
  const padBottom = parseFloat(pageCs.paddingBottom) || 0;
  const wrapCs = getComputedStyle(wrap);
  const wrapExtra = (parseFloat(wrapCs.paddingTop)||0) + (parseFloat(wrapCs.paddingBottom)||0)
                   + (parseFloat(wrapCs.borderTopWidth)||0) + (parseFloat(wrapCs.borderBottomWidth)||0);
  const touchH = (touch && touch.offsetParent !== null) ? touch.offsetHeight : 0;
  const reservedH = title.offsetHeight + hud.offsetHeight + touchH + padTop + padBottom + gap*3 + wrapExtra;
  const availH = winH - reservedH - 6;   // rezerva, inak stranka o par bodov pretecie
  const availW = Math.min(winW * 0.92, 640);
  const targetW = Math.max(140, Math.min(availW, availH * (W / H)));
  canvas.style.width = Math.floor(targetW) + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(targetW * dpr);
  canvas.height = Math.round(targetW * dpr * H / W);
  ctx.setTransform(canvas.width / W, 0, 0, canvas.width / W, 0, 0);
  if(typeof draw === 'function') draw();
}

const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ov-title');
const ovHint = document.getElementById('ov-hint');
const ovIcon = document.getElementById('ov-icon');
const ovBtn = document.getElementById('ov-btn');
const btnPause = document.getElementById('btn-pause');
const btnReset = document.getElementById('btn-reset');
const hudScore = document.getElementById('hud-score');
const hudSpeed = document.getElementById('hud-speed');
const hudBest = document.getElementById('hud-best');
const hudLives = document.getElementById('hud-lives');
const boostFill = document.getElementById('boost-fill');
const keys = {};
const STORAGE = 'neon_lane_best';
const lanes = [170, 245, 315, 390];
const START_LIVES = 3, MAX_LIVES = 5;

let player, traffic, boosts, hearts, sparks, trail, city;
let lane = 1, targetLane = 1;
let speed = 220, score = 0, boost = 45, road = 0, cityScroll = 0;
let lives = START_LIVES, invuln = 0, shake = 0;
let running = false, paused = false, lastTime = 0, frameId = 0;
let spawnTimer = 0, boostTimer = 2.2, heartTimer = 14;
let message = '', messageSub = '', messageTimer = 0;

function applyLabels(){
  document.getElementById('lbl-back').textContent = t('back');
  document.getElementById('lbl-title').textContent = t('neonLaneTitle');
  document.getElementById('lbl-score').textContent = t('neonLaneScore');
  document.getElementById('lbl-speed').textContent = t('neonLaneSpeed');
  document.getElementById('lbl-boost').textContent = t('neonLaneBoost');
  document.getElementById('lbl-best').textContent = t('neonLaneBest');
  btnPause.textContent = t('neonLanePause');
  btnReset.textContent = t('neonLaneReset');
  ovTitle.textContent = t('neonLaneTitle');
  ovHint.textContent = t('neonLaneHint');
  ovBtn.textContent = t('neonLaneStart');
}
function tr(key, fallback){
  try{ const v = t(key); return (!v || v === key) ? fallback : v; }catch(e){ return fallback; }
}

// ── mesto po stranách ─────────────────────────────────────────────────────
// Doteraz bola vedľa cesty čierna plocha a jediné, čo prezrádzalo pohyb, boli
// prerušované čiary. Mesto uteká pomalšie ako cesta, takže je z neho vidieť
// hĺbku aj rýchlosť.
function makeCity(){
  const out = [];
  for(const side of [0, 1]){
    const x0 = side ? 440 : 0, x1 = side ? 560 : 120;
    let y = -200;
    while(y < H + 400){
      const w = 26 + Math.random() * 46;
      const h = 54 + Math.random() * 120;
      const x = x0 + Math.random() * (x1 - x0 - w);
      out.push({x, y, w, h, hue: Math.random() < .5 ? '#65d6ff' : '#ff86d1',
                win: Math.random() < .8, seed: Math.random()});
      y += h + 24 + Math.random() * 60;
    }
  }
  return out;
}

function resetGame(){
  SFX.play('start');
  cancelAnimationFrame(frameId);
  lane = 1; targetLane = 1;
  player = {x:lanes[lane], y:H-82, w:34, h:58};
  traffic = []; boosts = []; hearts = []; sparks = []; trail = [];
  city = makeCity();
  speed = 220; score = 0; boost = 45; road = 0; cityScroll = 0;
  lives = START_LIVES; invuln = 0; shake = 0;
  spawnTimer = .4; boostTimer = 2.2; heartTimer = 14;
  running = true; paused = false; message = ''; messageSub = ''; messageTimer = 0;
  btnPause.textContent = t('neonLanePause');
  overlay.classList.add('hidden');
  updateHud();
  lastTime = performance.now();
  frameId = requestAnimationFrame(loop);
}

function loop(now){
  if(!running) return;
  const dt = Math.min(.033, (now - lastTime) / 1000 || 0);
  lastTime = now;
  if(!paused) update(dt);
  draw();
  if(running) frameId = requestAnimationFrame(loop);
}

function update(dt){
  const boosting = (keys.KeyW || keys.ArrowUp || keys.Boost) && boost > 0;
  const braking = keys.KeyS || keys.ArrowDown;
  speed += (boosting ? 185 : braking ? -130 : 18) * dt;
  speed = clamp(speed, 160, 520);
  if(boosting) boost = Math.max(0, boost - 32 * dt);
  else boost = Math.min(100, boost + 8 * dt);
  player.x += (lanes[targetLane] - player.x) * Math.min(1, dt * 12);
  road = (road + speed * dt) % 80;
  cityScroll += speed * dt * .42;
  score += speed * dt * .045;
  if(invuln > 0) invuln -= dt;
  if(shake > 0) shake = Math.max(0, shake - dt * 2.4);

  // svetelný chvost za autom
  trail.unshift({x:player.x, y:player.y, boost:boosting});
  if(trail.length > 14) trail.pop();

  spawnTimer -= dt; boostTimer -= dt; heartTimer -= dt;
  if(spawnTimer <= 0){
    spawnTraffic();
    spawnTimer = Math.max(.42, 1.15 - score / 1800);
  }
  if(boostTimer <= 0){
    boosts.push({x:lanes[Math.floor(Math.random()*lanes.length)], y:-30, r:11});
    boostTimer = 3.1 + Math.random() * 2;
  }
  // Srdce príde len vtedy, keď je o čo stáť — pri plnom stave by to bola
  // len ďalšia prekážka v jazdnom pruhu.
  if(heartTimer <= 0){
    if(lives < MAX_LIVES){
      hearts.push({x:lanes[Math.floor(Math.random()*lanes.length)], y:-30});
      heartTimer = 16 + Math.random() * 10;
    } else heartTimer = 5;
  }

  for(const car of traffic){
    car.y += (speed - car.speed) * dt;
    // `running` tu musí byť: dve autá v tom istom snímku by inak vzali dva životy
    // naraz, a pri poslednom by to šlo aj pod nulu.
    if(invuln <= 0 && running && rects(player, car)) crash();
    // tesné minutie: auto prejde popri hráčovi a nie je to zrážka
    if(!car.scored && car.y > player.y + 30){
      car.scored = true;
      const dx = Math.abs(car.x - player.x);
      if(dx < 95){
        score += 25;
        SFX.play('tick');
        flash(tr('neonLaneNearMiss','Near miss'), '+25');
      }
    }
  }
  for(const item of boosts){
    item.y += speed * dt;
    if(Math.hypot(player.x-item.x, player.y-item.y) < 34){
      item.dead = true;
      boost = Math.min(100, boost + 35);
      SFX.play('coin');
      flash('+ ' + t('neonLaneBoost'), '');
    }
  }
  for(const h of hearts){
    h.y += speed * dt;
    if(Math.hypot(player.x-h.x, player.y-h.y) < 36){
      h.dead = true;
      lives = Math.min(MAX_LIVES, lives + 1);
      SFX.play('levelup');
      flash(tr('neonLaneExtraLife','Extra life'), '+1');
    }
  }
  traffic = traffic.filter(c => c.y < H + 80);
  boosts = boosts.filter(b => !b.dead && b.y < H + 40);
  hearts = hearts.filter(h => !h.dead && h.y < H + 40);
  sparks.forEach(s => {s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy+=260*dt; s.life-=dt;});
  sparks = sparks.filter(s => s.life > 0);
  messageTimer = Math.max(0, messageTimer - dt);
  updateHud();
}

function spawnTraffic(){
  const used = new Set();
  const count = Math.random() < .28 ? 2 : 1;
  for(let i=0;i<count;i++){
    let l = Math.floor(Math.random() * lanes.length);
    if(used.has(l)) l = (l + 1) % lanes.length;
    used.add(l);
    traffic.push({x:lanes[l], y:-70 - i*45, w:34, h:58, speed:70 + Math.random()*120,
                  color:['#ff6b6b','#ffd166','#a78bfa','#55f0a0'][Math.floor(Math.random()*4)]});
  }
}

function changeLane(dir){
  if(!running){resetGame();return;}
  SFX.play('whoosh');
  targetLane = clamp(targetLane + dir, 0, lanes.length - 1);
}

// ── havária ───────────────────────────────────────────────────────────────
// Jedna chyba doteraz znamenala koniec jazdy. Teraz stojí život: auto chvíľu
// bliká, pred ním sa uvoľní miesto a jazdí sa ďalej. Koniec príde až na nule.
function crash(){
  lives--;
  burst(player.x, player.y);
  shake = 1;
  if(lives > 0){
    SFX.play('explode');
    invuln = 2.2;
    speed = Math.max(160, speed * .55);
    // bez uvoľnenia miesta by hráč narazil znova hneď, ako ochrana skončí
    traffic = traffic.filter(c => c.y < player.y - 170 || c.y > player.y + 90);
    flash('-1', '');
    updateHud();
    return;
  }
  SFX.play('lose');
  const best = Number(localStorage.getItem(STORAGE) || 0);
  if(Math.floor(score) > best) localStorage.setItem(STORAGE, String(Math.floor(score)));
  running = false;
  cancelAnimationFrame(frameId);
  ovIcon.textContent = '💥';
  ovTitle.textContent = t('neonLaneOver');
  ovHint.textContent = t('neonLaneScore') + ': ' + Math.floor(score);
  ovBtn.textContent = t('neonLaneStart');
  EndCard.after(1200, () => overlay.classList.remove('hidden'));
  updateHud();
}

function burst(x,y){
  for(let i=0;i<34;i++){
    const a = Math.random()*Math.PI*2, s = 70 + Math.random()*220;
    sparks.push({x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s - 60, life:.35+Math.random()*.45,
                 c: Math.random() < .5 ? '#ffd166' : '#ff8d6b'});
  }
}

function rects(a,b){return Math.abs(a.x-b.x)<(a.w+b.w)/2-4 && Math.abs(a.y-b.y)<(a.h+b.h)/2-5}
function flash(text, sub){message=text; messageSub=sub||''; messageTimer=.9}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

function updateHud(){
  hudScore.textContent = Math.floor(score);
  hudSpeed.textContent = Math.floor(speed);
  hudBest.textContent = localStorage.getItem(STORAGE) || '0';
  boostFill.style.width = Math.max(0, Math.min(100, boost)) + '%';
  let h = '';
  for(let i=0;i<MAX_LIVES;i++) h += i < lives ? '♥' : '<span class="spent">♥</span>';
  hudLives.innerHTML = h;
}

// ── vykreslenie ───────────────────────────────────────────────────────────
function draw(){
  ctx.save();
  if(shake > 0){
    const s = shake * 7;
    ctx.translate((Math.random()-.5)*s, (Math.random()-.5)*s);
  }
  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0b1a26'); bg.addColorStop(.45,'#07121a'); bg.addColorStop(1,'#04070a');
  ctx.fillStyle = bg; ctx.fillRect(-20,-20,W+40,H+40);
  drawCity(); drawRoad(); drawSpeedLines();
  drawBoosts(); drawHearts(); drawTraffic(); drawTrail(); drawPlayer(); drawSparks();
  ctx.restore();
  drawMessage();
}

function drawCity(){
  for(const b of city){
    let y = (b.y + cityScroll) % (H + 600) - 240;
    ctx.fillStyle = '#0b0f16';
    ctx.fillRect(b.x, y, b.w, b.h);
    ctx.strokeStyle = b.hue; ctx.globalAlpha = .34; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(b.x, y+.5); ctx.lineTo(b.x+b.w, y+.5); ctx.stroke();
    ctx.globalAlpha = 1;
    if(b.win){
      ctx.fillStyle = 'rgba(255,230,160,.5)';
      for(let wy = y + 12; wy < y + b.h - 8; wy += 15){
        for(let wx = b.x + 6; wx < b.x + b.w - 8; wx += 13){
          if(((wx*7 + wy*3 + b.seed*100) | 0) % 5 < 2) ctx.fillRect(wx, wy, 5, 7);
        }
      }
    }
  }
}

function drawRoad(){
  ctx.fillStyle = '#0d141c';
  ctx.fillRect(120, 0, 320, H);
  // svietiace okraje
  for(const [x, col] of [[120,'#65d6ff'],[440,'#ff86d1']]){
    ctx.strokeStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 16; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
    ctx.shadowBlur = 0;
  }
  // deliace čiary sa pri vyššej rýchlosti naťahujú — to je ten pocit tempa
  const stretch = clamp(26 + (speed - 160) * .13, 26, 72);
  ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 2;
  for(let i=1;i<lanes.length;i++){
    const x = (lanes[i-1] + lanes[i]) / 2;
    for(let y=-80+road;y<H;y+=80){
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y+stretch); ctx.stroke();
    }
  }
}

function drawSpeedLines(){
  const k = (speed - 220) / 300;
  if(k <= 0) return;
  ctx.save();
  ctx.globalAlpha = Math.min(.5, k * .55);
  ctx.strokeStyle = '#9fe8ff'; ctx.lineWidth = 2;
  for(let i=0;i<14;i++){
    const x = 128 + ((i * 97 + Math.floor(road*4)) % 304);
    const y = ((i * 211 + road * 9) % (H + 160)) - 80;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 40 + k * 90); ctx.stroke();
  }
  ctx.restore();
}

function drawTrail(){
  for(let i = trail.length - 1; i >= 1; i--){
    const p = trail[i], k = 1 - i / trail.length;
    ctx.globalAlpha = k * (p.boost ? .5 : .28);
    ctx.fillStyle = p.boost ? '#ffd166' : '#65d6ff';
    const w = 16 * k + 4;
    ctx.fillRect(p.x - w/2, p.y + 18 + i * 3.4, w, 7);
  }
  ctx.globalAlpha = 1;
}

function drawCar(car, isPlayer){
  ctx.save(); ctx.translate(car.x, car.y);
  if(isPlayer && invuln > 0 && Math.floor(invuln * 10) % 2 === 0) ctx.globalAlpha = .35;
  ctx.fillStyle = isPlayer ? '#65d6ff' : car.color;
  ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = isPlayer ? 20 : 12;
  roundRect(-car.w/2,-car.h/2,car.w,car.h,8,true,false);
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,255,255,.82)';
  ctx.fillRect(-car.w/2+6,-car.h/2+8,car.w-12,8);
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.fillRect(-car.w/2+6,car.h/2-15,car.w-12,6);
  if(isPlayer){
    // reflektory dopredu
    ctx.fillStyle = 'rgba(255,245,210,.85)';
    ctx.shadowColor = '#fff3c4'; ctx.shadowBlur = 14;
    ctx.fillRect(-car.w/2+5,-car.h/2-5,7,6);
    ctx.fillRect(car.w/2-12,-car.h/2-5,7,6);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffd166';
    ctx.fillRect(-car.w/2+5,car.h/2,7,10);
    ctx.fillRect(car.w/2-12,car.h/2,7,10);
  } else {
    ctx.fillStyle = 'rgba(255,90,90,.75)';
    ctx.fillRect(-car.w/2+5,car.h/2-4,7,5);
    ctx.fillRect(car.w/2-12,car.h/2-4,7,5);
  }
  ctx.restore();
}

function drawTraffic(){traffic.forEach(c => drawCar(c, false));}
function drawPlayer(){drawCar(player, true);}

function drawBoosts(){
  for(const b of boosts){
    ctx.fillStyle = '#ffd166'; ctx.shadowColor = '#ffd166'; ctx.shadowBlur = 20;
    ctx.beginPath(); ctx.moveTo(b.x,b.y-13); ctx.lineTo(b.x+12,b.y); ctx.lineTo(b.x,b.y+13); ctx.lineTo(b.x-12,b.y); ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
  }
}

function drawHearts(){
  for(const h of hearts){
    ctx.save(); ctx.translate(h.x, h.y);
    ctx.fillStyle = '#ff86d1'; ctx.shadowColor = '#ff86d1'; ctx.shadowBlur = 22;
    ctx.beginPath();
    ctx.moveTo(0, 11);
    ctx.bezierCurveTo(-15, -2, -9, -14, 0, -6);
    ctx.bezierCurveTo(9, -14, 15, -2, 0, 11);
    ctx.fill();
    ctx.restore();
  }
}

function drawSparks(){
  for(const s of sparks){
    ctx.globalAlpha = Math.max(0, Math.min(1, s.life*2));
    ctx.fillStyle = s.c || '#ffd166';
    ctx.fillRect(s.x, s.y, 4, 4);
  }
  ctx.globalAlpha = 1;
}

function drawMessage(){
  if(messageTimer<=0) return;
  ctx.save();
  ctx.globalAlpha = Math.min(1, messageTimer*2);
  ctx.textAlign = 'center';
  ctx.shadowColor = 'rgba(0,0,0,.7)'; ctx.shadowBlur = 12;
  ctx.fillStyle = message === '-1' ? '#ff6b6b' : '#ffd166';
  ctx.font = '800 24px Syne';
  ctx.fillText(message, W/2, 45);
  if(messageSub){
    ctx.font = '800 15px Syne';
    ctx.fillText(messageSub, W/2, 66);
  }
  ctx.restore();
}

function roundRect(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);if(fill)ctx.fill();if(stroke)ctx.stroke();}

window.addEventListener('keydown', e => {
  if(keys[e.code]) return;
  keys[e.code] = true;
  if(e.code === 'ArrowLeft' || e.code === 'KeyA') changeLane(-1);
  if(e.code === 'ArrowRight' || e.code === 'KeyD') changeLane(1);
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
canvas.addEventListener('pointerdown', e => {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  changeLane(x < rect.width / 2 ? -1 : 1);
});
document.getElementById('touch-left').addEventListener('click', () => changeLane(-1));
document.getElementById('touch-right').addEventListener('click', () => changeLane(1));
document.getElementById('touch-boost').addEventListener('pointerdown', () => {keys.Boost = true;});
document.getElementById('touch-boost').addEventListener('pointerup', () => {keys.Boost = false;});
document.getElementById('touch-boost').addEventListener('pointerleave', () => {keys.Boost = false;});
btnReset.addEventListener('click', resetGame);
btnPause.addEventListener('click', () => {if(!running)return;paused=!paused;btnPause.textContent=paused?t('neonLaneResume'):t('neonLanePause');draw();});
ovBtn.addEventListener('click', resetGame);
window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', () => setTimeout(fitCanvas, 250));

applyLabels();
player = {x:lanes[1], y:H-82, w:34, h:58};
traffic=[]; boosts=[]; hearts=[]; sparks=[]; trail=[]; city = makeCity();
fitCanvas();
updateHud();
draw();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitCanvas);
</script>
</body>
