<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sand · Jocadium</title>
<link href="../../fonts/fonts.css" rel="stylesheet">
<script src="../../i18n.js"></script>
<script src="../../sfx.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#050507;--bg2:#111116;--text:#f0eeff;--muted:rgba(240,238,255,0.42);--dim:rgba(240,238,255,0.22);--border:rgba(255,255,255,0.07);--border-h:rgba(255,255,255,0.16);--s1:#e0b872;--s2:#4aa3d4;}
html,body{background:var(--bg);height:100vh;overflow:hidden;font-family:'DM Sans',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;user-select:none;overscroll-behavior:none;}

/* Hore len návrat a názov — plátno má dostať čo najviac výšky.
   Všetko, čo sa počas hry používa, je dole pod palcom. */
#top{position:fixed;top:0;left:0;right:0;z-index:9;display:flex;align-items:center;gap:10px;padding:9px 12px 10px;background:linear-gradient(180deg,rgba(5,5,7,.96) 70%,rgba(5,5,7,0));}
#back-btn{display:flex;align-items:center;gap:7px;background:var(--bg2);border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:100px;text-decoration:none;font-size:11px;font-weight:500;transition:all .18s;flex-shrink:0;}
#back-btn:hover{border-color:var(--border-h);color:var(--text);}
.game-title{font-family:'Syne',sans-serif;font-weight:800;font-size:21px;letter-spacing:-.5px;flex:1;background:linear-gradient(110deg,#fff 22%,var(--s1) 62%,var(--s2) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}

#bottom{position:fixed;bottom:0;left:0;right:0;z-index:9;display:flex;flex-direction:column;gap:8px;padding:10px 0 10px;background:linear-gradient(0deg,rgba(5,5,7,.97) 72%,rgba(5,5,7,0));}

/* Materiálov je jedenásť. Na telefóne sa nezmestia do riadku a zalomiť ich do
   troch riadkov by zjedlo plátno — preto sa posúvajú nabok. */
#toolbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 12px;scroll-snap-type:x proximity;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 22px),transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 22px),transparent 100%);}
#toolbar::-webkit-scrollbar{display:none;}
.mat-btn{flex:0 0 auto;scroll-snap-align:center;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.045);border:1px solid var(--border);color:var(--muted);padding:7px 13px 7px 10px;border-radius:100px;font-size:11.5px;font-weight:600;cursor:pointer;transition:color .16s,border-color .16s,background .16s,box-shadow .2s;white-space:nowrap;-webkit-tap-highlight-color:transparent;}
.mat-btn .dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);transition:box-shadow .2s,transform .2s;}
.mat-btn:active{transform:scale(.96);}
.mat-btn.active{color:#fff;background:rgba(255,255,255,0.085);}
.mat-btn.active .dot{transform:scale(1.15);}

.ctrl-row{display:flex;gap:7px;justify-content:center;align-items:center;padding:0 12px;flex-wrap:wrap;}
.chip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.045);border:1px solid var(--border);color:var(--muted);padding:6px 13px;border-radius:100px;font-family:'DM Sans',sans-serif;font-size:11.5px;font-weight:600;cursor:pointer;transition:all .16s;-webkit-tap-highlight-color:transparent;}
.chip:hover{border-color:var(--border-h);color:var(--text);}
.chip:active{transform:scale(.96);}
#brush-group{display:flex;gap:3px;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:100px;padding:3px;}
.brush-btn{width:30px;height:26px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;border-radius:100px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.brush-btn i{display:block;border-radius:50%;background:var(--muted);transition:background .16s,transform .16s;}
.brush-btn.active{background:rgba(255,255,255,0.09);}
.brush-btn.active i{background:var(--s1);transform:scale(1.1);}
#bs-2 i{width:6px;height:6px;} #bs-5 i{width:10px;height:10px;} #bs-9 i{width:14px;height:14px;}
#clear-btn{background:rgba(255,107,107,0.09);border-color:rgba(255,107,107,0.26);color:#ff8585;}
#clear-btn:hover{border-color:rgba(255,107,107,0.5);color:#ff6b6b;}
#pause-btn.paused{background:rgba(224,184,114,0.12);border-color:rgba(224,184,114,0.4);color:var(--s1);}

#c{display:block;position:fixed;left:0;right:0;cursor:none;touch-action:none;}
</style>
</head>
<body>
<div id="top">
  <a href="../../index.html" id="back-btn">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    <span id="lbl-back"></span>
  </a>
  <div class="game-title" id="lbl-title"></div>
</div>

<canvas id="c"></canvas>

<div id="bottom">
  <div id="toolbar"></div>
  <div class="ctrl-row">
    <div id="brush-group">
      <button class="brush-btn active" id="bs-2" onclick="setBrush(2)"><i></i></button>
      <button class="brush-btn" id="bs-5" onclick="setBrush(5)"><i></i></button>
      <button class="brush-btn" id="bs-9" onclick="setBrush(9)"><i></i></button>
    </div>
    <button class="chip" id="pause-btn" onclick="togglePause()"><span id="pause-ico">❚❚</span><span id="lbl-pause"></span></button>
    <button class="chip" id="clear-btn" onclick="clearAll()"><span id="lbl-clear"></span></button>
  </div>
</div>

<script>
document.getElementById('lbl-back').textContent  = t('back');
document.getElementById('lbl-title').textContent = t('sandTitle');
document.getElementById('lbl-clear').textContent = t('sandClear');

// preklad s náhradou — kým sa kľúč nedostane do i18n.js, hra beží ďalej
function tr(key, fallback){
  try { const v = t(key); return (!v || v === key) ? fallback : v; } catch(e){ return fallback; }
}

// ── MATERIÁLY ─────────────────────────────────────────────────────────────
// emissive = koľko svetla políčko vyžaruje do žiarivej vrstvy (0 = nesvieti)
// fade     = kreslí sa priehľadne podľa zvyšného života (dym, para, oheň)
// flow     = pravdepodobnosť, že kvapalina odtečie nabok; voda tečie hneď,
//            láva sa sotva pohne — práve to im dáva rozdielny charakter
const ERASER = 99;
const SAND=1, WATER=2, WALL=3, FIRE=4, SMOKE=5, OIL=6, LAVA=7, PLANT=8, ACID=9, STEAM=10;

const MAT = {};
function def(id, key, fallbackName, colors, o){
  MAT[id] = Object.assign({id, key, fallbackName, colors,
    rgb: colors.map(h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]),
    falls:false, liquid:false, flammable:false, emissive:0, fade:0, flow:1, life:0}, o||{});
}
def(SAND,  'sandSand',  'Sand',  ['#d9b779','#c9a76a','#e3c589','#bd9c5f'], {falls:true});
def(WATER, 'sandWater', 'Water', ['#2f86c4','#3a9ad8','#2574ab','#4fb0e4'], {falls:true, liquid:true, flow:1});
def(WALL,  'sandWall',  'Stone', ['#5a5a63','#6a6a74','#4e4e56','#767680'], {});
def(FIRE,  'sandFire',  'Fire',  ['#ff8c1a','#ff5a12','#ffb347','#ff3d00'], {emissive:1.0, fade:1, life:26});
def(SMOKE, 'sandSmoke', 'Smoke', ['#8a8a93','#9a9aa3','#77777f','#a8a8b2'], {fade:1, life:150});
def(OIL,   'sandOil',   'Oil',   ['#6b4418','#593510','#7d5322','#4a2c0d'], {falls:true, liquid:true, flammable:true, flow:.55});
def(LAVA,  'sandLava',  'Lava',  ['#ff5a18','#e8410c','#ff7a33','#c93200'], {falls:true, liquid:true, emissive:.85, flow:.22});
def(PLANT, 'sandPlant', 'Plant', ['#3fae4a','#2f9a3d','#58c45f','#248c33'], {falls:true, flammable:true});
def(ACID,  'sandAcid',  'Acid',  ['#b4ff2e','#9ae81c','#caff5e','#86d10f'], {falls:true, liquid:true, emissive:.3, flow:.8});
def(STEAM, 'sandSteam', 'Steam', ['#cfe6f2','#b9d9ea','#e3f1f8','#a9cfe4'], {fade:1, life:120});

const ORDER = [SAND, WATER, PLANT, OIL, ACID, WALL, LAVA, FIRE, SMOKE, STEAM, ERASER];

// ── PLOCHA ────────────────────────────────────────────────────────────────
const CELL = 4;
const C = document.getElementById('c'), ctx = C.getContext('2d');
const topEl = document.getElementById('top'), botEl = document.getElementById('bottom');

// Simulácia beží v políčkach, nie v obrazových bodoch: vykreslím ju do malého
// plátna jeden bod na políčko a to potom roztiahnem bez vyhladzovania. Je to
// rádovo lacnejšie ako vypĺňať každý bod zvlášť a hrany zostanú ostré.
const buf = document.createElement('canvas'), bctx = buf.getContext('2d');
const glowA = document.createElement('canvas'), gactx = glowA.getContext('2d');
const glowB = document.createElement('canvas'), gbctx = glowB.getContext('2d');
const CAN_BLUR = typeof bctx.filter === 'string';

let COLS, ROWS, W, H, DPR = 1;
let grid, colorGrid, lifeGrid, bgPix, img, gimg;
let drawing = false, material = SAND, brushSize = 2, animId = null, paused = false;
let ptrX = -999, ptrY = -999, ptrIn = false, lastX = null, lastY = null;

function resize(){
  const winW = window.innerWidth || document.documentElement.clientWidth || 0;
  const winH = window.innerHeight || document.documentElement.clientHeight || 0;
  if (!winW || !winH) { requestAnimationFrame(resize); return; }
  const TOP_H = Math.ceil(topEl.getBoundingClientRect().height) + 2;
  const BOT_H = Math.ceil(botEl.getBoundingClientRect().height) + 2;
  const w = winW, h = Math.max(140, winH - TOP_H - BOT_H);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (grid && w === W && h === H && dpr === DPR) return;   // nič sa nezmenilo

  const oldGrid = grid, oldCol = colorGrid, oldLife = lifeGrid;
  const oldCols = COLS, oldRows = ROWS;

  W = w; H = h; DPR = dpr;
  C.style.top = TOP_H + 'px';
  C.style.width = W + 'px'; C.style.height = H + 'px';
  C.width = Math.round(W * DPR); C.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  COLS = Math.floor(W / CELL); ROWS = Math.floor(H / CELL);
  grid = new Uint8Array(COLS * ROWS);
  colorGrid = new Uint8Array(COLS * ROWS);
  lifeGrid = new Uint8Array(COLS * ROWS);

  // Prenesiem, čo tu bolo. Na telefóne stačí, aby sa pri posune skryla adresná
  // lišta, a plocha sa prepočíta - predtým sa tým celý obrázok zmazal.
  // Zvislo sa drží dna, vodorovne stredu, nech hromady zostanú ležať na zemi.
  if (oldGrid && oldCols && oldRows){
    const dx = Math.floor((COLS - oldCols) / 2), dy = ROWS - oldRows;
    for (let r = 0; r < oldRows; r++){
      const nr = r + dy;
      if (nr < 0 || nr >= ROWS) continue;
      for (let c = 0; c < oldCols; c++){
        const nc = c + dx;
        if (nc < 0 || nc >= COLS) continue;
        const a = r * oldCols + c, b = nr * COLS + nc;
        grid[b] = oldGrid[a]; colorGrid[b] = oldCol[a]; lifeGrid[b] = oldLife[a];
      }
    }
  }

  buf.width = glowA.width = glowB.width = COLS;
  buf.height = glowA.height = glowB.height = ROWS;
  img = bctx.createImageData(COLS, ROWS);
  gimg = gactx.createImageData(COLS, ROWS);
  makeBackground();
}

// Pozadie nie je čierna plocha: zhora nadol mierne presvetlená a po okrajoch
// stmavená, takže plátno má hĺbku aj keď je prázdne. Počíta sa raz.
function makeBackground(){
  bgPix = new Uint8ClampedArray(COLS * ROWS * 4);
  const cx = COLS / 2, cy = ROWS / 2, maxD = Math.hypot(cx, cy);
  for (let r = 0; r < ROWS; r++){
    const k = r / Math.max(1, ROWS - 1);
    for (let c = 0; c < COLS; c++){
      const v = 1 - 0.55 * Math.pow(Math.hypot(c - cx, r - cy) / maxD, 2.1);
      const p = (r * COLS + c) * 4;
      bgPix[p]   = (7  + 7 * k) * v;
      bgPix[p+1] = (7  + 7 * k) * v;
      bgPix[p+2] = (13 + 9 * k) * v;
      bgPix[p+3] = 255;
    }
  }
}

function idx(c, r){ return r * COLS + c; }
function get(c, r){ if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return -1; return grid[idx(c, r)]; }
function set(c, r, m, col, life){
  if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return;
  const i = idx(c, r);
  grid[i] = m;
  if (col !== undefined) colorGrid[i] = col;
  lifeGrid[i] = life !== undefined ? life : (MAT[m] ? MAT[m].life : 0);
}
function swap(c1, r1, c2, r2){
  const a = idx(c1, r1), b = idx(c2, r2);
  let t = grid[a]; grid[a] = grid[b]; grid[b] = t;
  t = colorGrid[a]; colorGrid[a] = colorGrid[b]; colorGrid[b] = t;
  t = lifeGrid[a]; lifeGrid[a] = lifeGrid[b]; lifeGrid[b] = t;
}
function rndCol(m){ return Math.floor(Math.random() * MAT[m].colors.length); }

function clearAll(){ SFX.play('whoosh'); grid.fill(0); colorGrid.fill(0); lifeGrid.fill(0); }

function togglePause(){
  paused = !paused;
  SFX.play('tick');
  const b = document.getElementById('pause-btn');
  b.classList.toggle('paused', paused);
  document.getElementById('pause-ico').textContent = paused ? '▶' : '❚❚';
  document.getElementById('lbl-pause').textContent = paused
    ? tr('sandResume', 'Resume') : tr('sandPause', 'Pause');
}

// ── KRESLENIE DO PLOCHY ───────────────────────────────────────────────────
function place(px, py){
  const c = Math.floor(px / CELL), r = Math.floor(py / CELL);
  const b2 = brushSize * brushSize;
  for (let dr = -brushSize; dr <= brushSize; dr++){
    for (let dc = -brushSize; dc <= brushSize; dc++){
      if (dc * dc + dr * dr > b2) continue;
      if (material === ERASER){ set(c + dc, r + dr, 0, 0, 0); continue; }
      // Sypké a tekuté sa sypú riedko, aby prúd vyzeral ako prúd a nie ako
      // vyliata kocka; pevné sa kreslia naplno, nech sa dá stavať.
      const mat = MAT[material];
      const thin = (mat.falls || mat.liquid) && brushSize > 2 && Math.random() < 0.35;
      if (thin) continue;
      const tgt = get(c + dc, r + dr);
      if (tgt === 0){ set(c + dc, r + dr, material, rndCol(material)); continue; }
      // Štetec inak nič neprepisuje - iba oheň, aby sa dalo zapáliť priamo to,
      // čo horí. Bez toho sa olej dal podpáliť len odvedľa a nikto na to neprišiel.
      if (material === FIRE && tgt > 0 && MAT[tgt] && MAT[tgt].flammable)
        set(c + dc, r + dr, FIRE, rndCol(FIRE));
    }
  }
}

// Medzi dvoma správami o pohybe prst preletí aj desiatky bodov. Bez dokreslenia
// úsečky by z ťahu zostali len osamotené fliačiky.
function stroke(x, y){
  if (lastX === null){ place(x, y); lastX = x; lastY = y; return; }
  const dx = x - lastX, dy = y - lastY;
  const steps = Math.ceil(Math.hypot(dx, dy) / (CELL * 0.7));
  for (let i = 1; i <= steps; i++) place(lastX + dx * i / steps, lastY + dy * i / steps);
  lastX = x; lastY = y;
}

// ── SIMULÁCIA ─────────────────────────────────────────────────────────────
const NB = [[-1,0],[1,0],[0,-1],[0,1]];

function update(){
  for (let r = ROWS - 1; r >= 0; r--){
    const ltr = Math.random() < 0.5;
    for (let ci = 0; ci < COLS; ci++){
      const c = ltr ? ci : COLS - 1 - ci;
      const m = grid[idx(c, r)];
      if (!m) continue;
      const mat = MAT[m];

      // ── oheň ──────────────────────────────────────────────────────────
      if (m === FIRE){
        const i = idx(c, r);
        if (lifeGrid[i] > 0) lifeGrid[i]--;
        if (lifeGrid[i] === 0){
          set(c, r, Math.random() < 0.55 ? SMOKE : 0, rndCol(SMOKE));
          continue;
        }
        if (r > 0 && get(c, r - 1) === 0 && Math.random() < 0.10)
          set(c, r - 1, SMOKE, rndCol(SMOKE));
        for (const [dc, dr] of NB){
          const n = get(c + dc, r + dr);
          if (n > 0 && MAT[n] && MAT[n].flammable && Math.random() < 0.055)
            set(c + dc, r + dr, FIRE, rndCol(FIRE));
          if (n === WATER && Math.random() < 0.6){
            set(c, r, STEAM, rndCol(STEAM));
            set(c + dc, r + dr, Math.random() < 0.5 ? STEAM : 0, rndCol(STEAM));
          }
        }
        continue;
      }

      // ── dym a para: stúpajú, driftujú a miznú ─────────────────────────
      if (m === SMOKE || m === STEAM){
        const i = idx(c, r);
        if (lifeGrid[i] > 0) lifeGrid[i]--;
        if (lifeGrid[i] === 0){
          // para sa zráža späť na vodu, dym sa jednoducho rozplynie
          set(c, r, m === STEAM && Math.random() < 0.45 ? WATER : 0, rndCol(WATER));
          continue;
        }
        const up = get(c, r - 1);
        const fast = m === STEAM ? 0.95 : 0.7;
        if (r > 0 && up === 0 && Math.random() < fast){ swap(c, r, c, r - 1); continue; }
        const d = Math.random() < 0.5 ? 1 : -1;
        if (get(c + d, r) === 0 && Math.random() < 0.45) swap(c, r, c + d, r);
        continue;
      }

      // ── rastlina: pije vodu a rastie ──────────────────────────────────
      if (m === PLANT){
        // Rastie len tam, kde má okolo seba ešte miesto, a pomaly. Inak by
        // z každej mláky spravila jednoliaty zelený blok v priebehu chvíle;
        // takto z nej lezú úponky.
        let around = 0;
        for (const [dc, dr] of NB) if (get(c + dc, r + dr) === PLANT) around++;
        if (around < 3 && Math.random() < 0.05){
          const free = NB.filter(([dc, dr]) => get(c + dc, r + dr) === WATER);
          if (free.length){
            const [dc, dr] = free[Math.floor(Math.random() * free.length)];
            set(c + dc, r + dr, PLANT, rndCol(PLANT));
            continue;
          }
        }
        // kým nemá o čo sa oprieť, padá ako semeno
        if (r < ROWS - 1 && get(c, r + 1) === 0){ swap(c, r, c, r + 1); }
        continue;
      }

      // ── kyselina: rozožerie, čoho sa dotkne, a sama sa pritom minie ───
      if (m === ACID){
        for (const [dc, dr] of NB){
          const n = get(c + dc, r + dr);
          if (n > 0 && n !== ACID && n !== WALL && n !== SMOKE && n !== STEAM && Math.random() < 0.14){
            set(c + dc, r + dr, Math.random() < 0.25 ? SMOKE : 0, rndCol(SMOKE));
            if (Math.random() < 0.5){ set(c, r, 0, 0, 0); break; }
          }
          if (n === WALL && Math.random() < 0.03){
            set(c + dc, r + dr, 0, 0, 0);
            if (Math.random() < 0.7){ set(c, r, 0, 0, 0); break; }
          }
        }
        if (grid[idx(c, r)] !== ACID) continue;
      }

      // ── láva zapaľuje a pri vode tuhne na kameň ───────────────────────
      if (m === LAVA){
        for (const [dc, dr] of NB){
          const n = get(c + dc, r + dr);
          if (n > 0 && MAT[n] && MAT[n].flammable && Math.random() < 0.3)
            set(c + dc, r + dr, FIRE, rndCol(FIRE));
          if (n === WATER){
            set(c, r, WALL, rndCol(WALL));
            set(c + dc, r + dr, STEAM, rndCol(STEAM));
            break;
          }
        }
        if (grid[idx(c, r)] !== LAVA) continue;
      }

      // ── padanie a tečenie ─────────────────────────────────────────────
      if (!mat.falls && !mat.liquid) continue;
      if (r < ROWS - 1){
        const below = get(c, r + 1);
        if (below === 0){ swap(c, r, c, r + 1); continue; }
        // ťažšie prepadne cez ľahšie: piesok klesá vodou ku dnu
        if (mat.falls && !mat.liquid && (below === WATER || below === OIL || below === ACID)
            && Math.random() < 0.5){ swap(c, r, c, r + 1); continue; }
        const dir = Math.random() < 0.5 ? 1 : -1;
        if (mat.liquid){
          if (Math.random() < mat.flow){
            if (get(c + dir, r) === 0){ swap(c, r, c + dir, r); continue; }
            if (get(c - dir, r) === 0){ swap(c, r, c - dir, r); continue; }
          }
        } else {
          if (get(c + dir, r + 1) === 0){ swap(c, r, c + dir, r + 1); continue; }
          if (get(c - dir, r + 1) === 0){ swap(c, r, c - dir, r + 1); continue; }
        }
      }
    }
  }
}

// ── VYKRESLENIE ───────────────────────────────────────────────────────────
function draw(){
  const d = img.data, gd = gimg.data;
  d.set(bgPix);
  gd.fill(0);

  for (let i = 0; i < grid.length; i++){
    const m = grid[i];
    if (!m) continue;
    const mat = MAT[m];
    const col = mat.rgb[colorGrid[i] % mat.rgb.length];
    const p = i * 4;
    if (mat.fade){
      // dym, para aj dohasínajúci oheň blednú, nech to nie sú sivé kocky
      const a = Math.max(0.1, Math.min(1, lifeGrid[i] / (mat.life * 0.7)));
      d[p]   += (col[0] - d[p]) * a;
      d[p+1] += (col[1] - d[p+1]) * a;
      d[p+2] += (col[2] - d[p+2]) * a;
      if (mat.emissive){
        const e = mat.emissive * a;
        gd[p] = col[0] * e; gd[p+1] = col[1] * e; gd[p+2] = col[2] * e; gd[p+3] = 255;
      }
    } else {
      // Horná hrana hromady dostane svetlo, spodná tieň - bez toho je kopa
      // piesku jedna plochá škvrna rovnakej farby.
      let k = 1;
      if (i >= COLS && grid[i - COLS] === 0) k = 1.22;
      else if (i + COLS < grid.length && grid[i + COLS] === 0) k = 0.86;
      d[p] = col[0] * k; d[p+1] = col[1] * k; d[p+2] = col[2] * k;
      if (mat.emissive){
        const e = mat.emissive;
        gd[p] = col[0] * e; gd[p+1] = col[1] * e; gd[p+2] = col[2] * e; gd[p+3] = 255;
      }
    }
  }

  bctx.putImageData(img, 0, 0);
  gactx.putImageData(gimg, 0, 0);

  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(buf, 0, 0, W, H);

  // Žiara: rozmazanie prebieha na malom plátne (jeden bod na políčko), takže
  // stojí takmer nič, a roztiahne sa až potom. Oheň a láva tým prestali byť
  // oranžové štvorčeky a začali svietiť do okolia.
  let src = glowA;
  if (CAN_BLUR){
    gbctx.setTransform(1,0,0,1,0,0);
    gbctx.clearRect(0, 0, COLS, ROWS);
    gbctx.filter = 'blur(1.7px)';
    gbctx.drawImage(glowA, 0, 0);
    gbctx.filter = 'none';
    src = glowB;
  }
  ctx.imageSmoothingEnabled = true;
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.9;
  ctx.drawImage(src, 0, 0, W, H);
  ctx.globalAlpha = 0.4;
  ctx.drawImage(src, -W * 0.03, -H * 0.03, W * 1.06, H * 1.06);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;

  // Kruh štetca: inak hráč netuší, koľko toho vysype, kým to nevysype.
  if (ptrIn){
    const rad = (brushSize + 0.5) * CELL;
    const col = material === ERASER ? '255,107,107' : MAT[material].rgb[0].join(',');
    ctx.strokeStyle = 'rgba(' + col + ',0.75)';
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(ptrX, ptrY, rad, 0, 6.2832); ctx.stroke();
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.arc(ptrX, ptrY, rad + 1.4, 0, 6.2832); ctx.stroke();
  }
}

function loop(){
  animId = requestAnimationFrame(loop);
  // Držanie prsta na mieste sype ďalej — bez toho sa dalo kresliť len pohybom.
  if (drawing && lastX !== null) place(lastX, lastY);
  if (!paused) update();
  draw();
}

function setBrush(s){
  SFX.play('tick');
  brushSize = s;
  ['bs-2','bs-5','bs-9'].forEach(id => document.getElementById(id).classList.remove('active'));
  document.getElementById('bs-' + s).classList.add('active');
}

// ── LIŠTA MATERIÁLOV ──────────────────────────────────────────────────────
const toolbar = document.getElementById('toolbar');
ORDER.forEach(id => {
  const btn = document.createElement('button');
  const isEraser = id === ERASER;
  const mat = isEraser ? null : MAT[id];
  const col = isEraser ? '#ff6b6b' : mat.colors[0];
  btn.className = 'mat-btn' + (id === SAND ? ' active' : '');
  btn.dataset.col = col;
  btn.innerHTML = isEraser
    ? '<span class="dot" style="background:transparent;box-shadow:inset 0 0 0 1.4px rgba(255,107,107,.75)"></span>'
      + tr('sandEraser', 'Erase')
    : '<span class="dot" style="background:' + col + '"></span>' + tr(mat.key, mat.fallbackName);
  btn.onclick = () => {
    SFX.play('select');
    material = id;
    toolbar.querySelectorAll('.mat-btn').forEach(b => {
      b.classList.remove('active');
      b.style.borderColor = ''; b.style.boxShadow = '';
    });
    btn.classList.add('active');
    btn.style.borderColor = col + '88';
    btn.style.boxShadow = '0 0 0 1px ' + col + '33, 0 6px 20px -10px ' + col;
    btn.scrollIntoView({block:'nearest', inline:'nearest', behavior:'smooth'});
  };
  toolbar.appendChild(btn);
});
toolbar.querySelector('.mat-btn').style.borderColor = MAT[SAND].colors[0] + '88';
toolbar.querySelector('.mat-btn').style.boxShadow =
  '0 0 0 1px ' + MAT[SAND].colors[0] + '33, 0 6px 20px -10px ' + MAT[SAND].colors[0];

// ── VSTUP ─────────────────────────────────────────────────────────────────
function pos(e){
  const rect = C.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}
C.addEventListener('pointerdown', e => {
  e.preventDefault();
  try { C.setPointerCapture(e.pointerId); } catch(_){}
  const p = pos(e);
  drawing = true; ptrIn = true; ptrX = p.x; ptrY = p.y;
  lastX = null; stroke(p.x, p.y);
});
C.addEventListener('pointermove', e => {
  const p = pos(e);
  ptrIn = true; ptrX = p.x; ptrY = p.y;
  if (drawing){ e.preventDefault(); stroke(p.x, p.y); }
});
C.addEventListener('pointerup', () => { drawing = false; lastX = null; });
C.addEventListener('pointercancel', () => { drawing = false; lastX = null; });
C.addEventListener('pointerleave', e => {
  drawing = false; lastX = null;
  if (e.pointerType !== 'mouse') ptrIn = false;
});
C.addEventListener('pointerenter', () => { ptrIn = true; });

// klávesnica: medzerník pauzuje, C maže, 1–9 prepína materiál
document.addEventListener('keydown', e => {
  if (e.code === 'Space'){ e.preventDefault(); togglePause(); }
  else if (e.code === 'KeyC') clearAll();
  else if (e.key >= '1' && e.key <= '9'){
    const id = ORDER[+e.key - 1];
    if (id !== undefined) toolbar.children[+e.key - 1].click();
  }
});

function relayout(){ if (animId) cancelAnimationFrame(animId); resize(); loop(); }
togglePause(); togglePause();   // doplní popis tlačidla v správnom jazyku
resize();
window.addEventListener('resize', relayout);
window.addEventListener('orientationchange', relayout);
// Syne dorazí až po prvom rozložení stránky a titulok tým o kúsok narastie.
if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);
loop();
</script>
