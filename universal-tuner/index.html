<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">

<script src="boot.js"></script>
<style>
/* Layout: na počítači appka v ráme telefónu v strede, na mobile a po inštalácii na celú obrazovku.
   Vzhľad: tmavý (predvolený), svetlý alebo podľa systému – prepína sa atribútom data-theme na <html>. */
:root, :root[data-theme="dark"] {
  --ink: #0d1120;
  --night: #141a2d;
  --dusk: #1c2340;
  --dusk-2: #252e52;
  --line: #2d375e;
  --fg: #e9ebf5;
  --muted: #99a2c4;
  --lamp: #6cc4f2;
  --lamp-ink: #04202e;
  --lamp-text: #6cc4f2;
  --good: #72d6ab;
  --warn: #f3b35b;
  --bad: #f2877d;
  --bad-ink: #2a0c08;
  --frame: #0a0d19;
  --scrim: rgba(5, 7, 15, 0.62);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --ink: #dfe3ee; --night: #f3f5fa; --dusk: #ffffff; --dusk-2: #e6eaf3; --line: #d6dcea;
  --fg: #161d36; --muted: #5a6382; --lamp: #3aa6e0; --lamp-ink: #04202e; --lamp-text: #0d6694;
  --good: #1d8f62; --warn: #b36b00; --bad: #c8463a; --bad-ink: #ffffff;
  --frame: #c9d0e0; --scrim: rgba(20, 26, 45, 0.35);
  color-scheme: light;
}
@media (prefers-color-scheme: light) {
  :root[data-theme="system"] {
    --ink: #dfe3ee; --night: #f3f5fa; --dusk: #ffffff; --dusk-2: #e6eaf3; --line: #d6dcea;
    --fg: #161d36; --muted: #5a6382; --lamp: #3aa6e0; --lamp-ink: #04202e; --lamp-text: #0d6694;
    --good: #1d8f62; --warn: #b36b00; --bad: #c8463a; --bad-ink: #ffffff;
    --frame: #c9d0e0; --scrim: rgba(20, 26, 45, 0.35);
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
html, body { background: var(--ink); color: var(--fg); }
[hidden] { display: none !important; }
body {
  margin: 0;
  font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }

.stage { display: flex; justify-content: center; align-items: flex-start; max-width: 1040px; margin: 0 auto; }

/* Phone */
.phone {
  flex: 0 0 auto; width: 390px; max-width: 100%;
  height: min(820px, calc(100dvh - 64px)); min-height: 640px;
  background: var(--night); border: 1px solid var(--line); border-radius: 38px;
  box-shadow: 0 30px 80px -30px #000a, 0 0 0 8px var(--frame);
  overflow: hidden; display: flex; flex-direction: column; position: relative;
}
.appbar { flex: none; display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; padding: 12px 14px 4px; }
.appbar .brand { text-align: center; font-family: var(--f-display); font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
.appbar .brand span { color: var(--lamp-text); }
.icon-btn { background: var(--dusk); border: 0; border-radius: 50%; width: 38px; height: 38px; display: grid; place-items: center; font-size: 18px; color: var(--fg); }
.icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn:hover { background: var(--dusk-2); }
.scroll { flex: 1; overflow-y: auto; padding: 4px 18px 24px; display: flex; flex-direction: column; gap: 14px; scrollbar-width: thin; }
.tabbar { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); background: var(--night); padding: 6px 6px 12px; }
.tab { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; font-size: 11px; color: var(--muted); border-radius: 12px; }
.tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--lamp-text); }

/* Shared app parts */
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.head { display: flex; flex-direction: column; gap: 4px; padding-top: 6px; }
.head h2 { font-size: 28px; line-height: 1.1; }
.card { background: var(--dusk); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.card h3 { font-size: 17px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.btn { border: 0; border-radius: 14px; padding: 13px 16px; font-weight: 600; background: var(--lamp); color: var(--lamp-ink); text-align: center; }
.btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--fg); font-weight: 500; }
.btn.danger { background: transparent; border: 1px solid var(--bad); color: var(--bad); }
.btn.danger-fill { background: var(--bad); color: var(--bad-ink); }
.btn.big { padding: 16px; font-size: 16px; }
.btn:disabled { opacity: 0.45; cursor: default; }
.link { background: none; border: 0; padding: 0; color: var(--lamp-text); font-weight: 500; text-align: left; }
.seg { display: grid; grid-template-columns: repeat(var(--n, 2), 1fr); background: var(--night); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.seg button { border: 0; background: none; padding: 9px 6px; border-radius: 9px; color: var(--muted); font-weight: 500; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--dusk-2); color: var(--fg); }
select, input[type="text"] { width: 100%; font: inherit; color: var(--fg); background: var(--night); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; }
.set-label { font-weight: 600; font-size: 14px; }
ul.plain { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }

/* Ladička */
.inst-btn { display: flex; align-items: center; gap: 12px; background: var(--dusk); border: 1px solid transparent; border-radius: 16px; padding: 12px 14px; text-align: left; width: 100%; }
.inst-btn:hover { border-color: var(--line); }
.inst-btn .ico { font-size: 24px; line-height: 1; }
.inst-btn .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.inst-btn b { font-family: var(--f-display); font-size: 17px; }
.inst-btn .chev { color: var(--muted); font-size: 18px; }

.gauge { align-items: center; gap: 4px; padding-top: 26px; padding-bottom: 18px; }
.gauge svg { width: 100%; max-width: 320px; height: auto; display: block; overflow: visible; }
.gauge .tick { stroke: var(--line); stroke-width: 2; stroke-linecap: round; }
.gauge .tick.major { stroke: var(--muted); stroke-width: 3; }
.gauge .zone { stroke: var(--good); stroke-width: 10; fill: none; stroke-linecap: round; opacity: 0.35; }
.gauge .lbl { fill: var(--muted); font-family: var(--f-mono); font-size: 11px; text-anchor: middle; }
.needle { transform-origin: 160px 170px; transform-box: view-box; }
@media (prefers-reduced-motion: no-preference) { .needle { transition: transform .12s linear; } }
.needle line { stroke: var(--fg); stroke-width: 5; stroke-linecap: round; }
.needle circle { fill: var(--fg); }
.gauge[data-state="idle"] .needle, .gauge[data-state="listen"] .needle { opacity: 0.25; }
.gauge[data-state="ok"] .needle line { stroke: var(--good); } .gauge[data-state="ok"] .needle circle { fill: var(--good); }
.gauge[data-state="low"] .needle line, .gauge[data-state="high"] .needle line { stroke: var(--warn); }
.gauge[data-state="low"] .needle circle, .gauge[data-state="high"] .needle circle { fill: var(--warn); }
.note { font-family: var(--f-display); font-weight: 700; font-size: 64px; line-height: 1; margin-top: -96px; font-variant-numeric: tabular-nums; min-height: 64px; }
.note sub { font-size: 24px; vertical-align: baseline; margin-left: 2px; color: var(--muted); font-weight: 500; }
.gauge[data-state="ok"] .note { color: var(--good); }
.gauge[data-state="idle"] .note, .gauge[data-state="listen"] .note { color: var(--dusk-2); }
.readout { display: flex; gap: 16px; font-family: var(--f-mono); font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 20px; }
.status { font-weight: 600; font-size: 16px; min-height: 24px; text-align: center; }
.gauge[data-state="ok"] .status { color: var(--good); }
.gauge[data-state="low"] .status, .gauge[data-state="high"] .status { color: var(--warn); }
.heard { font-size: 12px; color: var(--muted); min-height: 18px; }
.level { width: 140px; height: 4px; border-radius: 2px; background: var(--dusk-2); overflow: hidden; margin-top: 6px; }
.level i { display: block; height: 100%; width: 0; background: var(--lamp); transition: width .08s linear; }

.strings { display: grid; grid-template-columns: repeat(var(--n, 6), minmax(0, 1fr)); gap: 6px; }
.str { position: relative; border: 1px solid var(--line); background: var(--night); border-radius: 14px; padding: 8px 2px 7px; display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0; }
.str .num { font-family: var(--f-mono); font-size: 10px; color: var(--muted); }
.str b { font-family: var(--f-display); font-size: 19px; line-height: 1.1; }
.str b sub { font-size: 11px; color: var(--muted); font-weight: 500; vertical-align: baseline; }
.str.on { border-color: var(--lamp); box-shadow: 0 0 0 1px var(--lamp) inset; }
.str.lock { background: var(--lamp); color: var(--lamp-ink); border-color: var(--lamp); }
.str.lock .num, .str.lock b sub { color: var(--lamp-ink); opacity: .75; }
.str.ok::after { content: "✓"; position: absolute; top: 3px; right: 6px; font-size: 11px; font-weight: 700; color: var(--good); }
.str.lock.ok::after { color: var(--lamp-ink); }
.strings.many { grid-template-columns: repeat(var(--n2, 4), minmax(0, 1fr)); }
.strings.grid { position: relative; grid-template-columns: repeat(6, minmax(0, 1fr)); max-height: 236px; overflow-y: auto; padding: 2px; }
.strings.grid .str { padding: 9px 2px; }

/* Nástroje */
.opt { background: var(--night); border: 1px solid var(--line); border-radius: 14px; padding: 11px 13px; text-align: left; display: flex; flex-direction: column; gap: 2px; width: 100%; }
.opt[aria-pressed="true"] { border-color: var(--lamp); box-shadow: 0 0 0 1px var(--lamp) inset; }
.opt .nm { font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
.opt .nt { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.opt .acts { display: flex; gap: 14px; margin-top: 4px; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.pick { color: var(--lamp-text); font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
.edit-row { display: grid; grid-template-columns: 64px 1fr 40px; gap: 8px; align-items: center; }
.edit-row .icon-btn { width: 36px; height: 36px; font-size: 15px; }

/* Tóny */
.tone-grid { display: grid; grid-template-columns: repeat(var(--n, 6), minmax(0, 1fr)); gap: 6px; }
.tone-grid.keys { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.tone { border: 1px solid var(--line); background: var(--night); border-radius: 14px; padding: 12px 2px; font-family: var(--f-display); font-weight: 700; font-size: 18px; min-width: 0; }
.tone sub { font-size: 11px; color: var(--muted); font-weight: 500; vertical-align: baseline; }
.tone[aria-pressed="true"] { background: var(--lamp); color: var(--lamp-ink); border-color: var(--lamp); }
.tone[aria-pressed="true"] sub { color: var(--lamp-ink); }

/* Sheet a okná */
.sheet { position: absolute; inset: 0; background: var(--night); z-index: 5; display: flex; flex-direction: column; }
.sheet-top { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 6px; flex: none; }
.modal { position: absolute; inset: 0; z-index: 8; background: var(--scrim); display: grid; place-items: center; padding: 20px; }
.modal-card { background: var(--dusk); border: 1px solid var(--line); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 340px; box-shadow: 0 20px 60px -20px #000a; }
.modal-card h3 { font-size: 20px; }
.modal-card .row .btn { flex: 1; }
.toast { position: absolute; left: 16px; right: 16px; bottom: 84px; background: var(--fg); color: var(--night); border-radius: 14px; padding: 12px 14px; font-size: 14px; font-weight: 500; z-index: 9; box-shadow: 0 10px 30px -10px #000a; }
.a4 { display: grid; grid-template-columns: 48px 1fr 48px; gap: 8px; align-items: center; }
.a4 b { text-align: center; font-family: var(--f-display); font-size: 22px; font-variant-numeric: tabular-nums; }
.a4 .btn { padding: 10px 0; font-size: 18px; }

/* Mobil a nainštalovaná appka: bez rámu telefónu, na celú obrazovku */
@media (max-width: 520px), (display-mode: standalone) {
  html, body { height: 100%; }
  body { padding: 0; overflow: hidden; }
  .stage { display: block; max-width: none; height: 100%; }
  .phone { width: 100%; height: 100%; min-height: 0; max-height: none; border: 0; border-radius: 0; box-shadow: none; }
  .appbar { padding-top: calc(env(safe-area-inset-top, 0px) + 10px); padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }
  .scroll { padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
  .sheet-top { padding-top: calc(env(safe-area-inset-top, 0px) + 14px); }
  .tabbar { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); }
  .toast { bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); }
}
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: up .22s ease-out; }
  .modal-card { animation: up .18s ease-out; }
  @keyframes up { from { transform: translateY(24px); opacity: .6; } }
}
</style>
</head>
<body>

<div class="stage">
  <div class="phone" id="phone">
    <header class="appbar">
      <button class="icon-btn" data-act="settings" type="button" aria-label="Settings" title="Settings" data-i18n-aria="settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <div class="brand">Universal <span>Tuner</span></div>
      <span></span>
    </header>
    <main class="scroll" id="view"></main>
    <nav class="tabbar" id="tabbar">
      <button class="tab" data-tab="tune" type="button"><svg viewBox="0 0 24 24"><path d="M4 17a8 8 0 0 1 16 0"/><path d="M12 17l4-6"/><circle cx="12" cy="17" r="1.2"/></svg><span data-i18n="tabTune">Tune</span></button>
      <button class="tab" data-tab="inst" type="button"><svg viewBox="0 0 24 24"><path d="M19 5l-6.5 6.5"/><path d="M17 3l4 4"/><path d="M12 10.5c-1.8-1-4.4-.6-5.8.8-1 1-1 2.2-1.6 2.8C3.3 15.4 3 17 4.2 18.8 6 20.9 8.6 20.7 9.9 19.4c.6-.6 1.8-.6 2.8-1.6 1.4-1.4 1.8-4 .8-5.8"/><circle cx="9.5" cy="14.5" r="1.3"/></svg><span data-i18n="tabInst">Instrument</span></button>
      <button class="tab" data-tab="tones" type="button"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg><span data-i18n="tabTones">Tones</span></button>
    </nav>
    <div id="sheet" class="sheet" hidden></div>
    <div id="modal" class="modal" hidden></div>
    <div id="toast" class="toast" hidden role="status"></div>
  </div>
</div>
