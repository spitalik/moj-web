  }

  // ---------- Záloha, CSV, prehľad pre lekára ----------
  const lastBackupText = () => SET.lastBackup ? "Posledná záloha: " + fullDate(SET.lastBackup) + "." : "Záloha zatiaľ nebola stiahnutá.";
  function backupDue() {
    if (D.readings.length < 6) return false;
    if (SET.lastBackup && daysBetween(SET.lastBackup, today()) < 14) return false;
    if (SET.backupSnooze && daysBetween(SET.backupSnooze, today()) < 7) return false;
    return true;
  }
  function backupCard() {
    if (!backupDue()) return "";
    return '<div class="card"><div class="eyebrow">Záloha</div><h3>Stiahni si zálohu</h3><p class="small muted">' + lastBackupText() +
      " Dáta sú len v tomto zariadení. Keď sa stratí alebo sa vymažú údaje prehliadača, záloha je jediná cesta späť.</p>" +
      '<div class="row"><button class="btn" data-act="export" type="button" style="flex:1">Stiahnuť zálohu</button><button class="btn ghost" data-act="backupLater" type="button">Neskôr</button></div></div>';
  }
  function download(blob, name) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  // Tabuľka pre Excel: jeden riadok na meranie, oddeľovač „;“ (slovenské nastavenie).
  function csvText() {
    const cell = v => { v = String(v == null ? "" : v); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    const rows = [["Dátum", "Čas", "Časť dňa", "Systolický (mmHg)", "Diastolický (mmHg)", "Pulz (/min)", "Kategória (ESH)", "Ruka", "Poloha", "Okolnosti", "Poznámka"]];
    D.readings.forEach(r => {
      rows.push([r.date, r.time, partOf(r) === "am" ? "ráno" : "večer", r.sys, r.dia, r.pulse, cat(r.sys, r.dia).long, r.arm ? ARM_L[r.arm] : "", POS_L[r.pos] || "",
        TAGS.filter(T => r.tags[T.k]).map(T => T.name).join(", "), r.note]);
    });
    return String.fromCharCode(0xfeff) + rows.map(r => r.map(cell).join(";")).join("\r\n") + "\r\n";
  }
  function exportCsv() {
    download(new Blob([csvText()], { type: "text/csv;charset=utf-8" }), "blood-pressure-" + today() + ".csv");
    toast("Tabuľka CSV je stiahnutá.");
  }

  const repDays = () => [14, 30, 90].includes(UI.repDays) ? UI.repDays : 30;
  function reportHtml(days) {
    const to = today(), from = addDays(to, -days + 1);
    const list = inRange(from, to);
    let h = '<div class="rep"><h1>Blood Pressure – prehľad krvného tlaku</h1>' +
      "<p>Obdobie: " + fullDate(from) + " – " + fullDate(to) + " (" + days + " dní). Vytvorené " + fullDate(to) + ".</p>";
    if (!list.length) return h + "<p>V tomto období nie sú žiadne merania.</p></div>";
    const a = avgOf(list), am = avgOf(list.filter(r => partOf(r) === "am")), pm = avgOf(list.filter(r => partOf(r) === "pm"));
    const over = list.filter(r => r.sys >= SET.goalSys || r.dia >= SET.goalDia).length;
    const fmtA = x => x.n ? x.sys + "/" + x.dia + " mmHg" + (x.pulse != null ? ", pulz " + x.pulse : "") + " (" + x.n + "×)" : "–";
    h += "<h2>Súhrn</h2><table><tbody>" +
      "<tr><th>Počet meraní</th><td>" + a.n + " (" + new Set(list.map(r => r.date)).size + " dní)</td></tr>" +
      "<tr><th>Priemer všetkých meraní</th><td>" + fmtA(a) + "</td></tr>" +
      "<tr><th>Priemer ráno</th><td>" + fmtA(am) + "</td></tr>" +
      "<tr><th>Priemer večer</th><td>" + fmtA(pm) + "</td></tr>" +
      "<tr><th>Systolický min – max</th><td>" + Math.min(...list.map(r => r.sys)) + " – " + Math.max(...list.map(r => r.sys)) + " mmHg</td></tr>" +
      "<tr><th>Diastolický min – max</th><td>" + Math.min(...list.map(r => r.dia)) + " – " + Math.max(...list.map(r => r.dia)) + " mmHg</td></tr>" +
      "<tr><th>Meraní na hranici " + goalText() + " a viac</th><td>" + over + " z " + a.n + "</td></tr></tbody></table>";
    const wk = D.weeks.filter(w => w.end >= from);
    if (wk.length) h += "<h2>7-dňové domáce meranie (bez 1. dňa)</h2><ul>" + wk.map(w => "<li>" + fullDate(w.start) + " – " + fullDate(w.end) + ": " + w.sys + "/" + w.dia + " mmHg" + (w.pulse != null ? ", pulz " + w.pulse : "") + " (" + w.n + " meraní)</li>").join("") + "</ul>";
    h += '<h2>Meranie po meraní</h2><div class="rep-wide"><table><thead><tr><th>Dátum</th><th>Čas</th><th>Tlak</th><th>Pulz</th><th>Ruka</th><th>Okolnosti, poznámka</th></tr></thead><tbody>' +
      list.slice().reverse().map(r => "<tr><td>" + short(r.date) + "</td><td>" + r.time + "</td><td>" + r.sys + "/" + r.dia + "</td><td>" + (r.pulse != null ? r.pulse : "") + "</td><td>" + (r.arm ? ARM_L[r.arm] : "") +
        (r.pos !== "sit" ? ", " + POS_L[r.pos].toLowerCase() : "") + "</td><td>" + esc(TAGS.filter(T => r.tags[T.k]).map(T => T.name).concat(r.note ? [r.note] : []).join(", ")) + "</td></tr>").join("") +
      "</tbody></table></div>";
    return h + '<p class="rep-note">Hodnoty zadával používateľ sám z vlastného tlakomera. Hranica ' + goalText() + " mmHg je nastavená v appke. Nejde o lekárske meranie ani diagnózu. Blood Pressure nie je zdravotnícka pomôcka.</p></div>";
  }
  function openReport() {
    const days = repDays();
    let h = sheetTop("Pre lekára", "×") + '<div class="scroll">';
    h += '<div class="head"><h2>Prehľad pre lekára</h2><p class="small muted">Zhrnutie meraní na vytlačenie alebo uloženie ako PDF. Vytvorí sa v zariadení, nikam sa neposiela.</p></div>';
    h += '<div class="seg" role="group" aria-label="Obdobie" style="--n:3">' + [14, 30, 90].map(d => '<button type="button" data-repdays="' + d + '" aria-pressed="' + (d === days) + '">' + d + " dní</button>").join("") + "</div>";
    h += '<div class="card">' + reportHtml(days) + "</div>";
    h += '<button class="btn" data-act="printReport" type="button">Vytlačiť / uložiť PDF</button>';
    h += '<button class="btn ghost" data-act="exportCsv" type="button">Stiahnuť tabuľku (CSV)</button></div>';
    showSheet(h);
  }
  function printReport() {
    const el = $("#print");
    if (!el) return;
    el.innerHTML = reportHtml(repDays());
    if (typeof window.print === "function") window.print();
  }

  function exportData() {
    const blob = new Blob([JSON.stringify({ app: "blood-pressure", exported: new Date().toISOString(), data: D, settings: SET }, null, 2)], { type: "application/json" });
    download(blob, "blood-pressure-" + today() + ".json");
    SET.lastBackup = today(); SET.backupSnooze = null; saveSet();
    if (!$("#sheet").hidden && $("#sheet").innerHTML.includes('data-act="askReset"')) openSettings(); else if ($("#sheet").hidden) render();
    toast("Záloha je stiahnutá.");
  }
  // Obnovenie zo zálohy nahradí všetky dáta.
  function importFile(file) {
    if (!file) return;
    const fail = () => infoModal("Zálohu sa nepodarilo načítať", "Súbor nie je záloha z Blood Pressure alebo je poškodený. Tvoje dáta ostali bez zmeny.");
    file.text().then(txt => {
      let b;
      try { b = JSON.parse(txt); } catch (e) { fail(); return; }
      if (!b || b.app !== "blood-pressure" || !b.data || !Array.isArray(b.data.readings)) { fail(); return; }
      const nd = tidy(b.data);
      const w = b.exported ? new Date(b.exported) : null;
      const date = w && !isNaN(w) ? w.toLocaleDateString("sk-SK") : "neznámeho dátumu";
      confirmModal({
        title: "Obnoviť zo zálohy?",
        text: "Záloha z " + date + ": " + nd.readings.length + " " + readingsWord(nd.readings.length) + ". Všetky súčasné dáta v appke sa nahradia zálohou. Túto akciu nie je možné vrátiť späť.",
        ok: "Obnoviť", danger: true
      }, () => {
        D = nd;
        if (b.settings && typeof b.settings === "object") {
          const keep = { installDismissed: SET.installDismissed, lastBackup: SET.lastBackup, backupSnooze: SET.backupSnooze };
          try { localStorage.setItem(SET_KEY, JSON.stringify(b.settings)); } catch (e) { /* nič */ }
          load();   // rovnaká kontrola nastavení ako pri spustení
          D = nd;
          Object.assign(SET, keep);
          saveSet(); applyTheme();
        }
        save();
        UI.tab = "today";
        closeModal(); closeSheet();
        toast("Dáta sú obnovené zo zálohy.");
      });
    }).catch(fail);
  }
  function resetAll() {
    D = emptyData();
    try { localStorage.removeItem(DATA_KEY); } catch (e) { /* nič */ }
    UI.tab = "today";
    closeModal();
    closeSheet();
    toast("Všetky dáta sú vymazané. Začíname odznova.");
  }

  // ---------- Sheet, okná, toast ----------
  function showSheet(h, keepFocus) {
    const el = $("#sheet");
    el.innerHTML = h; el.hidden = false;
    if (!keepFocus) { const f = el.querySelector("button"); if (f) f.focus({ preventScroll: true }); }
  }
  function closeSheet() { $("#sheet").hidden = true; $("#sheet").innerHTML = ""; UI.f = null; render(); }

  let modalOk = null;
  function confirmModal(o, onOk) {
    const m = $("#modal");
    m.innerHTML = '<div class="modal-card" role="alertdialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-text">' +
      '<h3 id="modal-title">' + o.title + '</h3><p id="modal-text" class="small">' + o.text + "</p>" +
      '<div class="row"><button class="btn ghost" data-act="modalCancel" type="button">Zrušiť</button>' +
      '<button class="btn ' + (o.danger ? "danger-fill" : "") + '" data-act="modalOk" type="button">' + o.ok + "</button></div></div>";
    m.hidden = false;
    modalOk = onOk;
    const c = m.querySelector('[data-act="modalCancel"]'); if (c) c.focus();
  }
  function infoModal(title, text) {
    const m = $("#modal");
    m.innerHTML = '<div class="modal-card" role="alertdialog" aria-modal="true" aria-labelledby="modal-title"><h3 id="modal-title">' + title + '</h3><p class="small">' + text + "</p>" +
      '<button class="btn" data-act="modalCancel" type="button">Rozumiem</button></div>';
    m.hidden = false; modalOk = null;
  }
  function closeModal() { $("#modal").hidden = true; $("#modal").innerHTML = ""; modalOk = null; }

  let toastT;
  function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 2800); }

  // ---------- Vykreslenie a udalosti ----------
  function render() {
    if (D.week && today() > weekEnd()) {
      const res = concludeWeek();
      toast(res ? "7-dňové meranie je vyhodnotené: " + res.sys + "/" + res.dia + "." : "7-dňové meranie skončilo bez meraní.");
    }
    const v = { today: viewToday, hist: viewHist, stats: viewStats, week: viewWeek }[UI.tab];
    $("#view").innerHTML = v();
    $("#view").scrollTop = 0;
    document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-current", t.dataset.tab === UI.tab ? "page" : "false"));
  }

  document.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.tab) { UI.tab = b.dataset.tab; render(); return; }
    if (b.dataset.goto) { UI.tab = b.dataset.goto; render(); return; }
    if (b.dataset.period) { UI.period = Number(b.dataset.period); render(); return; }
    if (b.dataset.farm && UI.f) { UI.f.arm = b.dataset.farm; renderSegs("farm", UI.f.arm); return; }
    if (b.dataset.fpos && UI.f) { UI.f.pos = b.dataset.fpos; renderSegs("fpos", UI.f.pos); return; }
    if (b.dataset.ftag && UI.f) { const k = b.dataset.ftag; UI.f.tags[k] = !UI.f.tags[k]; if (!UI.f.tags[k]) delete UI.f.tags[k]; b.setAttribute("aria-pressed", String(!!UI.f.tags[k])); return; }
    if (b.dataset.themeSet) { SET.theme = b.dataset.themeSet; saveSet(); applyTheme(); openSettings(); return; }
    if (b.dataset.armset) { SET.arm = b.dataset.armset; saveSet(); openSettings(); return; }
    if (b.dataset.repdays) { UI.repDays = Number(b.dataset.repdays); openReport(); return; }
    switch (b.dataset.act) {
      case "settings": openSettings(); break;
      case "add": openForm(); break;
      case "addSecond": { const r = D.readings.find(x => x.id === UI.lastId); openForm(null, r || null); break; }
      case "open": { const r = D.readings.find(x => x.id === b.dataset.id); if (r) openForm(r); break; }
      case "saveForm": saveForm(); break;
      case "askDelReading": {
        const r = UI.f && D.readings.find(x => x.id === UI.f.id);
        if (!r) break;
        confirmModal({ title: "Vymazať meranie?", text: "Meranie " + r.sys + "/" + r.dia + " z " + short(r.date) + " " + r.time + " sa vymaže. Túto akciu nie je možné vrátiť späť.", ok: "Vymazať", danger: true }, () => {
          D.readings = D.readings.filter(x => x.id !== r.id); save(); closeModal(); closeSheet(); toast("Meranie je vymazané.");
        });
        break;
      }
      case "more": UI.histN += 40; render(); break;
      case "close": closeSheet(); break;
      case "startWeek": D.week = { start: today() }; save(); toast("7-dňové meranie sa začalo. Dnešok je deň 1."); render(); break;
      case "concludeWeek": {
        if (!canConclude()) break;
        const res = concludeWeek();
        toast(res ? "Hotovo. Priemer 7-dňového merania je " + res.sys + "/" + res.dia + "." : "7-dňové meranie skončilo bez meraní.");
        render(); break;
      }
      case "cancelWeek":
        confirmModal({ title: "Zrušiť 7-dňové meranie?", text: "Meranie sa ukončí bez výsledku. Zapísané hodnoty zostanú v záznamoch.", ok: "Zrušiť meranie", danger: true }, () => {
          D.week = null; save(); closeModal(); render(); toast("7-dňové meranie je zrušené.");
        });
        break;
      case "export": exportData(); break;
      case "exportCsv": exportCsv(); break;
      case "backupLater": SET.backupSnooze = today(); saveSet(); render(); break;
      case "privacy": openPrivacy(); break;
      case "report": openReport(); break;
      case "printReport": printReport(); break;
      case "import": { const f = $("#import-file"); if (f) { f.value = ""; f.click(); } break; }
      case "askReset":
        confirmModal({
          title: "Vymazať všetky dáta?",
          text: "Vymažú sa všetky merania aj výsledky 7-dňových meraní. Appka začne od začiatku. Ak nemáš aktuálnu zálohu, túto akciu nie je možné vrátiť späť. " + lastBackupText() + " Nastavenia zostanú.",
          ok: "Vymazať všetko", danger: true
        }, resetAll);
        break;
      case "modalOk": if (modalOk) modalOk(); break;
      case "modalCancel": closeModal(); break;
      case "install":
        if (installPrompt) {
          installPrompt.prompt();
          installPrompt.userChoice.finally(() => { installPrompt = null; render(); });
        }
        break;
      case "installLater": SET.installDismissed = true; saveSet(); render(); break;
    }
  });
  function renderSegs(attr, cur) {
    document.querySelectorAll("[data-" + attr + "]").forEach(x => x.setAttribute("aria-pressed", String(x.dataset[attr] === cur)));
  }
  $("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
  const FORM_FIELDS = { "f-sys": "sys", "f-dia": "dia", "f-pulse": "pulse", "f-date": "date", "f-time": "time", "f-note": "note" };
  document.addEventListener("input", e => {
    const id = e.target.id;
    if (FORM_FIELDS[id] && UI.f) {
      UI.f[FORM_FIELDS[id]] = e.target.value;
      if (id === "f-sys" || id === "f-dia" || id === "f-pulse") e.target.removeAttribute && e.target.removeAttribute("aria-invalid");
      // po 3 číslach horného tlaku skoč na dolný (na mobile ušetrí ťuknutie)
      if (id === "f-sys" && /^\d{3}$/.test(e.target.value)) { const n = $("#f-dia"); if (n && n.focus) n.focus(); }
      return;
    }
    if (id === "set-name") { SET.name = e.target.value.trim().slice(0, 30); saveSet(); }
    if (id === "set-gsys" || id === "set-gdia") {
      const gs = $("#set-gsys"), gd = $("#set-gdia");
      const s = /^\d{2,3}$/.test(gs.value.trim()) ? +gs.value.trim() : null, d = /^\d{2,3}$/.test(gd.value.trim()) ? +gd.value.trim() : null;
      const ok = goalOk(s, d);
      gs.setAttribute("aria-invalid", ok ? "false" : "true"); gd.setAttribute("aria-invalid", ok ? "false" : "true");
      if (ok) { SET.goalSys = s; SET.goalDia = d; saveSet(); }
      const err = $("#err-goal");
      if (err) { err.textContent = ok ? "" : "Horný 100–180, dolný 60–110 a dolný menší ako horný."; err.hidden = ok; }
    }
  });
  document.addEventListener("change", e => {
    if (e.target.id === "import-file") importFile(e.target.files && e.target.files[0]);
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Enter" && UI.f && /^f-/.test(e.target.id || "")) { e.preventDefault && e.preventDefault(); saveForm(); return; }
    if (e.key !== "Escape") return;
    if (!$("#modal").hidden) closeModal();
    else if (!$("#sheet").hidden) closeSheet();
  });

  // ---------- Inštalácia ----------
  // Chrome a Edge pošlú beforeinstallprompt, keď sa appka dá nainštalovať. Na iPhone len ručne cez Zdieľať → Pridať na plochu.
  let installPrompt = null;
  const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  function installCard() {
    if (isStandalone() || SET.installDismissed) return "";
    if (installPrompt) {
      return '<div class="card"><h3>Nainštaluj si appku</h3><p class="small muted">Otvoríš ju z plochy jedným ťuknutím a funguje aj bez internetu.</p>' +
        '<div class="row"><button class="btn" data-act="install" type="button" style="flex:1">Inštalovať</button><button class="btn ghost" data-act="installLater" type="button">Neskôr</button></div></div>';
    }
    if (isIOS) {
      return '<div class="card"><h3>Pridaj si appku na plochu</h3><p class="small muted">V Safari ťukni na <b>Zdieľať</b> (štvorček so šípkou) a vyber <b>Pridať na plochu</b>.</p>' +
        '<button class="btn ghost" data-act="installLater" type="button">Rozumiem</button></div>';
    }
    return "";
  }
  window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault();
    installPrompt = e;
    if (UI.tab === "today" && $("#sheet").hidden) render();
  });
  window.addEventListener("appinstalled", () => { installPrompt = null; toast("Appka je nainštalovaná."); render(); });

  // keď sa appka otvorí na druhý deň, obrazovka sa obnoví na aktuálny dátum
  let shownDay = today();
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible") return;
    if (today() !== shownDay && $("#sheet").hidden) { shownDay = today(); render(); }
  });
  // Appka môže byť otvorená dvakrát (nainštalovaná + karta v Chrome): zmeny z druhej kópie načítame.
  window.addEventListener("storage", e => {
    if (e.key !== DATA_KEY && e.key !== SET_KEY && e.key !== null) return;
    if (e.key !== SET_KEY) D = emptyData();
    load();
    applyTheme();
    if ($("#sheet").hidden) render();
  });

  load();
  applyTheme();
  render();

  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    navigator.serviceWorker.register("sw.js").catch(() => { /* offline režim nie je dostupný */ });
  }
})();
</script>
</body>
</html>
