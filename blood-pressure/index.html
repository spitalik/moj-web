<!doctype html>
<html lang="sk" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blood Pressure</title>
<meta name="description" content="Denník krvného tlaku: ranné a večerné merania, priemery, 7-dňové domáce meranie a prehľad pre lekára.">
<meta name="theme-color" content="#141a2d" id="theme-color">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tlak">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/logo.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!-- Písma sú súčasťou appky, nič sa nenačítava od tretích strán (GDPR). Licencia: fonts/OFL-*.txt -->
<link rel="stylesheet" href="fonts/fonts.css">
<script>
  // Zvolený vzhľad nastavíme ešte pred vykreslením, aby stránka neblikla inými farbami.
  try {
    var st = JSON.parse(localStorage.getItem('bloodPressure.settings.v1') || '{}');
    if (/^(dark|light|system)$/.test(st.theme)) document.documentElement.setAttribute('data-theme', st.theme);
  } catch (e) { /* bez úložiska platí tmavý vzhľad */ }
</script>
<style>
/* Layout: na počítači appka v ráme telefónu v strede, na mobile a po inštalácii na celú obrazovku.
   Vzhľad: tmavý (predvolený), svetlý alebo podľa systému – prepína sa atribútom data-theme na <html>.
   Dizajn vychádza zo Sleep Detective, akcentová farba je levanduľová, aby sa nebila s farbami kategórií tlaku. */
:root, :root[data-theme="dark"] {
  --ink: #0d1120;
  --night: #141a2d;
  --dusk: #1c2340;
  --dusk-2: #252e52;
  --line: #2d375e;
  --fg: #e9ebf5;
  --muted: #99a2c4;
  --lamp: #b9a4ff;
  --lamp-ink: #1a1033;
  --lamp-text: #c4b3ff;
  --bar: #3a4677;
  --good: #72d6ab;
  --bad: #f2877d;
  --bad-ink: #2a0c08;
  --c-low: #7fb8f0;
  --c-opt: #72d6ab;
  --c-norm: #a9d67a;
  --c-hn: #f0d36b;
  --c-g1: #f5a75e;
  --c-g2: #f2807a;
  --c-g3: #ff5f7e;
  --frame: #0a0d19;
  --scrim: rgba(5, 7, 15, 0.62);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --ink: #dfe3ee; --night: #f3f5fa; --dusk: #ffffff; --dusk-2: #e6eaf3; --line: #d6dcea;
  --fg: #161d36; --muted: #5a6382; --lamp: #a48bf5; --lamp-ink: #1a1033; --lamp-text: #5b3cc4;
  --bar: #c2cadf; --good: #1d8f62; --bad: #c8463a; --bad-ink: #ffffff;
  --c-low: #2f78c4; --c-opt: #1d8f62; --c-norm: #5d8f1f; --c-hn: #a07a00; --c-g1: #c46a12; --c-g2: #c8463a; --c-g3: #b0123e;
  --frame: #c9d0e0; --scrim: rgba(20, 26, 45, 0.35);
  color-scheme: light;
}
@media (prefers-color-scheme: light) {
  :root[data-theme="system"] {
    --ink: #dfe3ee; --night: #f3f5fa; --dusk: #ffffff; --dusk-2: #e6eaf3; --line: #d6dcea;
    --fg: #161d36; --muted: #5a6382; --lamp: #a48bf5; --lamp-ink: #1a1033; --lamp-text: #5b3cc4;
    --bar: #c2cadf; --good: #1d8f62; --bad: #c8463a; --bad-ink: #ffffff;
    --c-low: #2f78c4; --c-opt: #1d8f62; --c-norm: #5d8f1f; --c-hn: #a07a00; --c-g1: #c46a12; --c-g2: #c8463a; --c-g3: #b0123e;
    --frame: #c9d0e0; --scrim: rgba(20, 26, 45, 0.35);
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
html, body { background: var(--ink); color: var(--fg); }
[hidden] { display: none !important; }
body {
  margin: 0;
  font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }

.stage { display: flex; justify-content: center; align-items: flex-start; max-width: 1040px; margin: 0 auto; }

/* Phone */
.phone {
  flex: 0 0 auto; width: 390px; max-width: 100%;
  height: min(820px, calc(100dvh - 64px)); min-height: 640px;
  background: var(--night); border: 1px solid var(--line); border-radius: 38px;
  box-shadow: 0 30px 80px -30px #000a, 0 0 0 8px var(--frame);
  overflow: hidden; display: flex; flex-direction: column; position: relative;
}
.appbar { flex: none; display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; padding: 12px 14px 4px; }
.appbar .brand { text-align: center; font-family: var(--f-display); font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
.appbar .brand span { color: var(--lamp-text); }
.icon-btn { background: var(--dusk); border: 0; border-radius: 50%; width: 38px; height: 38px; display: grid; place-items: center; font-size: 18px; color: var(--fg); }
.icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn:hover { background: var(--dusk-2); }
.icon-btn.acc { background: var(--lamp); color: var(--lamp-ink); }
.scroll { flex: 1; overflow-y: auto; padding: 4px 18px 24px; display: flex; flex-direction: column; gap: 14px; scrollbar-width: thin; }
.tabbar { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); background: var(--night); padding: 6px 6px 12px; }
.tab { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; font-size: 11px; color: var(--muted); border-radius: 12px; }
.tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--lamp-text); }

/* Shared app parts */
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.head { display: flex; flex-direction: column; gap: 4px; padding-top: 6px; }
.head h2 { font-size: 28px; line-height: 1.1; }
.card { background: var(--dusk); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.card h3 { font-size: 17px; }
.card.lamp { background: var(--lamp); color: var(--lamp-ink); }
.card.lamp .eyebrow { color: var(--lamp-ink); opacity: 0.7; }
.card.warn { border: 1px solid var(--bad); }
.card.warn h3 { color: var(--bad); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.btn { border: 0; border-radius: 14px; padding: 13px 16px; font-weight: 600; background: var(--lamp); color: var(--lamp-ink); text-align: center; }
.btn.dark { background: var(--lamp-ink); color: var(--lamp); }
.btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--fg); font-weight: 500; }
.card.lamp .btn.ghost { border-color: var(--lamp-ink); color: var(--lamp-ink); }
.btn.danger { background: transparent; border: 1px solid var(--bad); color: var(--bad); }
.btn.danger-fill { background: var(--bad); color: var(--bad-ink); }
.btn:disabled { opacity: 0.45; cursor: default; }
.link { background: none; border: 0; padding: 0; color: var(--lamp-text); font-weight: 500; text-align: left; }
.card.lamp .link { color: var(--lamp-ink); text-decoration: underline; }

.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.steps li::marker { color: var(--lamp-text); font-family: var(--f-mono); font-size: 12px; }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stats.s3 { grid-template-columns: repeat(3, 1fr); }
.stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat b { font-family: var(--f-display); font-size: 19px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat span { font-size: 11px; color: var(--muted); }

.pill { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.t-bad { color: var(--bad); } .t-good { color: var(--good); } .t-few { color: var(--muted); } .t-lamp { color: var(--lamp-text); }
.k-low { color: var(--c-low); } .k-opt { color: var(--c-opt); } .k-norm { color: var(--c-norm); } .k-hn { color: var(--c-hn); }
.k-g1 { color: var(--c-g1); } .k-g2 { color: var(--c-g2); } .k-g3 { color: var(--c-g3); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: currentColor; flex: none; }
.meter { display: block; height: 5px; border-radius: 3px; background: var(--dusk-2); overflow: hidden; margin-top: 4px; }
.meter i { display: block; height: 100%; border-radius: 3px; background: currentColor; }
.card.lamp .meter { background: rgba(26, 16, 51, 0.18); }

/* Veľké číslo tlaku */
.bp { display: flex; align-items: baseline; gap: 4px; font-family: var(--f-display); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.bp b { font-size: 46px; }
.bp .sl { font-size: 30px; color: var(--muted); }
.bp small { font-family: var(--f-mono); font-weight: 400; font-size: 12px; color: var(--muted); margin-left: 6px; }
.bp.xl b { font-size: 64px; } .bp.xl .sl { font-size: 40px; }
.bp-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }

/* Chart */
.chart svg { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 3; }
.chart .goal { stroke: var(--lamp); stroke-width: 1.2; stroke-dasharray: 5 4; opacity: 0.8; }
.chart .goal-t { fill: var(--lamp-text); }
.chart .stick { stroke-width: 3; stroke-linecap: round; }
.chart .stick.k-low { stroke: var(--c-low); } .chart .stick.k-opt { stroke: var(--c-opt); } .chart .stick.k-norm { stroke: var(--c-norm); }
.chart .stick.k-hn { stroke: var(--c-hn); } .chart .stick.k-g1 { stroke: var(--c-g1); } .chart .stick.k-g2 { stroke: var(--c-g2); } .chart .stick.k-g3 { stroke: var(--c-g3); }
.chart .pl { stroke: var(--lamp); stroke-width: 1.8; fill: none; stroke-linejoin: round; }
.chart .pd { fill: var(--lamp); }
.chart text { fill: var(--muted); font-family: var(--f-mono); font-size: 9px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

/* Porovnávacie pruhy */
.cmp { display: flex; flex-direction: column; gap: 6px; }
.cmp-row { display: grid; grid-template-columns: 84px 1fr 70px; gap: 8px; align-items: center; font-size: 12px; }
.cmp-row .track { height: 10px; background: var(--dusk-2); border-radius: 5px; overflow: hidden; }
.cmp-row .track i { display: block; height: 100%; border-radius: 5px; background: currentColor; }
.cmp-row b { font-variant-numeric: tabular-nums; text-align: right; font-weight: 600; }

/* Formuláre */
.seg { display: grid; grid-template-columns: repeat(var(--n, 2), 1fr); background: var(--night); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.scroll > .seg { background: var(--dusk); border-color: transparent; }
.seg button { border: 0; background: none; padding: 9px 6px; border-radius: 9px; color: var(--muted); font-weight: 500; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--dusk-2); color: var(--fg); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--night); border-radius: 999px; padding: 9px 13px; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
.chip[aria-pressed="true"] { background: var(--lamp); color: var(--lamp-ink); border-color: var(--lamp); font-weight: 600; }
.check { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; font-size: 14px; cursor: pointer; }
.check input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--lamp); }
input[type="text"], input[type="date"], input[type="time"], select { width: 100%; font: inherit; color: var(--fg); background: var(--night); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; min-height: 46px; }
input[aria-invalid="true"] { border-color: var(--bad); }
.num-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.num-row label { display: grid; gap: 4px; }
.num-err { color: var(--bad); }
.bp-in { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.bp-in label { display: flex; flex-direction: column; gap: 4px; align-items: stretch; text-align: center; }
.bp-in input { font-family: var(--f-display); font-weight: 700; font-size: 30px; text-align: center; padding: 10px 4px; font-variant-numeric: tabular-nums; }
.bp-in input::placeholder { color: var(--muted); opacity: 0.35; }
.bp-in .u { font-size: 11px; color: var(--muted); font-family: var(--f-mono); }
.set-label { font-weight: 600; font-size: 14px; }
ul.plain { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }

/* Záznamy */
.rd { display: grid; grid-template-columns: 48px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; width: 100%; font-size: 13px; }
.rd:first-of-type { border-top: 0; }
.rd .v { font-family: var(--f-display); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
.rd .sub { display: block; font-size: 12px; color: var(--muted); }
.rd .k { display: flex; align-items: center; gap: 6px; font-size: 12px; }

/* 7-dňové meranie */
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day { aspect-ratio: 1; max-width: 100%; border-radius: 10px; border: 1px dashed var(--lamp-ink); display: grid; place-items: center; font-family: var(--f-mono); font-size: 11px; opacity: 0.55; position: relative; }
.day.half { border-style: solid; opacity: 1; background: linear-gradient(135deg, var(--lamp-ink) 50%, transparent 50%); color: var(--lamp); }
.day.done { background: var(--lamp-ink); color: var(--lamp); border-style: solid; opacity: 1; }
.day.now { outline: 2px solid var(--lamp-ink); outline-offset: 2px; opacity: 1; }
.day.skip { text-decoration: line-through; }
.wk-item { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.wk-item:first-of-type { border-top: 0; }

/* Sheet (meranie, nastavenia) */
.sheet { position: absolute; inset: 0; background: var(--night); z-index: 5; display: flex; flex-direction: column; }
.sheet-top { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 6px; flex: none; }
.q { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 18px; padding: 0 22px 40px; overflow-y: auto; }
.q h2 { font-size: 30px; line-height: 1.1; }

/* Prehľad pre lekára: na obrazovke v karte, pri tlači sám na bielom papieri */
.rep { display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.rep h1 { font-size: 17px; } .rep h2 { font-size: 14px; margin-top: 6px; }
.rep ul { margin: 0; padding-left: 18px; }
.rep table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.rep th, .rep td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.rep th { font-weight: 500; color: var(--muted); }
.rep-wide { overflow-x: auto; }
.rep-wide td, .rep-wide th { white-space: nowrap; }
.rep-note { color: var(--muted); font-size: 12px; }
@media print {
  @page { margin: 14mm; }
  html, body { background: #fff !important; color: #000 !important; padding: 0 !important; }
  .stage { display: none !important; }
  #print[hidden] { display: block !important; }
  .print { --line: #999; --muted: #333; color: #000; font-size: 10.5pt; }
  .print .rep { font-size: 10.5pt; }
  .print h1 { font-size: 16pt; } .print h2 { font-size: 12pt; margin-top: 10px; }
  .print table { page-break-inside: auto; } .print tr { page-break-inside: avoid; }
  .print .rep-wide td, .print .rep-wide th { white-space: normal; }
}

/* Potvrdzovacie okno */
.modal { position: absolute; inset: 0; z-index: 8; background: var(--scrim); display: grid; place-items: center; padding: 20px; }
.modal-card { background: var(--dusk); border: 1px solid var(--line); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 340px; box-shadow: 0 20px 60px -20px #000a; }
.modal-card h3 { font-size: 20px; }
.modal-card .row .btn { flex: 1; }

.toast { position: absolute; left: 16px; right: 16px; bottom: 84px; background: var(--fg); color: var(--night); border-radius: 14px; padding: 12px 14px; font-size: 14px; font-weight: 500; z-index: 9; box-shadow: 0 10px 30px -10px #000a; }

/* Mobil a nainštalovaná appka: bez rámu telefónu, na celú obrazovku */
@media (max-width: 520px), (display-mode: standalone) {
  html, body { height: 100%; }
  body { padding: 0; overflow: hidden; }
  .stage { display: block; max-width: none; height: 100%; }
  .phone { width: 100%; height: 100%; min-height: 0; max-height: none; border: 0; border-radius: 0; box-shadow: none; }
  .appbar { padding-top: calc(env(safe-area-inset-top, 0px) + 10px); padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }
  .scroll { padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
  .sheet-top { padding-top: calc(env(safe-area-inset-top, 0px) + 14px); }
  .tabbar { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); }
  .toast { bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); }
}
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: up .22s ease-out; }
  .modal-card { animation: up .18s ease-out; }
  @keyframes up { from { transform: translateY(24px); opacity: .6; } }
}
</style>
</head>
<body>

<div class="stage">
  <div class="phone" id="phone">
    <header class="appbar">
      <button class="icon-btn" data-act="settings" type="button" aria-label="Nastavenia" title="Nastavenia">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <div class="brand">Blood <span>Pressure</span></div>
      <button class="icon-btn acc" data-act="add" type="button" aria-label="Nové meranie" title="Nové meranie">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </header>
    <main class="scroll" id="view"></main>
    <nav class="tabbar" id="tabbar">
      <button class="tab" data-tab="today" type="button"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Dnes</button>
      <button class="tab" data-tab="hist" type="button"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>Záznamy</button>
      <button class="tab" data-tab="stats" type="button"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>Prehľad</button>
      <button class="tab" data-tab="week" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>7 dní</button>
    </nav>
    <div id="sheet" class="sheet" hidden></div>
    <div id="modal" class="modal" hidden></div>
    <div id="toast" class="toast" hidden role="status"></div>
  </div>
</div>

<div id="print" class="print" hidden aria-hidden="true"></div>

<script>
(function () {
  "use strict";

  // ---------- Číselníky ----------
  // Kategórie jedného merania podľa ESH 2023 (hranice „menej ako“). Rozhoduje horšia z dvoch hodnôt.
  const CATS = [
    { k: "opt",  s: 120, d: 80,  label: "Optimálny",       long: "Optimálny tlak",                 desc: "Optimálna hodnota." },
    { k: "norm", s: 130, d: 85,  label: "Normálny",        long: "Normálny tlak",                  desc: "Normálna hodnota." },
    { k: "hn",   s: 140, d: 90,  label: "Vysoký normálny", long: "Vysoký normálny tlak",           desc: "Vysoká normálna hodnota. Oplatí sa sledovať priemer viacerých meraní." },
    { k: "g1",   s: 160, d: 100, label: "1. stupeň",       long: "Hypertenzia 1. stupňa",          desc: "Hodnota v pásme hypertenzie 1. stupňa. Rozhoduje priemer viacerých meraní, nie jedno meranie." },
    { k: "g2",   s: 180, d: 110, label: "2. stupeň",       long: "Hypertenzia 2. stupňa",          desc: "Hodnota v pásme hypertenzie 2. stupňa. Ak sa opakuje, poraď sa s lekárom." },
    { k: "g3",   s: 1e9, d: 1e9, label: "3. stupeň",       long: "Hypertenzia 3. stupňa",          desc: "Veľmi vysoká hodnota." }
  ];
  const LOW = { k: "low", label: "Nízky", long: "Nízky tlak", desc: "Nízka hodnota. Ak sa ti točí hlava alebo sa cítiš slabo, posaď sa alebo si ľahni a povedz o tom lekárovi." };
  const TAGS = [
    { k: "meds",    name: "Po liekoch",           icon: "💊" },
    { k: "noMeds",  name: "Pred liekmi",          icon: "⏰" },
    { k: "coffee",  name: "Káva / cigareta",      icon: "☕" },
    { k: "sport",   name: "Po pohybe",            icon: "🏃" },
    { k: "stress",  name: "Stres",                icon: "😣" },
    { k: "badSleep",name: "Zle som spal(a)",      icon: "😴" },
    { k: "alcohol", name: "Alkohol včera",        icon: "🍷" },
    { k: "headache",name: "Bolesť hlavy",         icon: "🤕" },
    { k: "dizzy",   name: "Závrat",               icon: "💫" }
  ];
  const TMAP = Object.fromEntries(TAGS.map(t => [t.k, t]));
  const ARMS = [["L", "Ľavá"], ["R", "Pravá"]];
  const POS = [["sit", "Sediac"], ["lie", "Ležiac"], ["stand", "Postojačky"]];
  const ARM_L = Object.fromEntries(ARMS), POS_L = Object.fromEntries(POS);
  const WEEK_DAYS = 7;       // dĺžka domáceho merania podľa ESH
  const DAYS = ["nedeľa", "pondelok", "utorok", "streda", "štvrtok", "piatok", "sobota"];
  const MONTHS = ["januára", "februára", "marca", "apríla", "mája", "júna", "júla", "augusta", "septembra", "októbra", "novembra", "decembra"];

  // ---------- Pomocné funkcie ----------
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const mean = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const toD = s => new Date(s + "T12:00:00");
  const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const today = () => iso(new Date());
  const nowHm = () => { const d = new Date(); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); };
  const addDays = (s, n) => { const d = toD(s); d.setDate(d.getDate() + n); return iso(d); };
  const daysBetween = (a, b) => Math.round((toD(b) - toD(a)) / 864e5);
  const short = s => { const d = toD(s); return d.getDate() + ". " + (d.getMonth() + 1) + "."; };
  const long = s => { const d = toD(s); const w = DAYS[d.getDay()]; return w.charAt(0).toUpperCase() + w.slice(1) + " " + d.getDate() + ". " + MONTHS[d.getMonth()]; };
  const fullDate = s => toD(s).toLocaleDateString("sk-SK");
  const hmMin = s => { const m = /^(\d{1,2}):(\d{2})$/.exec(String(s || "")); return m && +m[1] < 24 && +m[2] < 60 ? +m[1] * 60 + +m[2] : null; };
  const word = (n, one, few, many) => n === 1 ? one : (n >= 2 && n <= 4 ? few : many);
  const readingsWord = n => word(n, "meranie", "merania", "meraní");
  const isDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(toD(s)) && iso(toD(s)) === s;

  // ---------- Stav ----------
  // D = dáta, ktoré zadal používateľ. SET = nastavenia. UI = stav obrazovky (neukladá sa).
  const DATA_KEY = "bloodPressure.data.v1";
  const SET_KEY = "bloodPressure.settings.v1";
  const emptyData = () => ({
    readings: [],   // merania: { id, date, time, sys, dia, pulse, arm, pos, tags: {k: true}, note }
    week: null,     // bežiace 7-dňové meranie: { start }
    weeks: []       // uzavreté 7-dňové merania: { start, end, sys, dia, pulse, n }
  });
  let D = emptyData();
  let SET = { theme: "dark", name: "", goalSys: 135, goalDia: 85, arm: "L", installDismissed: false,
    lastBackup: null, backupSnooze: null };   // dátum poslednej stiahnutej zálohy a odloženia pripomienky
  const UI = { tab: "today", period: 30, histN: 40, f: null, lastId: null, repDays: 30 };

  // Meranie z neznámeho zdroja (záloha, poškodené úložisko) prepustíme len so správnymi hodnotami.
  function cleanReading(r) {
    if (!r || typeof r !== "object") return null;
    const sys = Number(r.sys), dia = Number(r.dia), pulse = r.pulse == null || r.pulse === "" ? null : Number(r.pulse);
    if (!isDate(r.date) || hmMin(r.time) === null) return null;
    if (!Number.isInteger(sys) || !Number.isInteger(dia) || sys < 60 || sys > 300 || dia < 30 || dia > 200 || dia >= sys) return null;
    if (pulse !== null && (!Number.isInteger(pulse) || pulse < 25 || pulse > 250)) return null;
    const tags = {};
    if (r.tags && typeof r.tags === "object") Object.keys(r.tags).forEach(k => { if (TMAP[k] && r.tags[k]) tags[k] = true; });
    return {
      id: /^r[a-z0-9]{1,24}$/.test(r.id) ? r.id : newId(),
      date: r.date, time: fmtHm(hmMin(r.time)), sys, dia, pulse,
      arm: ARM_L[r.arm] ? r.arm : null, pos: POS_L[r.pos] ? r.pos : "sit", tags,
      note: cleanNote(r.note)
    };
  }
  const fmtHm = m => String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
  const cleanNote = v => String(v == null ? "" : v).replace(/[<>`\\]/g, "").replace(/\s+/g, " ").trim().slice(0, 120);
  let idSeq = 0;
  const newId = () => "r" + Date.now().toString(36) + (idSeq++).toString(36);
  const byTime = (a, b) => (a.date + a.time) < (b.date + b.time) ? -1 : (a.date + a.time) > (b.date + b.time) ? 1 : 0;
  function tidy(d) {
    const out = emptyData();
    const ids = new Set();
    (Array.isArray(d.readings) ? d.readings : []).forEach(r => {
      const c = cleanReading(r);
      if (!c) return;
      while (ids.has(c.id)) c.id = newId();
      ids.add(c.id); out.readings.push(c);
    });
    out.readings.sort(byTime);
    if (d.week && isDate(d.week.start)) out.week = { start: d.week.start };
    if (Array.isArray(d.weeks)) out.weeks = d.weeks.filter(w => w && isDate(w.start) && isDate(w.end) && Number.isFinite(w.sys) && Number.isFinite(w.dia))
      .map(w => ({ start: w.start, end: w.end, sys: Math.round(w.sys), dia: Math.round(w.dia), pulse: Number.isFinite(w.pulse) ? Math.round(w.pulse) : null, n: Number.isInteger(w.n) ? w.n : 0 }));
    return out;
  }

  function save() {
    try { localStorage.setItem(DATA_KEY, JSON.stringify(D)); } catch (e) { /* bez úložiska appka beží len do zatvorenia */ }
  }
  function saveSet() {
    try { localStorage.setItem(SET_KEY, JSON.stringify(SET)); } catch (e) { /* nastavenie sa len nezapamätá */ }
  }
  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(DATA_KEY));
      if (d && Array.isArray(d.readings)) D = tidy(d);
    } catch (e) { /* poškodené dáta ignorujeme */ }
    try {
      const s = JSON.parse(localStorage.getItem(SET_KEY));
      if (s && typeof s === "object") SET = Object.assign(SET, s);
    } catch (e) { /* predvolené nastavenia */ }
    if (!goalOk(SET.goalSys, SET.goalDia)) { SET.goalSys = 135; SET.goalDia = 85; }
  }
  const goalOk = (s, d) => Number.isInteger(s) && Number.isInteger(d) && s >= 100 && s <= 180 && d >= 60 && d <= 110 && d < s;

  // ---------- Vzhľad ----------
  const lightQuery = matchMedia("(prefers-color-scheme: light)");
  function applyTheme() {
    document.documentElement.setAttribute("data-theme", SET.theme);
    const light = SET.theme === "light" || (SET.theme === "system" && lightQuery.matches);
    $("#theme-color").setAttribute("content", light ? "#f3f5fa" : "#141a2d");
  }
  lightQuery.addEventListener("change", applyTheme);

  // ---------- Výpočty ----------
  function cat(sys, dia) {
    const i = Math.max(CATS.findIndex(c => sys < c.s), CATS.findIndex(c => dia < c.d));
    if (i <= 1 && (sys < 90 || dia < 60)) return LOW;
    return CATS[i];
  }
  const isCrisis = r => r.sys >= 180 || r.dia >= 110;
  const partOf = r => hmMin(r.time) < 12 * 60 ? "am" : "pm";
  const inRange = (from, to) => D.readings.filter(r => r.date >= from && r.date <= to);
  function avgOf(list) {
    const p = list.filter(r => r.pulse != null).map(r => r.pulse);
    return { n: list.length, sys: Math.round(mean(list.map(r => r.sys))), dia: Math.round(mean(list.map(r => r.dia))), pulse: p.length ? Math.round(mean(p)) : null };
  }
  const overGoal = a => a.sys >= SET.goalSys || a.dia >= SET.goalDia;
  const goalText = () => SET.goalSys + "/" + SET.goalDia;
  function goalSentence(a) {
    return overGoal(a)
      ? '<p class="small"><span class="t-bad">Priemer je na hranici ' + goalText() + " alebo nad ňou.</span> Ak to tak zostane, ukáž výsledky lekárovi.</p>"
      : '<p class="small"><span class="t-good">Priemer je pod hranicou ' + goalText() + ".</span></p>";
  }

  // ---------- Kúsky obrazoviek ----------
  function greeting() {
    const h = new Date().getHours();
    const g = h < 11 ? "Dobré ráno" : h < 18 ? "Dobrý deň" : "Dobrý večer";
    return g + (SET.name ? ", " + esc(SET.name) : "");
  }
  function stat(v, l) { return '<div class="stat"><b>' + v + "</b><span>" + l + "</span></div>"; }
  function pill(c) { return '<span class="pill k-' + c.k + '">' + c.label + "</span>"; }
  function bpBig(sys, dia, pulse, cls) {
    return '<div class="bp' + (cls ? " " + cls : "") + '"><b>' + sys + '</b><span class="sl">/</span><b>' + dia + "</b><small>mmHg</small></div>" +
      (pulse != null ? '<span class="small muted">pulz ' + pulse + " /min</span>" : "");
  }
  const when = r => (r.date === today() ? "dnes" : r.date === addDays(today(), -1) ? "včera" : short(r.date)) + " " + r.time;
  const tagIcons = r => TAGS.filter(t => r.tags[t.k]).map(t => '<span title="' + t.name + '">' + t.icon + "</span>").join(" ");
  function crisisCard() {
    return '<div class="card warn" role="alert"><h3>Veľmi vysoký tlak</h3><p class="small">Posaď sa, 5 minút oddychuj a zmeraj znova. ' +
      "Ak je tlak stále taký vysoký, zavolaj lekárovi. Ak máš bolesť na hrudi, dýchavičnosť, poruchu reči alebo videnia, slabosť ruky či nohy alebo silnú bolesť hlavy, volaj hneď <b>112</b>.</p></div>";
  }
  function howCard() {
    return '<div class="card"><div class="eyebrow">Ako merať správne</div><ul class="small plain">' +
      "<li>30 minút pred meraním bez kávy, cigarety a cvičenia.</li>" +
      "<li>Sadni si, opri si chrbát, nohy nechaj vedľa seba a 5 minút oddychuj.</li>" +
      "<li>Manžeta na holej ruke, ruka položená na stole vo výške srdca.</li>" +
      "<li>Počas merania nehovor. Zmeraj 2× s odstupom 1 minúty a zapíš obe hodnoty.</li></ul></div>";
  }

  // ---------- Graf ----------
  // Každé meranie je zvislá palička od diastolického po systolický tlak, farba podľa kategórie.
  function stickChart(list, from, to) {
    const W = 340, H = 160, pl = 30, pr = 6, pt = 8, pb = 20, ih = H - pt - pb, iw = W - pl - pr;
    const days = daysBetween(from, to) + 1;
    const lo = Math.min(50, Math.floor((Math.min(...list.map(r => r.dia)) - 5) / 10) * 10);
    const hi = Math.max(180, Math.ceil((Math.max(...list.map(r => r.sys)) + 5) / 20) * 20);
    const y = v => pt + ih - (v - lo) / (hi - lo) * ih;
    const x = r => pl + (daysBetween(from, r.date) + (hmMin(r.time) / 1440)) / days * iw;
    let s = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Krvný tlak od ' + short(from) + " do " + short(to) + '">';
    for (let t = Math.ceil(lo / 40) * 40; t <= hi; t += 40) {
      s += '<line class="grid" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(t).toFixed(1) + '" y2="' + y(t).toFixed(1) + '"/>';
      s += '<text x="' + (pl - 5) + '" y="' + (y(t) + 3).toFixed(1) + '" text-anchor="end">' + t + "</text>";
    }
    [SET.goalSys, SET.goalDia].forEach(g => {
      s += '<line class="goal" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(g).toFixed(1) + '" y2="' + y(g).toFixed(1) + '"/>';
    });
    const sw = clamp(iw / Math.max(list.length, 1) * 0.5, 1.6, 4);
    list.forEach(r => {
      const c = cat(r.sys, r.dia), cx = x(r).toFixed(1);
      s += '<line class="stick k-' + c.k + '" style="stroke-width:' + sw.toFixed(1) + '" x1="' + cx + '" x2="' + cx + '" y1="' + y(r.sys).toFixed(1) + '" y2="' + y(r.dia).toFixed(1) + '"><title>' +
        short(r.date) + " " + r.time + ": " + r.sys + "/" + r.dia + "</title></line>";
    });
    s += '<text x="' + pl + '" y="' + (H - 4) + '">' + short(from) + "</text>";
    s += '<text x="' + (W - pr) + '" y="' + (H - 4) + '" text-anchor="end">' + short(to) + "</text>";
    return '<div class="chart">' + s + "</svg></div>";
  }
  function pulseChart(list, from, to) {
    const P = list.filter(r => r.pulse != null);
    const W = 340, H = 90, pl = 30, pr = 6, pt = 8, pb = 18, ih = H - pt - pb, iw = W - pl - pr;
    const days = daysBetween(from, to) + 1;
    const lo = Math.min(50, Math.floor(Math.min(...P.map(r => r.pulse)) / 10) * 10), hi = Math.max(100, Math.ceil(Math.max(...P.map(r => r.pulse)) / 10) * 10);
    const y = v => pt + ih - (v - lo) / (hi - lo) * ih;
    const x = r => pl + (daysBetween(from, r.date) + (hmMin(r.time) / 1440)) / days * iw;
    let s = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Pulz">';
    [lo, hi].forEach(t => {
      s += '<line class="grid" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(t) + '" y2="' + y(t) + '"/><text x="' + (pl - 5) + '" y="' + (y(t) + 3) + '" text-anchor="end">' + t + "</text>";
    });
    s += '<polyline class="pl" points="' + P.map(r => x(r).toFixed(1) + "," + y(r.pulse).toFixed(1)).join(" ") + '"/>';
    P.forEach(r => { s += '<circle class="pd" r="2.2" cx="' + x(r).toFixed(1) + '" cy="' + y(r.pulse).toFixed(1) + '"><title>' + short(r.date) + " " + r.time + ": " + r.pulse + " /min</title></circle>"; });
    return '<div class="chart">' + s + "</svg></div>";
  }

  // ---------- Obrazovka Dnes ----------
  function viewToday() {
    const t = today(), R = D.readings;
    let h = '<div class="head"><div class="eyebrow">' + long(t) + "</div><h2>" + greeting() + "</h2></div>";
    h += installCard();
    h += backupCard();
    const last = R[R.length - 1];
    if (last && last.date === t && isCrisis(last)) h += crisisCard();

    const part = new Date().getHours() < 12 ? "am" : "pm";
    const doneNow = R.some(r => r.date === t && partOf(r) === part);
    if (D.week) h += weekTodayCard();
    else if (!doneNow) {
      h += '<div class="card lamp"><div class="eyebrow">' + (part === "am" ? "Ranné meranie" : "Večerné meranie") + "</div><h3>Zmeraj si tlak</h3>" +
        '<p class="small">' + (part === "am" ? "Ráno pred raňajkami a pred liekmi." : "Večer pred večerou.") + " Sadni si, 5 minút oddychuj a zmeraj 2× s odstupom 1 minúty.</p>" +
        '<button class="btn dark" data-act="add" type="button">Zapísať meranie</button></div>';
    }

    if (!R.length) {
      h += '<div class="card"><div class="eyebrow">Ako to funguje</div><ol class="steps">' +
        "<li>Zmeraj si tlak ráno aj večer a zapíš hodnoty.</li>" +
        "<li>Appka ukáže kategóriu merania a priemer za posledné dni.</li>" +
        "<li>Pred návštevou lekára sprav 7-dňové domáce meranie.</li>" +
        "<li>Lekárovi ukážeš prehľad alebo ho vytlačíš do PDF.</li></ol>" +
        '<p class="small muted">Všetko sa ukladá len v tomto zariadení.</p><button class="link" data-act="privacy" type="button">Ochrana súkromia →</button></div>';
      h += howCard();
      return h;
    }

    const c = cat(last.sys, last.dia);
    h += '<div class="card"><div class="row"><div class="eyebrow">Posledné meranie · ' + when(last) + "</div>" + pill(c) + "</div>" +
      '<div class="bp-line">' + bpBig(last.sys, last.dia, last.pulse) + "</div>" +
      (tagIcons(last) ? '<p class="small">' + tagIcons(last) + "</p>" : "") +
      '<button class="link" data-goto="hist" type="button">Všetky záznamy →</button></div>';

    const from = addDays(t, -6), week = inRange(from, t);
    if (week.length >= 2) {
      const a = avgOf(week), am = avgOf(week.filter(r => partOf(r) === "am")), pm = avgOf(week.filter(r => partOf(r) === "pm"));
      h += '<div class="card"><div class="row"><div class="eyebrow">Priemer 7 dní</div><span class="small muted">' + a.n + " " + readingsWord(a.n) + "</span></div>" +
        '<div class="stats">' + stat(a.sys + "/" + a.dia, "priemer") + stat(am.n ? am.sys + "/" + am.dia : "–", "ráno") + stat(pm.n ? pm.sys + "/" + pm.dia : "–", "večer") + stat(a.pulse != null ? a.pulse : "–", "pulz") + "</div>" +
        goalSentence(a) + stickChart(week, from, t) +
        '<button class="link" data-goto="stats" type="button">Celý prehľad →</button></div>';
    }
    return h;
  }

  // ---------- Záznamy ----------
  function viewHist() {
    const R = D.readings;
    let h = '<div class="head"><div class="eyebrow">' + R.length + " " + readingsWord(R.length) + "</div><h2>Záznamy</h2></div>";
    h += '<button class="btn" data-act="add" type="button">Pridať meranie</button>';
    if (!R.length) return h + '<div class="card"><p class="small muted">Zatiaľ žiadne merania. Prvé pribudne po ťuknutí na „Pridať meranie“.</p></div>';
    const shown = R.slice(-UI.histN).reverse();
    const byDate = [];
    shown.forEach(r => { const g = byDate[byDate.length - 1]; if (g && g.date === r.date) g.list.push(r); else byDate.push({ date: r.date, list: [r] }); });
    byDate.forEach(g => {
      const a = avgOf(g.list);
      h += '<div class="card"><div class="row"><div class="eyebrow">' + long(g.date) + "</div>" + (g.list.length > 1 ? '<span class="small muted">Ø ' + a.sys + "/" + a.dia + "</span>" : "") + "</div><div>";
      g.list.forEach(r => {
        const c = cat(r.sys, r.dia);
        h += '<button class="rd" type="button" data-act="open" data-id="' + r.id + '"><span class="muted">' + r.time + "</span>" +
          '<span><span class="v">' + r.sys + "/" + r.dia + "</span>" + (r.pulse != null ? ' <span class="small muted">· ' + r.pulse + " /min</span>" : "") +
          ((tagIcons(r) || r.note) ? '<span class="sub">' + tagIcons(r) + (r.note ? " " + esc(r.note) : "") + "</span>" : "") + "</span>" +
          '<span class="k k-' + c.k + '"><i class="dot"></i></span></button>';
      });
      h += "</div></div>";
    });
    if (R.length > UI.histN) h += '<button class="btn ghost" data-act="more" type="button">Zobraziť staršie</button>';
    return h;
  }

  // ---------- Prehľad ----------
  function viewStats() {
    const t = today(), days = UI.period, from = addDays(t, -days + 1);
    const list = inRange(from, t);
    let h = '<div class="head"><div class="eyebrow">Prehľad · ' + days + " dní</div><h2>Ako sa ti darí?</h2></div>";
    h += '<div class="seg" role="group" aria-label="Obdobie" style="--n:3">' + [7, 30, 90].map(d => '<button type="button" data-period="' + d + '" aria-pressed="' + (d === days) + '">' + d + " dní</button>").join("") + "</div>";
    if (list.length < 2) {
      h += '<div class="card"><h3>Zatiaľ málo meraní</h3><p class="small muted">Na prehľad potrebujem aspoň 2 merania za ' + days + " dní. Teraz " + (list.length === 1 ? "je 1." : "nie je žiadne.") + "</p></div>";
      return h + disclaimer();
    }
    const a = avgOf(list), over = list.filter(r => r.sys >= SET.goalSys || r.dia >= SET.goalDia).length;
    const sysV = list.map(r => r.sys), diaV = list.map(r => r.dia);
    h += '<div class="card"><div class="row"><div class="eyebrow">Priemer · ' + a.n + " " + readingsWord(a.n) + "</div>" + pill(cat(a.sys, a.dia)) + "</div>" +
      '<div class="bp-line">' + bpBig(a.sys, a.dia, a.pulse) + "</div>" + goalSentence(a) +
      '<div class="stats s3">' + stat(Math.min(...sysV) + "–" + Math.max(...sysV), "horný min–max") + stat(Math.min(...diaV) + "–" + Math.max(...diaV), "dolný min–max") +
      stat(Math.round(over / list.length * 100) + " %", "nad hranicou") + "</div></div>";

    h += '<div class="card"><div class="eyebrow">Meranie po meraní</div>' + stickChart(list, from, t) +
      '<div class="legend"><span><i style="background:var(--c-opt)"></i>v norme</span><span><i style="background:var(--c-hn)"></i>vysoký normálny</span><span><i style="background:var(--c-g2)"></i>hypertenzia</span><span><i style="background:none;border-top:2px dashed var(--lamp);border-radius:0;height:0"></i>hranica ' + goalText() + "</span></div></div>";

    const am = avgOf(list.filter(r => partOf(r) === "am")), pm = avgOf(list.filter(r => partOf(r) === "pm"));
    if (am.n && pm.n) {
      const row = (l, v, n, max, muted) => '<div class="cmp-row"><span' + (muted ? ' class="muted"' : "") + ">" + l + '</span><span class="track ' + (muted ? "t-few" : "t-lamp") + '"><i style="width:' + clamp(v / max * 100, 0, 100) + '%"></i></span><b' + (muted ? ' class="muted"' : "") + ">" + v + "</b></div>";
      h += '<div class="card"><div class="eyebrow">Ráno a večer</div>' +
        '<div class="cmp"><span class="small muted">Systolický (mmHg)</span>' + row("Ráno (" + am.n + ")", am.sys, am.n, 200) + row("Večer (" + pm.n + ")", pm.sys, pm.n, 200, true) + "</div>" +
        '<div class="cmp"><span class="small muted">Diastolický (mmHg)</span>' + row("Ráno", am.dia, am.n, 130) + row("Večer", pm.dia, pm.n, 130, true) + "</div>" +
        '<p class="small muted">' + (Math.abs(am.sys - pm.sys) >= 10 ? "Ráno a večer sa líšia o " + Math.abs(am.sys - pm.sys) + " mmHg. Povedz o tom lekárovi, môže to súvisieť s časom užívania liekov." : "Ráno a večer sú podobné.") + "</p></div>";
    }

    const counts = CATS.concat(LOW).map(c => ({ c, n: list.filter(r => cat(r.sys, r.dia).k === c.k).length })).filter(x => x.n);
    h += '<div class="card"><div class="eyebrow">Podľa kategórie</div><div class="cmp">' +
      counts.map(x => '<div class="cmp-row"><span class="k-' + x.c.k + '">' + x.c.label + '</span><span class="track k-' + x.c.k + '"><i style="width:' + (x.n / list.length * 100) + '%"></i></span><b>' + x.n + "×</b></div>").join("") +
      '</div><p class="small muted">Kategórie jedného merania podľa Európskej spoločnosti pre hypertenziu (ESH 2023).</p></div>';

    // Okolnosti: priemer meraní s označením a bez neho (aspoň 2 a 2)
    const tagRows = TAGS.map(T => {
      const w = list.filter(r => r.tags[T.k]), wo = list.filter(r => !r.tags[T.k]);
      if (w.length < 2 || wo.length < 2) return "";
      const A = avgOf(w), B = avgOf(wo), diff = A.sys - B.sys;
      return "<p class=\"small\">" + T.icon + " <b>" + T.name + "</b>: " + A.sys + "/" + A.dia + " (" + w.length + "×), bez toho " + B.sys + "/" + B.dia +
        (Math.abs(diff) >= 5 ? ' <span class="' + (diff > 0 ? "t-bad" : "t-good") + '">· ' + (diff > 0 ? "+" : "−") + Math.abs(diff) + " mmHg</span>" : "") + "</p>";
    }).join("");
    if (tagRows) h += '<div class="card"><div class="eyebrow">Okolnosti merania</div>' + tagRows + '<p class="small muted">Porovnanie je len orientačné, súvislosť ešte nie je príčina.</p></div>';

    if (list.filter(r => r.pulse != null).length >= 2) h += '<div class="card"><div class="row"><div class="eyebrow">Pulz</div><span class="small muted">Ø ' + a.pulse + " /min</span></div>" + pulseChart(list, from, t) + "</div>";
    h += '<button class="btn ghost" data-act="report" type="button">Prehľad pre lekára</button>';
    return h + disclaimer();
  }
  const disclaimer = () => '<p class="small muted">Blood Pressure nie je zdravotnícka pomôcka a nenahrádza lekára. O liečbe a cieľových hodnotách rozhoduje lekár.</p>';

  // ---------- 7-dňové meranie ----------
  // Podľa ESH: 7 dní ráno aj večer po 2 merania, prvý deň sa do priemeru nepočíta.
  const weekEnd = () => addDays(D.week.start, WEEK_DAYS - 1);
  function dayState(d) {
    const l = D.readings.filter(r => r.date === d);
    return { am: l.filter(r => partOf(r) === "am").length, pm: l.filter(r => partOf(r) === "pm").length };
  }
  function weekGrid() {
    const t = today();
    let h = '<div class="days">';
    for (let i = 0; i < WEEK_DAYS; i++) {
      const d = addDays(D.week.start, i), st = dayState(d);
      const cls = (st.am && st.pm ? "done" : st.am || st.pm ? "half" : "") + (d === t ? " now" : "") + (i === 0 ? " skip" : "");
      h += '<div class="day ' + cls + '" title="' + short(d) + (i === 0 ? " – do priemeru sa nepočíta" : "") + ": ráno " + st.am + "×, večer " + st.pm + '×">' + (i + 1) + "</div>";
    }
    return h + "</div>";
  }
  function weekTodayCard() {
    const t = today(), n = daysBetween(D.week.start, t) + 1, st = dayState(t);
    const part = new Date().getHours() < 12 ? "am" : "pm";
    const need = part === "am" ? st.am < 2 : st.pm < 2;
    return '<div class="card lamp"><div class="row"><div class="eyebrow">7-dňové meranie</div><span class="small">deň ' + Math.min(n, WEEK_DAYS) + " z " + WEEK_DAYS + "</span></div>" +
      "<h3>" + (need ? (part === "am" ? "Ranné meranie" : "Večerné meranie") + " – 2× s odstupom 1 min" : "Na teraz je hotovo") + "</h3>" +
      weekGrid() + '<p class="small">Dnes: ráno ' + st.am + "/2, večer " + st.pm + "/2.</p>" +
      (need ? '<button class="btn dark" data-act="add" type="button">Zapísať meranie</button>' : "") +
      '<button class="link" data-goto="week" type="button">Priebeh merania →</button></div>';
  }
  function canConclude() {
    if (!D.week) return false;
    const end = weekEnd();
    return today() > end || (today() === end && dayState(end).pm > 0);
  }
  function concludeWeek() {
    const start = D.week.start, end = weekEnd();
    const list = inRange(addDays(start, 1), end);   // prvý deň sa vynecháva
    D.week = null;
    if (!list.length) { save(); return null; }
    const a = avgOf(list);
    const res = { start, end, sys: a.sys, dia: a.dia, pulse: a.pulse, n: a.n };
    D.weeks.unshift(res);
    D.weeks = D.weeks.slice(0, 20);
    save();
    return res;
  }
  function weekResultHtml(w) {
    const over = w.sys >= SET.goalSys || w.dia >= SET.goalDia;
    return '<div class="wk-item"><div><b>' + fullDate(w.start) + " – " + fullDate(w.end) + '</b><div class="small muted">' + w.n + " " + readingsWord(w.n) + (w.pulse != null ? " · pulz " + w.pulse + " /min" : "") +
      (w.n < 12 ? " · menej ako 12 meraní, výsledok je menej presný" : "") + "</div></div>" +
      '<div style="text-align:right"><div class="v" style="font-family:var(--f-display);font-weight:700;font-size:20px">' + w.sys + "/" + w.dia + '</div><span class="pill ' + (over ? "t-bad" : "t-good") + '">' + (over ? "Nad hranicou" : "Pod hranicou") + "</span></div></div>";
  }
  function viewWeek() {
    let h = '<div class="head"><div class="eyebrow">Domáce meranie</div><h2>7 dní pre lekára</h2></div>';
    if (D.week) {
      const n = daysBetween(D.week.start, today()) + 1;
      h += '<div class="card lamp"><div class="row"><div class="eyebrow">Beží od ' + short(D.week.start) + '</div><span class="small">deň ' + Math.min(n, WEEK_DAYS) + " z " + WEEK_DAYS + "</span></div>" +
        "<h3>Ráno aj večer 2 merania</h3>" + weekGrid() +
        '<p class="small">Plný štvorček = ráno aj večer, polovica = len jedno z nich. Prvý deň je na zácvik a do priemeru sa nepočíta.</p>' +
        '<button class="btn dark" data-act="add" type="button">Zapísať meranie</button>' +
        (canConclude() ? '<button class="btn ghost" data-act="concludeWeek" type="button">Vyhodnotiť</button>' : "") +
        '<button class="link" data-act="cancelWeek" type="button">Zrušiť 7-dňové meranie</button></div>';
      const sofar = inRange(addDays(D.week.start, 1), today());
      if (sofar.length >= 2) {
        const a = avgOf(sofar);
        h += '<div class="card"><div class="eyebrow">Priebežný priemer · ' + a.n + " " + readingsWord(a.n) + "</div>" + bpBig(a.sys, a.dia, a.pulse) + "</div>";
      }
    } else {
      h += '<div class="card"><h3>Ako to prebieha</h3><ol class="steps">' +
        "<li>7 dní za sebou meraj ráno (pred liekmi a raňajkami) aj večer (pred večerou).</li>" +
        "<li>Zakaždým zmeraj 2× s odstupom 1 minúty a zapíš obe hodnoty.</li>" +
        "<li>Prvý deň sa do výsledku nepočíta.</li>" +
        "<li>Na konci dostaneš priemer, ktorý ukážeš lekárovi.</li></ol>" +
        '<p class="small muted">Priemer domácich meraní ' + goalText() + " a viac sa považuje za zvýšený (hranicu si môžeš zmeniť v nastaveniach podľa pokynov lekára).</p>" +
        '<button class="btn" data-act="startWeek" type="button">Začať 7-dňové meranie</button></div>';
      h += howCard();
    }
    if (D.weeks.length) h += '<div class="card"><div class="eyebrow">Výsledky</div>' + D.weeks.map(weekResultHtml).join("") + "</div>";
    return h + disclaimer();
  }

  // ---------- Formulár merania ----------
  function sheetTop(label, closeIcon) {
    return '<div class="sheet-top"><button class="icon-btn" data-act="close" type="button" aria-label="' + (closeIcon === "×" ? "Zavrieť" : "Späť") + '">' + (closeIcon || "←") + '</button><span class="eyebrow">' + label + '</span><span style="width:38px"></span></div>';
  }
  function openForm(r, copy) {
    UI.f = r
      ? { id: r.id, sys: String(r.sys), dia: String(r.dia), pulse: r.pulse != null ? String(r.pulse) : "", date: r.date, time: r.time, arm: r.arm, pos: r.pos, tags: Object.assign({}, r.tags), note: r.note, err: null }
      : { id: null, sys: "", dia: "", pulse: "", date: today(), time: nowHm(), arm: copy ? copy.arm : SET.arm, pos: copy ? copy.pos : "sit", tags: copy ? Object.assign({}, copy.tags) : {}, note: "", err: null, second: !!copy };
    renderForm();
  }
  function renderForm() {
    const f = UI.f;
    const seg = (attr, cur, items) => '<div class="seg" role="group" style="--n:' + items.length + '">' +
      items.map(([v, l]) => '<button type="button" ' + attr + '="' + v + '" aria-pressed="' + (cur === v) + '">' + l + "</button>").join("") + "</div>";
    const big = (id, label, val, unit, ph) => '<label for="' + id + '"><span class="eyebrow">' + label + "</span>" +
      '<input id="' + id + '" type="text" inputmode="numeric" autocomplete="off" maxlength="3" placeholder="' + ph + '" value="' + esc(val) + '"' + (f.bad && f.bad.includes(id) ? ' aria-invalid="true"' : "") + '><span class="u">' + unit + "</span></label>";
    let h = sheetTop(f.id ? "Úprava" : "Nové meranie", "×") + '<div class="scroll">';
    h += '<div class="head"><h2>' + (f.id ? "Upraviť meranie" : f.second ? "Druhé meranie" : "Nové meranie") + "</h2>" +
      (f.second ? '<p class="small muted">Po minúte oddychu zmeraj znova. Ruka, poloha a okolnosti zostali z prvého merania.</p>' : "") + "</div>";
    h += '<div class="card"><div class="bp-in">' + big("f-sys", "Horný", f.sys, "SYS mmHg", "120") + big("f-dia", "Dolný", f.dia, "DIA mmHg", "80") + big("f-pulse", "Pulz", f.pulse, "/min", "70") + "</div>" +
      (f.err ? '<p class="small num-err" role="alert">' + f.err + "</p>" : "") + "</div>";
    h += '<div class="card"><div class="num-row"><label class="small" for="f-date">Dátum<input id="f-date" type="date" max="' + today() + '" value="' + esc(f.date) + '"></label>' +
      '<label class="small" for="f-time">Čas<input id="f-time" type="time" value="' + esc(f.time) + '"></label></div>' +
      '<span class="small">Ruka</span>' + seg("data-farm", f.arm, ARMS) + '<span class="small">Poloha</span>' + seg("data-fpos", f.pos, POS) + "</div>";
    h += '<div class="card"><span class="set-label">Okolnosti</span><div class="chips">' +
      TAGS.map(T => '<button type="button" class="chip" data-ftag="' + T.k + '" aria-pressed="' + !!f.tags[T.k] + '"><span aria-hidden="true">' + T.icon + "</span>" + T.name + "</button>").join("") + "</div>" +
      '<label class="small" for="f-note">Poznámka<input id="f-note" type="text" maxlength="120" autocomplete="off" placeholder="Napríklad nový liek, po návšteve lekára" value="' + esc(f.note) + '"></label></div>';
    h += '<button class="btn" data-act="saveForm" type="button">' + (f.id ? "Uložiť zmeny" : "Uložiť meranie") + "</button>";
    if (f.id) h += '<button class="btn danger" data-act="askDelReading" type="button">Vymazať meranie</button>';
    if (!f.id) h += howCard();
    h += "</div>";
    showSheet(h);
  }
  function validate(f) {
    const n = v => /^\d{2,3}$/.test(String(v).trim()) ? Number(String(v).trim()) : null;
    const sys = n(f.sys), dia = n(f.dia), pulse = String(f.pulse).trim() === "" ? null : n(f.pulse);
    const bad = [], msg = [];
    if (sys === null || sys < 60 || sys > 300) { bad.push("f-sys"); msg.push("Horný (systolický) tlak zadaj ako číslo od 60 do 300."); }
    if (dia === null || dia < 30 || dia > 200) { bad.push("f-dia"); msg.push("Dolný (diastolický) tlak zadaj ako číslo od 30 do 200."); }
    if (!bad.length && dia >= sys) { bad.push("f-sys", "f-dia"); msg.push("Horný tlak musí byť vyšší ako dolný. Nie sú prehodené?"); }
    if (String(f.pulse).trim() !== "" && (pulse === null || pulse < 25 || pulse > 250)) { bad.push("f-pulse"); msg.push("Pulz zadaj ako číslo od 25 do 250, alebo ho nechaj prázdny."); }
    if (!isDate(f.date)) msg.push("Zadaj platný dátum.");
    else if (f.date > today()) msg.push("Dátum nemôže byť v budúcnosti.");
    if (hmMin(f.time) === null) msg.push("Zadaj čas v tvare HH:MM.");
    return { bad, msg, sys, dia, pulse };
  }
  function saveForm() {
    const f = UI.f;
    if (!f) return;
    const v = validate(f);
    if (v.msg.length) { f.err = v.msg.join(" "); f.bad = v.bad; renderForm(); return; }
    const r = { id: f.id || newId(), date: f.date, time: fmtHm(hmMin(f.time)), sys: v.sys, dia: v.dia, pulse: v.pulse, arm: f.arm || null, pos: f.pos || "sit", tags: f.tags, note: cleanNote(f.note) };
    D.readings = D.readings.filter(x => x.id !== r.id).concat(r).sort(byTime);
    save();
    UI.lastId = r.id;
    const fixed = !!f.id;
    UI.f = null;
    if (fixed) { closeSheet(); toast("Meranie je upravené."); return; }
    finishSheet(r);
  }
  function finishSheet(r) {
    const c = cat(r.sys, r.dia);
    // merania z toho istého sedenia (do 15 minút) spriemerujeme
    const m = hmMin(r.time);
    const sess = D.readings.filter(x => x.date === r.date && Math.abs(hmMin(x.time) - m) <= 15);
    let extra = "";
    if (sess.length > 1) { const a = avgOf(sess); extra += '<div class="card"><div class="eyebrow">Priemer ' + sess.length + " meraní z tohto sedenia</div>" + bpBig(a.sys, a.dia, a.pulse) + "</div>"; }
    if (D.week) {
      const st = dayState(today());
      extra += '<div class="card"><div class="eyebrow">7-dňové meranie</div><p class="small">Dnes ráno ' + st.am + "/2, večer " + st.pm + "/2.</p></div>";
    }
    let h = sheetTop("Hotovo", "×") + '<div class="q"><div class="eyebrow">Zapísané · ' + short(r.date) + " " + r.time + "</div>" +
      '<div class="bp-line">' + bpBig(r.sys, r.dia, r.pulse, "xl") + "</div>" +
      '<div class="row" style="justify-content:flex-start">' + pill(c) + '<span class="small muted">' + c.long + "</span></div>" +
      '<p class="small">' + c.desc + "</p>" + (isCrisis(r) ? crisisCard() : "") + extra +
      '<button class="btn ghost" data-act="addSecond" type="button">Pridať ďalšie meranie</button>' +
      '<button class="btn" data-act="close" type="button">Hotovo</button></div>';
    showSheet(h);
  }

  // ---------- Nastavenia ----------
  function openSettings() {
    const seg = (attr, cur, items) => '<div class="seg" role="group" style="--n:' + items.length + '">' +
      items.map(([v, l]) => '<button type="button" ' + attr + '="' + v + '" aria-pressed="' + (String(cur) === String(v)) + '">' + l + "</button>").join("") + "</div>";
    let h = sheetTop("Nastavenia") + '<div class="scroll">';
    h += '<div class="head"><h2>Nastavenia</h2></div>';
    h += '<div class="card"><span class="set-label">Vzhľad</span>' + seg("data-theme-set", SET.theme, [["dark", "Tmavý"], ["light", "Svetlý"], ["system", "Podľa systému"]]) + "</div>";
    h += '<div class="card"><label class="set-label" for="set-name">Oslovenie</label><input id="set-name" type="text" maxlength="30" autocomplete="given-name" placeholder="Napríklad Jana" value="' + esc(SET.name) + '"><p class="small muted">Použije sa v pozdrave na obrazovke Dnes.</p></div>';
    h += '<div class="card"><span class="set-label">Hranica pre domáce meranie</span><div class="num-row">' +
      '<label class="small" for="set-gsys">Horný (SYS)<input id="set-gsys" type="text" inputmode="numeric" autocomplete="off" maxlength="3" value="' + SET.goalSys + '"></label>' +
      '<label class="small" for="set-gdia">Dolný (DIA)<input id="set-gdia" type="text" inputmode="numeric" autocomplete="off" maxlength="3" value="' + SET.goalDia + '"></label></div>' +
      '<p class="small num-err" id="err-goal" role="alert" hidden></p>' +
      '<p class="small muted">Podľa ESH je priemer domácich meraní ' + "135/85 a viac zvýšený. Ak ti lekár určil iný cieľ (napríklad 130/80), zadaj ho sem.</p></div>";
    h += '<div class="card"><span class="set-label">Ruka, na ktorej meriaš</span>' + seg("data-armset", SET.arm, ARMS) + '<p class="small muted">Predvolí sa pri novom meraní. Meraj na ruke, kde ti lekár nameral vyšší tlak.</p></div>';
    h += '<div class="card"><span class="set-label">Moje dáta</span><p class="small muted">' + D.readings.length + " " + readingsWord(D.readings.length) + ", " +
      D.weeks.length + " " + word(D.weeks.length, "uzavreté 7-dňové meranie", "uzavreté 7-dňové merania", "uzavretých 7-dňových meraní") +
      ". Všetko je uložené len v tomto zariadení. " + lastBackupText() + "</p>" +
      '<button class="btn ghost" data-act="export" type="button">Stiahnuť zálohu (JSON)</button>' +
      '<button class="btn ghost" data-act="exportCsv" type="button">Stiahnuť tabuľku (CSV)</button>' +
      '<button class="btn ghost" data-act="report" type="button">Prehľad pre lekára</button>' +
      '<button class="btn ghost" data-act="import" type="button">Obnoviť zo zálohy</button>' +
      '<input id="import-file" type="file" accept=".json,application/json" hidden>' +
      '<button class="btn danger" data-act="askReset" type="button">Vymazať všetky dáta</button>' +
      '<button class="link" data-act="privacy" type="button">Ochrana súkromia a licencia →</button></div>';
    h += '<p class="small muted" style="text-align:center">Blood Pressure · nie je zdravotnícka pomôcka</p>';
    h += "</div>";
    const sc = $("#sheet").innerHTML.includes('data-act="askReset"') ? $("#sheet").querySelector(".scroll") : null;
    const keep = sc ? sc.scrollTop : 0;
    showSheet(h, !!sc);
    const sc2 = $("#sheet").querySelector(".scroll");
    if (sc2) sc2.scrollTop = keep;
  }

  // ---------- Súkromie ----------
  function openPrivacy() {
    let h = '<div class="sheet-top"><button class="icon-btn" data-act="settings" type="button" aria-label="Späť">←</button><span class="eyebrow">Súkromie</span><span style="width:38px"></span></div><div class="scroll">';

      "Nič sa neposiela autorovi appky ani tretím stranám: appka nemá analytiku, reklamy ani sledovanie a aj písma má uložené v sebe.</p></div>";
    h += '<div class="card"><h3>Čo sa ukladá</h3><ul class="small plain">' +
      "<li>merania: dátum, čas, horný a dolný tlak, pulz, ruka a poloha,</li>" +

      "Zálohu, tabuľku CSV aj prehľad pre lekára vytvára appka priamo v zariadení – komu ich dáš, rozhoduješ ty.</p></div>";
    h += '<div class="card"><h3>Ako dlho</h3><p class="small">Záznamy zostanú, kým ich nevymažeš. Jedno meranie vymažeš v jeho úprave, všetko naraz v nastaveniach.</p></div>';
    h += '<div class="card"><h3>Tvoje možnosti</h3><p class="small">Kedykoľvek si môžeš stiahnuť zálohu (JSON) alebo tabuľku (CSV), opraviť či vymazať jedno meranie, vymazať všetky dáta v nastaveniach, ' +
      "alebo appku odinštalovať a v prehliadači vymazať údaje stránky.</p></div>";

    h += '<p class="small muted" style="text-align:center">Blood Pressure nie je zdravotnícka pomôcka.</p></div>';
